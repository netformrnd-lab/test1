name: 영업일정 ↔ 아파트스퀘어 동기화

# 실시간 동기화는 이제 즉시(양방향)로 처리됩니다:
#   · POUR→아스퀘: Firebase 함수(onWrite)
#   · 아스퀘→POUR: Supabase pg_net 트리거
# 이 배치는 '보정(누락 방지)'용으로 3시간마다만 한 번 전체를 맞춥니다.
#   · 수동으로 "Run workflow" 버튼으로도 바로 돌릴 수 있음
#
# 준비물 (Repo → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_SERVICE_ROLE_KEY   = Supabase → Project Settings → API → service_role 키
#
# ✅ Firebase 서비스계정 불필요 — RTDB 권한이 열려 있어 주소만으로 접근합니다.

on:
  schedule:
    - cron: '0 * * * *'      # 1시간마다 (보정용 — 실시간은 즉시 처리, 즉시 누락분을 최대 1시간 내 보정)
  workflow_dispatch:           # 수동 실행 버튼

# 이전 실행이 겹치지 않게 (동시에 두 번 돌아 충돌나는 것 방지)
concurrency:
  group: aptsq-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Supabase 라이브러리가 WebSocket 필요 → Node 22+ (native WebSocket)

      - name: 의존성 설치
        working-directory: backend/aptsq-sync
        run: npm install --no-audit --no-fund

      - name: 동기화 1회 실행
        working-directory: backend/aptsq-sync
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync.js --once
