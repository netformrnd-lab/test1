name: Build TEST AAB (내부테스트 전용 · 별도 패키지)

# 내부테스트용 별도 앱(.test 패키지)을 빌드한다.
#  · 운영앱(floral-cherry)과 완전히 분리 — 직원은 운영앱과 테스트앱을 동시에 설치 가능
#  · 서버 URL 을 '테스트 전용 주소'로 바꿔서 빌드 → 수정본을 테스트 주소에만 올려 확인(입주민 영향 0)
#  · 푸시(google-services)는 테스트앱에서 끔(패키지가 달라 Firebase 설정이 안 맞음)
#  · 커밋된 파일은 안 건드림 — CI 안에서만 임시로 바꿔 빌드
#
# 실행: Actions → 이 워크플로우 → Run workflow → test_url 에 새 테스트 주소 입력
#   예) https://aptsq-test-xxxx.pages.dev  (끝에 / 없이)
# 결과: Artifacts 의 apartsquare-TEST-release-aab (.aab) 다운로드 → Play Console 테스트 앱 내부테스트에 업로드

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "테스트 전용 웹 주소 (끝에 / 없이)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm deps
        run: npm install

      - name: 테스트용으로 설정 바꾸기 (CI 안에서만)
        env:
          TEST_URL: ${{ inputs.test_url }}
        run: |
          set -e
          # 1) 서버 URL + 앱 이름 → 테스트용 (capacitor.config.json)
          python3 - "$TEST_URL" <<'PY'
          import json, sys
          url = sys.argv[1].rstrip('/')
          p = 'capacitor.config.json'
          c = json.load(open(p, encoding='utf-8'))
          c.setdefault('server', {})['url'] = url
          c['appName'] = '아파트스퀘어(테스트)'
          json.dump(c, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('capacitor.config.json →', url)
          PY
          # 2) 앱 패키지 ID 를 .test 로 (운영앱과 별도 앱이 되도록)
          sed -i 's/applicationId "com.imweb.appS202408051a19f7159fdc6_9cfb6b4e8f3d0"/applicationId "com.imweb.appS202408051a19f7159fdc6_9cfb6b4e8f3d0.test"/' android/app/build.gradle
          # 3) 앱 표시 이름(테스트)
          sed -i 's#<string name="app_name">아파트스퀘어</string>#<string name="app_name">아파트스퀘어(테스트)</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">아파트스퀘어</string>#<string name="title_activity_main">아파트스퀘어(테스트)</string>#' android/app/src/main/res/values/strings.xml
          # 4) 푸시 끔 — 테스트 패키지는 Firebase 설정과 안 맞으니 google-services.json 제거(플러그인 건너뜀)
          rm -f android/app/google-services.json
          echo "=== applicationId / app_name 확인 ==="
          grep applicationId android/app/build.gradle
          grep app_name android/app/src/main/res/values/strings.xml

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release bundle (AAB)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload TEST AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: apartsquare-TEST-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
