name: Build signed AAB (테스트앱 · gentle-dust)

# 테스트 전용 앱: 프로덕션과 다른 패키지명(.test) + 다른 이름 + 테스트 Worker 링크.
# repo 파일은 프로덕션 그대로 두고, 빌드할 때만 아래 Patch 단계에서 테스트 값으로 바꿔 찍는다.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm deps
        run: npm install

      - name: Patch → 테스트 설정 (별도 패키지 .test · 테스트 링크)
        run: |
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.appId=c.appId+".test";
            c.appName="아파트스퀘어 (테스트)";
            c.server.url="https://gentle-dust-fe65.squarecm.workers.dev";
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));
          '
          BASE=com.imweb.appS202408051a19f7159fdc6_9cfb6b4e8f3d0
          sed -i "s/applicationId \"$BASE\"/applicationId \"$BASE.test\"/" android/app/build.gradle
          sed -i "s#<string name=\"app_name\">아파트스퀘어</string>#<string name=\"app_name\">아파트스퀘어 (테스트)</string>#" android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"title_activity_main\">아파트스퀘어</string>#<string name=\"title_activity_main\">아파트스퀘어 (테스트)</string>#" android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"package_name\">$BASE</string>#<string name=\"package_name\">$BASE.test</string>#" android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"custom_url_scheme\">$BASE</string>#<string name=\"custom_url_scheme\">$BASE.test</string>#" android/app/src/main/res/values/strings.xml
          echo "===== patched build.gradle ====="; grep applicationId android/app/build.gradle
          echo "===== patched strings.xml ====="; cat android/app/src/main/res/values/strings.xml
          echo "===== patched capacitor.config.json ====="; cat capacitor.config.json

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release bundle (AAB)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: apartsquare-TEST-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
