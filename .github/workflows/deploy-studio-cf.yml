name: 영상 제작 작업실 배포 (Cloudflare 무료)

# 준비물(GitHub Secrets): CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers), CLOUDFLARE_ACCOUNT_ID, SUPABASE_SERVICE_ROLE_KEY
on:
  push:
    branches: ["claude/bold-mayer-pylpse"]
    paths: ["video-studio/**", ".github/workflows/deploy-studio-cf.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 준비 확인
        id: ok
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare 시크릿이 아직 없어 건너뜀"; echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - name: 화면 + API 합치기 (PDF 는 서버 대신 Claude 가 읽음)
        if: steps.ok.outputs.go == 'yes'
        run: |
          node video-studio/build.mjs
          sed "s#import('pdf-parse/lib/pdf-parse.js')#Promise.resolve(null)#" video-studio/deploy/worker.js > video-studio/cloudflare/worker.js
          grep -c "pdf-parse" video-studio/cloudflare/worker.js || true
      - name: workers.dev 주소 확인
        if: steps.ok.outputs.go == 'yes'
        id: sub
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result.subdomain||'')}catch{console.log('')}})")
          echo "workers.dev 하위 주소: $SUB"
          if [ -z "$SUB" ]; then echo "::error::workers.dev 주소를 못 찾았습니다(토큰 권한·계정 ID 확인)"; exit 1; fi
          echo "base=https://video-studio.$SUB.workers.dev" >> $GITHUB_OUTPUT
      - name: 배포
        if: steps.ok.outputs.go == 'yes'
        working-directory: video-studio/cloudflare
        run: |
          printf 'PUBLIC_BASE = "%s"\n' "${{ steps.sub.outputs.base }}" >> wrangler.toml
          npx --yes wrangler@4 deploy || (echo "처음 만든 Worker 반영 대기 후 다시 시도"; sleep 15; npx --yes wrangler@4 deploy)
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx --yes wrangler@4 secret put SUPABASE_SERVICE_ROLE
      - name: 접속 확인
        if: steps.ok.outputs.go == 'yes'
        run: |
          sleep 5
          curl -s -o /dev/null -w "화면 HTTP %{http_code}\n" ${{ steps.sub.outputs.base }}/
          curl -s -o /dev/null -w "로고 HTTP %{http_code}\n" ${{ steps.sub.outputs.base }}/brand-logo.png
          echo "작업실 주소: ${{ steps.sub.outputs.base }}/"
