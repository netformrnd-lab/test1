name: 진단 - Firebase 서비스계정 확인

on:
  workflow_dispatch:

jobs:
  fbcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성
        working-directory: backend/aptsq-sync
        run: npm install google-auth-library --no-audit --no-fund --no-save
      - name: 서비스계정 검사
        working-directory: backend/aptsq-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fbcheck.js
