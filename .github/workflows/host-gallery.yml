name: 사진 갤러리 페이지 배포(Supabase 스토리지)

on:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성 설치
        working-directory: backend/aptsq-sync
        run: npm install --no-audit --no-fund
      - name: 갤러리 업로드 + 공개 확인
        working-directory: backend/aptsq-sync
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node hostgallery.js
