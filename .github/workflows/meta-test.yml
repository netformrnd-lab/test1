name: 진단 - meta 포함 왕복 테스트

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성 설치
        working-directory: backend/aptsq-sync
        run: npm install --no-audit --no-fund
      - name: 배포본 반영 확인 진단
        working-directory: backend/aptsq-sync
        run: node diag-deploy.js
