<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아파트스퀘어 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#eef2f8; --panel:#ffffff; --line:#e7ebf3; --line2:#eef1f7;
    --navy:#1F2C5C; --blue:#2F6BF6; --blue-soft:#eaf1fe;
    --ink:#1c2440; --mut:#8b93a8; --mut2:#5c6580;
    --green:#1f8a5b; --green-soft:#e4f5ec; --amber:#c98a1e; --amber-soft:#fbf1de;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}

  /* ===== 로그인 ===== */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  #login .box{width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 20px 50px -24px rgba(20,30,60,.35)}
  #login .logo{width:44px;height:44px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  #login h1{font-size:19px;font-weight:800;text-align:center}
  #login p{font-size:12.5px;color:var(--mut);text-align:center;margin:6px 0 22px}
  #login input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13px;margin-bottom:11px;outline:none}
  #login input:focus{border-color:var(--blue)}
  #login .msg{font-size:12px;font-weight:700;color:#d94b4b;min-height:16px;margin-top:8px;text-align:center}
  .btn-primary{width:100%;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:13px;font-weight:800;font-size:13.5px}

  /* ===== 레이아웃 ===== */
  #app{display:none;min-height:100vh}
  .layout{display:flex;min-height:100vh}
  .side{width:236px;flex-shrink:0;background:#1a2749;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side .brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
  .side .brand .nm{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px;color:#fff}
  .side .brand .ic{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#3f74e6,#2F6BF6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .side .brand .sub{font-size:11px;color:#8b9ac0;font-weight:600;margin-top:7px;margin-left:36px}
  .nav{padding:16px 12px;flex:1}
  .nav .lbl{font-size:10px;font-weight:800;color:#6b7aa8;letter-spacing:.06em;padding:12px 10px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;font-size:13px;font-weight:700;color:#c2cbe4;text-decoration:none;margin-bottom:2px}
  .nav a .ic{font-size:15px;width:18px;text-align:center}
  .nav a:hover{background:rgba(255,255,255,.06)}
  .nav a.on{background:#2b3d6b;color:#fff}
  .nav a .cnt{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.10);color:#aab5d4;padding:1px 8px;border-radius:20px}
  .nav a.on .cnt{background:rgba(255,255,255,.22);color:#fff}
  .side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:10px}
  .side .me .av{width:32px;height:32px;border-radius:50%;background:#2F6BF6;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .side .me .nm{font-size:12.5px;font-weight:800;line-height:1.2;color:#fff}
  .side .me .rl{font-size:10.5px;color:#8b9ac0}
  .side .me button{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#c2cbe4;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px}

  main{flex:1;padding:26px 30px 60px;max-width:1080px}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  .head h2{font-size:21px;font-weight:800}
  .head .desc{font-size:12.5px;color:var(--mut);margin-top:4px}
  section{display:none}
  section.on{display:block}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .tile .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .tile .k{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
  .tile.warn .v{color:var(--amber)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:20px}
  .card > h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;font-weight:800;background:#eef1f7;color:var(--mut);padding:2px 9px;border-radius:20px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
  th{font-size:11px;color:var(--mut);font-weight:800}
  tr:last-child td{border-bottom:none}
  select.f{font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
  .pill.ok{background:var(--green-soft);color:var(--green)}
  .pill.no{background:var(--amber-soft);color:var(--amber)}
  .b{border:none;border-radius:8px;font-size:12px;font-weight:800;padding:7px 12px}
  .b.approve{background:var(--green);color:#fff}
  .b.save{background:var(--navy);color:#fff}
  .empty{font-size:13px;color:var(--mut);padding:16px 4px}

  /* apartment cards */
  .apt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .apt{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:14px;padding:16px 18px}
  .apt .nm{font-size:15px;font-weight:800}
  .apt .meta{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:3px}
  .apt .bar{height:7px;background:#eef1f7;border-radius:20px;margin:13px 0 6px;overflow:hidden}
  .apt .bar > i{display:block;height:100%;background:var(--blue);border-radius:20px}
  .apt .prog{font-size:11.5px;color:var(--mut2);font-weight:700;display:flex;justify-content:space-between}
  .apt .edit{margin-top:11px;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut2);font-weight:700}
  .apt .edit label{min-width:34px}
  .apt .edit select.f{flex:1}
  .apt .f-num{width:54px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:700;text-align:center;outline:none;font-family:inherit}
  .apt .f-num:focus{border-color:var(--blue)}
  .apt .aud{margin-top:11px;display:flex;align-items:center;gap:7px}
  .apt .aud select{flex:1}
  .add-form{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .add-form input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;outline:none}
  .add-form input:focus{border-color:var(--blue)}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="box">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 100 100"><path d="M38 20 L18 50 L38 80" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 20 L82 50 L62 80" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>아파트스퀘어 관리자</h1>
    <p>관리자 계정으로 로그인하세요</p>
    <input id="li-email" type="email" placeholder="이메일" autocomplete="email">
    <input id="li-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">로그인</button>
    <div class="msg" id="li-msg"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="app">
 <div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="nm"><span class="ic"><svg width="15" height="15" viewBox="0 0 100 100"><path d="M38 20 L18 50 L38 80" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 20 L82 50 L62 80" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>아파트스퀘어</div>
      <div class="sub">관리자 워크스페이스</div>
    </div>
    <nav class="nav">
      <div class="lbl">관리</div>
      <a data-sec="overview" class="on"><span class="ic">📊</span>대시보드</a>
      <a data-sec="members"><span class="ic">👤</span>회원 관리<span class="cnt" id="nav-m">0</span></a>
      <a data-sec="apts"><span class="ic">🏢</span>단지 관리<span class="cnt" id="nav-a">0</span></a>
    </nav>
    <div class="me">
      <div class="av" id="me-av">관</div>
      <div><div class="nm" id="me-nm">관리자</div><div class="rl">관리자</div></div>
      <button onclick="doLogout()">로그아웃</button>
    </div>
  </aside>

  <main>
    <!-- 개요 -->
    <section id="sec-overview" class="on">
      <div class="head"><div><h2>대시보드</h2><div class="desc">아파트스퀘어 서비스 현황을 한눈에</div></div></div>
      <div class="tiles">
        <div class="tile"><div class="v" id="t-members">0</div><div class="k">전체 회원</div></div>
        <div class="tile warn"><div class="v" id="t-pending">0</div><div class="k">승인 대기</div></div>
        <div class="tile"><div class="v" id="t-auditors">0</div><div class="k">감리사</div></div>
        <div class="tile"><div class="v" id="t-apts">0</div><div class="k">등록 단지</div></div>
      </div>
      <div class="card">
        <h3>⏳ 승인 대기 회원 <span class="badge" id="pend-badge">0</span></h3>
        <div id="pending-list"></div>
      </div>
    </section>

    <!-- 회원 관리 -->
    <section id="sec-members">
      <div class="head"><div><h2>회원 관리</h2><div class="desc">가입한 회원을 승인하고 역할·담당 단지를 지정하세요</div></div></div>
      <div class="card">
        <table>
          <thead><tr><th>이름</th><th>이메일</th><th>연락처</th><th>역할</th><th>담당 단지</th><th>상태</th><th></th></tr></thead>
          <tbody id="members"></tbody>
        </table>
      </div>
    </section>

    <!-- 단지 관리 -->
    <section id="sec-apts">
      <div class="head"><div><h2>단지 관리</h2><div class="desc">단지를 등록하고 담당 감리사를 배정하세요</div></div></div>
      <div class="card">
        <h3>➕ 단지 추가</h3>
        <div class="add-form">
          <input id="na-name" placeholder="단지명 (예: 힐스테이트)" style="width:190px">
          <input id="na-region" placeholder="지역 (예: 서울 노원)" style="width:150px">
          <input id="na-type" placeholder="공사종류 (예: 외벽 재도장)" style="width:180px">
          <select id="na-auditor" class="f"><option value="">담당 감리사</option></select>
          <button class="b save" onclick="addApt()">추가</button>
        </div>
      </div>
      <div class="apt-grid" id="apts"></div>
    </section>
  </main>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gndktayoicegyqyllybk.supabase.co';
const SUPABASE_KEY='sb_publishable_J61d8JvrlkNVRyjmAhFwjQ_wExNoZbE';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=(id)=>document.getElementById(id);
let MEMBERS=[],APTS=[];
const ROLES={resident:'입주민',manager:'관리소장',auditor:'감리사',admin:'관리자'};
const esc=(s)=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function doLogin(){
  const email=$('li-email').value.trim(),pw=$('li-pw').value;
  $('li-msg').textContent='로그인 중…';
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){$('li-msg').textContent='이메일 또는 비밀번호를 확인하세요';return;}
  gate();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function gate(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){$('login').style.display='flex';$('app').style.display='none';return;}
  const {data:me}=await sb.from('profiles').select('role,name,email').eq('id',user.id).single();
  if(!me||me.role!=='admin'){
    $('li-msg').textContent='이 계정은 관리자 권한이 없습니다.';
    await sb.auth.signOut();$('login').style.display='flex';$('app').style.display='none';return;
  }
  const nm=me.name||me.email||'관리자';
  $('me-nm').textContent=nm; $('me-av').textContent=nm.slice(0,1);
  $('login').style.display='none';$('app').style.display='block';
  loadAll();
}

// 사이드바 이동
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('on'));
  a.classList.add('on');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));
  $('sec-'+a.dataset.sec).classList.add('on');
});

async function loadAll(){
  const [m,a]=await Promise.all([
    sb.from('profiles').select('*').order('created_at',{ascending:false}),
    sb.from('apartments').select('*').order('created_at',{ascending:false})
  ]);
  MEMBERS=m.data||[];APTS=a.data||[];
  renderStats();renderPending();renderMembers();renderApts();fillAuditorSelect();
}

function renderStats(){
  const pending=MEMBERS.filter(m=>!m.approved).length;
  const aud=MEMBERS.filter(m=>m.role==='auditor').length;
  $('t-members').textContent=MEMBERS.length;
  $('t-pending').textContent=pending;
  $('t-auditors').textContent=aud;
  $('t-apts').textContent=APTS.length;
  $('nav-m').textContent=MEMBERS.length;$('nav-a').textContent=APTS.length;
  $('pend-badge').textContent=pending;
}
function renderPending(){
  const p=MEMBERS.filter(m=>!m.approved);
  if(!p.length){$('pending-list').innerHTML='<div class="empty">승인 대기 중인 회원이 없어요 👍</div>';return;}
  $('pending-list').innerHTML='<table><thead><tr><th>이름</th><th>이메일</th><th>연락처</th><th></th></tr></thead><tbody>'+
    p.map(m=>`<tr><td style="font-weight:700">${esc(m.name)||'(이름없음)'}</td><td style="color:var(--mut2)">${esc(m.email)||''}</td><td style="color:var(--mut2)">${esc(m.phone)||''}</td><td><button class="b approve" onclick="approve('${m.id}')">승인</button></td></tr>`).join('')+
    '</tbody></table>';
}
function roleOpts(sel){return Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');}
function aptOpts(sel){return '<option value="">- 없음 -</option>'+APTS.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');}
function renderMembers(){
  if(!MEMBERS.length){$('members').innerHTML='<tr><td colspan="7" class="empty">아직 회원이 없어요</td></tr>';return;}
  $('members').innerHTML=MEMBERS.map(m=>`<tr data-id="${m.id}">
    <td style="font-weight:700">${esc(m.name)||'<span style="color:#c3ccdb">(이름없음)</span>'}</td>
    <td style="color:var(--mut2)">${esc(m.email)||''}</td>
    <td style="color:var(--mut2)">${esc(m.phone)||''}</td>
    <td><select class="f f-role">${roleOpts(m.role)}</select></td>
    <td><select class="f f-apt">${aptOpts(m.apartment_id)}</select></td>
    <td>${m.approved?'<span class="pill ok">승인됨</span>':'<span class="pill no">대기</span>'}</td>
    <td style="white-space:nowrap">${m.approved?'':'<button class="b approve" onclick="approve(\''+m.id+'\')">승인</button> '}<button class="b save" onclick="saveMember('${m.id}')">저장</button></td>
  </tr>`).join('');
}
function renderApts(){
  if(!APTS.length){$('apts').innerHTML='<div class="empty">등록된 단지가 없어요. 위에서 추가해 보세요.</div>';return;}
  const auds=MEMBERS.filter(m=>m.role==='auditor');
  const audOpts=(sel)=>'<option value="">- 미배정 -</option>'+auds.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name||a.email)}</option>`).join('');
  $('apts').innerHTML=APTS.map(a=>{
    const pc=a.progress_current||0,pt=a.progress_total||0,pct=pt?Math.round(pc/pt*100):0;
    const stOpt=(v,t)=>`<option value="${v}" ${a.status===v?'selected':''}>${t}</option>`;
    return `<div class="apt" data-id="${a.id}">
      <div class="nm">${esc(a.name)}</div>
      <div class="meta">${esc(a.region)||'지역 미정'} · ${esc(a.construction_type)||'종류 미정'}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="prog"><span>진행률</span><span>${pc} / ${pt} (${pct}%)</span></div>
      <div class="edit"><label>상태</label><select class="f f-status">${stOpt('scheduled','점검예정')}${stOpt('in_progress','진행중')}${stOpt('done','완료')}</select></div>
      <div class="edit"><label>진행</label><input type="number" class="f-num f-pc" min="0" value="${pc}"><span>/</span><input type="number" class="f-num f-pt" min="0" value="${pt}"><span>단계</span></div>
      <div class="aud"><label style="min-width:34px;font-size:12px;color:var(--mut2);font-weight:700">감리사</label><select class="f f-aud">${audOpts(a.auditor_id)}</select><button class="b save" onclick="saveApt('${a.id}')">저장</button></div>
    </div>`;
  }).join('');
}
function fillAuditorSelect(){
  const auds=MEMBERS.filter(m=>m.role==='auditor');
  $('na-auditor').innerHTML='<option value="">담당 감리사</option>'+auds.map(a=>`<option value="${a.id}">${esc(a.name||a.email)}</option>`).join('');
}

async function approve(id){const{error}=await sb.from('profiles').update({approved:true}).eq('id',id);if(error)return alert('오류: '+error.message);loadAll();}
async function saveMember(id){
  const row=document.querySelector(`#members tr[data-id="${id}"]`);
  const role=row.querySelector('.f-role').value,apt=row.querySelector('.f-apt').value||null;
  const{error}=await sb.from('profiles').update({role,apartment_id:apt}).eq('id',id);
  if(error)return alert('오류: '+error.message);loadAll();
}
async function addApt(){
  const name=$('na-name').value.trim();if(!name)return alert('단지명을 입력하세요');
  const{error}=await sb.from('apartments').insert({name,region:$('na-region').value.trim()||null,construction_type:$('na-type').value.trim()||null,auditor_id:$('na-auditor').value||null});
  if(error)return alert('오류: '+error.message);
  $('na-name').value=$('na-region').value=$('na-type').value='';$('na-auditor').value='';loadAll();
}
async function saveApt(id){
  const row=document.querySelector(`.apt[data-id="${id}"]`);
  const aud=row.querySelector('.f-aud').value||null;
  const status=row.querySelector('.f-status').value;
  let pc=parseInt(row.querySelector('.f-pc').value,10);if(isNaN(pc)||pc<0)pc=0;
  let pt=parseInt(row.querySelector('.f-pt').value,10);if(isNaN(pt)||pt<0)pt=0;
  if(pt&&pc>pt)pc=pt; // 완료 단계가 전체보다 클 수 없음
  const btn=row.querySelector('.save');if(btn){btn.textContent='저장 중…';btn.disabled=true;}
  const{error}=await sb.from('apartments').update({auditor_id:aud,status,progress_current:pc,progress_total:pt}).eq('id',id);
  if(error){if(btn){btn.textContent='저장';btn.disabled=false;}return alert('오류: '+error.message);}
  loadAll();
}

gate();
