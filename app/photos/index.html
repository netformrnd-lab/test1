<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장 사진 · 아파트스퀘어</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0d1117;--card:#161c26;--line:#232c39;--txt:#e9eef7;--mut:#93a1b5;--accent:#4f8cff;--green:#28c76f}
  html,body{background:var(--bg);color:var(--txt);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:18px 14px 40px;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#2c6be0);display:flex;align-items:center;justify-content:center;flex:none}
  .logo svg{width:17px;height:17px}
  h1{font-size:17px;font-weight:900;letter-spacing:-.3px}
  h1 small{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
  .count{font-size:12.5px;font-weight:800;color:var(--accent);background:rgba(79,140,255,.14);border:1px solid #2a3b5e;border-radius:999px;padding:5px 12px}
  .bar{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dl{font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2fb866,#1f9e52);border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .dl:hover{filter:brightness(1.06)}
  .dl:disabled{opacity:.6;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
  .cell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:block}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .cell:hover img{transform:scale(1.04)}
  .cell .n{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 7px}
  .empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:14px;font-weight:600}
  .hint{text-align:center;color:var(--mut);font-size:11.5px;font-weight:600;margin-top:18px}
</style>
</head>
<body>
  <header>
    <span class="logo"><svg viewBox="0 0 100 100"><path d="M38 20 L18 50 L38 80" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M62 20 L82 50 L62 80" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round"/></svg></span>
    <h1 id="ttl">현장 사진<small id="sub">감리일지 첨부 사진</small></h1>
    <div class="bar">
      <span class="count" id="cnt"></span>
      <button class="dl" id="dl" hidden>⬇ 전체 다운로드</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="hint">사진을 누르면 원본이 열립니다. · <b>전체 다운로드</b>는 모든 사진을 ZIP으로 저장합니다.</div>

<script>
  var BASE = 'https://gndktayoicegyqyllybk.supabase.co/storage/v1/object/public/report-photos/';
  function q(k){ try{ return new URLSearchParams(location.search).get(k) || ''; }catch(e){ return ''; } }
  function toUrl(tok){ tok = (tok||'').trim(); if(!tok) return ''; return /^https?:\/\//.test(tok) ? tok : (BASE + tok); }
  var files = q('f').split(',').map(toUrl).filter(Boolean);
  var title = q('t');
  if(title){ document.getElementById('ttl').firstChild.textContent = title; }
  document.getElementById('cnt').textContent = files.length ? (files.length + '장') : '';
  var grid = document.getElementById('grid');
  if(!files.length){
    grid.outerHTML = '<div class="empty">표시할 사진이 없습니다.</div>';
  } else {
    grid.innerHTML = files.map(function(u,i){
      return '<a class="cell" href="'+u+'" target="_blank" rel="noopener">'
        + '<span class="n">'+(i+1)+'</span>'
        + '<img loading="lazy" src="'+u+'" alt="사진 '+(i+1)+'" onerror="this.parentNode.style.display=\'none\'">'
        + '</a>';
    }).join('');
    var dl = document.getElementById('dl'); dl.hidden = false;
    dl.addEventListener('click', function(){ downloadAll(dl); });
  }

  function ensureJSZip(){ if(window.JSZip) return Promise.resolve(); if(window._z) return window._z;
    window._z = new Promise(function(res,rej){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); return window._z; }
  async function downloadAll(btn){
    var t0 = btn.textContent; btn.disabled = true;
    try{
      await ensureJSZip(); var zip = new JSZip(); var ok=0, fail=0;
      for(var i=0;i<files.length;i++){
        btn.textContent = '받는 중 '+(i+1)+'/'+files.length;
        try{ var r = await fetch(files[i], {mode:'cors'}); if(!r.ok) throw 0; var b = await r.blob();
          var ext = (b.type.split('/')[1]||'jpg').replace('jpeg','jpg'); zip.file(String(i+1).padStart(3,'0')+'.'+ext, b); ok++; }
        catch(e){ fail++; }
      }
      if(!ok){ alert('사진을 가져오지 못했어요.'); return; }
      btn.textContent = '압축 중…';
      var blob = await zip.generateAsync({type:'blob'});
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = ((title||'현장사진').replace(/[\\/:*?"<>|]/g,'_')) + '.zip';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 6000);
      if(fail) alert(ok+'장 완료, '+fail+'장 실패');
    }catch(e){ alert('다운로드 오류: '+(e.message||e)); }
    finally{ btn.disabled=false; btn.textContent=t0; }
  }
</script>
</body>
</html>
