<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<title>넷폼알앤디 브랜드 허브</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
/* ============================================================
   브랜드 허브 — 화면 디자인
   색·글씨·간격을 여기 한 곳에서 정합니다.
   아래 :root 의 값만 바꾸면 전체 분위기가 함께 바뀝니다.
   ============================================================ */
:root{
  /* 바탕 — 살짝 따뜻한 종이색. 카드는 흰색이라 경계가 은은하게 생깁니다 */
  --bg-primary:#f6f5f3; --bg-secondary:#ffffff; --bg-card:#ffffff;
  --bg-hover:#f1f0ed; --bg-input:#faf9f7; --bg-sunken:#efeeea;
  --border:#e6e4df; --border-light:#d5d2cb;

  /* 글씨 */
  --text-primary:#16181d; --text-secondary:#5a5e66; --text-muted:#9b9ea6;

  /* 강조색 — 링크·선택된 곳에만 씁니다 */
  --blue:#4b5cd6; --blue-soft:rgba(75,92,214,.10);
  --green:#12a150; --yellow:#c07708; --red:#d93b3b;
  --purple:#7c5cd6; --cyan:#0e8fa8; --orange:#dd6b13;

  /* 진한 단추 색 (주요 동작) */
  --ink:#1b1d22; --ink-hover:#2c2f36;

  --shadow-sm:0 1px 2px rgba(20,21,26,.05);
  --shadow-md:0 1px 2px rgba(20,21,26,.04),0 8px 20px -8px rgba(20,21,26,.14);
  --shadow-lg:0 16px 40px -12px rgba(20,21,26,.24),0 2px 6px rgba(20,21,26,.06);
  --ring:0 0 0 3px rgba(75,92,214,.22);

  --r-xs:7px; --r-sm:9px; --r:11px; --r-md:14px; --r-lg:18px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body.dark-mode{
  --bg-primary:#0b0c0e; --bg-secondary:#141518; --bg-card:#141518;
  --bg-hover:#1e2024; --bg-input:#0f1013; --bg-sunken:#0f1013;
  --border:#26282d; --border-light:#3b3e45;
  --text-primary:#eceef1; --text-secondary:#a6aab2; --text-muted:#6d717a;
  --blue:#8a97fb; --blue-soft:rgba(138,151,251,.14);
  --green:#3ecf7d; --yellow:#e0a33c; --red:#f06767;
  --purple:#a48cf0; --cyan:#3fb6cf; --orange:#f0873c;
  --ink:#eceef1; --ink-hover:#ffffff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 4px rgba(0,0,0,.4),0 10px 24px -10px rgba(0,0,0,.7);
  --shadow-lg:0 20px 48px -14px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(138,151,251,.26);
}
body.dark-mode .btn.primary{color:#0b0c0e}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,
    'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg-primary);color:var(--text-primary);min-height:100vh;
  line-height:1.62;letter-spacing:-.011em;font-size:14px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* 숫자는 자리가 흔들리지 않게 */
.stat .val,.hcard .nums .n b,.bar-row .bv,.recent .rb,.verbadge,.path,
table.itable td{font-variant-numeric:tabular-nums}

/* 스크롤 막대를 얇고 조용하게 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:99px;
  border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-muted);background-clip:padding-box;
  border:3px solid transparent}
*::-webkit-scrollbar-track{background:transparent}

/* 키보드로 이동할 때만 테두리를 보여줍니다 */
button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:14px;
  align-items:center;padding:13px 24px;
  background:var(--bg-secondary);
  background:color-mix(in srgb,var(--bg-secondary) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border)}
.topbar h1{font-size:17px;font-weight:750;letter-spacing:-.028em;white-space:nowrap;
  display:flex;align-items:center;gap:8px}
.topbar .sub{font-size:11.5px;color:var(--text-muted);font-weight:500;
  letter-spacing:-.005em;margin-top:1px}
.spacer{flex:0 0 0;width:0}
.searchbox{position:relative;min-width:140px;flex:0 1 340px}
.searchbox input{width:100%;padding:9px 13px 9px 34px;font-size:13px;
  border-radius:var(--r);border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-primary);font-family:inherit;transition:.16s var(--ease)}
.searchbox input::placeholder{color:var(--text-muted)}
.searchbox input:focus{outline:none;border-color:var(--border-light);
  background:var(--bg-secondary);box-shadow:var(--ring)}
.searchbox .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--text-muted);pointer-events:none}
.actions{display:flex;gap:8px;align-items:center;flex:1 1 0;justify-content:flex-end;
  min-width:0}
.statusgrp{display:flex;gap:6px;align-items:center;justify-content:flex-end;
  flex:1 1 0;min-width:0;overflow:hidden}
.statusgrp > *{flex:0 0 auto;white-space:nowrap;min-width:0}
.btngrp{display:flex;gap:6px;align-items:center;flex:0 0 auto}
@media(max-width:1280px){ .presence .pnames{display:none} }
@media(max-width:1100px){ .savestate{min-width:0} .verbadge{display:none} }
/* 새 판 알림이 떠서 자리가 모자랄 때는 판 번호부터 숨깁니다 */
.topbar.tight .verbadge{display:none}
.topbar.tight2 .savestate{display:none}
/* 그래도 모자라면 오른쪽 묶음을 아랫줄로 (겹치는 것보다 줄 바꾸는 편이 낫습니다) */
.topbar.tight3 .actions{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-end}
.topbar.tight3 .statusgrp{flex:1 1 auto;justify-content:flex-start;flex-wrap:wrap;
  overflow:visible}

@media(max-width:1000px){
  /* 자리가 좁아지면 오른쪽 묶음을 통째로 아랫줄로 내립니다.
     (좁혀서 글자가 겹치는 것보다 줄을 바꾸는 편이 낫습니다)              */
  .actions{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-end}
  .statusgrp{flex:1 1 auto;justify-content:flex-start;flex-wrap:wrap;overflow:visible}
  .topbar.tight2 .savestate{display:block}
  .presence .pnames{display:inline}
}
@media(max-width:620px){
  .searchbox{flex:1 1 100%}
  .statusgrp{flex:1 1 100%}
}

.astat{font-size:12px;color:var(--text-muted)}
.ainote{padding:11px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.6;
  background:rgba(192,119,8,.10);border:1px solid rgba(192,119,8,.22);
  color:var(--text-primary)}
.savestate{font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap;
  min-width:72px;text-align:right;flex:0 0 auto}
.savestate.ok{color:var(--green)}
.savestate.err{color:var(--red)}
.presence{display:inline-flex;align-items:center;gap:6px;max-width:250px;font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg-secondary);color:var(--text-secondary);white-space:nowrap;
  cursor:pointer;min-width:0;overflow:hidden}
.presence:hover{border-color:var(--border-light)}
.presence .pdot{width:7px;height:7px;border-radius:50%;background:var(--green);
  flex-shrink:0;box-shadow:0 0 0 3px rgba(18,161,80,.16);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.presence .pnames{color:var(--text-muted);font-weight:500;max-width:190px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.presence .pset{color:var(--blue);font-weight:700;flex-shrink:0}
.store-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg-secondary);white-space:nowrap;color:var(--text-secondary)}
.store-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 3px rgba(192,119,8,.16)}
.store-badge.nas .dot{background:var(--green);box-shadow:0 0 0 3px rgba(18,161,80,.16)}
.store-badge.error .dot{background:var(--red);box-shadow:0 0 0 3px rgba(217,59,59,.18)}

/* ---------- 단추 ---------- */
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;
  border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-primary);cursor:pointer;transition:.16s var(--ease);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  letter-spacing:-.01em;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-light)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:var(--shadow-sm)}
.btn.warn{background:var(--yellow);border-color:var(--yellow);color:#fff;font-weight:700}
.btn.warn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:var(--bg-card);border-color:var(--border);transform:none}
.btn.primary:hover{background:var(--ink-hover);border-color:var(--ink-hover)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:rgba(217,59,59,.09);border-color:rgba(217,59,59,.35)}
.btn.sm{padding:3.5px 9px;font-size:11.5px;border-radius:var(--r-xs);box-shadow:none}

/* ---------- 레이아웃 ---------- */
/* minmax(0,1fr) 이어야 오른쪽 칸이 화면보다 좁아질 수 있습니다.
   그냥 1fr 이면 안에 있는 표·그래프의 최소 너비만큼 칸이 벌어져서
   창이 좁을 때 화면 전체가 옆으로 밀립니다. */
.layout{display:grid;grid-template-columns:242px minmax(0,1fr);gap:26px;
  max-width:1520px;margin:0 auto;padding:24px}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:16px;padding:16px}}

/* ---------- 왼쪽 목록 ---------- */
.side{align-self:start;position:sticky;top:84px}
@media(max-width:900px){.side{position:static}}
.side-title{font-size:10.5px;font-weight:700;color:var(--text-muted);
  letter-spacing:.09em;text-transform:uppercase;margin:0 0 9px 11px}
.brand-list{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
@media(max-width:900px){.brand-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.brand-item{display:flex;align-items:center;gap:10px;padding:8px 11px;
  border-radius:var(--r);cursor:pointer;transition:.14s var(--ease);
  border:1px solid transparent;background:transparent;font-family:inherit;
  font-size:13.5px;font-weight:600;color:var(--text-secondary);
  text-align:left;width:100%;white-space:nowrap;letter-spacing:-.012em}
.brand-item:hover{background:var(--bg-hover);color:var(--text-primary)}
/* 📑 묶음마다 목록을 하나 더 — 평소엔 조용히, 그 묶음에 손을 올리면 */
.pg-new{display:block;width:100%;margin:1px 0 0;padding:5px 11px 5px 24px;
  border:none;background:transparent;font-family:inherit;font-size:11.5px;
  font-weight:600;color:var(--text-muted);text-align:left;cursor:pointer;
  border-radius:var(--r);opacity:.42;transition:.14s var(--ease)}
.brand-list:hover .pg-new,.pg-new:focus-visible{opacity:1}
.pg-new:hover{background:var(--bg-hover);color:var(--text-primary)}
/* 📎 올리는 중 — 큰 파일은 몇 분 걸려서 얼마나 갔는지가 보여야 합니다 */
.pg-up{margin:10px 0 0;padding:11px 13px;border:1px solid var(--blue);
  border-radius:10px;background:var(--bg-card)}
.pg-up.bad{border-color:var(--red)}
.pg-up .uh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-size:12.5px;font-weight:700;color:var(--text-primary)}
.pg-up .uh b{font-weight:800;word-break:break-all;min-width:0}
.pg-up .uh span{font-family:var(--f-mono);font-size:11.5px;font-weight:600;
  color:var(--text-muted)}
.pg-up .uh .btn{margin-left:auto}
.pg-up .ub{height:7px;margin-top:9px;border-radius:99px;background:var(--bg-sunken);
  overflow:hidden}
.pg-up .ub i{display:block;height:100%;background:var(--blue);border-radius:99px;
  transition:width .2s var(--ease)}
.pg-up .ut{margin-top:5px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;
  color:var(--blue)}
.pg-up .un{margin-top:3px;font-size:11px;color:var(--text-muted)}
.pg-up .ue{margin-top:7px;font-size:12px;line-height:1.7;color:var(--red);
  white-space:pre-wrap;word-break:keep-all}
/* 📎 올려 둔 파일 칸 */
.card.pg-f .fh{display:flex;align-items:flex-start;gap:9px;padding-right:70px}
.card.pg-f .fe{font-size:22px;line-height:1.1;flex:0 0 auto}
.card.pg-f .fn{display:flex;flex-direction:column;gap:2px;min-width:0}
.card.pg-f .fn b{font-size:13.5px;font-weight:700;color:var(--text-primary);
  word-break:break-all;line-height:1.45}
.card.pg-f .fn span{font-family:var(--f-mono);font-size:11px;font-weight:600;
  color:var(--text-muted)}
.card.pg-f .fd{display:inline-block;margin-top:9px;padding:4px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg-card);font-size:11.5px;
  font-weight:700;color:var(--text-secondary);text-decoration:none}
.card.pg-f .fd:hover{border-color:var(--ink);color:var(--text-primary)}
/* 📑 목록 화면 — 탭 옆의 [＋ 탭], 칸의 주소줄, 탭 옮기기 */
.tab.pg-add{color:var(--text-muted);font-weight:600}
.tab.pg-add:hover{color:var(--text-primary)}
.card .pg-u{margin-top:5px;display:flex;align-items:center;gap:6px;min-width:0}
.card .pg-u a{font-family:var(--f-mono);font-size:11.5px;color:var(--blue);
  text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pg-u a:hover{text-decoration:underline}
.card .pg-u .cd-non{font-size:11.5px;color:var(--text-muted);cursor:pointer;
  opacity:0;transition:.16s var(--ease)}
.card:hover .pg-u .cd-non{opacity:.8}
.card .pg-u .cd-non:hover{opacity:1;color:var(--text-secondary)}
.card .pg-u .ct-ed{font-size:11px;color:var(--text-muted);cursor:pointer;
  opacity:0;transition:.16s var(--ease)}
.card:hover .pg-u .ct-ed{opacity:.75}
.card .pg-u .ct-ed:hover{opacity:1;color:var(--ink)}
.card .ca .pg-mv{font-family:inherit;font-size:11px;padding:2px 4px;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-card);
  color:var(--text-secondary);max-width:96px}
.brand-item.on{background:var(--bg-card);border-color:var(--border);
  color:var(--text-primary);box-shadow:var(--shadow-sm);font-weight:700}
.brand-item .bar{width:3px;height:16px;border-radius:99px;flex-shrink:0;
  opacity:.45;transition:.14s var(--ease)}
.brand-item.on .bar{opacity:1;height:19px}
.brand-item .em{font-size:15px;line-height:1}
.brand-item .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-muted);
  font-variant-numeric:tabular-nums}
.bwrap{position:relative}
.bmove{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px;
  background:var(--bg-card);border-radius:var(--r-xs);padding:2px;box-shadow:var(--shadow-sm)}
.bwrap:hover .bmove{display:flex}
.bmove .btn{padding:1px 6px;font-size:11px;box-shadow:none}
@media(max-width:900px){.bmove{display:none!important}}

/* ---------- 본문 판 ---------- */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden}
.bhead{padding:24px 26px 20px;display:flex;align-items:flex-start;gap:15px;flex-wrap:wrap}
.bhead .icon{width:46px;height:46px;border-radius:var(--r-md);display:grid;place-items:center;
  font-size:23px;background:var(--bg-hover);border:1px solid var(--border);flex-shrink:0}
.bhead h2{font-size:21px;font-weight:750;letter-spacing:-.032em;line-height:1.3}
.bhead .meta{font-size:13px;color:var(--text-secondary);margin-top:3px}
.bhead .ba{margin-left:auto;display:flex;gap:6px}

.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);
  overflow-x:auto;background:transparent}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:10px 13px 12px;font-family:inherit;font-size:13px;font-weight:600;
  background:none;border:none;color:var(--text-muted);cursor:pointer;white-space:nowrap;
  transition:.16s var(--ease);position:relative;letter-spacing:-.012em;border-radius:var(--r-sm)}
.tab::after{content:'';position:absolute;left:11px;right:11px;bottom:-1px;height:2px;
  border-radius:2px 2px 0 0;background:transparent;transition:.16s var(--ease)}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--text-primary);font-weight:700}
/* 보고 있는 탭은 <div> 입니다 (단추가 아니라 이름을 눌러 고치는 자리) */
div.tab.on{display:inline-flex;align-items:center;cursor:default}
div.tab.on > span[data-ed]{cursor:pointer}
.tab.on::after{background:var(--text-primary)}
.tab .n{font-size:10.5px;font-weight:600;opacity:.6;margin-left:4px;
  font-variant-numeric:tabular-nums}
.tabbody{padding:22px 26px 30px}

.sec-bar{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.sec-bar .hint{font-size:12.5px;color:var(--text-muted);letter-spacing:-.005em}

/* ---------- 카드 목록 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  background:var(--bg-secondary);transition:.18s var(--ease);position:relative}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border-light)}
.card .ct{font-size:14px;font-weight:700;margin-bottom:3px;padding-right:70px;
  letter-spacing:-.018em}
/* 단추가 셋인 칸(할 일)은 더 비워 둡니다. 70px 로는 제목 끝이 단추
   밑으로 들어가, 제목을 누르려다 [삭제] 가 눌립니다. */
.card.ca3 .ct,.card.ca3 .ct-w{padding-right:152px}
.card .cd{font-size:12.5px;color:var(--text-secondary);white-space:pre-wrap;
  word-break:break-word;margin-top:6px;line-height:1.65}
/* 빈 메모 자리 — 48칸이 「＋ 메모」 로 도배되지 않게 손을 올렸을 때만
   보입니다. 자리는 늘 있으니 눌러서 바로 적을 수 있습니다. */
.card .cd.cd-non{color:var(--text-muted);opacity:0;transition:.16s var(--ease)}
.card:hover .cd.cd-non{opacity:.8}
.card .cd.cd-non:hover{opacity:1;color:var(--text-secondary)}
.costtable .cd-non{color:var(--text-muted);opacity:0;transition:.16s var(--ease);
  cursor:pointer}
.costtable tr:hover .cd-non{opacity:.8}
.costtable .cd-non:hover{opacity:1;color:var(--text-secondary)}
/* 바로가기는 제목이 링크라 누르면 새 탭이 열립니다 — 고치는 자리를 옆에 */
.card .ct-w{display:flex;align-items:flex-start;gap:6px;padding-right:70px}
.card .ct-w .ct{flex:1 1 auto;min-width:0;padding-right:0}
.card .ct-w .ct-ed{flex:0 0 auto;font-size:12px;color:var(--text-muted);cursor:pointer;
  opacity:0;transition:.16s var(--ease);line-height:1.5}
.card:hover .ct-w .ct-ed{opacity:.75}
.card .ct-w .ct-ed:hover{opacity:1;color:var(--ink)}
.card .ca{position:absolute;top:11px;right:11px;display:flex;gap:3px;opacity:0;
  transition:.16s var(--ease)}
.card:hover .ca{opacity:1}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.card.done{opacity:.5}
.card.done .ct{text-decoration:line-through}
.card.linkcard{border-left:2px solid var(--blue)}
.card.linkcard .ct{display:block;text-decoration:none;color:inherit}
.card.linkcard .ct:hover{color:var(--blue)}
.card.linkcard .go{color:var(--blue);font-size:12px}
.card.linkcard.haspv{padding-top:13px}

/* 미리보기 — 실제 페이지를 축소해서 보여줍니다 */
.pvwrap{display:block;position:relative;width:100%;height:170px;margin-bottom:12px;
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  background:var(--bg-hover);text-decoration:none}
.pvwrap::after{content:'클릭하면 새 탭에서 열립니다';position:absolute;left:0;right:0;bottom:0;
  padding:6px 10px;font-size:11px;font-weight:600;color:#fff;
  background:linear-gradient(transparent,rgba(12,13,15,.82));
  opacity:0;transition:.18s var(--ease)}
.pvwrap:hover::after{opacity:1}
.pv{width:1280px;height:800px;border:0;transform:scale(.29);transform-origin:0 0;
  pointer-events:none;background:#fff}
.pvmask{position:absolute;inset:0}   /* 미리보기 위를 덮어 클릭이 카드로 가게 합니다 */

/* ---------- 작은 표시(칩) ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2.5px 9px;border-radius:999px;background:var(--bg-hover);
  color:var(--text-secondary);border:1px solid transparent;letter-spacing:-.005em;
  line-height:1.5}
.chip.on{background:rgba(18,161,80,.11);color:#0f8a45;border-color:rgba(18,161,80,.22)}
.chip.test{background:rgba(192,119,8,.11);color:#a9690a;border-color:rgba(192,119,8,.24)}
.chip.off{background:rgba(217,59,59,.10);color:#c33636;border-color:rgba(217,59,59,.22)}
body.dark-mode .chip.on{color:#4ade80}
body.dark-mode .chip.test{color:#e5b45b}
body.dark-mode .chip.off{color:#f79191}
.lnk{font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;
  word-break:break-all;text-underline-offset:2px}
.lnk:hover{text-decoration:underline}
.path{font-size:11px;color:var(--text-muted);
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;
  word-break:break-all;letter-spacing:-.01em}

/* ---------- 히스토리 ---------- */

/* ---------- 마스터프롬프트 ---------- */
.pwrap{display:flex;flex-direction:column;gap:11px}
/* 브랜드북 아래에 붙는 마스터프롬프트 칸 */
.promptsec{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:11px}
.promptsec .sech{margin:0;font-size:15px;font-weight:800}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--text-muted)}
textarea.prompt{width:100%;min-height:400px;padding:18px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:13px;
  line-height:1.75;resize:vertical;transition:.16s var(--ease)}
textarea.prompt:focus{outline:none;border-color:var(--border-light);box-shadow:var(--ring)}

/* ---------- 검색 결과 ---------- */
.sr-group{margin-bottom:24px}
.sr-head{font-size:13px;font-weight:750;margin-bottom:10px;display:flex;
  align-items:center;gap:8px;letter-spacing:-.018em}
.sr-item{padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:6px;cursor:pointer;background:var(--bg-secondary);transition:.14s var(--ease)}
.sr-item:hover{background:var(--bg-hover);border-color:var(--border-light)}
.sr-item .t{font-size:13.5px;font-weight:700;letter-spacing:-.018em}
.sr-item .c{font-size:12px;color:var(--text-secondary);margin-top:3px}
mark{background:rgba(192,119,8,.26);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- 공용 ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--text-muted);font-size:13.5px;
  line-height:1.8;border:1px dashed var(--border);border-radius:var(--r-md);
  background:var(--bg-input)}

/* 띄어쓰기 없는 긴 글(붙여넣은 주소·경로·검색어)이 들어와도
   화면이 옆으로 밀리지 않게 어디서든 줄을 바꿉니다.
   가로 스크롤을 따로 가진 표(문의 표 등)는 nowrap 이라 영향받지 않습니다. */
#main, .modal, .topbar{overflow-wrap:anywhere}

/* ---------- 홈 화면 ---------- */
.home-item{margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;margin-bottom:8px}
.stat{border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  background:var(--bg-secondary);transition:.16s var(--ease)}
.stat:hover{border-color:var(--border-light)}
.stat .lab{font-size:11.5px;font-weight:600;color:var(--text-secondary);
  letter-spacing:-.005em}
.stat .val{font-size:27px;font-weight:750;letter-spacing:-.038em;margin-top:5px;
  line-height:1.15}
.stat .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.hcard{border:1px solid var(--border);border-radius:var(--r-md);padding:17px 18px 17px 21px;
  cursor:pointer;background:var(--bg-secondary);transition:.2s var(--ease);
  position:relative;overflow:hidden}
.hcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--bc,var(--blue));opacity:.9}
.hcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);
  border-color:var(--border-light)}
.hcard .top{display:flex;align-items:center;gap:10px}
.hcard .em{font-size:20px;line-height:1}
.hcard .nm{font-size:15px;font-weight:750;letter-spacing:-.024em}
.hcard .ds{font-size:12.5px;color:var(--text-muted);margin-top:6px;min-height:19px;
  line-height:1.6}
.hcard .cnts{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.hcard .nums{display:flex;gap:16px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border)}
.hcard .nums .n{font-size:11px;color:var(--text-muted)}
.hcard .nums .n b{display:block;font-size:18px;font-weight:750;color:var(--text-primary);
  letter-spacing:-.032em;line-height:1.25}
.todo{border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;
  background:var(--bg-secondary)}
.todo .ti{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;
  cursor:pointer;border-radius:var(--r-sm);transition:.13s var(--ease)}
.todo .ti:hover{background:var(--bg-hover);color:var(--text-primary)}
.recent .ri{display:flex;align-items:center;gap:10px;font-size:13px;padding:9px 10px;
  cursor:pointer;border-radius:var(--r-sm);transition:.13s var(--ease);position:relative}
.recent .ri::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:1px;
  background:var(--border)}
.recent .ri:last-child::after{display:none}
.recent .ri:last-child{border-bottom:none}
.recent .ri:hover{background:var(--bg-hover)}
.recent .rb{font-size:11.5px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.hsec{font-size:12.5px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;
  gap:7px;color:var(--text-secondary);letter-spacing:.02em}
.page-h{font-size:19px;font-weight:750;letter-spacing:-.032em;margin-bottom:3px}
.page-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:20px}
.dm{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dm.late{background:var(--red);box-shadow:0 0 0 3px rgba(217,59,59,.16)}
.dm.soon{background:var(--yellow);box-shadow:0 0 0 3px rgba(192,119,8,.16)}
.todo .ti .rb{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-muted);
  white-space:nowrap}
.delta{font-size:11.5px;font-weight:700}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}

/* ---------- 지표 상자 ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}
.mbox{border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  background:var(--bg-secondary)}
.mh{font-size:13px;font-weight:700;margin-bottom:12px;letter-spacing:-.018em;
  display:flex;align-items:center;gap:7px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bar-row .bl{width:86px;flex-shrink:0;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;height:6px;border-radius:99px;background:var(--bg-sunken);overflow:hidden}
.bar-row .bf{display:block;height:100%;border-radius:99px;background:var(--blue);
  transition:width .4s var(--ease)}
.bar-row .bv{width:42px;text-align:right;font-weight:700;flex-shrink:0;white-space:nowrap}
/* 금액처럼 긴 값이 오면 자리를 더 줍니다 */
.vz-box .bar-row .bv{width:auto;min-width:96px}
.krow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:7px 0;border-bottom:1px solid var(--border);color:var(--text-secondary)}
.krow:last-child{border-bottom:none}

/* ---------- 문의 표 ---------- */
.table-wrap{border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;
  max-height:62vh;background:var(--bg-secondary)}
table.itable{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.itable th,table.itable td{padding:9px 13px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap;
  max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.itable th{position:sticky;top:0;z-index:1;background:var(--bg-input);
  font-size:11px;font-weight:700;color:var(--text-secondary);
  letter-spacing:.03em;text-transform:uppercase;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
table.itable tr:last-child td{border-bottom:none}
table.itable tr:hover td{background:var(--bg-hover)}

/* ---------- 파일 올리기 ---------- */
.drop{border:1.5px dashed var(--border-light);border-radius:var(--r-md);padding:28px 20px;
  text-align:center;transition:.18s var(--ease);margin-bottom:16px;background:var(--bg-input)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop.dragover{border-color:var(--blue);background:var(--blue-soft)}
.nasdrop{border:1.5px dashed var(--border-light);border-radius:var(--r-md);
  padding:13px 16px;margin-bottom:12px;background:var(--bg-input);
  display:flex;align-items:center;gap:12px;transition:.16s var(--ease)}
.nasdrop:hover{border-color:var(--blue);background:var(--blue-soft)}
.nasdrop.dragover{border-color:var(--blue);background:var(--blue-soft)}
.nasdrop .ic{font-size:22px;opacity:.85;flex:0 0 auto;cursor:pointer}
.nasdrop .tx{flex:1;min-width:0;cursor:pointer}
.nasdrop .mk{flex:0 0 auto;cursor:pointer}
.nasdrop .t{font-size:13.5px;font-weight:700;letter-spacing:-.015em;color:var(--text-primary)}
.nasdrop .s{font-size:12px;color:var(--text-muted);margin-top:2px}
.nasdrop .here{font-weight:700;color:var(--blue)}
.drop .big{font-size:26px;margin-bottom:7px;opacity:.8}
.drop .t{font-size:14px;font-weight:700;letter-spacing:-.018em}
.drop .s{font-size:12.5px;color:var(--text-muted);margin-top:4px}
.drop .warn{font-size:12.5px;color:var(--text-muted);margin-top:11px}
.upqueue{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.upitem{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 13px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-secondary)}
.upitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upitem .st{margin-left:auto;font-weight:700;white-space:nowrap}
.upitem .st.ok{color:var(--green)} .upitem .st.err{color:var(--red)}
.fileicon{font-size:22px;flex-shrink:0}
.card.filecard .ct{padding-right:0}
.fmeta{font-size:11.5px;color:var(--text-muted);margin-top:3px}

/* ---------- 폴더 탐색기 ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px;
  font-size:12.5px}
.crumb{font-family:inherit;font-size:12.5px;font-weight:600;padding:4px 9px;
  border-radius:var(--r-xs);border:1px solid transparent;background:transparent;
  color:var(--text-secondary);cursor:pointer;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.13s var(--ease)}
.crumb:hover{background:var(--bg-hover);color:var(--text-primary)}
.crumb.on{color:var(--text-primary);cursor:default;font-weight:700}
.crumb.on:hover{background:transparent}
.crumbsep{color:var(--text-muted);font-size:11px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;
  margin-bottom:14px}
.fwrap{position:relative;display:flex}
.fwrap .fcard{flex:1;min-width:0}
.fwrap .fdel{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .12s}
.fwrap:hover .fdel,.fwrap:focus-within .fdel{opacity:1}
/* 끌어다 놓는 중인 폴더 칸 */
.fcard.dragover{border-color:var(--accent);background:var(--accent-soft,rgba(59,130,246,.12));
  box-shadow:0 0 0 3px rgba(59,130,246,.16)}
.krow[draggable="true"]{cursor:grab}
.krow[draggable="true"]:active{cursor:grabbing}
.fcard{font-family:inherit;text-align:left;display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary);cursor:pointer;min-width:0;
  transition:.14s var(--ease)}
.fcard:hover{background:var(--bg-hover);border-color:var(--border-light);
  transform:translateY(-1px)}
.fcard .fc-ico{font-size:19px;flex-shrink:0}
.fcard .fc-t{min-width:0;flex:1}
.fcard .fc-nm{display:block;font-size:13px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fc-sub{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}

/* ---------- 접히는 폴더 목록 ---------- */
.flist{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--bg-secondary)}
.frow + .frow{border-top:1px solid var(--border)}
.frow.on{background:var(--bg-input)}
.frow.dragover{background:var(--blue-soft);outline:2px dashed var(--blue);outline-offset:-2px}
.card[draggable="true"]{cursor:grab}
.card[draggable="true"]:active{cursor:grabbing}
.fhead{width:100%;font-family:inherit;text-align:left;display:flex;align-items:center;
  gap:10px;padding:11px 15px;border:0;background:transparent;color:var(--text-primary);
  cursor:pointer;transition:.13s var(--ease)}
.fhead:hover{background:var(--bg-hover)}
.fhead .fh-ar{color:var(--text-muted);font-size:10px;width:10px;flex-shrink:0;
  transition:.16s var(--ease)}
.fhead .fh-ic{font-size:15px;flex-shrink:0}
.fhead .fh-nm{font-size:13.5px;font-weight:600;min-width:0;letter-spacing:-.014em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .fh-ct{margin-left:auto;font-size:11px;color:var(--text-muted);
  white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.fh-act{display:flex;align-items:center;gap:5px;padding:0 15px 11px 35px;flex-wrap:wrap}

/* ---------- 자동화 도구 ---------- */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));
  gap:10px;margin-bottom:14px}
.toolcard{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;
  background:var(--bg-secondary);transition:.16s var(--ease)}
.toolcard.on{border-color:var(--text-primary);background:var(--bg-card);
  box-shadow:var(--shadow-sm)}
.tc-head{display:flex;align-items:center;gap:10px;min-width:0}
.tc-ic{font-size:18px;flex-shrink:0}
.tc-nm{font-size:13.5px;font-weight:700;color:var(--text-primary);min-width:0;
  letter-spacing:-.016em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-meta{margin-left:auto;font-size:11px;color:var(--text-muted);white-space:nowrap}
.toolrun{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  margin-bottom:16px;background:var(--bg-card);box-shadow:var(--shadow-sm)}
.tr-bar{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13px;
  font-weight:700;border-bottom:1px solid var(--border);background:var(--bg-input);
  letter-spacing:-.016em}
.tr-frame{width:100%;height:78vh;border:0;display:block;background:#fff}

/* ---------- 사진 미리보기 ---------- */
.picsec{margin-bottom:14px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px}
.pic{padding:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  background:var(--bg-secondary);cursor:zoom-in;display:flex;flex-direction:column;
  font-family:inherit;transition:.16s var(--ease)}
.pic:hover{border-color:var(--border-light);box-shadow:var(--shadow-md);
  transform:translateY(-2px)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg-hover)}
.pic .pic-nm{font-size:10.5px;color:var(--text-muted);padding:6px 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.picbox{position:fixed;inset:0;z-index:200;background:rgba(8,9,11,.92);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center}
.pb-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:14px 18px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;
  font-size:13px}
.pb-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:45vw}
.pb-ct{font-size:11.5px;opacity:.7;white-space:nowrap}
.pb-img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:var(--r-sm);
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;
  border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;
  line-height:1;cursor:pointer;font-family:inherit;transition:.15s var(--ease);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pb-nav:hover{background:rgba(255,255,255,.26)}
.pb-prev{left:20px} .pb-next{right:20px}

/* ---------- 파일 정리 ---------- */
.tidylist{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--bg-secondary)}
.tidyrow{display:flex;align-items:flex-start;gap:13px;padding:12px 15px;
  transition:.14s var(--ease)}
.tidyrow + .tidyrow{border-top:1px solid var(--border)}
.tidyrow.busy{opacity:.4}
.tidy-th{width:88px;height:66px;object-fit:cover;border-radius:var(--r-sm);flex-shrink:0;
  background:var(--bg-hover);border:1px solid var(--border)}
.tidy-ic{display:flex;align-items:center;justify-content:center;font-size:26px}
.tidy-mid{flex:1;min-width:0}
.tidy-nm{font-size:13.5px;font-weight:600;color:var(--text-primary);
  word-break:break-all;line-height:1.45;letter-spacing:-.014em}
.tidysel{max-width:280px;font-size:12px;padding:5px 8px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)}

/* ---------- 화이트보드 (판) ---------- */
.wb-wrap{position:relative;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--bg-sunken);overflow:hidden;height:calc(100vh - 250px);min-height:440px;
  touch-action:none;user-select:none;-webkit-user-select:none}
.wb-wrap.grab{cursor:grab}
.wb-wrap.grabbing{cursor:grabbing}
.wb-canvas{position:absolute;top:0;left:0;transform-origin:0 0;
  background-image:radial-gradient(circle,var(--border-light) 1px,transparent 1px);
  background-size:26px 26px;width:12000px;height:8000px}
.wb-edges{position:absolute;top:0;left:0;width:12000px;height:8000px;pointer-events:none;
  overflow:visible}
.wb-edges path{fill:none;stroke:var(--text-muted);stroke-width:2}
.wb-edges .hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.wb-edges g.on path{stroke:var(--blue)}

.wb-n{position:absolute;border-radius:var(--r);box-sizing:border-box;
  display:flex;flex-direction:column;cursor:grab;user-select:none;
  box-shadow:var(--shadow-sm);overflow:hidden}
.wb-n.on{box-shadow:0 0 0 2px var(--blue),var(--shadow-md);z-index:5}
.wb-n.on2{box-shadow:0 0 0 2px var(--purple),var(--shadow-md);z-index:4}
.wb-marq{position:absolute;border:1.5px dashed var(--blue);background:var(--blue-soft);
  pointer-events:none;z-index:30;border-radius:4px}
.wb-many{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:22;
  display:flex;gap:3px;align-items:center;background:var(--bg-card);
  border:1px solid var(--border);border-radius:99px;padding:4px 8px;
  box-shadow:var(--shadow-md);white-space:nowrap;font-size:12px}
.wb-many b{color:var(--purple);margin-right:4px}
.wb-many button{border:none;background:transparent;font-family:inherit;font-size:12px;
  padding:3px 7px;border-radius:99px;cursor:pointer;color:var(--text-secondary)}
.wb-many button:hover{background:var(--bg-hover);color:var(--text-primary)}
.wb-many button.danger:hover{background:rgba(217,59,59,.12);color:var(--red)}
.wb-many .sw{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.12);
  cursor:pointer;padding:0}
.wb-many .sep{width:1px;height:15px;background:var(--border);margin:0 3px}
.wb-n.drag{cursor:grabbing;z-index:9;box-shadow:var(--shadow-lg)}
.wb-n .bd{flex:1;min-height:0;padding:9px 11px;font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;overflow:hidden}
.wb-n textarea{flex:1;width:100%;border:none;background:transparent;resize:none;
  font-family:inherit;font-size:12.5px;line-height:1.55;padding:9px 11px;color:inherit;
  outline:none;user-select:text;-webkit-user-select:text;cursor:text}
.wb-n .hd{font-weight:800;font-size:12.5px;padding:8px 11px 0;letter-spacing:-.01em}

.wb-n.k-note{border:1px solid rgba(0,0,0,.06)}
.wb-n.k-box{background:var(--bg-card);border:1px solid var(--border)}
.wb-n.k-text{background:transparent;box-shadow:none;border:1px dashed transparent}
.wb-n.k-text .bd{font-size:17px;font-weight:800;letter-spacing:-.02em;padding:4px 6px;
  color:var(--text-primary)}
.wb-n.k-text:hover{border-color:var(--border-light)}
.wb-n.k-table{background:var(--bg-card);border:1px solid var(--border)}
.wb-n.k-media{background:#1b1d22;border:1px solid var(--border);padding:0}
.wb-n.k-media .bd{padding:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#1b1d22}
.wb-n.k-media img,.wb-n.k-media video{width:100%;height:100%;object-fit:contain;display:block}
.wb-n.k-media .up{color:#c8cad0;font-size:12px;text-align:center;padding:10px;line-height:1.6}
.wb-n.k-media .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);
  color:#fff;font-size:10.5px;padding:3px 7px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none}
.wb-n.k-table .bd{padding:0;overflow:auto}
.wb-tb{width:100%;border-collapse:collapse;font-size:11.5px}
.wb-tb td{border:1px solid var(--border);padding:5px 7px;color:var(--text-secondary);
  vertical-align:top}
.wb-tb tr:first-child td{background:var(--bg-sunken);color:var(--text-primary);font-weight:700}
.wb-tb input{width:100%;border:none;background:transparent;font-family:inherit;
  font-size:11.5px;color:inherit;font-weight:inherit;padding:0;outline:none;min-width:0}
.wb-tb input:focus{background:var(--blue-soft);border-radius:3px}
.wb-tb td.on{padding:4px 6px}
.wb-pick{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:22;
  display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:8px 11px;box-shadow:var(--shadow-lg);max-width:calc(100% - 24px)}
.wb-pick .lb{font-size:12px;font-weight:700;color:var(--text-muted);margin-right:3px}
.wb-pick button{border:1px solid var(--border);background:var(--bg-input);
  font-family:inherit;font-size:12px;padding:5px 10px;border-radius:99px;cursor:pointer;
  color:var(--text-secondary);white-space:nowrap}
.wb-pick button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.wb-pick .x{border:none;background:transparent;font-size:14px;padding:4px 6px}

.wb-n .rz{position:absolute;right:0;bottom:0;width:15px;height:15px;cursor:nwse-resize;
  opacity:0}
.wb-n.on .rz{opacity:1;background:linear-gradient(135deg,transparent 48%,var(--blue) 48%)}
.wb-tools{position:absolute;display:flex;gap:3px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:99px;padding:3px 5px;box-shadow:var(--shadow-md);
  z-index:20;white-space:nowrap}
.wb-tools button{border:none;background:transparent;font-family:inherit;font-size:12px;
  padding:3px 7px;border-radius:99px;cursor:pointer;color:var(--text-secondary)}
.wb-tools button:hover{background:var(--bg-hover);color:var(--text-primary)}
.wb-tools button.danger:hover{background:rgba(217,59,59,.12);color:var(--red)}
.wb-tools .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12);
  cursor:pointer;padding:0}
.wb-tools .sw.on{box-shadow:0 0 0 2px var(--blue)}

.wb-bar{position:absolute;left:12px;bottom:12px;display:flex;gap:5px;align-items:center;
  background:var(--bg-card);border:1px solid var(--border);border-radius:99px;
  padding:5px 8px;box-shadow:var(--shadow-md);z-index:15;font-size:12px}
.wb-bar button{border:none;background:transparent;font-family:inherit;font-size:12.5px;
  font-weight:600;padding:4px 9px;border-radius:99px;cursor:pointer;color:var(--text-secondary)}
.wb-bar button:hover{background:var(--bg-hover);color:var(--text-primary)}
.wb-bar .z{min-width:44px;text-align:center;color:var(--text-muted);font-variant-numeric:tabular-nums}
.wb-hint{position:absolute;right:12px;bottom:12px;z-index:15;font-size:11.5px;
  pointer-events:none;opacity:.9;
  color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);
  border-radius:99px;padding:5px 11px;box-shadow:var(--shadow-sm)}
.wb-link{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;
  background:var(--blue);color:#fff;font-size:12px;font-weight:700;border-radius:99px;
  padding:6px 14px;box-shadow:var(--shadow-md)}
.wb-n.pick{cursor:crosshair;box-shadow:0 0 0 2px var(--blue)}

@media(max-width:620px){
  .wb-wrap{height:calc(100vh - 210px);min-height:360px}
  .wb-hint{display:none}
}

/* ---------- 개인 그로스보드 ---------- */
.gb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.gb-search{flex:1 1 260px;min-width:180px;position:relative}
.gb-search input{width:100%;font-family:inherit;font-size:13px;padding:8px 12px 8px 32px;
  border-radius:var(--r);border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-primary)}
.gb-search input:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.gb-search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:12.5px;opacity:.5;pointer-events:none}

.gb-goal{display:flex;flex-direction:column;gap:6px;margin:2px 0 14px}
.gb-goal label{font-size:12px;font-weight:700;color:var(--text-muted)}
.gb-goal textarea{width:100%;min-height:44px;resize:vertical;font-family:inherit;
  font-size:14px;line-height:1.6;padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)}
.gb-goal textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}

/* 지표 타일 — 이름 · 큰 % · 얇은 막대 · 아래 세 칸 */
.gb-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));
  gap:11px;margin-bottom:14px}
.gb-kpi{position:relative;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--bg-card);padding:12px 14px 10px;box-shadow:var(--shadow-sm)}
.gb-kpi .nm{width:100%;border:none;background:transparent;font-family:inherit;
  font-size:12px;font-weight:700;color:var(--text-muted);padding:0 0 4px;
  letter-spacing:-.01em}
.gb-kpi .nm:focus{outline:none;color:var(--text-primary)}
.gb-kpi .pct{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.035em}
.gb-kpi .pct.none{font-size:11.5px;font-weight:600;color:var(--text-muted);line-height:2.6}
.gb-kpi .bar{height:3px;border-radius:99px;background:var(--bg-sunken);overflow:hidden;
  margin:8px 0 9px}
.gb-kpi .fill{height:100%;border-radius:99px;transition:width .3s var(--ease)}
.gb-kpi .cells{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);
  overflow:hidden}
.gb-kpi .cell{background:var(--bg-input);padding:5px 4px;text-align:center;min-width:0}
.gb-kpi .cell .k{display:block;font-size:9.5px;font-weight:700;color:var(--text-muted);
  letter-spacing:.02em}
.gb-kpi .cell .v{display:block;font-size:12.5px;font-weight:700;color:var(--text-primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb-kpi .cell input{width:100%;border:none;background:transparent;font-family:inherit;
  font-size:12.5px;font-weight:700;text-align:center;color:var(--text-primary);padding:0;
  min-width:0}
.gb-kpi .cell input:focus{outline:none;background:var(--blue-soft);border-radius:3px}
.gb-kpi .foot{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;
  color:var(--text-muted)}
.gb-kpi .mode{display:inline-flex;border:1px solid var(--border);border-radius:99px;
  overflow:hidden;flex:0 0 auto}
.gb-kpi .mode button{border:none;background:var(--bg-input);color:var(--text-muted);
  font-family:inherit;font-size:10px;font-weight:700;padding:2px 7px;cursor:pointer}
.gb-kpi .mode button.on{background:var(--ink);color:#fff}
/* 📷 사진으로 뽑을 때 — 고치는 단추와 빈 칸은 감춥니다 */
.gb-shot .gb-top,.gb-shot .gb-sedit,.gb-shot .gb-add,.gb-shot .gb-foot,
.gb-shot .gb-kpi .x,.gb-shot .gb-act .rm,.gb-shot .gb-radd,
.gb-shot .sec-bar,.gb-shot .gb-filter,
.gb-shot .gb-help,.gb-shot .gb-tpl,.gb-shot .gb-sedit{display:none!important}
.gb-shot .gb-ih .btn,.gb-shot .gb-kpi .foot{display:none}
.gb-shot .gb-kpi{box-shadow:none}
.gb-shot .gb-ih select{border-color:transparent;background:transparent;
  -webkit-appearance:none;appearance:none;padding-right:6px}
.gb-shot input,.gb-shot textarea,.gb-shot select{border-color:transparent!important;
  background:transparent!important;box-shadow:none!important}
.gb-shot .gb-kpi .cell input{background:transparent!important}
.gb-shot .gb-item,.gb-shot .gb-stage{break-inside:avoid}
/* 사진 안에서는 한 일마다 속을 다 펴서 담습니다 */
.gb-full{display:flex;flex-direction:column;gap:10px}
.gb-full .gb-item{margin-bottom:0}
.gb-shot .gb-ih{padding:10px 13px}
.gb-shot .gb-ih .tt{font-size:15px;word-break:break-word}
.gb-shot .gb-ih .no{width:22px;height:22px;font-size:12px}
/* 사진으로 뽑을 때 글자로 보여주는 칸 (입력칸은 긴 글이 잘려 나옵니다) */
.gb-ro{font-size:14px;line-height:1.65;color:var(--text-primary);white-space:pre-wrap;
  word-break:break-word;padding:8px 11px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg-card)}
.gb-goal .gb-ro{font-size:14px;line-height:1.75;background:var(--bg-input)}
/* 📖 처음 쓰는 사람을 위한 안내 */
.gb-help{border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);
  padding:14px 16px;margin:0 0 14px}
.gb-help .hh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;
  color:var(--text-primary);margin-bottom:8px}
.gb-help .hh .btn{margin-left:auto}
.gb-help .lead{margin:0 0 12px;font-size:12.5px;line-height:1.75;color:var(--text-secondary)}
.gb-help .lead b{color:var(--text-primary)}
.gb-help .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;
  margin-bottom:12px}
.gb-help .s{display:flex;flex-direction:column;gap:2px;min-width:0;padding:9px 11px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-input)}
.gb-help .s b{font-size:10.5px;color:#fff;background:var(--ink);width:17px;height:17px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.gb-help .s .t{font-size:12.5px;font-weight:700;color:var(--text-primary)}
.gb-help .s .d{font-size:11.5px;line-height:1.55;color:var(--text-muted)}
.gb-help .four{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;
  margin-bottom:10px}
.gb-help .fh{padding:7px 11px;background:var(--bg-input);font-size:11.5px;font-weight:700;
  color:var(--text-secondary);border-bottom:1px solid var(--border)}
.gb-help .r{display:flex;gap:10px;padding:7px 11px;border-top:1px solid var(--border);
  flex-wrap:wrap}
.gb-help .r:first-of-type{border-top:none}
.gb-help .r .t{flex:0 0 118px;font-size:12px;font-weight:700;color:var(--text-primary)}
.gb-help .r .d{flex:1 1 200px;min-width:0;font-size:11.5px;line-height:1.6;color:var(--text-muted)}
.gb-help .tip{font-size:11.5px;line-height:1.65;color:var(--text-muted)}
.gb-help .tip b{color:var(--text-primary)}
@media(max-width:640px){.gb-help .r .t{flex:1 1 100%}}

/* 서식 고르기 */
.gb-add.on{border-color:var(--ink);color:var(--text-primary);font-weight:700}
.gb-tpl{margin:8px 0 2px;padding:11px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--bg-input);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:7px}
.gb-tpl .hd{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--text-primary)}
.gb-tpl .hd span{font-weight:400;color:var(--text-muted);font-size:11.5px}
.gb-tpl button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
  min-width:0;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-card);cursor:pointer;font-family:inherit}
.gb-tpl button:hover{border-color:var(--ink)}
.gb-tpl button b{font-size:12.5px;color:var(--text-primary)}
.gb-tpl button span{font-size:11px;line-height:1.5;color:var(--text-muted)}

/* 📦 브랜드플로우 백업 옮기기 — 어느 보드로 보낼지 고르는 표 */
.bf-list{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.bf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-input)}
.bf-row.on{border-color:var(--purple)}
.bf-row .nm{font-size:12.5px;font-weight:700;color:var(--text-primary);min-width:0}
.bf-row .ct{font-size:11.5px;color:var(--text-muted);min-width:0}
.bf-row .ar{margin-left:auto;color:var(--text-muted);font-size:12px}
.bf-row select{font-family:inherit;font-size:12px;padding:4px 8px;
  border:1px solid var(--border);border-radius:var(--r-xs);
  background:var(--bg-card);color:var(--text-primary)}
@media(max-width:640px){.bf-row .ar{margin-left:0}.bf-row select{flex:1 1 100%}}
.gb-kpi .x{position:absolute;top:6px;right:7px;border:none;background:transparent;
  color:var(--text-muted);font-size:15px;line-height:1;cursor:pointer;padding:2px 4px;
  border-radius:var(--r-xs);opacity:0}
.gb-kpi:hover .x{opacity:1}
.gb-kpi .x:hover{background:var(--bg-hover);color:var(--red)}

/* 상태로 거르는 줄 */
.gb-filter{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.gb-filter .lb{font-size:11.5px;color:var(--text-muted);margin-right:2px}
.gb-filter button{border:1px solid var(--border);background:var(--bg-input);
  font-family:inherit;font-size:11.5px;font-weight:600;color:var(--text-secondary);
  padding:4px 11px;border-radius:99px;cursor:pointer}
.gb-filter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gb-filter button b{margin-left:4px;opacity:.75}

/* 단계 — 띠 모양 머리 */
.gb-stage{border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--bg-secondary);margin-bottom:10px;overflow:hidden}
.gb-sh{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;
  user-select:none;border:none;width:100%;text-align:left;font-family:inherit;
  background:var(--bg-sunken);border-left:3px solid var(--hue,var(--text-muted))}
.gb-sh:hover{filter:brightness(.985)}
.gb-sh .ar{color:var(--text-muted);font-size:10px;width:10px;flex:0 0 auto}
.gb-sh .no{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--hue,var(--text-muted))}
.gb-sh .nm{font-size:13.5px;font-weight:800;color:var(--text-primary);letter-spacing:-.02em;
  flex:0 0 auto}
.gb-sh .ds{font-size:12px;color:var(--text-muted);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gb-sh .ct{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:700;
  color:var(--text-muted)}
.gb-sb{border-top:1px solid var(--border);padding:10px 12px 12px;background:var(--bg-primary)}
.gb-sedit{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.gb-sedit input{flex:1 1 180px;font-family:inherit;font-size:12.5px;padding:6px 9px;
  border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-primary)}

/* 업무 — 연한 띠 머리 */
.gb-item{border:1px solid var(--border);border-radius:var(--r);background:var(--bg-card);
  margin-bottom:8px;overflow:hidden}
.gb-ih{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--blue-soft)}
.gb-ih .ar{border:none;background:transparent;color:var(--text-muted);font-size:10px;
  cursor:pointer;padding:2px 3px;flex:0 0 auto}
.gb-ih .no{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800}
.gb-ih .tt{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;
  font-size:13px;font-weight:700;color:var(--text-primary);padding:2px 0;
  letter-spacing:-.015em}
.gb-ih .tt:focus{outline:none;border-bottom:1px solid var(--blue)}
.gb-ih select{font-family:inherit;font-size:11px;padding:3px 6px;border-radius:99px;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
  max-width:150px}
.gb-ih select.st{max-width:82px;font-weight:700}
.gb-item.done .gb-ih{background:var(--bg-sunken)}
.gb-item.done .gb-ih .no{background:var(--green)}
.gb-item.done .gb-ih .tt{color:var(--text-muted);text-decoration:line-through}
.gb-none{padding:9px 12px;font-size:12px;color:var(--text-muted);
  border-top:1px solid var(--border)}

.gb-kpi .brd{font-size:10.5px;font-weight:800;color:var(--text-muted);
  margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb-kpi .who{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 9px;
  border-top:1px solid var(--border);font-size:10.5px;color:var(--text-muted)}
.gb-kpi .who b{color:var(--text-primary)}

/* 사람 보드의 브랜드 탭 */
.gb-btabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;
  border-bottom:1px solid var(--border);padding-bottom:10px}
.gb-btabs button{border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-family:inherit;font-size:13px;font-weight:700;
  padding:7px 14px;border-radius:99px;cursor:pointer}
.gb-btabs button b{color:var(--text-muted);font-size:11.5px;margin-left:2px}
.gb-btabs button:hover{border-color:var(--ink)}
.gb-btabs button.on{border-color:var(--hue,var(--ink));background:var(--hue,var(--ink));
  color:#fff}
.gb-btabs button.on b{color:rgba(255,255,255,.8)}

/* ── 브랜드 한 화면 (지금 | 여기까지) ─────────────────────────── */


/* ── 📜 연혁 라인 ── 선 하나에 마디가 찍힙니다 ── */
.hl-now{border:1px solid var(--border);border-top:3px solid var(--ink);
  border-radius:var(--r-md);background:var(--bg-card);padding:14px 16px;margin:0 0 4px;
  position:relative}
.hl-now > .hd{font-size:15px;font-weight:800;color:var(--text-primary);
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.hl-now > .hd span{font-size:11.5px;font-weight:400;color:var(--text-muted)}
.hl-now > .hd .btn{margin-left:auto;align-self:center}
.hl-now .one{width:100%;box-sizing:border-box;font-family:inherit;font-size:15.5px;
  font-weight:700;line-height:1.6;padding:10px 13px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg-input);color:var(--text-primary);
  resize:none;overflow:hidden;min-height:44px}
.hl-now .one:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.nw-list{margin-top:10px;border-top:1px solid var(--border)}
.nw-a{border-bottom:1px solid var(--border)}
.nw-a > .hd{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 2px;border:none;background:none;cursor:pointer;font-family:inherit}
.nw-a > .hd:hover{background:var(--bg-sunken)}
.nw-a .ic{flex:0 0 auto;font-size:14px}
.nw-a .nm{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--text-primary);
  min-width:104px}
.nw-a .vl{flex:1;min-width:0;font-size:12.5px;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw-a.no .vl{color:var(--text-muted)}
.nw-a .ct{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:2px 7px}
.nw-a .ar{flex:0 0 auto;font-size:11px;color:var(--text-muted)}
.nw-a.open > .hd{background:var(--bg-sunken)}
.nw-a .bd{padding:4px 2px 12px}
.bx-f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.bx-f label{font-size:12px;font-weight:700;color:var(--text-secondary)}
.bx-f textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;
  line-height:1.7;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-input);color:var(--text-primary);resize:none;overflow:hidden;
  min-height:56px}
.bx-f textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}

.hl-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:14px 0 4px}
.hl-bar .sp{flex:1}
.lf{border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
  font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;
  cursor:pointer;white-space:nowrap}
.lf b{color:var(--text-muted);font-size:10.5px;margin-left:3px}
.lf:hover{border-color:var(--ink)}
.lf.on{border-color:var(--ink);background:var(--ink);color:#fff}
.lf.on b{color:rgba(255,255,255,.8)}

.hl{position:relative;margin:10px 0 0;padding:2px 0 4px 30px}
.hl:before{content:'';position:absolute;left:9px;top:6px;bottom:34px;width:2px;
  background:linear-gradient(var(--ink), var(--border-light))}
.hl-y{position:relative;margin:18px 0 9px;font-size:13px;font-weight:800;
  color:var(--text-primary);letter-spacing:.02em}
.hl-y:first-child{margin-top:4px}
.hl-y:before{content:'';position:absolute;left:-27px;top:2px;width:14px;height:14px;
  border-radius:50%;background:var(--bg-page);border:2px solid var(--ink)}
.hl-i{position:relative;margin:0 0 8px;border:1px solid var(--border);border-radius:11px;
  background:var(--bg-card);padding:10px 13px;cursor:pointer}
.hl-i:hover{border-color:var(--blue)}
.hl-i:before{content:'';position:absolute;left:-25px;top:15px;width:10px;height:10px;
  border-radius:50%;background:var(--blue);border:2px solid var(--bg-page)}
.hl-i.k-ev:before{background:var(--blue)}
.hl-i.k-sh:before{background:var(--purple)}
.hl-i.k-wd:before{background:var(--orange)}
.hl-i.k-fl:before{background:var(--red)}
.hl-i.k-gap{background:transparent;border-style:dashed;opacity:.9}
.hl-i.k-gap:before{background:var(--bg-page);border-color:var(--text-muted)}
.hl-i.open{cursor:default;border-color:var(--ink);background:var(--bg-card);
  display:flex;flex-direction:column;gap:7px;padding:12px 14px}
.hl-i .dt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.hl-i .dt .d{font-size:11.5px;font-weight:800;color:var(--text-primary)}
.hl-i .dt .kd,.hl-i .dt .ax{font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:2px 8px}
.hl-i .dt .gs{font-size:10.5px;font-weight:800;color:var(--orange);
  border:1px solid var(--orange);border-radius:99px;padding:1px 7px}
.hl-i .ti{font-size:14px;font-weight:700;line-height:1.6;color:var(--text-primary);
  white-space:pre-wrap;word-break:break-word}
.hl-i .ti i{font-weight:400;color:var(--text-muted)}
.hl-i .sc{margin-top:4px;font-size:11.5px;color:var(--text-muted);line-height:1.6}
.hl-x{margin-left:auto;display:flex;gap:2px}
.hl-x button{border:none;background:none;color:var(--text-muted);cursor:pointer;
  font-size:13px;padding:3px 6px;border-radius:6px}
.hl-x button:hover{background:var(--bg-sunken);color:var(--text-primary)}
.hl-x button.x:hover{color:var(--red)}
.hl-none{font-size:13px;color:var(--text-muted);line-height:1.8;padding:8px 0 4px}
.hl-add{position:relative;display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.hl-add:before{content:'';position:absolute;left:-25px;top:9px;width:10px;height:10px;
  border-radius:50%;background:var(--bg-page);border:2px dashed var(--text-muted)}
@media(max-width:640px){
  .nw-a > .hd{flex-wrap:wrap}
  .nw-a .nm{min-width:0}
  .nw-a .vl{flex:1 1 100%;white-space:normal}
}

/* ── 📜 브랜드 히스토리 ───────────────────────────────────────── */
.ht-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px;
  border-bottom:1px solid var(--border);padding-bottom:10px}
.ht-tabs button{border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-family:inherit;font-size:12.5px;font-weight:700;
  padding:7px 13px;border-radius:99px;cursor:pointer}
.ht-tabs button b{color:var(--text-muted);font-size:11px;margin-left:2px}
.ht-tabs button:hover{border-color:var(--ink)}
.ht-tabs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.ht-tabs button.on b{color:rgba(255,255,255,.8)}
.ht-sec{border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);
  padding:14px 16px;margin:0 0 14px}
.ht-sec > .hd{font-size:14.5px;font-weight:800;color:var(--text-primary);
  padding-bottom:10px;margin-bottom:11px;border-bottom:2px solid var(--border);
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ht-sec > .hd span{font-size:11.5px;font-weight:400;color:var(--text-muted)}
.hxb textarea,.hxb input{width:100%;box-sizing:border-box;font-family:inherit;
  border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:14px;
  line-height:1.65;background:var(--bg-card);color:var(--text-primary)}
.hxb textarea{resize:none;overflow:hidden;min-height:38px}
.hxb textarea:focus,.hxb input:focus,.hxb select:focus{outline:none;
  border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.hxb select{font-family:inherit;font-size:12.5px;padding:6px 9px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)}
.ht-ev,.ht-shift,.ht-word,.ht-fail{border:1px solid var(--border);border-radius:10px;
  background:var(--bg-input);padding:10px 12px;margin-bottom:8px;
  display:flex;flex-direction:column;gap:6px}
.ht-ev{border-left:3px solid var(--blue)}
.ht-ev.gap{border-left-style:dashed;border-left-color:var(--text-muted);opacity:.85}
.ht-shift{border-left:3px solid var(--purple)}
.ht-word{border-left:3px solid var(--orange)}
.ht-fail{border-left:3px solid var(--red)}
.hxb .rh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hxb .rh input{flex:1 1 180px}
.hxb .tl{margin-left:auto;display:flex;gap:2px}
.hxb .tl button{border:none;background:none;color:var(--text-muted);cursor:pointer;
  font-size:13px;padding:3px 5px;border-radius:6px}
.hxb .tl button:hover{background:var(--bg-card);color:var(--text-primary)}
.hxb .tl button.x:hover{color:var(--red)}
.ht-guess{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  color:var(--text-muted);cursor:pointer;white-space:nowrap}
.ht-guess input{width:14px!important;height:14px;flex:0 0 auto;padding:0;min-height:0}
.ht-guess.on{color:var(--orange)}
.hxb .ba{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.hxb .ba > label{flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:3px}
.hxb .ba > .ar{padding-top:24px;color:var(--text-muted);font-size:15px}
.hxb .wy{display:flex;flex-direction:column;gap:3px}
.hxb .k{font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--text-muted)}
.hxb .k.b{color:var(--text-muted)}
.hxb .k.a{color:var(--green)}
.hxb .k.w{color:var(--blue)}
.hxb .k.x{color:var(--red)}
.hxb .k.s{color:var(--text-muted)}
@media(max-width:640px){.hxb .ba > .ar{display:none}}

/* ── 🧭 걸어온 길 ─────────────────────────────────────────────── */
/* 780px 은 글을 읽히려고 잡은 폭입니다. 이제 카드와 표가 들어차니
   그 폭으로는 칸이 셋씩 쪼개집니다. 판은 넓히고, <<줄글만>> 읽기 좋은
   폭에 묶어 둡니다 — 한 줄이 너무 길면 눈이 다음 줄을 못 찾습니다. */
.pw{max-width:1040px}
.ob-what,.pw-sum,.pw-hero .lns,.id-tgt .iv-v{max-width:780px}
.pw-top{padding:2px 0 22px;margin-bottom:4px;border-bottom:2px solid var(--border)}
.pw-nm{font-size:12.5px;font-weight:800;color:var(--text-muted);letter-spacing:.02em;
  margin-bottom:11px}
.pw-sum{margin:0;font-size:17.5px;font-weight:700;line-height:1.85;
  color:var(--text-primary);letter-spacing:-.022em;white-space:pre-wrap;word-break:keep-all}
.pw-sum.no{font-size:14px;font-weight:400;color:var(--text-muted)}

/* ── 🪪 한눈 카드 — 스크롤하기 전에 이 브랜드가 뭔지 3초에 ─────────── */
.pw-hero{margin:16px 0 26px;padding:22px 24px 20px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--bg-card);box-shadow:var(--shadow-sm)}
/* 비어 있는 슬로건 자리 — 크기는 줄이고 「적어 주세요」 로만 남깁니다 */
.pw-hero .slg.non{font-size:18px;font-weight:700;letter-spacing:-.01em;
  color:var(--text-muted)}
.pw-hero .slg{font-size:26px;font-weight:800;line-height:1.45;letter-spacing:-.035em;
  color:var(--text-primary);word-break:keep-all}
.pw-hero .lns{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.pw-hero .ln{display:flex;gap:13px;align-items:baseline}
.pw-hero .ln b{flex:0 0 42px;font-size:11.5px;font-weight:800;color:var(--text-muted);
  letter-spacing:.02em}
.pw-hero .ln span{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.7;
  color:var(--text-secondary);word-break:keep-all}
.pw-hero .sws{display:flex;gap:6px;margin-top:15px}
.pw-hero .sws i{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.pw-hero .sws i[data-no]{background:repeating-linear-gradient(45deg,
  var(--bg-sunken) 0 5px,var(--border-light) 5px 10px)}
.pw-hero .sts{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px;padding-top:15px;
  border-top:1px solid var(--border)}
.pw-hero .sts button{display:flex;flex-direction:column;gap:1px;align-items:flex-start;
  font-family:inherit;padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-sunken);cursor:pointer;min-width:74px}
.pw-hero .sts button:hover{border-color:var(--blue);background:var(--blue-soft)}
.pw-hero .sts b{font-size:19px;font-weight:800;letter-spacing:-.02em;
  color:var(--text-primary);font-variant-numeric:tabular-nums;line-height:1.15}
.pw-hero .sts span{font-size:11.5px;font-weight:700;color:var(--text-muted);
  white-space:nowrap}
@media(max-width:560px){
  .pw-hero{padding:18px 16px 16px}
  .pw-hero .slg{font-size:21px}
  .pw-hero .sts button{flex:1 1 84px;min-width:0}
}

/* ── 🕰 가로 연표 — 2022 → 지금이 한 줄로 보이게 ─────────────────── */
.pw-tl{overflow-x:auto;margin:0 0 16px;padding-bottom:6px}
.tl-in{display:flex;align-items:flex-start;min-width:min-content}
.tl-y{flex:0 0 auto;min-width:126px;max-width:196px;padding-right:14px}
.tl-in{padding-right:4px}
.tl-y .yn{font-size:12px;font-weight:800;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;white-space:nowrap;margin-bottom:7px}
.tl-y .ax{position:relative;height:11px;margin-bottom:9px}
.tl-y .ax::before{content:'';position:absolute;left:0;right:-14px;top:5px;height:1px;
  background:var(--border)}
.tl-y:last-child .ax::before{right:0}
.tl-y .ax i{position:absolute;left:0;top:1px;width:9px;height:9px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 3px var(--bg-primary)}
.tl-y .cs{display:flex;flex-direction:column;gap:5px}
.tl-c{display:flex;align-items:baseline;gap:6px;text-align:left;font-family:inherit;
  font-size:12.5px;font-weight:700;line-height:1.5;padding:6px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
  cursor:pointer;word-break:keep-all}
.tl-c:hover{border-color:var(--blue);color:var(--blue)}
.tl-c i{flex:0 0 auto;font-style:normal;font-size:11px}
.tl-c span{flex:1 1 auto;min-width:0}
.tl-c.p-st{border-left:3px solid var(--green)}
.tl-c.p-tn{border-left:3px solid var(--yellow)}
.tl-c.p-no{border-left:3px solid var(--red)}
.tl-c.p-nw{border-left:3px solid var(--blue)}
.pw-meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pw-meta span{font-size:11.5px;font-weight:700;color:var(--text-secondary);
  background:var(--bg-sunken);border:1px solid var(--border-light);border-radius:99px;
  padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}

.pw-line{position:relative;padding-left:40px;margin-top:4px}
.pw-line:before{content:'';position:absolute;left:14px;top:15px;bottom:26px;width:2px;
  background:linear-gradient(var(--border-light), var(--ink))}
/* 연도 — 기업 히스토리 영상처럼 줄기에 해가 박힙니다 */
.pw-yr{position:relative;display:flex;align-items:center;gap:12px;margin:34px 0 2px}
.pw-yr:first-child{margin-top:4px}
.pw-yr b{font-size:23px;font-weight:800;line-height:1;letter-spacing:-.035em;
  color:var(--text-primary);font-variant-numeric:tabular-nums;white-space:nowrap}
.pw-yr i{flex:1 1 auto;min-width:0;height:1px;background:var(--border);font-style:normal}
.pw-yr:before{content:'';position:absolute;left:-29.5px;top:50%;margin-top:-4px;
  width:9px;height:9px;border-radius:50%;background:var(--ink)}

.pw-ch{position:relative;padding:22px 0}
.pw-ch .no{position:absolute;left:-40px;top:22px;width:29px;height:29px;border-radius:50%;
  background:var(--bg-page);border:2px solid var(--border);color:var(--text-muted);
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.pw-ch.p-st .no{border-color:var(--blue);color:var(--blue)}
.pw-ch.p-tn .no{border-color:var(--purple);color:var(--purple)}
.pw-ch.p-ok .no{border-color:var(--green);color:var(--green)}
.pw-ch.p-no .no{border-color:var(--red);color:var(--red)}
.pw-ch.p-nw .no{border-color:var(--ink);background:var(--ink);color:#fff}
.pw-ch .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pw-ch .hd .wn{font-size:12.5px;font-weight:800;color:var(--text-primary)}
.pw-ch .hd .wn.non{font-weight:600;color:var(--text-muted)}
/* 갈래는 눌러서 고르는 단추입니다 — 글칸을 열면 오타가 들어가고
   그 마디는 색도 아이콘도 잃습니다 */
.pw-ch .hd .kd{font-family:inherit;font-size:10.5px;font-weight:700;
  color:var(--text-muted);background:var(--bg-sunken);border:1px solid transparent;
  border-radius:99px;padding:2px 9px;cursor:pointer}
.pw-ch .hd .kd:hover{border-color:var(--border);color:var(--text-primary)}
.kd-pk{display:inline-flex;flex-wrap:wrap;gap:4px}
.kd-pk button{font-family:inherit;font-size:10.5px;font-weight:700;
  color:var(--text-secondary);background:var(--bg-card);border:1px solid var(--border);
  border-radius:99px;padding:3px 9px;cursor:pointer}
.kd-pk button:hover{border-color:var(--ink);color:var(--text-primary)}
.kd-pk button.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* 아직 안 적은 칸 — 이름만 보여 주고 적을 자리가 없으면 못 적습니다 */
.pw-chm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;margin-top:9px;
  font-size:11.5px;color:var(--text-muted)}
.pw-chm span{padding:2px 8px;border:1px dashed var(--border);border-radius:99px;
  cursor:pointer}
.pw-chm span:hover{border-style:solid;border-color:var(--ink);color:var(--text-primary)}
.pw-ch h3{margin:0 0 8px;font-size:17px;font-weight:800;line-height:1.5;
  color:var(--text-primary);letter-spacing:-.024em;word-break:keep-all}
.pw-ch p{margin:0 0 6px;font-size:14.5px;line-height:1.85;color:var(--text-primary);
  white-space:pre-wrap;word-break:keep-all}
.pw-ch p b{font-weight:800;color:var(--text-muted);font-size:12.5px;margin-right:2px}
.pw-ch p.wy{color:var(--text-secondary)}
.pw-ch p.nx{color:var(--red)}          /* .no 는 번호 동그라미가 씁니다 */
.pw-ch p.nx b{color:var(--red)}
.pw-ch p.sc{font-size:11.5px;color:var(--text-muted)}
.pw-turn{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  font-size:15.5px!important;font-weight:800!important;margin-bottom:8px!important}
/* 화살표만 보라색입니다 — 앞뒤 글까지 물들면 읽는 글이 아니라
   장식이 됩니다 (둘 다 눌러서 고치는 칸입니다) */
.pw-turn > span:not(.b4):not(.af){color:var(--purple);font-size:17px}
.pw-turn .b4,.pw-turn .af{min-width:0;word-break:keep-all}
.pw-turn .b4:empty::before,.pw-turn .af:empty::before{content:'＋';
  color:var(--text-muted)}
.pw-ph{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
.pw-ph a{display:block;max-width:280px;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;background:var(--bg-sunken);line-height:0}
.pw-ph a:hover{border-color:var(--blue)}
.pw-ph img{display:block;width:100%;height:auto;max-height:230px;object-fit:contain}
.pw-ph .file{display:inline-block;padding:9px 12px;font-size:12px;line-height:1.5;
  color:var(--text-secondary)}
.pw-none{font-size:14.5px;font-weight:700;color:var(--text-primary);line-height:1.9;
  padding:22px 0}
.pw-none span{font-size:13px;font-weight:400;color:var(--text-muted)}

.pw-src{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text-muted)}
.pw-src a{color:var(--text-secondary);text-decoration:none}
.pw-src a:hover{color:var(--blue);text-decoration:underline}

/* 온보딩 4단 */
.ob{padding:22px 0;border-bottom:1px solid var(--border)}
.ob:last-of-type{border-bottom:none}
.ob-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.ob-h .no{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ink);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;
  font-weight:800;align-self:center}
.ob-h h3{margin:0;font-size:21px;font-weight:800;color:var(--text-primary);
  letter-spacing:-.03em}
.ob-h .hn{font-size:12.5px;color:var(--text-muted)}
/* ✎ 두 번 눌러 고치는 자리 — 고칠 수 있다는 것이 보여야 눌러 봅니다.
   늘 밑줄을 그으면 글이 지저분해져서, 얹었을 때만 옅게 깔립니다. */
/* 고칠 수 있다는 것이 <<얹기 전에>> 보여야 합니다. 얹었을 때만 보이면
   휴대폰에서는 아예 안 보이고, 마우스로도 우연히 지나야 압니다.
   옅은 점선을 늘 깔아 둡니다 — 글은 안 가리고 「여기 누르면 된다」 만 남게. */
[data-ed]{border-radius:5px;cursor:pointer;
  box-shadow:inset 0 -1px 0 0 var(--border);
  transition:background .12s,box-shadow .12s}
[data-ed]:hover{background:var(--blue-soft);
  box-shadow:0 0 0 3px var(--blue-soft)}
[data-ed].ed-on{display:block;background:transparent;box-shadow:none;cursor:auto}
[data-ed] .fold,[data-ed] .fd-m{cursor:auto}
.ed-box{width:100%;box-sizing:border-box;font-family:inherit;font-size:inherit;
  font-weight:inherit;line-height:1.7;color:var(--text-primary);
  padding:6px 10px;border:1px solid var(--blue);border-radius:8px;
  background:var(--bg-input);resize:none;overflow:hidden;min-height:32px}
.ed-box:focus{outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
/* 고침 칸 아래 줄 — 눌러서 저장하는 단추. 「Ctrl+Enter」 만 적어 두면
   아무도 안 씁니다. */
.ed-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.ed-bar button{font-family:inherit;font-size:11.5px;font-weight:700;padding:4px 12px;
  border-radius:99px;border:1px solid var(--border);cursor:pointer;letter-spacing:0}
.ed-bar .ok{background:var(--blue);border-color:var(--blue);color:#fff}
.ed-bar .no{background:var(--bg-card);color:var(--text-muted)}
.ed-bar i{font-style:normal;font-size:10.5px;font-weight:400;color:var(--text-muted);
  letter-spacing:0}
.ed-tip{display:block;margin-top:3px;font-size:10.5px;font-weight:400;
  color:var(--text-muted);letter-spacing:0}
/* 한 번만 눌러도 열리는 칸은 눌러도 된다는 게 보여야 합니다 */

@media (hover:none){[data-ed]:hover{background:transparent;box-shadow:none}}
.ob-what{margin:0;font-size:15.5px;font-weight:700;line-height:1.85;
  color:var(--text-primary);white-space:pre-wrap;word-break:keep-all}
.pw-none2{margin:0;font-size:13px;color:var(--text-muted);line-height:1.8}

/* 지킬 것 — 어디에 쓰는 규칙인지 골라 보기 */
.ob-at{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.ob-at button{font-family:inherit;font-size:12px;font-weight:700;padding:5px 12px;
  border-radius:99px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.ob-at button:hover{border-color:var(--blue);color:var(--blue)}
.ob-at button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ob-at button b{font-weight:800;opacity:.7;margin-left:2px}
.ob-r .tx .ar{display:inline-block;font-size:10.5px;font-weight:800;color:var(--blue);
  background:var(--blue-soft);border-radius:99px;padding:2px 8px;margin-right:7px;
  vertical-align:2px;white-space:nowrap}
.ob-atn{margin:12px 0 0;font-size:11.5px;color:var(--text-muted)}
.pe-rl .rc input.ar{flex:1 1 220px;min-width:0;box-sizing:border-box;font-family:inherit;
  font-size:12.5px;padding:5px 9px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary)}
.pe-rl .rc input.ar:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}

/* 🖨 인쇄 — 한 장이 종이 한 쪽이 됩니다 */
.bk-print{max-width:none}
.bk-print .pp{display:none}            /* 화면에서는 안 보입니다 (인쇄용) */
@media print{
  /* 왼쪽 차림표 · 위쪽 줄 · 단추는 종이에 필요 없습니다 */
  .side,.topbar,.st-mode,.pt-get,.pt-box,.pw-gap,.ob-at,.pw-cards,
  .bk-nav,.bk-th,.bk-hint,.bk-ft,.pw-top,#usersLayer,#errBar,.toast,
  .fd-m,.tidybar,.pm-box,
  /* 브랜드 머리(이름·수정·삭제) 와 탭 줄은 화면의 것입니다 */
  .bhead,.tabs,.sec-bar,.ob-todo,.clashbar,.pw-tl{display:none!important}
  /* 장 안에 있는 단추도 종이에는 필요 없습니다 (✏️ 고치기 · ＋ 넣기 …) */
  .bk-print button,.bk-print .ob-q,.bk-print .pw-chm,
  .bk-print .ct-ed,.bk-print .cd-non,.bk-print .non{display:none!important}
  /* 목차와 큰 숫자는 <<단추로 만들어 두었을 뿐>> 표지의 알맹이입니다.
     종이책에 목차가 없으면 그건 책이 아닙니다 — 글자로 되살립니다. */
  .bk-print .pw-toc button,.bk-print .pw-nums button{display:flex!important;
    border:none!important;background:none!important;box-shadow:none!important;
    padding:0!important;cursor:default}
  .bk-print .pw-nums button{flex-direction:column;gap:2px}
  .bk-print .pw-toc li{page-break-inside:avoid}
  .layout{display:block!important}
  main{margin:0!important;padding:0!important;width:auto!important}
  .panel{border:none!important;box-shadow:none!important;background:#fff!important}
  .tabbody{padding:0!important}
  body{background:#fff!important}
  /* 접어 둔 글은 종이에서는 다 펴 둡니다 — 종이는 누를 수 없습니다 */
  .fold .fd-b{max-height:none!important;-webkit-mask-image:none!important;
    mask-image:none!important}
  details{display:block!important}
  details > *{display:revert!important}
  .bk-print .pp{display:block!important;page-break-after:always;break-after:page;
    padding:0 0 10mm}
  .bk-print .pp:last-child{page-break-after:auto;break-after:auto}
  .bk-print .pph{display:flex;align-items:center;gap:8px;margin-bottom:7mm;
    padding-bottom:2.5mm;border-bottom:1px solid #d4d7dd;
    font-size:9pt;font-weight:700;color:#5a5e66}
