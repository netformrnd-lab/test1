.gb-ahead .pill.on{background:var(--bg-card);color:var(--blue);
  box-shadow:0 1px 2px rgba(20,30,50,.10)}
.gb-act.problem .gb-ahead .pill.on{color:var(--orange)}
.gb-ahead .rm{margin-left:auto;border:none;background:none;color:var(--text-muted);
  font-family:inherit;font-size:11.5px;cursor:pointer;padding:2px 4px;opacity:0}
.gb-act:hover .gb-ahead .rm{opacity:.75}
.gb-ahead .rm:hover{color:var(--red);opacity:1}

/* 한 칸 — 왼쪽 이름 · 오른쪽 테두리 친 글칸 */
.gb-fs{display:grid;gap:9px}
.gb-f{display:grid;grid-template-columns:96px 1fr;gap:11px;align-items:start}
.gb-f > label{font-size:12.5px;font-weight:700;color:var(--text-muted);padding-top:9px;
  word-break:keep-all;line-height:1.45}
.gb-f > .bd{min-width:0}
.gb-act textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);
  border-radius:9px;padding:8px 11px;font-family:inherit;font-size:14px;line-height:1.6;
  background:var(--bg-card);color:var(--text-primary);resize:none;overflow:hidden;
  min-height:38px}
.gb-act textarea:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.gb-act textarea::placeholder{color:var(--text-muted)}
.gb-act .tx.res{font-weight:700}

/* 가설 · 행동 */
.gb-rws{display:grid;gap:7px}
.gb-rw{border:1px solid var(--border);border-radius:10px;padding:9px 11px;
  background:var(--bg-input)}
.gb-rw.hyp{border-style:dashed}
.gb-rw .hd{display:flex;align-items:flex-start;gap:8px}
.gb-rw .nu{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--blue);padding-top:9px;
  white-space:nowrap}
.gb-rw.hyp .nu{color:var(--purple)}
.gb-rw .hd textarea{font-weight:700;background:var(--bg-card)}
.gb-rw .hd .tt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.6;
  padding-top:6px;color:var(--text-primary);white-space:pre-wrap;word-break:break-word}
.gb-rw .ic{flex:0 0 auto;border:none;background:none;color:var(--text-muted);cursor:pointer;
  font-size:13px;padding:8px 3px 0;opacity:0}
.gb-rw:hover .ic{opacity:.7}
.gb-rw .ic:hover{opacity:1;color:var(--text-primary)}
.gb-rw .ic.x:hover{color:var(--red)}
.gb-rw .subs{display:grid;gap:5px;padding:6px 0 0 26px}
.gb-rw .sub{display:flex;align-items:flex-start;gap:6px}
.gb-rw .sub .bu{flex:0 0 auto;color:var(--text-muted);padding-top:7px;font-size:13px}
.gb-rw .sub textarea{font-size:13.5px;padding:5px 9px;border-radius:7px;min-height:30px}
.gb-rw .sub .tt{flex:1;min-width:0;font-size:13.5px;line-height:1.6;padding-top:4px;
  color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}
.gb-rw .sub .x{flex:0 0 auto;border:none;background:none;color:var(--text-muted);
  cursor:pointer;font-size:14px;padding:4px 3px 0;opacity:0}
.gb-rw .sub:hover .x{opacity:.7}
.gb-radd{display:flex;gap:6px;margin-top:2px}
.gb-radd button{border:1px dashed var(--border-light);background:transparent;
  color:var(--text-muted);font-family:inherit;font-size:12px;font-weight:700;
  padding:5px 11px;border-radius:8px;cursor:pointer}
.gb-radd button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

/* 아직 안 적은 칸은 작은 단추로만 */
.gb-am{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 0 107px}
.gb-am button{border:1px dashed var(--border-light);background:transparent;
  color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:700;
  padding:4px 10px;border-radius:99px;cursor:pointer}
.gb-am button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
@media(max-width:640px){
  .gb-act{padding-left:26px}
  .gb-f{grid-template-columns:1fr;gap:4px}
  .gb-f > label{padding-top:0}
  .gb-am{margin-left:0}
}

.gb-add.tiny{padding:2px 8px;font-size:11px;margin-top:4px}
.gb-add{border:1px dashed var(--border-light);background:transparent;color:var(--text-muted);
  font-family:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-sm);
  cursor:pointer}
.gb-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.gb-foot{padding:8px 11px;display:flex;gap:6px;flex-wrap:wrap;background:var(--bg-input);
  border-top:1px solid var(--border)}

@media(max-width:620px){
  .gb-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .gb-kpi{padding:10px 9px 9px;min-width:0}
  .gb-kpi .pct{font-size:23px}
  .gb-kpi .pct.none{font-size:10.5px;line-height:1.5}
  .gb-kpi .cell .k{font-size:8.5px}
  .gb-kpi .cell .v,.gb-kpi .cell input{font-size:11px}
  .gb-sh .ds{display:none}
  .gb-ih{flex-wrap:wrap;row-gap:6px}
  .gb-ih .tt{flex:1 1 100%;order:2}
  .gb-ih select{max-width:none;flex:1 1 40%;order:9}
  .gb-ih .btn{order:9}
  .gb-row{flex-direction:column}
  .gb-row > .lb{flex:0 0 auto;width:100%;border-right:none;
    border-bottom:1px solid var(--border);padding:5px 10px}
  .gb-row > .bd{width:100%}
}

/* ---------- 문서 내용 ---------- */
.doc-snip{font-size:12.5px;line-height:1.75;color:var(--text-secondary);
  padding:9px 12px;border-radius:var(--r-sm);background:var(--bg-input);
  border-left:2px solid var(--blue);word-break:break-all}
.doc-toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;padding:13px 15px;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-input)}
.doc-tocb{font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;
  border-radius:999px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);cursor:pointer;transition:.13s var(--ease)}
.doc-tocb:hover{background:var(--bg-hover);color:var(--text-primary);
  border-color:var(--border-light)}
.doc-sec{border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:9px;
  background:var(--bg-secondary);overflow:hidden}
.doc-h2{width:100%;font-family:inherit;text-align:left;display:flex;align-items:center;
  gap:10px;padding:14px 17px;border:0;background:transparent;color:var(--text-primary);
  font-size:15px;font-weight:750;cursor:pointer;letter-spacing:-.026em;
  transition:.13s var(--ease)}
.doc-h2:hover{background:var(--bg-hover)}
.doc-h2 .doc-ar{color:var(--text-muted);font-size:10px;width:10px;flex-shrink:0}
.doc-h2 .doc-cnt{margin-left:auto;font-size:11px;font-weight:500;color:var(--text-muted)}
.doc-body{padding:4px 22px 20px;border-top:1px solid var(--border)}
.doc-body p,.doc-body .doc-p{font-size:14px;line-height:1.88;color:var(--text-secondary);
  margin:0 0 14px}
.doc-body .doc-h3{font-size:14px;font-weight:750;color:var(--text-primary);
  margin:24px 0 10px;padding-left:11px;border-left:2px solid var(--blue);
  letter-spacing:-.02em}
.doc-body ul,.doc-body ol{margin:0 0 14px;padding-left:20px}
.doc-body li{font-size:14px;line-height:1.85;color:var(--text-secondary);margin-bottom:6px}
.doc-body strong,.doc-body b{color:var(--text-primary);font-weight:700}
.doc-body blockquote{margin:0 0 15px;padding:12px 17px;
  border-left:2px solid var(--border-light);background:var(--bg-input);
  border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;line-height:1.85;
  color:var(--text-secondary)}
.doc-body hr{border:0;border-top:1px solid var(--border);margin:22px 0}
.doc-body code{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:12.5px;
  background:var(--bg-hover);padding:1.5px 5px;border-radius:5px}
.doc-body pre{background:var(--bg-input);border:1px solid var(--border);padding:13px 15px;
  border-radius:var(--r);overflow-x:auto;font-size:12.5px;line-height:1.7;margin:0 0 14px}
.doc-body img{max-width:100%;border-radius:var(--r);margin:6px 0 15px}
.doc-tw{overflow-x:auto;margin:0 0 15px}
.doc-body table{border-collapse:collapse;width:100%;font-size:13px}
.doc-body th,.doc-body td{border:1px solid var(--border);padding:9px 12px;
  text-align:left;color:var(--text-secondary);vertical-align:top}
.doc-body th{background:var(--bg-input);color:var(--text-primary);font-weight:700}

/* ---------- 오류 띠 ---------- */
.verbar{display:none;gap:11px;align-items:center;flex-wrap:wrap;margin:0 24px 12px;
  padding:13px 16px;border-radius:var(--r-md);border:1px solid rgba(217,59,59,.4);
  background:rgba(217,59,59,.07)}
.verbar.show{display:flex}
/* 고장이 아니라 「고칠 수 있음」 — 빨강 대신 호박색 */
.verbar.warn{border-color:rgba(192,119,8,.4);background:rgba(192,119,8,.07)}
.verbar.warn .t{color:var(--yellow)}
.verbar .t{font-weight:800;font-size:13.5px;letter-spacing:-.02em;color:var(--red)}
.verbar .m{flex:1 1 320px;min-width:0;font-size:12.5px;line-height:1.6;
  color:var(--text-secondary)}
.verbar .m b{color:var(--text-primary);font-variant-numeric:tabular-nums}
.errbar{display:none;gap:13px;align-items:flex-start;margin:0 24px;padding:15px 18px;
  border-radius:var(--r-md);border:1px solid rgba(217,59,59,.4);background:rgba(217,59,59,.07)}
.errbar.show{display:flex}
.errbar .etitle{font-weight:750;font-size:14px;margin-bottom:5px;letter-spacing:-.02em}
.errbar .emsg{font-size:12.5px;line-height:1.6;word-break:break-all;
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;color:var(--text-secondary)}

/* ---------- 창(모달) ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(16,17,20,.45);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:100;padding:20px;overflow-y:auto}
.modal-bg.open{display:grid}
.modal{background:var(--bg-card);border-radius:var(--r-lg);padding:26px;width:100%;
  max-width:480px;box-shadow:var(--shadow-lg);border:1px solid var(--border);margin:auto}
.modal h3{font-size:17px;font-weight:750;margin-bottom:16px;letter-spacing:-.026em}
.modal label{display:block;font-size:11.5px;font-weight:700;color:var(--text-secondary);
  margin:14px 0 6px;letter-spacing:-.005em}
.modal input,.modal select,.modal textarea{width:100%;font-family:inherit;font-size:13px;
  padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary);transition:.15s var(--ease)}
.modal textarea{min-height:96px;resize:vertical;line-height:1.65}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;
  border-color:var(--border-light);box-shadow:var(--ring)}
.modal-actions{display:flex;gap:8px;align-items:center;margin-top:22px}

/* ---------- 판 번호 · 새 글 표시 ---------- */
.verbadge{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:10.5px;
  font-weight:600;letter-spacing:0;padding:4px 9px;border-radius:var(--r-xs);
  white-space:nowrap;border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-muted);cursor:pointer;transition:.14s var(--ease)}
.verbadge:hover{color:var(--text-secondary);border-color:var(--border-light)}
.vernew{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;
  padding:3px 4px 3px 11px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--border);background:var(--blue-soft);color:var(--blue)}
.vernew button{font-family:inherit;font-size:11px;font-weight:700;padding:3.5px 11px;
  border:0;border-radius:999px;background:var(--blue);color:#fff;cursor:pointer;
  transition:.14s var(--ease)}
.vernew button:disabled{opacity:.55;cursor:default}
/* 브라우저가 옛 파일을 들고 있을 때 — 새 판 알림보다 급합니다 */
.vernew.stale{background:rgba(217,59,59,.12);color:var(--red);
  border:1px solid rgba(217,59,59,.3)}
.vernew.stale button{background:var(--red);border-color:var(--red);color:#fff}
.vernew.stale button.hush{background:transparent;color:var(--red);padding:3.5px 7px;
  font-size:12px}
.chip.new{background:rgba(217,59,59,.10);border-color:rgba(217,59,59,.3);color:var(--red)}
.cnt.newdot{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;
  border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  margin-left:auto}
.newtag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;
  padding:1.5px 5px;border-radius:4px;background:var(--red);color:#fff;vertical-align:1.5px}

/* ---------- 알림 ---------- */
.cnt.clashdot{display:inline-grid;place-items:center;min-width:17px;height:17px;
  border-radius:999px;background:var(--yellow);color:#fff;font-size:10px;font-weight:700;
  margin-left:auto}
/* ── 문의 추이 그래프 ─────────────────────────────────────────────
   색은 '해' 를 나타냅니다. 글자에는 색을 쓰지 않습니다.
   밝은 화면에서 초록·노랑은 배경과 대비가 낮아, 표를 항상 함께 둡니다. */
.vz-box{border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;
  background:var(--bg-secondary);margin-bottom:16px;
  --sr1:#2a78d6; --sr2:#eb6834; --sr3:#1baf7a; --sr4:#eda100;
  --vz-grid:#e6e4df; --vz-surface:#ffffff}
body.dark-mode .vz-box{--sr1:#3987e5; --sr2:#d95926; --sr3:#199e70; --sr4:#c98500;
  --vz-grid:#2b2d32; --vz-surface:#141518}
.vz-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  letter-spacing:-.018em;margin-bottom:10px}
.vz-legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.vz-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.vz-keys{display:flex;flex-wrap:wrap;gap:6px}
.vz-spacer{flex:1 1 0;min-width:0}
.vz-btn{font-family:inherit;padding:4px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg-card);transition:.14s var(--ease)}
.vz-btn:hover{border-color:var(--border-light)}
.vz-btn.off{opacity:.5;text-decoration:line-through}
.vz-seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);
  overflow:hidden;background:var(--bg-card)}
.vz-seg button{font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border:0;
  background:transparent;color:var(--text-secondary);cursor:pointer}
.vz-seg button + button{border-left:1px solid var(--border)}
.vz-seg button.on{background:var(--text-primary);color:var(--bg-card)}
.vz-sel{font-family:inherit;font-size:12px;padding:5px 9px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);
  max-width:200px}
table.ymtable tr.dim{opacity:.45}
.vz-key{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--text-secondary)}
.vz-sw{width:14px;height:3px;border-radius:99px;flex-shrink:0}
.vz-wrap{overflow-x:auto}
.vz{display:block;width:100%;min-width:520px;height:auto}
.vz-grid{stroke:var(--vz-grid);stroke-width:1}
.vz-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.vz-dot{stroke:var(--vz-surface);stroke-width:2}
.vz-tick{fill:var(--text-muted);font-size:11px;font-family:inherit}
.vz-endlab{fill:var(--text-secondary);font-size:11px;font-weight:700;font-family:inherit}
.vz-hot{fill:transparent}
.vz-hot:hover{fill:var(--text-primary);fill-opacity:.045}
.vz-tw{overflow-x:auto;margin-top:12px}
table.ymtable{border-collapse:collapse;width:100%;font-size:12px;
  font-variant-numeric:tabular-nums}
table.ymtable th,table.ymtable td{padding:5px 8px;border-bottom:1px solid var(--border);
  white-space:nowrap}
table.ymtable thead th{font-size:11px;font-weight:700;color:var(--text-secondary);
  background:var(--bg-input)}
table.ymtable th.yr{font-weight:700;text-align:left}
table.ymtable .num{text-align:right}
table.ymtable .zero{color:var(--text-muted)}
table.ymtable .tot{font-weight:700}
table.ymtable tr:hover td{background:var(--bg-hover)}
/* 눌러서 고칠 수 있는 숫자 칸 */
/* ---------- 로그인 ---------- */
body.locked .topbar,body.locked .side{display:none}
body.locked .layout{grid-template-columns:minmax(0,1fr);padding:0}
.lgwrap{display:flex;align-items:center;justify-content:center;min-height:88vh;padding:20px}
.lgbox{width:100%;max-width:380px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:32px 30px;box-shadow:var(--shadow-lg)}
.lg-h{font-size:21px;font-weight:750;letter-spacing:-.03em;margin-bottom:6px}
.lg-s{font-size:12.5px;color:var(--text-muted);line-height:1.7;margin-bottom:20px}
.lgbox label{display:block;font-size:11.5px;font-weight:700;color:var(--text-secondary);
  margin:12px 0 5px;letter-spacing:-.01em}
.lgbox input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:14px;
  font-family:inherit;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary)}
.lgbox input:focus{outline:none;border-color:var(--border-light);box-shadow:var(--ring);
  background:var(--bg-card)}
.lg-go{width:100%;margin-top:20px;padding:11px;font-size:14px;justify-content:center}
.lg-note{font-size:11.5px;color:var(--text-muted);margin-top:14px;line-height:1.65;text-align:center}
.lg-err{background:var(--red);color:#fff;font-size:12.5px;font-weight:600;line-height:1.6;
  padding:10px 13px;border-radius:var(--r-sm);margin-top:14px}

/* ---------- 폴더 구조 미리보기 ---------- */
.treebox{margin:10px 0 4px;padding:11px 14px;border-radius:var(--r-sm);
  background:var(--bg-card);border:1px solid var(--border);
  font-size:12px;line-height:1.85;font-variant-numeric:tabular-nums}
.card.gonecard{opacity:.72;border-style:dashed}
.card.gonecard .ct{text-decoration:line-through;text-decoration-color:var(--text-muted)}
.chip.warn{background:rgba(192,119,8,.12);color:var(--yellow);border-color:var(--yellow)}
.treebox .tl{padding-left:18px}
.treebox .tl2{padding-left:36px}
.treebox .tl3{padding-left:54px;color:var(--text-muted)}
.treebox span{color:var(--text-muted);font-size:11px;margin-left:4px}

/* ---------- 브랜드북 ---------- */
.booklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.bsec{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;
  background:var(--bg-secondary);transition:.15s var(--ease)}
.bsec.on{background:var(--bg-card);border-color:var(--border-light)}
.bsec label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
  letter-spacing:-.014em;margin-bottom:8px;color:var(--text-primary);cursor:text}
.bsec .bem{font-size:15px}
.bsec textarea{width:100%;box-sizing:border-box;min-height:104px;resize:vertical;
  font-family:inherit;font-size:13px;line-height:1.75;padding:9px 11px;
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary)}
.bsec textarea:focus{outline:none;border-color:var(--border-light);box-shadow:var(--ring);
  background:var(--bg-card)}
.bsec textarea::placeholder{color:var(--text-muted);line-height:1.6}

table.costtable td,table.costtable th{white-space:normal;vertical-align:top;padding:8px 10px}
table.costtable td:first-child{min-width:200px}
table.costtable .fmeta{font-size:11px;margin-top:2px}
table.ymtable td.ed2{cursor:text}
table.ymtable td.ed2:hover{background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
table.ymtable td.fx{background:rgba(192,119,8,.09);font-weight:700}
table.ymtable tr:hover td.fx{background:rgba(192,119,8,.14)}
table.ymtable td.fx.zero{color:var(--text-primary)}
table.ymtable .fxmark{margin-left:4px;font-size:9px;color:var(--yellow);vertical-align:1px}
table.ymtable td.ed2.on{position:relative;background:var(--bg-card)}
table.ymtable .edshadow{visibility:hidden}
table.ymtable td.ed2.on input{position:absolute;z-index:3;top:2px;right:3px;
  width:56px;box-sizing:border-box;
  font-family:inherit;font-size:12px;font-variant-numeric:tabular-nums;text-align:right;
  padding:2px 5px;border-radius:4px;border:1px solid var(--blue);
  background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-sm)}
table.ymtable td.ed2.on input:focus{outline:none;box-shadow:var(--ring)}
table.ymtable .sumrow th,table.ymtable .sumrow td{border-top:1px solid var(--border-light);
  border-bottom:none;font-weight:700;color:var(--text-secondary)}

/* ---------- 달력 ---------- */
.mt-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--border)}
.cal-h{background:var(--bg-input);padding:7px 8px;font-size:11.5px;font-weight:700;
  letter-spacing:-.01em;color:var(--text-secondary);text-align:center}
.cal-c{background:var(--bg-card);min-height:98px;padding:6px 6px 8px;
  display:flex;flex-direction:column;gap:3px;cursor:default;
  transition:background .13s var(--ease)}
.cal-c:hover{background:var(--bg-hover)}
.cal-c.out{background:var(--bg-secondary);cursor:default}
.cal-c.out:hover{background:var(--bg-secondary)}
.cal-d{align-self:flex-start;font-size:12px;font-weight:700;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;line-height:1.2;margin-bottom:1px}
.cal-h.sun,.cal-c.sun .cal-d{color:var(--red)}
.cal-h.sat,.cal-c.sat .cal-d{color:var(--blue)}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cal-c.today .cal-d{display:inline-flex;align-items:center;justify-content:center;
  min-width:19px;height:19px;padding:0 4px;border-radius:999px;
  background:var(--blue);color:#fff}
.cal-e{display:flex;align-items:center;gap:5px;min-width:0;width:100%;
  font-family:inherit;text-align:left;font-size:11.5px;line-height:1.35;
  padding:2px 6px;border-radius:5px;border:0;cursor:pointer;
  background:var(--bg-input);
  background:color-mix(in srgb,var(--ec) 13%,transparent);
  color:var(--text-primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-e:hover{background:color-mix(in srgb,var(--ec) 24%,transparent)}
.cal-t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-who{flex:0 0 auto;margin-left:auto;padding-left:5px;font-size:10.5px;opacity:.75;
  font-weight:700;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-dot{width:7px;height:7px;border-radius:99px;flex-shrink:0;background:var(--ec)}
/* 며칠에 걸치는 일정: 이어지는 쪽 모서리를 붙여 한 덩어리로 보이게 합니다 */
.cal-e.p-first{border-top-right-radius:0;border-bottom-right-radius:0}
.cal-e.p-mid{border-radius:0}
.cal-e.p-last{border-top-left-radius:0;border-bottom-left-radius:0}
.cal-e.p-mid .cal-dot,.cal-e.p-last .cal-dot{display:none}
/* 근무현황(휴가·외근)은 우리 일정보다 옅게 — 읽기 전용이라 눌러도 안 바뀝니다 */
.cal-w{display:flex;align-items:center;gap:5px;min-width:0;width:100%;
  font-size:11px;line-height:1.3;padding:1px 6px;border-radius:5px;
  background:color-mix(in srgb,var(--ec) 9%,transparent);
  color:var(--text-secondary);cursor:default;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-w .cal-dot{width:auto;min-width:6px;height:auto;min-height:6px;opacity:.9;
  border-radius:99px;font-size:9px;line-height:1;color:#fff;text-align:center}
.cal-w .cal-dot:not(:empty){background:transparent;color:var(--ec);font-size:11px}
.cal-w .wl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-w .wv{font-weight:700;color:var(--ec)}
.cal-w .wq{margin-left:3px;font-size:10px;opacity:.85}
.cal-c.holi{background:color-mix(in srgb,var(--red) 7%,var(--bg-card))}
.cal-c.holi .cal-d{color:var(--red)}
.cal-holi{font-size:10.5px;color:var(--red);font-weight:700;margin:-1px 0 1px}
.tp-grid{display:flex;flex-wrap:wrap;gap:7px;max-height:230px;overflow:auto;
  padding:10px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--bg-secondary)}
.cal-cont{color:var(--ec);font-weight:700;margin-right:2px;flex-shrink:0}
@media(max-width:900px){
  .cal-c{min-height:76px;padding:5px 4px 6px}
  .cal-e{font-size:11px;padding:1px 4px}
}

/* 고칠 수 있는 표 */
table.itable.editable td{max-width:260px}
table.itable th.ownc{background:var(--blue-soft);color:var(--text-primary)}
td.ed{cursor:text;position:relative}
td.ed:hover{background:var(--blue-soft)}
td.ed .edph{color:var(--text-muted);opacity:0;font-weight:700}
td.ed:hover .edph{opacity:1}
td.ed.has{font-weight:600}
td.ed.fixed{background:rgba(192,119,8,.09)}
td.ed .edmark{margin-left:5px;font-size:10px;color:var(--yellow)}
td.ed.on{padding:2px 4px;background:var(--bg-card)}
td.ed.on input,td.ed.on select{width:100%;min-width:110px;font-family:inherit;font-size:12.5px;
  padding:5px 7px;border:1px solid var(--blue);border-radius:var(--r-xs);
  background:var(--bg-input);color:var(--text-primary);outline:none}

/* ── 회의록 ─────────────────────────────────────────────────── */
.mtbox{border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;
  background:var(--bg-secondary);margin-bottom:12px}
.mt-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.mt-title{font-size:15px;font-weight:750;letter-spacing:-.024em}
.mt-act{margin-left:auto;display:flex;gap:5px}
.mt-raw{margin-top:10px}
.mt-raw summary{font-size:12px;color:var(--text-muted);cursor:pointer;font-weight:600;
  padding:4px 0;list-style:none}
.mt-raw summary::-webkit-details-marker{display:none}
.mt-raw summary::before{content:'▸ ';color:var(--text-muted)}
.mt-raw[open] summary::before{content:'▾ '}
.mt-body{font-size:13px;line-height:1.75;color:var(--text-secondary);white-space:pre-wrap;
  word-break:break-word;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--bg-input);border:1px solid var(--border);margin-top:6px;
  max-height:340px;overflow:auto}
.aibox{border:1px solid var(--border);border-left:2px solid var(--blue);
  border-radius:var(--r-sm);background:var(--bg-input);padding:13px 15px}
.ai-sec + .ai-sec{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.ai-sec.warn{background:rgba(192,119,8,.08);margin:12px -15px -13px;padding:12px 15px 13px;
  border-top:1px solid rgba(192,119,8,.28);border-radius:0 0 var(--r-sm) var(--r-sm)}
.ai-h{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;
  margin-bottom:5px}
.ai-p{font-size:13.5px;line-height:1.8;color:var(--text-primary);white-space:pre-wrap}
.ai-ul{margin:0;padding-left:18px}
.ai-ul li{font-size:13.5px;line-height:1.8;color:var(--text-primary);margin-bottom:3px}
.ai-todos{display:flex;flex-direction:column;gap:6px}
.ai-todo{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;
  padding:7px 10px;border-radius:var(--r-xs);background:var(--bg-card);
  border:1px solid var(--border)}
.ai-td{font-weight:600;color:var(--text-primary)}

.hitrow{display:flex;align-items:center;gap:12px;padding:10px 14px}
.hitrow + .hitrow{border-top:1px solid var(--border)}
.hitrow:hover{background:var(--bg-hover)}
.hit-th{width:52px;height:40px;object-fit:cover;border-radius:var(--r-xs);flex-shrink:0;
  background:var(--bg-hover);border:1px solid var(--border)}
.hit-ic{display:flex;align-items:center;justify-content:center;font-size:20px}
.hit-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hit-nm{font-size:13.5px;font-weight:600;letter-spacing:-.014em;word-break:break-all}
.hit-act{display:flex;gap:5px;flex-shrink:0}
@media(max-width:700px){ .hit-act{flex-direction:column} }
.clashbar{border:1px solid rgba(192,119,8,.4);background:rgba(192,119,8,.07);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px}
.cb-top{font-size:13px;line-height:1.7;margin-bottom:10px}
.cb-item{border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-card);padding:10px 12px;margin-top:8px}
.cb-h{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.cb-when{color:var(--text-muted);font-size:11.5px;margin-right:auto}
.cb-body{font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  margin-top:8px;padding:9px 11px;border-radius:var(--r-xs);background:var(--bg-input);
  max-height:220px;overflow:auto;font-family:inherit}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:none;
  background:var(--text-primary);color:var(--bg-card);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;
  letter-spacing:-.012em}

/* ═══════════════ 휴대폰 (≤620px) ═══════════════════════════════════
   손안에서는 「머리말·메뉴」 가 화면을 다 먹으면 안 됩니다.
   내용이 첫 화면에 바로 오도록 위쪽을 눌러 담고, 메뉴는 접어 둡니다.
   ================================================================= */
.navbtn{display:none}

@media(max-width:900px){
  /* 메뉴는 [☰] 를 눌렀을 때만 펼칩니다 */
  .navbtn{display:inline-flex}
  .side{display:none}
  body.nav-open .side{display:block}
  body.nav-open .brand-list{flex-direction:column;overflow-x:visible}
}

@media(max-width:620px){
  .topbar{padding:9px 12px;gap:8px}
  .topbar h1{font-size:15px;gap:6px}
  .topbar .sub{display:none}          /* 마지막 저장 시각은 아래 저장 표시로 갈음합니다 */
  .searchbox input{padding:8px 12px 8px 32px;font-size:16px}  /* 16px 이라야 아이폰이 확대 안 합니다 */
  .actions{gap:6px}
  .statusgrp{gap:5px}
  .verbadge,.presence{display:none}
  .btngrp{flex-wrap:wrap;gap:5px}
  .btngrp .btn{padding:7px 9px;font-size:12px}
  .hide-phone{display:none!important}   /* 백업·복원처럼 PC 에서 하는 것 */

  .layout{padding:12px;gap:12px}
  .panel{border-radius:var(--r-md)}
  .tabbody{padding:16px 14px 24px}
  .bhead{padding:16px 14px 14px;gap:10px}
  .page-h{font-size:17px}
  .page-sub{margin-bottom:14px}
  .hsec{margin:18px 0 8px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .stat{padding:12px 13px}
  /* 「2,405,000원」 같은 긴 숫자가 두 줄로 깨지지 않게 폭에 맞춰 줄입니다 */
  .stat .val{font-size:min(22px,7.2vw);letter-spacing:-.045em;white-space:nowrap}
  .stat .sub{font-size:11px}
  .hgrid{grid-template-columns:minmax(0,1fr)}
  .tabs{padding:0 10px}
  .tab{padding:9px 10px 11px;font-size:12.5px}
  .sec-bar{gap:6px;margin-bottom:12px}
  /* 「빈 칸을 두 번 누르면」·「마우스를 올리면」 같은 PC 용 설명은 접습니다.
     손가락으로 쓰는 화면에서는 자리만 차지하고 맞지도 않는 말입니다. */
  .sec-bar .hint{display:none}
  .page-sub{font-size:11.5px;line-height:1.5;margin-bottom:10px}
  .vz-legend{font-size:11px;gap:8px}
  .vz-key{font-size:11px}
  /* 달력 단추는 좁으니 촘촘하게 */
  .sec-bar .btn{padding:8px 10px;font-size:12.5px}

  /* 손가락으로 누를 수 있는 크기로 (애플 권장 44px 에 맞춥니다) */
  .btn{min-height:38px}
  .btn.sm{min-height:32px}
  .brand-item{padding:11px}

  /* 달력은 7칸이라 좁히면 글자가 뭉갭니다 — 옆으로 밀어 봅니다 */
  .calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
    margin:0 -14px;padding:0 14px}
  .calwrap .cal{min-width:600px}
  .cal-c{min-height:78px}

  /* 표는 원래도 가로 스크롤 상자 안에 있습니다 — 가장자리까지 쓰게 합니다 */
  .vz-tw{margin:0 -14px;padding:0 14px}

  .toast{bottom:16px;left:12px;right:12px;transform:none;text-align:center}
  .modal{max-width:100%!important;border-radius:var(--r-md)}
  .modal-bg{padding:10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🎨 브랜드 허브</h1>
    <div class="sub" id="subtitle">넷폼알앤디</div>
  </div>
  <div class="searchbox">
    <span class="ico">🔍</span>
    <input type="text" id="search" placeholder="모든 브랜드에서 검색 (자동화·히스토리·자료)"
           oninput="onSearch(this.value)">
  </div>
  <span class="spacer"></span>
  <div class="actions">
    <!-- 왼쪽 묶음: 글자 길이가 바뀌는 것들. 남는 공간 안에서만 늘었다 줄었다 합니다 -->
    <div class="statusgrp">
      <span class="verbadge" id="verBadge" title="지금 쓰고 있는 판 번호입니다. 눌러보면 새 판이 있는지 다시 확인합니다."
            onclick="checkVersion(true)">–</span>
      <span class="vernew" id="verNew" style="display:none"></span>
      <span class="savestate" id="saveState">✓ 저장됨</span>
      <span class="presence" id="presenceBox" style="display:none"
            title="지금 대시보드를 보고 있는 사람" onclick="setMyName()"></span>
      <span class="store-badge" id="storeBadge"><span class="dot"></span><span id="storeText">확인 중</span></span>
    </div>
    <!-- 오른쪽 묶음: 단추. 왼쪽이 길어져도 자리가 움직이지 않습니다 -->
    <div class="btngrp">
    <button class="btn navbtn" id="navBtn" onclick="toggleNav()" title="메뉴 열고 닫기">☰</button>
    <button class="btn" id="userBtn" style="display:none" onclick="userMenu()">👤</button>
    <button class="btn" id="undoBtn" title="되돌리기 (Ctrl+Z)" onclick="undoStep()">↩︎</button>
    <button class="btn" id="redoBtn" title="다시 하기 (Ctrl+Shift+Z)" onclick="redoStep()">↪︎</button>
    <button class="btn" id="autoBtn" onclick="toggleAutoSave()">💾자동</button>
    <button class="btn" title="밝게/어둡게" onclick="toggleDark()">🌙</button>
    <button class="btn hide-phone" title="파일로 내보내기 (백업)" onclick="exportJSON()">📤</button>
    <button class="btn hide-phone" title="파일에서 가져오기 (복원)"
            onclick="document.getElementById('importFile').click()">📥</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
    <button class="btn primary" title="지금 바로 저장 (Ctrl+S) — 평소에는 자동 저장됩니다"
            onclick="saveAll()">💾 저장</button>
    </div>
  </div>
</div>

<!-- 브라우저가 옛 파일을 들고 있을 때 — 윗줄은 자리가 좁아 여기에 깝니다 -->
<div class="verbar" id="verBar"></div>

<div class="errbar" id="errBar">
  <div>
    <div class="etitle">⚠️ 저장하지 못했습니다</div>
    <div class="emsg" id="errText"></div>
    <div class="emsg" style="margin-top:6px;color:var(--text-muted)">
      입력하신 내용은 이 브라우저에 임시 보관했습니다. 위 문구를 그대로 알려주세요.
    </div>
  </div>
  <button class="btn sm" style="margin-left:auto"
          onclick="document.getElementById('errBar').classList.remove('show')">닫기</button>
</div>

<div class="layout">
  <aside class="side">
    <button class="brand-item home-item" id="homeBtn" onclick="goHome()">
      <span class="bar" style="background:var(--text-muted)"></span>
      <span class="em">🏠</span><span>홈</span>
    </button>
    <button class="brand-item home-item" id="obBtn" onclick="goView('onboard')">
      <span class="bar" style="background:var(--blue)"></span>
      <span class="em">🧭</span><span>온보딩</span>
    </button>
    <button class="brand-item home-item" id="nasBtn" onclick="goNas()">
      <span class="bar" style="background:var(--purple)"></span>
      <span class="em">🗂️</span><span>NAS 자료</span>
    </button>
    <div class="side-title">브랜드</div>
    <div class="brand-list" id="brandList"></div>
    <button class="btn" style="width:100%" onclick="openBrandModal()">＋ 브랜드 추가</button>

    <!-- 브랜드와 상관없이 팀이 같이 쓰는 것들.
         한 덩어리로 여덟 줄이 있으면 찾는 데 시간이 걸려서 세 묶음으로 나눴습니다.
           업무관리 — 내가 맡은 일이 어디까지 왔나
           팀운영   — 팀이 같이 굴리는 것 (날짜 · 돈 · 발행)
           기록·설정 — 자주 안 열지만 있어야 하는 것
         명함은 뺐습니다 (자료는 data.cards 에 그대로 있습니다). -->
    <div class="side-title" style="margin-top:18px">업무관리</div>
    <div class="brand-list">
      <button class="brand-item home-item" id="taskBtn" onclick="goView('tasks')">
        <span class="bar" style="background:var(--green)"></span>
        <span class="em">✅</span><span>할 일</span>
        <span class="cnt" id="taskCnt"></span>
      </button>
      <button class="brand-item home-item" id="growBtn" onclick="goView('growth')">
        <span class="bar" style="background:var(--purple)"></span>
        <span class="em">📈</span><span>그로스보드</span>
        <span class="cnt" id="growCnt"></span>
      </button>
      <button class="brand-item home-item" id="meetBtn" onclick="goView('meetings')">
        <span class="bar" style="background:var(--cyan)"></span>
        <span class="em">🗣️</span><span>회의록</span>
        <span class="cnt" id="meetCnt"></span>
      </button>
    </div>
    <div class="brand-list" id="pgList-업무관리"></div>

    <div class="side-title" style="margin-top:18px">팀운영</div>
    <div class="brand-list">
      <button class="brand-item home-item" id="calBtn" onclick="goView('calendar')">
        <span class="bar" style="background:var(--orange)"></span>
        <span class="em">📅</span><span>달력</span>
        <span class="cnt" id="calCnt"></span>
      </button>
      <button class="brand-item home-item" id="costBtn" onclick="goView('costs')">
        <span class="bar" style="background:var(--red)"></span>
        <span class="em">💳</span><span>마케팅 비용</span>
        <span class="cnt" id="costCnt"></span>
      </button>
      <button class="brand-item home-item" id="blogBtn" onclick="goView('blog')">
        <span class="bar" style="background:var(--green)"></span>
        <span class="em">✍️</span><span>블로그 발행</span>
        <span class="cnt" id="blogCnt"></span>
      </button>
    </div>

<script>
/* =========================================================================
   저장 위치 — 자동으로 정해집니다. 손댈 필요 없습니다.
   NAS 주소로 열면 (http://192.168.0.37/...) → NAS 저장 (모두 공유)
   파일을 더블클릭해서 열면 (file:///C:/...)  → 이 브라우저에만 저장
   ========================================================================= */
const STORAGE_MODE_SETTING = 'auto';
const STORAGE_MODE = STORAGE_MODE_SETTING !== 'auto'
  ? STORAGE_MODE_SETTING
  : (location.protocol === 'http:' || location.protocol === 'https:' ? 'nas' : 'local');

const NAS_API = { load: 'load.php', save: 'save.php' };

/* 접속 주소 — 사무실 밖에서는 주소가 다릅니다 (Tailscale · DDNS · 터널).
   그래서 주소를 화면에 박아 두지 않고, 마지막으로 열었던 주소를 기억해
   안내 문구에 그대로 씁니다. 한 번도 NAS 로 연 적이 없으면 사무실 주소를 씁니다. */
const NAS_URL_KEY = 'netform_brand_nas_url';
function nasUrlSave(){
  if(STORAGE_MODE !== 'nas') return;
  try{ localStorage.setItem(NAS_URL_KEY, location.origin + location.pathname); }catch(e){}
}
function nasUrl(){
  if(STORAGE_MODE === 'nas') return location.origin + location.pathname;
  try{ const v = localStorage.getItem(NAS_URL_KEY); if(v) return v; }catch(e){}
  return 'http://192.168.0.37/brand/brand.html';       // 사무실 주소 (처음 쓸 때)
}
function nasBase(){ return nasUrl().replace(/\/[^\/]*$/, ''); }
nasUrlSave();
const APP_VER = 'v20260923-7';   // 화면 오른쪽 위에 표시됩니다
const LS_KEY  = 'netform_brand_hub_v2';
const SCHEMA  = 2;

let saveBlocked = false;   // 불러오기가 실패하면 켜집니다 (덮어쓰기 방지)

/* ── 실시간 ────────────────────────────────────────────────────────────
   새로고침하지 않아도 다른 분이 고친 내용이 몇 초 안에 화면에 반영됩니다.

   방식: 2초마다 "판 번호만" 물어봅니다(load.php?rev=1 — 몇 십 바이트).
         번호가 달라졌을 때만 전체 내용을 받아옵니다.
         그래서 자주 물어봐도 NAS 가 힘들지 않습니다.
   ------------------------------------------------------------------ */
const LIVE_MS      = 2000;    // 화면을 보고 있을 때
const LIVE_MS_IDLE = 15000;   // 다른 창을 보고 있을 때
let liveTimer = null, liveBusy = false, lastSeenRev = null, liveOn = false, liveErr = '';

function myName(){
  const m = (typeof authMe === 'function') ? authMe() : null;
  if(m) return m['이름'] || m.id;          // 로그인했으면 그 이름이 곧 내 이름입니다
  try{ return localStorage.getItem('brandHubUser') || ''; }catch(e){ return ''; }
}
function myId(){
  try{
    let v = localStorage.getItem('brandHubId');
    if(!v){ v = 'u' + Math.random().toString(36).slice(2, 10); localStorage.setItem('brandHubId', v); }
    return v;
  }catch(e){ return 'u0'; }
}
function setMyName(){
  const cur = myName();
  const v = prompt('이름을 넣어주세요.\n\n같이 보고 있는 분들에게 "누가 보고 있는지" 로 표시됩니다.', cur);
  if(v === null) return;
  try{ localStorage.setItem('brandHubUser', v.trim().slice(0, 20)); }catch(e){}
  pingPresence();
  paintPresence();
}

/* 판 번호가 바뀌었는지만 확인하고, 바뀌었으면 받아서 화면에 반영합니다 */
async function liveTick(){
  if(STORAGE_MODE !== 'nas' || liveBusy || saving || saveBlocked) return;
  if(wbDrag) return;        // 화이트보드에서 무언가를 끌고 있으면 건드리지 않습니다
  liveBusy = true;
  try{
    const r = await apiJson(NAS_API.load + '?rev=1&t=' + Date.now());
    if(r && r.ok){
      liveOn = true;
      const rev = r.rev | 0;
      if(rev !== (data._rev | 0)) await pullLive(r['고친사람'] || '');
      lastSeenRev = rev;
    }
  }catch(e){
    liveOn = false;
    liveErr = (e && e.message) ? e.message : String(e);
  }
  finally{ liveBusy = false; }
}

/* 서버의 새 내용을 받아, 내가 고치던 것은 지키면서 화면에 반영합니다 */
async function pullLive(by){
  // storageLoad 를 씁니다. (load.php 는 데이터를 그대로 돌려주므로
  //  ok 표시를 확인하는 apiJson 으로 읽으면 안 됩니다)
  const srv = await storageLoad();
  if(!srv || !Array.isArray(srv.brands)) return;

  const hasMine = dirtyBrands.size > 0 || dirtyGlobal;
  if(hasMine){
    // 아직 저장 안 한 내 수정이 있으면, 저장할 때와 같은 방식으로 합칩니다
    revived = 0; clashed = 0; clashedTop = 0;
    data = normalize(mergeWithServer(srv));
  }else{
    data = normalize(srv);
  }
  data._rev = srv._rev | 0;
  baseIds   = snapshotIds(srv);
  updateSubtitle();
  render();

  const who = (by && by !== myName()) ? by + '님이 ' : '';
  if(by !== myName()) toast('🔄 ' + who + '방금 고친 내용을 가져왔습니다');
}

/* 로그인이 끊겼을 때 실시간 확인을 멈춥니다.
   (안 멈추면 2초마다 「로그인 필요」 를 받아 화면이 계속 흔들립니다) */
function stopLive(){
  clearInterval(liveTimer);
  liveTimer = null;
  liveOn = false;
}

function startLive(){
  if(STORAGE_MODE !== 'nas') return;
  const arm = () => {
    clearInterval(liveTimer);
    liveTimer = setInterval(liveTick, document.hidden ? LIVE_MS_IDLE : LIVE_MS);
  };
  arm();
  document.addEventListener('visibilitychange', () => { arm(); if(!document.hidden) liveTick(); });
  window.addEventListener('focus', liveTick);
  liveTick();
}

/* ── 지금 누가 보고 있는지 ─────────────────────────────────────────── */
let presence = [];
async function pingPresence(){
  if(STORAGE_MODE !== 'nas') return;
  try{
    const b = currentBrand();
    const where = searchQuery ? '검색' : (view === 'nas' ? 'NAS 자료'
                : (b ? b.name : '홈'));
    const r = await apiJson('presence.php?action=ping'
      + '&id=' + encodeURIComponent(myId())
      + '&name=' + encodeURIComponent(myName())
      + '&where=' + encodeURIComponent(where));
    if(r && r.ok){ presence = r['사람'] || []; paintPresence(); }
  }catch(e){ /* 곁다리 기능이라 조용히 넘어갑니다 */ }
}

function paintPresence(){
  const el = document.getElementById('presenceBox');
  if(!el) return;
  if(!presence.length){ el.style.display = 'none'; return; }
  el.style.display = '';
  const others = presence.filter(p => !p['나인가']);
  // 이름이 길어져도 위쪽 띠가 밀리지 않게 두 명까지만 적습니다
  const names = others.slice(0, 2).map(p => p['이름']).join(', ')
    + (others.length > 2 ? ' 외 ' + (others.length - 2) + '명' : '');
  el.innerHTML = '<span class="pdot"></span>'
    + '<span>' + presence.length + '명</span>'
    + '<span class="pnames">' + (others.length ? esc(names) : '나만 보는 중') + '</span>'
    + (myName() ? '' : '<span class="pset">이름 설정</span>');
  el.title = presence.map(p => (p['나인가'] ? '나' : p['이름'])
    + (p['보는곳'] ? ' — ' + p['보는곳'] : '')).join('\n');
}

async function storageLoad(){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.load + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('NAS 응답 오류 (' + res.status + ')');
    const text = await res.text();
    if(!text.trim()) return null;              // 처음 쓰는 경우
    const j = JSON.parse(text);
    if(j && j._error) throw new Error(j._error + '\n\n' + (j._안내 || ''));
    return j;
  }
  const raw = localStorage.getItem(LS_KEY);
  return raw ? JSON.parse(raw) : null;
}

async function storageSave(payload){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.save, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) { /* JSON이 아닌 응답 */ }
    if(out === null){
      throw new Error('서버가 예상 밖의 응답을 보냈습니다 (HTTP ' + res.status + ') → '
        + text.slice(0, 300).replace(/\s+/g, ' '));
    }
    if(out.conflict){
      // 내가 불러온 뒤에 다른 사람이 저장했습니다. 오류가 아니라 합쳐야 하는 상황입니다.
      const e = new Error('다른 사람이 먼저 저장했습니다');
      e.conflict = true;
      e.server   = out.data;
      e.rev      = out.rev;
      throw e;
    }
    if(!res.ok || !out.ok){
      throw new Error('(HTTP ' + res.status + ') ' + (out.error || '알 수 없는 오류'));
    }
    if(typeof out.rev === 'number') data._rev = out.rev;
    return;
  }
  localStorage.setItem(LS_KEY, JSON.stringify(payload));
}

/* ========================= 유틸 ========================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* 오늘 날짜 (YYYY-MM-DD). toISOString() 은 UTC 라서 한국 시간으로 밤 9시가 넘으면
   하루 전 날짜가 나옵니다. 그래서 이 컴퓨터의 날짜를 직접 씁니다.            */
function todayStr(d){
  const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0')
       + '-' + String(t.getDate()).padStart(2, '0');
}

function brandById(id){ return data.brands.find(b => b.id === id); }

function isUrl(s){ return /^https?:\/\//i.test(String(s || '')); }
function statusClass(s){
  return s === '운영중' ? 'on' : s === '테스트중' ? 'test' : s === '중단' ? 'off' : '';
}
function fmtDate(d){
  if(!d) return '';
  const t = new Date(d);
  return isNaN(t) ? String(d)
    : t.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
}
function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const idx = safe.toLowerCase().indexOf(esc(q).toLowerCase());
  if(idx < 0) return safe;
  return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>'
       + safe.slice(idx + q.length);
}

function fitTopbar(){
  const bar = document.querySelector('.topbar');
  const grp = document.querySelector('.statusgrp');
  if(!bar || !grp) return;
  bar.classList.remove('tight', 'tight2', 'tight3');
  /* scrollWidth 로는 안 됩니다 — 이 묶음은 오른쪽으로 붙어 있어서 넘치면
     <<왼쪽>> 으로 삐져나가고, scrollWidth 는 왼쪽 넘침을 안 세어 줍니다.
     그래서 늘 「자리가 넉넉하다」 로 읽혀 아무것도 안 숨겼고, 배지들이
     검색칸 위로 겹쳐 올라왔습니다. 아이 너비를 직접 더합니다. */
  const need = () => {
    const ks = Array.prototype.filter.call(grp.children,
      el => getComputedStyle(el).display !== 'none');
    return ks.reduce((a, el) => a + el.getBoundingClientRect().width, 0)
         + 6 * Math.max(0, ks.length - 1);
  };
  /* 한 단계씩 줄여 보고, 맞으면 거기서 멈춥니다.
     끝내 안 맞으면 줄을 바꿉니다 — 그때는 자리가 넉넉하니 숨겼던 것을
     도로 꺼냅니다. 겹쳐 보이는 것보다 두 줄이 낫습니다. */
  const fits = () => need() <= grp.clientWidth + 1;
  if(fits()) return;
  bar.classList.add('tight');                    // 판 번호를 숨깁니다
  if(fits()) return;
  bar.classList.add('tight2');                   // 저장됨도 숨깁니다
  if(fits()) return;
  bar.classList.remove('tight', 'tight2');
  bar.classList.add('tight3');                   // 아랫줄로 내립니다
}
window.addEventListener('resize', fitTopbar);

/* ---- 새 판 알림 ---------------------------------------------------------
   NAS 에 있는 brand.html 의 판 번호와 GitHub 에 올라간 판 번호를 비교합니다.
   다르면 오른쪽 위에 [받기] 단추가 뜨고, 누르면 파일을 받아 새로 고칩니다.   */
let verBusy = false;

/* ── 판 번호 견주기 ──────────────────────────────────────────
   vYYYYMMDD-N 입니다. 글자로 견주면 「-10」 이 「-9」 보다 <<작다>>고
   나옵니다 (1 < 9). 그래서 하루에 열 번째 판부터 알림이 거꾸로 떴습니다 —
   더 옛 판을 「새 판」 이라고 내밀었습니다. 날짜와 번호를 숫자로 가릅니다.
   한쪽이라도 못 읽으면 0 — 모르는 것을 새것이라고 하지 않습니다.
   -------------------------------------------------------------- */
function verParse(v){
  const m = String(v || '').match(/^v(\d{6,8})(?:-(\d+))?/);
  return m ? [Number(m[1]), m[2] ? Number(m[2]) : 0] : null;
}
function verCmp(a, b){
  const x = verParse(a), y = verParse(b);
  if(!x || !y) return 0;
  if(x[0] !== y[0]) return x[0] > y[0] ? 1 : -1;
  if(x[1] !== y[1]) return x[1] > y[1] ? 1 : -1;
  return 0;
}
async function checkVersion(force){
  const box = document.getElementById('verNew');
  if(!box || verBusy || STORAGE_MODE !== 'nas') return;
  verBusy = true;
  if(force) box.style.display = '', box.innerHTML = '확인 중…';
  try{
    const j = await apiJson('save.php?action=version' + (force ? '&force=1' : ''));
    /* ── 브라우저가 옛 파일을 들고 있는 경우 ────────────────────────
       NAS 에 새 brand.html 을 올렸는데도 화면이 그대로일 때가 있습니다.
       브라우저가 예전에 받아 둔 파일을 계속 쓰기 때문입니다.
       서버가 말하는 판 번호(NAS 파일)와 지금 돌고 있는 판 번호(APP_VER)가
       다르면 그게 바로 그 상황입니다. 새 판 알림보다 이게 먼저입니다. */
    /* 서버가 판 번호를 못 읽으면 「(알 수 없음)」 이 옵니다. 그걸 「다른 판」
       으로 보면 멀쩡한 화면에 빨간 알림이 계속 뜹니다 — 판 번호 꼴일 때만 봅니다. */
    const onNas = String((j && j['지금']) || '').trim();
    const nasOk = /^v\d{6,}/.test(onNas);
    /* 윗줄은 자리가 좁아서(판번호·저장됨·접속자·저장소 배지가 이미 꽉 참)
       길게 쓰면 검색칸 밑으로 깔리고 ✕ 도 못 누릅니다. 그래서 윗줄 <<아래>>
       띠에 깝니다 — 저장 실패 띠와 같은 자리입니다. */
    const bar = document.getElementById('verBar');
    if(bar) bar.className = 'verbar';
    const onGit = String((j && j['최신']) || '').trim();

    /* ── 스스로 고치기 ──────────────────────────────────────────
       NAS 의 판 번호를 못 읽는데 GitHub 판 번호는 읽힌다 = save.php 가
       옛것이라는 뜻입니다. 그런데 옛 save.php 는 「새 판 있음」 을 늘 거짓으로
       내보내서 [받기] 단추가 안 떴습니다 — 고칠 단추를 고장난 쪽이 숨기고
       있었던 셈입니다. 그래서 이 경우에는 단추를 따로 띄웁니다.
       누르면 bootstrap 이 돌아 save.php 를 포함해 파일을 다시 받습니다. */
    if(j && j.ok && !nasOk && /^v\d{6,}/.test(onGit) && !verHush){
      box.style.display = 'none'; box.innerHTML = '';
      if(bar){
        bar.className = 'verbar show warn';
        bar.innerHTML = '<div class="t">⚙️ NAS 쪽 판 번호를 못 읽습니다</div>'
          + '<div class="m">NAS 의 <b>save.php</b> 가 옛것일 때 그렇습니다. '
            + '아래를 누르면 GitHub(<b>' + esc(onGit) + '</b>)에서 파일을 다시 받아 '
            + '스스로 고칩니다 — 손으로 올리실 것 없습니다.</div>'
          + '<button class="btn sm primary" onclick="pullVersion(this)">고쳐서 받기</button>'
          + '<button class="btn sm" onclick="verHushOn()">닫기</button>';
      }
      return;
    }

    /* NAS 가 <<더 새것>>일 때만 「옛 파일을 들고 있다」 입니다.
       그냥 다르면 뜨게 해 두었더니, 화면이 NAS 보다 앞서 있을 때도
       (방금 GitHub 에서 받아 온 직후) 옛 판을 받으라고 내밀었습니다. */
    if(j && j.ok && nasOk && verCmp(onNas, APP_VER) > 0 && !verHush){
      box.style.display = 'none'; box.innerHTML = '';
      if(bar){
        bar.className = 'verbar show';
        bar.innerHTML = '<div class="t">⚠️ 브라우저가 옛 파일을 들고 있습니다</div>'
          + '<div class="m">NAS 에 올려 둔 판은 <b>' + esc(onNas) + '</b> 인데 '
            + '이 화면은 <b>' + esc(APP_VER) + '</b> 을 돌리고 있습니다.</div>'
          + '<button class="btn sm primary" onclick="reloadFresh()">새로 받기</button>'
          + '<button class="btn sm" onclick="verHushOn()">닫기</button>';
      }
      return;
    }
    box.className = 'vernew';
    box.title = '';
    /* 서버가 「새 판 있음」 이라고 해도 여기서 한 번 더 봅니다 —
       옛 save.php 가 올라가 있는 NAS 도 있고, 지금 화면이 이미 그보다
       새것일 수도 있습니다. 옛 판을 「새 판」 이라고 내밀지 않습니다. */
    /* 판 번호가 같아도 <<내용>> 이 다르면 받을 것이 있는 것입니다.
       (번호를 안 올린 채 내용만 바뀐 판이 올라갈 수 있습니다) */
    const nasH = String((j && j['지금지문']) || '').trim();
    const gitH = String((j && j['최신지문']) || '').trim();
    const diff = nasH && gitH && nasH !== gitH;
    if(j && j.ok && ((j['새판있음'] && verCmp(onGit, APP_VER) > 0) || diff)){
      box.style.display = '';
      box.innerHTML = (diff && verCmp(onGit, onNas) <= 0 ? '고친 판' : '새 판 ')
        + esc(j['최신'])
        + ' <button onclick="pullVersion(this)">받기</button>';
    }else{
      box.style.display = 'none';
      box.innerHTML = '';
    }
    /* 눌러서 확인했을 때는 <<언제나>> 무슨 상황인지 말해 줍니다 —
       받을 것이 있을 때 아무 말 없이 단추만 바뀌면 눌러 본 뜻이 없습니다. */
    if(force) verReport(j);
  }catch(e){
    box.style.display = 'none';
    if(force) toast('확인하지 못했습니다');
  }finally{ verBusy = false; fitTopbar(); }
}

/* 알림을 닫아 둡니다 — 이 창을 닫을 때까지만 (새로 열면 다시 봅니다) */
let verHush = false;

/* 판 번호를 눌렀을 때 — 세 군데 판 번호를 그대로 보여 줍니다.
   「확인하지 못했습니다」 한 줄로는 무엇이 잘못됐는지 알 수가 없습니다. */
/* 지금 이 화면이 돌리고 있는 brand.html 의 지문.
   브라우저가 옛 파일을 들고 있는지는 <<판 번호로는 알 수 없습니다>> —
   번호를 안 올린 채 내용만 바뀐 판이 있기 때문입니다. 내용을 직접 잽니다. */
async function myFingerprint(){
  try{
    const r = await fetch('brand.html?t=' + Date.now(), { cache:'no-store' });
    const buf = await r.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0'))
      .join('').slice(0, 16);
  }catch(e){ return ''; }
}
async function verReport(j){
  if(!j || !j.ok){ toast('확인하지 못했습니다'); return; }
  verHush = false;
  const nas = String(j['지금'] || '').trim();
  const git = String(j['최신'] || '').trim();
  const nasH = String(j['지금지문'] || '').trim();
  const gitH = String(j['최신지문'] || '').trim();
  const nasOk = /^v\d{6,}/.test(nas);
  const L = ['화면이 돌리는 판 : ' + APP_VER,
             'NAS 파일의 판    : ' + (nas || '(못 읽음)'),
             'GitHub 의 판     : ' + (git || '(못 받음)'), ''];
  if(!nasOk){
    L.push(j['파일있음'] === false
      ? '⚠️ save.php 옆에 brand.html 이 없습니다.'
        + '\n   찾아본 곳 — ' + (j['파일경로'] || '(모름)')
        + '\n   두 파일은 같은 폴더에 있어야 합니다.'
      : '⚠️ NAS 의 save.php 가 옛것이라 판 번호를 못 읽습니다.'
        + '\n   윗줄 아래 [고쳐서 받기] 를 누르면 스스로 고칩니다.'
        + '\n   (단추가 안 보이면 주소창에 save.php?action=bootstrap 을 한 번 여세요)');
    alert(L.join('\n')); return;
  }
  /* ── 번호 말고 <<내용>> 으로 견줍니다 ───────────────────────────
     판 번호를 안 올린 채 내용만 바뀐 판이 올라갈 수 있습니다. 그때
     번호만 보면 「모두 같습니다」 라고 말하게 됩니다 — 화면은 옛것인데.
     걸리는 것이 둘일 수도 있으니 하나만 말하고 그치지 않습니다. */
  const mine = nasH ? await myFingerprint() : '';
  let hit = 0;
  if(mine && nasH && mine !== nasH){
    hit++;
    L.push('⚠️ 브라우저가 옛 파일을 들고 있습니다 — 이것부터 고치세요.'
      + '\n   화면 : ' + mine + '\n   NAS  : ' + nasH
      + '\n   [새로 받기] 를 누르거나 Ctrl+Shift+R 을 눌러 주세요.'
      + '\n   그래도 그대로면 주소 끝에 ?x=1 을 붙여 한 번 여세요.');
  }else if(nas !== APP_VER){
    hit++;
    L.push('⚠️ 브라우저가 옛 파일을 들고 있습니다.'
      + '\n   [새로 받기] 를 누르거나 Ctrl+Shift+R 을 눌러 주세요.');
  }
  if(nasH && gitH && nasH !== gitH){
    hit++;
    L.push((hit > 1 ? '\n' : '')
      + '⚠️ NAS 파일이 GitHub 것과 <<내용이 다릅니다>> (판 번호는 같아도).'
      + '\n   NAS : ' + nasH + '\n   Git : ' + gitH
      + '\n   주소창에 save.php?action=bootstrap 을 한 번 열어 주세요.');
  }else if(!hit && git && verCmp(git, nas) > 0){
    hit++;
    L.push('새 판이 나와 있습니다 — 오른쪽 위 [받기] 를 누르세요.');
  }else if(!hit && git && verCmp(nas, git) > 0){
    hit++;
    L.push('NAS 가 GitHub 보다 앞서 있습니다. 받을 것은 없습니다.');
  }
  if(!hit){
    L.push('✅ 모두 같습니다 — 판 번호도, 파일 내용도.'
      + (nasH ? '\n   지문 ' + nasH : ''));
  }
  alert(L.join('\n'));
}

async function pullVersion(btn){
  btn.disabled = true;
  btn.textContent = '받는 중…';
  try{
    const j = await apiJson('save.php?action=bootstrap');
    if(!j || !j.ok){
      alert('새 판을 받지 못했습니다.\n\n'
        + JSON.stringify((j && (j['결과'] || j['실패원인'])) || j, null, 1));
      btn.disabled = false; btn.textContent = '받기';
      return;
    }
    // 브라우저가 옛 파일을 기억하고 있을 수 있어 주소에 표시를 붙여 새로 엽니다
    location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  }catch(e){
    alert('새 판을 받지 못했습니다.\n\n' + (e.message || e));
    btn.disabled = false; btn.textContent = '받기';
  }
}

/* ── 화면을 다시 그려도 하던 일이 끊기지 않게 ────────────────────────
   여러 명이 같이 쓰다 보면 (다른 사람 저장 반영, 채널 새 글 확인 같은 일로)
   내가 글을 쓰는 중에도 화면이 다시 그려질 수 있습니다.
   그때 쓰던 글이 날아가거나 커서가 튀지 않도록,
   다시 그리기 전에 '지금 상태' 를 적어 두었다가 그대로 되돌려 놓습니다. */

function captureUI(){
  const main = document.getElementById('main');
  const el   = document.activeElement;
  const snap = {
    y: window.scrollY,
    scrolls: [],
    field: null
  };
  if(main){
    // 표·목록 안에서 스크롤해 둔 위치
    main.querySelectorAll('.table-wrap,.flist,.tidylist,.doc-body').forEach((n, i) => {
      if(n.scrollTop) snap.scrolls.push([i, n.scrollTop]);
    });
    // 지금 글을 쓰고 있던 칸
    /* 파일 고르개는 값을 돌려놓을 수 없습니다 — 브라우저가 막습니다
       (value 에는 빈 글자만 넣을 수 있음). 파일을 고른 뒤 다시 그리면
       여기서 걸려 스크롤 되돌리기까지 통째로 멈췄습니다. */
    const isFile = el && el.tagName === 'INPUT'
                && String(el.type || '').toLowerCase() === 'file';
    if(el && !isFile && main.contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){
      const all = Array.prototype.slice.call(main.querySelectorAll('input,textarea,select'));
      snap.field = { id: el.id, idx: all.indexOf(el), value: el.value,
                     s: el.selectionStart, e: el.selectionEnd, top: el.scrollTop };
    }
  }
  return snap;
}

function restoreUI(snap){
  if(!snap) return;
  const main = document.getElementById('main');
  if(main && snap.scrolls.length){
    const nodes = main.querySelectorAll('.table-wrap,.flist,.tidylist,.doc-body');
    snap.scrolls.forEach(([i, top]) => { if(nodes[i]) nodes[i].scrollTop = top; });
  }
  const f = snap.field;
  if(f){
    let el = f.id ? document.getElementById(f.id) : null;
    if(!el && f.idx >= 0 && main){        // 이름표가 없으면 몇 번째 칸이었는지로 찾습니다
      el = main.querySelectorAll('input,textarea,select')[f.idx] || null;
    }
    if(el && el.type === 'file') el = null;          // 여기에도 한 겹 (자리로 찾았을 때)
    if(el){
      /* 값을 못 넣는 칸이 있어도 나머지는 돌려놓아야 합니다 */
      try{ if(el.value !== f.value) el.value = f.value; }catch(e){}
      try{ el.focus({ preventScroll:true }); }catch(e){ el.focus(); }
      try{ if(f.s !== null && f.s !== undefined) el.setSelectionRange(f.s, f.e); }catch(e){}
      el.scrollTop = f.top;
    }
  }
  if(Math.abs(window.scrollY - snap.y) > 2) window.scrollTo(0, snap.y);
}

function render(){
  /* 두 번 눌러 고치는 중이면 다시 그리지 않습니다 — 그리면 쓰던 칸이
     사라집니다. 빠져나올 때 한 번 그립니다. (칸이 이미 없으면 그냥 그립니다) */
  if(edOn && document.getElementById('edBox')){ edSkip = true; return; }
  // 브랜드가 사라졌는데(다른 사람이 지웠다든지) 그 화면을 보고 있으면 홈으로
  if(currentBrandId && !data.brands.some(b => b.id === currentBrandId)){
    currentBrandId = null;
    view = 'home';
  }

  const snap = captureUI();

  // 로그인이 필요한 상태면 로그인 화면만 그립니다
  if(STORAGE_MODE === 'nas' && ((authOn() && !(auth.state && auth.state['로그인됨'])) || showSetup)){
    document.body.classList.add('locked');
    document.getElementById('main').innerHTML = authScreen();
    const lay = document.getElementById('usersLayer');
    if(lay) lay.innerHTML = '';
    restoreUI(snap);
    return;
  }
  document.body.classList.remove('locked');

  paintVersion();
  paintTools();
  renderSidebar();
  const home = document.getElementById('homeBtn');
  const nas  = document.getElementById('nasBtn');
  if(home) home.classList.toggle('on', view === 'home' && !searchQuery && !currentBrandId);
  if(nas)  nas.classList.toggle('on',  view === 'nas'  && !searchQuery);
  /* 명함은 왼쪽에서 뺐습니다 — 단추가 없어도 아래 if(el) 로 그냥 넘어갑니다 */
  [['obBtn','onboard'],
   ['meetBtn','meetings'],['calBtn','calendar'],['taskBtn','tasks'],['growBtn','growth'],
   ['costBtn','costs'],['blogBtn','blog'],
   ['trashBtn','trash']].forEach(([id, v]) => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle('on', view === v && !searchQuery);
  });
  const mc = document.getElementById('meetCnt');
  if(mc) mc.textContent = (data.meetings || []).length || '';
  const cc = document.getElementById('calCnt');
  if(cc) cc.textContent = (data.events || []).length || '';
  const kc = document.getElementById('taskCnt');
  if(kc) kc.textContent = data.brands.reduce((a, b) =>
    a + (b.tasks || []).filter(t => t.status !== '완료').length, 0) || '';
  const gc = document.getElementById('growCnt');
  if(gc) gc.textContent = (data.growth || []).reduce((a, g) =>
    a + (g.stages || []).reduce((x, st) => x + (st.items || []).length, 0), 0) || '';
  const nc = document.getElementById('cardCnt');
  if(nc) nc.textContent = (data.cards || []).length || '';
  const sc = document.getElementById('costCnt');
  if(sc) sc.textContent = data.brands.reduce((a, b) => a + (b.costs || []).length, 0) || '';
  const bc = document.getElementById('blogCnt');
  if(bc) bc.textContent = blog.loaded ? (blog.rows.length || '') : '';
  const tc = document.getElementById('trashCnt');
  if(tc) tc.textContent = (data.trash || []).length || '';
  const up = document.getElementById('usersLayer');
  if(up) up.innerHTML = usersPanel() + wipePanel() + histPanel() + whoPanel() + tpPanel()
                      + pickPanel() + netPanel() + pastePanel() + trashPanel() + teamPickPanel();
  /* 접점 상세판의 글칸은 내용만큼 늘려 놓습니다 — 안 그러면 두 줄만 보이고 잘립니다 */
  if(tpOpen) setTimeout(() => {
    document.querySelectorAll('.tp-d textarea').forEach(gbGrow);
  }, 0);
  if(searchQuery.trim()) renderSearch();
  else if(view === 'nas') renderNas();
  else if(view === 'onboard') renderOnboard();
  else if(view === 'meetings') renderMeetings();
  else if(view === 'calendar') renderCalendar();
  else if(view === 'tasks') renderTasks();
  else if(view === 'growth') renderGrowth();
  else if(view === 'cards') renderCards();
  else if(view === 'costs') renderCosts();
  else if(view === 'blog') renderBlog();
  else if(view === 'trash') renderTrash();
  else if(view === 'page') renderPage();
  else if(!currentBrandId) renderHome();
  else renderBrand();
  restoreUI(snap);
  gbGrowAll();   // 글 칸 높이를 내용에 맞춥니다 (한 줄이면 한 줄로)
  foldAll();     // 접어 둘 만큼 긴 글에만 [＋ 더 보기] 를 답니다
}

   옮겨가면 저절로 닫힙니다 (연 채로 두면 내용이 안 보입니다).      */
let navOpen = false;
function toggleNav(){
  navOpen = !navOpen;
  document.body.classList.toggle('nav-open', navOpen);
  if(navOpen) window.scrollTo({ top:0, behavior:'smooth' });
}
function closeNav(){
  if(!navOpen) return;
  navOpen = false;
  document.body.classList.remove('nav-open');
}

/* 브랜드와 상관없는 화면(회의록·달력)으로 갑니다 */
/* ═══════════════ 📑 손수 만드는 목록 ═════════════════════════════
   왼쪽 묶음(업무관리 · 팀운영 · 기록·설정)은 우리가 정해 둔 줄만
   있었습니다. 팀이 실제로 쓰는 것은 그때그때 생기는데, 새 줄 하나를
   넣으려면 이 파일을 고쳐야 했습니다.

   이제 묶음마다 [＋ 목록] 이 있고, 만든 목록은 그 자리에 섭니다.
   목록 안은 <<탭>> 으로 또 나뉩니다 — 「AI 모음」 안에 프롬프트 · 도구 ·
   쓰는 법이 섞여 있으면 찾는 데 시간이 걸립니다.
     목록 → 탭 → 칸
   ================================================================= */
const PAGE_GROUPS = ['업무관리', '팀운영', '기록 · 설정'];
const PAGE_HUES = ['var(--blue)', 'var(--purple)', 'var(--green)', 'var(--orange)',
                   'var(--cyan)', 'var(--red)', 'var(--amber,#f59e0b)'];
let pageAt = '';          // 보고 있는 목록
let pageTab = {};         // 목록마다 보고 있는 탭 (id → tabId)

function pagesOf(){
  if(!Array.isArray(data.pages)) data.pages = [];
  return data.pages;
}
function pageFind(id){ return pagesOf().find(x => x.id === id) || null; }
function pageTabsOf(pg){
  if(!pg) return [];
  if(!Array.isArray(pg.tabs)) pg.tabs = [];
  return pg.tabs;
}
function pageItemsOf(pg){
  if(!pg) return [];
  if(!Array.isArray(pg.items)) pg.items = [];
  return pg.items;
}
/* 지금 보고 있는 탭 — 지운 탭을 보고 있었으면 첫 탭으로 돌아옵니다 */
function pageTabAt(pg){
  const ts = pageTabsOf(pg);
  if(!ts.length) return '';
  const w = pageTab[pg.id];
  return ts.some(t => t.id === w) ? w : ts[0].id;
}
function setPageTab(pid, tid){ pageTab[pid] = tid; render(); }
function goPage(id){
  closeNav(); clearSearchQuietly();
  view = 'page'; pageAt = id; currentBrandId = null;
  render(); window.scrollTo({ top:0, behavior:'smooth' });
}
function pageAdd(group){
  const pg = { id: uid('pg'), name: '새 목록', icon: '📑', group: group,
               color: PAGE_HUES[pagesOf().length % PAGE_HUES.length],
               tabs: [{ id: uid('pt'), name: '전체' }], items: [] };
  pagesOf().push(pg);
  markDirtyAll();
  goPage(pg.id);
  /* 만들자마자 이름 칸을 엽니다 — 「새 목록」 이 그대로 남으면
     두 개째부터 어느 게 어느 건지 모릅니다 */
  setTimeout(() => {
    const el = document.querySelector('[data-ed="pg"][data-i="' + pg.id + '"][data-f="name"]');
    if(el) edStart(el);
  }, 120);
}
function pageDel(id){
  const pg = pageFind(id); if(!pg) return;
  if(!confirm('「' + (pg.name || '이름 없음') + '」 목록을 지웁니다.\n\n'
    + '안에 적어 둔 ' + pageItemsOf(pg).length + '칸도 같이 갑니다. '
    + '휴지통에서 되돌릴 수 있습니다.')) return;
  trashPut('목록', pg.name || '이름 없음', JSON.parse(JSON.stringify(pg)),
           { kind:'top', type:'pages' });
  data.pages = pagesOf().filter(x => x.id !== id);
  deletedIds.add(id);
  pageAt = ''; view = 'home';
  markDirtyAll(); render();
}
function pageSet(id, f, v){
  const pg = pageFind(id); if(!pg) return;
  pg[f] = v; markDirtyAll();
}
function pageTabAdd(pid){
  const pg = pageFind(pid); if(!pg) return;
  const t = { id: uid('pt'), name: '새 탭' };
  pageTabsOf(pg).push(t);
  pageTab[pid] = t.id;
  markDirtyAll(); render();
  setTimeout(() => {
    const el = document.querySelector('[data-ed="pgtab"][data-g="' + pid
      + '"][data-i="' + t.id + '"]');
    if(el) edStart(el);
  }, 120);
}
function pageTabDel(pid, tid){
  const pg = pageFind(pid); if(!pg) return;
  const ts = pageTabsOf(pg);
  if(ts.length <= 1){ toast('⚠️ 탭이 하나는 있어야 합니다'); return; }
  const mine = pageItemsOf(pg).filter(x => x.tab === tid);
  if(mine.length && !confirm('이 탭에 적어 둔 ' + mine.length + '칸도 같이 지웁니다.')) return;
  pg.tabs = ts.filter(t => t.id !== tid);
  pg.items = pageItemsOf(pg).filter(x => x.tab !== tid);
  mine.forEach(x => deletedIds.add(x.id));
  deletedIds.add(tid);
  markDirtyAll(); render();
}
function pageTabSet(pid, tid, v){
  const pg = pageFind(pid); if(!pg) return;
  const t = pageTabsOf(pg).find(x => x.id === tid); if(!t) return;
  t.name = v; markDirtyAll();
}
/* ── 📎 큰 파일 올리기 ────────────────────────────────────────
   알집 · 영상처럼 1GB 가 넘는 것도 올립니다. PHP 는 한 번에 받는 크기가
   정해져 있어서(기본 8~64MB) 통째로 보내면 <<서버에 닿기도 전에>> 잘립니다.
   그래서 잘라서 여러 번 보냅니다. 조각 크기는 서버가 「이만큼씩 보내라」 고
   알려 주는 값을 씁니다 — 화면이 정해 두면 한도가 작은 NAS 에서 그대로
   실패합니다.
   ------------------------------------------------------------ */
const pgUp = {};       // 올리는 중인 것 (목록 id → {name, pct, n, of, err})

function bytesText(n){
  n = Number(n) || 0;
  if(n >= 1073741824) return (n / 1073741824).toFixed(n >= 10737418240 ? 0 : 1) + 'GB';
  if(n >= 1048576)    return Math.round(n / 1048576) + 'MB';
  if(n >= 1024)       return Math.round(n / 1024) + 'KB';
  return n + 'B';
}
/* 이름 끝을 보고 그림 하나 — 무엇인지 한눈에 보이게 */
function fileEmo(nm){
  const e = String(nm || '').toLowerCase().split('.').pop();
  if(['alz','egg','zip','7z','rar','tar','gz'].indexOf(e) >= 0) return '🗜';
  if(['mp4','mov','avi','mkv','webm','wmv'].indexOf(e) >= 0)    return '🎬';
  if(['mp3','wav','m4a','flac'].indexOf(e) >= 0)                return '🎵';
  if(['png','jpg','jpeg','gif','webp','svg','heic'].indexOf(e) >= 0) return '🖼';
  if(e === 'pdf') return '📕';
  if(['doc','docx','hwp','hwpx'].indexOf(e) >= 0) return '📄';
  if(['xls','xlsx','csv'].indexOf(e) >= 0) return '📊';
  if(['ppt','pptx'].indexOf(e) >= 0) return '📽';
  if(['psd','ai','sketch','fig','xd'].indexOf(e) >= 0) return '🎨';
  return '📎';
}
async function pgPost(action, form){
  const res = await fetch('files.php?action=' + action, { method:'POST', body: form });
  const txt = await res.text();
  let j = null;
  try{ j = JSON.parse(txt); }catch(e){}
  if(!j) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
    + txt.slice(0, 160).replace(/\s+/g, ' '));
  if(!j.ok) throw new Error(j.error || '올리지 못했습니다');
  return j;
}
/* 파일 하나를 쪼개 올립니다. onStep 으로 얼마나 갔는지 알려 줍니다. */
async function pgUploadOne(file, where, onStep){
  const f0 = new FormData();
  f0.append('name', file.name); f0.append('size', String(file.size));
  f0.append('brand', where.brand); f0.append('sub', where.sub);
  f0.append('sub2', where.sub2 || ''); f0.append('sub3', where.sub3 || '');
  /* 새로 쌓지 않고 있던 파일을 그 자리에서 고쳐 쓸 때 (브랜드북 원본 고치기) */
  f0.append('over', where.over || '');
  const st = await pgPost('chunkstart', f0);
  const ch = Math.max(65536, Number(st.chunk) || 1048576);
  const of = Math.max(1, Math.ceil(file.size / ch));
  try{
    for(let i = 0, off = 0; off < file.size; i++, off += ch){
      /* 1GB 를 보내면 조각이 백 번 넘게 오갑니다. 그중 한 번만 끊겨도
         처음부터 다시 하게 두면 터널 너머에서는 거의 못 올립니다.
         같은 조각을 세 번까지 다시 보냅니다 — 서버는 차례가 맞는 것만
         받으므로 두 번 들어가는 일은 없습니다. */
      let last = null;
      for(let t = 0; t < 3; t++){
        const fd = new FormData();
        fd.append('up', st.up); fd.append('i', String(i));
        fd.append('blob', file.slice(off, Math.min(off + ch, file.size)), 'b');
        try{ await pgPost('chunk', fd); last = null; break; }
        catch(e){
          last = e;
          /* 서버가 「그 조각은 이미 받았다」 면 다음으로 넘어갑니다 */
          if(/차례가 어긋/.test(String(e.message || ''))) { last = null; break; }
          if(t < 2) await new Promise(r => setTimeout(r, 700 * (t + 1)));
        }
      }
      if(last) throw last;
      if(onStep) onStep(i + 1, of);
    }
    const fd = new FormData(); fd.append('up', st.up);
    return await pgPost('chunkdone', fd);
  }catch(e){
    /* 그만둘 때 조각을 치웁니다 — 안 치우면 NAS 에 반쪽이 쌓입니다 */
    try{ const fa = new FormData(); fa.append('up', st.up);
         await fetch('files.php?action=chunkabort', { method:'POST', body: fa }); }catch(e2){}
    throw e;
  }
}
function pgFilePick(pid, tid){
  const el = document.getElementById('pgFileInput');
  if(!el) return;
  el.dataset.pid = pid; el.dataset.tid = tid;
  el.click();
}
async function pgFileGot(fileList, pid, tid){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  /* 어느 목록 · 어느 탭인지는 [📎 파일 올리기] 가 적어 둡니다. 끌어다 놓기처럼
     그 길을 안 거치고 들어오면 지금 보고 있는 자리로 넣습니다. */
  const pg = pageFind(pid) || pageFind(pageAt); if(!pg) return;
  pid = pg.id;
  const tab = pageTabsOf(pg).find(t => t.id === tid) || pageTabsOf(pg).find(t => t.id === pageTabAt(pg))
            || pageTabsOf(pg)[0];
  tid = tab ? tab.id : '';
  const where = { brand:'_팀자료', sub:'팀자료',
                  sub2: pg.name || '목록', sub3: (tab && tab.name) || '' };
  for(const f of files){
    pgUp[pid] = { name: f.name, size: f.size, pct: 0, n: 0, of: 0, err: '' };
    render();
    try{
      const out = await pgUploadOne(f, where, (n, of) => {
        const u = pgUp[pid]; if(!u) return;
        u.n = n; u.of = of; u.pct = Math.round(n / of * 100);
        const bar = document.getElementById('pgUpBar');
        const txt = document.getElementById('pgUpTxt');
        if(bar) bar.style.width = u.pct + '%';
        if(txt) txt.textContent = u.pct + '% · ' + n + '/' + of + ' 조각';
      });
      const it = { id: uid('pi'), tab: tid || pageTabAt(pg), title: out.fileName,
                   url:'', body:'',
                   file: { name: out.fileName, path: out.filePath,
                           size: out.fileSize, at: new Date().toISOString() } };
      pageItemsOf(pg).push(it);
      markDirtyAll();
      toast('📎 ' + out.fileName + ' (' + bytesText(out.fileSize) + ') 올렸습니다');
    }catch(e){
      pgUp[pid] = { name: f.name, size: f.size, pct: 0, n: 0, of: 0,
                    err: String((e && e.message) || e) };
      render();
      return;                       // 하나가 막히면 거기서 멈춥니다
    }
  }
  delete pgUp[pid];
  render();
}
function pgUpClose(pid){ delete pgUp[pid]; render(); }

            ? '<button class="btn sm" title="아래로" onclick="moveBrand(\'' + b.id + '\',1)">↓</button>' : '')
      + '</span></div>';
  }).join('');
}

function inquiryStats(brandName){
  const rows = inquiryCache.byBrand[brandName] || [];
  if(!rows.length) return null;
  const s = inquirySummary(rows);
  const diff = s.lastMonth > 0
    ? Math.round((s.thisMonth - s.lastMonth) / s.lastMonth * 100) : null;
  return { total: rows.length, thisMonth: s.thisMonth, lastMonth: s.lastMonth, diff, latest: s.latest };
}

/* ── 🪧 머리말 — 첫 화면에서 「우리가 왜 있는 팀인지」 한 문장 ──────
   단 목록부터 들이밀면 신입은 무엇부터 봐야 하는지 모릅니다.
   큰 한 문장과 숫자 몇 개가 먼저 와야 합니다. */
/* ── 단을 어떤 모양으로 보여줄까 ────────────────────────────────
   같은 자료라도 모양이 다르면 읽는 속도가 다릅니다.
     칸   — 항목을 나란히. 대부분 여기가 맞습니다.
     조직도 — 층위를 보여줘야 할 때 (브랜드 지도처럼). 단 → 항목 → 하위 →
              하위 본문을 「·」 로 나눈 낱말이 네 층이 됩니다.
     표   — 같은 항목을 여러 갈래로 견줄 때 (팀마다 목적 · 하는 일 …).
              항목이 세로줄, 하위 이름이 가로줄이 됩니다.
   ------------------------------------------------------------ */
const OB_VIEWS = [['', '⚙︎ 자동'], ['cards', '▤ 칸'],
                 ['tree', '🌳 조직도'], ['matrix', '▦ 표'], ['hist', '🕰 연표']];
/* ── 🕰 해가 <<항목>> 인 단 ───────────────────────────────────
   팀을 항목으로 두고 해를 그 밑에 달면, 모든 해가 <<같은 팀 목록>>을
   쓰게 됩니다. 실제로는 해마다 팀 수도 다르고, 어느 해는 사람이나
   브랜드로 나눠 맡습니다. 그래서 해를 항목으로 올립니다 —
   해마다 그 해의 줄을 제 마음대로 넣고 뺄 수 있어야 합니다.
     단 → 2026 → [전략마케팅팀 · 소라님 · 아파트스퀘어 …] → 무엇을
   ------------------------------------------------------------ */
function obYearRows(sc){
  const its = (sc && sc.items || []).filter(it => String(it.title || '').trim());
  if(!its.length || !its.every(it => obIsYear(it.title))) return null;
  return its.slice().sort((a, c) =>
    Number(obYearOf(c.title)) - Number(obYearOf(a.title)));
}
/* 손으로 고른 것이 없으면 자료 모양을 보고 고릅니다 — 이미 적어 둔 단은
   모양 칸이 없어서 전부 「칸」 으로만 나오고 있었습니다 */
function obView(sc){
  const v = String((sc && sc.view) || '').trim();
  if(v === 'hist') return obYearRows(sc) ? 'hist' : 'matrix';
  if(v === 'tree' || v === 'matrix' || v === 'cards') return v;
  return obAutoView(sc);
}
function obAutoView(sc){
  const its = (sc && sc.items || []).filter(it => String(it.title || '').trim());
  if(obYearRows(sc)) return 'hist';          // 항목이 해면 연표입니다
  if(its.length < 2) return 'cards';
  /* 같은 이름의 하위가 여러 항목에 걸쳐 있으면 견주는 표입니다 */
  const n = {};
  its.forEach(it => (it.kids || []).forEach(k => {
    const t = String(k.title || '').trim();
    if(t) n[t] = (n[t] || 0) + 1;
  }));
  if(Object.keys(n).filter(t => n[t] >= 2).length >= 1
     && its.filter(it => (it.kids || []).length).length >= 2) return 'matrix';
  /* 「가 · 나 · 다」 로 늘어놓은 하위가 있으면 층이 하나 더 있는 것입니다 */
  const listy = it => (it.kids || []).some(k => obLeaves(k.body).length >= 2)
    || obLeaves(it.body).length >= 2;
  if(its.some(listy)) return 'tree';
  return 'cards';
}
/* 하위 본문을 「·」 로 나눈 낱말 — 조직도의 맨 아래 층.
   한 줄짜리 · 짧은 낱말만 목록으로 봅니다. 문장에도 「·」 는 흔합니다. */
function obLeaves(body){
  const raw = String(body || '');
  if(raw.indexOf('\n') >= 0) return [];          // 여러 줄이면 글입니다
  const t = raw.replace(/\s+/g, ' ').trim();
  if(!t || t.length > 70 || /[→←↔]/.test(t)) return [];
  if(!/[·•]/.test(t)) return [];
  const l = t.split(/\s*[·•]\s*/).map(x => x.trim()).filter(Boolean);
  if(l.length < 2 || l.some(x => x.length > 22)) return [];
  return l;
}
/* 표 — 항목이 세로줄, 하위 이름이 가로줄 */
function obMatrix(sc){
  const cols = (sc.items || []).filter(it => String(it.title || '').trim());
  if(cols.length < 2) return null;
  let rows = [];
  cols.forEach(it => (it.kids || []).forEach(k => {
    const t = String(k.title || '').trim();
    if(t && rows.indexOf(t) < 0) rows.push(t);
  }));
  if(!rows.length) return null;
  /* 해로 적힌 가로줄이면 최근이 위로 옵니다 — 적은 차례가 아니라 때 순서.
     해가 <<하나뿐일 때도>> 연표입니다. 둘부터로 두었더니, 2026 한 해만
     적어 둔 단이 표로 깔려서 「히스토리로 안 나온다」 가 됐습니다.
     한 줄짜리 표는 표도 아니고, 내년 줄이 붙을 자리도 안 보입니다. */
  const yearly = rows.length >= 1 && rows.every(obIsYear);
  if(yearly) rows = rows.slice().sort((a, b) => Number(obYearOf(b)) - Number(obYearOf(a)));
  return { cols: cols, rows: rows, hasBody: cols.some(it => String(it.body || '').trim()),
           yearly: yearly };
}

/* 아직 안 적힌 곳을 스스로 세어 맨 아래에 모읍니다 — 배포 전에 채울 목록 */
function obGaps(){
  const out = [];
  obOf().forEach((sc, si) => {
    const nm = String(sc.title || '이름 없는 단').trim();
    if(!sc.items.length){ out.push({ t: nm + ' — 항목이 하나도 없습니다', l: (si + 1) + '단' }); return; }
    sc.items.forEach(it => {
      const t = String(it.title || '').trim();
      if(!t) return;
      if(!String(it.body || '').trim() && !(it.kids || []).some(k =>
          String(k.title || '').trim() || String(k.body || '').trim()))
        out.push({ t: t + ' — 설명이 비어 있습니다', l: (si + 1) + '단 · ' + nm });
      /* 어떤 하위에는 설명이 있고 어떤 하위에는 없으면 덜 채운 것입니다.
         전부 이름만이면 그건 목록이라 비어 있는 게 아닙니다. */
      const ks = (it.kids || []).filter(k => String(k.title || '').trim());
      if(ks.some(k => String(k.body || '').trim()))
        ks.filter(k => !String(k.body || '').trim()).forEach(k =>
          out.push({ t: k.title.trim() + ' — 한 줄 설명 없음', l: (si + 1) + '단 · ' + t }));
    });
  });
  return out;
}

function obOf(){
  if(!Array.isArray(data.onboard)) data.onboard = obSeed();

/* 카테고리로 나눠 봅니다 — 「전체」 가 처음 자리이고, 하나를 고르면 그 단만
   보입니다. 첫날은 전체로 쭉 읽고, 나중에 「2026년 목표만」 볼 때 고릅니다. */

function obCount(sc){

/* ── 📅 해마다 적는 단 ────────────────────────────────────────
   「2026년 목표」 처럼 해가 바뀌면 다시 쓰는 단이 있습니다. 해를 항목마다
   손으로 하나씩 더하게 하면 내년에 아무도 안 씁니다.
   한 번 눌러 해 한 줄을 모든 항목에 깔아 줍니다.
   표로 보면 팀이 세로줄, 해가 가로줄이 되어 해마다 견줘집니다.
   ------------------------------------------------------------ */
function obIsYear(t){ return /^\s*\d{4}\s*년?\s*$/.test(String(t || '')); }
function obYearOf(t){ const m = String(t || '').match(/\d{4}/); return m ? m[0] : ''; }
/* 해를 한 줄 더합니다 — 모든 항목에 같은 이름의 하위가 생깁니다 */
/* 팀→해 로 적어 둔 단을 해→줄 로 뒤집습니다. 해마다 줄이 달라질 수
   있게 되려면 해가 위에 와야 합니다. 적어 둔 글은 그대로 옮깁니다. */
function obFlipYears(sid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  if(obYearRows(sc)){ toast('이미 해가 위에 있습니다'); return; }
  const out = {};            // 해 → [{title(팀), body}]
  (sc.items || []).forEach(it => {
    const nm = String(it.title || '').trim();
    (it.kids || []).forEach(k => {
      const y = obYearOf(k.title);
      if(!y) return;
      (out[y] = out[y] || []).push({ id: uid('ok'), title: nm,
                                     body: String(k.body || '') });
    });
  });
  const ys = Object.keys(out);
  if(!ys.length){ toast('해로 적힌 줄이 없습니다'); return; }
  if(!confirm('해를 위로 올립니다.\n\n'
    + ys.sort().join(' · ') + ' — 해마다 그 해의 줄만 남습니다.\n'
    + '이 뒤로는 해마다 팀·사람·브랜드를 다르게 넣을 수 있습니다.\n\n'
    + '적어 두신 글은 그대로 옮겨집니다.')) return;
  sc.items = ys.sort((a, b) => Number(b) - Number(a))
    .map(y => ({ id: uid('oi'), title: y, body: '', kids: out[y] }));
  sc.view = 'hist';
  obMark(); render();
  toast('🕰 해를 위로 올렸습니다');
}
/* 표의 빈 칸 — 그 줄 이름을 가진 하위가 <<아직 없어서>> 비어 있습니다.
   「—」 로 막아 두면 채울 길이 없습니다. 누르면 그 자리를 만들고
   바로 칸을 엽니다. */
function obCellAdd(sid, iid, row){

  const it = (sc.items || []).find(x => x.id === iid); if(!it) return;

  if(!k){ k = { id: uid('ok'), title: row, own: '', body: '' }; it.kids.push(k); }

  setTimeout(() => {
    const el = document.querySelector('[data-ed="obkid"][data-i="' + it.id
      + '"][data-k="' + k.id + '"][data-f="body"]');
