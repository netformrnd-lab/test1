.ob-1f .k{flex:0 0 132px;font-size:13px;font-weight:800;color:var(--text-secondary)}
.ob-1f .v{flex:1 1 220px;min-width:0;font-size:15px;line-height:1.7;
  color:var(--text-primary);word-break:break-word}
/* ── 인포 — 「이름 — 내용」 을 표찰과 내용으로 세웁니다 ─────────
   같은 글인데 한 문단으로 흘리면 읽히지 않고, 갈라 세우면 훑힙니다. */
.iv-rows{display:flex;flex-direction:column;gap:6px}
.iv-r{display:flex;gap:10px;align-items:baseline}
.iv-rows.plain .iv-r,.iv-r.lead{display:block}
.iv-r.lead + .iv-r{margin-top:2px}
.iv-k{flex:0 0 auto;min-width:76px;max-width:150px;padding:2px 9px;
  border-radius:99px;background:var(--bg-card);border:1px solid var(--border);
  font-size:11.5px;font-weight:800;color:var(--text-secondary);
  text-align:center;word-break:keep-all}
.iv-k.em{background:transparent;border-color:transparent;min-width:76px}
.iv-v{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.75;
  color:var(--text-primary);word-break:keep-all}
/* ❶ 네 칸을 판으로 — 세로로 네 줄 쌓으면 그게 다시 글줄이 됩니다 */
.ob-1g{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
.ob-1g .ob-1f{flex-direction:column;gap:9px;background:var(--bg-card)}
.ob-1g .ob-1f.no{border-left-color:var(--red)}
.ob-1g .ob-1f .k{flex:0 0 auto;display:flex;align-items:center;gap:7px;
  font-size:12.5px;letter-spacing:.01em}
.ob-1g .ob-1f .k i{font-style:normal;font-size:17px;line-height:1}
.ob-1g .ob-1f > .fold{flex:1 1 auto;width:100%}
.ob-1g .fold .fd-b{max-height:10.6em}
/* 역할 — 상대 ▸ 우리가 무엇 */
.id-rs .r .ar{flex:0 0 auto;font-style:normal;font-size:13px;color:var(--text-muted)}
.ob-1m{margin-top:9px;font-size:11.5px;color:var(--text-muted)}
.ob-1m span{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;
  border:1px dashed var(--border);background:var(--bg-sunken)}
.modal .pe-1l,.pe-1l{display:block;margin:14px 0 5px;font-size:12.5px;font-weight:700;
  color:var(--text-secondary)}
.pe-1l span{display:block;margin-top:2px;font-size:11px;font-weight:400;
  color:var(--text-muted)}
/* ── 📖 통독하는 문서 (「전체」 일 때) ─────────────────────────
   표지 · 목차 · 장 번호 · 리드 문단 · 인용구. 신입이 첫날 처음부터
   끝까지 읽는 자리라, 찾아보는 화면과는 짜임이 달라야 합니다. */
.pw-cov{padding:34px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.pw-cov .bn{font-size:12.5px;font-weight:800;letter-spacing:.04em;
  color:var(--text-muted);margin-bottom:18px}
.pw-cov .ti{font-size:34px;font-weight:800;line-height:1.35;letter-spacing:-.04em;
  color:var(--text-primary);word-break:keep-all;max-width:880px}
.pw-cov .sb{margin:16px 0 0;max-width:780px;font-size:16px;line-height:1.85;
  color:var(--text-secondary);word-break:keep-all}
.pw-cov .mt{margin-top:22px;font-size:12px;font-weight:700;color:var(--text-muted)}
.pw-cov .mt span{margin-left:8px;font-weight:400}
/* 표지의 큰 숫자 — 글보다 먼저 들어옵니다 */
.pw-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));
  gap:1px;margin-top:26px;background:var(--border);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.pw-nums button{display:flex;flex-direction:column;gap:3px;padding:15px 14px;
  border:none;background:var(--bg-card);cursor:pointer;font-family:inherit;
  text-align:left}
.pw-nums button:hover{background:var(--blue-soft)}
.pw-nums b{font-size:24px;font-weight:800;letter-spacing:-.03em;
  color:var(--text-primary);font-variant-numeric:tabular-nums}
.pw-nums span{font-size:11.5px;font-weight:700;color:var(--text-muted);
  word-break:keep-all}
/* 목차 — 번호와 이름만. 누르면 그 장만 펴집니다 */
.pw-toc{list-style:none;margin:26px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);
  overflow:hidden}
.pw-toc li{background:var(--bg-card)}
.pw-toc button{display:flex;align-items:baseline;gap:10px;width:100%;
  padding:12px 14px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;text-align:left}
.pw-toc button:hover{background:var(--blue-soft)}
.pw-toc i{font-style:normal;font-size:11px;font-weight:800;color:var(--text-muted);
  font-variant-numeric:tabular-nums}
.pw-toc b{font-size:14px;font-weight:700;color:var(--text-primary);word-break:keep-all}
/* 장 — 번호를 크게 위로 올리고 제목을 키웁니다 */
.pw-doc .ob{padding:38px 0 30px}
.pw-doc .ob-h{display:block;margin-bottom:16px}
.pw-doc .ob-h .no{display:block;width:auto;height:auto;border-radius:0;
  background:transparent;color:var(--text-muted);font-size:12px;font-weight:800;
  letter-spacing:.08em;margin-bottom:7px}
.pw-doc .ob-h h3{font-size:25px;letter-spacing:-.03em;line-height:1.35}
.pw-doc .ob-h .hn{display:block;margin-top:8px;max-width:780px;font-size:14.5px;
  line-height:1.85;color:var(--text-secondary)}
.pw-doc .ob-h .ob-ed{position:absolute;right:0;margin-top:-28px}
.pw-doc .ob-h{position:relative}
/* 철학은 인용구로 세웁니다 — 통독할 때 숨을 고르는 자리 */
.pw-doc .id-ph{border:none;border-left:3px solid var(--ink);border-radius:0;
  background:transparent;padding:4px 0 4px 20px;margin-top:18px}
.pw-doc .id-ph > b{display:none}
.pw-doc .id-ph .iv-v,.pw-doc .id-ph span{font-size:18px;line-height:1.8;
  font-weight:700;letter-spacing:-.015em;color:var(--text-primary)}
@media(max-width:700px){.pw-cov{padding:24px 0 22px}
  .pw-cov .ti{font-size:25px}
  .pw-doc .ob-h h3{font-size:20px}}

/* ── 🎨 이 브랜드는 어떤 얼굴인가 ──────────────────────────────
   슬로건 · 성격 · 철학 · 타겟 · 톤앤매너 · 용어 · 해마다의 목표.
   전부 「읽는 자리」 라 글자 크기로만 위계를 줍니다. */
.pw-slg{margin-top:9px;font-size:24px;font-weight:800;line-height:1.5;
  letter-spacing:-.03em;color:var(--text-primary);word-break:keep-all}
.id-ph,.id-tn{display:flex;gap:12px;margin-top:12px;padding:13px 15px;
  border:1px solid var(--border);border-left:4px solid var(--blue);
  border-radius:var(--r-sm);background:var(--bg-input)}
.id-ph > b,.id-tn > b{flex:0 0 88px;font-size:13px;font-weight:800;
  color:var(--text-secondary);word-break:keep-all}
.id-ph > span,.id-tn > span{flex:1 1 auto;min-width:0;font-size:15px;line-height:1.8;
  color:var(--text-primary);word-break:keep-all}
.id-sub{margin:16px 0 8px;font-size:12.5px;font-weight:800;color:var(--text-secondary);
  letter-spacing:.01em}
/* 긴 글 접기 — 다 펴 두면 ❶ 의 글만으로 한 화면이 넘습니다.
   세 줄까지 보이고 아래를 흐리게 해서 「더 있다」 를 알립니다.
   흐리게 하는 데 배경색을 덮지 않고 마스크를 씁니다 — 칸마다 배경이
   달라서, 색을 덮는 방식은 한 군데만 맞고 나머지는 어긋납니다.
   넘치는 칸에만 「nm」 을 붙입니다 (foldAll 이 그려 보고 잽니다). */
.fold{position:relative}
.fold .fd-b{max-height:5.6em;overflow:hidden}
/* 펴기가 안 먹었습니다 — 자리마다 붙인 높이(.id-wr2 .wy .fd-b 같은 것)가
   이 규칙보다 <<더 자세해서>> 이겼습니다. [＋ 더 보기] 를 눌러도 높이가
   그대로라 글자가 계속 잘려 있었습니다. 펴짐은 무엇보다 세야 합니다. */
.fold.open .fd-b{max-height:none!important}
/* 흐림이 58% 에서 시작해서 셋째 줄 중간부터 뿌옜습니다 — 「글이 다
   흐리다」 로 보입니다. 마지막 한 줄만 옅어지게 뒤로 미룹니다. */
.fold.nm:not(.open) .fd-b{
  -webkit-mask-image:linear-gradient(to bottom,#000 86%,rgba(0,0,0,.25) 100%);
          mask-image:linear-gradient(to bottom,#000 86%,rgba(0,0,0,.25) 100%)}
.fold .fd-m{margin-top:5px;padding:3px 11px;border:1px solid var(--border);
  border-radius:99px;background:var(--bg-card);font-family:inherit;font-size:11.5px;
  font-weight:700;color:var(--text-muted);cursor:pointer}
.fold .fd-m:hover{border-color:var(--blue);color:var(--blue)}
/* ❶ 의 칸은 「이름 | 값」 가로짜기라, 접기 틀이 값 자리를 그대로 받습니다 */
.ob-1f > .fold{flex:1 1 220px;min-width:0}
.id-ph > .fold,.id-tn > .fold{flex:1 1 auto;min-width:0}
/* 소개 단 고르기 — 온보딩 칩을 그대로 쓰되 위아래 여백만 맞춥니다 */
.pw-cards{margin:14px 0 4px}
/* 읽다가 틀린 것을 보면 그 단만 바로 고치러 갑니다 */
.ob-ed{margin-left:auto;padding:4px 11px;border:1px solid var(--border);border-radius:99px;
  background:var(--bg-card);font-family:inherit;font-size:11.5px;font-weight:700;
  color:var(--text-muted);cursor:pointer;white-space:nowrap;opacity:0;transition:opacity .12s}
.ob:hover .ob-ed,.ob-ed:focus{opacity:1}
.ob-ed:hover{border-color:var(--blue);color:var(--blue)}
@media (hover:none){.ob-ed{opacity:1}}
/* 철학 네 칸 — 한 덩어리 글이면 아무도 안 들춥니다.
   「어느 칸을 보면 되는지」 가 보이도록 이름을 위에 세워 둡니다. */
/* 철학 넷은 흐름입니다 — 왜 있나 ▸ 무엇을 믿나 ▸ 무엇을 하나 ▸ 어디까지.
   나란히 세우고 사이에 화살표를 놓으면 「따로 적은 네 칸」 이 아니라
   한 줄기로 읽힙니다. */
.id-ph4{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:10px;
  margin-top:12px}
.id-ph4 .c{position:relative;padding:13px 15px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--bg-card)}
.id-ph4 .c + .c::before{content:'▸';position:absolute;left:-11px;top:15px;
  font-size:13px;color:var(--text-muted)}
.id-ph4 .ch{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  padding-bottom:8px;margin-bottom:9px;border-bottom:1px solid var(--border)}
.id-ph4 .ch b{font-size:16px;line-height:1}
.id-ph4 .ch span{font-size:13px;font-weight:800;letter-spacing:-.01em;
  color:var(--text-primary)}
.id-ph4 .ch em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;
  color:var(--text-muted);white-space:nowrap}
.id-ph4 .c .iv-v{font-size:14px}
@media(max-width:700px){.id-ph4 .c + .c::before{content:'▾';left:50%;top:-12px}}
/* 역할 — 상대마다 한 줄. 왼쪽이 상대, 오른쪽이 그 상대에게 우리가 무엇인가 */
.id-rs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.id-rs .r{display:flex;gap:11px;align-items:baseline;padding:10px 14px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-input)}
.id-rs .r b{flex:0 0 auto;min-width:78px;font-size:13.5px;font-weight:800;
  color:var(--blue);word-break:keep-all}
.id-rs .r span{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.7;
  color:var(--text-primary);word-break:keep-all}
/* 표현 키워드 — 짧은 낱말은 줄글보다 칩이 빨리 읽힙니다 */
.id-kw{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.id-kw span{padding:5px 12px;border:1px solid var(--border);border-radius:99px;
  background:var(--bg-sunken);font-size:13px;font-weight:700;
  color:var(--text-primary);word-break:keep-all}

/* 페르소나 — 한 사람을 한 칸에 */
/* 한 줄에 셋까지 들어가니 안쪽 두 칸이 너무 좁아졌습니다 —
   카드 밑변을 넓혀 두 장까지만 서게 합니다. */
.id-ps{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:12px;
  margin-top:12px}
.id-p{padding:15px 17px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-card)}
.id-p .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--border)}
/* 사람은 이름표가 아니라 얼굴로 기억됩니다 — 첫 글자를 동그라미에 */
.id-p .ph .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:15px;font-weight:800;color:var(--bg-card);background:var(--blue)}
.id-p .ph b{font-size:16.5px;font-weight:800;letter-spacing:-.015em;
  color:var(--text-primary);word-break:keep-all}
.id-p .ph span{font-size:12px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:2px 9px;white-space:nowrap}
/* 「원하는 것」 과 「걱정」 은 마주 세웁니다 — 나란히 봐야 무엇을 주면
   되는지가 잡힙니다. 초록은 주고 싶은 것, 주황은 막아야 할 것. */
/* 이름을 「pv」 로 지었다가 크게 데었습니다 — 이 화면에는 이미 .pv 가
   있고(사이트 미리보기: width:1280px; transform:scale(.29)), 그 규칙이
   그대로 얹혀서 페르소나 칸이 1280px 로 커진 채 0.29배로 줄어 있었습니다.
   글자가 깨알같이 작게 나오던 게 그래서였습니다. 한 낱말짜리 이름은
   반드시 앞에 무엇인지 붙입니다.
   두 칸으로 못 박습니다 (좁으면 한 칸). minmax(0,1fr) 이라야 안쪽 글이
   길어도 칸이 삐져나오지 않습니다. */
.id-p{min-width:0}
.id-p .id-pv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.id-p .pk{min-width:0;display:flex;flex-direction:column;gap:3px;padding:9px 11px;
  border-radius:var(--r-sm);background:var(--bg-sunken);
  border-left:3px solid var(--border)}
@media(max-width:620px){.id-p .id-pv{grid-template-columns:1fr}}
.id-p .pk.yes{border-left-color:var(--green);background:var(--bg-sunken)}
.id-p .pk.no{border-left-color:var(--yellow)}
.id-p .pk i{font-size:11.5px;font-weight:800;font-style:normal;color:var(--text-muted)}
.id-p .pk.yes i{color:var(--green)}
.id-p .pk.no i{color:var(--yellow)}
.id-p .pk span{font-size:14px;line-height:1.7;color:var(--text-primary);
  word-break:keep-all}
/* 타겟 = 과녁 한 칸 */
.id-tgt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;margin-bottom:12px;
  border:1px solid var(--border);border-left:4px solid var(--blue);
  border-radius:var(--r-sm);background:var(--bg-input)}
.id-tgt > i{flex:0 0 auto;font-style:normal;font-size:20px;line-height:1.2}
.id-tgt > div{flex:1 1 auto;min-width:0}
.id-tgt b{display:block;margin-bottom:5px;font-size:11.5px;font-weight:800;
  letter-spacing:.01em;color:var(--text-muted)}

/* 색 · 글꼴 */
.id-cs{display:flex;flex-wrap:wrap;gap:10px}
.id-c{display:flex;align-items:center;gap:11px;flex:1 1 210px;min-width:0;
  padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-card)}
.id-c .sw{flex:0 0 auto;width:34px;height:34px;border-radius:9px;
  border:1px solid var(--border);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.id-c .sw[data-no]{background:repeating-linear-gradient(45deg,
  var(--bg-sunken) 0 6px,var(--border-light) 6px 12px)}
.id-c .cn{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.id-c .cn b{font-size:14px;font-weight:800;color:var(--text-primary)}
.id-c .cn code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  font-weight:700;color:var(--text-muted)}
.id-c .cn span{flex:1 1 100%;font-size:12.5px;color:var(--text-secondary)}
/* 글꼴은 이름만 적어 두면 어떻게 생겼는지 모릅니다 — 견본을 같이 씁니다 */
.id-fs{display:flex;flex-wrap:wrap;gap:8px}
.id-f{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:0;
  padding:9px 13px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-card)}
.id-f .spec{flex:0 0 auto;font-size:21px;font-weight:700;letter-spacing:-.01em;
  color:var(--text-primary);line-height:1.2}
.id-f .fn{display:flex;flex-direction:column;gap:1px;min-width:0}
.id-f b{font-size:14.5px;font-weight:800;color:var(--text-primary)}
.id-f span{font-size:12.5px;color:var(--text-secondary)}

/* 쓰는 말 · 안 쓰는 말 — 두 줄을 나란히 세워서 한눈에 대조합니다 */
/* 바꿔 쓸 말이 적힌 것은 <<짝>>입니다 — 마주 세우면 원고 쓰다 한 번만
   찾으면 됩니다. 두 칸에 나눠 두면 「이건 대신 뭐라 쓰더라」 로 또 찾습니다. */
.id-mp{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.id-mp .m{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;
  padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-card)}
.id-mp .x{font-size:15px;font-weight:800;color:var(--text-muted);
  text-decoration:line-through;text-decoration-color:var(--red);
  text-decoration-thickness:1.5px;word-break:keep-all}
.id-mp .m > i{font-style:normal;font-size:13px;color:var(--text-muted)}
.id-mp .o{font-size:15.5px;font-weight:800;color:var(--green);word-break:keep-all}
.id-mp .wy{flex:1 1 100%;font-size:12.5px;line-height:1.7;color:var(--text-muted);
  word-break:keep-all}
/* 낱말만 적힌 것은 칩으로 빽빽하게 — 서른 개를 한 줄씩 세로로 쌓으면
   그 자체가 한 화면짜리 글이 됩니다. 원고 쓰다 훑는 자리인데 못 훑습니다. */
.id-wq{display:flex;flex-wrap:wrap;gap:5px;padding:9px 0 4px}
.id-wq span{padding:4px 10px;border-radius:99px;border:1px solid var(--border);
  background:var(--bg-sunken);font-size:13px;font-weight:700;
  color:var(--text-primary);word-break:keep-all}
.id-wc.yes .id-wq span{border-color:var(--green);color:var(--green)}
.id-wc.no .id-wq span{border-color:var(--border);color:var(--text-muted);
  text-decoration:line-through;text-decoration-color:var(--red)}
.id-ws{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}
.id-wc{padding:13px 15px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-card)}
.id-wc.yes{border-left:4px solid var(--green,#16a34a)}
.id-wc.no{border-left:4px solid var(--red,#dc2626)}
.id-wc .wh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;
  color:var(--text-secondary);padding-bottom:9px;margin-bottom:4px;
  border-bottom:1px solid var(--border)}
.id-wc .wh b{font-size:11.5px;font-weight:800;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:1px 8px}
.id-w{padding:8px 0;border-top:1px solid var(--border-light)}
.id-w:first-of-type{border-top:none}
.id-w > b{font-size:15.5px;font-weight:800;color:var(--text-primary);word-break:keep-all}
.id-wc.no .id-w > b{text-decoration:line-through;
  text-decoration-color:var(--text-muted);text-decoration-thickness:1px}
.id-w .in{display:inline-block;margin-left:8px;font-size:14px;font-weight:800;
  color:var(--blue)}
.id-w .wy{display:block;margin-top:3px;font-size:12.5px;line-height:1.7;
  color:var(--text-muted);word-break:keep-all}
/* 이유까지 붙은 말 — 한 장씩. 말은 크게, 까닭은 접어서 */
.id-wr{margin-top:16px}
.id-ws2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:9px}
.id-wr2{position:relative;padding:13px 15px 13px 40px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--bg-card)}
.id-wr2.yes{border-left:4px solid var(--green)}
.id-wr2.no{border-left:4px solid var(--red)}
.id-wr2 .n{position:absolute;left:12px;top:13px;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--text-muted);background:var(--bg-sunken);
  border:1px solid var(--border)}
.id-wr2 .q{font-size:15.5px;font-weight:800;line-height:1.7;letter-spacing:-.01em;
  color:var(--text-primary);word-break:keep-all}
/* 취소선은 <<짧은 말>>에만 긋습니다. 설명까지 딸린 긴 줄에 그으면
   한 문단이 통째로 그어져서 아예 못 읽습니다 (q.long 이 그 경우). */
/* 칩으로 나뉜 것은 칩마다 긋습니다 — 묶음째 그으면 「=」 까지 그어집니다 */
.id-wr2.no .q.short:not(.multi){color:var(--text-muted);text-decoration:line-through;
  text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.id-wr2.no .q.long::before{content:'✕ ';color:var(--red)}
.id-wr2 .q.multi{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px;
  text-decoration:none;color:var(--text-primary)}
.id-wr2 .q.multi > span{padding:2px 10px;border-radius:99px;border:1px solid var(--border);
  background:var(--bg-sunken);font-size:14.5px;color:var(--text-primary)}
.id-wr2.no .q.multi > span{text-decoration:line-through;text-decoration-color:var(--red)}
.id-wr2 .q.multi > i{font-style:normal;font-size:11.5px;color:var(--text-muted)}
.id-wr2 .wy{margin-top:7px;font-size:13px;line-height:1.75;color:var(--text-secondary);
  word-break:keep-all}
/* 줄높이 1.75 × 3줄 = 5.25em. 반 잘린 줄이 남으면 그 조각이 단추 뒤로
   비쳐서 지저분합니다 — 줄 수에 딱 맞춰 자릅니다. */
.id-wr2 .wy .fd-b{max-height:5.25em}

/* 해마다의 목표 */
/* 해마다의 목표는 연표입니다 — 해마다 점을 찍고 줄기로 잇습니다 */
.id-gs.rail{position:relative;padding-left:20px}
.id-gs.rail::before{content:'';position:absolute;left:5px;top:12px;bottom:12px;
  width:2px;background:var(--border)}
.id-gs.rail .id-g::before{content:'';position:absolute;left:-19px;top:20px;
  width:9px;height:9px;border-radius:50%;background:var(--border);
  box-shadow:0 0 0 3px var(--bg-card)}
.id-gs.rail .id-g.now::before{background:var(--blue)}
.id-gs.rail .id-g{position:relative}
.id-gs{display:flex;flex-direction:column;gap:11px}
.id-g{display:flex;gap:15px;padding:14px 16px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--bg-card)}
.id-g.now{border-color:var(--blue);background:var(--blue-soft)}
.id-g .gy{flex:0 0 76px;display:flex;flex-direction:column;gap:4px;
  font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--text-primary);
  font-variant-numeric:tabular-nums}
.id-g .gy i{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;
  background:var(--blue);border-radius:99px;padding:1px 7px;align-self:flex-start}
.id-g .gb{flex:1 1 auto;min-width:0}
.id-g .gb > b{display:block;font-size:15.5px;font-weight:800;line-height:1.7;
  letter-spacing:-.015em;color:var(--text-primary);word-break:keep-all}
/* 그 해 안의 눈금 — 몇 개 중 몇 개를 해냈나 */
.id-g .gp{display:flex;align-items:center;gap:9px;margin-top:10px}
.id-g .gp > i{flex:1 1 auto;height:6px;border-radius:99px;background:var(--border);
  position:relative;overflow:hidden;font-style:normal}
/* 채운 만큼은 --p 로 넘겨받습니다 — i 자체의 width 는 flex 가 정합니다 */
.id-g .gp > i::before{content:'';position:absolute;inset:0 auto 0 0;width:var(--p,0%);
  background:var(--green);border-radius:99px;transition:width .2s}
.id-g .gp span{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--text-muted);
  font-variant-numeric:tabular-nums}
/* 세부 목표 줄 — 상태 · 때 · 무엇을 */
.id-g .gi{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.id-g .g1{display:flex;align-items:baseline;gap:9px;padding:7px 11px;
  border-radius:var(--r-sm);background:var(--bg-sunken)}
.id-g .g1.ok{background:transparent}
.id-g .g1.on{background:var(--blue-soft)}
.id-g .g1 .st{flex:0 0 auto;padding:0;border:none;background:transparent;cursor:pointer;
  font-size:13px;line-height:1.6}
.id-g .g1 u{flex:0 0 auto;min-width:54px;text-decoration:none;font-size:11.5px;
  font-weight:800;color:var(--text-muted);word-break:keep-all}
.id-g .g1 span{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.7;
  color:var(--text-primary);word-break:keep-all}
.id-g .g1.ok span{color:var(--text-muted)}
.id-g .gk{position:relative;display:flex;flex-direction:column;gap:2px;margin-top:9px}
.id-g .gk i{font-size:12px;font-weight:800;font-style:normal;color:var(--blue)}
/* 줄 하나 지우기 — 이름 오른쪽 끝에 조용히 */
.id-g .gk > .x{position:absolute;right:0;top:-2px;padding:1px 7px;border-radius:99px;
  border:1px solid var(--border);background:transparent;font-size:12px;
  color:var(--text-muted);cursor:pointer;opacity:0;transition:opacity .12s}
.id-g .gk:hover > .x{opacity:1}
.id-g .gk > .x:hover{border-color:var(--red);color:var(--red)}
@media (hover:none){.id-g .gk > .x{opacity:1}}
.id-g .gk .non{color:var(--text-muted)}
/* 「맡은 것」 과 「그 해 목표」 — 한 줄 안에서 갈라 둡니다.
   맡은 것은 한눈에 훑는 표이고, 목표는 읽는 글이라 결이 다릅니다. */
.id-g .gk .ow,.id-g .gk .gl2{display:flex;align-items:baseline;gap:9px;margin-top:5px}
.id-g .gk u{flex:0 0 74px;text-decoration:none;font-size:11px;font-weight:800;
  color:var(--text-muted);word-break:keep-all}
.id-g .gk .ow > span,.id-g .gk .gl2 > span{flex:1 1 auto;min-width:0;
  font-size:14px;line-height:1.7;color:var(--text-primary);word-break:keep-all}
.id-g .gk .ow .ch{display:flex;flex-wrap:wrap;gap:5px}
.id-g .gk .ow .ch b{padding:2px 9px;border-radius:99px;border:1px solid var(--border);
  background:var(--bg-sunken);font-size:12.5px;font-weight:700;
  color:var(--text-primary);word-break:keep-all}
/* 온보딩 연표 — 소개와 같은 연표를 쓰고, 넣고 빼는 단추만 붙입니다 */
.ob-yr .hy-add{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:0 0 16px 20px}
.ob-yr .hy-add .lb{font-size:12px;font-weight:800;color:var(--text-secondary)}
.ob-yr .hy-add input{box-sizing:border-box;width:76px;font-family:var(--f-mono),inherit;
  font-size:14px;font-weight:700;text-align:center;padding:6px 8px;
  border:1px solid var(--border);border-radius:9px;background:var(--bg-input);
  color:var(--text-primary);font-variant-numeric:tabular-nums}
.ob-yr .hy-add input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.ob-yr .hy-add span{font-size:11.5px;color:var(--text-muted)}
.ob-yr .hy-ra{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;
  padding-top:11px;border-top:1px dashed var(--border)}
.ob-yr .hy-ra .del{opacity:0;transition:opacity .12s}
.ob-yr .id-g:hover .hy-ra .del{opacity:1}
.ob-yr .hy-ra .del:hover{border-color:var(--red);color:var(--red)}
@media (hover:none){.ob-yr .hy-ra .del{opacity:1}}
.id-g .gk span{font-size:14px;line-height:1.75;color:var(--text-secondary);
  word-break:keep-all}
@media(max-width:560px){.id-g{flex-direction:column;gap:7px}
  .id-g .gy{flex:0 0 auto;flex-direction:row;align-items:center}}

/* 고치기 — 얼굴 칸.
   이 화면에는 input 을 한꺼번에 꾸미는 규칙이 없습니다. 새로 만든 칸은
   반드시 제 생김새를 스스로 적어야 브라우저 기본 모양으로 안 나옵니다. */
.pe-rl .rh input.tt,.pe-2 > input{flex:1 1 180px;min-width:0;box-sizing:border-box;
  font-family:inherit;font-size:13.5px;padding:6px 10px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg-input);color:var(--text-primary)}
.pe-rl .rh input.tt{font-weight:700}
.pe-2 > input{font-size:13px;color:var(--text-secondary)}
.pe-rl .rh input.tt:focus,.pe-2 > input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.pe-rl .rh input.tt.yr{flex:0 0 118px;font-variant-numeric:tabular-nums}
.pe-rl .rh .tl-x{margin-left:auto;flex:0 0 auto}
.pe-2{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.pe-cl,.pe-wd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-card)}
.pe-cl > input[type=color]{flex:0 0 auto;width:34px;height:30px;padding:2px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-input);
  cursor:pointer}
.pe-cl > input[type=text],.pe-wd > input[type=text],.pe-wd > select{
  flex:1 1 130px;min-width:0;box-sizing:border-box;font-family:inherit;font-size:13px;
  padding:6px 9px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-input);color:var(--text-primary)}
.pe-cl > input.hx{flex:0 0 104px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase}
.pe-wd > select{flex:0 0 118px;font-weight:700;cursor:pointer}
.pe-wd > input.tt,.pe-cl > input.tt{font-weight:700}
.pe-wd.no > input.tt{color:var(--red,#dc2626)}
.pe-cl > .x,.pe-wd > .x{flex:0 0 auto;width:26px;height:26px;border:none;
  border-radius:7px;background:transparent;color:var(--text-muted);font-size:15px;
  line-height:1;cursor:pointer}
.pe-cl > .x:hover,.pe-wd > .x:hover{background:var(--bg-sunken);color:var(--red,#dc2626)}
.ob-who .wc.dim{opacity:.55}
.ob-who .wc.dim .nm{text-decoration:line-through;text-decoration-color:var(--text-muted)}
/* 처음부터 적기 창 */
.modal .hf-l{display:block;margin:13px 0 5px;font-size:12px;font-weight:700;
  color:var(--text-secondary)}
.modal .hf-l span{display:block;margin-top:2px;font-size:11px;font-weight:400;
  color:var(--text-muted)}
.modal .hf-h{margin:20px 0 7px;font-size:13px;font-weight:700;color:var(--text-primary)}
.modal .hf-h span{font-size:11.5px;font-weight:400;color:var(--text-muted)}
.modal .hf-t{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.modal .hf-t input{flex:1 1 150px;width:auto;min-width:0}
.modal .hf-t input.w{flex:0 0 92px}
.modal .hf-t .btn{flex:0 0 auto;align-self:center}
/* 🧹 퇴사자 자료 정리
   — 「.modal label{display:block}」 과 「.modal input{width:100%}」 이 눌러 버리므로
      여기서는 .modal 을 앞에 붙여 특이도를 올려 둡니다 (안 그러면 줄이 무너집니다) */
.modal .wz-list{display:flex;flex-direction:column;gap:7px}
.modal .wz-r{display:flex;align-items:center;gap:10px;margin:0;padding:11px 13px;
  cursor:pointer;font-size:13.5px;font-weight:400;letter-spacing:normal;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-input)}
.modal .wz-r:hover{border-color:var(--blue)}
.modal .wz-r.off{opacity:.5;cursor:default}
.modal .wz-r.off:hover{border-color:var(--border)}
.modal .wz-r input[type=checkbox]{width:17px;height:17px;flex:0 0 auto;margin:0;padding:0;
  accent-color:var(--red)}
.modal .wz-r .ic{flex:0 0 auto;font-size:16px}
.modal .wz-r .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  color:var(--text-primary)}
.modal .wz-r .ct{flex:0 0 auto;font-size:12.5px;color:var(--text-muted);white-space:nowrap}
.modal .wz-r .ct b{font-size:14.5px;color:var(--text-primary)}
.modal .wz-r .ct span{color:var(--text-muted);font-weight:400}
.gb-gonebar span{font-size:12.5px;color:var(--text-muted)}
/* 사진 안 — 브랜드 한 묶음 */
.gb-shot-bk{margin-bottom:20px;break-inside:avoid}
.gb-shot-bk:last-child{margin-bottom:0}
.gb-shot-br .ct{margin-left:9px;font-size:12px;font-weight:600;color:var(--text-muted)}
.gb-shot-br{font-size:16px;font-weight:800;color:var(--text-primary);
  margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--hue,var(--ink))}
@media (max-width:640px){
  .gb-fix .fr{flex-wrap:wrap}
  .gb-fix .fr .tt{flex:1 1 100%;white-space:normal}
  .gb-fix .fr select{max-width:none;flex:1 1 auto}
}
.dmn-half{margin:0 0 11px;padding:10px 13px;border-radius:10px;background:var(--amber-soft,
  rgba(245,158,11,.10));border:1px solid rgba(245,158,11,.35);font-size:12.5px;
  font-weight:700;line-height:1.75;color:var(--text-primary);word-break:keep-all}
.dmn-half span{font-weight:400;color:var(--text-muted)}

/* 5단 — 첫 2주에 해볼 것 */
.ob-goal{margin:0 0 14px;padding:11px 14px;border-radius:11px;background:var(--bg-sunken);
  border-left:3px solid var(--ink);font-size:14.5px;font-weight:700;line-height:1.75;
  color:var(--text-primary);white-space:pre-wrap;word-break:keep-all}
.ob-goal b{display:block;font-size:11px;font-weight:800;color:var(--text-muted);
  letter-spacing:.02em;margin-bottom:3px}
.ob-st{counter-reset:obst;list-style:none;margin:0;padding:0;
  display:flex;flex-direction:column;gap:9px}
.ob-st li{counter-increment:obst;position:relative;padding:12px 14px 12px 42px;
  border:1px solid var(--border);border-radius:11px;background:var(--bg-card)}
.ob-st li:before{content:counter(obst);position:absolute;left:13px;top:12px;
  width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.ob-st .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ob-st .sh .dy{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--blue);
  background:var(--blue-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.ob-st .sh b{font-size:14.5px;font-weight:800;color:var(--text-primary);
  line-height:1.6;word-break:keep-all}
.ob-st p{margin:5px 0 0;font-size:13.5px;line-height:1.8;color:var(--text-secondary);
  white-space:pre-wrap;word-break:keep-all}
.ob-st .sf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.ob-st .sf a,.ob-st .sf .rf{font-size:11.5px;font-weight:700;color:var(--text-secondary);
  background:var(--bg-sunken);border-radius:99px;padding:3px 10px;text-decoration:none;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-st .sf a:hover{color:var(--blue);background:var(--blue-soft)}
.ob-st .sf .wh{font-size:11.5px;font-weight:700;color:var(--text-muted);white-space:nowrap}
.pe-rl .rh input.dy{flex:1 1 150px;min-width:0;box-sizing:border-box;font-family:inherit;
  font-size:12.5px;padding:5px 9px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-card);color:var(--text-primary)}
.pe-rl .rh input.dy:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
/* 갈래 머리 — 「쓰는 말」 과 「안 쓰는 말」 을 헷갈리면 금지어를 그대로 씁니다.
   작은 회색 글씨로는 구별이 안 되므로, 크게 쓰고 갈래마다 색을 나눕니다. */
.ob-rk{margin-bottom:20px;padding:12px 15px;border-radius:12px;
  background:var(--bg-card);border:1px solid var(--border);
  border-left:5px solid var(--hue,var(--border))}
.ob-rk:last-child{margin-bottom:0}
.ob-rk .kh{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;
  color:var(--hue,var(--text-primary));margin-bottom:12px;letter-spacing:-.02em}
.ob-rk .kh b{font-size:12px;font-weight:800;color:#fff;background:var(--hue,var(--ink));
  border-radius:99px;padding:2px 9px;min-width:20px;text-align:center;
  font-variant-numeric:tabular-nums}
.ob-rk.k-tone{--hue:var(--blue)}
.ob-rk.k-yes {--hue:var(--green)}
.ob-rk.k-no  {--hue:var(--red);background:rgba(239,68,68,.05)}
.ob-rk.k-how {--hue:var(--purple)}
.ob-rk.k-etc {--hue:var(--text-muted)}
/* 규칙은 <<차례>>가 있는 것들입니다 — 절차 아홉 줄에 번호가 없으면
   「몇 번째까지 했더라」 가 안 됩니다. 갈래 안에서 번호를 답니다. */
.ob-r{position:relative;margin-bottom:14px;padding-bottom:14px;padding-left:30px;
  border-bottom:1px dashed var(--border-light)}
.ob-r:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.ob-r .rn{position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--text-muted);background:var(--bg-sunken);border:1px solid var(--border)}
.ob-r .tx{margin:0;font-size:15.5px;font-weight:700;line-height:1.8;
  color:var(--text-primary);word-break:keep-all}
.ob-r .tx .iv-v{font-size:15.5px;font-weight:700;line-height:1.8}
.ob-r .tx .iv-k{font-weight:800}
.ob-r .wy{margin:5px 0 0;font-size:13.5px;line-height:1.75;color:var(--text-secondary)}
.ob-r .wy .fd-b{max-height:5.25em}
.ob-q{margin-top:6px;padding:7px 11px;border-left:3px solid var(--purple);
  background:var(--bg-input);border-radius:0 9px 9px 0;font-size:12px;
  color:var(--text-secondary);line-height:1.65}
.ob-q{display:block;width:100%;box-sizing:border-box;text-align:left;font-family:inherit;
  border:none;border-left:3px solid var(--purple);cursor:pointer}
.ob-q:hover{background:var(--bg-hover)}
.ob-q b{color:var(--text-primary);font-weight:800}
.ob-q .rs{display:block;margin-top:2px;color:var(--green);font-weight:700}
.ob-q .mo{margin-left:6px;font-size:11px;color:var(--text-muted)}
.ob-q.again{padding-top:5px;padding-bottom:5px;font-size:11.5px;
  border-left-color:var(--border);background:transparent}
.ob-q.again:hover{background:var(--bg-hover)}
.pw-ch.hit > .bd{background:var(--blue-soft);border-radius:12px;
  box-shadow:0 0 0 8px var(--blue-soft);transition:background .3s}
/* 막히면 누구에게 — 이름보다 「언제 물어보나」 가 먼저 읽혀야 합니다 */
.ob-who{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.ob-who .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:13.5px;font-weight:800;color:var(--bg-card);background:var(--text-secondary);
  align-self:center}
.ob-who .wc{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:9px 12px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg-card)}
.ob-who .nm{font-size:14.5px;font-weight:800;color:var(--text-primary)}
.ob-who .rl{font-size:12.5px;color:var(--text-secondary)}
.ob-who .rl{flex:1 1 100%;padding-left:39px;font-size:12.5px;font-weight:700;
  color:var(--blue)}
.ob-who .wr{margin-left:auto;font-size:11.5px;color:var(--text-muted);white-space:nowrap}

/* 결과 — 여정의 핵심이라 눈에 띄게 */
.pw-res{margin:8px 0!important;padding:9px 12px;border-left:3px solid var(--green);
  background:var(--bg-input);border-radius:0 9px 9px 0;font-weight:700!important}
.pw-res b{display:inline-block;color:var(--green)!important;font-size:11.5px!important;
  margin-right:8px!important}
.pw-res.on{border-left-color:var(--text-muted);font-weight:400!important;
  color:var(--text-muted)!important}
.pw-res.on b{color:var(--text-muted)!important}
.pw-ch.p-ty .no{border-color:var(--cyan);color:var(--cyan)}

/* 고치기 */
/* 단 차례 — 아홉 단을 세로로 다 이어 두면 고칠 칸 하나 찾으려고 한참
   내려야 합니다. 위에서 고르면 그 단만 폅니다. */
.pe-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 14px;
  border-bottom:1px solid var(--border)}
.pe-tabs button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;
  border:1px solid var(--border);border-radius:99px;background:var(--bg-card);
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text-primary);
  cursor:pointer;word-break:keep-all}
.pe-tabs button:hover{border-color:var(--blue);color:var(--blue)}
.pe-tabs button i{font-style:normal;font-size:10.5px;font-weight:800;
  color:var(--text-muted)}
.pe-tabs button b{font-size:10.5px;font-weight:800;color:var(--blue);
  background:var(--blue-soft);border-radius:99px;padding:1px 6px}
.pe-tabs button.em{color:var(--text-muted)}        /* 아직 아무것도 안 적은 단 */
.pe-tabs button.em i{opacity:.6}
.pe-tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg-card)}
.pe-tabs button.on i,.pe-tabs button.on b{color:var(--bg-card);background:transparent}
/* 이 단만 비우기 — 단 머리 오른쪽 끝에 조용히 */
.pe-wx{margin-left:auto;padding:4px 10px;border:1px solid var(--border);border-radius:99px;
  background:transparent;font-family:inherit;font-size:11px;font-weight:700;
  color:var(--text-muted);cursor:pointer;white-space:nowrap}
.pe-wx:hover{border-color:var(--red);color:var(--red);background:var(--bg-sunken)}
/* 선택 칸 펴기 — 한 줄만 적은 규칙에 빈 칸 다섯 개가 붙어 있지 않게 */
.pe-mo{align-self:flex-start;padding:4px 10px;border:1px dashed var(--border);
  border-radius:99px;background:transparent;font-family:inherit;font-size:11.5px;
  font-weight:700;color:var(--text-muted);cursor:pointer}
.pe-mo:hover{border-color:var(--blue);color:var(--blue)}
.pe-sec{padding:18px 0;border-bottom:1px solid var(--border)}
.pe-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.pe-h .no{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--ink);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:800;align-self:center}
.pe-h h3{margin:0;font-size:15px;font-weight:800;color:var(--text-primary)}
.pe-h{width:100%}
.pe-h .hn{font-size:11.5px;font-weight:400;color:var(--text-muted)}
.pe-t{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;font-weight:600;
  line-height:1.8;padding:10px 13px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg-input);color:var(--text-primary);resize:none;overflow:hidden;
  min-height:56px}
.pe-t:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.pe-rules{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.pe-rl{border:1px solid var(--border);border-radius:11px;background:var(--bg-card);
  padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pe-rl .rh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pe-rl select{font-family:inherit;font-size:12.5px;padding:5px 9px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)}
.pe-rl textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;
  line-height:1.7;padding:8px 11px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-input);color:var(--text-primary);resize:none;overflow:hidden;
  min-height:36px}
.pe-rl textarea:focus,.pe-rl select:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
/* 해마다의 목표 안쪽 줄 — 이 화면에는 input 을 한꺼번에 꾸미는 규칙이
   없어서, 새 칸은 제 생김새를 스스로 적어야 합니다 */
.pe-gi{display:flex;flex-direction:column;gap:5px;margin-top:7px;
  padding-left:11px;border-left:2px solid var(--border)}
.pe-gi .gr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pe-gi select,.pe-gi input{box-sizing:border-box;font-family:inherit;font-size:13px;
  padding:6px 10px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-input);color:var(--text-primary)}
.pe-gi select{flex:0 0 auto}
.pe-gi input.wn{flex:0 0 130px;min-width:0}
.pe-gi input.tx{flex:1 1 220px;min-width:0}
.pe-gi select:focus,.pe-gi input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.pe-rl .rc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pe-rl .rc > span{font-size:11px;font-weight:800;color:var(--text-muted)}
.pe-rl .rc select{flex:1 1 220px;min-width:0}
.pe-rl .rc em{font-style:normal;font-size:11px;color:var(--text-muted)}
.pe-who{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.pe-who .wr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pe-who .wr input{flex:1 1 150px;min-width:0;box-sizing:border-box;font-family:inherit;
  font-size:13.5px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-input);color:var(--text-primary)}
.pe-who .wr input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.pe-who .wr .x{flex:0 0 auto;border:none;background:none;color:var(--text-muted);
  cursor:pointer;font-size:15px;padding:3px 7px;border-radius:6px}
.pe-who .wr .x:hover{color:var(--red)}
.pe-sum{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.pe-sum label{font-size:12.5px;font-weight:800;color:var(--text-primary);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pe-sum label span{font-size:11.5px;font-weight:400;color:var(--text-muted)}
.pe-sum label span.bt{display:block;margin-top:5px}
.pe-hint{font-style:normal;font-size:11.5px;color:var(--text-muted)}
.pe-sum textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:15px;
  font-weight:600;line-height:1.8;padding:11px 13px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg-input);color:var(--text-primary);
  resize:none;overflow:hidden;min-height:76px}
.pe-sum textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.pe-list{display:flex;flex-direction:column;gap:7px}
.pe-ch{border:1px solid var(--border);border-radius:11px;background:var(--bg-card)}
.pe-ch.open{border-color:var(--ink)}
.pe-hd{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;
  flex-wrap:wrap}
.pe-hd:hover{background:var(--bg-sunken)}
.pe-hd .no{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--ink);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:800}
.pe-hd .wn{font-size:11.5px;font-weight:800;color:var(--text-primary);white-space:nowrap}
.pe-hd .kd{font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:2px 8px;white-space:nowrap}
.pe-hd .tt{flex:1;min-width:0;font-size:13px;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe-hd .ph{font-size:10.5px;font-weight:700;color:var(--text-muted)}
.pe-hd .ar{font-size:11px;color:var(--text-muted)}
.pe-bd{padding:2px 13px 13px;display:flex;flex-direction:column;gap:7px}
.pe-hn{font-size:11.5px;color:var(--text-muted)}
.pe-add{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}

/* ── 📖 브랜드 서사 (읽기) ────────────────────────────────────── */
.st-mode{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.st-mode > button{border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-family:inherit;font-size:12.5px;font-weight:700;
  padding:6px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.st-mode > button:hover{border-color:var(--ink)}
.st-mode > button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.st-mode .hint{flex:1;min-width:160px}
.st-mode .btn{flex:0 0 auto}

.story{max-width:760px}   /* .st 는 올리기 상태 표시가 이미 쓰고 있습니다 */
.st-top{padding:0 0 20px;margin-bottom:6px;border-bottom:2px solid var(--border)}
.st-name{font-size:12.5px;font-weight:800;color:var(--text-muted);letter-spacing:.02em;
  margin-bottom:9px}
.st-line{font-size:21px;font-weight:800;line-height:1.55;color:var(--text-primary);
  letter-spacing:-.03em;white-space:pre-wrap;word-break:keep-all}
.st-line.no{font-size:15px;font-weight:400;color:var(--text-muted)}
.st-meta{margin-top:11px;font-size:11.5px;color:var(--text-muted)}

.st-sec{padding:22px 0;border-bottom:1px solid var(--border)}
.st-sec:last-child{border-bottom:none}
.st-sec.thin{opacity:.55}   /* 전역 .empty 와 이름이 부딪혀 따로 씁니다 */
.st-sec > h3{font-size:15.5px;font-weight:800;color:var(--text-primary);margin:0 0 13px;
  display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.st-sec > h3 .ic{font-size:16px}
.st-f{margin-bottom:14px}
.st-f:last-child{margin-bottom:0}
.st-f .lb{font-size:11.5px;font-weight:800;color:var(--text-muted);margin-bottom:5px;
  letter-spacing:.01em}
.st-f p{margin:0;font-size:14.5px;line-height:1.85;color:var(--text-primary);
  white-space:pre-wrap;word-break:keep-all}
.st-f p.no{font-size:13px;color:var(--text-muted)}
.st-past{margin-top:16px;padding-left:15px;border-left:2px solid var(--border)}
.st-past > .hd{font-size:11.5px;font-weight:800;color:var(--text-muted);margin-bottom:10px;
  letter-spacing:.01em}
.st-r{margin-bottom:14px}
.st-r:last-child{margin-bottom:0}
.st-r .dt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.st-r .dt .d{font-size:11.5px;font-weight:800;color:var(--text-primary)}
.st-r .dt .kd{font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:1px 8px}
.st-r .dt .gs{font-size:10.5px;font-weight:800;color:var(--orange);
  border:1px solid var(--orange);border-radius:99px;padding:0 7px}
.st-r > p{margin:0 0 3px;font-size:14px;line-height:1.8;color:var(--text-primary);
  white-space:pre-wrap;word-break:keep-all}
.st-r > p b{font-weight:800}
.st-r > p.wy{font-size:13px;color:var(--text-secondary)}
.st-r > p.sc{font-size:11.5px;color:var(--text-muted)}
.st-r.k-fl .dt .kd{color:var(--red)}
.st-r.k-wd .dt .kd{color:var(--orange)}
.st-r.k-sh .dt .kd{color:var(--purple)}
.st-mode .sp{flex:1}
.st-mode > button.sm{font-size:11.5px;font-weight:700;padding:5px 11px;
  border:1px solid var(--border);border-radius:99px;background:var(--bg-card);
  color:var(--text-muted);cursor:pointer;font-family:inherit}
.st-mode > button.sm:hover{border-color:var(--cyan);color:var(--cyan)}
.st-mode > button.sm.on{border-color:var(--cyan);background:var(--cyan);color:#fff}
.st-r .dt .ax{font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:1px 8px}
/* 읽기 화면의 사진 */
.st-ph{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 6px}
.st-ph a{display:block;max-width:260px;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;background:var(--bg-sunken);line-height:0}
.st-ph a:hover{border-color:var(--blue)}
.st-ph img{display:block;width:100%;height:auto;max-height:220px;object-fit:contain}
.st-ph .file{display:inline-block;padding:9px 12px;font-size:12px;line-height:1.5;
  color:var(--text-secondary)}
/* 연도로 읽기 */
.st-yr{padding:20px 0;border-bottom:1px solid var(--border)}
.st-yr:last-child{border-bottom:none}
.st-yr > h3{font-size:24px;font-weight:800;color:var(--text-primary);margin:0 0 13px;
  letter-spacing:-.035em;display:flex;align-items:baseline;gap:9px}
.st-yr > h3 span{font-size:11.5px;font-weight:700;color:var(--text-muted)}
.st-yr > .bd{padding-left:15px;border-left:2px solid var(--border)}
/* 고치는 마디의 사진 줄 */
.rp{margin-top:4px}
.rp-hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.rp-hd{font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.02em}
.rp-hd span{font-weight:400}
.rp-hd .gb-add{margin-left:auto}
.rp-list{display:flex;gap:7px;flex-wrap:wrap}
.rp-i{position:relative;width:110px}
.rp-i img{display:block;width:110px;height:74px;object-fit:contain;border-radius:8px;
  border:1px solid var(--border);background:var(--bg-card)}
.rp-i .file{display:flex;align-items:center;justify-content:center;width:110px;height:74px;
  border-radius:8px;border:1px solid var(--border);background:var(--bg-card);font-size:20px}
.rp-i .x{position:absolute;top:3px;right:3px;border:none;background:var(--bg-card);
  color:var(--text-muted);cursor:pointer;font-size:13px;line-height:1;padding:1px 5px;
  border-radius:6px;opacity:0;box-shadow:var(--shadow-sm)}
.rp-i:hover .x{opacity:1}
.rp-i .x:hover{color:var(--red)}
.st-none{font-size:14.5px;font-weight:700;color:var(--text-primary);line-height:1.9;
  padding:22px 0}
.st-none span{font-size:13px;font-weight:400;color:var(--text-muted)}

/* ── 🪪 명함 ──────────────────────────────────────────────────── */
.cd-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.cd-tabs button{border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-family:inherit;font-size:12.5px;font-weight:700;
  padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.cd-tabs button b{color:var(--text-muted);font-size:11px;margin-left:3px}
.cd-tabs button:hover{border-color:var(--ink)}
.cd-tabs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.cd-tabs button.on b{color:rgba(255,255,255,.8)}
.cd-cats{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px;padding-bottom:12px;
  border-bottom:1px solid var(--border)}
.cd-cats button{border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:700;
  padding:5px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.cd-cats button b{font-size:10.5px;margin-left:3px}
.cd-cats button:hover{border-color:var(--cyan);color:var(--cyan)}
.cd-cats button.on{border-color:var(--cyan);background:var(--cyan);color:#fff}
.cd-cats button.on b{color:rgba(255,255,255,.85)}

.cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;
  align-items:start}
.ncd{border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);
  overflow:hidden}
.ncd:hover{border-color:var(--cyan)}
.ncd.open{grid-column:1/-1;border-color:var(--ink)}
.cd-cover{display:block;width:100%;border:none;padding:0;cursor:pointer;
  background:var(--bg-sunken);aspect-ratio:16/10;overflow:hidden}
.ncd.open .cd-cover{display:none}   /* 펼치면 아래 사진 묶음이 대신 보입니다 */
.cd-cover img{width:100%;height:100%;object-fit:contain;display:block}
.cd-cover .no{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;width:100%;height:100%;font-size:26px;color:var(--text-muted)}
.cd-cover .no em{font-size:11px;font-style:normal;font-weight:700}
.cd-hd{padding:10px 13px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.cd-hd .tt{font-size:13.5px;font-weight:800;color:var(--text-primary);line-height:1.45;
  word-break:break-word}
