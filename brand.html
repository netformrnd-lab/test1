      : (!trash.list || !trash.list.length)
        ? '<div class="empty">NAS 폴더에서 지운 파일이 없습니다.</div>'
        : '<div class="vz-tw"><table class="ymtable"><thead><tr>'
          + '<th>이름</th><th>원래 자리</th><th>지운 때</th><th></th></tr></thead><tbody>'
          + trash.list.map(e => '<tr' + (e['있음'] ? '' : ' class="dim"') + '>'
              + '<td><b>' + (e['폴더'] ? '📁 ' : '📄 ') + esc(e['이름']) + '</b>'
                + '<div class="fmeta">' + esc(e['크기'] || '')
                + (e['폴더'] ? ' · ' + (e['개수'] || 0).toLocaleString('ko-KR') + '개' : '')
                + (e['지운사람'] ? ' · ' + esc(e['지운사람']) : '') + '</div></td>'
              + '<td><span class="path" style="word-break:break-all">'
                + esc(String(e['원래자리'] || '').split('/').slice(-3).join('/')) + '</span></td>'
              + '<td style="white-space:nowrap">'
                + esc(String(e['지운때'] || '').replace('T', ' ').slice(0, 16)) + '</td>'
              + '<td style="white-space:nowrap">'
                + (e['있음']
                    ? '<button class="btn sm primary" onclick="untrash(\'' + jsq(e.id) + '\')">'
                      + '↩︎ 되돌리기</button> '
                      + '<button class="btn sm danger" onclick="purgeTrash(\'' + jsq(e.id) + '\',\''
                      + jsq(e['이름']) + '\')">완전히 지우기</button>'

  document.getElementById('main').innerHTML =

      + '<button class="btn sm" onclick="loadNasTrash()">↻ NAS 휴지통 다시 보기</button>'

/* NAS 휴지통 목록만 따로 받아옵니다 (창이 아니라 화면에서도 씁니다) */
async function loadNasTrash(){
  // 「볼 수 없음」 과 「비어 있음」 을 구분해서 말합니다.
  // 이걸 뭉뚱그리면 「다른 컴퓨터에선 왜 안 보이지」 하고 헤매게 됩니다.
  if(STORAGE_MODE !== 'nas'){
    trash.list = []; trash.ready = false;
    trash.why = '이 화면을 NAS 주소로 열지 않았습니다.\n'
      + '지금 주소: ' + location.href.split('?')[0] + '\n'
      + 'NAS 주소(' + nasUrl() + ')로 열어야 NAS 휴지통이 보입니다.';
    render(); return;
  }
  trash.busy = true; trash.error = ''; trash.why = ''; render();
  try{
    const out = await apiJson('nasfiles.php?action=trashlist');
    trash.list  = out['목록'] || [];
    trash.ready = out['준비됨'] !== false;
    trash.why   = trash.ready ? '' : (out['안내'] || '');
  }catch(e){ trash.error = apiErrText(e); trash.list = []; trash.ready = false; }
  trash.busy = false;
  render();
}

/* ═══════════════ 블로그 발행 ═══════════════════════════════════════
   따로 쓰던 「블로그 포스팅 대시보드」에 쌓아 온 발행 기록을 여기로 끌어옵니다.
   글을 새로 넣고 고치는 것은 원래 도구에서 그대로 하시고,
   여기서는 어떤 브랜드로 몇 건이 나갔는지 한자리에서 봅니다.

   받아오는 길: 화면 → NAS 의 blog.php → (인터넷) 원본 → data/blog-posts.json
   사무실 브라우저가 밖으로 못 나가도 되게, NAS 가 대신 받아 담아 둡니다.
   ================================================================= */
const blog = { busy:false, loaded:false, off:false, error:'', warn:'',
               rows:[], byBrand:{}, byMonth:{}, at:null, site:'',
               brand:'', month:'' };

/* 브랜드 이름은 띄어쓰기·대소문자가 달라도 같은 것으로 봅니다 */
function blogNorm(s){ return String(s == null ? '' : s).replace(/\s/g, '').toLowerCase(); }

/* 이 브랜드로 나간 글만 */
function blogOf(b){
  const key = blogNorm(b && b.name);
  if(!key) return [];
  return blog.rows.filter(r => blogNorm(r.brand) === key);
}

/* 이번 달에 나간 건수 */
function blogMonthCount(rows, ym){
  const m = ym || todayStr().slice(0, 7);
  return (rows || []).filter(r => String(r.publishedAt || '').slice(0, 7) === m).length;
}

/* 지난 달 (YYYY-MM) */
function lastYm(){
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() - 1);
  return todayStr(d).slice(0, 7);
}

async function loadBlog(force){
  if(blog.busy) return;
  blog.busy = true;
  blog.error = '';
  if(force) blog.warn = '';
  render();
  try{
    const out = await apiJson('blog.php?action=' + (force ? 'refresh' : 'list')
      + '&t=' + Date.now());
    blog.rows    = out['글'] || [];
    blog.byBrand = out['브랜드별'] || {};
    blog.byMonth = out['달별'] || {};
    blog.at      = out['받아온때'] || null;
    blog.site    = out['주소'] || '';
    blog.warn    = out['문제'] || '';
    blog.off     = !!out['끔'];
    blog.loaded  = true;
  }catch(e){ blog.error = apiErrText(e); }
  blog.busy = false;
  render();
}

/* 화면을 열 때 아직 안 받아왔으면 한 번 받아옵니다 (누르면 다시 받습니다).
   그리는 도중에 부르는 자리라, 바로 받지 않고 그리기가 끝난 뒤에 받습니다. */
function blogEnsure(){
  if(blog.loaded || blog.busy || blog.error) return;
  blog.busy = true;                       // 「받아오는 중」 이 먼저 보이게
  setTimeout(() => { blog.busy = false; loadBlog(false); }, 0);
}

function setBlogBrand(v){ blog.brand = v; render(); }
function setBlogMonth(v){ blog.month = (blog.month === v ? '' : v); render(); }
function blogClear(){ blog.brand = ''; blog.month = ''; render(); }

/* 받아온 때를 「3분 전」 처럼 */
function blogWhen(){
  if(!blog.at) return '아직 받아온 적 없음';
  const t = new Date(blog.at);
  if(isNaN(t)) return String(blog.at);
  const m = Math.floor((Date.now() - t.getTime()) / 60000);
  if(m < 1)   return '방금 받아옴';
  if(m < 60)  return m + '분 전에 받아옴';
  if(m < 1440) return Math.floor(m / 60) + '시간 전에 받아옴';
  return t.toLocaleDateString('ko-KR') + ' 에 받아옴';
}

/* 맨 위 줄 — 새로 받아오기 · 원래 도구 열기 */

/* 못 받아왔을 때 보여줄 안내 */
function blogWarnBox(){

/* 글 목록 표 */
function blogTable(rows, showBrand){
  if(!rows.length){
    return '<div class="empty">해당하는 글이 없습니다.</div>';
  }
  const cap  = 300;
  const show = rows.slice(0, cap);
  const cell = v => esc(v || '') || '<span class="zero">–</span>';
  return '<div class="vz-tw"><table class="ymtable"><thead><tr>'
    + '<th>발행일</th>'
    + (showBrand ? '<th>브랜드</th>' : '')
    + '<th>제목</th><th>작성자</th><th>주제</th><th>키워드</th><th>업무</th>'
    + '</tr></thead><tbody>'
    + show.map(r => '<tr>'
        + '<td>' + cell(r.publishedAt) + '</td>'
        + (showBrand ? '<td>' + cell(r.brand) + '</td>' : '')
        + '<td>' + (isUrl(r.link)
            ? '<a class="lnk" href="' + esc(r.link) + '" target="_blank" rel="noopener">'
              + (esc(r.title) || '(제목 없음)') + ' ↗</a>'
            : (esc(r.title) || '<span class="zero">(제목 없음)</span>')) + '</td>'
        + '<td>' + cell(r.author) + '</td>'
        + '<td>' + cell(r.topic) + '</td>'
        + '<td>' + cell(r.keyword) + '</td>'
        + '<td>' + cell(r.worktype) + '</td>'
        + '</tr>').join('')
    + '</tbody></table></div>'
    + (rows.length > cap
        ? '<div class="fmeta" style="margin-top:8px">최근 ' + cap + '건만 보여줍니다 (전체 '
          + rows.length + '건). 브랜드나 달을 골라 좁혀 보세요.</div>'
        : '');
}

/* 업무 → ✍️ 블로그 발행 */
function renderBlog(){
  blogEnsure();

  const head = '<h2 class="page-h">✍️ 블로그 발행</h2>'
    + '<div class="page-sub">「블로그 포스팅 대시보드」에 쌓인 발행 기록을 그대로 가져와 봅니다. '
      + '누가 어떤 브랜드로 몇 건을 썼는지 한자리에서 확인하세요</div>';
  const box = h => { document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">' + head + h + '</div></div>'; };

  if(!blog.loaded && blog.busy){
    box('<div class="empty">블로그 기록을 받아오는 중입니다…</div>');
    return;
  }
  if(!blog.loaded && blog.error){
    box(blogBar() + blogWarnBox());
    return;
  }
  if(blog.off){
    box(blogBar() + '<div class="empty">블로그 연결을 꺼두었습니다.</div>');
    return;
  }

  const all   = blog.rows;
  const ymNow = todayStr().slice(0, 7);
  const ymPre = lastYm();

  // 브랜드로 좁히기 — 우리 대시보드 브랜드를 앞에, 그 밖의 이름은 뒤에
  const keys  = Object.keys(blog.byBrand);
  const mine  = data.brands.filter(b => keys.some(k => blogNorm(k) === blogNorm(b.name)))
                           .map(b => b.name);
  const rest  = keys.filter(k => !mine.some(n => blogNorm(n) === blogNorm(k)))
                    .sort((x, y) => blog.byBrand[y] - blog.byBrand[x]);
  const cnt   = n => all.filter(r => blogNorm(r.brand) === blogNorm(n)).length;
  const pick  = '<div class="sec-bar" style="margin-bottom:12px">'
    + '<span class="fmeta">브랜드로 보기</span>'
    + '<button class="btn sm' + (blog.brand ? '' : ' primary') + '" '
      + 'onclick="setBlogBrand(\'\')">전체 ' + all.length + '</button>'
    + mine.concat(rest).map(n => '<button class="btn sm'
        + (blogNorm(blog.brand) === blogNorm(n) ? ' primary' : '') + '" '
        + 'onclick="setBlogBrand(\'' + jsq(n) + '\')">' + esc(n)
        + ' <b>' + cnt(n) + '</b></button>').join('')
    + '</div>';

  // 좁힌 결과
  let rows = all;
  if(blog.brand) rows = rows.filter(r => blogNorm(r.brand) === blogNorm(blog.brand));
  if(blog.month) rows = rows.filter(r => String(r.publishedAt || '').slice(0, 7) === blog.month);

  const scope  = blog.brand ? all.filter(r => blogNorm(r.brand) === blogNorm(blog.brand)) : all;
  const people = {};
  scope.forEach(r => { const k = r.author || '(작성자 없음)'; people[k] = (people[k] || 0) + 1; });
  const names  = Object.keys(people).sort((x, y) => people[y] - people[x]);

  const tiles = '<div class="stats">'
    + '<div class="stat"><div class="lb">✍️ 이번 달</div>'
      + '<div class="val">' + blogMonthCount(scope, ymNow) + '건</div>'
      + '<div class="sub">' + esc(ymNow) + '</div></div>'
    + '<div class="stat"><div class="lb">📅 지난 달</div>'
      + '<div class="val">' + blogMonthCount(scope, ymPre) + '건</div>'
      + '<div class="sub">' + esc(ymPre) + '</div></div>'
    + '<div class="stat"><div class="lb">📚 지금까지</div>'
      + '<div class="val">' + scope.length + '건</div>'
      + '<div class="sub">' + (blog.brand ? esc(blog.brand) : '브랜드 '
        + Object.keys(blog.byBrand).length + '곳') + '</div></div>'
    + '<div class="stat"><div class="lb">🙋 쓴 사람</div>'
      + '<div class="val">' + names.length + '명</div>'
      + '<div class="sub">' + (names.length
          ? esc(names[0]) + ' ' + people[names[0]] + '건이 가장 많습니다'
          : '아직 없습니다') + '</div></div>'
    + '</div>';

  // 달마다 몇 건 (누르면 그 달만 봅니다)
  const byMonth = {};
  scope.forEach(r => {
    const m = String(r.publishedAt || '').slice(0, 7);
    if(m) byMonth[m] = (byMonth[m] || 0) + 1;
  });
  const ms  = Object.keys(byMonth).sort().reverse().slice(0, 12);
  const max = ms.length ? Math.max.apply(null, ms.map(m => byMonth[m])) : 1;
  const bars = ms.length
    ? '<div class="vz-box" style="margin:14px 0">'
      + '<div class="vz-head">📅 달마다 몇 건 (눌러서 그 달만 보기)</div>'
      + ms.map(m => '<div class="bar-row" style="cursor:pointer" '
          + 'onclick="setBlogMonth(\'' + jsq(m) + '\')">'
          + '<span class="bl" style="width:64px' + (blog.month === m ? ';font-weight:700' : '')
            + '">' + esc(m) + '</span>'
          + '<span class="bt"><span class="bf" style="width:'
            + Math.round(byMonth[m] / max * 100) + '%;background:'
            + (blog.month === m ? 'var(--accent)' : 'var(--green)') + '"></span></span>'
          + '<span class="bv">' + byMonth[m] + '건</span></div>').join('')
      + '</div>'
    : '';

  const chosen = (blog.brand || blog.month)
    ? '<div class="sec-bar" style="margin-bottom:10px">'
      + '<span class="fmeta">보고 있는 것 · '
        + esc(blog.brand || '전체 브랜드') + (blog.month ? ' · ' + esc(blog.month) : '')
        + ' · ' + rows.length + '건</span>'
      + '<button class="btn sm" onclick="blogClear()">전체로 되돌리기</button>'
      + '</div>'
    : '';

  box(blogBar() + blogWarnBox() + pick + tiles + bars + chosen + blogTable(rows, !blog.brand));
}

      + '(네이버·구글 애널리틱스 등) 이때는 수정에서 미리보기를 「안 보기」로 바꿔주세요.'
      + '</div>';
}

/* ========================= 문의 =========================
   구글시트의 문의 기록을 n8n 등으로 NAS에 밀어 넣으면 여기에 표시됩니다.
   시트를 외부에 공개하지 않아도 되고, 대시보드에는 읽기 전용으로 보입니다.
   ======================================================== */
const inquiryCache = { loaded:false, loading:false, updatedAt:null, total:0,
                       columns:[], byBrand:{}, error:null };
let inquiryQuery = '';

const SYNC_INTERVAL_MIN = 1;   // NAS 가 구글시트에 물어보는 간격 (1분에 한 번)
const INQ_CHECK_MS     = 30000; // 화면이 "바뀐 게 있나" 만 확인하는 간격 (38바이트)

async function syncInquiries(manual){
  if(STORAGE_MODE !== 'nas') return;
  const stat = document.getElementById('csvStat');
  if(stat) stat.textContent = '시트에서 가져오는 중…';
  try{
    const res = await fetch('inquiries.php?action=sync', { cache:'no-store' });
    const t = await res.text();
    let out = null;
    try { out = JSON.parse(t); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '가져오지 못했습니다');
    inquiryCache.loaded = false;
    await loadInquiries(true);
    if(manual) toast('↻ 시트에서 ' + out['가져온건수'] + '건을 가져왔습니다');
  }catch(e){
    if(manual) showError('시트를 가져오지 못했습니다: ' + e.message);
    else inquiryCache.syncError = e.message;
  }finally{
    const st = document.getElementById('csvStat');
    if(st) st.textContent = '';
  }
}

/* ---------- 연결된 시트 관리 (브랜드마다 다른 시트를 붙일 수 있습니다) ---------- */
let sheetPanel = null;   // null=닫힘 | {loading} | {sources:[...]}

async function openSheets(){
  sheetPanel = { loading:true };
  render();
  try{
    const out = await apiJson('inquiries.php?action=sources');
    sheetPanel = { sources: out.sources || [] };
  }catch(e){ sheetPanel = { error: apiErrText(e) }; }
  render();
}
function closeSheets(){ sheetPanel = null; render(); }

async function saveSheets(list){
  try{
    await apiJson('inquiries.php?action=setsource', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ sources: list })
    });
    sheetPanel = { sources: list };
    inquiryCache.sheetCount = list.length;
    render();
    await syncInquiries(true);
  }catch(e){ alert(apiErrText(e)); }
}

async function addSheet(){
  const url = prompt(
    '구글시트 CSV 주소를 넣어주세요.\n\n'
    + '시트에서 파일 → 공유 → 웹에 게시 →\n'
    + '형식을 「쉼표로 구분된 값(.csv)」 으로 고르면 나오는 주소입니다.');
  if(url === null || !url.trim()) return;

  const name = prompt('이 시트를 뭐라고 부를까요? (예: 슈어포인트 문의)', '') || '';
  const names = data.brands.map((b, i) => (i + 1) + '. ' + b.name).join('\n');
  const pick = prompt(
    '이 시트는 어느 브랜드 것인가요?\n\n'
    + '시트에 「브랜드」 열이 있으면 0을 넣으세요 (열을 보고 알아서 나눕니다).\n'
    + '한 브랜드 전용 시트면 번호를 넣으세요.\n\n0. 시트의 브랜드 열 사용\n' + names, '0');
  if(pick === null) return;

  let brand = '';
  const n = parseInt(pick, 10);
  if(n > 0){
    const b = data.brands[n - 1];
    if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }
    brand = b.name;
  }

  const list = (sheetPanel && sheetPanel.sources ? sheetPanel.sources.slice() : []);
  list.push({ name: name.trim(), url: url.trim(), brand: brand });
  await saveSheets(list);
}

async function removeSheet(id){
  const list = (sheetPanel.sources || []).filter(x => x.id !== id);
  if(!confirm('이 시트 연결을 지울까요?\n\n구글시트 원본은 그대로 있습니다.')) return;
  await saveSheets(list);
}

async function editSheetBrand(id){
  const list = (sheetPanel.sources || []).slice();
  const s = list.find(x => x.id === id);
  if(!s) return;
  const names = data.brands.map((b, i) => (i + 1) + '. ' + b.name).join('\n');
  const pick = prompt('이 시트는 어느 브랜드 것인가요?\n\n0. 시트의 브랜드 열 사용\n' + names,
    s.brand ? String(data.brands.findIndex(b => b.name === s.brand) + 1) : '0');
  if(pick === null) return;
  const n = parseInt(pick, 10);
  s.brand = n > 0 && data.brands[n - 1] ? data.brands[n - 1].name : '';
  await saveSheets(list);
}

async function loadSheetCount(){

    inquiryCache.sheetCount = (out.sources || []).length;
  }catch(e){ inquiryCache.sheetCount = 0; }
  render();

async function loadInquiries(force){
  if(STORAGE_MODE !== 'nas'){ inquiryCache.loaded = true; return; }
  if(inquiryCache.loading || (inquiryCache.loaded && !force)) return;
  inquiryCache.loading = true;
  if(inquiryCache.sheetCount === undefined) setTimeout(loadSheetCount, 10);
  try{
    const res = await fetch('inquiries.php?action=list&t=' + Date.now(), { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '불러오지 못했습니다');

    const by = {};
    const norm = v => String(v || '').replace(/\s/g, '');
    (out.rows || []).forEach(r => {
      const bn = r['브랜드'] || r['brand'] || r['Brand'] || r['브랜드명'] || '';
      (by[norm(bn)] = by[norm(bn)] || []).push(r);
    });
    // 대시보드의 브랜드 이름 기준으로 다시 담습니다
    inquiryCache.byBrand = {};
    data.brands.forEach(b => { inquiryCache.byBrand[b.name] = by[norm(b.name)] || []; });

    inquiryCache.columns   = out.columns || [];
    inquiryCache.ownCols   = out['내칸'] || [];
    inquiryCache.rows      = out.rows || [];
    inquiryCache.updatedAt = out.updatedAt;
    inquiryCache.total     = out.total || 0;
    inquiryCache.error     = null;

    // 연결된 시트 주소를 함께 확인합니다
    try{
      const c = await (await fetch('inquiries.php?action=check', { cache:'no-store' })).json();
      inquiryCache.sheetUrl = c['연결된시트'] || '연결 안 됨';
    }catch(e){ inquiryCache.sheetUrl = '확인 불가'; }

    // 오래됐으면 시트에서 다시 가져오게 합니다 (이후로는 inquiryTick 이 1분마다 챙깁니다)
    const linked = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨';
    const stale = !out.updatedAt ||
      (Date.now() - new Date(out.updatedAt).getTime()) > SYNC_INTERVAL_MIN * 60000;
    if(linked && stale && !inquiryCache.autoSyncing){
      inquiryCache.autoSyncing = true;
      setTimeout(() => { syncInquiries(false).finally(() => { inquiryCache.autoSyncing = false; }); }, 50);
    }
  }catch(e){
    inquiryCache.error = e.message;
    // 목록을 못 불러와도 연결 상태는 따로 확인해 둡니다
    try{
      const c = await (await fetch('inquiries.php?action=check', { cache:'no-store' })).json();
      inquiryCache.sheetUrl = c['연결된시트'] || '연결 안 됨';
    }catch(e2){ inquiryCache.sheetUrl = '연결 안 됨'; }
  }finally{
    inquiryCache.loading = false;
    inquiryCache.loaded  = true;
    if(!searchQuery && (currentTab === 'inquiries' || !currentBrandId)) render();
  }
}

/* ── 구글시트도 알아서 따라오게 ────────────────────────────────────────
   1분마다 "언제 갱신됐는지" 만 물어봅니다 (38 바이트).
   바뀌었으면 그때만 목록을 다시 받아 화면에 반영합니다.
   그리고 NAS 에 받아둔 게 오래됐으면 시트에서 다시 가져오라고 시킵니다.
   여러 명이 열어둬도 NAS 는 구글에 한 번만 갑니다 (maxage·잠금).
   ------------------------------------------------------------------ */
let inqBusy = false;
async function inquiryTick(){
  if(STORAGE_MODE !== 'nas' || inqBusy || !inquiryCache.loaded) return;
  inqBusy = true;
  try{
    const st = await apiJson('inquiries.php?action=stamp&t=' + Date.now());
    if(st && st.ok){
      // NAS 가 가진 내용이 화면 것과 다르면 다시 받아옵니다
      if(st.updatedAt && st.updatedAt !== inquiryCache.updatedAt){
        inquiryCache.loaded = false;
        await loadInquiries(true);
        render();
        toast('📮 문의 기록이 바뀌었습니다 (새 문의 또는 다른 분이 고침)');
      }
      // NAS 가 가진 것 자체가 오래됐으면 시트에서 새로 가져오게 합니다
      const linked = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨';
      const age = st.updatedAt ? (Date.now() - new Date(st.updatedAt).getTime()) / 1000 : 1e9;
      if(linked && age > SYNC_INTERVAL_MIN * 60){
        await apiJson('inquiries.php?action=sync&maxage=' + (SYNC_INTERVAL_MIN * 60));
      }
    }
  }catch(e){ /* 곁다리라 조용히 */ }
  finally{ inqBusy = false; }
}

/* 구글시트에서 내려받은 CSV를 읽습니다 (따옴표·줄바꿈 포함된 셀도 처리) */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // 엑셀 BOM 제거
  const rows = [];
  let row = [], cell = '', inQuote = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuote){
      if(c === '"'){
        if(text[i + 1] === '"'){ cell += '"'; i++; }
        else inQuote = false;
      } else cell += c;
    }else{
      if(c === '"') inQuote = true;
      else if(c === ',') { row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c !== '\r') cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

function csvToObjects(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('내용이 없습니다. 머리글 줄과 데이터가 있어야 합니다.');
  const head = rows[0].map(h => String(h).trim());
  if(!head.some(h => ['브랜드','brand','Brand','브랜드명'].includes(h)))
    throw new Error('브랜드 열을 찾지 못했습니다. 첫 줄에 「브랜드」 열이 있어야 합니다. '
      + '(찾은 열: ' + head.filter(Boolean).join(', ') + ')');
  return rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, i) => { if(h) o[h] = (r[i] || '').trim(); });
    return o;
  });
}

async function uploadInquiryCsv(file){
  const stat = document.getElementById('csvStat');
  const setStat = t => { if(stat) stat.textContent = t; };
  setStat('읽는 중…');
  try{
    const text = await file.text();
    const rows = csvToObjects(text);
    setStat(rows.length + '건 보내는 중…');

    const res = await fetch('inquiries.php?action=push', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ source:'csv-' + file.name.slice(0, 40), rows })
    });
    const t = await res.text();
    let out = null;
    try { out = JSON.parse(t); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
      + t.slice(0, 200).replace(/\s+/g, ' '));
    if(!out.ok) throw new Error(out.error || '보내지 못했습니다');

    setStat('');
    inquiryCache.loaded = false;
    await loadInquiries(true);
    toast('📞 문의 ' + out['받은건수'] + '건을 등록했습니다');
  }catch(e){
    setStat('');
    showError('문의 파일을 읽지 못했습니다: ' + e.message);
  }
}

/* 시트의 열 구성을 몰라도 되게, 값을 보고 성격을 추측합니다.
   - 날짜처럼 생긴 열 → 기간 집계에 사용
   - 값 종류가 적은 짧은 열(상태·공종·유입 등) → 분류 집계에 사용
   - 이름·연락처·내용처럼 값이 제각각인 열 → 집계에서 제외 */
function diffTag(v){
  if(v === null || v === undefined) return '';
  const up = v >= 0;
  return '<span class="delta ' + (up ? 'up' : 'down') + '">'
       + (up ? '▲' : '▼') + Math.abs(v) + '%</span>';
}

function bars(items, valueKey){
  const max = Math.max(...items.map(x => x[valueKey] || 0), 1);
  return '<div class="bars">' + items.map(x =>
    '<div class="bar-row"><span class="bl" title="' + esc(x.label) + '">' + esc(x.label) + '</span>'
    + '<span class="bt"><span class="bf" style="width:'
      + Math.round((x[valueKey] || 0) / max * 100) + '%"></span></span>'
    + '<span class="bv">' + (x[valueKey] || 0).toLocaleString('ko-KR') + '</span></div>').join('')
    + '</div>';
}

function analyzeInquiries(rows){
  const skip = ['브랜드','brand','Brand','브랜드명'];
  // 우리끼리 적는 칸(메모 등)은 '문의 내용' 으로 뽑히면 안 됩니다.
  // 화면 아래쪽에 따로 보여주고 있어서 같은 글이 두 번 나오게 됩니다.
  // 다만 「처리상태」처럼 값이 몇 가지뿐인 칸은 분류로는 쓸 수 있게 둡니다.
  const skipText = skip.concat(inquiryCache.ownCols || []);
  const cols = [];
  // 밑줄로 시작하는 것(_key·_고침 …)은 내부에서만 쓰는 값이라 화면에 내보내지 않습니다
  rows.forEach(r => Object.keys(r).forEach(k => {
    if(k && k[0] !== '_' && !cols.includes(k)) cols.push(k);
  }));

  const looksDate = v => parseYMD(v) !== null;

  // 날짜 열이 여러 개일 수 있습니다 (접수날짜 / 접수시간 / 접수일시 …).
  // 그중 "값이 가장 많이 채워진" 열을 씁니다.
  // 최근 건만 한쪽 열이 비어 있으면, 그 열을 고를 경우 최신 기록을 놓치기 때문입니다.
  const dateHits = {};
  cols.forEach(c => { dateHits[c] = rows.reduce((a, r) => a + (looksDate(r[c]) ? 1 : 0), 0); });

  const pickDateCol = (list) => {
    let best = null, n = 0;
    list.forEach(c => { if(dateHits[c] > n){ n = dateHits[c]; best = c; } });
    return n > 0 ? best : null;
  };
  const named = cols.filter(c => /날짜|일자|일시|시각|등록|접수|date|time/i.test(c));
  let dateCol = pickDateCol(named);
  // 이름으로 고른 열이 절반도 안 채워져 있으면 전체에서 다시 고릅니다
  if(!dateCol || dateHits[dateCol] < rows.length * 0.5){
    const any = pickDateCol(cols);
    if(any && dateHits[any] > (dateCol ? dateHits[dateCol] : 0)) dateCol = any;
  }

  // 이름·연락처처럼 사람마다 다른 값은 집계에 쓰지 않습니다
  const isPrivate = c => /이름|성함|고객명|담당자|연락처|전화|휴대|번호|이메일|메일|주소/.test(c);

  // 먼저 설명 열(문의 내용 등)을 정합니다 — 가장 길게 적히는 열
  let textCol = null, bestLen = 0;
  const dateish0 = c => /날짜|일자|일시|시각|시간|date|time/i.test(c)
    || (rows.length && dateHits[c] >= rows.length * 0.3);
  cols.forEach(c => {
    if(skipText.includes(c) || c === dateCol || isPrivate(c) || dateish0(c)) return;
    const vals = rows.map(r => String(r[c] || '').trim()).filter(Boolean);
    if(!vals.length) return;
    const avg = vals.reduce((a, v) => a + v.length, 0) / vals.length;
    if(avg > bestLen){ bestLen = avg; textCol = c; }
  });
  if(bestLen < 12) textCol = null;      // 다들 짧으면 설명 열이 없는 것으로 봅니다

  // 사람이 읽을 분류가 아닌 열은 뺍니다.
  //  · 시트를 만든 프로그램이 붙인 열 (hasFiles, fileCount, id, timestamp …)
  //  · 예/아니오, 숫자만 들어 있는 열
  const hasHangul = c => /[가-힣]/.test(c);
  const isBoolish = vals => vals.every(v =>
    /^(true|false|y|n|yes|no|예|아니오|아니요|o|x|0|1)$/i.test(v));
  const isNumeric = vals => vals.every(v => /^-?\d+(\.\d+)?$/.test(v));

  // 나머지 중 같은 값이 반복되는 짧은 열을 분류로 봅니다 (공종·유입·상태 등)
  const cats = [];
  // 날짜·시간 열은 분류가 아닙니다 (접수날짜·접수시간·접수일시 …)
  const isDateish = c => /날짜|일자|일시|시각|시간|date|time/i.test(c)
    || (rows.length && dateHits[c] >= rows.length * 0.3);

  cols.forEach(c => {
    if(skip.includes(c) || c === dateCol || c === textCol || isPrivate(c)) return;
    if(isDateish(c)) return;
    if(!hasHangul(c)) return;                                   // 영문 열 이름은 프로그램용으로 봅니다
    const vals = rows.map(r => String(r[c] || '').trim()).filter(Boolean);
    if(vals.length < rows.length * 0.2) return;                 // 대부분 비어 있으면 제외
    if(isBoolish(vals) || isNumeric(vals)) return;              // 예/아니오·숫자만 있는 열 제외
    const uniq = new Set(vals);
    const avgLen = vals.reduce((a, v) => a + v.length, 0) / vals.length;
    if(uniq.size >= 2 && uniq.size <= 20 && uniq.size < vals.length * 0.8 && avgLen <= 15){
      cats.push({ col:c, uniq:uniq.size });
    }
  });
  cats.sort((a, b) => a.uniq - b.uniq);                          // 종류가 적은 것부터

  return { cols, dateCol, cats: cats.map(x => x.col).slice(0, 6), textCol };
}

/* 문의 날짜를 진짜 날짜로 읽습니다.
   "2026. 8. 7" 처럼 0을 안 붙인 날짜가 섞이면 글자로 비교할 때
   8월 7일이 8월 21일보다 최신으로 잡혀서, 반드시 숫자로 바꿔 비교합니다. */
function parseYMD(v){
  const s = String(v || '').trim();
  if(!s) return null;
  let m = s.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/);          // 8/21/2026
  if(m) return new Date(+m[3], +m[1] - 1, +m[2]);
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);                        // 20260821
  if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  // 전화번호(010-1234-5678)나 "27개동, 1,786세대" 같은 값을 날짜로 오해하지 않도록
  // 네 자리 연도가 들어 있는 값만 마지막으로 한 번 더 봅니다.
  if(s.length > 40 || !/(^|\D)(19|20)\d{2}(\D|$)/.test(s)) return null;
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}

function dateNum(v){
  const d = parseYMD(v);
  return d ? d.getTime() : -Infinity;
}

function fmtYMD(v){
  const d = parseYMD(v);
  if(!d) return String(v || '');
  return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate();
}

function ym(v){
  const d = parseYMD(v);
  return d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') : '';
}

function countBy(rows, col){
  const m = {};
  rows.forEach(r => {
    const v = String(r[col] || '').trim() || '미입력';
    m[v] = (m[v] || 0) + 1;
  });
  // 미입력은 분류가 아니므로 맨 뒤로 보냅니다
  return Object.entries(m).map(([label, count]) => ({ label, count }))
    .sort((a, b) => (a.label === '미입력') - (b.label === '미입력') || b.count - a.count);
}

function inquirySummary(rows){
  const a = analyzeInquiries(rows);
  const now = new Date();
  const thisYM = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevYM = prev.getFullYear() + '-' + String(prev.getMonth() + 1).padStart(2, '0');

  // 이번 달이 아직 진행 중이면, 지난달도 "같은 날짜까지만" 세어야 비교가 맞습니다
  const today = now.getDate();
  const dayOf = v => { const d = parseYMD(v); return d ? d.getDate() : 0; };

  let thisMonth = 0, lastMonth = 0, lastMonthFull = 0, latest = '', latestNum = -Infinity;
  if(a.dateCol){
    rows.forEach(r => {
      const k = ym(r[a.dateCol]);
      if(k === thisYM) thisMonth++;
      if(k === prevYM){
        lastMonthFull++;
        if(dayOf(r[a.dateCol]) <= today) lastMonth++;
      }
      const t = dateNum(r[a.dateCol]);
      if(t > latestNum){ latestNum = t; latest = fmtYMD(r[a.dateCol]); }
    });
  }
  return Object.assign(a, { thisMonth, lastMonth, lastMonthFull, latest, thisYM, prevYM, today });
}

/* ═══════════════ 문의 내용 고치기 ══════════════════════════════════
   구글시트가 원본이라 1분마다 다시 가져옵니다.
   그래서 고친 값을 시트에 쓰는 게 아니라 NAS 에 따로 보관해 두었다가,
   가져올 때마다 그 위에 얹습니다. 그래야 덮어써지지 않습니다.
   ================================================================= */
const STATUS_OPTS = ['', '미확인', '진행중', '완료', '보류', '해당없음'];
let cellEdit = null;      // { key, col, value } — 지금 고치고 있는 칸

function startCell(key, col, cur){
  cellEdit = { key: key, col: col, value: cur == null ? '' : String(cur) };
  render();
  setTimeout(() => {
    const el = document.getElementById('cellEd');
    if(el){ el.focus(); if(el.select) el.select(); }
  }, 10);
}

function cellKeydown(ev){
  if(ev.key === 'Enter'){ ev.preventDefault(); commitCell(ev.target.value); }
  else if(ev.key === 'Escape'){ cellEdit = null; render(); }
}

async function commitCell(v){
  if(!cellEdit) return;
  const { key, col } = cellEdit;
  cellEdit = null;

  // 화면에 먼저 반영합니다. 표 전체를 다시 받지 않아 깜빡이지 않습니다.
  const own = inquiryCache.ownCols || [];
  const row = (inquiryCache.rows || []).find(r => r._key === key);
  if(row){
    const isSheetCol = own.indexOf(col) < 0;
    if(v === ''){
      if(isSheetCol && row._원래 && row._원래[col] !== undefined){
        row[col] = row._원래[col];                    // 시트 값으로 되돌리기
        delete row._원래[col];
        row._고침 = (row._고침 || []).filter(c => c !== col);
      }else{
        row[col] = '';
      }
    }else{
      if(isSheetCol && !(row._원래 && row._원래[col] !== undefined)){
        row._원래 = row._원래 || {};
        row._원래[col] = row[col] == null ? '' : String(row[col]);
        row._고침 = (row._고침 || []).concat([col]);
      }
      row[col] = v;
    }
  }
  render();

  try{
    const res = await fetch('inquiries.php?action=edit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key: key, col: col, value: v })
    });
    const out = JSON.parse(await res.text());
    if(!out.ok) throw new Error(out.error || '저장하지 못했습니다');
    // 내 화면은 이미 최신이므로 다시 받지 않습니다 (다른 분 화면은 30초 안에 따라옵니다)
    if(out.updatedAt) inquiryCache.updatedAt = out.updatedAt;
  }catch(e){
    inquiryCache.loaded = false;
    await loadInquiries(true);          // 저장이 안 됐으면 서버 내용으로 되돌립니다
    render();
    showError('문의 내용을 저장하지 못했습니다.\n\n' + (e.message || e)
      + '\n\n화면은 저장된 내용으로 되돌렸습니다.');
  }
}

/* 한 칸을 그립니다. 고치는 중이면 입력칸으로 바뀝니다. */
function cellHtml(r, c, own){
  const val = r[c] == null ? '' : String(r[c]);
  const editing = cellEdit && cellEdit.key === r._key && cellEdit.col === c;
  const fixed = !own && r._고침 && r._고침.indexOf(c) >= 0;

  if(editing){
    if(c === '처리상태'){
      return '<td class="ed on"><select id="cellEd" onchange="commitCell(this.value)" '
        + 'onblur="commitCell(this.value)">'
        + STATUS_OPTS.map(o => '<option value="' + esc(o) + '"'
            + (o === val ? ' selected' : '') + '>' + (o === '' ? '—' : esc(o)) + '</option>').join('')
        + '</select></td>';
    }
    return '<td class="ed on"><input id="cellEd" type="text" value="' + esc(val) + '" '
      + 'onkeydown="cellKeydown(event)" onblur="commitCell(this.value)"></td>';
  }

  const cls = 'ed' + (fixed ? ' fixed' : '') + (own && val ? ' has' : '');
  const tip = fixed ? ' title="고친 값입니다. 시트 원래 값: '
                      + esc((r._원래 && r._원래[c]) || '') + ' (비우면 되돌아갑니다)"' : '';
  return '<td class="' + cls + '"' + tip
    + ' onclick="startCell(\'' + jsq(r._key) + '\',\'' + jsq(c) + '\',this.dataset.v||\'\')"'
    + ' data-v="' + esc(val) + '">'
    + (val ? highlight(val, inquiryQuery) : '<span class="edph">+</span>')
    + (fixed ? '<span class="edmark" aria-label="고침">✎</span>' : '')
    + '</td>';
}

/* 대시보드에서만 쓰는 칸(처리상태·담당자·메모) 을 바꿉니다 */
async function editCols(){
  const cur = (inquiryCache.ownCols || []).join(', ');
  const v = prompt('문의 표에 둘 칸을 쉼표로 적어주세요.\n\n'
    + '구글시트에는 없는, 우리끼리 쓰는 칸입니다. (최대 8개)\n'
    + '예) 처리상태, 담당자, 메모', cur);
  if(v === null) return;
  try{
    const res = await fetch('inquiries.php?action=editcols', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ cols: v.split(',').map(x => x.trim()).filter(Boolean) })
    });
    const out = JSON.parse(await res.text());
    if(!out.ok) throw new Error(out.error || '바꾸지 못했습니다');
    inquiryCache.loaded = false;
    await loadInquiries(true);
    if(out.updatedAt) inquiryCache.updatedAt = out.updatedAt;
    render();
    toast('✅ 칸을 바꿨습니다');
  }catch(e){ showError('칸을 바꾸지 못했습니다.\n\n' + (e.message || e)); }
}

/* ═══════════════ 연도별 문의 추이 ═══════════════════════════════════
   같은 달끼리 해마다 비교합니다. (작년 9월 vs 올해 9월)
   꺾은선 + 점으로 그리고, 바로 아래 표에 숫자를 그대로 둡니다.
   ─ 색은 해(연도)를 나타냅니다. 글자에는 색을 쓰지 않습니다.
   ================================================================= */
const YEAR_HUES = ['var(--sr1)', 'var(--sr2)', 'var(--sr3)', 'var(--sr4)'];

/* 색은 '몇 번째 줄인지' 가 아니라 '그 해' 에 붙습니다.
   그래야 해가 바뀌어도 2025년은 늘 같은 색이라 헷갈리지 않습니다.
   (연속된 4개 해는 서로 다른 색이 됩니다) */
function yearHue(y){ return YEAR_HUES[((y % 4) + 4) % 4]; }

/* 화면에 같이 그리는 해들의 색을 정합니다.
   되도록 yearHue 그대로 쓰되(그래야 해마다 색이 안 바뀝니다),
   4살 차이로 색이 겹치면(2022 와 2026) 남는 색으로 비켜 줍니다. */
function yearHueMap(years){
  const used = {}, out = {};
  years.forEach(y => {
    let c = yearHue(y);
    if(used[c]){ c = YEAR_HUES.find(h => !used[h]) || c; }
    used[c] = true; out[y] = c;
  });
  return out;
}
const MONTHS_KO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const QUARTER_KO = ['1분기','2분기','3분기','4분기'];
let yearChartMax = 4;      // 한 번에 그릴 해의 수

/* 그래프를 어떻게 볼지 — 화면에서 바꿀 수 있습니다 */
const chartOpt = {
  off: {},        // 꺼둔 해 { 2024: true }
  unit: '월',     // 월 | 분기
  cat: '',        // 나눠볼 분류 열 (예: 문의유형)
  val: ''         // 그 분류의 값 (빈 값이면 전체)
};

/* 고친 숫자 — 브랜드마다 { '2024-1': 12 } 꼴로 담아둡니다.
   구글시트에 없는 옛날 자료를 채워 넣거나, 틀린 숫자를 바로잡을 때 씁니다.
   시트 원래 숫자는 건드리지 않고, 화면에 보일 때만 덮어씁니다.        */
let chartCell = null;      // 지금 고치고 있는 칸 { y, i }

function chartFixMap(b){
  if(b && !b.chartFix) b.chartFix = {};
  return (b && b.chartFix) || {};
}
function chartFixCount(b){ return Object.keys(chartFixMap(b)).length; }

/* 이번 달보다 뒤인가 (아직 오지 않은 달은 고칠 수 없습니다) */
function isFuture(y, i){
  const n = new Date();
  return y > n.getFullYear() || (y === n.getFullYear() && i > n.getMonth());
}

function startChartCell(y, i){
  const b = currentBrand();
  if(!b || isFuture(y, i)) return;
  chartCell = { y: y, i: i };
  render();
  const el = document.getElementById('chartEd');
  if(el){ el.focus(); el.select(); }
}

function chartCellKeydown(e){
  if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
  else if(e.key === 'Escape'){ e.preventDefault(); chartCell = null; render(); }
}

/* 빈 칸으로 두면 고친 것을 지우고 시트 숫자로 되돌아갑니다 */
function commitChartCell(raw){
  const cell = chartCell;
  chartCell = null;
  const b = currentBrand();
  if(!cell || !b){ render(); return; }

  const key = cell.y + '-' + (cell.i + 1);
  const fix = chartFixMap(b);
  const txt = String(raw == null ? '' : raw).replace(/[\s,]/g, '');

  if(txt === ''){
    if(fix[key] != null){ delete fix[key]; markDirty(); }
    render();
    return;
  }
  const n = Number(txt);
  if(!isFinite(n) || n < 0 || n !== Math.floor(n)){
    render();
    toast('⚠️ 0 이상의 정수만 넣을 수 있습니다');
    return;
  }
  if(fix[key] !== n){ fix[key] = n; markDirty(); }
  render();
}

function chartFixClear(){
  const b = currentBrand();
  if(!b) return;
  const n = chartFixCount(b);
  if(!n) return;
  if(!confirm('고쳐둔 숫자 ' + n + '칸을 모두 시트 숫자로 되돌릴까요?')) return;
  b.chartFix = {};
  markDirty(); render();
  toast('↩︎ 시트 숫자로 되돌렸습니다');
}

function chartToggleYear(y){
  chartOpt.off[y] = !chartOpt.off[y];
  render();
}
function chartSetUnit(u){ chartOpt.unit = u; chartCell = null; render(); }
function chartSetCat(v){
  const i = v.indexOf('\u241F');                 // "열\u241F값" 으로 넘어옵니다
  chartOpt.cat = i < 0 ? '' : v.slice(0, i);
  chartOpt.val = i < 0 ? '' : v.slice(i + 1);
  chartCell = null;
  render();
}
function chartReset(){
  chartOpt.off = {}; chartOpt.unit = '월'; chartOpt.cat = ''; chartOpt.val = '';
  render();
}

/* 연도 × (월 또는 분기) 표를 만듭니다.
   언제나 12달로 먼저 세고, 고친 숫자를 덮어쓴 뒤, 분기면 그때 묶습니다.
   그래야 월별로 고친 것이 분기별 화면에도 그대로 반영됩니다.
   fix 를 주지 않으면(검색 중이거나 분류로 좁혔을 때) 원래 숫자만 씁니다.  */
function yearMonthGrid(rows, dateCol, unit, fix){
  const m = {};                          // 연도 → [12개월]
  let none = 0;
  rows.forEach(r => {
    const d = dateCol ? parseYMD(r[dateCol]) : null;
    if(!d){ none++; return; }
    const y = d.getFullYear();
    if(!m[y]) m[y] = new Array(12).fill(0);
    m[y][d.getMonth()]++;
  });

  const raw = {};                        // 고치기 전 숫자 (원래 값을 알려주려고 남깁니다)
  Object.keys(m).forEach(y => { raw[y] = m[y].slice(); });

  const fixed = {};                      // 연도 → { 달번호: true }
  if(fix){
    Object.keys(fix).forEach(k => {
      const p = k.split('-');
      const y = Number(p[0]), i = Number(p[1]) - 1;
      if(!isFinite(y) || !(i >= 0 && i < 12)) return;
      if(!m[y]){ m[y] = new Array(12).fill(0); raw[y] = new Array(12).fill(0); }
      m[y][i] = fix[k];
      (fixed[y] = fixed[y] || {})[i] = true;
    });
  }

  const n = unit === '분기' ? 4 : 12;
  let grid = m, rawU = raw, fixedU = fixed;
  if(unit === '분기'){
    // 분기로 묶을 때는 원래 숫자와 '고친 표시' 도 같은 눈금으로 맞춥니다.
    // (안 그러면 2분기 칸이 2월의 원래 숫자를 보여주는 식으로 어긋납니다)
    grid = {}; rawU = {}; fixedU = {};
    Object.keys(m).forEach(y => {
      grid[y] = [0, 0, 0, 0];
      rawU[y] = [0, 0, 0, 0];
      m[y].forEach((v, i) => { grid[y][Math.floor(i / 3)] += v; });
      raw[y].forEach((v, i) => { rawU[y][Math.floor(i / 3)] += v; });
      Object.keys(fixed[y] || {}).forEach(i => {
        (fixedU[y] = fixedU[y] || {})[Math.floor(Number(i) / 3)] = true;
      });
    });
  }
  const years = Object.keys(grid).map(Number).sort((a, b) => b - a);   // 최근 연도부터
  return { grid, years, none, n, months: m, raw: rawU, fixed: fixedU, fixedM: fixed };
}

/* 그 해에 어느 달까지 그릴지.
   올해는 '이번 달' 까지만 그립니다. 아직 오지 않은 달을 0건으로 그리면
   문의가 뚝 끊긴 것처럼 보여서 잘못 읽게 됩니다. */
function lastMonthOf(year, g, unit){
  const now = new Date();
  const n = unit === '분기' ? 4 : 12;
  if(year > now.getFullYear()) return -1;
  if(year === now.getFullYear()){
    return unit === '분기' ? Math.floor(now.getMonth() / 3) : now.getMonth();
  }
  // 지난 해인데 뒷쪽이 통째로 비어 있으면 (그때부터 기록이 없는 것) 거기서 끊습니다
  const arr = (g.grid && g.grid[year]) || [];
  let last = n - 1;
  while(last > 0 && arr[last] === 0 && arr[last - 1] === 0) last--;

  // 손으로 숫자를 넣어둔 달이 그보다 뒤에 있으면 거기까지 보여줍니다
  const fx = (g.fixedM && g.fixedM[year]) || {};
  Object.keys(fx).forEach(i => {
    const at = unit === '분기' ? Math.floor(Number(i) / 3) : Number(i);
    if(at > last) last = at;
  });
  return last;
}

/* 그 해에 어느 달부터 그릴지.
   앞쪽이 통째로 비어 있으면 (그때는 아직 기록이 없던 것) 거기서부터 시작합니다.
   9월부터 손으로 채워 넣은 해를 1~8월 0건으로 그리면 없던 일이 생깁니다. */
function firstMonthOf(year, g, unit){
  const arr = (g.grid && g.grid[year]) || [];
  const fx  = (g.fixedM && g.fixedM[year]) || {};
  const has = i => arr[i] > 0
    || Object.keys(fx).some(k => (unit === '분기' ? Math.floor(Number(k) / 3) : Number(k)) === i);
  for(let i = 0; i < arr.length; i++){ if(has(i)) return i; }
  return 0;
}

/* 꺾은선 그래프 (SVG 를 직접 그립니다 — 인터넷 없이도 뜹니다) */
function inquiryYearChart(g, shownYears, cand4){
  const N = g.n || 12;
  const W = 720, H = 260;
  const PAD = { t: 16, r: 18, b: 30, l: 42 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;

  const hue = yearHueMap(cand4 || shownYears);
  const lastOf = {}, firstOf = {};
  shownYears.forEach(y => {
    lastOf[y]  = lastMonthOf(y, g, chartOpt.unit);
    firstOf[y] = firstMonthOf(y, g, chartOpt.unit);
  });

  let max = 0;
  shownYears.forEach(y => g.grid[y].forEach((v, i) => {
    if(i >= firstOf[y] && i <= lastOf[y] && v > max) max = v;
  }));
  if(max < 4) max = 4;
  const step = Math.max(1, Math.ceil(max / 4));
  const top  = step * 4;                                    // 눈금이 딱 떨어지게

  const x = i => N === 1 ? PAD.l + iw / 2 : PAD.l + (iw * i) / (N - 1);
  const y = v => PAD.t + ih - (ih * v) / top;

  // 가로 눈금선 (연하게)
  let grid = '';
  for(let k = 0; k <= 4; k++){
    const val = step * k, yy = y(val);
    grid += '<line x1="' + PAD.l + '" y1="' + yy + '" x2="' + (W - PAD.r) + '" y2="' + yy
      + '" class="vz-grid"/>'
      + '<text x="' + (PAD.l - 8) + '" y="' + (yy + 4) + '" class="vz-tick" text-anchor="end">'
      + val.toLocaleString('ko-KR') + '</text>';
  }
  for(let i = 0; i < N; i++){
    grid += '<text x="' + x(i) + '" y="' + (H - 10) + '" class="vz-tick" text-anchor="middle">'
      + (chartOpt.unit === '분기' ? (i + 1) + 'Q' : (i + 1)) + '</text>';
  }

  // 선과 점
  let marks = '';
  shownYears.forEach(yr => {
    const col = hue[yr] || yearHue(yr);
    const upto = lastOf[yr];
    const from = firstOf[yr];
    if(upto < 0 || from > upto) return;
    const pts = g.grid[yr].slice(from, upto + 1).map((v, k) => [x(from + k), y(v)]);
    if(pts.length > 1){
      marks += '<polyline class="vz-line" stroke="' + col + '" points="'
        + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
    }
    pts.forEach(p => {
      marks += '<circle class="vz-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1)
        + '" r="4.5" fill="' + col + '"/>';
    });
    // 선이 끝나는 자리에만 연도를 적습니다 (모든 점에 숫자를 달지 않습니다)
    const last = pts[pts.length - 1];
    const atRight = upto >= N - 2;
    marks += '<text x="' + (last[0] + (atRight ? -6 : 8)) + '" y="' + (last[1] - 9)
      + '" class="vz-endlab" text-anchor="' + (atRight ? 'end' : 'start') + '">'
      + yr + (upto < N - 1 ? ' →' : '') + '</text>';
  });

  // 마우스를 올리면 그 달의 모든 해를 함께 보여줍니다
  let hot = '';
  const band = N > 1 ? iw / (N - 1) : iw;
  for(let i = 0; i < N; i++){
    const lab = chartOpt.unit === '분기' ? QUARTER_KO[i] : (i + 1) + '월';
    const tip = shownYears.map(yr => yr + '년 ' + lab + ' · '
      + (i < firstOf[yr] ? '기록 없음'
          : (i <= lastOf[yr] ? g.grid[yr][i].toLocaleString('ko-KR') + '건'
                             : '아직'))).join('&#10;');
    hot += '<rect class="vz-hot" x="' + (x(i) - band / 2) + '" y="' + PAD.t
      + '" width="' + band + '" height="' + ih + '"><title>' + esc(tip) + '</title></rect>';
  }

  return '<svg class="vz" viewBox="0 0 ' + W + ' ' + H + '" role="img" '
    + 'aria-label="연도별 월 문의 건수 꺾은선 그래프">'
    + grid + marks + hot + '</svg>';
}

/* 표의 숫자 한 칸. 고칠 수 있으면 눌러서 바로 숫자를 넣습니다. */
function ymCell(g, yr, i, v, from, upto, unit, canFix){
  // 월별일 때만, 그리고 아직 오지 않은 달이 아닐 때만 고칠 수 있습니다
  const editable = canFix && unit === '월' && !isFuture(yr, i);
  const isFix    = !!(g.fixed[yr] && g.fixed[yr][i]);
  const origN    = (g.raw[yr] || [])[i] || 0;

  if(chartCell && chartCell.y === yr && chartCell.i === i){
    // 원래 숫자를 안 보이게 남겨 칸 너비를 지킵니다.
    // (입력칸이 자리를 넓히면 표 전체가 옆으로 밀립니다)
    return '<td class="num ed2 on"><span class="edshadow">'
      + (v ? v.toLocaleString('ko-KR') : '0') + '</span>'
      + '<input id="chartEd" type="text" inputmode="numeric" size="4" '
      + 'value="' + esc(isFix ? String(v) : '') + '" '
      + 'placeholder="' + origN + '" '
      + 'onkeydown="chartCellKeydown(event)" onblur="commitChartCell(this.value)"></td>';
  }

  if((i > upto || i < from) && !isFix){
    const why = i < from ? '아직 기록이 없던 때' : '아직 오지 않은 때';
    return '<td class="num zero' + (editable ? ' ed2' : '') + '"'
      + ' title="' + why + (editable ? '입니다 — 눌러서 숫자를 넣을 수 있습니다' : '') + '"'
      + (editable ? ' onclick="startChartCell(' + yr + ',' + i + ')"' : '')
      + '>–</td>';
  }

  const tip = isFix
    ? '손으로 고친 숫자입니다 (시트 숫자: ' + origN.toLocaleString('ko-KR') + '건)'
      + ' — 비우면 되돌아갑니다'
    : (editable ? '눌러서 숫자를 고칠 수 있습니다' : '');

  return '<td class="num' + (v ? '' : ' zero') + (isFix ? ' fx' : '')
    + (editable ? ' ed2' : '') + '"'
    + (tip ? ' title="' + esc(tip) + '"' : '')
    + (editable ? ' onclick="startChartCell(' + yr + ',' + i + ')"' : '') + '>'
    + (v ? v.toLocaleString('ko-KR') : '0')
    + (isFix ? '<span class="fxmark" aria-label="고침">✎</span>' : '')
    + '</td>';
}

function inquiryYearView(rows, dateCol, sum, b, searching){
  if(!dateCol) return '';

  // 분류로 좁혀 보기 (예: 문의유형 = 하자점검 만)
  let use = rows;
  if(chartOpt.cat && chartOpt.val){
    use = rows.filter(r => String(r[chartOpt.cat] || '').trim() === chartOpt.val);
  }

  // 손으로 고친 숫자는 '이 브랜드 전체' 에 대한 값입니다.
  // 그래서 분류로 좁혔거나 찾는 중일 때는 덮어쓰지 않고 원래 숫자만 봅니다.
  const narrowed = !!(chartOpt.cat && chartOpt.val) || !!searching;
  const canFix   = !!b && !narrowed;
  const fix      = canFix ? chartFixMap(b) : null;

  const unit = chartOpt.unit;
  const g = yearMonthGrid(use, dateCol, unit, fix);
  if(!g.years.length) return '';

  const N     = g.n;
  const LABS  = unit === '분기' ? QUARTER_KO : MONTHS_KO;
  const cand  = g.years.slice(0, yearChartMax);            // 그릴 수 있는 해
  const shown = cand.filter(y => !chartOpt.off[y]);        // 실제로 켠 해

  // ── 조작 줄 ───────────────────────────────────────────────
  // 연도는 눌러서 껐다 켤 수 있습니다. 꺼도 다른 해의 색은 그대로입니다.
  const hueMap = yearHueMap(cand);
  const yearBtns = cand.map(yr => {
    const on = !chartOpt.off[yr];
    return '<button class="vz-key vz-btn' + (on ? '' : ' off') + '" '
      + 'onclick="chartToggleYear(' + yr + ')" '
      + 'title="' + (on ? '눌러서 숨기기' : '눌러서 보이기') + '">'
      + '<span class="vz-sw" style="background:' + (on ? (hueMap[yr] || yearHue(yr)) : 'var(--text-muted)') + '"></span>'
      + yr + '년</button>';
  }).join('');

  // 나눠볼 수 있는 분류 (문의유형 등) — 값이 몇 가지뿐인 열만 고릅니다
  const cats = (sum && sum.cats) ? sum.cats : [];
  let catSel = '';
  if(cats.length){
    let opts = '<option value="">전체</option>';
    cats.forEach(c => {
      const vals = {};
      rows.forEach(r => { const v = String(r[c] || '').trim(); if(v) vals[v] = (vals[v] || 0) + 1; });
      const list = Object.keys(vals).sort((a, b) => vals[b] - vals[a]).slice(0, 12);
      if(!list.length) return;
      opts += '<optgroup label="' + esc(c) + '">'
        + list.map(v => '<option value="' + esc(c + '\u241F' + v) + '"'
            + (chartOpt.cat === c && chartOpt.val === v ? ' selected' : '') + '>'
            + esc(v) + ' (' + vals[v] + ')</option>').join('')
        + '</optgroup>';
    });
    catSel = '<select class="vz-sel" onchange="chartSetCat(this.value)">' + opts + '</select>';
  }

  const controls = '<div class="vz-ctrl">'
    + '<span class="vz-keys">' + yearBtns + '</span>'
    + '<span class="vz-spacer"></span>'
    + '<span class="vz-seg">'
      + ['월','분기'].map(u => '<button class="' + (unit === u ? 'on' : '') + '" '
          + 'onclick="chartSetUnit(\'' + u + '\')">' + u + '별</button>').join('')
    + '</span>'
    + catSel
    + ((Object.keys(chartOpt.off).some(k => chartOpt.off[k]) || chartOpt.cat || unit !== '월')
        ? '<button class="btn sm" onclick="chartReset()">처음으로</button>' : '')
    + (canFix && chartFixCount(b)
        ? '<button class="btn sm" onclick="chartFixClear()" '
          + 'title="손으로 고친 숫자를 모두 시트 숫자로 되돌립니다">'
          + '↩︎ 고친 숫자 되돌리기 (' + chartFixCount(b) + ')</button>' : '')
    + '</div>';

  if(!shown.length){
    return '<div class="vz-box">'
      + '<div class="vz-head">📈 해마다 언제 문의가 많았나</div>'
      + controls
      + '<div class="empty" style="padding:28px">볼 해를 하나 이상 켜주세요.</div></div>';
  }

  // ── 표 (그래프와 같은 숫자) ────────────────────────────────
  const head = '<tr><th>연도</th>'
    + LABS.map(m => '<th class="num">' + m + '</th>').join('')
    + '<th class="num">합계</th></tr>';
  const body = g.years.map(yr => {
    const arr = g.grid[yr];
    const upto = lastMonthOf(yr, g, unit);
    const from = firstMonthOf(yr, g, unit);
    const total = arr.reduce((a, v, i) => (i >= from && i <= upto) ? a + v : a, 0);
    const dim = chartOpt.off[yr] || cand.indexOf(yr) < 0;
    return '<tr' + (dim ? ' class="dim"' : '') + '><th class="yr">' + yr + '</th>'
      + arr.map((v, i) => ymCell(g, yr, i, v, from, upto, unit, canFix)).join('')
      + '<td class="num tot">' + total.toLocaleString('ko-KR') + '</td></tr>';
  }).join('');
  const colSum = new Array(N).fill(0);
  g.years.forEach(yr => g.grid[yr].forEach((v, i) => { colSum[i] += v; }));
  const foot = '<tr class="sumrow"><th>합계</th>'
    + colSum.map(v => '<td class="num">' + (v ? v.toLocaleString('ko-KR') : '·') + '</td>').join('')
    + '<td class="num tot">' + colSum.reduce((a, v) => a + v, 0).toLocaleString('ko-KR')
    + '</td></tr>';

  const what = chartOpt.cat && chartOpt.val
    ? esc(chartOpt.cat) + ' = ' + esc(chartOpt.val) + ' 만'
    : '전체 문의';

  return '<div class="vz-box">'
    + '<div class="vz-head">📈 해마다 언제 문의가 많았나'
      + '<span class="fmeta" style="margin-left:auto">' + what
      + ' · 가로축 = ' + unit + ' · 점에 마우스를 올리면 숫자가 나옵니다</span>'
    + '</div>'
    + controls
    + '<div class="vz-wrap">' + inquiryYearChart(g, shown, cand) + '</div>'
    + (g.years.length > cand.length
        ? '<div class="fmeta" style="margin-top:6px">최근 ' + cand.length
          + '개 해만 그립니다 (표에는 전부 있습니다)</div>' : '')
    + '<div class="vz-tw"><table class="ymtable">'
      + '<thead>' + head + '</thead><tbody>' + body + foot + '</tbody></table></div>'
    + '<div class="fmeta" style="margin-top:8px">'
      + (canFix && unit === '월'
          ? '✎ 표의 숫자를 눌러 고칠 수 있습니다. 시트에 없는 옛날 자료를 채워 넣거나 '
            + '틀린 숫자를 바로잡을 때 쓰세요. <b>구글시트는 바뀌지 않고</b>, '
            + '이 화면에만 덮어씁니다. 칸을 비우면 시트 숫자로 돌아갑니다.'
          : (canFix
              ? '숫자를 고치려면 <b>월별</b>로 바꿔주세요 (분기는 월을 더한 값입니다)'
              : '분류로 좁혔거나 찾는 중일 때는 시트 숫자만 보여줍니다 '
                + '(고친 숫자는 브랜드 전체 기준이라 섞이면 헷갈립니다)'))
      + '</div>'
    + (g.none ? '<div class="fmeta" style="margin-top:8px">날짜를 못 읽은 문의 '
        + g.none.toLocaleString('ko-KR') + '건은 빠져 있습니다</div>' : '')
    + '</div>';
}

function viewInquiries(b){
  if(STORAGE_MODE !== 'nas'){
    return '<div class="empty">🔒 문의 기록은 NAS 주소로 접속했을 때만 보입니다.<br>'
      + esc(nasUrl()) + ' 로 접속해 주세요.</div>';
  }
  if(!inquiryCache.loaded) return '<div class="empty">불러오는 중…</div>';

  const linked = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨'
                 && inquiryCache.sheetUrl !== '확인 불가';
  const rows = inquiryCache.byBrand[b.name] || [];
  // 얼마나 최신인지 한눈에 보이게 "몇 분 전" 으로 적습니다
  const when = (function(){
    if(!inquiryCache.updatedAt) return '아직 받은 적 없음';
    const d = new Date(inquiryCache.updatedAt);
    if(isNaN(d.getTime())) return '알 수 없음';
    const m = Math.floor((Date.now() - d.getTime()) / 60000);
    if(m < 1) return '방금';
    if(m < 60) return m + '분 전';
    return d.toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' });
  })();

  const bar = '<div class="sec-bar">'
    + '<span class="searchbox" style="flex:0 1 260px"><span class="ico">🔍</span>'
      + '<input type="text" id="iqQ" placeholder="이 브랜드 문의에서 검색" '
      + 'value="' + esc(inquiryQuery) + '" oninput="onInquiryQuery(this.value)"></span>'
    + (linked
        ? '<button class="btn primary" onclick="syncInquiries(true)">↻ 시트에서 가져오기</button>'
        : '<button class="btn primary" onclick="openSheets()">🔗 시트 연결</button>')
    + '<button class="btn" onclick="openSheets()">🔗 시트 관리'
      + (inquiryCache.sheetCount ? ' (' + inquiryCache.sheetCount + ')' : '') + '</button>'
    + '<button class="btn" onclick="document.getElementById(\'csvInput\').click()">📥 CSV 올리기</button>'
    + '<input type="file" id="csvInput" accept=".csv,text/csv" style="display:none">'
    + '<span class="astat" id="csvStat"></span>'
    + '<span class="hint">전체 ' + inquiryCache.total.toLocaleString('ko-KR') + '건 중 이 브랜드 '
      + rows.length.toLocaleString('ko-KR') + '건 · 시트에서 가져온 때: ' + esc(when)
      + (linked ? ' · 🔗 자동으로 따라옵니다' : '') + '</span>'
    + '</div>'
    + (inquiryCache.syncError
        ? '<div class="ainote" style="margin-bottom:12px;white-space:pre-wrap">⚠️ 자동 가져오기 실패: '
          + esc(inquiryCache.syncError) + '</div>' : '')
    + sheetPanelView();

  // 목록을 아예 못 불러온 경우에도 위 버튼들은 그대로 두어 조치할 수 있게 합니다
  if(inquiryCache.error){
    const notFound = /404/.test(inquiryCache.error);
    return bar + '<div class="empty">'
      + (notFound
          ? '문의 기능 파일이 아직 NAS에 없습니다.<br><br>'
            + '아래 주소를 브라우저에서 한 번 열면 자동으로 설치됩니다.<br>'
            + '<span class="path" style="display:inline-block;margin-top:8px">'
            + esc(nasBase()) + '/save.php?action=bootstrap</span><br>'
            + '<span style="display:inline-block;margin-top:8px;color:var(--text-muted)">'
            + '설치 후 이 화면에서 Ctrl+F5 를 눌러주세요</span>'
          : '문의 기록을 불러오지 못했습니다.<br>'
            + '<span class="path">' + esc(inquiryCache.error) + '</span>')
      + '</div>';
  }

  if(!inquiryCache.total){
    return bar + '<div class="empty">아직 등록된 문의 기록이 없습니다.<br><br>'
      + '<b>[🔗 시트 연결]</b> 을 눌러 구글시트 CSV 주소를 넣으면<br>'
      + '이후로는 알아서 가져옵니다.<br>'
      + '<span style="display:inline-block;margin-top:10px;color:var(--text-muted)">'
      + '첫 줄에 「브랜드」 열이 있어야 브랜드별로 나뉩니다</span></div>';
  }
  if(!rows.length){
    return bar + '<div class="empty">"' + esc(b.name) + '" 브랜드로 들어온 문의가 없습니다.<br>'
      + '시트의 브랜드 열 값이 브랜드 이름과 같은지 확인해 주세요.</div>';
  }

  const q = inquiryQuery.trim().toLowerCase();
  const shown = q
    ? rows.filter(r => Object.values(r).join(' ').toLowerCase().includes(q))
    : rows;

  const sum = inquirySummary(shown);
  const diff = sum.lastMonth > 0
    ? Math.round((sum.thisMonth - sum.lastMonth) / sum.lastMonth * 100) : null;

  // 요약 타일
  const tiles = [
    { lab:'📮 전체 문의', val: shown.length.toLocaleString('ko-KR') + ' 건',
      sub: q ? '검색 결과 기준' : b.name },
    { lab:'📅 이번 달 (1~' + sum.today + '일)', val: sum.dateCol ? sum.thisMonth + ' 건' : '—',
      sub: sum.dateCol
        ? '지난달 같은 기간 ' + sum.lastMonth + '건 ' + (diff === null ? '' : diffTag(diff))
          + (sum.lastMonthFull !== sum.lastMonth
              ? '<br>지난달 전체는 ' + sum.lastMonthFull + '건' : '')
        : '날짜 열이 없어 계산 못 함' },
    { lab:'🕘 최근 문의', val: sum.latest ? esc(sum.latest) : '—',
      sub: sum.dateCol ? '가장 마지막 기록' : '날짜 열이 없어 계산 못 함' }
  ].map(x => '<div class="stat"><div class="lab">' + x.lab + '</div>'
    + '<div class="val" style="font-size:23px">' + x.val + '</div>'
    + '<div class="sub">' + x.sub + '</div></div>').join('');

  // 분류별 집계 (상태·공종·유입 등을 자동으로 골라냅니다)
  const breakdown = sum.cats.length
    ? '<div class="hsec">📊 분류별</div><div class="mgrid">'
      + sum.cats.map(c => '<div class="mbox"><div class="mh">' + esc(c) + '</div>'
          + bars(countBy(shown, c), 'count') + '</div>').join('')
      + '</div>'
    : '';

  // 최근 문의 목록
  const recent = sum.dateCol
    ? shown.slice().sort((x, y) => dateNum(y[sum.dateCol]) - dateNum(x[sum.dateCol])).slice(0, 8)
    : shown.slice(0, 8);
  const recentList = '<div class="hsec">🕘 최근 문의</div><div class="mbox">'
    + (recent.length ? recent.map(r => {
        // 설명 열이 없으면 분류가 아닌 값들을 이어 붙여 보여줍니다
        let text = sum.textCol ? String(r[sum.textCol] || '').trim() : '';
        if(!text){
          const ownC = inquiryCache.ownCols || [];
          text = sum.cols
            .filter(c => c !== sum.dateCol && !sum.cats.includes(c)
                         && ownC.indexOf(c) < 0
                         && !['브랜드','brand','Brand','브랜드명'].includes(c))
            .map(c => String(r[c] || '').trim()).filter(Boolean).join(' · ');
        }
        // 처리상태·메모는 우리끼리 적은 것이라, 여기서도 바로 보이게 둡니다
        const st = String(r['처리상태'] || '').trim();
        const memo = String(r['메모'] || '').trim();
        const who  = String(r['담당자'] || '').trim();
        const stCls = st === '완료' ? ' on' : (st === '진행중' ? ' test' : (st ? '' : ''));
        return '<div class="krow" style="flex-direction:column;align-items:stretch;gap:4px">'
          + '<div style="white-space:normal;color:var(--text-primary)">'
            + (st ? '<span class="chip' + stCls + '" style="margin-right:6px">'
                    + esc(st) + '</span>' : '')
            + (sum.dateCol ? '<b>' + highlight(fmtYMD(r[sum.dateCol]), inquiryQuery) + '</b>'
                             + (text ? ' · ' : '') : '')
            + highlight(text.slice(0, 90), inquiryQuery)
          + '</div>'
          + (memo || who
              ? '<div class="fmeta" style="white-space:normal">'
                + (who ? '👤 ' + esc(who) + (memo ? ' · ' : '') : '')
                + (memo ? '📝 ' + esc(memo.slice(0, 120)) : '') + '</div>'
              : '')
          + (sum.cats.length
              ? '<div class="row" style="margin:0">' + sum.cats.slice(0, 4).map(c =>
                  r[c] ? '<span class="chip">' + esc(r[c]) + '</span>' : '').join('') + '</div>'
              : '')
          + '</div>';
      }).join('')
    : '<div class="fmeta">표시할 문의가 없습니다.</div>')
    + '</div>';

  // 전체 표 (접어둠)
  const cols = inquiryCache.columns.filter(c => !['브랜드','brand','Brand','브랜드명'].includes(c));
  // 우리끼리 쓰는 칸(처리상태·담당자·메모) 을 앞에, 시트 칸을 뒤에 둡니다
  const own  = inquiryCache.ownCols || [];
  const sheetCols = cols.filter(c => own.indexOf(c) < 0 && c[0] !== '_');
  const tcols = own.concat(sheetCols);

  const table = inquiryShowTable
    ? '<div class="fmeta" style="margin:10px 0 6px">'
      + '칸을 눌러 바로 고칠 수 있습니다. '
      + '<b>' + esc(own.join(' · ') || '(없음)') + '</b> 은 우리끼리 쓰는 칸이고, '
      + '나머지는 구글시트에서 온 값입니다 — 고치면 ✎ 표시가 붙고, '
      + '비우면 시트 값으로 되돌아갑니다.'
      + ' <button class="btn sm" onclick="editCols()">칸 고르기</button></div>'
    + '<div class="table-wrap"><table class="itable editable">'
      + '<tr>' + tcols.map(c => '<th' + (own.indexOf(c) >= 0 ? ' class="ownc"' : '') + '>'
          + esc(c) + '</th>').join('') + '</tr>'
      + shown.slice(0, 500).map(r => '<tr>'
          + tcols.map(c => cellHtml(r, c, own.indexOf(c) >= 0)).join('')
          + '</tr>').join('')
      + '</table></div>'
      + (shown.length > 500
          ? '<div class="fmeta" style="margin-top:8px">화면에는 500건까지만 표시합니다 '
            + '(찾기로 좁히면 그 안에서 고칠 수 있습니다)</div>' : '')
    : '';

  return bar
    + (q ? '<div class="fmeta" style="margin-bottom:10px">검색 결과 ' + shown.length + '건</div>' : '')
    + '<div class="stats">' + tiles + '</div>'
    + inquiryYearView(shown, sum.dateCol, sum, b, !!q)
    + breakdown
    + recentList
    + '<div class="hsec">📋 전체 목록'
      + '<button class="btn sm" style="margin-left:10px;font-weight:600" onclick="toggleInquiryTable()">'
      + (inquiryShowTable ? '접기' : '펼치기 (' + shown.length + '건)') + '</button></div>'
    + table
    + '<div class="fmeta" style="margin-top:12px">'
      + '고친 내용은 NAS 에 따로 보관되어, 시트를 다시 가져와도 지워지지 않습니다. '
      + '원본 구글시트는 그대로입니다.</div>';
}

/* ═══════════════ 회의록 ═══════════════════════════════════════════
   회의에서 나온 이야기를 그대로 적어두면, AI 가 읽고
   요약 · 결정사항 · 할 일로 정리해 줍니다.

   AI 를 부르는 건 NAS 입니다. 사무실 브라우저는 밖으로 못 나가고,
   키를 브라우저에 두면 대시보드를 여는 누구나 볼 수 있어서입니다.
   ================================================================= */
const aiState = { ready:null, busy:null, error:null, netFail:false, wait:null };

async function aiCheck(){
  if(STORAGE_MODE !== 'nas') return;
  try{
    const r = await apiJson('ai.php?action=check');
    aiState.ready = !!(r && r['키등록됨']);
    aiState.info  = r;
  }catch(e){ aiState.ready = false; aiState.error = apiErrText(e); }
  render();
}

/* ═══════════════ 우리 것 붙이기 (NAS·사무실 PC 에 올린 AI) ═════════
   Ollama·LM Studio 처럼 「챗GPT 와 같은 모양」 으로 답하는 것이면 됩니다.
   인터넷에 나가지 않고 돈도 들지 않습니다.
   ================================================================= */
async function aiSetLocal(){
  const now = (aiState.info || {})['우리것주소'] || '';
  const url = prompt('우리 AI 가 있는 주소를 적어주세요.\n\n'
    + '· 사무실 PC 에 올렸다면:    http://192.168.0.50:11434\n'
    + '· NAS 안(도커)에 올렸다면:  http://localhost:11434\n'
    + '  (LM Studio 는 보통 :1234)\n\n'
    + '※ Ollama 는 기본이 「그 PC 안에서만」 입니다.\n'
    + '   OLLAMA_HOST=0.0.0.0 을 넣고 다시 시작해야 NAS 가 부를 수 있습니다.\n'
    + '   윈도우 방화벽에서 그 포트도 열어주세요.\n\n'
    + '인터넷에 나가지 않고, 돈도 들지 않습니다.', now || 'http://192.168.0.50:11434');
  if(url === null || !url.trim()) return;

  toast('🔎 그 주소를 확인하는 중…');
  let models = [];
  try{
    const out = await apiJson('ai.php?action=localmodels&url=' + encodeURIComponent(url.trim()));
    models = out['모델들'] || [];
  }catch(e){
    if(!confirm('그 주소에 닿지 못했습니다.\n\n' + apiErrText(e)
      + '\n\n흔한 원인은 이 셋입니다.\n'
      + '  1) 그 PC 가 꺼져 있거나 AI 프로그램이 안 떠 있음\n'
      + '  2) OLLAMA_HOST=0.0.0.0 을 안 넣어 그 PC 안에서만 열려 있음\n'
      + '  3) 윈도우 방화벽이 그 포트를 막고 있음\n\n'
      + '그래도 이 주소로 저장할까요?')) return;
  }

  let model = '';
  if(models.length){
    const pick = prompt('어떤 모델을 쓸까요? 번호를 넣어주세요.\n\n'
      + models.slice(0, 20).map((m, i) => '  ' + (i + 1) + ' = ' + m).join('\n'), '1');
    if(pick === null) return;
    model = models[Number(pick.trim()) - 1] || models[0];
  }else{
    const m = prompt('쓸 모델 이름을 적어주세요.\n\n'
      + '예) qwen2.5:7b · gemma3:4b · llama3.1:8b\n'
      + '(비워두면 그 서버의 기본값을 씁니다)', '');
    if(m === null) return;
    model = m.trim();
  }

  const key = prompt('열쇠(키)가 필요한 서버인가요?\n\n'
    + 'Ollama·LM Studio 는 보통 필요 없습니다. 그냥 비워두고 확인을 누르세요.', '');
  if(key === null) return;

  const sec = prompt('얼마나 기다려 줄까요? (초)\n\n'
    + '그래픽카드 없는 사무실 PC 는 회의록 한 건에 1~3분이 걸리기도 합니다.\n'
    + '너무 짧으면 다 만들기 전에 끊깁니다.', '240');
  if(sec === null) return;

  try{
    const res = await fetch('ai.php?action=setkey', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ vendor:'local', url: url.trim(), model, key: key.trim(),
                             secs: Number(sec.trim()) || 240 })
    });
    const out = JSON.parse(await res.text());
    if(!out.ok) throw new Error(out.error || '저장하지 못했습니다');
    toast('🖥 ' + (out['안내'] || '우리 것을 쓰도록 맞췄습니다'));
    await aiCheck();
  }catch(e){ showError('맞추지 못했습니다.\n\n' + (e.message || e)); }
}

async function aiSetKey(){
  const v = prompt('AI 키를 넣어주세요.\n\n'
    + '· 챗GPT: platform.openai.com → API keys 의 「sk-…」 키\n'
    + '· 클로드: console.anthropic.com 의 「sk-ant-…」 키\n'
    + '· 마누스: 마누스 앱 → API 설정에서 만든 키\n\n'
    + '· 키는 NAS 에만 저장되고, 화면으로 다시 보이지 않습니다.\n'
    + '· 비워두고 확인을 누르면 저장된 키를 지웁니다.', '');
  if(v === null) return;
  const k = v.trim();
  let vendor = '';
  if(k){
    // 키 모양만으로는 알 수 없습니다 (마누스 키도 sk- 로 시작할 수 있습니다).
    // 잘못 짐작해서 엉뚱한 회사에 물어보는 일이 없도록 항상 여쭤봅니다.
    const guess = /^sk-ant-/.test(k) ? '3' : (/^sk-/.test(k) ? '2' : '1');
    const pick = prompt('어느 AI 의 키인가요? 번호를 넣어주세요.\n\n'
      + '  1 = 마누스 (Manus)\n'
      + '  2 = 챗GPT (OpenAI)\n'
      + '  3 = 클로드 (Anthropic)\n\n'
      + '(키 모양으로 짐작한 값을 넣어뒀습니다. 다르면 고쳐주세요)', guess);
    if(pick === null) return;
    vendor = { '1':'manus', '2':'openai', '3':'anthropic' }[pick.trim()] || '';
    if(!vendor){ toast('⚠️ 1·2·3 중에서 골라주세요'); return; }
  }
  try{
    const res = await fetch('ai.php?action=setkey', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key: k, vendor })
    });
    const out = JSON.parse(await res.text());
    if(!out.ok) throw new Error(out.error || '저장하지 못했습니다');
    toast(out['키등록됨']
      ? ('✅ ' + (out['어느 AI'] || 'AI') + ' 키를 저장했습니다')
      : '키를 지웠습니다');
    await aiCheck();
  }catch(e){ showError('키를 저장하지 못했습니다.\n\n' + (e.message || e)); }
}

/* 마누스처럼 오래 걸리는 AI 는 「작업 시작 → 끝났나 확인」 두 걸음입니다.
   PHP 가 몇 분씩 붙잡고 있으면 NAS 가 요청을 끊어버려서, 화면이 물어봅니다. */
async function waitTask(taskId, kind, onTick){
  const started = Date.now();
  const LIMIT = 6 * 60 * 1000;                 // 6분까지 기다립니다
  let n = 0;
  while(Date.now() - started < LIMIT){
    await new Promise(r => setTimeout(r, n === 0 ? 3000 : 4000));
    n++;
    const out = await apiJson('ai.php?action=taskcheck&kind=' + encodeURIComponent(kind)
      + '&id=' + encodeURIComponent(taskId));
    if(out['상태'] === '끝') return out;
    if(onTick) onTick(Math.round((Date.now() - started) / 1000));
  }
  throw new Error('마누스가 6분 안에 끝내지 못했습니다.\n'
    + '마누스 앱에서 그 작업이 어떻게 됐는지 확인해 보세요.');
}

/* 회의 하나를 AI 에게 정리해 달라고 합니다 */
async function aiSummarize(id){
  const m = (data.meetings || []).find(x => x.id === id);
  if(!m) return;
  if(!String(m.body || '').trim()){ toast('⚠️ 회의 내용이 비어 있습니다'); return; }

  aiState.busy = id; aiState.error = null; render();
  try{
    const res = await fetch('ai.php?action=summarize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ notes: m.body, title: m.title || '', brand: m.brand || '' })
    });
    let out = JSON.parse(await res.text());
    if(!out.ok){
      // 서버가 붙여준 표시(느림 등)를 잃지 않게 오류에 그대로 옮겨 답니다
      const err = new Error(out.error || '정리하지 못했습니다');
      Object.assign(err, out);
      throw err;
    }

    // 마누스는 작업이 끝날 때까지 기다립니다 (화면에 몇 초 지났는지 보여줍니다)
    if(out['진행중']){
      aiState.wait = 0; render();
      out = await waitTask(out['작업번호'], 'summarize', sec => { aiState.wait = sec; render(); });
    }

    m.ai = {
      요약: out['요약'] || '', 결정사항: out['결정사항'] || [],
      할일: out['할일'] || [], 다음회의: out['다음회의'] || '',
      확인필요: out['확인필요'] || [], 잘림: !!out['잘림'],
      만든때: new Date().toISOString()
    };
    m.updatedAt = new Date().toISOString();
    markDirty();
    toast('✅ 정리했습니다' + (out['잘림'] ? ' (내용이 길어 앞부분만 봤습니다)' : ''));
  }catch(e){
    aiState.error = e.message || String(e);
    aiState.netFail = true;
    // 「시간이 모자란 것」 은 인터넷 문제가 아닙니다 — 점검 창을 열면 헛걸음입니다
    if(e && e['느림']){
      showError(aiState.error);
    }else if(/연결하지 못|curl|wget|file_get_contents|시도한 방법/.test(aiState.error)){
      showError('AI 정리에 실패했습니다.\n\nNAS 가 인터넷으로 나가지 못하고 있습니다.\n'
        + '어디가 막혔는지 바로 확인해 드리겠습니다.');
      openNetCheck();
    }else{
      showError('AI 정리에 실패했습니다.\n\n' + aiState.error);
    }
  }finally{ aiState.busy = null; aiState.wait = null; render(); }
}

/* ═══════════════ AI 없이 하기 (복사 → 붙여넣기) ═══════════════════
   API 는 프로그램이 AI 에게 말을 거는 통로라서 돈이 듭니다.
   대신 사람이 다리를 놓으면 공짜입니다 — 쓰고 계신 클로드·챗GPT 창을 그대로 씁니다.
   claude.ai 안에서는 키가 없어도 답해 주기 때문입니다 (구독 사용량으로 처리).
     ① [🆓 클로드 창에서 하기] — 문장을 복사하고 클로드 창을 열어줍니다

   ================================================================= */
const MEET_ASK =
  '아래 회의 메모를 정리해 주세요. **JSON 하나만** 답하세요. 다른 말은 붙이지 마세요.\n\n'

  + '  "결정사항": ["정해진 것만"],\n'
  + '  "할일": [{"내용":"", "담당":"", "기한":"YYYY-MM-DD 또는 빈칸"}],\n'
  + '  "다음회의": "",\n'
  + '  "확인필요": ["메모만으로는 알 수 없어 사람이 확인해야 할 것"]\n'
  + '}\n\n'
  + '규칙: 메모에 없는 내용은 지어내지 마세요. 담당·기한은 적혀 있을 때만 채우세요.\n'
  + '존댓말로 짧고 담백하게 쓰세요.\n';

function meetAskText(m){
  return MEET_ASK
    + '\n--- 회의 메모 ---\n'
    + (m.brand ? '브랜드: ' + m.brand + '\n' : '')
    + (m.title ? '회의 제목: ' + m.title + '\n' : '')
    + (m.date  ? '날짜: ' + m.date + '\n' : '')
    + '\n' + m.body;

async function copyMeetAsk(id){
  const m = (data.meetings || []).find(x => x.id === id);
  if(!m) return;

  const text = meetAskText(m);

/* ── 쓰고 계신 구독 그대로 쓰기 ────────────────────────────────
   claude.ai 안에서는 키가 없어도 클로드가 답합니다 (구독 사용량으로).
   그래서 ① 문장 복사 ② 클로드 창 열기 ③ 붙여넣을 자리 띄우기 를
   한 번에 해줍니다. 돌아와서 Ctrl+V 한 번이면 끝입니다.
   ※ 창 열기는 누른 그 순간에 해야 브라우저가 막지 않습니다.       */
const CHAT_URL = 'https://claude.ai/new';

async function chatHandoff(text, after){
  window.open(CHAT_URL, '_blank', 'noopener');
  let copied = false;
  try{ await navigator.clipboard.writeText(text); copied = true; }catch(e){}
  if(after) after(copied);
  if(copied){
    toast('📋 복사했습니다 — 클로드 창에 Ctrl+V 로 붙여넣고, 받은 답을 가져오세요');
  }else{
    alert('클로드 창을 열었습니다.\n\n복사가 막혀 있어 문장을 아래에 띄웁니다. '
      + '이것을 클로드 창에 붙여넣으세요.\n\n' + text);
  }
}

/* 회의록 — 클로드 창으로 보내고, 답 붙여넣을 자리까지 열어둡니다 */

}

/* 붙여넣기 창 */
const pasteBox = { open:false, id:'', text:'', err:'' };
function openPaste(id){ pasteBox.open = true; pasteBox.id = id; pasteBox.text = ''; pasteBox.err = ''; render();
  setTimeout(() => { const el = document.getElementById('pasteArea'); if(el) el.focus(); }, 60); }
function closePaste(){ pasteBox.open = false; render(); }
function onPasteInput(v){ pasteBox.text = v; }

/* 붙여넣은 글에서 JSON 을 찾아냅니다. 앞뒤에 딴 말이 붙어 있어도 됩니다. */
function readAiAnswer(raw){
  const t = String(raw || '').trim();
  if(!t) return null;
  let j = null;
  try{ j = JSON.parse(t); }catch(e){}
  if(!j){
    const m = t.match(/\{[\s\S]*\}/);          // 앞뒤 설명이 붙은 경우
    if(m){ try{ j = JSON.parse(m[0]); }catch(e){} }
  }
  if(j && typeof j === 'object'){
    const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
    return {
      요약: String(j['요약'] || j.summary || '').trim(),
      결정사항: arr(j['결정사항'] || j.decisions).map(x => String(x)),
      할일: arr(j['할일'] || j.todos).map(x => (typeof x === 'object' && x)
        ? { 내용:String(x['내용'] || x.title || ''), 담당:String(x['담당'] || ''), 기한:String(x['기한'] || '') }
        : { 내용:String(x), 담당:'', 기한:'' }),
      다음회의: String(j['다음회의'] || '').trim(),
      확인필요: arr(j['확인필요'] || j.checks).map(x => String(x))
    };
  }
  // JSON 이 아니면 글 그대로 요약 칸에 담습니다 (버리지 않습니다)
  return { 요약: t, 결정사항: [], 할일: [], 다음회의: '', 확인필요: [] };
}

function savePaste(){
  const m = (data.meetings || []).find(x => x.id === pasteBox.id);
  if(!m){ closePaste(); return; }
  const got = readAiAnswer(pasteBox.text);
  if(!got || (!got.요약 && !got.결정사항.length && !got.할일.length)){
    pasteBox.err = '읽을 내용이 없습니다. AI 가 준 답을 그대로 붙여넣어 주세요.';
    render(); return;
  }
  m.ai = Object.assign(got, { 잘림:false, 만든때: new Date().toISOString(), 손으로:true });
  m.updatedAt = new Date().toISOString();
  markDirty();
  pasteBox.open = false;
  render();
  toast('✅ 붙여넣은 내용으로 정리했습니다');
}

function pastePanel(){
  if(!pasteBox.open) return '';
  const m = (data.meetings || []).find(x => x.id === pasteBox.id);
  return '<div class="modal-bg open" onclick="if(event.target===this)closePaste()">'
    + '<div class="modal" style="max-width:760px">'
    + '<h3>📥 AI 가 준 답 붙여넣기</h3>'
    + '<div class="fmeta" style="margin-bottom:8px">'
      + esc(m ? (m.title || '회의') : '') + ' · 받은 답을 <b>그대로</b> 붙여넣으세요. '
      + '앞뒤에 다른 말이 있어도 알아서 골라냅니다.</div>'
    + (pasteBox.err ? '<div class="ainote" style="border-color:var(--red)">' + esc(pasteBox.err) + '</div>' : '')
    + '<textarea id="pasteArea" style="min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px" '
      + 'placeholder=\'{ "요약": "…", "결정사항": ["…"], "할일": [{"내용":"…"}] }\' '
      + 'oninput="onPasteInput(this.value)"></textarea>'
    + '<div class="modal-actions">'
      + '<button class="btn" onclick="closePaste()">취소</button>'
      + '<button class="btn primary" onclick="savePaste()">이 내용으로 정리하기</button>'
    + '</div></div></div>';
}

/* AI 가 뽑아준 할 일을 「할 일」 탭으로 옮깁니다 */
function aiTodoToTask(mid, i){
  const m = (data.meetings || []).find(x => x.id === mid);
  const t = m && m.ai && m.ai.할일 && m.ai.할일[i];
  if(!t) return;
  // 회의에 브랜드가 적혀 있으면 그 브랜드의 할 일로, 없으면 첫 브랜드로
  const b = data.brands.find(x => x.name === m.brand) || data.brands[0];
  if(!b){ toast('⚠️ 브랜드가 없습니다'); return; }
  b.tasks.unshift({
    id: uid('i'), title: String(t['내용'] || '').slice(0, 120),
    status: '할일', due: /^\d{4}-\d{2}-\d{2}$/.test(String(t['기한'] || '')) ? t['기한'] : '',
    desc: '회의에서 나온 할 일 · ' + (m.title || '') + (t['담당'] ? ' · 담당 ' + t['담당'] : ''),
    updatedAt: new Date().toISOString()
  });
  m.ai.할일[i]._옮김 = true;
  markDirty(b.id);
  render();
  toast('✅ ' + b.name + ' 할 일로 옮겼습니다');
}

          + '똑같이 쓰실 수 있습니다 (돈 안 듭니다)</span>'
        : '<button class="btn" onclick="aiSetKey()">🔑 AI 키 바꾸기</button>'
          + '<button class="btn sm" onclick="aiSetLocal()" '
            + 'title="NAS 나 사무실 PC 에 올린 AI 를 씁니다">🖥 우리 것</button>'
          + '<span class="chip on">🤖 ' + esc(((aiState.info || {})['어느 AI']) || 'AI') + '</span>'
          + (aiState.netFail
              ? '<button class="btn" onclick="openNetCheck()">🩺 AI 점검</button>' : '')
          + '<span class="hint">회의 내용을 적고 [AI로 정리] 를 누르면 '
          + '요약·결정사항·할 일로 나눠줍니다</span>')
    + '</div>';

  if(!list.length) return keyBar + '<div class="empty">' + TYPES.meetings.empty + '<br>'
    + '<span style="color:var(--text-muted)">들은 대로 편하게 적어두면 됩니다. '
    + '정리는 AI가 합니다.</span></div>';

  const sorted = list.slice().sort((x, y) =>
    String(y.date || y.updatedAt || '').localeCompare(String(x.date || x.updatedAt || '')));

  const cards = sorted.map(m => {
    const ai = m.ai;
    const busy = aiState.busy === m.id;
    return '<div class="mtbox">'
      + '<div class="mt-head">'
        + '<span class="mt-title"' + itemEdAttr('', 'meetings', m.id, 'title', 0, '회의 제목')
          + '>' + esc(m.title || '(제목 없음)') + '</span>'
        + (m.date ? '<span class="chip">' + esc(fmtYMD(m.date)) + '</span>' : '')
        + (m.brand ? '<span class="chip on">' + esc(m.brand) + '</span>' : '')
        + (m.attendees ? '<span class="fmeta">👥 ' + esc(m.attendees) + '</span>' : '')
        + '<span class="mt-act">'
          + '<button class="btn sm" onclick="openItemModal(\'meetings\',\'' + jsq(m.id) + '\')">수정</button>'
          + '<button class="btn sm danger" onclick="deleteItem(\'meetings\',\'' + jsq(m.id) + '\')">삭제</button>'
        + '</span></div>'

      + (ai ? aiPanel(m, ai) : '')

      + '<details class="mt-raw"' + (ai ? '' : ' open') + '>'
        + '<summary>회의 내용 원문' + (ai ? ' (접힘)' : '') + '</summary>'
        /* 회의 내용은 들은 대로 적어 둔 글입니다 — 한 줄 고치려고
           모달을 열면 긴 글을 통째로 다시 마주하게 됩니다 */
        + '<div class="mt-body"' + itemEdAttr('', 'meetings', m.id, 'body', 1,
            '들은 대로 편하게') + '>' + esc(m.body || '(비어 있음)') + '</div>'
      + '</details>'

      // AI 를 아직 안 붙였으면 「공짜로 되는 길」 을 대표 단추로 내놓습니다.
      // (키가 없는데 [✨ AI로 정리] 를 먼저 누르게 두면 헛걸음만 합니다)
      + '<div class="mt-foot">'
        + (aiState.ready === false
            ? '<button class="btn primary" onclick="askViaChat(\'' + jsq(m.id) + '\')" '
                + 'title="문장을 복사하고 클로드 창을 엽니다. 키도 크레딧도 필요 없습니다 '
                  + '(쓰고 계신 구독으로 처리됩니다)">'
                + '🆓 클로드로 정리하기</button>'
            : '<button class="btn' + (ai ? '' : ' primary') + '" ' + (busy ? 'disabled' : '')
                + ' onclick="aiSummarize(\'' + jsq(m.id) + '\')">'
                + (busy
                    ? ('⏳ 정리하는 중… ' + (aiState.wait != null
                        ? '(' + aiState.wait + '초 지남 · 마누스는 1~3분 걸립니다)' : '(10~30초)'))
                    : (ai ? '↻ 다시 정리' : '✨ AI로 정리')) + '</button>'
              + '<button class="btn sm" onclick="askViaChat(\'' + jsq(m.id) + '\')" '
                + 'title="문장을 복사하고 클로드 창을 엽니다. 키도 크레딧도 필요 없습니다">'
                + '🆓 클로드 창에서 하기</button>')
        + '<button class="btn sm" onclick="openPaste(\'' + jsq(m.id) + '\')" '
          + 'title="AI 가 준 답을 붙여넣으면 요약·결정사항·할 일로 나눠 담습니다">'
          + '📥 답 붙여넣기</button>'
        + '<button class="btn sm" onclick="copyMeetAsk(\'' + jsq(m.id) + '\')" '
          + 'title="물어볼 문장만 복사합니다 (창은 열지 않습니다)">'
          + '📋 문장만 복사</button>'
        + (ai && ai.만든때
            ? '<span class="fmeta">' + esc(sinceText(ai.만든때)) + ' 정리함</span>' : '')
      + '</div>'
      + '</div>';
  }).join('');

  return keyBar + cards;
}
