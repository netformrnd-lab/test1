<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>넷폼알앤디 브랜드 허브</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
/* ============================================================
   브랜드 허브 — 화면 디자인
   색·글씨·간격을 여기 한 곳에서 정합니다.
   아래 :root 의 값만 바꾸면 전체 분위기가 함께 바뀝니다.
   ============================================================ */
:root{
  /* 바탕 — 살짝 따뜻한 종이색. 카드는 흰색이라 경계가 은은하게 생깁니다 */
  --bg-primary:#f6f5f3; --bg-secondary:#ffffff; --bg-card:#ffffff;
  --bg-hover:#f1f0ed; --bg-input:#faf9f7; --bg-sunken:#efeeea;
  --border:#e6e4df; --border-light:#d5d2cb;

  /* 글씨 */
  --text-primary:#16181d; --text-secondary:#5a5e66; --text-muted:#9b9ea6;

  /* 강조색 — 링크·선택된 곳에만 씁니다 */
  --blue:#4b5cd6; --blue-soft:rgba(75,92,214,.10);
  --green:#12a150; --yellow:#c07708; --red:#d93b3b;
  --purple:#7c5cd6; --cyan:#0e8fa8; --orange:#dd6b13;

  /* 진한 단추 색 (주요 동작) */
  --ink:#1b1d22; --ink-hover:#2c2f36;

  --shadow-sm:0 1px 2px rgba(20,21,26,.05);
  --shadow-md:0 1px 2px rgba(20,21,26,.04),0 8px 20px -8px rgba(20,21,26,.14);
  --shadow-lg:0 16px 40px -12px rgba(20,21,26,.24),0 2px 6px rgba(20,21,26,.06);
  --ring:0 0 0 3px rgba(75,92,214,.22);

  --r-xs:7px; --r-sm:9px; --r:11px; --r-md:14px; --r-lg:18px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body.dark-mode{
  --bg-primary:#0b0c0e; --bg-secondary:#141518; --bg-card:#141518;
  --bg-hover:#1e2024; --bg-input:#0f1013; --bg-sunken:#0f1013;
  --border:#26282d; --border-light:#3b3e45;
  --text-primary:#eceef1; --text-secondary:#a6aab2; --text-muted:#6d717a;
  --blue:#8a97fb; --blue-soft:rgba(138,151,251,.14);
  --green:#3ecf7d; --yellow:#e0a33c; --red:#f06767;
  --ink:#eceef1; --ink-hover:#ffffff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 4px rgba(0,0,0,.4),0 10px 24px -10px rgba(0,0,0,.7);
  --shadow-lg:0 20px 48px -14px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(138,151,251,.26);
}
body.dark-mode .btn.primary{color:#0b0c0e}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,
    'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg-primary);color:var(--text-primary);min-height:100vh;
  line-height:1.62;letter-spacing:-.011em;font-size:14px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* 숫자는 자리가 흔들리지 않게 */
.stat .val,.hcard .nums .n b,.bar-row .bv,.recent .rb,.verbadge,.path,
table.itable td,.tl-date{font-variant-numeric:tabular-nums}

/* 스크롤 막대를 얇고 조용하게 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:99px;
  border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-muted);background-clip:padding-box;
  border:3px solid transparent}
*::-webkit-scrollbar-track{background:transparent}

/* 키보드로 이동할 때만 테두리를 보여줍니다 */
button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:14px;
  align-items:center;padding:13px 24px;
  background:var(--bg-secondary);
  background:color-mix(in srgb,var(--bg-secondary) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border)}
.topbar h1{font-size:17px;font-weight:750;letter-spacing:-.028em;white-space:nowrap;
  display:flex;align-items:center;gap:8px}
.topbar .sub{font-size:11.5px;color:var(--text-muted);font-weight:500;
  letter-spacing:-.005em;margin-top:1px}
.spacer{flex:1}
.searchbox{position:relative;min-width:220px;flex:0 1 340px}
.searchbox input{width:100%;padding:9px 13px 9px 34px;font-size:13px;
  border-radius:var(--r);border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-primary);font-family:inherit;transition:.16s var(--ease)}
.searchbox input::placeholder{color:var(--text-muted)}
.searchbox input:focus{outline:none;border-color:var(--border-light);
  background:var(--bg-secondary);box-shadow:var(--ring)}
.searchbox .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--text-muted);pointer-events:none}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.astat{font-size:12px;color:var(--text-muted)}
.ainote{padding:11px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.6;
  background:rgba(192,119,8,.10);border:1px solid rgba(192,119,8,.22);
  color:var(--text-primary)}
.savestate{font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap}
.savestate.ok{color:var(--green)}
.savestate.err{color:var(--red)}
.store-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg-secondary);white-space:nowrap;color:var(--text-secondary)}
.store-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 3px rgba(192,119,8,.16)}
.store-badge.nas .dot{background:var(--green);box-shadow:0 0 0 3px rgba(18,161,80,.16)}
.store-badge.error .dot{background:var(--red);box-shadow:0 0 0 3px rgba(217,59,59,.18)}

/* ---------- 단추 ---------- */
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;
  border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-primary);cursor:pointer;transition:.16s var(--ease);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  letter-spacing:-.01em;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-light)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--ink-hover);border-color:var(--ink-hover)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:rgba(217,59,59,.09);border-color:rgba(217,59,59,.35)}
.btn.sm{padding:3.5px 9px;font-size:11.5px;border-radius:var(--r-xs);box-shadow:none}

/* ---------- 레이아웃 ---------- */
.layout{display:grid;grid-template-columns:242px 1fr;gap:26px;
  max-width:1520px;margin:0 auto;padding:24px}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:16px;padding:16px}}

/* ---------- 왼쪽 목록 ---------- */
.side{align-self:start;position:sticky;top:84px}
@media(max-width:900px){.side{position:static}}
.side-title{font-size:10.5px;font-weight:700;color:var(--text-muted);
  letter-spacing:.09em;text-transform:uppercase;margin:0 0 9px 11px}
.brand-list{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
@media(max-width:900px){.brand-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.brand-item{display:flex;align-items:center;gap:10px;padding:8px 11px;
  border-radius:var(--r);cursor:pointer;transition:.14s var(--ease);
  border:1px solid transparent;background:transparent;font-family:inherit;
  font-size:13.5px;font-weight:600;color:var(--text-secondary);
  text-align:left;width:100%;white-space:nowrap;letter-spacing:-.012em}
.brand-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.brand-item.on{background:var(--bg-card);border-color:var(--border);
  color:var(--text-primary);box-shadow:var(--shadow-sm);font-weight:700}
.brand-item .bar{width:3px;height:16px;border-radius:99px;flex-shrink:0;
  opacity:.45;transition:.14s var(--ease)}
.brand-item.on .bar{opacity:1;height:19px}
.brand-item .em{font-size:15px;line-height:1}
.brand-item .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-muted);
  font-variant-numeric:tabular-nums}
.bwrap{position:relative}
.bmove{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px;
  background:var(--bg-card);border-radius:var(--r-xs);padding:2px;box-shadow:var(--shadow-sm)}
.bwrap:hover .bmove{display:flex}
.bmove .btn{padding:1px 6px;font-size:11px;box-shadow:none}
@media(max-width:900px){.bmove{display:none!important}}

/* ---------- 본문 판 ---------- */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden}
.bhead{padding:24px 26px 20px;display:flex;align-items:flex-start;gap:15px;flex-wrap:wrap}
.bhead .icon{width:46px;height:46px;border-radius:var(--r-md);display:grid;place-items:center;
  font-size:23px;background:var(--bg-hover);border:1px solid var(--border);flex-shrink:0}
.bhead h2{font-size:21px;font-weight:750;letter-spacing:-.032em;line-height:1.3}
.bhead .meta{font-size:13px;color:var(--text-secondary);margin-top:3px}
.bhead .ba{margin-left:auto;display:flex;gap:6px}

.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);
  overflow-x:auto;background:transparent}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:10px 13px 12px;font-family:inherit;font-size:13px;font-weight:600;
  background:none;border:none;color:var(--text-muted);cursor:pointer;white-space:nowrap;
  transition:.16s var(--ease);position:relative;letter-spacing:-.012em;border-radius:var(--r-sm)}
.tab::after{content:'';position:absolute;left:11px;right:11px;bottom:-1px;height:2px;
  border-radius:2px 2px 0 0;background:transparent;transition:.16s var(--ease)}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--text-primary);font-weight:700}
.tab.on::after{background:var(--text-primary)}
.tab .n{font-size:10.5px;font-weight:600;opacity:.6;margin-left:4px;
  font-variant-numeric:tabular-nums}
.tabbody{padding:22px 26px 30px}

.sec-bar{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.sec-bar .hint{font-size:12.5px;color:var(--text-muted);letter-spacing:-.005em}

/* ---------- 카드 목록 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  background:var(--bg-secondary);transition:.18s var(--ease);position:relative}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border-light)}
.card .ct{font-size:14px;font-weight:700;margin-bottom:3px;padding-right:70px;
  letter-spacing:-.018em}
.card .cd{font-size:12.5px;color:var(--text-secondary);white-space:pre-wrap;
  word-break:break-word;margin-top:6px;line-height:1.65}
.card .ca{position:absolute;top:11px;right:11px;display:flex;gap:3px;opacity:0;
  transition:.16s var(--ease)}
.card:hover .ca{opacity:1}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.card.done{opacity:.5}
.card.done .ct{text-decoration:line-through}
.card.linkcard{border-left:2px solid var(--blue)}
.card.linkcard .ct{display:block;text-decoration:none;color:inherit}
.card.linkcard .ct:hover{color:var(--blue)}
.card.linkcard .go{color:var(--blue);font-size:12px}
.card.linkcard.haspv{padding-top:13px}

/* 미리보기 — 실제 페이지를 축소해서 보여줍니다 */
.pvwrap{display:block;position:relative;width:100%;height:170px;margin-bottom:12px;
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  background:var(--bg-hover);text-decoration:none}
.pvwrap::after{content:'클릭하면 새 탭에서 열립니다';position:absolute;left:0;right:0;bottom:0;
  padding:6px 10px;font-size:11px;font-weight:600;color:#fff;
  background:linear-gradient(transparent,rgba(12,13,15,.82));
  opacity:0;transition:.18s var(--ease)}
.pvwrap:hover::after{opacity:1}
.pv{width:1280px;height:800px;border:0;transform:scale(.29);transform-origin:0 0;
  pointer-events:none;background:#fff}
.pvmask{position:absolute;inset:0}   /* 미리보기 위를 덮어 클릭이 카드로 가게 합니다 */

/* ---------- 작은 표시(칩) ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2.5px 9px;border-radius:999px;background:var(--bg-hover);
  color:var(--text-secondary);border:1px solid transparent;letter-spacing:-.005em;
  line-height:1.5}
.chip.on{background:rgba(18,161,80,.11);color:#0f8a45;border-color:rgba(18,161,80,.22)}
.chip.test{background:rgba(192,119,8,.11);color:#a9690a;border-color:rgba(192,119,8,.24)}
.chip.off{background:rgba(217,59,59,.10);color:#c33636;border-color:rgba(217,59,59,.22)}
body.dark-mode .chip.on{color:#4ade80}
body.dark-mode .chip.test{color:#e5b45b}
body.dark-mode .chip.off{color:#f79191}
.lnk{font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;
  word-break:break-all;text-underline-offset:2px}
.lnk:hover{text-decoration:underline}
.path{font-size:11px;color:var(--text-muted);
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;
  word-break:break-all;letter-spacing:-.01em}

/* ---------- 히스토리 ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:1px;
  background:var(--border)}
.tl-item{position:relative;padding:0 0 22px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-22px;top:7px;width:9px;height:9px;
  border-radius:50%;background:var(--blue);border:2.5px solid var(--bg-card);
  box-shadow:0 0 0 1px var(--border)}
.tl-date{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.01em}
.tl-title{font-size:14px;font-weight:700;margin:2px 0 3px;padding-right:70px;
  letter-spacing:-.018em}
.tl-body{font-size:12.5px;color:var(--text-secondary);white-space:pre-wrap;
  word-break:break-word;line-height:1.7}
.jblock{margin-top:9px}
.jlabel{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;
  text-transform:uppercase}
.jtext{font-size:13px;color:var(--text-secondary);white-space:pre-wrap;
  word-break:break-word;margin-top:2px;line-height:1.7}
.tl-item .ca{position:absolute;top:0;right:0;display:flex;gap:3px;opacity:0;
  transition:.16s var(--ease)}
.tl-item:hover .ca{opacity:1}

/* ---------- 마스터프롬프트 ---------- */
.pwrap{display:flex;flex-direction:column;gap:11px}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--text-muted)}
textarea.prompt{width:100%;min-height:400px;padding:18px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:13px;
  line-height:1.75;resize:vertical;transition:.16s var(--ease)}
textarea.prompt:focus{outline:none;border-color:var(--border-light);box-shadow:var(--ring)}

/* ---------- 검색 결과 ---------- */
.sr-group{margin-bottom:24px}
.sr-head{font-size:13px;font-weight:750;margin-bottom:10px;display:flex;
  align-items:center;gap:8px;letter-spacing:-.018em}
.sr-item{padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:6px;cursor:pointer;background:var(--bg-secondary);transition:.14s var(--ease)}
.sr-item:hover{background:var(--bg-hover);border-color:var(--border-light)}
.sr-item .t{font-size:13.5px;font-weight:700;letter-spacing:-.018em}
.sr-item .c{font-size:12px;color:var(--text-secondary);margin-top:3px}
mark{background:rgba(192,119,8,.26);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- 공용 ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--text-muted);font-size:13.5px;
  line-height:1.8;border:1px dashed var(--border);border-radius:var(--r-md);
  background:var(--bg-input)}

/* ---------- 홈 화면 ---------- */
.home-item{margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;margin-bottom:8px}
.stat{border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  background:var(--bg-secondary);transition:.16s var(--ease)}
.stat:hover{border-color:var(--border-light)}
.stat .lab{font-size:11.5px;font-weight:600;color:var(--text-secondary);
  letter-spacing:-.005em}
.stat .val{font-size:27px;font-weight:750;letter-spacing:-.038em;margin-top:5px;
  line-height:1.15}
.stat .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.hcard{border:1px solid var(--border);border-radius:var(--r-md);padding:17px 18px 17px 21px;
  cursor:pointer;background:var(--bg-secondary);transition:.2s var(--ease);
  position:relative;overflow:hidden}
.hcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--bc,var(--blue));opacity:.9}
.hcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);
  border-color:var(--border-light)}
.hcard .top{display:flex;align-items:center;gap:10px}
.hcard .em{font-size:20px;line-height:1}
.hcard .nm{font-size:15px;font-weight:750;letter-spacing:-.024em}
.hcard .ds{font-size:12.5px;color:var(--text-muted);margin-top:6px;min-height:19px;
  line-height:1.6}
.hcard .cnts{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.hcard .nums{display:flex;gap:16px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border)}
.hcard .nums .n{font-size:11px;color:var(--text-muted)}
.hcard .nums .n b{display:block;font-size:18px;font-weight:750;color:var(--text-primary);
  letter-spacing:-.032em;line-height:1.25}
.todo{border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;
  background:var(--bg-secondary)}
.todo .ti{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;
  cursor:pointer;border-radius:var(--r-sm);transition:.13s var(--ease)}
.todo .ti:hover{background:var(--bg-hover);color:var(--text-primary)}
.recent .ri{display:flex;align-items:center;gap:10px;font-size:13px;padding:9px 10px;
  cursor:pointer;border-radius:var(--r-sm);transition:.13s var(--ease);position:relative}
.recent .ri::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:1px;
  background:var(--border)}
.recent .ri:last-child::after{display:none}
.recent .ri:last-child{border-bottom:none}
.recent .ri:hover{background:var(--bg-hover)}
.recent .rb{font-size:11.5px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.hsec{font-size:12.5px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;
  gap:7px;color:var(--text-secondary);letter-spacing:.02em}
.page-h{font-size:19px;font-weight:750;letter-spacing:-.032em;margin-bottom:3px}
.page-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:20px}
.dm{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dm.late{background:var(--red);box-shadow:0 0 0 3px rgba(217,59,59,.16)}
.dm.soon{background:var(--yellow);box-shadow:0 0 0 3px rgba(192,119,8,.16)}
.todo .ti .rb{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-muted);
  white-space:nowrap}
.delta{font-size:11.5px;font-weight:700}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}

/* ---------- 지표 상자 ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}
.mbox{border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  background:var(--bg-secondary)}
.mh{font-size:13px;font-weight:700;margin-bottom:12px;letter-spacing:-.018em;
  display:flex;align-items:center;gap:7px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bar-row .bl{width:86px;flex-shrink:0;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;height:6px;border-radius:99px;background:var(--bg-sunken);overflow:hidden}
.bar-row .bf{display:block;height:100%;border-radius:99px;background:var(--blue);
  transition:width .4s var(--ease)}
.bar-row .bv{width:42px;text-align:right;font-weight:700;flex-shrink:0}
.krow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:7px 0;border-bottom:1px solid var(--border);color:var(--text-secondary)}
.krow:last-child{border-bottom:none}

/* ---------- 문의 표 ---------- */
.table-wrap{border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;
  max-height:62vh;background:var(--bg-secondary)}
table.itable{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.itable th,table.itable td{padding:9px 13px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap;
  max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.itable th{position:sticky;top:0;z-index:1;background:var(--bg-input);
  font-size:11px;font-weight:700;color:var(--text-secondary);
  letter-spacing:.03em;text-transform:uppercase;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
table.itable tr:last-child td{border-bottom:none}
table.itable tr:hover td{background:var(--bg-hover)}

/* ---------- 파일 올리기 ---------- */
.drop{border:1.5px dashed var(--border-light);border-radius:var(--r-md);padding:28px 20px;
  text-align:center;transition:.18s var(--ease);margin-bottom:16px;background:var(--bg-input)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .big{font-size:26px;margin-bottom:7px;opacity:.8}
.drop .t{font-size:14px;font-weight:700;letter-spacing:-.018em}
.drop .s{font-size:12.5px;color:var(--text-muted);margin-top:4px}
.drop .warn{font-size:12.5px;color:var(--text-muted);margin-top:11px}
.upqueue{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.upitem{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 13px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-secondary)}
.upitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upitem .st{margin-left:auto;font-weight:700;white-space:nowrap}
.upitem .st.ok{color:var(--green)} .upitem .st.err{color:var(--red)}
.fileicon{font-size:22px;flex-shrink:0}
.card.filecard .ct{padding-right:0}
.fmeta{font-size:11.5px;color:var(--text-muted);margin-top:3px}

/* ---------- 폴더 탐색기 ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px;
  font-size:12.5px}
.crumb{font-family:inherit;font-size:12.5px;font-weight:600;padding:4px 9px;
  border-radius:var(--r-xs);border:1px solid transparent;background:transparent;
  color:var(--text-secondary);cursor:pointer;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.13s var(--ease)}
.crumb:hover{background:var(--bg-hover);color:var(--text-primary)}
.crumb.on{color:var(--text-primary);cursor:default;font-weight:700}
.crumb.on:hover{background:transparent}
.crumbsep{color:var(--text-muted);font-size:11px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;
  margin-bottom:14px}
.fcard{font-family:inherit;text-align:left;display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary);cursor:pointer;min-width:0;
  transition:.14s var(--ease)}
.fcard:hover{background:var(--bg-hover);border-color:var(--border-light);
  transform:translateY(-1px)}
.fcard .fc-ico{font-size:19px;flex-shrink:0}
.fcard .fc-t{min-width:0;flex:1}
.fcard .fc-nm{display:block;font-size:13px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fc-sub{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}

/* ---------- 접히는 폴더 목록 ---------- */
.flist{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--bg-secondary)}
.frow + .frow{border-top:1px solid var(--border)}
.frow.on{background:var(--bg-input)}
.frow.dragover{background:var(--blue-soft);outline:2px dashed var(--blue);outline-offset:-2px}
.card[draggable="true"]{cursor:grab}
.card[draggable="true"]:active{cursor:grabbing}
.fhead{width:100%;font-family:inherit;text-align:left;display:flex;align-items:center;
  gap:10px;padding:11px 15px;border:0;background:transparent;color:var(--text-primary);
  cursor:pointer;transition:.13s var(--ease)}
.fhead:hover{background:var(--bg-hover)}
.fhead .fh-ar{color:var(--text-muted);font-size:10px;width:10px;flex-shrink:0;
  transition:.16s var(--ease)}
.fhead .fh-ic{font-size:15px;flex-shrink:0}
.fhead .fh-nm{font-size:13.5px;font-weight:600;min-width:0;letter-spacing:-.014em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .fh-ct{margin-left:auto;font-size:11px;color:var(--text-muted);
  white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.fh-act{display:flex;align-items:center;gap:5px;padding:0 15px 11px 35px;flex-wrap:wrap}

/* ---------- 기록부 문서 ---------- */
.docwrap{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--bg-card);box-shadow:var(--shadow-sm)}
.doc-title{font-size:23px;font-weight:750;margin:4px 0 16px;letter-spacing:-.036em;
  line-height:1.32}
.jtl{position:relative;padding-left:32px}
.jtl:before{content:'';position:absolute;left:11px;top:10px;bottom:10px;width:1px;
  background:var(--border)}
.jsec{position:relative;margin-bottom:8px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--bg-secondary);transition:.16s var(--ease)}
.jsec.on{background:var(--bg-card);border-color:var(--border-light);
  box-shadow:var(--shadow-sm)}
.jdot{position:absolute;left:-32px;top:14px;width:23px;height:23px;border-radius:50%;
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  z-index:1;font-variant-numeric:tabular-nums;transition:.16s var(--ease)}
.jsec.on .jdot{background:var(--text-primary);border-color:var(--text-primary);
  color:var(--bg-card)}
.jhead{width:100%;font-family:inherit;text-align:left;display:block;padding:14px 17px;
  border:0;background:transparent;cursor:pointer;border-radius:var(--r-md);
  transition:.13s var(--ease)}
.jhead:hover{background:var(--bg-hover)}
.jh-top{display:flex;align-items:baseline;gap:10px}
.jh-title{font-size:15px;font-weight:750;color:var(--text-primary);letter-spacing:-.026em}
.jh-ar{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-muted);
  white-space:nowrap;flex-shrink:0}
.jh-lead{font-size:13px;line-height:1.7;color:var(--text-secondary);margin-top:7px}
.jh-subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.jh-sub{font-size:11px;font-weight:500;color:var(--text-muted);padding:2.5px 9px;
  border-radius:999px;border:1px solid var(--border);background:var(--bg-input)}

/* ---------- 자동화 도구 ---------- */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));
  gap:10px;margin-bottom:14px}
.toolcard{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;
  background:var(--bg-secondary);transition:.16s var(--ease)}
.toolcard.on{border-color:var(--text-primary);background:var(--bg-card);
  box-shadow:var(--shadow-sm)}
.tc-head{display:flex;align-items:center;gap:10px;min-width:0}
.tc-ic{font-size:18px;flex-shrink:0}
.tc-nm{font-size:13.5px;font-weight:700;color:var(--text-primary);min-width:0;
  letter-spacing:-.016em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-meta{margin-left:auto;font-size:11px;color:var(--text-muted);white-space:nowrap}
.toolrun{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  margin-bottom:16px;background:var(--bg-card);box-shadow:var(--shadow-sm)}
.tr-bar{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13px;
  font-weight:700;border-bottom:1px solid var(--border);background:var(--bg-input);
  letter-spacing:-.016em}
.tr-frame{width:100%;height:78vh;border:0;display:block;background:#fff}

/* ---------- 사진 미리보기 ---------- */
.picsec{margin-bottom:14px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px}
.pic{padding:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  background:var(--bg-secondary);cursor:zoom-in;display:flex;flex-direction:column;
  font-family:inherit;transition:.16s var(--ease)}
.pic:hover{border-color:var(--border-light);box-shadow:var(--shadow-md);
  transform:translateY(-2px)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg-hover)}
.pic .pic-nm{font-size:10.5px;color:var(--text-muted);padding:6px 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.picbox{position:fixed;inset:0;z-index:200;background:rgba(8,9,11,.92);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center}
.pb-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:14px 18px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;
  font-size:13px}
.pb-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:45vw}
.pb-ct{font-size:11.5px;opacity:.7;white-space:nowrap}
.pb-img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:var(--r-sm);
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;
  border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;
  line-height:1;cursor:pointer;font-family:inherit;transition:.15s var(--ease);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pb-nav:hover{background:rgba(255,255,255,.26)}
.pb-prev{left:20px} .pb-next{right:20px}

/* ---------- 파일 정리 ---------- */
.tidylist{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--bg-secondary)}
.tidyrow{display:flex;align-items:flex-start;gap:13px;padding:12px 15px;
  transition:.14s var(--ease)}
.tidyrow + .tidyrow{border-top:1px solid var(--border)}
.tidyrow.busy{opacity:.4}
.tidy-th{width:88px;height:66px;object-fit:cover;border-radius:var(--r-sm);flex-shrink:0;
  background:var(--bg-hover);border:1px solid var(--border)}
.tidy-ic{display:flex;align-items:center;justify-content:center;font-size:26px}
.tidy-mid{flex:1;min-width:0}
.tidy-nm{font-size:13.5px;font-weight:600;color:var(--text-primary);
  word-break:break-all;line-height:1.45;letter-spacing:-.014em}

/* ---------- 문서 내용 ---------- */
.doc-snip{font-size:12.5px;line-height:1.75;color:var(--text-secondary);
  padding:9px 12px;border-radius:var(--r-sm);background:var(--bg-input);
  border-left:2px solid var(--blue);word-break:break-all}
.doc-toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;padding:13px 15px;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-input)}
.doc-tocb{font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;
  border-radius:999px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);cursor:pointer;transition:.13s var(--ease)}
.doc-tocb:hover{background:var(--bg-hover);color:var(--text-primary);
  border-color:var(--border-light)}
.doc-sec{border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:9px;
  background:var(--bg-secondary);overflow:hidden}
.doc-h2{width:100%;font-family:inherit;text-align:left;display:flex;align-items:center;
  gap:10px;padding:14px 17px;border:0;background:transparent;color:var(--text-primary);
  font-size:15px;font-weight:750;cursor:pointer;letter-spacing:-.026em;
  transition:.13s var(--ease)}
.doc-h2:hover{background:var(--bg-hover)}
.doc-h2 .doc-ar{color:var(--text-muted);font-size:10px;width:10px;flex-shrink:0}
.doc-h2 .doc-cnt{margin-left:auto;font-size:11px;font-weight:500;color:var(--text-muted)}
.doc-body{padding:4px 22px 20px;border-top:1px solid var(--border)}
.doc-body p,.doc-body .doc-p{font-size:14px;line-height:1.88;color:var(--text-secondary);
  margin:0 0 14px}
.doc-body .doc-h3{font-size:14px;font-weight:750;color:var(--text-primary);
  margin:24px 0 10px;padding-left:11px;border-left:2px solid var(--blue);
  letter-spacing:-.02em}
.doc-body ul,.doc-body ol{margin:0 0 14px;padding-left:20px}
.doc-body li{font-size:14px;line-height:1.85;color:var(--text-secondary);margin-bottom:6px}
.doc-body strong,.doc-body b{color:var(--text-primary);font-weight:700}
.doc-body blockquote{margin:0 0 15px;padding:12px 17px;
  border-left:2px solid var(--border-light);background:var(--bg-input);
  border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;line-height:1.85;
  color:var(--text-secondary)}
.doc-body hr{border:0;border-top:1px solid var(--border);margin:22px 0}
.doc-body code{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:12.5px;
  background:var(--bg-hover);padding:1.5px 5px;border-radius:5px}
.doc-body pre{background:var(--bg-input);border:1px solid var(--border);padding:13px 15px;
  border-radius:var(--r);overflow-x:auto;font-size:12.5px;line-height:1.7;margin:0 0 14px}
.doc-body img{max-width:100%;border-radius:var(--r);margin:6px 0 15px}
.doc-tw{overflow-x:auto;margin:0 0 15px}
.doc-body table{border-collapse:collapse;width:100%;font-size:13px}
.doc-body th,.doc-body td{border:1px solid var(--border);padding:9px 12px;
  text-align:left;color:var(--text-secondary);vertical-align:top}
.doc-body th{background:var(--bg-input);color:var(--text-primary);font-weight:700}

/* ---------- 오류 띠 ---------- */
.errbar{display:none;gap:13px;align-items:flex-start;margin:0 24px;padding:15px 18px;
  border-radius:var(--r-md);border:1px solid rgba(217,59,59,.4);background:rgba(217,59,59,.07)}
.errbar.show{display:flex}
.errbar .etitle{font-weight:750;font-size:14px;margin-bottom:5px;letter-spacing:-.02em}
.errbar .emsg{font-size:12.5px;line-height:1.6;word-break:break-all;
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;color:var(--text-secondary)}

/* ---------- 창(모달) ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(16,17,20,.45);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:100;padding:20px;overflow-y:auto}
.modal-bg.open{display:grid}
.modal{background:var(--bg-card);border-radius:var(--r-lg);padding:26px;width:100%;
  max-width:480px;box-shadow:var(--shadow-lg);border:1px solid var(--border);margin:auto}
.modal h3{font-size:17px;font-weight:750;margin-bottom:16px;letter-spacing:-.026em}
.modal label{display:block;font-size:11.5px;font-weight:700;color:var(--text-secondary);
  margin:14px 0 6px;letter-spacing:-.005em}
.modal input,.modal select,.modal textarea{width:100%;font-family:inherit;font-size:13px;
  padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary);transition:.15s var(--ease)}
.modal textarea{min-height:96px;resize:vertical;line-height:1.65}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;
  border-color:var(--border-light);box-shadow:var(--ring)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}

/* ---------- 판 번호 · 새 글 표시 ---------- */
.verbadge{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:10.5px;
  font-weight:600;letter-spacing:0;padding:4px 9px;border-radius:var(--r-xs);
  white-space:nowrap;border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-muted);cursor:pointer;transition:.14s var(--ease)}
.verbadge:hover{color:var(--text-secondary);border-color:var(--border-light)}
.vernew{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;
  padding:3px 4px 3px 11px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--border);background:var(--blue-soft);color:var(--blue)}
.vernew button{font-family:inherit;font-size:11px;font-weight:700;padding:3.5px 11px;
  border:0;border-radius:999px;background:var(--blue);color:#fff;cursor:pointer;
  transition:.14s var(--ease)}
.vernew button:disabled{opacity:.55;cursor:default}
.chip.new{background:rgba(217,59,59,.10);border-color:rgba(217,59,59,.3);color:var(--red)}
.cnt.newdot{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;
  border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  margin-left:auto}
.newtag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;
  padding:1.5px 5px;border-radius:4px;background:var(--red);color:#fff;vertical-align:1.5px}

/* ---------- 알림 ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:none;
  background:var(--text-primary);color:var(--bg-card);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;
  letter-spacing:-.012em}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🎨 브랜드 허브</h1>
    <div class="sub" id="subtitle">넷폼알앤디</div>
  </div>
  <div class="searchbox">
    <span class="ico">🔍</span>
    <input type="text" id="search" placeholder="모든 브랜드에서 검색 (자동화·히스토리·자료)"
           oninput="onSearch(this.value)">
  </div>
  <span class="spacer"></span>
  <div class="actions">
    <span class="verbadge" id="verBadge" title="지금 쓰고 있는 판 번호입니다. 눌러보면 새 판이 있는지 다시 확인합니다."
          onclick="checkVersion(true)">–</span>
    <span class="vernew" id="verNew" style="display:none"></span>
    <span class="savestate" id="saveState">✓ 저장됨</span>
    <span class="store-badge" id="storeBadge"><span class="dot"></span><span id="storeText">확인 중</span></span>
    <button class="btn" title="밝게/어둡게" onclick="toggleDark()">🌙</button>
    <button class="btn" title="파일로 내보내기 (백업)" onclick="exportJSON()">📤</button>
    <button class="btn" title="파일에서 가져오기 (복원)" onclick="document.getElementById('importFile').click()">📥</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
    <button class="btn primary" title="지금 바로 저장 (Ctrl+S) — 평소에는 자동 저장됩니다"
            onclick="saveAll()">💾 저장</button>
  </div>
</div>

   저장 위치 — 자동으로 정해집니다. 손댈 필요 없습니다.
   NAS 주소로 열면 (http://192.168.0.37/...) → NAS 저장 (모두 공유)
   파일을 더블클릭해서 열면 (file:///C:/...)  → 이 브라우저에만 저장
   ========================================================================= */
const STORAGE_MODE_SETTING = 'auto';
const STORAGE_MODE = STORAGE_MODE_SETTING !== 'auto'
  ? STORAGE_MODE_SETTING
  : (location.protocol === 'http:' || location.protocol === 'https:' ? 'nas' : 'local');

const NAS_API = { load: 'load.php', save: 'save.php' };
const APP_VER = 'v20260902-14';   // 화면 오른쪽 위에 표시됩니다
const LS_KEY  = 'netform_brand_hub_v2';
const SCHEMA  = 2;

async function storageLoad(){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.load + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('NAS 응답 오류 (' + res.status + ')');
    const text = await res.text();
    return text.trim() ? JSON.parse(text) : null;
  }
  const raw = localStorage.getItem(LS_KEY);
  return raw ? JSON.parse(raw) : null;
}

async function storageSave(payload){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.save, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) { /* JSON이 아닌 응답 */ }
    if(out === null){
      throw new Error('서버가 예상 밖의 응답을 보냈습니다 (HTTP ' + res.status + ') → '
        + text.slice(0, 300).replace(/\s+/g, ' '));
    }
    if(!res.ok || !out.ok){
      throw new Error('(HTTP ' + res.status + ') ' + (out.error || '알 수 없는 오류'));
    }
    return;
  }
  localStorage.setItem(LS_KEY, JSON.stringify(payload));
}

/* 자동화 개수 — 손으로 적은 것과 올려둔 도구 파일을 합쳐서 셉니다.
   화면마다 다르게 세면 "등록했는데 숫자가 안 올라간다" 가 되므로 여기 하나만 씁니다. */
function autoCount(b){ return b.automations.length + ((b.tools || []).length); }

/* 이 브랜드에 등록된 것 전부 (왼쪽 목록에 보이는 숫자) */
function itemCount(b){
  return ITEM_KEYS.reduce((a, k) => a + b[k].length, 0) + ((b.tools || []).length);
}
const TAB_KEYS  = ['automations','history','assets','tasks','links','channels','inquiries','prompt'];

let data = defaultData();
let currentBrandId = null;
let currentTab = 'automations';
let searchQuery = '';
let editing = null;   // { type, id } — 수정 중인 항목

/* ========================= 유틸 ========================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function brandById(id){ return data.brands.find(b => b.id === id); }
function currentBrand(){ return brandById(currentBrandId); }
function isUrl(s){ return /^https?:\/\//i.test(String(s || '')); }
function statusClass(s){
  return s === '운영중' ? 'on' : s === '테스트중' ? 'test' : s === '중단' ? 'off' : '';
}
function fmtDate(d){
  if(!d) return '';
  const t = new Date(d);
  return isNaN(t) ? String(d)
    : t.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
}
function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const idx = safe.toLowerCase().indexOf(esc(q).toLowerCase());
  if(idx < 0) return safe;
  return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>'
       + safe.slice(idx + q.length);
}

function paintVersion(){

/* ---- 새 판 알림 ---------------------------------------------------------
   NAS 에 있는 brand.html 의 판 번호와 GitHub 에 올라간 판 번호를 비교합니다.
   다르면 오른쪽 위에 [받기] 단추가 뜨고, 누르면 파일을 받아 새로 고칩니다.   */
let verBusy = false;

async function checkVersion(force){
  const box = document.getElementById('verNew');
  if(!box || verBusy || STORAGE_MODE !== 'nas') return;
  verBusy = true;
  if(force) box.style.display = '', box.innerHTML = '확인 중…';
  try{
    const j = await apiJson('save.php?action=version' + (force ? '&force=1' : ''));
    if(j && j.ok && j['새판있음']){
      box.style.display = '';
      box.innerHTML = '새 판 ' + esc(j['최신'])
        + ' <button onclick="pullVersion(this)">받기</button>';
    }else{
      box.style.display = 'none';
      box.innerHTML = '';
      if(force) toast(j && j.ok ? '지금이 최신입니다 (' + j['지금'] + ')' : '확인하지 못했습니다');
    }
  }catch(e){
    box.style.display = 'none';
    if(force) toast('확인하지 못했습니다');
  }finally{ verBusy = false; }
}

async function pullVersion(btn){
  btn.disabled = true;
  btn.textContent = '받는 중…';
  try{
    const j = await apiJson('save.php?action=bootstrap');
    if(!j || !j.ok){
      alert('새 판을 받지 못했습니다.\n\n'
        + JSON.stringify((j && (j['결과'] || j['실패원인'])) || j, null, 1));
      btn.disabled = false; btn.textContent = '받기';
      return;
    }
    // 브라우저가 옛 파일을 기억하고 있을 수 있어 주소에 표시를 붙여 새로 엽니다
    location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  }catch(e){
    alert('새 판을 받지 못했습니다.\n\n' + (e.message || e));
    btn.disabled = false; btn.textContent = '받기';
  }
}

}

            ? '<button class="btn sm" title="아래로" onclick="moveBrand(\'' + b.id + '\',1)">↓</button>' : '')

function inquiryStats(brandName){
  const rows = inquiryCache.byBrand[brandName] || [];
  if(!rows.length) return null;
  const s = inquirySummary(rows);
  const diff = s.lastMonth > 0
    ? Math.round((s.thisMonth - s.lastMonth) / s.lastMonth * 100) : null;
  return { total: rows.length, thisMonth: s.thisMonth, lastMonth: s.lastMonth, diff, latest: s.latest };
}

function renderHome(){
  const bs = data.brands;
  const all = t => bs.reduce((a, b) => a + b[t].length, 0);
  const running = bs.reduce((a, b) =>
    a + b.automations.filter(x => x.status === '운영중').length, 0);
  const autoAll  = bs.reduce((a, b) => a + autoCount(b), 0);
  const toolAll  = bs.reduce((a, b) => a + ((b.tools || []).length), 0);
  const withPrompt = bs.filter(b => (b.masterPrompt || '').trim()).length;
  const files = bs.reduce((a, b) => a + b.assets.filter(x => x.fileId).length, 0);

  const openTasks = bs.reduce((a, b) => a + b.tasks.filter(t => t.status !== '완료').length, 0);
  const iqTotal = bs.reduce((a, b) => a + (inquiryCache.byBrand[b.name] || []).length, 0);
  const iqMonth = bs.reduce((a, b) => { const s = inquiryStats(b.name); return a + (s ? s.thisMonth : 0); }, 0);
  const stats = [
    { lab:'📮 문의', val: iqTotal.toLocaleString('ko-KR'),
      sub: iqTotal ? '건 · 이번 달 ' + iqMonth + '건' : '건 · 시트를 연결하면 표시됩니다' },
    { lab:'🏷️ 브랜드', val: bs.length, sub:'개' },
    { lab:'✅ 남은 할 일', val: openTasks, sub: '전체 ' + all('tasks') + '개 중' },
    { lab:'🤖 자동화', val: autoAll,
      sub: '개 · 운영 중 ' + running + (toolAll ? ' · 도구 ' + toolAll : '') },
    { lab:'📁 자료',   val: all('assets'), sub: '파일 ' + files + '개 · 프롬프트 '
        + withPrompt + '/' + bs.length }
  ].map(x => '<div class="stat"><div class="lab">' + x.lab + '</div>'
    + '<div class="val">' + x.val + '</div><div class="sub">' + x.sub + '</div></div>').join('');

  const cards = bs.map(b =>
    '<div class="hcard" style="--bc:' + b.color + '" '
    + 'onclick="selectBrand(\'' + b.id + '\')">'
    + '<div class="top"><span class="em">' + esc(b.icon) + '</span>'
      + '<span class="nm">' + esc(b.name) + '</span></div>'
    + '<div class="ds">' + esc(b.desc || '설명이 아직 없습니다')
      + (b.owner ? ' · ' + esc(b.owner) : '') + '</div>'
    + (function(){
        const q = inquiryStats(b.name);
        if(!q) return '';
        return '<div class="nums">'
          + '<div class="n"><b>' + q.total.toLocaleString('ko-KR') + '</b>전체 문의</div>'
          + '<div class="n"><b>' + q.thisMonth + '</b>이번 달 '
            + (q.diff === null ? '' : diffTag(q.diff)) + '</div>'
          + (q.latest ? '<div class="n"><b style="font-size:13px">' + esc(q.latest)
              + '</b>최근 문의</div>' : '')
          + '</div>';
      })()
    + '<div class="cnts">'
      + '<span class="chip">🤖 ' + autoCount(b) + '</span>'
      + '<span class="chip">📜 ' + b.history.length + '</span>'
      + '<span class="chip">📁 ' + b.assets.length + '</span>'
      + (b.links.length ? '<span class="chip">🔗 ' + b.links.length + '</span>' : '')
      + (b.tasks.filter(t => t.status !== '완료').length
          ? '<span class="chip test">✅ ' + b.tasks.filter(t => t.status !== '완료').length + '</span>' : '')
      + ((b.masterPrompt || '').trim() ? '<span class="chip on">✨ 작성됨</span>'
                                       : '<span class="chip">✨ 미작성</span>')
      + (function(){ const k = brandNewCount(b);
           return k ? '<span class="chip new">🆕 새 글 ' + k + '</span>' : ''; })()
    + '</div></div>').join('');

  // 기한이 지났거나 임박한 할 일
  const today = new Date().toISOString().slice(0,10);
  const urgent = [];
  bs.forEach(b => b.tasks.forEach(t => {
    if(t.status === '완료' || !t.due) return;
    const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
    if(days <= 3) urgent.push({ b, t, days });
  }));
  urgent.sort((x, y) => x.days - y.days);

  const urgentHtml = urgent.length
    ? '<div class="todo">' + urgent.slice(0, 8).map(u =>
        '<div class="ti" onclick="gotoResult(\'' + u.b.id + '\',\'tasks\')">'
        + '<span class="dm ' + (u.days < 0 ? 'late' : 'soon') + '"></span>'
        + '<strong>' + esc(u.t.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(u.b.name) + '</span>'
        + '<span class="rb">' + (u.days < 0 ? Math.abs(u.days) + '일 지남' : 'D-' + u.days) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 아직 비어 있는 곳을 짚어줍니다
  const todos = [];
  bs.forEach(b => {
    if(!(b.masterPrompt || '').trim())
      todos.push(['✨', b, 'prompt', '마스터프롬프트가 비어 있습니다']);
    if(!b.automations.length)
      todos.push(['🤖', b, 'automations', '등록된 자동화가 없습니다']);
    if(!b.history.length)
      todos.push(['📜', b, 'history', '여정 기록이 없습니다']);
    if(!b.assets.length)
      todos.push(['📁', b, 'assets', '등록된 자료가 없습니다']);
  });

  const todoHtml = todos.length
    ? '<div class="todo">' + todos.slice(0, 12).map(([ic, b, tab, msg]) =>
        '<div class="ti" onclick="gotoResult(\'' + b.id + '\',\'' + tab + '\')">'
        + '<span>' + ic + '</span><strong>' + esc(b.name) + '</strong>'
        + '<span style="color:var(--text-muted)">' + msg + '</span></div>').join('')
      + (todos.length > 12 ? '<div class="ti" style="color:var(--text-muted);cursor:default">'
          + '외 ' + (todos.length - 12) + '건</div>' : '')
      + '</div>'
    : '<div class="todo" style="color:var(--text-muted)">모든 브랜드가 채워져 있습니다 👏</div>';

  // 최근에 손댄 항목
  const recent = [];
  bs.forEach(b => ITEM_KEYS.forEach(t =>
    b[t].forEach(it => {
      const when = it.updatedAt || it.uploadedAt;
      if(when) recent.push({ b, t, it, when });
    })));
  recent.sort((x, y) => String(y.when).localeCompare(String(x.when)));

  const recentHtml = recent.length
    ? '<div class="todo recent">' + recent.slice(0, 8).map(r =>
        '<div class="ri" onclick="gotoResult(\'' + r.b.id + '\',\'' + r.t + '\')">'
        + '<span>' + TYPES[r.t].icon + '</span>'
        + '<strong>' + esc(r.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(r.b.name) + '</span>'
        + '<span class="rb">' + esc(new Date(r.when)
            .toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' })) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 채널에 새로 올라온 글 (NAS 가 미리 받아둔 것)
  const posts = [];
  chState.rows.forEach(r => {
    const brand = bs.find(x => x.name === r['브랜드']);
    const mark  = chSeen()[r.feed];
    (r.items || []).forEach(it => {
      if(!it.link) return;
      posts.push({ r, it, brand, isNew: chNewer(chKey(it), mark) });
    });
  });
  posts.sort((x, y) => String(y.it.iso || '').localeCompare(String(x.it.iso || '')));

  const postHtml = posts.length
    ? '<div class="todo recent">' + posts.slice(0, 8).map(p =>
        '<div class="ri" onclick="window.open(\'' + jsq(p.it.link) + '\',\'_blank\',\'noopener\')">'
        + '<span>' + (CH_ICON[p.r.kind] || '🌐') + '</span>'
        + '<strong>' + (p.isNew ? '<span class="newtag">NEW</span> ' : '') + esc(p.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(p.r['브랜드'] || p.r['이름']) + '</span>'
        + '<span class="rb">' + esc(sinceText(p.it.iso)) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + '<h2 class="page-h">브랜드 현황</h2>'
    + '<div class="page-sub">카드를 누르면 해당 브랜드로 이동합니다</div>'
    + '<div class="stats">' + stats + '</div>'
    + '<div class="hgrid">' + cards + '</div>'
    + (urgentHtml ? '<div class="hsec">⏰ 기한이 임박한 할 일</div>' + urgentHtml : '')
    + (postHtml ? '<div class="hsec">📣 채널에 올라온 글</div>' + postHtml : '')
    + (recentHtml ? '<div class="hsec">🕘 최근 업데이트</div>' + recentHtml : '')
    + '<div class="hsec">📝 아직 비어 있는 곳</div>' + todoHtml
    + '</div></div>';
}

/* ========================= NAS 자료 =========================
   scan.sh 가 만든 파일 목록에서 찾아줍니다.
   파일을 옮기거나 복사하지 않고, 어디에 있는지만 알려줍니다.
   ============================================================ */
const nasState = { q:'', ext:'', loading:false, error:null, res:null, info:null };

async function nasCheck(){
  try{
    const r = await (await fetch('nasfiles.php?action=check', { cache:'no-store' })).json();
    nasState.info = r;
  }catch(e){ nasState.info = null; }
  render();
}

async function nasSearch(){
  const q = document.getElementById('nasQ');
  nasState.q = q ? q.value.trim() : nasState.q;
  const ex = document.getElementById('nasExt');
  nasState.ext = ex ? ex.value : '';
  if(!nasState.q && !nasState.ext){ toast('⚠️ 찾을 이름을 입력해 주세요'); return; }
  nasState.mode = 'search';

  nasState.loading = true; nasState.error = null; render();
  try{
    const url = 'nasfiles.php?action=search&q=' + encodeURIComponent(nasState.q)
              + (nasState.ext ? '&ext=' + encodeURIComponent(nasState.ext) : '');
    const res = await fetch(url, { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '찾지 못했습니다');
    nasState.res = out;
  }catch(e){ nasState.error = e.message; nasState.res = null; }
  finally{ nasState.loading = false; render();
    const el = document.getElementById('nasQ'); if(el){ el.focus(); el.value = nasState.q; } }
}

/* NAS 경로를 탐색기에서 쓸 수 있는 형태로 바꿉니다
   /volume1/넷폼알앤디 공유폴더/a/b.pdf  →  \\netformrnd\넷폼알앤디 공유폴더\a\b.pdf */
function toWinPath(p){
  return '\\\\netformrnd\\' + String(p).replace(/^\/volume\d+\//, '').replace(/\//g, '\\');
}

async function copyNasPath(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.path);
  try{
    await navigator.clipboard.writeText(win);
    toast('📋 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

function linkNasDir(i){
  const f = nasState.res.results[i];
  if(!data.brands.length){ toast('⚠️ 브랜드가 없습니다'); return; }
  const names = data.brands.map((b, n) => (n + 1) + '. ' + b.name).join('\n');
  const pick = prompt('이 폴더를 어느 브랜드에 연결할까요?\n\n' + names
    + '\n\n폴더: ' + f.dir + '\n\n번호를 입력하세요', '1');
  if(pick === null) return;
  const idx = parseInt(pick, 10) - 1;
  const b = data.brands[idx];
  if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }

  b.nasFolders = b.nasFolders || [];
  if(b.nasFolders.some(x => x.path === f.dir)){ toast('이미 연결된 폴더입니다'); return; }
  b.nasFolders.push({ id: uid('nf'), path: f.dir, label: f.dir.split('/').pop(), q: '' });
  markDirty();
  toast('📂 "' + b.name + '" 자료에 연결했습니다');
}

async function copyNasDir(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.dir);
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

/* ========================= 폴더 탐색기 =========================
   scan.sh 가 만든 목록을 가지고, 탐색기처럼 폴더를 타고 들어갑니다.
   파일은 옮기지 않고 있는 자리에서 바로 내려받습니다.
   ============================================================== */
/* 서버에 물어보고 JSON 을 받아옵니다.
   PHP 파일이 아직 없으면 HTML(404 화면)이 오는데, 그걸 알아보고 안내합니다. */
async function apiJson(url, opts){
  const res  = await fetch(url, Object.assign({ cache:'no-store' }, opts || {}));
  const text = await res.text();
  let out = null;
  try{ out = JSON.parse(text); }catch(e){}
  if(out === null){
    const file = String(url).split('?')[0];
    const head = text.replace(/\s+/g, ' ').trim().slice(0, 300);
    if(res.status === 404){
      throw new Error('NAS에 ' + file + ' 이(가) 아직 없습니다.\n\n'
        + '아래 주소를 브라우저 주소창에 한 번 넣어 주세요. (파일을 자동으로 받아옵니다)\n\n'
        + location.href.split('?')[0].replace(/[^/]*$/, 'save.php?action=bootstrap'));
    }
    throw new Error(file + ' 이(가) 이상한 응답을 보냈습니다. (HTTP ' + res.status + ')\n\n'
      + '받은 내용 앞부분:\n' + head);
  }
  if(!out.ok) throw out;
  return out;
}

function apiErrText(e){
  return (e && e.error) || (e && e.message) || '알 수 없는 오류';
}

const browseCache = {};   // 폴더경로 → {loading} | {error} | 서버응답
const fileShow    = {};   // 화면키 → 지금 보여주는 파일 수
const picShow     = {};   // 화면키 → 지금 보여주는 사진 수
const fileOpen    = {};   // 화면키 → 파일 목록을 펼쳤는지
const openFolder  = {};   // 브랜드id → 펼쳐 놓은 폴더 경로 (한 번에 하나만)
const folderNav   = {};   // 화면키 → 지금 보고 있는 폴더

/* 작은따옴표 onclick 안에 안전하게 넣기 위한 처리 */
function jsq(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
                  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function redraw(){ render(); bindDrop(); }

async function loadBrowse(dir){
  browseCache[dir] = { loading:true };
  try{
    const out = await apiJson('nasfiles.php?action=browse&dir=' + encodeURIComponent(dir || ''));
    browseCache[dir] = out;
    if(out.dir && out.dir !== dir) browseCache[out.dir] = out;
  }catch(e){
    browseCache[dir] = { error: apiErrText(e) };
  }
  redraw();
}

function toggleFiles(navKey){
  const cur = browseCache[folderNav[navKey] !== undefined ? folderNav[navKey] : ''];
  const def = cur && cur.folders ? !cur.folders.length : false;
  fileOpen[navKey] = (fileOpen[navKey] !== undefined) ? !fileOpen[navKey] : !def;
  redraw();
}

async function morePics(navKey){
  picShow[navKey] = (picShow[navKey] || 40) + 60;
  await ensureFiles(navKey, picShow[navKey] + 20);
  redraw();
}

/* 화면에 필요한 만큼 파일을 더 받아옵니다 (사진 수만 장짜리 폴더 대비) */
async function ensureFiles(navKey, need){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : '';
  const c = browseCache[dir];
  if(!c || !c.files) return;
  if(c.files.length >= c.fileCount) return;      // 이미 다 받았습니다
  if(c.files.length >= need) return;             // 아직 더 받을 필요 없습니다
  if(c.loadingMore) return;
  c.loadingMore = true;
  try{
    const out = await apiJson('nasfiles.php?action=browse&off=' + c.files.length
      + '&lim=500&dir=' + encodeURIComponent(c.dir));
    c.files = c.files.concat(out.files || []);
  }catch(e){ /* 다음에 다시 시도합니다 */ }
  c.loadingMore = false;
}

/* ================= 브랜드 채널 =================
   블로그·카페·유튜브 주소를 모아두고, 최근 올린 글을 함께 보여줍니다.
   가져오는 일은 NAS 가 대신합니다 (사무실 브라우저는 밖으로 못 나갑니다).
   ============================================== */
const feedCache = {};   // RSS 주소 → {loading} | {error} | 응답

/* NAS 가 미리 받아둔 채널 글 모음입니다.
   feeds.sh 를 작업 스케줄러에 걸어두면 NAS 가 30분마다 돌아보고,
   대시보드는 그걸 그냥 읽기만 해서 열자마자 바로 보입니다. */
const chState = { rows: [], at: null, autoAt: null, age: null, cron: false, loaded: false };

const CH_SEEN_KEY = 'brandHubChSeen';   // 어디까지 봤는지 (이 브라우저에만 저장)

function chSeen(){
  try{ return JSON.parse(localStorage.getItem(CH_SEEN_KEY) || '{}'); }
  catch(e){ return {}; }
}
function chSeenSave(o){
  try{ localStorage.setItem(CH_SEEN_KEY, JSON.stringify(o)); }catch(e){}
}

/* 아직 안 본 글이 몇 개인지 셉니다.
   처음 보는 채널은 지금 것을 '이미 본 것'으로 쳐서, 빨간 표시가 쏟아지지 않게 합니다. */
function chKey(it){ return (it && (it.iso || it.link)) || ''; }

/* 이 글이 '마지막으로 본 것' 보다 새 글인지 봅니다.
   날짜가 있으면 날짜로, 없으면 주소가 달라졌는지로 판단합니다. */
function chNewer(key, mark){
  if(!key || !mark) return false;
  const a = Date.parse(key), b = Date.parse(mark);
  if(!isNaN(a) && !isNaN(b)) return a > b;
  return key !== mark;
}

function chUnseen(feed, items){
  if(!feed || !items || !items.length) return 0;
  const seen = chSeen();
  const mark = seen[feed];
  if(!mark){
    seen[feed] = chKey(items[0]);
    chSeenSave(seen);
    return 0;
  }
  let n = 0;
  for(const it of items){
    if(chNewer(chKey(it), mark)) n++;
    else break;
  }
  return n;
}

function chRowsOf(brandName){
  return chState.rows.filter(r => r['브랜드'] === brandName);
}

function brandNewCount(b){
  return chRowsOf(b.name).reduce((a, r) => a + chUnseen(r.feed, r.items), 0);
}

function markChannelsSeen(b){
  const seen = chSeen();
  let changed = false;
  chRowsOf(b.name).forEach(r => {
    if(!r.items || !r.items.length) return;
    const key = chKey(r.items[0]);
    if(key && seen[r.feed] !== key){ seen[r.feed] = key; changed = true; }
  });
  if(changed){ chSeenSave(seen); setTimeout(render, 0); }
}

const CH_STALE = 30 * 60;   // 30분이 지나면 오래된 것으로 봅니다

/* NAS 가 받아둔 것을 읽어옵니다. 인터넷에 나가지 않아 빠릅니다. */
async function loadChannelSummary(){
  if(STORAGE_MODE !== 'nas') return;
  try{
    const j = await apiJson('channels.php?action=summary');
    if(!j || !j.ok) return;
    chState.rows   = j['채널'] || [];
    chState.at     = j['가장오래된확인'] || null;
    chState.autoAt = j['자동확인'] || null;
    chState.age    = (typeof j['지난초'] === 'number') ? j['지난초'] : null;
    chState.cron   = j['예약작업'] === '등록됨';
    chState.loaded = true;
    // 채널 탭이 기다리지 않도록 미리 채워둡니다
    chState.rows.forEach(r => {
      if(r.feed && r.items && r.items.length && !feedCache[r.feed])
        feedCache[r.feed] = { ok:true, title:r['이름'], items:r.items };
    });
    render();

    // 받아둔 게 오래됐으면 대시보드가 직접 NAS 에게 돌아보라고 시킵니다.
    // 작업 스케줄러를 걸어두지 않아도 대시보드를 켜 두는 동안은 최신이 됩니다.
    if(chState.rows.length && (chState.age === null || chState.age > CH_STALE)) {
      await pokeChannels();
    }
  }catch(e){ /* 조용히 넘어갑니다 — 채널은 곁다리 기능입니다 */ }
}

/* 오래됐을 때만 조용히 새로 받아옵니다.
   maxage 를 함께 보내서, 여러 사람이 열어두어도 NAS 는 한 번만 나갑니다. */
let chPoking = false;
async function pokeChannels(){
  if(chPoking) return;
  chPoking = true;
  try{
    const r = await apiJson('channels.php?action=refreshall&maxage=' + CH_STALE);
    if(r && r.ok && !r['건너뜀']){
      Object.keys(feedCache).forEach(k => delete feedCache[k]);
      const j = await apiJson('channels.php?action=summary');
      if(j && j.ok){
        chState.rows   = j['채널'] || [];
        chState.autoAt = j['자동확인'] || null;
        chState.age    = (typeof j['지난초'] === 'number') ? j['지난초'] : null;
        chState.rows.forEach(x => {
          if(x.feed && x.items && x.items.length)
            feedCache[x.feed] = { ok:true, title:x['이름'], items:x.items };
        });
        render();
      }
    }
  }catch(e){ /* 조용히 */ }
  finally{ chPoking = false; }
}

/* 지금 당장 전부 새로 받아옵니다 (NAS 가 인터넷에 나갔다 옵니다 — 조금 걸립니다) */
async function refreshAllChannels(btn){
  if(btn){ btn.disabled = true; btn.textContent = '받는 중…'; }
  toast('📡 채널을 전부 돌아보는 중입니다…');
  try{
    const j = await apiJson('channels.php?action=refreshall');
    Object.keys(feedCache).forEach(k => delete feedCache[k]);
    await loadChannelSummary();
    if(j['실패']) toast('확인 ' + j['확인한채널'] + '곳 · 실패 ' + j['실패'] + '곳');
    else toast('✅ ' + j['확인한채널'] + '곳을 새로 받았습니다');
  }catch(e){ alert(apiErrText(e)); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = '↻ 전부 새로 받기'; } }
}

const CH_ICON = { '네이버 블로그':'📗', '네이버 카페':'☕', '유튜브':'📺', '인스타그램':'📷',
                  '티스토리':'📘', '브런치':'✍️', '페이스북':'👥', '웹사이트':'🌐' };

async function loadFeed(url){
  feedCache[url] = { loading:true };
  try{
    feedCache[url] = await apiJson('channels.php?action=feed&n=6&url=' + encodeURIComponent(url));
  }catch(e){ feedCache[url] = { error: apiErrText(e) }; }
  render();
}

function refreshFeed(url){
  delete feedCache[url];
  feedCache[url] = { loading:true };
  render();
  apiJson('channels.php?action=feed&n=6&fresh=1&url=' + encodeURIComponent(url))
    .then(o => { feedCache[url] = o; render(); })
    .catch(e => { feedCache[url] = { error: apiErrText(e) }; render(); });
  toast('↻ 새로 받아옵니다');
}

async function addChannel(){
  const b = currentBrand();
  if(!b) return;
  const url = prompt('채널 주소를 넣어주세요.\n\n'
    + '예) https://blog.naver.com/아이디\n'
    + '    https://www.youtube.com/@채널이름\n'
    + '    https://cafe.naver.com/카페주소');
  if(url === null) return;
  if(!url.trim()){ toast('⚠️ 주소를 넣어주세요'); return; }

  b.channels = b.channels || [];
  toast('🔎 채널을 확인하는 중…');
  let info = { kind:'웹사이트', feed:null };
  try{
    info = await apiJson('channels.php?action=probe&url=' + encodeURIComponent(url.trim()));
  }catch(e){
    if(!confirm('채널을 확인하지 못했습니다.\n\n' + apiErrText(e)
      + '\n\n주소만 저장할까요? (최근 글은 안 보입니다)')) return;
  }

  const name = prompt('이 채널을 뭐라고 부를까요?',
    info['채널이름'] || (info.kind || '채널')) || '';
  b.channels.push({ id: uid('ch'), kind: info.kind || '웹사이트', name: name.trim(),
                    url: url.trim(), feed: info.feed || '' });
  markDirty();
  render();
  toast(info.feed ? '✅ 최근 글까지 가져올 수 있는 채널입니다'
                  : '✅ 채널을 넣었습니다 (최근 글은 못 가져옵니다)');
}

function removeChannel(id){
  const b = currentBrand();
  const c = (b.channels || []).find(x => x.id === id);
  if(!c) return;
  if(!confirm('"' + (c.name || c.url) + '" 을 지울까요?')) return;
  b.channels = b.channels.filter(x => x.id !== id);
  markDirty(); render();
}

async function refindFeed(id){
  const b = currentBrand();
  const c = (b.channels || []).find(x => x.id === id);
  if(!c) return;
  toast('🔎 RSS 주소를 다시 찾는 중…');
  try{
    const info = await apiJson('channels.php?action=probe&url=' + encodeURIComponent(c.url));
    c.feed = info.feed || '';
    c.kind = info.kind || c.kind;
    markDirty(); render();
    toast(c.feed ? '✅ 찾았습니다' : '이 채널은 최근 글을 가져올 수 없습니다');
  }catch(e){ alert(apiErrText(e)); }
}

function sinceText(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(d < 0) return '오늘';
  if(d === 0) return '오늘';
  if(d === 1) return '어제';
  if(d < 30) return d + '일 전';
  if(d < 365) return Math.floor(d / 30) + '개월 전';
  return Math.floor(d / 365) + '년 전';
}

function viewChannels(b){
  const list = b.channels || [];
  setTimeout(() => markChannelsSeen(b), 400);   // 열어봤으니 '읽음' 처리

  const mins = chState.age === null ? null : Math.floor(chState.age / 60);
  const when = chState.autoAt
    ? '마지막으로 확인한 때: ' + (mins !== null && mins < 60
        ? (mins < 1 ? '방금' : mins + '분 전')
        : esc(new Date(chState.autoAt).toLocaleString('ko-KR',
            { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })))
    : '아직 한 번도 확인하지 않았습니다';

  const bar = '<div class="sec-bar">'
    + '<button class="btn primary" onclick="addChannel()">＋ 채널 추가</button>'
    + '<button class="btn" onclick="refreshAllChannels(this)">↻ 전부 새로 받기</button>'
    + '<span class="hint">' + when + '</span></div>';

  // 자동 확인이 어떻게 돌고 있는지 있는 그대로 알려줍니다
  const auto = list.some(c => c.feed) ? (chState.cron
    ? '<div class="ainote" style="background:rgba(18,161,80,.09);'
      + 'border-color:rgba(18,161,80,.28);margin-bottom:14px">'
      + '✅ <b>NAS가 알아서 돌아보고 있습니다.</b> 작업 스케줄러에 등록돼 있어서 '
      + '아무도 대시보드를 안 켜도 새 글을 미리 받아둡니다.</div>'
    : '<div class="ainote" style="margin-bottom:14px">'
      + '🕒 <b>지금은 대시보드를 켜 두는 동안에만 확인합니다.</b><br>'
      + '이 화면을 열어두면 30분마다 알아서 새로 받아옵니다. '
      + '대신 아무도 안 켜 두면 그동안은 확인하지 않습니다.<br><br>'
      + '항상 돌게 하려면 NAS 에 한 번만 등록해 주세요 — '
      + 'DSM → 제어판 → <b>작업 스케줄러</b> → 생성 → 예약된 작업 → 사용자 정의 스크립트<br>'
      + '　사용자 <code>root</code> · 일정 <b>매일 · 반복 30분</b> · '
      + '스크립트 <code>sh /volume1/web/brand/feeds.sh</code></div>') : '';

  if(!list.length) return bar + '<div class="empty">등록된 채널이 없습니다.<br>'
    + '<span style="color:var(--text-muted)">블로그·카페·유튜브 주소를 넣어두면, '
    + '최근 뭘 올렸는지 여기서 바로 보입니다.</span></div>';

  const cards = list.map(c => {
    const f = c.feed ? feedCache[c.feed] : null;
    if(c.feed && !f) setTimeout(() => loadFeed(c.feed), 10);

    let inner, badge = '';
    if(!c.feed){
      inner = '<div class="fmeta">이 채널은 최근 글을 가져올 수 없습니다. '
        + '<button class="btn sm" onclick="refindFeed(\'' + jsq(c.id) + '\')">다시 찾아보기</button></div>';
    }else if(!f || f.loading){
      inner = '<div class="fmeta">불러오는 중…</div>';
    }else if(f.error){
      inner = '<div class="fmeta" style="white-space:pre-wrap;line-height:1.6">⚠️ '
        + esc(f.error) + '</div>'
        + '<div class="row" style="margin-top:8px">'
          + '<button class="btn sm" onclick="refreshFeed(\'' + jsq(c.feed) + '\')">↻ 다시 시도</button>'
          + (String(c.url).indexOf('youtube') >= 0 || String(c.feed).indexOf('youtube') >= 0
              ? '<a class="btn sm" href="channels.php?action=ytcheck&url=' + encodeURIComponent(c.url)
                + '" target="_blank" rel="noopener">🔧 유튜브 진단</a>'
              : '<a class="btn sm" href="channels.php?action=test&url=' + encodeURIComponent(c.feed)
                + '" target="_blank" rel="noopener">🔧 왜 안 되는지 보기</a>')
          + '<a class="btn sm" href="' + esc(c.feed) + '" target="_blank" rel="noopener">RSS 직접 열기 ↗</a>'
        + '</div>';
    }else if(!f.items || !f.items.length){
      inner = '<div class="fmeta">올라온 글이 없습니다.</div>';
    }else{
      const last = f.items[0].iso;
      const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
      badge = '<span class="chip' + (days === null ? '' : (days <= 14 ? ' on' : (days <= 45 ? ' test' : ' off')))
        + '">최근 발행 ' + esc(sinceText(last)) + '</span>';
      const nNew = chUnseen(c.feed, f.items);
      if(nNew) badge += '<span class="chip new">🆕 새 글 ' + nNew + '</span>';
      const mark = chSeen()[c.feed];
      inner = f.items.map(it =>
        '<div class="krow" style="align-items:baseline;gap:8px">'
        + '<a class="lnk" style="flex:1;min-width:0;word-break:break-all" href="' + esc(it.link)
          + '" target="_blank" rel="noopener">'
          + (chNewer(chKey(it), mark) ? '<span class="newtag">NEW</span> ' : '')
          + esc(it.title) + '</a>'
        + '<span class="fmeta" style="white-space:nowrap;margin:0">'
          + esc(sinceText(it.iso)) + '</span></div>').join('');
    }

    return '<div class="mbox" style="margin-bottom:12px">'
      + '<div class="mh" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
        + '<span>' + (CH_ICON[c.kind] || '🌐') + ' ' + esc(c.name || c.kind) + '</span>'
        + '<span class="mhs">' + esc(c.kind) + '</span>'
        + badge
        + '<span style="margin-left:auto;display:flex;gap:5px">'
          + '<a class="btn sm" href="' + esc(c.url) + '" target="_blank" rel="noopener">채널 열기 ↗</a>'
          + (c.feed ? '<button class="btn sm" onclick="refreshFeed(\'' + jsq(c.feed) + '\')">↻</button>' : '')
          + '<button class="btn sm danger" onclick="removeChannel(\'' + jsq(c.id) + '\')">삭제</button>'
        + '</span></div>'
      + '<div class="path" style="margin-bottom:8px">' + esc(c.url) + '</div>'
      + inner + '</div>';
  }).join('');

  return bar + auto + cards;
}

/* ================= 문서 내용으로 찾기 =================
   파일 이름이 아니라 문서 안에 적힌 글자로 찾습니다.
   ====================================================== */
const doc = { info:null, sample:null, run:null, q:'', res:null,
              loading:false, error:null, unread:null, busy:false };

async function docCheck(){
  try{ doc.info = await apiJson('doctext.php?action=check'); }
  catch(e){ doc.info = { error: apiErrText(e) }; }
  render();
}

async function docSample(){
  doc.busy = true; doc.sample = null; doc.error = null; render();
  try{
    doc.sample = await apiJson('doctext.php?action=sample&n=30');
  }catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

async function docStart(){
  if(!confirm('문서 안의 글자를 읽어 목록을 만듭니다.\n\n'
    + '문서가 많으면 몇 분 걸릴 수 있습니다. 창을 닫지 마세요.\n'
    + '원본 파일은 읽기만 하며 고치지 않습니다.')) return;
  doc.run = { starting:true }; render();
  try{
    doc.run = await apiJson('doctext.php?action=start');
    render();
    docLoop();
  }catch(e){
    doc.run = null; render();
    alert(apiErrText(e));
  }
}

async function docLoop(){
  while(doc.run && !doc.run.done){
    let out;
    try{ out = await apiJson('doctext.php?action=step'); }
    catch(e){ doc.run = null; render(); alert(apiErrText(e)); return; }
    if(!doc.run) return;
    doc.run = out;
    render();
  }
  if(doc.run && doc.run.done){
    await docCheck();
    toast('✅ 문서 ' + doc.run['읽은수'].toLocaleString('ko-KR') + '개를 읽었습니다');
  }
}

async function docCancel(){
  if(!confirm('중단할까요?')) return;
  doc.run = null; render();
  try{ await apiJson('doctext.php?action=cancel'); }catch(e){}
}

async function docSearch(){
  const el = document.getElementById('docQ');
  doc.q = el ? el.value.trim() : doc.q;
  if(!doc.q){ toast('⚠️ 찾을 말을 입력해 주세요'); return; }
  doc.loading = true; doc.error = null; doc.unread = null; render();
  try{
    doc.res = await apiJson('doctext.php?action=search&q=' + encodeURIComponent(doc.q));
  }catch(e){ doc.error = apiErrText(e); doc.res = null; }
  doc.loading = false; render();
  const e2 = document.getElementById('docQ');
  if(e2){ e2.value = doc.q; e2.focus(); }
}

async function docUnread(){
  doc.busy = true; doc.res = null; render();
  try{ doc.unread = await apiJson('doctext.php?action=unread'); }
  catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

  if(doc.info === null){ setTimeout(docCheck, 10); return '<div class="fmeta">확인하는 중…</div>'; }

  const info  = doc.info || {};
  const ready = info.ok;

  const bar = '<div class="sec-bar">'
    + '<span class="searchbox" style="flex:1 1 320px"><span class="ico">📖</span>'
      + '<input type="text" id="docQ" placeholder="문서 안에 적힌 말로 찾기 (예: 옥상방수 단가)" '
      + 'value="' + esc(doc.q) + '" onkeydown="if(event.key===\'Enter\')docSearch()"'
      + (ready ? '' : ' disabled') + '></span>'
    + '<button class="btn primary" onclick="docSearch()"' + (ready ? '' : ' disabled') + '>찾기</button>'
    + '<button class="btn" onclick="docSample()">🧪 얼마나 읽히나 재보기</button>'
    + '<button class="btn" onclick="docStart()">'

      + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
        + '<span>🧪 얼마나 읽히나</span>'
        + '<span class="mhs">' + sp['뽑아본수'] + '개를 뽑아 읽어봤습니다 (전체 '
          + sp['대상문서수'].toLocaleString('ko-KR') + '개)</span>'

        + '<span class="bt"><span class="bf" style="width:' + sp['읽힌비율'] + '%"></span></span>'
        + '<span class="bv">' + sp['읽힌비율'] + '%</span></div>'

          '<div class="krow" style="flex-direction:column;align-items:stretch;gap:4px">'

  }
  else if(!ready) body = '<div class="empty">아직 문서 안의 글자를 읽지 않았습니다.<br><br>'

    + '<span style="color:var(--text-muted)">워드·엑셀·파워포인트·텍스트는 대부분 읽힙니다.<br>'
    + 'PDF 는 글자층이 있으면 읽히고, 스캔본은 읽히지 않습니다.</span></div>';
  else body = '<div class="empty">문서 안에 적힌 말로 찾아보세요.<br>'
    + '<span style="color:var(--text-muted)">예) 옥상방수 단가 · 설계감리 · 동아건설 · 32,000</span></div>';

  return bar + runPanel + samplePanel + body;
}

/* ================= 파일 정리 =================
   한 폴더에 쌓인 파일을, 옆 폴더들로 하나씩 넣습니다.
   사진이면 그림을 보면서 고를 수 있습니다.
   ============================================= */
const tidy = { from:null, to:null, files:null, targets:null,
               loading:false, error:null, pick:null, done:[], busy:null };

function openTidy(){
  nasState.mode = 'tidy';
  render();
}

function tidyPick(which){
  tidy.pick = { which: which, loading:true };
  render();
  tidyPickLoad('');
}
function tidyPickClose(){ tidy.pick = null; render(); }

async function tidyPickLoad(dir){
  const which = tidy.pick ? tidy.pick.which : 'from';
  tidy.pick = { which: which, loading:true, dir:dir };
  render();
  try{
    const out = await apiJson('nasfiles.php?action=browse&lim=50'
      + (dir ? '&dir=' + encodeURIComponent(dir) : ''));
    tidy.pick = { which: which, dir: out.dir, parent: out.parent, folders: out.folders || [] };
  }catch(e){
    tidy.pick = { which: which, dir: dir, error: apiErrText(e) };
  }
  render();
}

function tidyChoose(dir){
  const which = tidy.pick.which;
  tidy.pick = null;
  if(which === 'from'){ tidy.from = dir; tidy.files = null; }
  else               { tidy.to   = dir; tidy.targets = null; }
  render();
  tidyLoad();
}

async function tidyLoad(){
  if(tidy.loading) return;
  tidy.loading = true; tidy.error = null; render();
  try{
    if(tidy.from && !tidy.files){
      const a = await apiJson('nasfiles.php?action=browse&lim=500&dir=' + encodeURIComponent(tidy.from));
      tidy.files = a.files || [];
    }
    if(tidy.to && !tidy.targets){
      const b = await apiJson('nasfiles.php?action=browse&lim=50&dir=' + encodeURIComponent(tidy.to));
      // 정리할 폴더 자신은 옮길 곳에서 뺍니다
      tidy.targets = (b.folders || []).filter(f => f.path !== tidy.from);
    }
  }catch(e){ tidy.error = apiErrText(e); }
  tidy.loading = false; render();
}

/* 파일 이름과 폴더 이름이 얼마나 겹치는지 봐서 알맞은 폴더를 먼저 보여줍니다 */
function tidySuggest(fileName){
  if(!tidy.targets) return [];
  const n = normKey(fileName.replace(/\.[^.]+$/, ''));
  const scored = tidy.targets.map(t => {
    const k = normKey(t.name);
    let score = 0;
    if(k.length >= 2 && n.includes(k)) score = 100 + k.length;
    else if(n.length >= 2 && k.includes(n)) score = 90 + n.length;
    else {
      for(let len = Math.min(k.length, 6); len >= 2; len--){
        for(let i = 0; i + len <= k.length; i++){
          if(n.includes(k.slice(i, i + len))){ score = 50 + len; break; }
        }
        if(score) break;
      }
    }
    return { t:t, score:score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, 3).map(x => x.t);
}

async function tidyMove(path, dest, name){
  if(tidy.busy) return;
  tidy.busy = path; render();
  try{
    await apiJson('nasfiles.php?action=movenas', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ src: path, dest: dest })
    });
    tidy.files = tidy.files.filter(f => f.path !== path);
    tidy.done.unshift({ name: name, dest: dest.split('/').pop() });
    tidy.targets = null;                        // 개수를 다시 세어옵니다
    delete browseCache[tidy.from];
    delete browseCache[tidy.to];
    tidy.busy = null;
    render();
    tidyLoad();
  }catch(e){
    tidy.busy = null; render();
    alert('옮기지 못했습니다.\n\n' + apiErrText(e));
  }
}

        + '<span style="margin-left:auto"><button class="btn sm" onclick="tidyPickClose()">취소</button></span>'
      + '</div>'
      + '<div class="sec-bar" style="margin:0 0 10px">'
