let uploadReport = [];
function clearReport(){ uploadReport = []; render(); bindDrop(); }

function bindDrop(){
  if(STORAGE_MODE !== 'nas') return;

  const inp = document.getElementById('fileInput');
  if(inp && !inp._bound){
    inp._bound = true;
    inp.addEventListener('change', () => {
      const picked = Array.from(inp.files);   // 목록을 먼저 복사한 뒤
      inp.value = '';                          // 입력칸을 비웁니다 (같은 파일 재선택 가능)
      if(picked.length) uploadFiles(picked);
    });
  }

  const z = document.getElementById('dropZone');
  if(!z) return;
  ['dragenter','dragover'].forEach(ev => z.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); z.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => z.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); z.classList.remove('over');
  }));
  z.addEventListener('drop', e => {
    if(e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });
}

async function uploadFiles(fileList){
  const b = currentBrand();
  if(!b) return;
  const files = Array.from(fileList);
  if(!files.length) return;

  const q = document.getElementById('upQueue');
  q.innerHTML = files.map((f, i) =>
    '<div class="upitem" id="up_' + i + '">'
    + '<span class="fileicon">' + fileIcon(f.name) + '</span>'
    + '<span class="nm">' + esc(f.name) + '</span>'
    + '<span class="fmeta">' + fmtSize(f.size) + '</span>'
    + '<span class="st" id="upst_' + i + '">올리는 중…</span></div>'
  ).join('');

  const report = [];
  let added = 0;
  for(let i = 0; i < files.length; i++){
    const st = document.getElementById('upst_' + i);
    try{
      const fd = new FormData();
      fd.append('brand', b.name);        // NAS에 브랜드 이름 폴더로 정리해서 저장합니다
      fd.append('sub', '자료');
      fd.append('file', files[i]);
      const res = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try { out = JSON.parse(text); } catch(e) {}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '업로드 실패');

      b.assets.unshift({
        id: uid('i'),
        title: files[i].name.replace(/\.[^.]+$/, ''),
        kind: '기타',
        url: '',
        note: '',
        fileId: out.fileId,
        fileName: out.fileName,
        filePath: out.filePath || '',
        fileSize: out.fileSize,
        uploadedAt: new Date().toISOString()
      });
      added++;
      report.push({ name: files[i].name, size: files[i].size, ok: true });
      if(st){ st.textContent = '완료'; st.className = 'st ok'; }
    }catch(e){
      report.push({ name: files[i].name, size: files[i].size, ok: false, error: e.message });
      if(st){ st.textContent = '실패'; st.className = 'st err'; }
    }
  }

  uploadReport = report;
  if(added) await saveAll(true);  // 파일은 이미 NAS에 있으므로 목록도 바로 저장합니다
  render();
  bindDrop();

  const failed = report.length - added;
  if(added && !failed) toast('✅ ' + added + '개 파일을 NAS에 올렸습니다');
  else if(added && failed) toast('⚠️ ' + added + '개 성공, ' + failed + '개 실패');
  else toast('⚠️ 업로드에 실패했습니다. 아래 사유를 확인해 주세요');
}

async function deleteAsset(id){
  const b = currentBrand();
  const it = b.assets.find(x => x.id === id);
  const warn = it.fileId
    ? '"' + it.title + '" 자료와 NAS에 올린 파일을 함께 삭제합니다.\n되돌릴 수 없습니다. 계속할까요?'
    : '"' + it.title + '" 항목을 삭제할까요?';
  if(!confirm(warn)) return;

  if(it.fileId){
    try{
      const res = await fetch('files.php?action=delete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ fileId: it.fileId })
      });
      const out = await res.json();
      if(!out.ok) throw new Error(out.error || '파일 삭제 실패');
    }catch(e){
      showError('NAS 파일을 지우지 못했습니다: ' + e.message);

}

/* ========================= 저장 / 불러오기 =========================
   내용을 고치면 잠시 뒤 자동으로 저장됩니다.
   [저장] 버튼은 지금 바로 저장하고 싶을 때 쓰시면 됩니다. (Ctrl+S 도 동일)
   ================================================================== */
let saveTimer = null;     // 자동 저장 예약
let saving = false;       // 저장이 진행 중인지
let saveAgain = false;    // 저장 중에 또 바뀌었는지

function markDirty(){
  setSaveState('dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveAll(true), 1200);
}

function setSaveState(state){
  const el = document.getElementById('saveState');
  if(!el) return;
  const map = {
    dirty:  ['●', '수정됨 — 잠시 뒤 저장됩니다', ''],
    saving: ['◌', '저장 중…', ''],
    saved:  ['✓', '저장됨', 'ok'],
    failed: ['⚠', '저장 실패', 'err']
  };
  const [ic, txt, cls] = map[state] || map.saved;
  el.className = 'savestate ' + cls;
  el.textContent = ic + ' ' + txt;
}

async function saveAll(silent){
  if(saving){ saveAgain = true; return; }   // 겹쳐 저장하지 않습니다
  clearTimeout(saveTimer);
  saving = true;
  setSaveState('saving');

  data.savedAt = new Date().toISOString();
  data.schema = SCHEMA;
  try{
    await storageSave(data);
    document.getElementById('errBar').classList.remove('show');
    setSaveState('saved');
    if(!silent) toast(STORAGE_MODE === 'nas' ? '✅ NAS에 저장되었습니다' : '✅ 저장되었습니다 (이 브라우저)');
    updateSubtitle();
  }catch(e){
    localStorage.setItem(LS_KEY, JSON.stringify(data));   // 안전망
    setBadge('error', 'NAS 저장 실패 — 임시로 이 브라우저에 보관');
    setSaveState('failed');
    showError(e.message);
  }finally{
    saving = false;
    if(saveAgain){ saveAgain = false; markDirty(); }
  }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '브랜드허브_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('📤 파일로 내보냈습니다');
}

function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.brands)) throw new Error('브랜드 목록이 없습니다');
      if(!confirm('현재 내용을 파일 내용으로 덮어씁니다. 계속할까요?')) return;
      data = normalize(parsed);
      currentBrandId = data.brands.length ? data.brands[0].id : null;
      render(); markDirty();
      toast('📥 불러왔습니다');
    }catch(e){ toast('⚠️ 파일을 읽을 수 없습니다: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* 예전 형식이나 필드가 빠진 데이터가 들어와도 깨지지 않게 정리합니다 */
function normalize(raw){
  if(!raw || !Array.isArray(raw.brands) || raw.schema !== SCHEMA){
    const fresh = defaultData();
    if(raw && Object.keys(raw).length) fresh._이전형식백업 = raw;  // 예전 데이터는 버리지 않음
    return fresh;
  }
  raw.brands.forEach(b => {
    b.id = b.id || uid('b');
    b.icon = b.icon || '🏷️';
    b.color = b.color || '#3b82f6';
    if(!Array.isArray(b.nasFolders)) b.nasFolders = [];
    ITEM_KEYS.forEach(k => {
      if(!Array.isArray(b[k])) b[k] = [];
      b[k].forEach(it => { it.id = it.id || uid('i'); });
    });
    if(typeof b.masterPrompt !== 'string') b.masterPrompt = '';
  });
  return raw;
}

function updateSubtitle(){
  const when = data.savedAt
    ? new Date(data.savedAt).toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' })
    : '아직 저장 안 됨';
  document.getElementById('subtitle').textContent = '넷폼알앤디 · 마지막 저장: ' + when;
}

/* ========================= 공용 ========================= */
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function showError(msg){
  document.getElementById('errText').textContent = msg;
  document.getElementById('errBar').classList.add('show');
  window.scrollTo({ top:0, behavior:'smooth' });
}

function toggleDark(){
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('brandHubDark', document.body.classList.contains('dark-mode'));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2800);
}

window.addEventListener('beforeunload', e => {
  if(saveTimer || saving){ e.preventDefault(); e.returnValue = ''; }
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); saveAll(); }
  if(e.key === 'Escape'){ closeModal('brandModal'); closeModal('itemModal'); }
});

/* ========================= 시작 ========================= */
async function init(){
  if(localStorage.getItem('brandHubDark') === 'true') document.body.classList.add('dark-mode');

  try{
    const loaded = await storageLoad();
    if(loaded) data = normalize(loaded);
    setBadge(STORAGE_MODE === 'nas' ? 'nas' : '',
      STORAGE_MODE === 'nas' ? 'NAS 공유 저장' : '이 브라우저에만 저장');
  }catch(e){
    const raw = localStorage.getItem(LS_KEY);
    if(raw) data = normalize(JSON.parse(raw));
    setBadge('error', 'NAS 연결 실패 — 이 브라우저 데이터 표시 중');
  }

  currentBrandId = null;   // 처음에는 홈부터 보여줍니다
  updateSubtitle();
  render();
  loadInquiries();         // 홈에도 문의 수치를 띄우기 위해 미리 불러옵니다
  if(STORAGE_MODE === 'nas'){
    nasCheck();
    checkVersion(false);
    loadChannelSummary();                                  // 채널 새 글 (받아둔 것 읽기)
    setInterval(loadChannelSummary, 5 * 60 * 1000);        // 열어둔 채로도 5분마다 갱신
    setInterval(() => checkVersion(false), 30 * 60 * 1000);
  }
}
init();
</script>
