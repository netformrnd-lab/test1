/* ---------- 사진 크게 보기 ---------- */
let picView = null;   // {navKey, i}

function picsOf(navKey){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : '';
  const c = browseCache[dir];
  return (c && c.files) ? c.files.filter(x => x.img) : [];
}

function openPic(navKey, i){
  picView = { navKey: navKey, i: i };
  drawPic();
}
function closePic(){
  picView = null;
  const el = document.getElementById('picbox');
  if(el) el.remove();
  document.removeEventListener('keydown', picKey);
}
function stepPic(d){
  if(!picView) return;
  const list = picsOf(picView.navKey);
  if(!list.length) return;
  picView.i = (picView.i + d + list.length) % list.length;
  drawPic();
}
function picKey(e){
  if(e.key === 'Escape') closePic();
  else if(e.key === 'ArrowRight') stepPic(1);
  else if(e.key === 'ArrowLeft')  stepPic(-1);
}

function drawPic(){
  const list = picsOf(picView.navKey);
  const x = list[picView.i];
  if(!x){ closePic(); return; }

  let el = document.getElementById('picbox');
  if(!el){
    el = document.createElement('div');
    el.id = 'picbox';
    el.className = 'picbox';
    el.onclick = ev => { if(ev.target === el) closePic(); };
    document.body.appendChild(el);
    document.addEventListener('keydown', picKey);
  }
  el.innerHTML =
      '<div class="pb-top">'
      + '<span class="pb-nm">' + esc(x.name) + '</span>'
      + '<span class="pb-ct">' + (picView.i + 1) + ' / ' + list.length
        + ' · ' + esc(x.size) + ' · ' + esc(x.date) + '</span>'
      + '<span style="margin-left:auto;display:flex;gap:6px">'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇ 내려받기</a>'
        + '<button class="btn sm" onclick="closePic()">✕ 닫기</button>'
      + '</span></div>'
    + '<button class="pb-nav pb-prev" onclick="stepPic(-1)">‹</button>'
    + '<img class="pb-img" src="nasfiles.php?action=image&path='
      + encodeURIComponent(x.path) + '" alt="' + esc(x.name) + '">'
    + '<button class="pb-nav pb-next" onclick="stepPic(1)">›</button>';
}

async function moreFiles(navKey){
  fileShow[navKey] = (fileShow[navKey] || 30) + 50;
  await ensureFiles(navKey, fileShow[navKey] + 20);
  redraw();
}

function toggleFolder(brandId, path){
  openFolder[brandId] = (openFolder[brandId] === path) ? null : path;
  redraw();
}

function gotoFolder(navKey, dir){
  folderNav[navKey] = dir;
  fileShow[navKey] = 30;
  picShow[navKey]  = 40;
  delete fileOpen[navKey];
  if(!browseCache[dir]) loadBrowse(dir); else redraw();
}

function reloadFolder(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  delete browseCache[dir];
  loadBrowse(dir);
  toast('↻ 다시 불러옵니다');
}

function currentDirOf(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];
  return (c && c.dir) ? c.dir : dir;
}

function crumbHtml(navKey, out, rootOverride){
  const root = rootOverride || out.root || '';
  const dir  = out.dir  || '';
  let rel = (root && dir.indexOf(root) === 0) ? dir.slice(root.length) : dir;
  rel = rel.replace(/^\//, '');
  const parts = rel ? rel.split('/') : [];

  const bits = ['<button class="crumb' + (parts.length ? '' : ' on') + '"'
    + (parts.length ? ' onclick="gotoFolder(\'' + jsq(navKey) + '\',\'' + jsq(root) + '\')"' : '')
    + '>🏠 ' + esc(root.split('/').pop() || '전체') + '</button>'];

  let acc = root;
  parts.forEach((seg, i) => {
    acc += '/' + seg;
    bits.push('<span class="crumbsep">›</span>');
    bits.push(i === parts.length - 1
      ? '<span class="crumb on">' + esc(seg) + '</span>'
      : '<button class="crumb" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
        + jsq(acc) + '\')">' + esc(seg) + '</button>');
  });
  return '<div class="crumbs">' + bits.join('') + '</div>';
}

/* ================= 목록 만들기 (대시보드에서 직접) =================
   작업 스케줄러 없이, 여기서 조금씩 나눠 훑습니다.
   한 번에 몇 초씩만 일하고 돌아오므로 파일이 많아도 끊기지 않습니다.
   ================================================================= */
let scanRun = null;   // null=안 함 | {진행중 상태}

/* 훑을 폴더를 눌러서 고릅니다 (경로를 손으로 적지 않아도 됩니다) */
let pick = null;   // null=안 열림 | {dir, loading, error, folders, parent, top}

function openPicker(){
  pick = { loading:true };
  render();
  loadPicker('');
}

function closePicker(){ pick = null; render(); }

async function loadPicker(dir){
  pick = { loading:true, dir:dir };
  render();
  try{
    const out = await apiJson('nasfiles.php?action=listdirs'
      + (dir ? '&dir=' + encodeURIComponent(dir) : ''));
    pick = out;
  }catch(e){
    pick = { error: apiErrText(e), tried: e.tried, dir:dir };
  }
  render();
}

function pickerPanel(){
  if(!pick) return '';
  const back = pick.parent !== undefined && pick.parent !== null
    ? '<button class="btn sm" onclick="loadPicker(\'' + jsq(pick.parent) + '\')">⬆ 위로</button>' : '';

  let body;
  if(pick.loading) body = '<div class="fmeta">불러오는 중…</div>';
  else if(pick.error) body = '<div class="fmeta" style="white-space:pre-wrap">⚠️ ' + esc(pick.error)
    + (pick.tried ? '\n\n찾아본 경로:\n' + esc(pick.tried.join('\n')) : '') + '</div>';
  else if(!pick.folders.length) body = '<div class="fmeta">이 안에는 하위 폴더가 없습니다. '
    + '여기를 훑으시려면 아래 버튼을 누르세요.</div>';
  else body = '<div class="fgrid">' + pick.folders.map(f =>
      '<button class="fcard" onclick="loadPicker(\'' + jsq(f.path) + '\')" title="' + esc(f.name) + '">'
      + '<span class="fc-ico">📁</span><span class="fc-t">'
      + '<span class="fc-nm">' + esc(f.name) + '</span></span></button>').join('') + '</div>';

  const here = pick.dir
    ? '<button class="btn primary" onclick="runScan(\'' + jsq(pick.dir) + '\')">'
      + '✅ 여기를 훑기</button>' : '';

  return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>📂 훑을 폴더 고르기</span>'
      + '<span class="mhs">폴더를 눌러 들어가고, 원하는 곳에서 [여기를 훑기]</span>'
      + '<span style="margin-left:auto"><button class="btn sm" onclick="closePicker()">닫기</button></span>'
    + '</div>'
    + '<div class="sec-bar" style="margin:0 0 10px">' + back + here + '</div>'
    + '<div class="path" style="margin-bottom:8px">'
      + esc(pick.dir || '볼륨을 고르세요') + '</div>'
    + body + '</div>';
}

async function runScan(dir){
  pick = null;
  scanRun = { starting:true };
  render();
  try{
    scanRun = await apiJson('nasfiles.php?action=scanstart&dir=' + encodeURIComponent(dir));
    render();
    scanLoop();
  }catch(e){
    scanRun = null;
    render();
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n') : ''));
  }
}

function startScan(){ openPicker(); }

async function scanLoop(){
  while(scanRun && !scanRun.done){
    let out;
    try{
      out = await apiJson('nasfiles.php?action=scanstep');
    }catch(e){
      scanRun = null; render();
      alert(apiErrText(e)
        + (e['못읽은폴더'] && e['못읽은폴더'].length
            ? '\n\n못 읽은 폴더:\n' + e['못읽은폴더'].slice(0, 10).join('\n') : ''));
      return;
    }
    if(!scanRun) return;           // 도중에 중단한 경우
    scanRun = out;
    render();
  }
  if(scanRun && scanRun.done){
    treeCache = null;
    browseCache2Clear();
    await nasCheck();
    toast('✅ 목록을 다 만들었습니다 — ' + scanRun['찾은파일'].toLocaleString('ko-KR') + '개');
  }
}

function browseCache2Clear(){
  Object.keys(browseCache).forEach(k => { delete browseCache[k]; });
  Object.keys(folderNav).forEach(k => { delete folderNav[k]; });
}

async function cancelScan(){
  if(!confirm('목록 만들기를 중단할까요?')) return;
  scanRun = null;
  render();
  try{ await apiJson('nasfiles.php?action=scancancel'); }catch(e){}
  toast('중단했습니다');
}

function scanPanel(){
  if(!scanRun) return '';
  if(scanRun.starting) return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="fmeta">시작하는 중…</div></div>';

  const done = scanRun.done;
  return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>' + (done ? '✅ 목록 완성' : '⏳ 목록 만드는 중') + '</span>'
      + '<span class="mhs">' + esc(scanRun['걸린시간'] || '') + '</span>'
      + '<span style="margin-left:auto">'
        + (done
            ? '<button class="btn sm" onclick="scanRun=null;render()">닫기</button>'
            : '<button class="btn sm danger" onclick="cancelScan()">중단</button>')
      + '</span>'
    + '</div>'
    + '<div class="krow"><span>찾은 파일</span><b style="color:var(--text-primary)">'
      + (scanRun['찾은파일'] || 0).toLocaleString('ko-KR') + '개</b></div>'
    + '<div class="krow"><span>훑은 폴더</span><b style="color:var(--text-primary)">'
      + (scanRun['훑은폴더수'] || 0).toLocaleString('ko-KR') + '개</b></div>'
    + (done ? '' : '<div class="path" style="margin-top:8px;word-break:break-all">'
        + esc(scanRun['지금폴더'] || '') + '</div>')

          + scanRun['못읽은폴더'].length + '개 — ' + esc(scanRun['못읽은폴더'][0]) + ' …</div>'
        : '')
    + (done ? '<div class="fmeta" style="margin-top:8px">' + esc(scanRun['다음'] || '') + '</div>' : '')
    + '</div>';
}

/* ================= 브랜드 ↔ 폴더 자동 연결 =================
   폴더 이름과 브랜드 이름을 맞춰봐서, 손으로 지정하지 않아도
   각 브랜드 자료 탭에 알맞은 NAS 폴더가 저절로 뜨게 합니다.
   ============================================================ */
let treeCache = null;   // null=아직 | {loading} | {error} | 서버응답

async function loadTree(){
  treeCache = { loading:true };
  try{
    treeCache = await apiJson('nasfiles.php?action=tree&depth=4');
  }catch(e){
    treeCache = { error: apiErrText(e) };
  }
  redraw();
}

/* 이름을 비교하기 좋게 다듬습니다.
   "00. 브랜드 공유폴더" → "브랜드공유폴더", "POUR 솔루션" → "솔루션" */
function normKey(s){
  return String(s).toLowerCase()
    .replace(/[#＃]/g, '')
    .replace(/^[0-9]+[.\-_\s]*/, '')
    .replace(/^[_\-.\s]+/, '')
    .replace(/pour/g, '')
    .replace(/[\s_\-.()\[\]·]/g, '');
}

function nameMatches(brandName, folderName){
  const a = normKey(brandName), b = normKey(folderName);
  if(a.length < 2 || b.length < 2) return false;
  return a === b || a.includes(b) || b.includes(a);
}

/* 이 브랜드에 해당하는 폴더들을 자동으로 골라냅니다.
   - 얕은 폴더를 우선하고, 이미 고른 폴더의 하위는 다시 넣지 않습니다
   - 손으로 연결했거나 숨긴 폴더는 뺍니다 */
function autoFoldersFor(b){
  const t = treeCache;
  if(!t || !t.folders) return [];
  const hidden = b.nasHidden || [];
  const manual = (b.nasFolders || []).map(x => x.path);

  const hits = t.folders.filter(f => nameMatches(b.name, f.name)
    && hidden.indexOf(f.path) < 0 && manual.indexOf(f.path) < 0);
  if(!hits.length) return [];

  // 같은 이름이 여러 단계에 흩어져 있으면, 가장 위쪽 단계만 씁니다.
  // (POUR공법_시방서, POUR공법_카달로그 … 같은 하위 폴더가 수십 개 걸리는 것을 막습니다)
  const minDepth = Math.min.apply(null, hits.map(f => f.depth));

  const out = [];
  hits.filter(f => f.depth === minDepth)
      .sort((x, y) => (y.count || 0) - (x.count || 0))
      .forEach(f => {
        if(out.some(o => f.path.indexOf(o.path + '/') === 0)) return;
        out.push(f);
      });
  return out;
}

/* 어느 폴더가 어느 브랜드에도 안 붙었는지 */
function unmatchedFolders(){
  const t = treeCache;
  if(!t || !t.folders) return [];
  const taken = {};
  data.brands.forEach(b => autoFoldersFor(b).forEach(f => { taken[f.path] = 1; }));
  data.brands.forEach(b => (b.nasFolders || []).forEach(f => { taken[f.path] = 1; }));
  return t.folders.filter(f => f.depth === 1 && !taken[f.path]);
}

function hideAutoFolder(path){
  const b = currentBrand();
  if(!b) return;
  if(!confirm('이 폴더를 "' + b.name + '" 자료에서 숨길까요?\n\n'
    + 'NAS의 실제 파일은 그대로 남습니다.\n\n' + path)) return;
  b.nasHidden = b.nasHidden || [];
  b.nasHidden.push(path);
  markDirty();
  redraw();
}

function unhideAll(){
  const b = currentBrand();
  if(!b || !(b.nasHidden || []).length) return;
  b.nasHidden = [];
  markDirty();
  redraw();
  toast('숨긴 폴더를 다시 보여줍니다');
}

/* 폴더 하나를 화면에 그립니다.
   navKey  : 이 탐색기를 구분하는 이름 ('nas' 또는 연결폴더 id)
   startDir: 처음 보여줄 폴더 (''이면 훑은 폴더 전체) */
function folderBrowserHtml(navKey, startDir, opts){
  opts = opts || {};
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];

  if(!c){ setTimeout(() => loadBrowse(dir), 10); return '<div class="fmeta">불러오는 중…</div>'; }
  if(c.loading) return '<div class="fmeta">불러오는 중…</div>';
  if(c.error)   return '<div class="fmeta">⚠️ ' + esc(c.error) + '</div>';

  const canUp = c.parent && (!startDir || c.dir !== startDir);
  const tools = '<div class="sec-bar" style="margin:0 0 10px">'
    + (canUp
        ? '<button class="btn sm" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(c.parent) + '\')">⬆ 상위 폴더</button>' : '')
    + '<button class="btn sm" onclick="reloadFolder(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">↻ 새로고침</button>'
    + '<button class="btn sm" onclick="copyDirPath(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">📋 폴더 경로</button>'
    + (opts.link
        ? '<button class="btn sm" onclick="linkCurrentDir(\'' + jsq(navKey) + '\',\''
          + jsq(startDir || '') + '\')">＋ 브랜드에 연결</button>' : '')
    + '<span class="hint">이 폴더 ' + (c.fileCount || 0).toLocaleString('ko-KR') + '개'
      + ' · 아래 전체 ' + (c.total || 0).toLocaleString('ko-KR') + '개</span>'
    + '</div>';

  const folders = c.folders.length
    ? '<div class="fgrid">' + c.folders.map(f =>
        '<button class="fcard" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(f.path) + '\')" title="' + esc(f.name) + '">'
        + '<span class="fc-ico">📁</span><span class="fc-t">'
        + '<span class="fc-nm">' + esc(f.name) + '</span>'
        + '<span class="fc-sub">' + f.count.toLocaleString('ko-KR') + '개 · '
          + esc(f.size) + '</span></span></button>').join('') + '</div>'
    : '';

  // 사진과 그 밖의 파일을 나눕니다 — 사진은 눈으로 보고 고르게 합니다
  const pics   = c.files.filter(x => x.img);
  const others = c.files.filter(x => !x.img);

  const picShown = picShow[navKey] || 40;
  const picSlice = pics.slice(0, picShown);
  const picGrid = pics.length
    ? '<div class="picsec">'
      + '<div class="sec-bar" style="margin:0 0 10px">'
        + '<span class="mh" style="margin:0">🖼 사진 ' + pics.length.toLocaleString('ko-KR') + '장</span>'
        + '<span class="hint">누르면 크게 보고, 화살표로 넘길 수 있습니다</span>'
      + '</div>'
      + '<div class="picgrid">' + picSlice.map((x, i) =>
          '<button class="pic" onclick="openPic(\'' + jsq(navKey) + '\',' + i + ')" '
          + 'title="' + esc(x.name) + '">'
          + '<img loading="lazy" src="nasfiles.php?action=thumb&w=320&path='
            + encodeURIComponent(x.path) + '" alt="' + esc(x.name) + '">'
          + '<span class="pic-nm">' + esc(x.name) + '</span></button>').join('')
      + '</div>'
      + ((pics.length > picSlice.length || c.files.length < c.fileCount)
          ? '<div style="margin-top:10px"><button class="btn sm" onclick="morePics(\'' + jsq(navKey)
            + '\')">사진 더 보기 (' + picSlice.length.toLocaleString('ko-KR') + ' / '
            + (c.files.length < c.fileCount ? '약 ' : '')
            + pics.length.toLocaleString('ko-KR') + ')</button></div>' : '')
      + '</div>'
    : '';

  // 사진이 아닌 파일 목록은 접어둡니다. 하위 폴더가 없으면 바로 펼칩니다.
  const fOpen = (fileOpen[navKey] !== undefined) ? fileOpen[navKey] : (!c.folders.length && !pics.length);
  const shown = fileShow[navKey] || 30;
  const slice = others.slice(0, shown);

  const fileHead = others.length
    ? '<button class="fhead" style="border:1px solid var(--border);border-radius:10px;'
      + 'background:var(--bg-secondary)" onclick="toggleFiles(\'' + jsq(navKey) + '\')">'
      + '<span class="fh-ar">' + (fOpen ? '▾' : '▸') + '</span>'
      + '<span class="fh-ic">📄</span>'
      + '<span class="fh-nm">그 밖의 파일</span>'
      + '<span class="fh-ct">' + others.length.toLocaleString('ko-KR') + '개</span>'
      + '</button>'
    : '';

  const files = (others.length && fOpen)
    ? '<div class="mbox" style="margin-top:8px">' + slice.map(x =>
        '<div class="krow" style="align-items:center">'
        + '<span class="fileicon" style="font-size:15px">' + fileIcon(x.name) + '</span>'
        + '<span style="flex:1;min-width:0;white-space:normal;word-break:break-all">'
          + '<b style="color:var(--text-primary)">' + esc(x.name) + '</b></span>'
        + '<span class="fmeta" style="white-space:nowrap;margin:0">'
          + esc(x.size) + ' · ' + esc(x.date) + '</span>'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇</a>'
        + '</div>').join('')
      + ((others.length > slice.length || c.files.length < c.fileCount)
          ? '<div style="margin-top:10px"><button class="btn sm" onclick="moreFiles(\'' + jsq(navKey)
            + '\')">파일 더 보기 (' + slice.length.toLocaleString('ko-KR') + ' / '
            + (c.files.length < c.fileCount ? '약 ' : '')
            + others.length.toLocaleString('ko-KR') + ')</button></div>' : '')
      + '</div>'
    : '';

  const nothing = (!c.folders.length && !c.files.length)
    ? '<div class="empty">이 폴더에는 파일이 없습니다.</div>' : '';

  return tools + crumbHtml(navKey, c, opts.crumbRoot) + folders
       + picGrid + fileHead + files + nothing;
}

async function copyDirPath(navKey, startDir){
  const win = toWinPath(currentDirOf(navKey, startDir));
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

function linkCurrentDir(navKey, startDir){
  const dir = currentDirOf(navKey, startDir);
  if(!data.brands.length){ toast('⚠️ 브랜드가 없습니다'); return; }
  const names = data.brands.map((b, n) => (n + 1) + '. ' + b.name).join('\n');
  const pick = prompt('지금 보고 있는 폴더를 어느 브랜드에 연결할까요?\n\n' + names
    + '\n\n폴더: ' + dir + '\n\n번호를 입력하세요', '1');
  if(pick === null) return;
  const b = data.brands[parseInt(pick, 10) - 1];
  if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }

  b.nasFolders = b.nasFolders || [];
  if(b.nasFolders.some(x => x.path === dir)){ toast('이미 연결된 폴더입니다'); return; }
  b.nasFolders.push({ id: uid('nf'), path: dir, label: dir.split('/').pop(), q: '' });
  markDirty();
  toast('📂 "' + b.name + '" 자료에 연결했습니다');
}

/* 훑을 폴더(목록을 만들 최상위 폴더)를 바꿉니다.
   Y:\... , \\netformrnd\... , /volume1/... 아무 형태나 받습니다. */
async function setScanRoot(){
  const now = (nasState.info && nasState.info['다음에훑을폴더'])
           || (nasState.info && nasState.info['훑은폴더']) || '';
  const v = prompt(
    '파일 목록을 만들 최상위 폴더를 넣어주세요.\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\n\n'
    + '바꾼 뒤에는 NAS 작업 스케줄러에서 scan.sh 를 한 번 더 실행해 주세요.', now);
  if(v === null) return;
  if(!v.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  try{
    const out = await apiJson('nasfiles.php?action=setroot', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ dir: v })
    });
    toast('✅ ' + out['훑을폴더'] + ' — 작업 스케줄러에서 scan.sh 를 실행해 주세요');
    nasCheck();
  }catch(e){
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n')
                 + '\n\n폴더 이름에 띄어쓰기나 점(.)이 있으면 그대로 넣어주세요.' : ''));
  }
}

/* 어느 폴더가 어느 브랜드로 자동 연결됐는지 보여줍니다.
   기본은 접어두고, 눌렀을 때만 펼칩니다. */
let matchOpen = false;

function toggleMatchPanel(){ matchOpen = !matchOpen; render(); }

function autoMatchPanel(){
  if(treeCache === null){ setTimeout(loadTree, 10); return ''; }
  if(treeCache.loading) return '<div class="fmeta" style="margin-bottom:12px">브랜드 연결을 맞춰보는 중…</div>';
  if(treeCache.error)   return '';

  const per = data.brands.map(b => ({ b:b, auto:autoFoldersFor(b), man:(b.nasFolders || []) }));
  const linked  = per.filter(x => x.auto.length + x.man.length > 0).length;
  const missing = per.filter(x => x.auto.length + x.man.length === 0).map(x => x.b.name);

  const head = '<button class="fhead" onclick="toggleMatchPanel()" '
      + 'style="border-radius:12px">'
    + '<span class="fh-ar">' + (matchOpen ? '▾' : '▸') + '</span>'
    + '<span class="fh-ic">🪄</span>'
    + '<span class="fh-nm">브랜드 자동 연결</span>'
    + '<span class="fh-ct">' + linked + ' / ' + data.brands.length + ' 브랜드 연결됨'
      + (missing.length ? ' · 없음: ' + esc(missing.join(', ')) : '') + '</span>'
    + '</button>';

  if(!matchOpen) return '<div class="flist" style="margin-bottom:16px">' + head + '</div>';

  const rows = per.map(x => {
    const all = x.auto.map(f => ({ name:f.name, count:f.count, auto:true }))
      .concat(x.man.map(f => ({ name:(f.label || f.path.split('/').pop()), count:null, auto:false })));
    return '<div class="krow" style="align-items:flex-start;padding:8px 14px">'
      + '<span style="flex:0 0 130px"><b style="color:var(--text-primary)">'
        + esc(x.b.icon || '') + ' ' + esc(x.b.name) + '</b></span>'
      + '<span style="flex:1;min-width:0;text-align:right">'
        + (all.length
            ? all.map(v => '<span class="chip' + (v.auto ? ' on' : '') + '" '
                + 'style="margin:2px 0 2px 4px">' + (v.auto ? '🪄 ' : '📂 ') + esc(v.name)
                + (v.count !== null ? ' · ' + v.count.toLocaleString('ko-KR') + '개' : '')
                + '</span>').join('')
            : '<span class="fmeta">맞는 폴더 없음</span>')
      + '</span></div>';
  }).join('');

  const un = unmatchedFolders();
  const unHtml = un.length
    ? '<div class="fmeta" style="padding:8px 14px 12px">어느 브랜드에도 안 붙은 폴더 '
      + un.length + '개 — ' + esc(un.slice(0, 12).map(f => f.name).join(' · '))
      + (un.length > 12 ? ' …' : '') + '</div>'
    : '';

  return '<div class="flist" style="margin-bottom:16px">' + head
    + '<div style="border-top:1px solid var(--border)">' + rows + unHtml + '</div></div>';
}

function renderBrand(){

    links: b.links.length,
    channels: (b.channels || []).length,
    inquiries: (inquiryCache.byBrand[b.name] || []).length,
    prompt: (b.masterPrompt || '').trim() ? 1 : 0
  };
  const tabDefs = [
    ['inquiries','📞 문의'],
    ['automations','🤖 자동화 모음'],
    ['history','📜 히스토리'],
    ['tasks','✅ 할 일'],
    ['links','🔗 바로가기'],
    ['channels','📣 채널'],
    ['assets','📁 자료'],
    ['prompt','✨ 마스터프롬프트']
  ];

  main.innerHTML =
    '<div class="panel">'
    + '<div class="bhead">'
      + '<div class="icon">' + esc(b.icon || '🏷️') + '</div>'
      + '<div><h2>' + esc(b.name) + '</h2>'
        + '<div class="meta">' + esc(b.desc || '설명 없음')
        + (b.owner ? ' · 담당 ' + esc(b.owner) : '') + '</div></div>'
      + '<div class="ba">'
        + '<button class="btn sm" onclick="openBrandModal(\'' + b.id + '\')">수정</button>'
        + '<button class="btn sm danger" onclick="deleteBrand(\'' + b.id + '\')">삭제</button>'
      + '</div>'
    + '</div>'
    + '<div class="tabs">' + tabDefs.map(([k, label]) =>
        '<button class="tab' + (currentTab === k ? ' on' : '') + '" onclick="selectTab(\'' + k + '\')">'
        + label + (counts[k] ? '<span class="n">' + counts[k] + '</span>' : '') + '</button>'
      ).join('') + '</div>'
    + '<div class="tabbody" id="tabbody"></div>'
    + '</div>';

  const body = document.getElementById('tabbody');
  if(currentTab === 'prompt') body.innerHTML = viewPrompt(b);
  else if(currentTab === 'history') body.innerHTML = viewHistory(b);
  else if(currentTab === 'assets') { body.innerHTML = viewAssets(b); bindDrop(); }
  else if(currentTab === 'inquiries') { body.innerHTML = viewInquiries(b); loadInquiries(); bindCsvInput(); }
  else if(currentTab === 'tasks') body.innerHTML = viewTasks(b);
  else if(currentTab === 'links') body.innerHTML = viewLinks(b);
  else if(currentTab === 'channels') body.innerHTML = viewChannels(b);
  else if(currentTab === 'automations') body.innerHTML = viewTools(b) + viewCards(b, 'automations');
  else body.innerHTML = viewCards(b, currentTab);
}

function secBar(type){
  const t = TYPES[type];
  return '<div class="sec-bar">'
    + '<button class="btn primary" onclick="openItemModal(\'' + type + '\')">＋ ' + t.label + ' 추가</button>'
    + '<span class="hint">' + t.hint + '</span></div>';
}

function viewCards(b, type){
  const t = TYPES[type];
  const list = b[type];
  if(!list.length) return secBar(type) + '<div class="empty">' + t.empty + '</div>';

  return secBar(type) + '<div class="cards">' + list.map(it => {
    const bits = [];
    if(type === 'automations'){
      if(it.tool)   bits.push('<span class="chip">' + esc(it.tool) + '</span>');
      if(it.status) bits.push('<span class="chip ' + statusClass(it.status) + '">' + esc(it.status) + '</span>');
    }else{
      if(it.kind) bits.push('<span class="chip">' + esc(it.kind) + '</span>');
    }
    if(it.url){
      bits.push(isUrl(it.url)
        ? '<a class="lnk" href="' + esc(it.url) + '" target="_blank" rel="noopener">바로가기 ↗</a>'
        : '<span class="path">' + esc(it.url) + '</span>'
          + '<button class="btn sm" title="경로를 복사해 탐색기 주소창에 붙여넣으세요" '
          + 'onclick="copyPath(\'' + type + '\',\'' + it.id + '\')">📋 경로 복사</button>');
    }
    const text = it.desc || it.note || '';
    return '<div class="card">'
      + '<div class="ca">'
        + '<button class="btn sm" onclick="openItemModal(\'' + type + '\',\'' + it.id + '\')">수정</button>'
        + '<button class="btn sm danger" onclick="deleteItem(\'' + type + '\',\'' + it.id + '\')">삭제</button>'
      + '</div>'
      + '<div class="ct">' + esc(it.title) + '</div>'
      + (bits.length ? '<div class="row">' + bits.join('') + '</div>' : '')
      + (text ? '<div class="cd">' + esc(text) + '</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}

/* ============== 대시보드 파일을 NAS 공유폴더로 옮기기 ==============
   올린 파일을 실제 공유폴더 안으로 넣습니다.
   폴더를 눌러 고르거나, 파일을 끌어다 폴더 위에 놓으면 됩니다.
   ================================================================ */
let movePick = null;   // {assetId, dir, loading, error, folders, parent}

function startMove(assetId){
  const b = currentBrand();
  const a = (b.assets || []).find(x => x.id === assetId);
  if(!a || !a.filePath){ toast('⚠️ 옮길 수 있는 파일이 아닙니다'); return; }
  movePick = { assetId: assetId, loading:true };
  render();
  loadMovePick('');
}

function cancelMove(){ movePick = null; render(); }

async function loadMovePick(dir){
  const keep = movePick ? movePick.assetId : null;
  movePick = { assetId: keep, loading:true, dir:dir };
  render();
  try{
    const out = await apiJson('nasfiles.php?action=browse'
      + (dir ? '&dir=' + encodeURIComponent(dir) : ''));
    movePick = { assetId: keep, dir: out.dir, parent: out.parent,
                 root: out.root, folders: out.folders || [] };
  }catch(e){
    movePick = { assetId: keep, dir: dir, error: apiErrText(e) };
  }
  render();
}

async function doMove(dest){
  const b = currentBrand();
  const a = (b.assets || []).find(x => x.id === movePick.assetId);
  if(!a) { movePick = null; render(); return; }
  const name = a.fileName || a.title;
  movePick = null;
  render();
  toast('📦 "' + name + '" 옮기는 중…');
  try{
    const out = await apiJson('files.php?action=movetonas', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ path: a.filePath, dest: dest })
    });
    a.nasPath  = out['옮긴곳'];
    a.fileName = out['파일이름'] || a.fileName;
    a.filePath = '';                       // 이제 대시보드 폴더에는 없습니다
    await saveAll(true);
    render(); bindDrop();
    toast('✅ NAS 폴더로 옮겼습니다');
  }catch(e){
    alert('옮기지 못했습니다.\n\n' + apiErrText(e));
    render(); bindDrop();
  }
}

function movePanel(){
  if(!movePick) return '';
  const b = currentBrand();
  const a = (b.assets || []).find(x => x.id === movePick.assetId);

  let body;
  if(movePick.loading) body = '<div class="fmeta">불러오는 중…</div>';
  else if(movePick.error) body = '<div class="fmeta" style="white-space:pre-wrap">⚠️ '
    + esc(movePick.error) + '</div>';
  else if(!movePick.folders.length) body = '<div class="fmeta">이 안에는 하위 폴더가 없습니다. '
    + '여기에 넣으시려면 아래 버튼을 누르세요.</div>';
  else body = '<div class="fgrid">' + movePick.folders.map(f =>
      '<button class="fcard" onclick="loadMovePick(\'' + jsq(f.path) + '\')">'
      + '<span class="fc-ico">📁</span><span class="fc-t">'
      + '<span class="fc-nm">' + esc(f.name) + '</span>'
      + '<span class="fc-sub">' + f.count.toLocaleString('ko-KR') + '개</span>'
      + '</span></button>').join('') + '</div>';

  return '<div class="mbox" style="margin-bottom:14px;border-color:var(--blue)">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>📦 어느 폴더로 옮길까요?</span>'
      + '<span class="mhs">' + esc(a ? (a.fileName || a.title) : '') + '</span>'
      + '<span style="margin-left:auto"><button class="btn sm" onclick="cancelMove()">취소</button></span>'
    + '</div>'
    + '<div class="sec-bar" style="margin:0 0 10px">'
      + (movePick.parent
          ? '<button class="btn sm" onclick="loadMovePick(\'' + jsq(movePick.parent) + '\')">⬆ 위로</button>' : '')
      + (movePick.dir
          ? '<button class="btn primary" onclick="doMove(\'' + jsq(movePick.dir) + '\')">✅ 여기에 넣기</button>' : '')
    + '</div>'
    + '<div class="path" style="margin-bottom:8px">' + esc(movePick.dir || '') + '</div>'
    + body + '</div>';
}

/* 끌어다 놓기 — 파일을 폴더 줄 위에 놓으면 그리로 옮깁니다 */
function dragAsset(ev, assetId){
  ev.dataTransfer.setData('text/plain', 'asset:' + assetId);
  ev.dataTransfer.effectAllowed = 'move';
}
function allowDropAsset(ev){
  const t = ev.dataTransfer.getData('text/plain');
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  ev.currentTarget.classList.add('dragover');
}
function leaveDropAsset(ev){ ev.currentTarget.classList.remove('dragover'); }
async function dropOnFolder(ev, dir){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const d = ev.dataTransfer.getData('text/plain');
  if(!d.startsWith('asset:')) return;
  movePick = { assetId: d.slice(6) };
  doMove(dir);
}

/* ================= 자동화 도구 (실행되는 HTML 파일) =================
   생성기처럼 눌러서 쓰는 도구를 올려두고 바로 실행합니다.
   읽기용 문서(기록부)와 달리 스크립트가 그대로 살아 있어야 합니다.
   ================================================================== */
let runningTool = null;   // 지금 화면 안에서 실행 중인 도구 id

function toolUrl(t){
  return 'files.php?action=run&path=' + encodeURIComponent(t.filePath || '');
}

function pickTool(){
  if(STORAGE_MODE !== 'nas'){
    alert('도구 올리기는 NAS 주소로 접속했을 때만 됩니다.\n\n'
      + 'http://192.168.0.37/brand/brand.html 로 열어주세요.');
    return;
  }
  const el = document.getElementById('toolInput');
  if(el) el.click();
}

async function uploadTools(fileList){
  const b = currentBrand();
  if(!b) return;
  const files = Array.from(fileList || []);
  if(!files.length) return;
  b.tools = b.tools || [];

  for(const f of files){
    if(!/\.html?$/i.test(f.name)){
      alert('"' + f.name + '" 은 HTML 파일이 아닙니다. 도구는 .html 파일만 올릴 수 있습니다.');
      continue;
    }
    toast('🛠 "' + f.name + '" 올리는 중…');
    try{
      const fd = new FormData();
      fd.append('brand', b.name);
      fd.append('sub', '도구');
      fd.append('file', f);
      const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try{ out = JSON.parse(text); }catch(e){}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '업로드 실패');

      b.tools.unshift({ id: uid('t'), name: out.fileName, size: out.fileSize,
                        filePath: out.filePath || '', at: new Date().toISOString() });
    }catch(e){
      alert('"' + f.name + '" 을 올리지 못했습니다.\n\n' + (e.message || e));
    }
  }
  await saveAll(true);
  render();
  toast('✅ 도구를 올렸습니다');
}

function runToolHere(id){
  runningTool = (runningTool === id) ? null : id;
  render();
}

function removeTool(id){
  const b = currentBrand();
  if(!b) return;
  const t = (b.tools || []).find(x => x.id === id);
  if(!t) return;
  if(!confirm('"' + t.name + '" 을 목록에서 지울까요?\n\n'
    + 'NAS의 실제 파일은 자료 폴더에 그대로 남습니다.')) return;
  b.tools = b.tools.filter(x => x.id !== id);
  if(runningTool === id) runningTool = null;
  markDirty();
  render();
}

function renameTool(id){
  const b = currentBrand();
  const t = (b.tools || []).find(x => x.id === id);
  if(!t) return;
  const v = prompt('이 도구를 뭐라고 부를까요?', t.label || t.name.replace(/\.html?$/i, ''));
  if(v === null) return;
  t.label = v.trim();
  markDirty();
  render();
}

function viewTools(b){
  const list = b.tools || [];

  const bar = '<div class="sec-bar">'
    + '<button class="btn" onclick="pickTool()">🛠 도구 파일 올리기</button>'
    + '<span class="hint">생성기처럼 눌러서 쓰는 HTML 도구를 올려두면 여기서 바로 실행합니다</span>'
    + '</div>'
    + '<input type="file" id="toolInput" accept=".html,.htm" multiple style="display:none" '
      + 'onchange="const f=Array.from(this.files); this.value=\'\'; uploadTools(f)">';

  if(!list.length) return bar;

  const cards = list.map(t => {
    const on = runningTool === t.id;
    return '<div class="toolcard' + (on ? ' on' : '') + '">'
      + '<div class="tc-head">'
        + '<span class="tc-ic">🛠</span>'
        + '<span class="tc-nm">' + esc(t.label || t.name.replace(/\.html?$/i, '')) + '</span>'
        + '<span class="tc-meta">' + fmtSize(t.size || 0) + '</span>'
      + '</div>'
      + '<div class="row" style="margin-top:9px">'
        + '<a class="btn primary sm" href="' + esc(toolUrl(t)) + '" target="_blank" rel="noopener">▶ 실행</a>'
        + '<button class="btn sm" onclick="runToolHere(\'' + jsq(t.id) + '\')">'
          + (on ? '✕ 여기서 닫기' : '🖥 여기서 실행') + '</button>'
        + '<button class="btn sm" onclick="renameTool(\'' + jsq(t.id) + '\')">이름</button>'
        + '<button class="btn sm danger" onclick="removeTool(\'' + jsq(t.id) + '\')">지우기</button>'
      + '</div></div>';
  }).join('');

  const cur = list.find(t => t.id === runningTool);
  const frame = cur
    ? '<div class="toolrun">'
      + '<div class="tr-bar">'
        + '<span>🖥 ' + esc(cur.label || cur.name) + '</span>'
        + '<span style="margin-left:auto;display:flex;gap:5px">'
          + '<a class="btn sm" href="' + esc(toolUrl(cur)) + '" target="_blank" rel="noopener">↗ 새 탭에서 크게</a>'
          + '<button class="btn sm" onclick="runToolHere(\'' + jsq(cur.id) + '\')">닫기</button>'
        + '</span>'
      + '</div>'
      + '<iframe class="tr-frame" src="' + esc(toolUrl(cur)) + '" '
        + 'title="' + esc(cur.name) + '"></iframe>'
      + '</div>'
    : '';

  return bar + '<div class="toolgrid">' + cards + '</div>' + frame;
}

function fileIcon(name){
  const e = (String(name || '').split('.').pop() || '').toLowerCase();
  if(['pdf'].includes(e)) return '📕';
  if(['xlsx','xls','csv'].includes(e)) return '📗';
  if(['docx','doc','hwp','hwpx'].includes(e)) return '📘';
  if(['pptx','ppt'].includes(e)) return '📙';
  if(['png','jpg','jpeg','gif','webp','svg','heic'].includes(e)) return '🖼️';
  if(['zip','7z','rar'].includes(e)) return '🗜️';
  if(['mp4','mov','avi','mkv'].includes(e)) return '🎬';
  if(['dwg','dxf'].includes(e)) return '📐';
  return '📄';
}

function fmtSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  if(n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

              + '<button class="btn sm" onclick="copyPath(\'assets\',\'' + it.id + '\')">📋 경로 복사</button>');
        }
        return '<div class="card' + (isFile ? ' filecard' : '') + '"'
          + (canMove ? ' draggable="true" ondragstart="dragAsset(event,\'' + it.id + '\')"' : '') + '>'
          + '<div class="ca">'
            + (canMove
                ? '<button class="btn sm" title="NAS 공유폴더 안으로 옮깁니다" '
                  + 'onclick="startMove(\'' + it.id + '\')">📦 NAS로</button>' : '')
            + '<button class="btn sm" onclick="openItemModal(\'assets\',\'' + it.id + '\')">수정</button>'
            + '<button class="btn sm danger" onclick="deleteAsset(\'' + it.id + '\')">삭제</button>'
          + '</div>'
          + '<div class="row" style="margin:0 0 4px;flex-wrap:nowrap;align-items:flex-start">'
            + (isFile ? '<span class="fileicon">' + fileIcon(it.fileName) + '</span>' : '')
            + '<div style="min-width:0"><div class="ct">' + esc(it.title) + '</div>'
            + (isFile ? '<div class="fmeta">' + esc(it.fileName) + ' · ' + fmtSize(it.fileSize)
                 + (it.nasPath
                     ? '<br><span style="opacity:.75">' + esc(toWinPath(it.nasPath)) + '</span>'
                     : (it.filePath ? '<br><span style="opacity:.75">NAS: data\\files\\'
                         + esc(it.filePath.replace(/\//g, '\\')) + '</span>' : ''))
                 + '</div>' : '')
            + '</div></div>'
          + (bits.length ? '<div class="row">' + bits.join('') + '</div>' : '')
          + (it.note ? '<div class="cd">' + esc(it.note) + '</div>' : '')
          + '</div>';
      }).join('') + '</div>';

  const report = uploadReport.length
    ? '<div class="upqueue">' + uploadReport.map(r =>
        '<div class="upitem"><span class="fileicon">' + fileIcon(r.name) + '</span>'
        + '<span class="nm">' + esc(r.name) + '</span>'
        + '<span class="fmeta">' + fmtSize(r.size) + '</span>'
        + '<span class="st ' + (r.ok ? 'ok' : 'err') + '">'
        + (r.ok ? '완료' : '실패') + '</span></div>'
        + (r.ok ? '' : '<div class="fmeta" style="padding:0 12px 4px">' + esc(r.error) + '</div>')
      ).join('')
      + '<button class="btn sm" style="align-self:flex-start" onclick="clearReport()">결과 닫기</button>'
      + '</div>'
    : '';
  return dropZone + '<div class="upqueue" id="upQueue"></div>' + report
       + movePanel() + viewNasFolders(b) + bar + cards;
}

/* ========================= 브랜드에 연결한 NAS 폴더 =========================
   파일을 복사하지 않고, 있는 자리에서 바로 내려받습니다.
   ========================================================================== */
const nasFolderCache = {};   // 폴더경로 → 파일 목록

async function loadNasFolder(brandId, folderId, path, q){
  const key = folderId;
  nasFolderCache[key] = { loading:true };
  try{
    const url = 'nasfiles.php?action=under&dir=' + encodeURIComponent(path)
              + (q ? '&q=' + encodeURIComponent(q) : '');
    const out = await (await fetch(url, { cache:'no-store' })).json();
    if(!out.ok) throw new Error(out.error || '목록을 불러오지 못했습니다');
    nasFolderCache[key] = out;
  }catch(e){
    nasFolderCache[key] = { error: e.message };
  }
  if(currentTab === 'assets') { render(); bindDrop(); }
}

function viewNasFolders(b){
  if(treeCache === null) setTimeout(loadTree, 10);

  const auto   = autoFoldersFor(b);
  const list   = b.nasFolders || [];
  const hidden = b.nasHidden || [];
  const open   = openFolder[b.id] || null;
  const total  = auto.length + list.length;

  let note;
  if(treeCache && treeCache.loading)      note = 'NAS 폴더를 찾아보는 중…';
  else if(treeCache && treeCache.error)   note = '⚠️ ' + treeCache.error.split('\n')[0];
  else if(total)                          note = '폴더 이름을 눌러서 펼쳐 보세요 · 아래 파일을 끌어다 폴더 위에 놓으면 그리로 옮겨집니다';
  else if(hidden.length)                  note = '자동으로 찾은 폴더를 숨겨둔 상태입니다';
  else                                    note = '이름이 맞는 NAS 폴더를 찾지 못했습니다. 아래 버튼으로 직접 연결해 주세요';

  const head = '<div class="sec-bar" style="margin-top:6px">'
    + '<button class="btn" onclick="addNasFolder()">📂 NAS 폴더 직접 연결</button>'
    + (hidden.length
        ? '<button class="btn sm" onclick="unhideAll()">숨긴 폴더 ' + hidden.length + '개 다시 보기</button>'
        : '')
    + '<span class="hint">' + esc(note) + '</span>'
    + '</div>';

  if(!total) return head;

  /* 접힌 줄 하나 */
  const row = (o) => {
    const isOpen = open === o.path;
    const inner = isOpen
      ? '<div style="padding:12px 14px;border-top:1px solid var(--border)">'
        + (o.manual
            ? (o.q ? viewNasFolderSearch(b, o) : folderBrowserHtml('nf:' + o.id, o.path, { crumbRoot:o.path }))
            : folderBrowserHtml('auto:' + o.path, o.path, { crumbRoot:o.path }))
        + '</div>'
      : '';
    return '<div class="frow' + (isOpen ? ' on' : '') + '"'
      + ' ondragover="allowDropAsset(event)" ondragleave="leaveDropAsset(event)"'
      + ' ondrop="dropOnFolder(event,\'' + jsq(o.path) + '\')">'
      + '<button class="fhead" onclick="toggleFolder(\'' + jsq(b.id) + '\',\'' + jsq(o.path) + '\')">'
        + '<span class="fh-ar">' + (isOpen ? '▾' : '▸') + '</span>'
        + '<span class="fh-ic">' + (o.manual ? '📂' : '🪄') + '</span>'
        + '<span class="fh-nm">' + esc(o.name) + '</span>'
        + '<span class="fh-ct">' + (o.count !== null && o.count !== undefined
            ? o.count.toLocaleString('ko-KR') + '개' + (o.size ? ' · ' + esc(o.size) : '') : '') + '</span>'
      + '</button>'
      + (isOpen
          ? '<div class="fh-act">'
            + '<span class="path" style="flex:1;min-width:0;word-break:break-all">' + esc(o.path) + '</span>'
            + (o.manual
                ? '<button class="btn sm" onclick="filterNasFolder(\'' + jsq(b.id) + '\',\'' + jsq(o.id) + '\')">'
                  + (o.q ? '🔍 ' + esc(o.q) : '🔍 찾기') + '</button>'
                  + (o.q ? '<button class="btn sm" onclick="clearNasFolderFilter(\'' + jsq(b.id) + '\',\''
                           + jsq(o.id) + '\')">✕</button>' : '')
                  + '<button class="btn sm danger" onclick="removeNasFolder(\'' + jsq(o.id) + '\')">연결 해제</button>'
                : '<button class="btn sm" onclick="hideAutoFolder(\'' + jsq(o.path) + '\')">숨기기</button>')
            + '</div>'
          : '')
      + inner + '</div>';
  };

  const rows = auto.map(f => row({ name:f.name, path:f.path, count:f.count, size:f.size, manual:false }))
    .concat(list.map(f => row({ name:(f.label || f.path.split('/').pop()), path:f.path,
                               count:null, size:null, manual:true, id:f.id, q:f.q })))
    .join('');

  return head
    + '<div class="fmeta" style="margin:0 0 8px">폴더 ' + total + '개'
      + (open ? '' : ' · 눌러서 펼치기') + '</div>'
    + '<div class="flist">' + rows + '</div>';
}

/* 폴더 안에서 이름으로 찾은 결과 (직접 연결한 폴더 전용) */
function viewNasFolderSearch(b, o){
  const c = nasFolderCache[o.id];
  if(!c) { setTimeout(() => loadNasFolder(b.id, o.id, o.path, o.q), 10); }
  if(!c || c.loading) return '<div class="fmeta">불러오는 중…</div>';
  if(c.error) return '<div class="fmeta">⚠️ ' + esc(c.error) + '</div>';
  if(!c.results.length) return '<div class="fmeta">"' + esc(o.q) + '" 에 맞는 파일이 없습니다.</div>';
  return '<div class="mbox">' + c.results.map(x =>
      '<div class="krow" style="align-items:center">'
      + '<span class="fileicon" style="font-size:15px">' + fileIcon(x.name) + '</span>'
      + '<span style="flex:1;min-width:0;white-space:normal;word-break:break-all">'
        + '<b style="color:var(--text-primary)">' + esc(x.name) + '</b>'
        + (x.sub ? '<span class="fmeta"> · ' + esc(x.sub) + '</span>' : '')
      + '</span>'
      + '<span class="fmeta" style="white-space:nowrap;margin:0">'
        + esc(x.size) + ' · ' + esc(x.date) + '</span>'
      + '<a class="btn sm" href="nasfiles.php?action=download&path='
        + encodeURIComponent(x.path) + '">⬇</a>'
      + '</div>').join('')
    + (c.matched > c.shown
        ? '<div class="fmeta" style="margin-top:8px">전체 ' + c.matched.toLocaleString('ko-KR')
          + '개 중 ' + c.shown + '개 표시 · 검색어를 더 좁혀보세요</div>' : '')
    + '</div>';
}

function clearNasFolderFilter(brandId, id){
  const b = currentBrand();
  const f = b.nasFolders.find(x => x.id === id);
  if(!f) return;
  f.q = '';
  delete nasFolderCache[id];
  markDirty();
  redraw();
}

async function addNasFolder(){
  const b = currentBrand();
  if(!b) return;
  const path = prompt(
    'NAS 폴더 경로를 넣어주세요.\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\\공법\n\n'
    + '🗂️ NAS 자료 화면에서 그 폴더까지 들어간 뒤 [＋ 브랜드에 연결] 을 쓰시면 더 편합니다.');
  if(path === null) return;
  if(!path.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  let p;
  try{
    const out = await apiJson('nasfiles.php?action=resolve&path=' + encodeURIComponent(path));
    p = out.dir;
  }catch(e){
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n') : ''));
    return;
  }

  if(b.nasFolders.some(x => x.path === p)){ toast('이미 연결된 폴더입니다'); return; }
  const label = prompt('이 폴더를 뭐라고 부를까요? (비우면 폴더 이름 사용)',
                       p.split('/').pop()) || '';
  b.nasFolders.push({ id: uid('nf'), path: p, label: label.trim(), q: '' });
  markDirty();
  redraw();
  toast('📂 폴더를 연결했습니다');
}

function removeNasFolder(id){
  const b = currentBrand();
  const f = b.nasFolders.find(x => x.id === id);
  if(!confirm('"' + (f.label || f.path) + '" 연결을 해제할까요?\n\n'
    + 'NAS의 실제 파일은 그대로 남습니다. 목록에서만 사라집니다.')) return;
  b.nasFolders = b.nasFolders.filter(x => x.id !== id);
  delete nasFolderCache[id];
  render(); bindDrop(); markDirty();
}

function refreshNasFolder(brandId, id){
  const f = currentBrand().nasFolders.find(x => x.id === id);
  delete nasFolderCache[id];
  loadNasFolder(brandId, id, f.path, f.q || '');
  toast('↻ 다시 불러옵니다');
}

function filterNasFolder(brandId, id){
  const b = currentBrand();
  const f = b.nasFolders.find(x => x.id === id);
  const q = prompt('이 폴더 안에서 찾을 이름을 넣어주세요. (비우면 전체)', f.q || '');
  if(q === null) return;
  f.q = q.trim();
  delete nasFolderCache[id];
  markDirty();
  if(f.q) loadNasFolder(brandId, id, f.path, f.q);
  else redraw();
}

function statusChip(st){
  const map = { '진행 중':'test', '성공':'on', '실패':'off', '중단':'off', '보류':'' };
  return st ? '<span class="chip ' + (map[st] || '') + '">' + esc(st) + '</span>' : '';
}

function viewTasks(b){
  const list = b.tasks;
  if(!list.length) return secBar('tasks') + '<div class="empty">' + TYPES.tasks.empty + '</div>';

  const order = { '진행 중':0, '예정':1, '보류':2, '완료':3 };
  const sorted = list.slice().sort((x, y) => {
    const d = (order[x.status] ?? 1) - (order[y.status] ?? 1);
    if(d) return d;
    if(x.due && y.due) return x.due.localeCompare(y.due);
    return x.due ? -1 : y.due ? 1 : 0;
  });

  const today = new Date().toISOString().slice(0,10);
  const dueChip = t => {
    if(!t.due || t.status === '완료') return '';
    const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
    const label = fmtDate(t.due);
    if(days < 0)  return '<span class="chip off">지남 · ' + esc(label) + '</span>';
    if(days <= 3) return '<span class="chip test">D-' + days + ' · ' + esc(label) + '</span>';
    return '<span class="chip">' + esc(label) + '</span>';
  };
  const stChip = st => {
    const m = { '진행 중':'test', '완료':'on', '보류':'', '예정':'' };
    return '<span class="chip ' + (m[st] || '') + '">' + esc(st || '예정') + '</span>';
  };

  return secBar('tasks') + '<div class="cards">' + sorted.map(t =>
    '<div class="card' + (t.status === '완료' ? ' done' : '') + '">'
    + '<div class="ca">'
      + (t.status !== '완료'
          ? '<button class="btn sm" title="완료 처리" onclick="toggleTask(\'' + t.id + '\')">✓ 완료</button>'
          : '<button class="btn sm" title="다시 진행" onclick="toggleTask(\'' + t.id + '\')">되돌리기</button>')
      + '<button class="btn sm" onclick="openItemModal(\'tasks\',\'' + t.id + '\')">수정</button>'
      + '<button class="btn sm danger" onclick="deleteItem(\'tasks\',\'' + t.id + '\')">삭제</button>'
    + '</div>'
    + '<div class="ct">' + esc(t.title) + '</div>'
    + '<div class="row">' + stChip(t.status) + dueChip(t)
      + (t.owner ? '<span class="chip">' + esc(t.owner) + '</span>' : '') + '</div>'
    + (t.note ? '<div class="cd">' + esc(t.note) + '</div>' : '')
    + '</div>').join('') + '</div>';
}

function toggleTask(id){
  const t = currentBrand().tasks.find(x => x.id === id);
  t.status = t.status === '완료' ? '진행 중' : '완료';
  t.updatedAt = new Date().toISOString();
  render(); markDirty();
}

function viewLinks(b){
  const list = b.links;
  if(!list.length) return secBar('links') + '<div class="empty">' + TYPES.links.empty + '</div>';

  // 분류별로 묶고, 입력창의 분류 순서대로 보여줍니다
  const order = TYPES.links.fields.find(f => f.key === 'kind').options;
  const groups = {};
  list.forEach(l => { (groups[l.kind || '기타'] = groups[l.kind || '기타'] || []).push(l); });
  const ordered = Object.entries(groups).sort((a, b) => {
    const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  return secBar('links') + ordered.map(([kind, items]) =>
    '<div style="margin-bottom:18px">'
    + '<div class="hsec" style="margin:0 0 9px">' + esc(kind) + '</div>'
    + '<div class="cards">' + items.map(l => {
        const show = l.preview !== '안 보기' && isUrl(l.url);
        return '<div class="card linkcard' + (show ? ' haspv' : '') + '">'
        + '<div class="ca">'
          + (show ? '<button class="btn sm" title="미리보기 새로고침" '
                    + 'onclick="reloadPreview(\'' + l.id + '\')">↻</button>' : '')
          + '<button class="btn sm" onclick="openItemModal(\'links\',\'' + l.id + '\')">수정</button>'
          + '<button class="btn sm danger" onclick="deleteItem(\'links\',\'' + l.id + '\')">삭제</button>'
        + '</div>'
        + (show
            ? '<a class="pvwrap" href="' + esc(l.url) + '" target="_blank" rel="noopener" '
              + 'title="클릭하면 새 탭에서 열립니다">'
              + '<iframe class="pv" id="pv_' + l.id + '" src="' + esc(l.url) + '" '
                + 'loading="lazy" sandbox="allow-scripts allow-same-origin" '
                + 'referrerpolicy="no-referrer" scrolling="no" tabindex="-1"></iframe>'
              + '<span class="pvmask"></span></a>'
            : '')
        + '<a class="ct" href="' + esc(l.url) + '" target="_blank" rel="noopener">'
          + esc(l.title) + ' <span class="go">↗</span></a>'
        + (l.desc ? '<div class="cd">' + esc(l.desc) + '</div>' : '')
        + '<div class="fmeta" style="margin-top:8px">'
          + esc(l.url.replace(/^https?:\/\//,'').slice(0,60)) + '</div>'
        + '</div>';
      }).join('') + '</div></div>').join('')
    + '<div class="fmeta" style="margin-top:14px">'
      + '미리보기가 빈 화면으로 나오면 그 사이트가 외부 표시를 막아둔 것입니다. '
      + '(네이버·구글 애널리틱스 등) 이때는 수정에서 미리보기를 「안 보기」로 바꿔주세요.'
      + '</div>';
}

function reloadPreview(id){
  const f = document.getElementById('pv_' + id);
  if(f) f.src = f.src;   // 같은 주소를 다시 넣어 새로 불러옵니다
  toast('↻ 미리보기를 새로 불러옵니다');
}

/* ========================= 문의 =========================
   구글시트의 문의 기록을 n8n 등으로 NAS에 밀어 넣으면 여기에 표시됩니다.
   시트를 외부에 공개하지 않아도 되고, 대시보드에는 읽기 전용으로 보입니다.
   ======================================================== */
const inquiryCache = { loaded:false, loading:false, updatedAt:null, total:0,
                       columns:[], byBrand:{}, error:null };
let inquiryQuery = '';

const SYNC_INTERVAL_MIN = 5;   // 이 시간이 지났으면 탭을 열 때 알아서 다시 가져옵니다

async function syncInquiries(manual){
  if(STORAGE_MODE !== 'nas') return;
  const stat = document.getElementById('csvStat');
  if(stat) stat.textContent = '시트에서 가져오는 중…';
  try{
    const res = await fetch('inquiries.php?action=sync', { cache:'no-store' });
    const t = await res.text();
    let out = null;
    try { out = JSON.parse(t); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '가져오지 못했습니다');
    inquiryCache.loaded = false;
    await loadInquiries(true);
    if(manual) toast('↻ 시트에서 ' + out['가져온건수'] + '건을 가져왔습니다');
  }catch(e){
    if(manual) showError('시트를 가져오지 못했습니다: ' + e.message);
    else inquiryCache.syncError = e.message;
  }finally{
    const st = document.getElementById('csvStat');
    if(st) st.textContent = '';
  }
}

/* ---------- 연결된 시트 관리 (브랜드마다 다른 시트를 붙일 수 있습니다) ---------- */
let sheetPanel = null;   // null=닫힘 | {loading} | {sources:[...]}

  sheetPanel = { loading:true };

    const out = await apiJson('inquiries.php?action=sources');

async function saveSheets(list){

  const pick = prompt(

    + '시트에 「브랜드」 열이 있으면 0을 넣으세요 (열을 보고 알아서 나눕니다).\n'

  if(pick === null) return;

  let brand = '';
  const n = parseInt(pick, 10);
  if(n > 0){
    const b = data.brands[n - 1];
    if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }
    brand = b.name;
  }

  const list = (sheetPanel && sheetPanel.sources ? sheetPanel.sources.slice() : []);
  list.push({ name: name.trim(), url: url.trim(), brand: brand });
  await saveSheets(list);
}

    s.brand ? String(data.brands.findIndex(b => b.name === s.brand) + 1) : '0');

async function loadInquiries(force){
  if(STORAGE_MODE !== 'nas'){ inquiryCache.loaded = true; return; }
  if(inquiryCache.loading || (inquiryCache.loaded && !force)) return;
  inquiryCache.loading = true;
  if(inquiryCache.sheetCount === undefined) setTimeout(loadSheetCount, 10);
  try{
    const res = await fetch('inquiries.php?action=list&t=' + Date.now(), { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '불러오지 못했습니다');

    const by = {};
    const norm = v => String(v || '').replace(/\s/g, '');
    (out.rows || []).forEach(r => {
      const bn = r['브랜드'] || r['brand'] || r['Brand'] || r['브랜드명'] || '';
      (by[norm(bn)] = by[norm(bn)] || []).push(r);
    });
    // 대시보드의 브랜드 이름 기준으로 다시 담습니다
    inquiryCache.byBrand = {};
    data.brands.forEach(b => { inquiryCache.byBrand[b.name] = by[norm(b.name)] || []; });

    inquiryCache.columns   = out.columns || [];
    inquiryCache.updatedAt = out.updatedAt;
    inquiryCache.total     = out.total || 0;
    inquiryCache.error     = null;

    // 연결된 시트 주소를 함께 확인합니다
    try{
      const c = await (await fetch('inquiries.php?action=check', { cache:'no-store' })).json();
      inquiryCache.sheetUrl = c['연결된시트'] || '연결 안 됨';
    }catch(e){ inquiryCache.sheetUrl = '확인 불가'; }

    // 마지막으로 가져온 지 오래됐으면 조용히 다시 가져옵니다
    const linked = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨';
    const old = !out.updatedAt ||
      (Date.now() - new Date(out.updatedAt).getTime()) > SYNC_INTERVAL_MIN * 60000;
    if(linked && old && !inquiryCache.autoSyncing){
      inquiryCache.autoSyncing = true;
      setTimeout(() => { syncInquiries(false).finally(() => { inquiryCache.autoSyncing = false; }); }, 50);
    }
  }catch(e){
    inquiryCache.error = e.message;
    // 목록을 못 불러와도 연결 상태는 따로 확인해 둡니다
    try{
      const c = await (await fetch('inquiries.php?action=check', { cache:'no-store' })).json();
      inquiryCache.sheetUrl = c['연결된시트'] || '연결 안 됨';
    }catch(e2){ inquiryCache.sheetUrl = '연결 안 됨'; }
  }finally{
    inquiryCache.loading = false;
    inquiryCache.loaded  = true;
    if(!searchQuery && (currentTab === 'inquiries' || !currentBrandId)) render();
  }
}

/* 구글시트에서 내려받은 CSV를 읽습니다 (따옴표·줄바꿈 포함된 셀도 처리) */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // 엑셀 BOM 제거
  const rows = [];
  let row = [], cell = '', inQuote = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuote){
      if(c === '"'){
        if(text[i + 1] === '"'){ cell += '"'; i++; }
        else inQuote = false;
      } else cell += c;
    }else{
      if(c === '"') inQuote = true;
      else if(c === ',') { row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c !== '\r') cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

function csvToObjects(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('내용이 없습니다. 머리글 줄과 데이터가 있어야 합니다.');
  const head = rows[0].map(h => String(h).trim());
  if(!head.some(h => ['브랜드','brand','Brand','브랜드명'].includes(h)))
    throw new Error('브랜드 열을 찾지 못했습니다. 첫 줄에 「브랜드」 열이 있어야 합니다. '
      + '(찾은 열: ' + head.filter(Boolean).join(', ') + ')');
  return rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, i) => { if(h) o[h] = (r[i] || '').trim(); });
    return o;
  });
}

  }
}

/* 시트의 열 구성을 몰라도 되게, 값을 보고 성격을 추측합니다.
   - 날짜처럼 생긴 열 → 기간 집계에 사용
   - 값 종류가 적은 짧은 열(상태·공종·유입 등) → 분류 집계에 사용
   - 이름·연락처·내용처럼 값이 제각각인 열 → 집계에서 제외 */
function diffTag(v){
  if(v === null || v === undefined) return '';
  const up = v >= 0;
  return '<span class="delta ' + (up ? 'up' : 'down') + '">'
       + (up ? '▲' : '▼') + Math.abs(v) + '%</span>';
}

function bars(items, valueKey){
  const max = Math.max(...items.map(x => x[valueKey] || 0), 1);
  return '<div class="bars">' + items.map(x =>
    '<div class="bar-row"><span class="bl" title="' + esc(x.label) + '">' + esc(x.label) + '</span>'
    + '<span class="bt"><span class="bf" style="width:'
      + Math.round((x[valueKey] || 0) / max * 100) + '%"></span></span>'
    + '<span class="bv">' + (x[valueKey] || 0).toLocaleString('ko-KR') + '</span></div>').join('')
    + '</div>';
}

function analyzeInquiries(rows){
  const skip = ['브랜드','brand','Brand','브랜드명'];
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if(!cols.includes(k)) cols.push(k); }));

  const looksDate = v => parseYMD(v) !== null;

  // 날짜 열이 여러 개일 수 있습니다 (접수날짜 / 접수시간 / 접수일시 …).
  // 그중 "값이 가장 많이 채워진" 열을 씁니다.
  // 최근 건만 한쪽 열이 비어 있으면, 그 열을 고를 경우 최신 기록을 놓치기 때문입니다.
  const dateHits = {};
  cols.forEach(c => { dateHits[c] = rows.reduce((a, r) => a + (looksDate(r[c]) ? 1 : 0), 0); });

  const pickDateCol = (list) => {
    let best = null, n = 0;
    list.forEach(c => { if(dateHits[c] > n){ n = dateHits[c]; best = c; } });
    return n > 0 ? best : null;
  };
  const named = cols.filter(c => /날짜|일자|일시|시각|등록|접수|date|time/i.test(c));
  let dateCol = pickDateCol(named);
  // 이름으로 고른 열이 절반도 안 채워져 있으면 전체에서 다시 고릅니다
  if(!dateCol || dateHits[dateCol] < rows.length * 0.5){
    const any = pickDateCol(cols);
    if(any && dateHits[any] > (dateCol ? dateHits[dateCol] : 0)) dateCol = any;
  }

  // 이름·연락처처럼 사람마다 다른 값은 집계에 쓰지 않습니다
  const isPrivate = c => /이름|성함|고객명|담당자|연락처|전화|휴대|번호|이메일|메일|주소/.test(c);

  // 먼저 설명 열(문의 내용 등)을 정합니다 — 가장 길게 적히는 열
  let textCol = null, bestLen = 0;
  const dateish0 = c => /날짜|일자|일시|시각|시간|date|time/i.test(c)
    || (rows.length && dateHits[c] >= rows.length * 0.3);
  cols.forEach(c => {
    if(skip.includes(c) || c === dateCol || isPrivate(c) || dateish0(c)) return;
    const vals = rows.map(r => String(r[c] || '').trim()).filter(Boolean);
    if(!vals.length) return;
    const avg = vals.reduce((a, v) => a + v.length, 0) / vals.length;
    if(avg > bestLen){ bestLen = avg; textCol = c; }
  });
  if(bestLen < 12) textCol = null;      // 다들 짧으면 설명 열이 없는 것으로 봅니다

  // 사람이 읽을 분류가 아닌 열은 뺍니다.
  //  · 시트를 만든 프로그램이 붙인 열 (hasFiles, fileCount, id, timestamp …)
  //  · 예/아니오, 숫자만 들어 있는 열
  const hasHangul = c => /[가-힣]/.test(c);
  const isBoolish = vals => vals.every(v =>
    /^(true|false|y|n|yes|no|예|아니오|아니요|o|x|0|1)$/i.test(v));
  const isNumeric = vals => vals.every(v => /^-?\d+(\.\d+)?$/.test(v));

  // 나머지 중 같은 값이 반복되는 짧은 열을 분류로 봅니다 (공종·유입·상태 등)
  const cats = [];
  // 날짜·시간 열은 분류가 아닙니다 (접수날짜·접수시간·접수일시 …)
  const isDateish = c => /날짜|일자|일시|시각|시간|date|time/i.test(c)
    || (rows.length && dateHits[c] >= rows.length * 0.3);

  cols.forEach(c => {
    if(skip.includes(c) || c === dateCol || c === textCol || isPrivate(c)) return;
    if(isDateish(c)) return;
    if(!hasHangul(c)) return;                                   // 영문 열 이름은 프로그램용으로 봅니다
    const vals = rows.map(r => String(r[c] || '').trim()).filter(Boolean);
    if(vals.length < rows.length * 0.2) return;                 // 대부분 비어 있으면 제외
    if(isBoolish(vals) || isNumeric(vals)) return;              // 예/아니오·숫자만 있는 열 제외
    const uniq = new Set(vals);
    const avgLen = vals.reduce((a, v) => a + v.length, 0) / vals.length;
    if(uniq.size >= 2 && uniq.size <= 20 && uniq.size < vals.length * 0.8 && avgLen <= 15){
      cats.push({ col:c, uniq:uniq.size });
    }
  });
  cats.sort((a, b) => a.uniq - b.uniq);                          // 종류가 적은 것부터

  return { cols, dateCol, cats: cats.map(x => x.col).slice(0, 6), textCol };
}

/* 문의 날짜를 진짜 날짜로 읽습니다.
   "2026. 8. 7" 처럼 0을 안 붙인 날짜가 섞이면 글자로 비교할 때
   8월 7일이 8월 21일보다 최신으로 잡혀서, 반드시 숫자로 바꿔 비교합니다. */
function parseYMD(v){
  const s = String(v || '').trim();
  if(!s) return null;
  let m = s.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/);          // 8/21/2026
  if(m) return new Date(+m[3], +m[1] - 1, +m[2]);
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);                        // 20260821
  if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  // 전화번호(010-1234-5678)나 "27개동, 1,786세대" 같은 값을 날짜로 오해하지 않도록
  // 네 자리 연도가 들어 있는 값만 마지막으로 한 번 더 봅니다.
  if(s.length > 40 || !/(^|\D)(19|20)\d{2}(\D|$)/.test(s)) return null;
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}

function dateNum(v){
  const d = parseYMD(v);
  return d ? d.getTime() : -Infinity;
}

function fmtYMD(v){
  const d = parseYMD(v);
  if(!d) return String(v || '');
  return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate();
}

function ym(v){
  const d = parseYMD(v);
  return d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') : '';
}

function countBy(rows, col){
  const m = {};
  rows.forEach(r => {
    const v = String(r[col] || '').trim() || '미입력';
    m[v] = (m[v] || 0) + 1;
  });
  // 미입력은 분류가 아니므로 맨 뒤로 보냅니다
  return Object.entries(m).map(([label, count]) => ({ label, count }))
    .sort((a, b) => (a.label === '미입력') - (b.label === '미입력') || b.count - a.count);
}

function inquirySummary(rows){
  const a = analyzeInquiries(rows);
  const now = new Date();
  const thisYM = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevYM = prev.getFullYear() + '-' + String(prev.getMonth() + 1).padStart(2, '0');

  // 이번 달이 아직 진행 중이면, 지난달도 "같은 날짜까지만" 세어야 비교가 맞습니다
  const today = now.getDate();
  const dayOf = v => { const d = parseYMD(v); return d ? d.getDate() : 0; };

  let thisMonth = 0, lastMonth = 0, lastMonthFull = 0, latest = '', latestNum = -Infinity;
  if(a.dateCol){
    rows.forEach(r => {
      const k = ym(r[a.dateCol]);
      if(k === thisYM) thisMonth++;
      if(k === prevYM){
        lastMonthFull++;
        if(dayOf(r[a.dateCol]) <= today) lastMonth++;
      }
      const t = dateNum(r[a.dateCol]);
      if(t > latestNum){ latestNum = t; latest = fmtYMD(r[a.dateCol]); }
    });
  }
  return Object.assign(a, { thisMonth, lastMonth, lastMonthFull, latest, thisYM, prevYM, today });
}

function viewInquiries(b){

  // 전체 표 (접어둠)
  const cols = inquiryCache.columns.filter(c => !['브랜드','brand','Brand','브랜드명'].includes(c));
  const table = inquiryShowTable

      + shown.slice(0, 500).map(r => '<tr>'
          + cols.map(c => '<td>' + highlight(r[c] || '', inquiryQuery) + '</td>').join('')
          + '</tr>').join('')
      + '</table></div>'
      + (shown.length > 500
          ? '<div class="fmeta" style="margin-top:8px">화면에는 500건까지만 표시합니다</div>' : '')

  return bar
    + (q ? '<div class="fmeta" style="margin-bottom:10px">검색 결과 ' + shown.length + '건</div>' : '')
    + '<div class="stats">' + tiles + '</div>'

/* ---------- 기록부 문서를 대시보드 디자인으로 다시 그립니다 ----------
   문서의 원래 색과 글꼴은 쓰지 않고, 글의 뼈대(제목·문단·목록·표)만
   가져와 이 화면 스타일로 보여줍니다. 원본은 [새 탭에서 보기] 로 볼 수 있습니다.
   ------------------------------------------------------------------ */
function recordUrl(rec){
  return rec.filePath
    ? 'files.php?action=view&path=' + encodeURIComponent(rec.filePath)
    : 'files.php?action=view&id='   + encodeURIComponent(rec.id);
}

const recordCache = {};      // 문서 id → {loading} | {error} | {title, secs}
const secOpen     = {};      // 섹션 번호 → 펼침 여부
let   allSecOpen  = false;   // 처음엔 접어둡니다

function toggleAllSections(){
  allSecOpen = !allSecOpen;
  Object.keys(secOpen).forEach(k => { delete secOpen[k]; });
  render();
}
function toggleSection(i){
  secOpen[i] = (secOpen[i] !== undefined) ? !secOpen[i] : !allSecOpen;
  render();
}

/* 남길 태그와 속성만 남기고 나머지는 버립니다 (색·글꼴·스크립트 제거) */
const DOC_OK_TAGS = ['P','UL','OL','LI','STRONG','B','EM','I','CODE','PRE','BLOCKQUOTE',
  'HR','TABLE','THEAD','TBODY','TR','TH','TD','BR','A','IMG','SMALL','MARK','H4','H5','DL','DT','DD'];

function cleanNode(node, out){
  node.childNodes.forEach(n => {
    if(n.nodeType === 3){ out.push(esc(n.nodeValue)); return; }
    if(n.nodeType !== 1) return;
    const tag = n.tagName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'LINK' || tag === 'NOSCRIPT') return;

    if(DOC_OK_TAGS.indexOf(tag) < 0){          // 모르는 태그는 껍데기만 벗기고 속은 살립니다
      out.push(' ');                            // 붙어버리지 않게 사이를 띄웁니다
      cleanNode(n, out);
      out.push(' ');
      return;
    }
    if(tag === 'BR' || tag === 'HR'){ out.push('<' + tag.toLowerCase() + '>'); return; }
    if(tag === 'IMG'){
      const src = n.getAttribute('src') || '';
      if(/^(https?:|data:image\/)/i.test(src))
        out.push('<img src="' + esc(src) + '" alt="' + esc(n.getAttribute('alt') || '') + '">');
      return;
    }
    let open = '<' + tag.toLowerCase();
    if(tag === 'A'){
      const href = n.getAttribute('href') || '';
      if(/^(https?:|mailto:|#)/i.test(href))
        open += ' href="' + esc(href) + '" target="_blank" rel="noopener"';
    }
    if(tag === 'TD' || tag === 'TH'){
      ['colspan','rowspan'].forEach(a => {
        const v = n.getAttribute(a);
        if(v && /^\d+$/.test(v)) open += ' ' + a + '="' + v + '"';
      });
    }
    out.push(open + '>');
    cleanNode(n, out);
    out.push('</' + tag.toLowerCase() + '>');
  });
}

/* 문서를 h2 기준으로 잘라 섹션 목록을 만듭니다 */
function parseRecordDoc(text){
  const doc  = new DOMParser().parseFromString(text, 'text/html');
  doc.querySelectorAll('script,style,link,noscript,nav,[class*="toc"]').forEach(e => e.remove());

  const title = (doc.title || doc.querySelector('h1')?.textContent || '브랜드 기록부').trim();
  const body  = doc.body || doc.documentElement;

  const secs = [];
  let cur = null;
  const walk = (parent) => {
    Array.from(parent.children).forEach(el => {
      const t = el.tagName;
      if(t === 'H1'){ return; }
      if(t === 'H2'){
        cur = { title: el.textContent.trim(), subs: [], parts: [], lead: '' };
        secs.push(cur);
        return;
      }
      if(t === 'H3'){
        if(!cur){ cur = { title:'', subs:[], parts:[], lead:'' }; secs.push(cur); }
        const s = el.textContent.trim();
        cur.subs.push(s);
        cur.parts.push('<h4 class="doc-h3">' + esc(s) + '</h4>');
        return;
      }
      // 감싸고만 있는 상자는 안으로 들어갑니다
      if((t === 'DIV' || t === 'SECTION' || t === 'ARTICLE' || t === 'MAIN' || t === 'HEADER')
         && el.querySelector('h2, h3')){ walk(el); return; }

      if(!el.textContent.trim() && !el.querySelector('img,hr')) return;
      if(!cur){ cur = { title:'', subs:[], parts:[], lead:'' }; secs.push(cur); }
      cur.parts.push(wrapEl(el));
      if(!cur.lead && t === 'P'){
        const txt = el.textContent.replace(/\s+/g, ' ').trim();
        if(txt.length > 12) cur.lead = txt;
      }
    });
  };
  const wrapEl = (el) => {
    const o = [];
    cleanNode(el, o);
    const inner = o.join('').replace(/[ \t]{2,}/g, ' ').replace(/> </g, '><');
    const t = el.tagName.toLowerCase();
    if(t === 'p')  return '<p>' + inner + '</p>';
    if(t === 'ul' || t === 'ol') return '<' + t + '>' + inner + '</' + t + '>';
    if(t === 'table') return '<div class="doc-tw"><table>' + inner + '</table></div>';
    if(t === 'blockquote') return '<blockquote>' + inner + '</blockquote>';
    if(t === 'hr') return '<hr>';
    return '<div class="doc-p">' + inner + '</div>';
  };
  walk(body);

  return { title: title, secs: secs.filter(x => x.parts.length || x.title) };
}

async function loadRecord(rec){
  const id = rec.id;
  recordCache[id] = { loading:true };
  try{
    const res  = await fetch(recordUrl(rec), { cache:'no-store' });
    const text = await res.text();
    if(/^\s*\{/.test(text)){
      const j = JSON.parse(text);
      throw new Error(j.error || '문서를 불러오지 못했습니다');
    }
    recordCache[id] = parseRecordDoc(text);
  }catch(e){
    recordCache[id] = { error: e.message || String(e) };
  }
  render();
}

function recordView(rec){
  const c = recordCache[rec.id];
  if(!c){ setTimeout(() => loadRecord(rec), 10); return '<div class="fmeta">문서를 불러오는 중…</div>'; }
  if(c.loading) return '<div class="fmeta">문서를 불러오는 중…</div>';
  if(c.error)   return '<div class="empty">⚠️ ' + esc(c.error) + '</div>';
  if(!c.secs.length) return '<div class="empty">문서에서 읽을 내용을 찾지 못했습니다.</div>';

  const cut = (t, n) => t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;

  const body = c.secs.map((sc, i) => {
    const open  = (secOpen[i] !== undefined) ? secOpen[i] : allSecOpen;
    const title = sc.title || '들어가며';

    return '<div class="jsec' + (open ? ' on' : '') + '" id="dsec' + i + '">'
      + '<div class="jdot">' + (i + 1) + '</div>'
      + '<button class="jhead" onclick="toggleSection(' + i + ')">'
        + '<div class="jh-top">'
          + '<span class="jh-title">' + esc(title) + '</span>'
          + '<span class="jh-ar">' + (open ? '접기 ▾' : '펼치기 ▸') + '</span>'
        + '</div>'
        + (sc.lead && !open
            ? '<div class="jh-lead">' + esc(cut(sc.lead, 120)) + '</div>' : '')
        + (sc.subs.length && !open
            ? '<div class="jh-subs">' + sc.subs.map(x =>
                '<span class="jh-sub">' + esc(x) + '</span>').join('') + '</div>'
            : '')
      + '</button>'
      + (open ? '<div class="doc-body">' + sc.parts.join('') + '</div>' : '')
      + '</div>';
  }).join('');

  return '<div class="doc-title">' + esc(c.title) + '</div>'
    + '<div class="fmeta" style="margin:-8px 0 16px">'
      + c.secs.length + '단계 · 제목을 누르면 그 대목이 펼쳐집니다</div>'
    + '<div class="jtl">' + body + '</div>';
}

function jumpSection(i){
  if(secOpen[i] === false) delete secOpen[i];
  if(!allSecOpen) secOpen[i] = true;
  render();
  const el = document.getElementById('dsec' + i);
  if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function pickRecord(){
  if(STORAGE_MODE !== 'nas'){
    alert('문서 올리기는 NAS 주소로 접속했을 때만 됩니다.\n\n'
      + 'http://192.168.0.37/brand/brand.html 로 열어주세요.');
    return;
  }
  const el = document.getElementById('recInput');
  if(el) el.click();
}

async function uploadRecord(file){
  if(!file) return;
  const b = currentBrand();
  if(!b) return;
  toast('📄 문서를 올리는 중…');
  try{
    const fd = new FormData();
    fd.append('brand', b.name);
    fd.append('sub', '기록부');
    fd.append('file', file);
    const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
    const text = await res.text();
    let out = null;
    try{ out = JSON.parse(text); }catch(e){}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
      + text.slice(0, 200).replace(/\s+/g, ' '));
    if(!out.ok) throw new Error(out.error || '업로드 실패');

    b.record = { id: out.fileId, name: out.fileName, size: out.fileSize,
                 filePath: out.filePath || '', at: new Date().toISOString() };
    // 자료 탭에서도 내려받을 수 있게 함께 넣어둡니다
    b.assets.unshift({ id: uid('i'), title: out.fileName.replace(/\.[^.]+$/, ''),
      kind: '기록부', url: '', note: '브랜드 기록부 문서',
      fileId: out.fileId, fileName: out.fileName, filePath: out.filePath || '',
      fileSize: out.fileSize, at: new Date().toISOString() });
    delete recordCache[out.fileId];
    await saveAll(true);          // 서버가 바로 찾을 수 있게 먼저 저장합니다
    render();
    toast('✅ 기록부 문서를 올렸습니다');
  }catch(e){
    alert('문서를 올리지 못했습니다.\n\n' + (e.message || e));
  }
}

function removeRecord(){
  const b = currentBrand();
  if(!b || !b.record) return;

    + 'NAS의 실제 파일은 자료 폴더에 그대로 남습니다.')) return;

}

function moveBrand(id, dir){

  [data.brands[i], data.brands[j]] = [data.brands[j], data.brands[i]];
  render(); markDirty();
}

function moveHistory(id, dir){
  const b = currentBrand();
  const i = b.history.findIndex(x => x.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= b.history.length) return;
  [b.history[i], b.history[j]] = [b.history[j], b.history[i]];
  render(); markDirty();
}

/* ========================= 검색 ========================= */
function renderSearch(){
  const q = searchQuery.trim().toLowerCase();
  const groups = [];

  data.brands.forEach(b => {
    const hits = [];
    ITEM_KEYS.forEach(type => {
      b[type].forEach(it => {
        const hay = [it.title, it.desc, it.note, it.body, it.tool, it.kind, it.tag, it.url,
                     it.why, it.result, it.next, it.owner, it.status]
          .filter(Boolean).join(' ').toLowerCase();
        if(hay.includes(q)) hits.push({ type, it });
      });
    });
    if((b.masterPrompt || '').toLowerCase().includes(q)){
      hits.push({ type:'prompt', it:{ title:'마스터프롬프트', body:b.masterPrompt } });
    }
    if(hits.length) groups.push({ b, hits });
  });

  const total = groups.reduce((a, g) => a + g.hits.length, 0);
  const main = document.getElementById('main');

  if(!total){
    main.innerHTML = '<div class="panel"><div class="empty">'
      + '"' + esc(searchQuery) + '" 에 대한 결과가 없습니다.</div></div>';
    return;
  }

  main.innerHTML = '<div class="panel"><div class="tabbody">'
    + '<div class="sec-bar"><strong>검색 결과 ' + total + '건</strong>'
    + '<span class="hint">항목을 클릭하면 해당 브랜드로 이동합니다</span>'
    + '<button class="btn sm" style="margin-left:auto" onclick="clearSearch()">검색 해제</button></div>'
    + groups.map(g => '<div class="sr-group">'
        + '<div class="sr-head"><span>' + esc(g.b.icon) + '</span>' + esc(g.b.name)
        + '<span class="chip">' + g.hits.length + '</span></div>'
        + g.hits.map(h => {
            const tabKey = h.type === 'prompt' ? 'prompt' : h.type;
            const label = h.type === 'prompt' ? '✨ 마스터프롬프트'
                        : TYPES[h.type].icon + ' ' + TYPES[h.type].label;
            const ctx = (h.it.desc || h.it.note || h.it.body || h.it.result || '').slice(0, 140);
            return '<div class="sr-item" onclick="gotoResult(\'' + g.b.id + '\',\'' + tabKey + '\')">'
              + '<div class="t">' + highlight(h.it.title, searchQuery) + '</div>'
              + '<div class="c">' + label + (ctx ? ' · ' + highlight(ctx, searchQuery) : '') + '</div>'
              + '</div>';
          }).join('')
        + '</div>').join('')
    + '</div></div>';
}

let itemType = null;
function openItemModal(type, id){
  const b = currentBrand();
  if(!b) return;
  itemType = type;
  const t = TYPES[type];
  const it = id ? b[type].find(x => x.id === id) : null;
  editing = it ? { type, id } : null;

  document.getElementById('itemModalTitle').textContent =
    t.label + (it ? ' 수정' : ' 추가');

  document.getElementById('itemFields').innerHTML = t.fields.map(f => {
    const v = it ? (it[f.key] || '') : (f.type === 'date' ? new Date().toISOString().slice(0,10) : '');
    const lab = '<label>' + f.label + (f.required ? ' *' : '') + '</label>';
    if(f.type === 'select'){
      return lab + '<select id="f_' + f.key + '">'
        + f.options.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('')
        + '</select>';
    }
    if(f.type === 'textarea'){
      return lab + '<textarea id="f_' + f.key + '" placeholder="' + esc(f.ph || '') + '">'
        + esc(v) + '</textarea>';
    }
    return lab + '<input type="' + (f.type === 'date' ? 'date' : 'text') + '" id="f_' + f.key + '" '
      + 'value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">';
  }).join('');

  document.getElementById('itemModal').classList.add('open');
}

function submitItem(){
  const b = currentBrand();
  const t = TYPES[itemType];
  const payload = {};
  for(const f of t.fields){
    const v = document.getElementById('f_' + f.key).value.trim();
    if(f.required && !v){ toast('⚠️ ' + f.label + '을(를) 입력해 주세요'); return; }
    payload[f.key] = v;
  }
  if(editing){
    Object.assign(b[itemType].find(x => x.id === editing.id), payload,
                  { updatedAt: new Date().toISOString() });
  }else{
    const item = Object.assign({ id: uid('i'), updatedAt: new Date().toISOString() }, payload);
    // 여정은 시간 순으로 읽어야 하므로 아래에 쌓고, 나머지는 최신이 위로 옵니다
    if(itemType === 'history') b[itemType].push(item);
    else b[itemType].unshift(item);
  }
  editing = null;
  closeModal('itemModal');
  render(); markDirty();
}
