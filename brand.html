<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>넷폼알앤디 브랜드 허브</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --bg-primary:#f6f7f9; --bg-secondary:#ffffff; --bg-card:#ffffff; --bg-hover:#f1f5f9;
  --bg-input:#f8fafc; --border:#e2e8f0; --border-light:#cbd5e1;
  --text-primary:#1e293b; --text-secondary:#64748b; --text-muted:#94a3b8;
  --blue:#3b82f6; --green:#22c55e; --yellow:#f59e0b; --red:#ef4444;
  --purple:#8b5cf6; --cyan:#06b6d4; --orange:#f97316;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 6px -1px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);
}
body.dark-mode{
  --bg-primary:#0f172a; --bg-secondary:#1e293b; --bg-card:#1e293b; --bg-hover:#334155;
  --bg-input:#0f172a; --border:#334155; --border-light:#475569;
  --text-primary:#f1f5f9; --text-secondary:#cbd5e1; --text-muted:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg-primary);
  color:var(--text-primary);min-height:100vh;line-height:1.6}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px;
  align-items:center;background:var(--bg-secondary);border-bottom:1px solid var(--border);
  padding:14px 22px}
.topbar h1{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--text-muted);font-weight:500}
.spacer{flex:1}
.searchbox{position:relative;min-width:220px;flex:0 1 320px}
.searchbox input{width:100%;padding:8px 12px 8px 32px;font-size:13px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);font-family:inherit}
.searchbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:13px;color:var(--text-muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.astat{font-size:12px;color:var(--text-muted)}
.ainote{padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.5;
  background:rgba(245,158,11,.14);color:var(--text-primary)}
.savestate{font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap}
.savestate.ok{color:var(--green)}
.savestate.err{color:var(--red)}
.store-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.store-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.store-badge.nas .dot{background:var(--green)}
.store-badge.error .dot{background:var(--red)}

.btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg-hover);border-color:var(--border-light)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:rgba(239,68,68,.1)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}

/* ---------- 레이아웃 ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;gap:22px;
  max-width:1500px;margin:0 auto;padding:22px}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:16px}}

/* ---------- 사이드바 ---------- */
.side{align-self:start;position:sticky;top:86px}
@media(max-width:900px){.side{position:static}}
.side-title{font-size:11px;font-weight:800;color:var(--text-muted);
  letter-spacing:.06em;margin:0 0 10px 4px}
.brand-list{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
@media(max-width:900px){.brand-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.brand-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  cursor:pointer;transition:.12s;border:1px solid transparent;background:transparent;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text-secondary);
  text-align:left;width:100%;white-space:nowrap}
.brand-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.brand-item.on{background:var(--bg-card);border-color:var(--border);
  color:var(--text-primary);box-shadow:var(--shadow-sm)}
.brand-item .bar{width:3px;height:17px;border-radius:2px;flex-shrink:0}
.brand-item .em{font-size:15px}
.brand-item .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-muted)}
.bwrap{position:relative}
.bmove{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:none;gap:2px;
  background:var(--bg-card);border-radius:7px;padding:1px}
.bwrap:hover .bmove{display:flex}
.bmove .btn{padding:2px 6px;font-size:11px}
@media(max-width:900px){.bmove{display:none!important}}

/* ---------- 본문 ---------- */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-sm);overflow:hidden}
.bhead{padding:22px 24px;border-bottom:1px solid var(--border);display:flex;
  align-items:flex-start;gap:14px;flex-wrap:wrap}
.bhead .icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:23px;background:var(--bg-hover);flex-shrink:0}
.bhead h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.bhead .meta{font-size:13px;color:var(--text-secondary);margin-top:2px}
.bhead .ba{margin-left:auto;display:flex;gap:6px}

.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--border);
  overflow-x:auto;background:var(--bg-secondary)}
.tab{padding:12px 16px;font-family:inherit;font-size:13.5px;font-weight:700;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);
  cursor:pointer;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab .n{font-size:11px;font-weight:600;opacity:.7;margin-left:3px}
.tabbody{padding:22px 24px 28px}

.sec-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sec-bar .hint{font-size:12.5px;color:var(--text-muted)}

/* ---------- 카드 목록 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--border);border-radius:12px;padding:15px 17px;
  background:var(--bg-secondary);transition:.14s;position:relative}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border-light)}
.card .ct{font-size:14px;font-weight:700;margin-bottom:3px;padding-right:70px}
.card .cd{font-size:12.5px;color:var(--text-secondary);white-space:pre-wrap;
  word-break:break-word;margin-top:6px}
.card .ca{position:absolute;top:12px;right:12px;display:flex;gap:3px;opacity:0;transition:.14s}
.card:hover .ca{opacity:1}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
.card.done{opacity:.55}
.card.done .ct{text-decoration:line-through}
.card.linkcard{border-left:3px solid var(--blue)}
.card.linkcard .ct{display:block;text-decoration:none;color:inherit}
.card.linkcard .ct:hover{color:var(--blue)}
.card.linkcard .go{color:var(--blue);font-size:12px}
.card.linkcard.haspv{padding-top:13px}

/* 미리보기 — 실제 페이지를 축소해서 보여줍니다 */
.pvwrap{display:block;position:relative;width:100%;height:170px;margin-bottom:12px;
  border:1px solid var(--border);border-radius:9px;overflow:hidden;
  background:var(--bg-hover);text-decoration:none}
.pvwrap::after{content:'클릭하면 새 탭에서 열립니다';position:absolute;left:0;right:0;bottom:0;
  padding:5px 9px;font-size:11px;color:#fff;background:rgba(15,23,42,.72);
  opacity:0;transition:.15s}
.pvwrap:hover::after{opacity:1}
.pv{width:1280px;height:800px;border:0;transform:scale(.29);transform-origin:0 0;
  pointer-events:none;background:#fff}
.pvmask{position:absolute;inset:0}   /* 미리보기 위를 덮어 클릭이 카드로 가게 합니다 */

.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--bg-hover);color:var(--text-secondary)}
.chip.on{background:rgba(34,197,94,.15);color:#16a34a}
.chip.test{background:rgba(245,158,11,.15);color:#d97706}
.chip.off{background:rgba(239,68,68,.13);color:#dc2626}
body.dark-mode .chip.on{color:#4ade80}
body.dark-mode .chip.test{color:#fbbf24}
body.dark-mode .chip.off{color:#f87171}
.lnk{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;word-break:break-all}
.lnk:hover{text-decoration:underline}
.path{font-size:11.5px;color:var(--text-muted);font-family:ui-monospace,Consolas,monospace;
  word-break:break-all}

/* ---------- 히스토리 ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-23px;top:6px;width:10px;height:10px;
  border-radius:50%;background:var(--blue);border:2px solid var(--bg-card)}
.tl-date{font-size:11.5px;font-weight:700;color:var(--text-muted)}
.tl-title{font-size:14px;font-weight:700;margin:1px 0 2px;padding-right:70px}
.tl-body{font-size:12.5px;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}
.jblock{margin-top:8px}
.jlabel{font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.03em}
.jtext{font-size:13px;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word;margin-top:1px}
.tl-item .ca{gap:3px}
.tl-item .ca{position:absolute;top:0;right:0;display:flex;gap:3px;opacity:0;transition:.14s}
.tl-item:hover .ca{opacity:1}

/* ---------- 마스터프롬프트 ---------- */
.pwrap{display:flex;flex-direction:column;gap:10px}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--text-muted)}
textarea.prompt{width:100%;min-height:400px;padding:16px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);
  font-family:ui-monospace,Consolas,'Pretendard',monospace;font-size:13px;line-height:1.7;
  resize:vertical}
textarea.prompt:focus{outline:2px solid var(--blue);outline-offset:-1px}

/* ---------- 검색 결과 ---------- */
.sr-group{margin-bottom:22px}
.sr-head{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sr-item{padding:11px 14px;border:1px solid var(--border);border-radius:10px;
  margin-bottom:7px;cursor:pointer;background:var(--bg-secondary);transition:.12s}
.sr-item:hover{background:var(--bg-hover)}
.sr-item .t{font-size:13.5px;font-weight:700}
.sr-item .c{font-size:12px;color:var(--text-secondary);margin-top:2px}
mark{background:rgba(245,158,11,.35);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- 공용 ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--text-muted);font-size:13.5px}

/* 홈 화면 */
.home-item{margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat{border:1px solid var(--border);border-radius:13px;padding:15px 17px;background:var(--bg-secondary)}
.stat .lab{font-size:12px;font-weight:600;color:var(--text-secondary)}
.stat .val{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .sub{font-size:11.5px;color:var(--text-muted)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.hcard{border:1px solid var(--border);border-radius:13px;padding:16px 18px;cursor:pointer;
  background:var(--bg-secondary);transition:.14s;border-top:3px solid var(--blue)}
.hcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.hcard .top{display:flex;align-items:center;gap:10px}
.hcard .em{font-size:21px}
.hcard .nm{font-size:15px;font-weight:800}
.hcard .ds{font-size:12.5px;color:var(--text-muted);margin-top:5px;min-height:19px}
.hcard .cnts{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.hcard .nums{display:flex;gap:14px;margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--border)}
.hcard .nums .n{font-size:11.5px;color:var(--text-muted)}
.hcard .nums .n b{display:block;font-size:17px;font-weight:800;color:var(--text-primary);
  letter-spacing:-.02em}
.todo{border:1px solid var(--border);border-radius:13px;padding:15px 18px;background:var(--bg-secondary)}
.todo .ti{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0;cursor:pointer}
.todo .ti:hover{color:var(--blue)}
.recent .ri{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 0;
  border-bottom:1px dashed var(--border);cursor:pointer}
.recent .ri:last-child{border-bottom:none}
.recent .ri:hover{color:var(--blue)}
.recent .rb{font-size:11.5px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.hsec{font-size:14px;font-weight:800;margin:24px 0 11px;display:flex;align-items:center}
.delta{font-size:11.5px;font-weight:700}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:6px}
.stat{border:1px solid var(--border);border-radius:13px;padding:15px 17px;background:var(--bg-secondary)}
.stat .lab{font-size:12px;font-weight:600;color:var(--text-secondary)}
.stat .val{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .sub{font-size:11.5px;color:var(--text-muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mbox{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg-secondary)}
.mh{font-size:13px;font-weight:800;margin-bottom:10px}
.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.bar-row .bl{width:86px;flex-shrink:0;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;height:8px;border-radius:99px;background:var(--bg-hover);overflow:hidden}
.bar-row .bf{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar-row .bv{width:42px;text-align:right;font-weight:700;flex-shrink:0}
.krow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:6px 0;border-bottom:1px dashed var(--border);color:var(--text-secondary)}
.krow:last-child{border-bottom:none}

/* 문의 표 */
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto;
  max-height:62vh;background:var(--bg-secondary)}
table.itable{width:100%;border-collapse:collapse;font-size:12.5px}
table.itable th,table.itable td{padding:8px 12px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap;
  max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.itable th{position:sticky;top:0;z-index:1;background:var(--bg-hover);
  font-size:11.5px;font-weight:800;color:var(--text-secondary)}
table.itable tr:last-child td{border-bottom:none}
table.itable tr:hover td{background:var(--bg-hover)}

/* 파일 업로드 영역 */
.drop{border:2px dashed var(--border-light);border-radius:14px;padding:26px 20px;
  text-align:center;transition:.15s;margin-bottom:16px;background:var(--bg-secondary)}
.drop.over{border-color:var(--blue);background:rgba(59,130,246,.07)}
.drop .big{font-size:26px;margin-bottom:6px}
.drop .t{font-size:14px;font-weight:700}
.drop .s{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.drop .warn{font-size:12.5px;color:var(--text-muted);margin-top:10px}
.upqueue{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.upitem{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 12px;
  border:1px solid var(--border);border-radius:9px;background:var(--bg-secondary)}
.upitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upitem .st{margin-left:auto;font-weight:700;white-space:nowrap}
.upitem .st.ok{color:var(--green)} .upitem .st.err{color:var(--red)}
.fileicon{font-size:22px;flex-shrink:0}
.card.filecard .ct{padding-right:0}
.fmeta{font-size:11.5px;color:var(--text-muted);margin-top:2px}

/* 폴더 탐색기 */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:10px;
  font-size:12.5px}
.crumb{font-family:inherit;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--blue);cursor:pointer;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:var(--bg-hover)}
.crumb.on{color:var(--text-primary);cursor:default}
.crumb.on:hover{background:transparent}
.crumbsep{color:var(--text-muted);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;
  margin-bottom:14px}
.fcard{font-family:inherit;text-align:left;display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:12px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary);cursor:pointer;min-width:0}
.fcard:hover{background:var(--bg-hover);border-color:var(--border-light)}
.fcard .fc-ico{font-size:20px;flex-shrink:0}
.fcard .fc-t{min-width:0;flex:1}
.fcard .fc-nm{display:block;font-size:13px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fc-sub{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px}
.errbar{display:none;gap:12px;align-items:flex-start;margin:0 22px;padding:14px 18px;
  border-radius:12px;border:1px solid var(--red);background:rgba(239,68,68,.08)}
.errbar.show{display:flex}
.errbar .etitle{font-weight:800;font-size:14px;margin-bottom:4px}
.errbar .emsg{font-size:12.5px;line-height:1.5;word-break:break-all;
  font-family:ui-monospace,Consolas,monospace;color:var(--text-secondary)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;
  place-items:center;z-index:100;padding:20px;overflow-y:auto}
.modal-bg.open{display:grid}
.modal{background:var(--bg-card);border-radius:16px;padding:24px;width:100%;max-width:480px;
  box-shadow:var(--shadow-lg);border:1px solid var(--border);margin:auto}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin:12px 0 5px}
.modal input,.modal select,.modal textarea{width:100%;font-family:inherit;font-size:13px;
  padding:9px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary)}
.modal textarea{min-height:96px;resize:vertical;line-height:1.6}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;
  background:var(--text-primary);color:var(--bg-card);padding:12px 22px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🎨 브랜드 허브</h1>
    <div class="sub" id="subtitle">넷폼알앤디</div>
  </div>
  <div class="searchbox">
    <span class="ico">🔍</span>
    <input type="text" id="search" placeholder="모든 브랜드에서 검색 (자동화·히스토리·자료)"

/* =========================================================================
   저장 위치 — 자동으로 정해집니다. 손댈 필요 없습니다.
   NAS 주소로 열면 (http://192.168.0.37/...) → NAS 저장 (모두 공유)
   파일을 더블클릭해서 열면 (file:///C:/...)  → 이 브라우저에만 저장
   ========================================================================= */
const STORAGE_MODE_SETTING = 'auto';
const STORAGE_MODE = STORAGE_MODE_SETTING !== 'auto'
  ? STORAGE_MODE_SETTING
  : (location.protocol === 'http:' || location.protocol === 'https:' ? 'nas' : 'local');

const NAS_API = { load: 'load.php', save: 'save.php' };
const LS_KEY  = 'netform_brand_hub_v2';
const SCHEMA  = 2;

async function storageLoad(){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.load + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('NAS 응답 오류 (' + res.status + ')');
    const text = await res.text();
    return text.trim() ? JSON.parse(text) : null;
  }
  const raw = localStorage.getItem(LS_KEY);
  return raw ? JSON.parse(raw) : null;
}

async function storageSave(payload){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.save, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) { /* JSON이 아닌 응답 */ }
    if(out === null){
      throw new Error('서버가 예상 밖의 응답을 보냈습니다 (HTTP ' + res.status + ') → '
        + text.slice(0, 300).replace(/\s+/g, ' '));
    }
    if(!res.ok || !out.ok){
      throw new Error('(HTTP ' + res.status + ') ' + (out.error || '알 수 없는 오류'));
    }
    return;
  }
  localStorage.setItem(LS_KEY, JSON.stringify(payload));
}

        options:['수치 대시보드','콘텐츠 발행 기록','관리자 페이지','광고/채널','기타'] },

const ITEM_KEYS = ['automations','history','assets','tasks','links'];
const TAB_KEYS  = ['automations','history','assets','tasks','links','inquiries','prompt'];

let data = defaultData();
let currentBrandId = null;
let currentTab = 'automations';
let searchQuery = '';
let editing = null;   // { type, id } — 수정 중인 항목

/* ========================= 유틸 ========================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function brandById(id){ return data.brands.find(b => b.id === id); }
function currentBrand(){ return brandById(currentBrandId); }
function isUrl(s){ return /^https?:\/\//i.test(String(s || '')); }
function statusClass(s){
  return s === '운영중' ? 'on' : s === '테스트중' ? 'test' : s === '중단' ? 'off' : '';
}
function fmtDate(d){
  if(!d) return '';
  const t = new Date(d);
  return isNaN(t) ? String(d)
    : t.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
}
function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const idx = safe.toLowerCase().indexOf(esc(q).toLowerCase());
  if(idx < 0) return safe;
  return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>'
       + safe.slice(idx + q.length);
}

/* ========================= 렌더링 ========================= */
let view = 'home';   // home | nas | brand

function render(){
  renderSidebar();
  const home = document.getElementById('homeBtn');
  const nas  = document.getElementById('nasBtn');
  if(home) home.classList.toggle('on', view === 'home' && !searchQuery);
  if(nas)  nas.classList.toggle('on',  view === 'nas'  && !searchQuery);
  if(searchQuery.trim()) renderSearch();
  else if(view === 'nas') renderNas();
  else if(!currentBrandId) renderHome();
  else renderBrand();
}

function goNas(){
  clearSearchQuietly();
  view = 'nas';
  render();
  setTimeout(() => { const el = document.getElementById('nasQ'); if(el) el.focus(); }, 60);
}

function goHome(){
  clearSearchQuietly();
  view = 'home';
  currentBrandId = null;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderSidebar(){

    const n = ITEM_KEYS.reduce((a, k) => a + b[k].length, 0);
    return '<div class="bwrap"><button class="brand-item'
      + (b.id === currentBrandId && !searchQuery ? ' on' : '') + '" '
      + 'onclick="selectBrand(\'' + b.id + '\')">'
      + '<span class="bar" style="background:' + b.color + '"></span>'
      + '<span class="em">' + esc(b.icon || '🏷️') + '</span>'
      + '<span>' + esc(b.name) + '</span>'
      + '<span class="cnt">' + n + '</span></button>'
      + '<span class="bmove">'
        + (i > 0 ? '<button class="btn sm" title="위로" onclick="moveBrand(\'' + b.id + '\',-1)">↑</button>' : '')
        + (i < data.brands.length - 1
            ? '<button class="btn sm" title="아래로" onclick="moveBrand(\'' + b.id + '\',1)">↓</button>' : '')
      + '</span></div>';
  }).join('');
}

function inquiryStats(brandName){
  const rows = inquiryCache.byBrand[brandName] || [];
  if(!rows.length) return null;
  const s = inquirySummary(rows);
  const diff = s.lastMonth > 0
    ? Math.round((s.thisMonth - s.lastMonth) / s.lastMonth * 100) : null;
  return { total: rows.length, thisMonth: s.thisMonth, lastMonth: s.lastMonth, diff, latest: s.latest };
}

function renderHome(){
  const bs = data.brands;
  const all = t => bs.reduce((a, b) => a + b[t].length, 0);
  const running = bs.reduce((a, b) =>
    a + b.automations.filter(x => x.status === '운영중').length, 0);
  const withPrompt = bs.filter(b => (b.masterPrompt || '').trim()).length;
  const files = bs.reduce((a, b) => a + b.assets.filter(x => x.fileId).length, 0);

  const openTasks = bs.reduce((a, b) => a + b.tasks.filter(t => t.status !== '완료').length, 0);
  const iqTotal = bs.reduce((a, b) => a + (inquiryCache.byBrand[b.name] || []).length, 0);
  const iqMonth = bs.reduce((a, b) => { const s = inquiryStats(b.name); return a + (s ? s.thisMonth : 0); }, 0);
  const stats = [
    { lab:'📮 문의', val: iqTotal.toLocaleString('ko-KR'),
      sub: iqTotal ? '건 · 이번 달 ' + iqMonth + '건' : '건 · 시트를 연결하면 표시됩니다' },
    { lab:'🏷️ 브랜드', val: bs.length, sub:'개' },
    { lab:'✅ 할 일',  val: openTasks, sub: '남음 · 전체 ' + all('tasks') + '개' },
    { lab:'🤖 자동화', val: running, sub: '운영 중 · 전체 ' + all('automations') + '개' },
    { lab:'📁 자료',   val: all('assets'), sub: '파일 ' + files + '개 · 프롬프트 '
        + withPrompt + '/' + bs.length }
  ].map(x => '<div class="stat"><div class="lab">' + x.lab + '</div>'
    + '<div class="val">' + x.val + '</div><div class="sub">' + x.sub + '</div></div>').join('');

  const cards = bs.map(b =>
    '<div class="hcard" style="border-top-color:' + b.color + '" '
    + 'onclick="selectBrand(\'' + b.id + '\')">'
    + '<div class="top"><span class="em">' + esc(b.icon) + '</span>'
      + '<span class="nm">' + esc(b.name) + '</span></div>'
    + '<div class="ds">' + esc(b.desc || '설명이 아직 없습니다')
      + (b.owner ? ' · ' + esc(b.owner) : '') + '</div>'
    + (function(){
        const q = inquiryStats(b.name);
        if(!q) return '';
        return '<div class="nums">'
          + '<div class="n"><b>' + q.total.toLocaleString('ko-KR') + '</b>전체 문의</div>'
          + '<div class="n"><b>' + q.thisMonth + '</b>이번 달 '
            + (q.diff === null ? '' : diffTag(q.diff)) + '</div>'
          + (q.latest ? '<div class="n"><b style="font-size:13px">' + esc(q.latest)
              + '</b>최근 문의</div>' : '')
          + '</div>';
      })()
    + '<div class="cnts">'
      + '<span class="chip">🤖 ' + b.automations.length + '</span>'
      + '<span class="chip">📜 ' + b.history.length + '</span>'
      + '<span class="chip">📁 ' + b.assets.length + '</span>'
      + (b.links.length ? '<span class="chip">🔗 ' + b.links.length + '</span>' : '')
      + (b.tasks.filter(t => t.status !== '완료').length
          ? '<span class="chip test">✅ ' + b.tasks.filter(t => t.status !== '완료').length + '</span>' : '')
      + ((b.masterPrompt || '').trim() ? '<span class="chip on">✨ 작성됨</span>'
                                       : '<span class="chip">✨ 미작성</span>')
    + '</div></div>').join('');

  // 기한이 지났거나 임박한 할 일
  const today = new Date().toISOString().slice(0,10);
  const urgent = [];
  bs.forEach(b => b.tasks.forEach(t => {
    if(t.status === '완료' || !t.due) return;
    const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
    if(days <= 3) urgent.push({ b, t, days });
  }));
  urgent.sort((x, y) => x.days - y.days);

  const urgentHtml = urgent.length
    ? '<div class="todo">' + urgent.slice(0, 8).map(u =>
        '<div class="ti" onclick="gotoResult(\'' + u.b.id + '\',\'tasks\')">'
        + '<span>' + (u.days < 0 ? '🔴' : '🟡') + '</span>'
        + '<strong>' + esc(u.t.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(u.b.name) + '</span>'
        + '<span class="rb">' + (u.days < 0 ? Math.abs(u.days) + '일 지남' : 'D-' + u.days) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 아직 비어 있는 곳을 짚어줍니다
  const todos = [];
  bs.forEach(b => {
    if(!(b.masterPrompt || '').trim())
      todos.push(['✨', b, 'prompt', '마스터프롬프트가 비어 있습니다']);
    if(!b.automations.length)
      todos.push(['🤖', b, 'automations', '등록된 자동화가 없습니다']);
    if(!b.history.length)
      todos.push(['📜', b, 'history', '여정 기록이 없습니다']);
    if(!b.assets.length)
      todos.push(['📁', b, 'assets', '등록된 자료가 없습니다']);
  });

  const todoHtml = todos.length
    ? '<div class="todo">' + todos.slice(0, 12).map(([ic, b, tab, msg]) =>
        '<div class="ti" onclick="gotoResult(\'' + b.id + '\',\'' + tab + '\')">'
        + '<span>' + ic + '</span><strong>' + esc(b.name) + '</strong>'
        + '<span style="color:var(--text-muted)">' + msg + '</span></div>').join('')
      + (todos.length > 12 ? '<div class="ti" style="color:var(--text-muted);cursor:default">'
          + '외 ' + (todos.length - 12) + '건</div>' : '')
      + '</div>'
    : '<div class="todo" style="color:var(--text-muted)">모든 브랜드가 채워져 있습니다 👏</div>';

  // 최근에 손댄 항목
  const recent = [];
  bs.forEach(b => ITEM_KEYS.forEach(t =>
    b[t].forEach(it => {
      const when = it.updatedAt || it.uploadedAt;
      if(when) recent.push({ b, t, it, when });
    })));
  recent.sort((x, y) => String(y.when).localeCompare(String(x.when)));

  const recentHtml = recent.length
    ? '<div class="todo recent">' + recent.slice(0, 8).map(r =>
        '<div class="ri" onclick="gotoResult(\'' + r.b.id + '\',\'' + r.t + '\')">'
        + '<span>' + TYPES[r.t].icon + '</span>'
        + '<strong>' + esc(r.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(r.b.name) + '</span>'
        + '<span class="rb">' + esc(new Date(r.when)
            .toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' })) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + '<h2 style="font-size:19px;font-weight:800;margin-bottom:4px">브랜드 현황</h2>'
    + '<div style="font-size:13px;color:var(--text-muted);margin-bottom:18px">'
      + '카드를 누르면 해당 브랜드로 이동합니다</div>'
    + '<div class="stats">' + stats + '</div>'
    + '<div class="hgrid">' + cards + '</div>'
    + (urgentHtml ? '<div class="hsec">⏰ 기한이 임박한 할 일</div>' + urgentHtml : '')
    + (recentHtml ? '<div class="hsec">🕘 최근 업데이트</div>' + recentHtml : '')
    + '<div class="hsec">📝 아직 비어 있는 곳</div>' + todoHtml
    + '</div></div>';
}

/* ========================= NAS 자료 =========================
   scan.sh 가 만든 파일 목록에서 찾아줍니다.
   파일을 옮기거나 복사하지 않고, 어디에 있는지만 알려줍니다.
   ============================================================ */
const nasState = { q:'', ext:'', loading:false, error:null, res:null, info:null };

async function nasCheck(){
  try{
    const r = await (await fetch('nasfiles.php?action=check', { cache:'no-store' })).json();
    nasState.info = r;
  }catch(e){ nasState.info = null; }
  render();
}

async function nasSearch(){
  const q = document.getElementById('nasQ');
  nasState.q = q ? q.value.trim() : nasState.q;
  const ex = document.getElementById('nasExt');
  nasState.ext = ex ? ex.value : '';
  if(!nasState.q && !nasState.ext){ toast('⚠️ 찾을 이름을 입력해 주세요'); return; }
  nasState.mode = 'search';

  nasState.loading = true; nasState.error = null; render();
  try{
    const url = 'nasfiles.php?action=search&q=' + encodeURIComponent(nasState.q)
              + (nasState.ext ? '&ext=' + encodeURIComponent(nasState.ext) : '');
    const res = await fetch(url, { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '찾지 못했습니다');
    nasState.res = out;
  }catch(e){ nasState.error = e.message; nasState.res = null; }
  finally{ nasState.loading = false; render();
    const el = document.getElementById('nasQ'); if(el){ el.focus(); el.value = nasState.q; } }
}

/* NAS 경로를 탐색기에서 쓸 수 있는 형태로 바꿉니다
   /volume1/넷폼알앤디 공유폴더/a/b.pdf  →  \\netformrnd\넷폼알앤디 공유폴더\a\b.pdf */
function toWinPath(p){
  return '\\\\netformrnd\\' + String(p).replace(/^\/volume\d+\//, '').replace(/\//g, '\\');
}

async function copyNasPath(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.path);
  try{
    await navigator.clipboard.writeText(win);
    toast('📋 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

function linkNasDir(i){
  const f = nasState.res.results[i];
  if(!data.brands.length){ toast('⚠️ 브랜드가 없습니다'); return; }
  const names = data.brands.map((b, n) => (n + 1) + '. ' + b.name).join('\n');
  const pick = prompt('이 폴더를 어느 브랜드에 연결할까요?\n\n' + names
    + '\n\n폴더: ' + f.dir + '\n\n번호를 입력하세요', '1');
  if(pick === null) return;
  const idx = parseInt(pick, 10) - 1;
  const b = data.brands[idx];
  if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }

  b.nasFolders = b.nasFolders || [];
  if(b.nasFolders.some(x => x.path === f.dir)){ toast('이미 연결된 폴더입니다'); return; }
  b.nasFolders.push({ id: uid('nf'), path: f.dir, label: f.dir.split('/').pop(), q: '' });
  markDirty();
  toast('📂 "' + b.name + '" 자료에 연결했습니다');
}

async function copyNasDir(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.dir);
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

/* ========================= 폴더 탐색기 =========================
   scan.sh 가 만든 목록을 가지고, 탐색기처럼 폴더를 타고 들어갑니다.
   파일은 옮기지 않고 있는 자리에서 바로 내려받습니다.
   ============================================================== */
/* 서버에 물어보고 JSON 을 받아옵니다.
   PHP 파일이 아직 없으면 HTML(404 화면)이 오는데, 그걸 알아보고 안내합니다. */
async function apiJson(url, opts){
  const res  = await fetch(url, Object.assign({ cache:'no-store' }, opts || {}));
  const text = await res.text();
  let out = null;
  try{ out = JSON.parse(text); }catch(e){}
  if(out === null){
    if(/^\s*</.test(text)){
      throw new Error('NAS에 nasfiles.php 가 아직 없습니다.\n\n'
        + '아래 주소를 브라우저 주소창에 한 번 넣어 주세요. (파일을 자동으로 받아옵니다)\n\n'
        + location.href.split('?')[0].replace(/[^/]*$/, 'save.php?action=bootstrap'));
    }
    throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
  }
  if(!out.ok) throw out;
  return out;
}

function apiErrText(e){
  return (e && e.error) || (e && e.message) || '알 수 없는 오류';
}

const browseCache = {};   // 폴더경로 → {loading} | {error} | 서버응답
const folderNav   = {};   // 화면키 → 지금 보고 있는 폴더

/* 작은따옴표 onclick 안에 안전하게 넣기 위한 처리 */
function jsq(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
                  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function redraw(){ render(); bindDrop(); }

async function loadBrowse(dir){
  browseCache[dir] = { loading:true };
  try{
    const out = await apiJson('nasfiles.php?action=browse&dir=' + encodeURIComponent(dir || ''));
    browseCache[dir] = out;
    if(out.dir && out.dir !== dir) browseCache[out.dir] = out;
  }catch(e){
    browseCache[dir] = { error: apiErrText(e) };
  }
  redraw();
}

function gotoFolder(navKey, dir){
  folderNav[navKey] = dir;
  if(!browseCache[dir]) loadBrowse(dir); else redraw();
}

function reloadFolder(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  delete browseCache[dir];
  loadBrowse(dir);
  toast('↻ 다시 불러옵니다');
}

function currentDirOf(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];
  return (c && c.dir) ? c.dir : dir;
}

function crumbHtml(navKey, out, rootOverride){
  const root = rootOverride || out.root || '';
  const dir  = out.dir  || '';
  let rel = (root && dir.indexOf(root) === 0) ? dir.slice(root.length) : dir;
  rel = rel.replace(/^\//, '');
  const parts = rel ? rel.split('/') : [];

  const bits = ['<button class="crumb' + (parts.length ? '' : ' on') + '"'
    + (parts.length ? ' onclick="gotoFolder(\'' + jsq(navKey) + '\',\'' + jsq(root) + '\')"' : '')
    + '>🏠 ' + esc(root.split('/').pop() || '전체') + '</button>'];

  let acc = root;
  parts.forEach((seg, i) => {
    acc += '/' + seg;
    bits.push('<span class="crumbsep">›</span>');
    bits.push(i === parts.length - 1
      ? '<span class="crumb on">' + esc(seg) + '</span>'
      : '<button class="crumb" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
        + jsq(acc) + '\')">' + esc(seg) + '</button>');
  });
  return '<div class="crumbs">' + bits.join('') + '</div>';
}

/* ================= 목록 만들기 (대시보드에서 직접) =================
   작업 스케줄러 없이, 여기서 조금씩 나눠 훑습니다.
   한 번에 몇 초씩만 일하고 돌아오므로 파일이 많아도 끊기지 않습니다.
   ================================================================= */
let scanRun = null;   // null=안 함 | {진행중 상태}

async function startScan(){
  const now = (nasState.info && nasState.info['다음에훑을폴더']) || '';
  const suggest = (now && now !== '(기본값)') ? now
    : '/volume1/넷폼알앤디 공유폴더/마케팅 공유폴더 외장하드 백업/00. 브랜드 공유폴더';

  const dir = prompt(
    '어느 폴더를 훑을까요?\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\n\n'
    + '파일을 옮기거나 고치지 않습니다. 어디에 무엇이 있는지만 읽습니다.', suggest);
  if(dir === null) return;
  if(!dir.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  scanRun = { starting:true };
  render();
  try{
    scanRun = await apiJson('nasscan.php?action=start&dir=' + encodeURIComponent(dir));
    render();
    scanLoop();
  }catch(e){
    scanRun = null;
    render();
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n') : ''));
  }
}

async function scanLoop(){
  while(scanRun && !scanRun.done){
    let out;
    try{
      out = await apiJson('nasscan.php?action=step');
    }catch(e){
      scanRun = null; render();
      alert(apiErrText(e)
        + (e['못읽은폴더'] && e['못읽은폴더'].length
            ? '\n\n못 읽은 폴더:\n' + e['못읽은폴더'].slice(0, 10).join('\n') : ''));
      return;
    }
    if(!scanRun) return;           // 도중에 중단한 경우
    scanRun = out;
    render();
  }
  if(scanRun && scanRun.done){
    treeCache = null;
    browseCache2Clear();
    await nasCheck();
    toast('✅ 목록을 다 만들었습니다 — ' + scanRun['찾은파일'].toLocaleString('ko-KR') + '개');
  }
}

function browseCache2Clear(){
  Object.keys(browseCache).forEach(k => { delete browseCache[k]; });
  Object.keys(folderNav).forEach(k => { delete folderNav[k]; });
}

async function cancelScan(){
  if(!confirm('목록 만들기를 중단할까요?')) return;
  scanRun = null;
  render();
  try{ await apiJson('nasscan.php?action=cancel'); }catch(e){}
  toast('중단했습니다');
}

function scanPanel(){
  if(!scanRun) return '';
  if(scanRun.starting) return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="fmeta">시작하는 중…</div></div>';

  const done = scanRun.done;
  return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>' + (done ? '✅ 목록 완성' : '⏳ 목록 만드는 중') + '</span>'
      + '<span class="mhs">' + esc(scanRun['걸린시간'] || '') + '</span>'
      + '<span style="margin-left:auto">'
        + (done
            ? '<button class="btn sm" onclick="scanRun=null;render()">닫기</button>'
            : '<button class="btn sm danger" onclick="cancelScan()">중단</button>')
      + '</span>'
    + '</div>'
    + '<div class="krow"><span>찾은 파일</span><b style="color:var(--text-primary)">'
      + (scanRun['찾은파일'] || 0).toLocaleString('ko-KR') + '개</b></div>'
    + '<div class="krow"><span>훑은 폴더</span><b style="color:var(--text-primary)">'
      + (scanRun['훑은폴더수'] || 0).toLocaleString('ko-KR') + '개</b></div>'
    + (done ? '' : '<div class="path" style="margin-top:8px;word-break:break-all">'
        + esc(scanRun['지금폴더'] || '') + '</div>')
    + ((scanRun['못읽은폴더'] || []).length
        ? '<div class="fmeta" style="margin-top:8px">⚠️ 권한이 없어 못 읽은 폴더 '
          + scanRun['못읽은폴더'].length + '개 — ' + esc(scanRun['못읽은폴더'][0]) + ' …</div>'
        : '')
    + (done ? '<div class="fmeta" style="margin-top:8px">' + esc(scanRun['다음'] || '') + '</div>' : '')
    + '</div>';
}

/* ================= 브랜드 ↔ 폴더 자동 연결 =================
   폴더 이름과 브랜드 이름을 맞춰봐서, 손으로 지정하지 않아도
   각 브랜드 자료 탭에 알맞은 NAS 폴더가 저절로 뜨게 합니다.
   ============================================================ */
let treeCache = null;   // null=아직 | {loading} | {error} | 서버응답

async function loadTree(){
  treeCache = { loading:true };
  try{
    treeCache = await apiJson('nasfiles.php?action=tree&depth=4');
  }catch(e){
    treeCache = { error: apiErrText(e) };
  }
  redraw();
}

/* 이름을 비교하기 좋게 다듬습니다.
   "00. 브랜드 공유폴더" → "브랜드공유폴더", "POUR 솔루션" → "솔루션" */
function normKey(s){
  return String(s).toLowerCase()
    .replace(/[#＃]/g, '')
    .replace(/^[0-9]+[.\-_\s]*/, '')
    .replace(/^[_\-.\s]+/, '')
    .replace(/pour/g, '')
    .replace(/[\s_\-.()\[\]·]/g, '');
}

function nameMatches(brandName, folderName){
  const a = normKey(brandName), b = normKey(folderName);
  if(a.length < 2 || b.length < 2) return false;
  return a === b || a.includes(b) || b.includes(a);
}

/* 이 브랜드에 해당하는 폴더들을 자동으로 골라냅니다.
   - 얕은 폴더를 우선하고, 이미 고른 폴더의 하위는 다시 넣지 않습니다
   - 손으로 연결했거나 숨긴 폴더는 뺍니다 */
function autoFoldersFor(b){
  const t = treeCache;
  if(!t || !t.folders) return [];
  const hidden = b.nasHidden || [];
  const manual = (b.nasFolders || []).map(x => x.path);

  const out = [];
  t.folders
    .filter(f => nameMatches(b.name, f.name))
    .forEach(f => {
      if(hidden.indexOf(f.path) >= 0) return;
      if(manual.indexOf(f.path) >= 0) return;
      if(out.some(o => f.path.indexOf(o.path + '/') === 0)) return;
      out.push(f);
    });
  return out;
}

/* 어느 폴더가 어느 브랜드에도 안 붙었는지 */
function unmatchedFolders(){
  const t = treeCache;
  if(!t || !t.folders) return [];
  const taken = {};
  data.brands.forEach(b => autoFoldersFor(b).forEach(f => { taken[f.path] = 1; }));
  data.brands.forEach(b => (b.nasFolders || []).forEach(f => { taken[f.path] = 1; }));
  return t.folders.filter(f => f.depth === 1 && !taken[f.path]);
}

function hideAutoFolder(path){
  const b = currentBrand();
  if(!b) return;
  if(!confirm('이 폴더를 "' + b.name + '" 자료에서 숨길까요?\n\n'
    + 'NAS의 실제 파일은 그대로 남습니다.\n\n' + path)) return;
  b.nasHidden = b.nasHidden || [];
  b.nasHidden.push(path);
  markDirty();
  redraw();
}

function unhideAll(){
  const b = currentBrand();
  if(!b || !(b.nasHidden || []).length) return;
  b.nasHidden = [];
  markDirty();
  redraw();
  toast('숨긴 폴더를 다시 보여줍니다');
}

/* 폴더 하나를 화면에 그립니다.
   navKey  : 이 탐색기를 구분하는 이름 ('nas' 또는 연결폴더 id)
   startDir: 처음 보여줄 폴더 (''이면 훑은 폴더 전체) */
function folderBrowserHtml(navKey, startDir, opts){
  opts = opts || {};
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];

  if(!c){ setTimeout(() => loadBrowse(dir), 10); return '<div class="fmeta">불러오는 중…</div>'; }
  if(c.loading) return '<div class="fmeta">불러오는 중…</div>';
  if(c.error)   return '<div class="fmeta">⚠️ ' + esc(c.error) + '</div>';

  const canUp = c.parent && (!startDir || c.dir !== startDir);
  const tools = '<div class="sec-bar" style="margin:0 0 10px">'
    + (canUp
        ? '<button class="btn sm" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(c.parent) + '\')">⬆ 상위 폴더</button>' : '')
    + '<button class="btn sm" onclick="reloadFolder(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">↻ 새로고침</button>'
    + '<button class="btn sm" onclick="copyDirPath(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">📋 폴더 경로</button>'
    + (opts.link
        ? '<button class="btn sm" onclick="linkCurrentDir(\'' + jsq(navKey) + '\',\''
          + jsq(startDir || '') + '\')">＋ 브랜드에 연결</button>' : '')
    + '<span class="hint">폴더 아래 전체 ' + (c.total || 0).toLocaleString('ko-KR') + '개</span>'
    + '</div>';

  const folders = c.folders.length
    ? '<div class="fgrid">' + c.folders.map(f =>
        '<button class="fcard" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(f.path) + '\')" title="' + esc(f.name) + '">'
        + '<span class="fc-ico">📁</span><span class="fc-t">'
        + '<span class="fc-nm">' + esc(f.name) + '</span>'
        + '<span class="fc-sub">' + f.count.toLocaleString('ko-KR') + '개 · '
          + esc(f.size) + '</span></span></button>').join('') + '</div>'
    : '';

  const files = c.files.length
    ? '<div class="mbox">' + c.files.map(x =>
        '<div class="krow" style="align-items:center">'
        + '<span class="fileicon" style="font-size:15px">' + fileIcon(x.name) + '</span>'
        + '<span style="flex:1;min-width:0;white-space:normal;word-break:break-all">'
          + '<b style="color:var(--text-primary)">' + esc(x.name) + '</b></span>'
        + '<span class="fmeta" style="white-space:nowrap;margin:0">'
          + esc(x.size) + ' · ' + esc(x.date) + '</span>'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇</a>'
        + '</div>').join('')
      + (c.fileCount > c.files.length
          ? '<div class="fmeta" style="margin-top:8px">이 폴더의 파일 '
            + c.fileCount.toLocaleString('ko-KR') + '개 중 ' + c.files.length
            + '개만 표시했습니다 · 🔍 이름으로 찾기를 이용해 주세요</div>' : '')
      + '</div>'
    : (c.folders.length ? '' : '<div class="empty">이 폴더에는 파일이 없습니다.</div>');

  return tools + crumbHtml(navKey, c, opts.crumbRoot) + folders + files;
}

async function copyDirPath(navKey, startDir){
  const win = toWinPath(currentDirOf(navKey, startDir));
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

function linkCurrentDir(navKey, startDir){
  const dir = currentDirOf(navKey, startDir);
  if(!data.brands.length){ toast('⚠️ 브랜드가 없습니다'); return; }
  const names = data.brands.map((b, n) => (n + 1) + '. ' + b.name).join('\n');
  const pick = prompt('지금 보고 있는 폴더를 어느 브랜드에 연결할까요?\n\n' + names
    + '\n\n폴더: ' + dir + '\n\n번호를 입력하세요', '1');
  if(pick === null) return;
  const b = data.brands[parseInt(pick, 10) - 1];
  if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }

  b.nasFolders = b.nasFolders || [];
  if(b.nasFolders.some(x => x.path === dir)){ toast('이미 연결된 폴더입니다'); return; }
  b.nasFolders.push({ id: uid('nf'), path: dir, label: dir.split('/').pop(), q: '' });
  markDirty();
  toast('📂 "' + b.name + '" 자료에 연결했습니다');
}

/* 훑을 폴더(목록을 만들 최상위 폴더)를 바꿉니다.
   Y:\... , \\netformrnd\... , /volume1/... 아무 형태나 받습니다. */
async function setScanRoot(){
  const now = (nasState.info && nasState.info['다음에훑을폴더'])
           || (nasState.info && nasState.info['훑은폴더']) || '';
  const v = prompt(
    '파일 목록을 만들 최상위 폴더를 넣어주세요.\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\n\n'
    + '바꾼 뒤에는 NAS 작업 스케줄러에서 scan.sh 를 한 번 더 실행해 주세요.', now);
  if(v === null) return;
  if(!v.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  try{
    const out = await apiJson('nasfiles.php?action=setroot', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ dir: v })
    });
    toast('✅ ' + out['훑을폴더'] + ' — 작업 스케줄러에서 scan.sh 를 실행해 주세요');
    nasCheck();
  }catch(e){
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n')
                 + '\n\n폴더 이름에 띄어쓰기나 점(.)이 있으면 그대로 넣어주세요.' : ''));
  }
}

/* 어느 폴더가 어느 브랜드로 자동 연결됐는지 한눈에 보여줍니다 */
function autoMatchPanel(){
  if(treeCache === null){ setTimeout(loadTree, 10); return ''; }
  if(treeCache.loading) return '<div class="fmeta" style="margin-bottom:12px">브랜드 연결을 맞춰보는 중…</div>';
  if(treeCache.error)   return '';

  const rows = data.brands.map(b => {
    const auto = autoFoldersFor(b);
    const man  = (b.nasFolders || []);
    const all  = auto.map(f => ({ name:f.name, count:f.count, auto:true }))
      .concat(man.map(f => ({ name:(f.label || f.path.split('/').pop()), count:null, auto:false })));
    return '<div class="krow" style="align-items:center">'
      + '<span style="flex:1;min-width:0"><b style="color:var(--text-primary)">'
        + esc(b.icon || '') + ' ' + esc(b.name) + '</b></span>'
      + '<span style="flex:2;min-width:0;text-align:right">'
        + (all.length
            ? all.map(x => '<span class="chip' + (x.auto ? ' on' : '') + '" style="margin-left:4px">'
                + (x.auto ? '🪄 ' : '📂 ') + esc(x.name)
                + (x.count !== null ? ' · ' + x.count.toLocaleString('ko-KR') + '개' : '')
                + '</span>').join('')
            : '<span class="fmeta">맞는 폴더 없음</span>')
      + '</span></div>';
  }).join('');

  const un = unmatchedFolders();
  const unHtml = un.length
    ? '<div class="fmeta" style="margin-top:10px">어느 브랜드에도 안 붙은 폴더 — '
      + un.map(f => esc(f.name)).join(' · ') + '</div>'
    : '';

  return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>🪄 브랜드 자동 연결</span>'
      + '<span class="mhs">폴더 이름을 보고 저절로 맞춥니다 · 손댈 것 없습니다</span>'
      + '<span style="margin-left:auto"><button class="btn sm" onclick="treeCache=null;render()">↻</button></span>'
    + '</div>' + rows + unHtml + '</div>';
}

function secBar(type){
  const t = TYPES[type];
  return '<div class="sec-bar">'
    + '<button class="btn primary" onclick="openItemModal(\'' + type + '\')">＋ ' + t.label + ' 추가</button>'
    + '<span class="hint">' + t.hint + '</span></div>';
}

function viewCards(b, type){
  const t = TYPES[type];
  const list = b[type];
  if(!list.length) return secBar(type) + '<div class="empty">' + t.empty + '</div>';

  return secBar(type) + '<div class="cards">' + list.map(it => {
    const bits = [];
    if(type === 'automations'){
      if(it.tool)   bits.push('<span class="chip">' + esc(it.tool) + '</span>');
      if(it.status) bits.push('<span class="chip ' + statusClass(it.status) + '">' + esc(it.status) + '</span>');
    }else{
      if(it.kind) bits.push('<span class="chip">' + esc(it.kind) + '</span>');
    }
    if(it.url){
      bits.push(isUrl(it.url)
        ? '<a class="lnk" href="' + esc(it.url) + '" target="_blank" rel="noopener">바로가기 ↗</a>'
        : '<span class="path">' + esc(it.url) + '</span>'
          + '<button class="btn sm" title="경로를 복사해 탐색기 주소창에 붙여넣으세요" '
          + 'onclick="copyPath(\'' + type + '\',\'' + it.id + '\')">📋 경로 복사</button>');
    }
    const text = it.desc || it.note || '';
    return '<div class="card">'
      + '<div class="ca">'
        + '<button class="btn sm" onclick="openItemModal(\'' + type + '\',\'' + it.id + '\')">수정</button>'
        + '<button class="btn sm danger" onclick="deleteItem(\'' + type + '\',\'' + it.id + '\')">삭제</button>'
      + '</div>'
      + '<div class="ct">' + esc(it.title) + '</div>'
      + (bits.length ? '<div class="row">' + bits.join('') + '</div>' : '')
      + (text ? '<div class="cd">' + esc(text) + '</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}

function fileIcon(name){
  const e = (String(name || '').split('.').pop() || '').toLowerCase();
  if(['pdf'].includes(e)) return '📕';
  if(['xlsx','xls','csv'].includes(e)) return '📗';
  if(['docx','doc','hwp','hwpx'].includes(e)) return '📘';
  if(['pptx','ppt'].includes(e)) return '📙';
  if(['png','jpg','jpeg','gif','webp','svg','heic'].includes(e)) return '🖼️';
  if(['zip','7z','rar'].includes(e)) return '🗜️';
  if(['mp4','mov','avi','mkv'].includes(e)) return '🎬';
  if(['dwg','dxf'].includes(e)) return '📐';
  return '📄';
}

function fmtSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  if(n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

            + '<div style="min-width:0"><div class="ct">' + esc(it.title) + '</div>'
            + (isFile ? '<div class="fmeta">' + esc(it.fileName) + ' · ' + fmtSize(it.fileSize)
                 + (it.filePath ? '<br><span style="opacity:.75">NAS: data\\files\\'
                     + esc(it.filePath.replace(/\//g, '\\')) + '</span>' : '')
                 + '</div>' : '')
            + '</div></div>'
          + (bits.length ? '<div class="row">' + bits.join('') + '</div>' : '')
          + (it.note ? '<div class="cd">' + esc(it.note) + '</div>' : '')
          + '</div>';
      }).join('') + '</div>';

  const report = uploadReport.length
    ? '<div class="upqueue">' + uploadReport.map(r =>
        '<div class="upitem"><span class="fileicon">' + fileIcon(r.name) + '</span>'
        + '<span class="nm">' + esc(r.name) + '</span>'
        + '<span class="fmeta">' + fmtSize(r.size) + '</span>'
        + '<span class="st ' + (r.ok ? 'ok' : 'err') + '">'
        + (r.ok ? '완료' : '실패') + '</span></div>'
        + (r.ok ? '' : '<div class="fmeta" style="padding:0 12px 4px">' + esc(r.error) + '</div>')
      ).join('')
      + '<button class="btn sm" style="align-self:flex-start" onclick="clearReport()">결과 닫기</button>'
      + '</div>'
    : '';
  return dropZone + '<div class="upqueue" id="upQueue"></div>' + report
       + viewNasFolders(b) + bar + cards;
}

/* ========================= 브랜드에 연결한 NAS 폴더 =========================
   파일을 복사하지 않고, 있는 자리에서 바로 내려받습니다.
   ========================================================================== */
const nasFolderCache = {};   // 폴더경로 → 파일 목록

async function loadNasFolder(brandId, folderId, path, q){
  const key = folderId;
  nasFolderCache[key] = { loading:true };
  try{
    const url = 'nasfiles.php?action=under&dir=' + encodeURIComponent(path)
              + (q ? '&q=' + encodeURIComponent(q) : '');
    const out = await (await fetch(url, { cache:'no-store' })).json();
    if(!out.ok) throw new Error(out.error || '목록을 불러오지 못했습니다');
    nasFolderCache[key] = out;
  }catch(e){
    nasFolderCache[key] = { error: e.message };
  }
  if(currentTab === 'assets') { render(); bindDrop(); }
}

function viewNasFolders(b){
  if(treeCache === null) setTimeout(loadTree, 10);

  const auto   = autoFoldersFor(b);
  const list   = b.nasFolders || [];
  const hidden = b.nasHidden || [];

  let note;
  if(treeCache && treeCache.loading)      note = 'NAS 폴더를 찾아보는 중…';
  else if(treeCache && treeCache.error)   note = '⚠️ ' + treeCache.error.split('\n')[0];
  else if(auto.length)                    note = '🪄 폴더 이름을 보고 자동으로 찾았습니다';
  else if(hidden.length && !list.length)   note = '자동으로 찾은 폴더를 숨겨둔 상태입니다';
  else if(!list.length)                   note = '이름이 맞는 NAS 폴더를 찾지 못했습니다. 아래 버튼으로 직접 연결해 주세요';
  else                                    note = '';

  const head = '<div class="sec-bar" style="margin-top:6px">'
    + '<button class="btn" onclick="addNasFolder()">📂 NAS 폴더 직접 연결</button>'
    + (hidden.length
        ? '<button class="btn sm" onclick="unhideAll()">숨긴 폴더 ' + hidden.length + '개 다시 보기</button>'
        : '')
    + '<span class="hint">' + esc(note) + '</span>'
    + '</div>';

  const autoHtml = auto.map(f =>
    '<div class="mbox" style="margin-bottom:12px">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>🪄 ' + esc(f.name) + '</span>'
      + '<span class="mhs">' + f.count.toLocaleString('ko-KR') + '개 · ' + esc(f.size) + '</span>'
      + '<span style="margin-left:auto;display:flex;gap:5px">'
        + '<button class="btn sm" onclick="hideAutoFolder(\'' + jsq(f.path) + '\')">숨기기</button>'
      + '</span>'
    + '</div>'
    + '<div class="path" style="margin-bottom:8px">' + esc(f.path) + '</div>'
    + folderBrowserHtml('auto:' + f.path, f.path, { crumbRoot: f.path })
    + '</div>').join('');

  if(!list.length) return head + autoHtml;

  return head + autoHtml + list.map(f => {
    let inner;

    if(!f.q){
      // 검색어가 없으면 폴더를 타고 들어가며 봅니다
      inner = folderBrowserHtml('nf:' + f.id, f.path, { crumbRoot: f.path });
    }else{
      const c = nasFolderCache[f.id];
      if(!c) { setTimeout(() => loadNasFolder(b.id, f.id, f.path, f.q), 10); }
      if(!c || c.loading) inner = '<div class="fmeta">불러오는 중…</div>';
      else if(c.error) inner = '<div class="fmeta">⚠️ ' + esc(c.error) + '</div>';
      else if(!c.results.length) inner = '<div class="fmeta">"' + esc(f.q) + '" 에 맞는 파일이 없습니다.</div>';
      else inner = '<div class="mbox">' + c.results.map(x =>
          '<div class="krow" style="align-items:center">'
          + '<span class="fileicon" style="font-size:15px">' + fileIcon(x.name) + '</span>'
          + '<span style="flex:1;min-width:0;white-space:normal;word-break:break-all">'
            + '<b style="color:var(--text-primary)">' + esc(x.name) + '</b>'
            + (x.sub ? '<span class="fmeta"> · ' + esc(x.sub) + '</span>' : '')
          + '</span>'
          + '<span class="fmeta" style="white-space:nowrap;margin:0">'
            + esc(x.size) + ' · ' + esc(x.date) + '</span>'
          + '<a class="btn sm" href="nasfiles.php?action=download&path='
            + encodeURIComponent(x.path) + '">⬇</a>'
          + '</div>').join('')
        + (c.matched > c.shown
            ? '<div class="fmeta" style="margin-top:8px">전체 ' + c.matched.toLocaleString('ko-KR')
              + '개 중 ' + c.shown + '개 표시 · 검색어를 더 좁혀보세요</div>' : '')
        + '</div>';
    }

    return '<div class="mbox" style="margin-bottom:12px">'
      + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
        + '<span>📂 ' + esc(f.label || f.path.split('/').pop()) + '</span>'
        + '<span style="margin-left:auto;display:flex;gap:5px">'
          + '<button class="btn sm" onclick="filterNasFolder(\'' + b.id + '\',\'' + f.id + '\')">'
            + (f.q ? '🔍 검색 중: ' + esc(f.q) : '🔍 폴더 안에서 찾기') + '</button>'
          + (f.q ? '<button class="btn sm" onclick="clearNasFolderFilter(\'' + b.id + '\',\''
                   + f.id + '\')">✕ 검색 지우기</button>' : '')
          + '<button class="btn sm danger" onclick="removeNasFolder(\'' + f.id + '\')">연결 해제</button>'
        + '</span>'
      + '</div>'
      + '<div class="path" style="margin-bottom:8px">' + esc(f.path) + '</div>'
      + inner + '</div>';
  }).join('');
}

function clearNasFolderFilter(brandId, id){
  const b = currentBrand();
  const f = b.nasFolders.find(x => x.id === id);
  if(!f) return;
  f.q = '';
  delete nasFolderCache[id];
  markDirty();
  redraw();
}

async function addNasFolder(){
  const b = currentBrand();
  if(!b) return;
  const path = prompt(
    'NAS 폴더 경로를 넣어주세요.\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\\공법\n\n'
    + '🗂️ NAS 자료 화면에서 그 폴더까지 들어간 뒤 [＋ 브랜드에 연결] 을 쓰시면 더 편합니다.');
  if(path === null) return;
  if(!path.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  let p;
  try{
    const out = await apiJson('nasfiles.php?action=resolve&path=' + encodeURIComponent(path));
    p = out.dir;
  }catch(e){
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n') : ''));
    return;
  }

  if(b.nasFolders.some(x => x.path === p)){ toast('이미 연결된 폴더입니다'); return; }
  const label = prompt('이 폴더를 뭐라고 부를까요? (비우면 폴더 이름 사용)',
                       p.split('/').pop()) || '';
  b.nasFolders.push({ id: uid('nf'), path: p, label: label.trim(), q: '' });
  markDirty();
  redraw();
  toast('📂 폴더를 연결했습니다');
}

function removeNasFolder(id){
  const b = currentBrand();
  const f = b.nasFolders.find(x => x.id === id);
  if(!confirm('"' + (f.label || f.path) + '" 연결을 해제할까요?\n\n'
    + 'NAS의 실제 파일은 그대로 남습니다. 목록에서만 사라집니다.')) return;
  b.nasFolders = b.nasFolders.filter(x => x.id !== id);
  delete nasFolderCache[id];
  render(); bindDrop(); markDirty();
}

function refreshNasFolder(brandId, id){
  const f = currentBrand().nasFolders.find(x => x.id === id);
  delete nasFolderCache[id];
  loadNasFolder(brandId, id, f.path, f.q || '');
  toast('↻ 다시 불러옵니다');
}

function filterNasFolder(brandId, id){
  const b = currentBrand();
  const f = b.nasFolders.find(x => x.id === id);
  const q = prompt('이 폴더 안에서 찾을 이름을 넣어주세요. (비우면 전체)', f.q || '');
  if(q === null) return;
  f.q = q.trim();
  delete nasFolderCache[id];
  markDirty();
  if(f.q) loadNasFolder(brandId, id, f.path, f.q);
  else redraw();
}

function statusChip(st){
  const map = { '진행 중':'test', '성공':'on', '실패':'off', '중단':'off', '보류':'' };
  return st ? '<span class="chip ' + (map[st] || '') + '">' + esc(st) + '</span>' : '';
}

function viewTasks(b){
  const list = b.tasks;
  if(!list.length) return secBar('tasks') + '<div class="empty">' + TYPES.tasks.empty + '</div>';

  const order = { '진행 중':0, '예정':1, '보류':2, '완료':3 };
  const sorted = list.slice().sort((x, y) => {
    const d = (order[x.status] ?? 1) - (order[y.status] ?? 1);
    if(d) return d;
    if(x.due && y.due) return x.due.localeCompare(y.due);
    return x.due ? -1 : y.due ? 1 : 0;
  });

  const today = new Date().toISOString().slice(0,10);
  const dueChip = t => {
    if(!t.due || t.status === '완료') return '';
    const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
    const label = fmtDate(t.due);
    if(days < 0)  return '<span class="chip off">지남 · ' + esc(label) + '</span>';
    if(days <= 3) return '<span class="chip test">D-' + days + ' · ' + esc(label) + '</span>';
    return '<span class="chip">' + esc(label) + '</span>';
  };
  const stChip = st => {
    const m = { '진행 중':'test', '완료':'on', '보류':'', '예정':'' };
    return '<span class="chip ' + (m[st] || '') + '">' + esc(st || '예정') + '</span>';
  };

  return secBar('tasks') + '<div class="cards">' + sorted.map(t =>
    '<div class="card' + (t.status === '완료' ? ' done' : '') + '">'
    + '<div class="ca">'
      + (t.status !== '완료'
          ? '<button class="btn sm" title="완료 처리" onclick="toggleTask(\'' + t.id + '\')">✓ 완료</button>'
          : '<button class="btn sm" title="다시 진행" onclick="toggleTask(\'' + t.id + '\')">되돌리기</button>')
      + '<button class="btn sm" onclick="openItemModal(\'tasks\',\'' + t.id + '\')">수정</button>'
      + '<button class="btn sm danger" onclick="deleteItem(\'tasks\',\'' + t.id + '\')">삭제</button>'
    + '</div>'
    + '<div class="ct">' + esc(t.title) + '</div>'
    + '<div class="row">' + stChip(t.status) + dueChip(t)
      + (t.owner ? '<span class="chip">' + esc(t.owner) + '</span>' : '') + '</div>'
    + (t.note ? '<div class="cd">' + esc(t.note) + '</div>' : '')
    + '</div>').join('') + '</div>';
}

function toggleTask(id){
  const t = currentBrand().tasks.find(x => x.id === id);
  t.status = t.status === '완료' ? '진행 중' : '완료';
  t.updatedAt = new Date().toISOString();
  render(); markDirty();
}

function viewLinks(b){
  const list = b.links;
  if(!list.length) return secBar('links') + '<div class="empty">' + TYPES.links.empty + '</div>';

  // 분류별로 묶고, 입력창의 분류 순서대로 보여줍니다
  const order = TYPES.links.fields.find(f => f.key === 'kind').options;
  const groups = {};
  list.forEach(l => { (groups[l.kind || '기타'] = groups[l.kind || '기타'] || []).push(l); });
  const ordered = Object.entries(groups).sort((a, b) => {
    const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  return secBar('links') + ordered.map(([kind, items]) =>
    '<div style="margin-bottom:18px">'
    + '<div class="hsec" style="margin:0 0 9px">' + esc(kind) + '</div>'
    + '<div class="cards">' + items.map(l => {
        const show = l.preview !== '안 보기' && isUrl(l.url);
        return '<div class="card linkcard' + (show ? ' haspv' : '') + '">'
        + '<div class="ca">'
          + (show ? '<button class="btn sm" title="미리보기 새로고침" '
                    + 'onclick="reloadPreview(\'' + l.id + '\')">↻</button>' : '')
          + '<button class="btn sm" onclick="openItemModal(\'links\',\'' + l.id + '\')">수정</button>'
          + '<button class="btn sm danger" onclick="deleteItem(\'links\',\'' + l.id + '\')">삭제</button>'
        + '</div>'
        + (show
            ? '<a class="pvwrap" href="' + esc(l.url) + '" target="_blank" rel="noopener" '
              + 'title="클릭하면 새 탭에서 열립니다">'
              + '<iframe class="pv" id="pv_' + l.id + '" src="' + esc(l.url) + '" '
                + 'loading="lazy" sandbox="allow-scripts allow-same-origin" '
                + 'referrerpolicy="no-referrer" scrolling="no" tabindex="-1"></iframe>'
              + '<span class="pvmask"></span></a>'
            : '')
        + '<a class="ct" href="' + esc(l.url) + '" target="_blank" rel="noopener">'
          + esc(l.title) + ' <span class="go">↗</span></a>'
        + (l.desc ? '<div class="cd">' + esc(l.desc) + '</div>' : '')
        + '<div class="fmeta" style="margin-top:8px">'
          + esc(l.url.replace(/^https?:\/\//,'').slice(0,60)) + '</div>'
        + '</div>';
      }).join('') + '</div></div>').join('')
    + '<div class="fmeta" style="margin-top:14px">'
      + '미리보기가 빈 화면으로 나오면 그 사이트가 외부 표시를 막아둔 것입니다. '
      + '(네이버·구글 애널리틱스 등) 이때는 수정에서 미리보기를 「안 보기」로 바꿔주세요.'
      + '</div>';
}

function reloadPreview(id){
  const f = document.getElementById('pv_' + id);
  if(f) f.src = f.src;   // 같은 주소를 다시 넣어 새로 불러옵니다
  toast('↻ 미리보기를 새로 불러옵니다');
}

/* ========================= 문의 =========================
   구글시트의 문의 기록을 n8n 등으로 NAS에 밀어 넣으면 여기에 표시됩니다.
   시트를 외부에 공개하지 않아도 되고, 대시보드에는 읽기 전용으로 보입니다.
   ======================================================== */
const inquiryCache = { loaded:false, loading:false, updatedAt:null, total:0,
                       columns:[], byBrand:{}, error:null };
let inquiryQuery = '';

const SYNC_INTERVAL_MIN = 5;   // 이 시간이 지났으면 탭을 열 때 알아서 다시 가져옵니다

async function syncInquiries(manual){
  if(STORAGE_MODE !== 'nas') return;
  const stat = document.getElementById('csvStat');
  if(stat) stat.textContent = '시트에서 가져오는 중…';
  try{
    const res = await fetch('inquiries.php?action=sync', { cache:'no-store' });
    const t = await res.text();
    let out = null;
    try { out = JSON.parse(t); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '가져오지 못했습니다');
    inquiryCache.loaded = false;
    await loadInquiries(true);
    if(manual) toast('↻ 시트에서 ' + out['가져온건수'] + '건을 가져왔습니다');
  }catch(e){
    if(manual) showError('시트를 가져오지 못했습니다: ' + e.message);
    else inquiryCache.syncError = e.message;
  }finally{
    const st = document.getElementById('csvStat');
    if(st) st.textContent = '';
  }
}

async function setSheetUrl(){
  const cur = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨' ? inquiryCache.sheetUrl : '';
  const url = prompt(
    '구글시트 CSV 주소를 넣어주세요.\n\n'
    + '시트에서 파일 → 공유 → 웹에 게시 → 형식을 「쉼표로 구분된 값(.csv)」 으로 선택하면\n'
    + '나오는 주소입니다. 비우고 확인을 누르면 연결이 해제됩니다.', cur);
  if(url === null) return;
  try{
    const res = await fetch('inquiries.php?action=setsource', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url: url.trim() })
    });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || '등록하지 못했습니다');
    inquiryCache.sheetUrl = url.trim() || '연결 안 됨';
    if(url.trim()){ await syncInquiries(true); }
    else { toast('시트 연결을 해제했습니다'); inquiryCache.loaded = false; await loadInquiries(true); }
  }catch(e){ showError('시트 주소를 등록하지 못했습니다: ' + e.message); }
}

async function loadInquiries(force){
  if(STORAGE_MODE !== 'nas'){ inquiryCache.loaded = true; return; }
  if(inquiryCache.loading || (inquiryCache.loaded && !force)) return;
  inquiryCache.loading = true;
  try{
    const res = await fetch('inquiries.php?action=list&t=' + Date.now(), { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '불러오지 못했습니다');

    const by = {};
    const norm = v => String(v || '').replace(/\s/g, '');
    (out.rows || []).forEach(r => {
      const bn = r['브랜드'] || r['brand'] || r['Brand'] || r['브랜드명'] || '';
      (by[norm(bn)] = by[norm(bn)] || []).push(r);
    });
    // 대시보드의 브랜드 이름 기준으로 다시 담습니다
    inquiryCache.byBrand = {};
    data.brands.forEach(b => { inquiryCache.byBrand[b.name] = by[norm(b.name)] || []; });

    inquiryCache.columns   = out.columns || [];
    inquiryCache.updatedAt = out.updatedAt;
    inquiryCache.total     = out.total || 0;
    inquiryCache.error     = null;

    // 연결된 시트 주소를 함께 확인합니다
    try{
      const c = await (await fetch('inquiries.php?action=check', { cache:'no-store' })).json();
      inquiryCache.sheetUrl = c['연결된시트'] || '연결 안 됨';
    }catch(e){ inquiryCache.sheetUrl = '확인 불가'; }

    // 마지막으로 가져온 지 오래됐으면 조용히 다시 가져옵니다
    const linked = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨';
    const old = !out.updatedAt ||
      (Date.now() - new Date(out.updatedAt).getTime()) > SYNC_INTERVAL_MIN * 60000;
    if(linked && old && !inquiryCache.autoSyncing){
      inquiryCache.autoSyncing = true;
      setTimeout(() => { syncInquiries(false).finally(() => { inquiryCache.autoSyncing = false; }); }, 50);
    }
  }catch(e){
    inquiryCache.error = e.message;
    // 목록을 못 불러와도 연결 상태는 따로 확인해 둡니다
    try{
      const c = await (await fetch('inquiries.php?action=check', { cache:'no-store' })).json();

    if(!searchQuery && (currentTab === 'inquiries' || !currentBrandId)) render();

}

/* 구글시트에서 내려받은 CSV를 읽습니다 (따옴표·줄바꿈 포함된 셀도 처리) */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // 엑셀 BOM 제거
  const rows = [];
  let row = [], cell = '', inQuote = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuote){
      if(c === '"'){
        if(text[i + 1] === '"'){ cell += '"'; i++; }
        else inQuote = false;
      } else cell += c;
    }else{
      if(c === '"') inQuote = true;
      else if(c === ',') { row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c !== '\r') cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

function csvToObjects(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('내용이 없습니다. 머리글 줄과 데이터가 있어야 합니다.');
  const head = rows[0].map(h => String(h).trim());
  if(!head.some(h => ['브랜드','brand','Brand','브랜드명'].includes(h)))
    throw new Error('브랜드 열을 찾지 못했습니다. 첫 줄에 「브랜드」 열이 있어야 합니다. '
      + '(찾은 열: ' + head.filter(Boolean).join(', ') + ')');
  return rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, i) => { if(h) o[h] = (r[i] || '').trim(); });
    return o;
  });
}

async function uploadInquiryCsv(file){
  const stat = document.getElementById('csvStat');
  const setStat = t => { if(stat) stat.textContent = t; };
  setStat('읽는 중…');
  try{
    const text = await file.text();
    const rows = csvToObjects(text);
    setStat(rows.length + '건 보내는 중…');

    const res = await fetch('inquiries.php?action=push', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ source:'csv-' + file.name.slice(0, 40), rows })
    });
    const t = await res.text();
    let out = null;
    try { out = JSON.parse(t); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
      + t.slice(0, 200).replace(/\s+/g, ' '));
    if(!out.ok) throw new Error(out.error || '보내지 못했습니다');

    setStat('');
    inquiryCache.loaded = false;
    await loadInquiries(true);
    toast('📞 문의 ' + out['받은건수'] + '건을 등록했습니다');
  }catch(e){
    setStat('');
    showError('문의 파일을 읽지 못했습니다: ' + e.message);
  }
}

function bindCsvInput(){
  const inp = document.getElementById('csvInput');

  inp.addEventListener('change', () => {

/* 시트의 열 구성을 몰라도 되게, 값을 보고 성격을 추측합니다.
   - 날짜처럼 생긴 열 → 기간 집계에 사용
   - 값 종류가 적은 짧은 열(상태·공종·유입 등) → 분류 집계에 사용
   - 이름·연락처·내용처럼 값이 제각각인 열 → 집계에서 제외 */
function diffTag(v){
  if(v === null || v === undefined) return '';
  const up = v >= 0;
  return '<span class="delta ' + (up ? 'up' : 'down') + '">'
       + (up ? '▲' : '▼') + Math.abs(v) + '%</span>';
}

function bars(items, valueKey){
  const max = Math.max(...items.map(x => x[valueKey] || 0), 1);
  return '<div class="bars">' + items.map(x =>
    '<div class="bar-row"><span class="bl" title="' + esc(x.label) + '">' + esc(x.label) + '</span>'
    + '<span class="bt"><span class="bf" style="width:'
      + Math.round((x[valueKey] || 0) / max * 100) + '%"></span></span>'
    + '<span class="bv">' + (x[valueKey] || 0).toLocaleString('ko-KR') + '</span></div>').join('')
    + '</div>';
}

function analyzeInquiries(rows){
  const skip = ['브랜드','brand','Brand','브랜드명'];
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if(!cols.includes(k)) cols.push(k); }));

  const looksDate = v => /^\d{4}[-./]\s?\d{1,2}[-./]\s?\d{1,2}/.test(String(v || '').trim());
  const dateCol = cols.find(c => /날짜|일자|일시|date/i.test(c) && rows.some(r => looksDate(r[c])))
               || cols.find(c => rows.filter(r => looksDate(r[c])).length > rows.length * 0.5);

  // 이름·연락처처럼 사람마다 다른 값은 집계에 쓰지 않습니다
  const isPrivate = c => /이름|성함|고객명|담당자|연락처|전화|휴대|번호|이메일|메일|주소/.test(c);

  // 먼저 설명 열(문의 내용 등)을 정합니다 — 가장 길게 적히는 열
  let textCol = null, bestLen = 0;
  cols.forEach(c => {
    if(skip.includes(c) || c === dateCol || isPrivate(c)) return;
    const vals = rows.map(r => String(r[c] || '').trim()).filter(Boolean);
    if(!vals.length) return;
    const avg = vals.reduce((a, v) => a + v.length, 0) / vals.length;
    if(avg > bestLen){ bestLen = avg; textCol = c; }
  });
  if(bestLen < 12) textCol = null;      // 다들 짧으면 설명 열이 없는 것으로 봅니다

  // 나머지 중 같은 값이 반복되는 짧은 열을 분류로 봅니다 (공종·유입·상태 등)
  const cats = [];
  cols.forEach(c => {
    if(skip.includes(c) || c === dateCol || c === textCol || isPrivate(c)) return;
    const vals = rows.map(r => String(r[c] || '').trim()).filter(Boolean);
    if(vals.length < rows.length * 0.2) return;                 // 대부분 비어 있으면 제외
    const uniq = new Set(vals);
    const avgLen = vals.reduce((a, v) => a + v.length, 0) / vals.length;
    if(uniq.size >= 2 && uniq.size <= 20 && uniq.size < vals.length * 0.8 && avgLen <= 15){
      cats.push({ col:c, uniq:uniq.size });
    }
  });
  cats.sort((a, b) => a.uniq - b.uniq);                          // 종류가 적은 것부터

  return { cols, dateCol, cats: cats.map(x => x.col).slice(0, 6), textCol };
}

function ym(v){
  const m = String(v || '').match(/^(\d{4})[-./]\s?(\d{1,2})/);
  return m ? m[1] + '-' + String(m[2]).padStart(2, '0') : '';
}

function countBy(rows, col){
  const m = {};
  rows.forEach(r => {
    const v = String(r[col] || '').trim() || '(비어 있음)';
    m[v] = (m[v] || 0) + 1;
  });
  return Object.entries(m).map(([label, count]) => ({ label, count }))
    .sort((a, b) => b.count - a.count);
}

function inquirySummary(rows){
  const a = analyzeInquiries(rows);
  const now = new Date();
  const thisYM = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevYM = prev.getFullYear() + '-' + String(prev.getMonth() + 1).padStart(2, '0');

  // 이번 달이 아직 진행 중이면, 지난달도 "같은 날짜까지만" 세어야 비교가 맞습니다
  const today = now.getDate();
  const dayOf = v => {
    const m = String(v || '').match(/^\d{4}[-./]\s?\d{1,2}[-./]\s?(\d{1,2})/);
    return m ? Number(m[1]) : 0;
  };

  let thisMonth = 0, lastMonth = 0, lastMonthFull = 0, latest = '';
  if(a.dateCol){
    rows.forEach(r => {
      const k = ym(r[a.dateCol]);
      if(k === thisYM) thisMonth++;
      if(k === prevYM){
        lastMonthFull++;
        if(dayOf(r[a.dateCol]) <= today) lastMonth++;
      }
      const d = String(r[a.dateCol] || '').trim();
      if(d && d > latest) latest = d;
    });
  }
  return Object.assign(a, { thisMonth, lastMonth, lastMonthFull, latest, thisYM, prevYM, today });
}

function moveBrand(id, dir){
  const i = data.brands.findIndex(b => b.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= data.brands.length) return;
  [data.brands[i], data.brands[j]] = [data.brands[j], data.brands[i]];
  render(); markDirty();
}

function moveHistory(id, dir){
  const b = currentBrand();
  const i = b.history.findIndex(x => x.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= b.history.length) return;
  [b.history[i], b.history[j]] = [b.history[j], b.history[i]];
  render(); markDirty();
}
