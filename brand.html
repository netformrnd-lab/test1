  catch(e){ prompt('아래 내용을 복사해 쓰세요', p.ai || ''); }
}

/* ── 사람 보드 — 브랜드마다 성과 정리 ────────────────────────────
   이제 「유입 1 · 전환 2 · 활성화 3 …」 으로 번호 매겨 적지 않습니다.
   내 보드에서 브랜드를 고르고, 그 브랜드의 성과를 발표 틀로 적습니다.
   그동안 한 일은 그 아래에 근거로 붙습니다 (접혀 있습니다).
   ------------------------------------------------------------- */
let gbPbId = '';          // 사람 보드에서 고른 브랜드
function setGbPb(id){ gbPbId = id; render(); window.scrollTo({ top: 0 }); }

/* 이 사람이 손댄 브랜드 (한 일 수와 함께) + 성과만 적어 둔 브랜드 */
function gbMyBrands(g){
  const n = {};
  (g.stages || []).forEach(st => (st.items || []).forEach(it => {
    n[it.brandId || ''] = (n[it.brandId || ''] || 0) + 1;
  }));
  gbPerfs().forEach(p => {
    if(p.who === g.who && String(p.year) === String(g.year) && n[p.brandId] === undefined)
      n[p.brandId] = 0;
  });
  const out = (data.brands || []).filter(b => n[b.id] !== undefined)
    .map(b => ({ id:b.id, name:b.name, icon:b.icon || '🏷️', color:b.color, n:n[b.id] }));
  if(n[''] !== undefined) out.push({ id:'', name:'브랜드 없음', icon:'·', color:'', n:n[''] });
  return out;
}

/* 이 브랜드에서 한 일 (단계 상관없이 한 줄로) */
function gbMyItems(g, brandId){
  const out = [];
  (g.stages || []).forEach(st => (st.items || []).forEach(it => {
    if((it.brandId || '') !== brandId) return;
    if(gbSt && (it.status || '진행 중') !== gbSt) return;
    if(!gbHit(it, gbQ.trim())) return;
    out.push({ st: st, it: it });
  }));
  return out;
}

/* 브랜드 탭 — 지표보다 위에 둡니다 (아래 전부가 이 선택을 따르므로).
   모두가 모든 브랜드를 하므로 브랜드는 늘 전부 나옵니다. 아직 아무것도
   안 적은 브랜드도 눌러서 바로 쓸 수 있어야 합니다. */
function gbBrandTabs(g){
  const n = {};
  gbMyBrands(g).forEach(b => { n[b.id] = b.n; });
  const pick = (data.brands || []).map(b => ({ id:b.id, name:b.name,
    icon:b.icon || '🏷️', color:b.color, n:n[b.id] || 0 }));
  if(n[''] !== undefined) pick.push({ id:'', name:'브랜드 없음', icon:'·', color:'', n:n[''] });
  if(!pick.length) return '';
  /* 처음 열 때는 한 일이 가장 많은 브랜드부터 보여줍니다 (고른 뒤에는 그대로 둡니다).
     다만 「브랜드 없음」 에는 저절로 들어가지 않습니다 — 거기서 업무를 더하면
     그것도 브랜드 없음이 되어, 브랜드 없음이 계속 불어납니다. */
  if(!pick.some(b => b.id === gbPbId)){
    const real = pick.filter(b => b.id);
    const top = (real.length ? real : pick).slice().sort((a, c) => c.n - a.n)[0];
    gbPbId = top ? top.id : '';
  }
  return '<div class="gb-btabs">'
    + pick.map(b => '<button class="' + (b.id === gbPbId ? 'on' : '') + '" '
        + (b.color ? 'style="--hue:' + esc(b.color) + '" ' : '')
        + 'onclick="setGbPb(\'' + jsq(b.id) + '\')">'
        + esc(b.icon) + ' ' + esc(b.name)
        + (b.n ? ' <b>' + b.n + '</b>' : '') + '</button>').join('')
    + '</div>';
}

function gbMyBrandHtml(g, filter){
  if(!(data.brands || []).length)
    return '<div class="empty">브랜드가 없습니다. 왼쪽에서 먼저 만들어 주세요.</div>';

  const rows = gbMyItems(g, gbPbId);
  const open = gbOpen['gbdone_' + gbPbId] === true;
  const done = '<div class="gb-stage" style="margin-top:14px">'
    + '<button class="gb-sh" style="--hue:var(--text-muted)" '
      + 'onclick="gbToggle(\'gbdone_' + jsq(gbPbId) + '\')">'
      + '<span class="ar">' + (open ? '▼' : '▶') + '</span>'
      + '<span class="nm">📋 ' + esc(gbPbName()) + '에서 한 일</span>'
      + '<span class="ds">이 브랜드로 해 온 업무 기록</span>'
      + '<span class="ct">' + (rows.length ? rows.length + '건' : '비어 있음') + '</span>'
      + '</button>'
    + (open
        ? '<div class="gb-sb">'
          + (rows.length
              ? (gbShot
                  /* 사진으로 뽑을 때는 접힌 한 줄이 아니라 속을 다 펴서 담습니다 —
                     「저기 안에 있는 것」 이 다 나와야 하기 때문입니다. */
                  ? '<div class="gb-full">'
                    + rows.map((r, i) => gbItemFullHtml(g, r.st, r.it, i,
                        { stage: true })).join('')
                    + '</div>'
                  : '<div class="gb-list">'
                    + rows.map((r, i) => gbRowHtml(g, r.st, r.it,
                        (r.st.items || []).indexOf(r.it), { stage: true, no: i + 1 })).join('')
                    + '</div>')
              : '<div class="empty" style="padding:14px 0">아직 없습니다.</div>')
          + (gbGone ? ''            // 그만둔 사람 보드에 새 업무를 더할 일은 없습니다
              : '<button class="gb-add' + (gbTplAt === 'my' ? ' on' : '') + '" '
                + 'onclick="gbAddMine()">＋ 한 일 추가</button>'
                + gbTplBar('my'))
          + '</div>'
        : '')
    + '</div>';

  /* 「브랜드 없음」 을 보고 있을 때는 짚어 줍니다 — 여기서 만들면 그것도
     브랜드가 안 붙어서, 브랜드 없음이 계속 불어납니다. */
  const warn = (!gbPbId && (data.brands || []).length && !gbShot)
    ? '<div class="gb-nob">여기 있는 <b>' + rows.length + '건</b> 은 아직 어느 브랜드 것인지 '
      + '안 정해진 업무입니다.<br>'
      + '<span>여기서 ＋ 한 일을 만들면 그것도 브랜드가 안 붙습니다. '
      + '위에서 브랜드를 고르고 만들거나, 아래로 한 번에 정리하세요.</span>'
      + '<button class="btn sm primary" onclick="gbFixOpen()">🏷️ 브랜드 정리 열기</button>'
      + '</div>'
    : '';
  /* 성과 정리 칸(결과 지표 · 선행 지표 · 왜 · 어떻게 · 달성 · 교훈)은 뺐습니다.
     그로스보드는 브랜드마다 「한 일」 을 남기는 곳입니다.
     적어 두셨던 것은 지우지 않고 data.gbperf 에 그대로 있습니다. */
  return warn + (filter || '') + done;
}

/* ── 🏷️ 브랜드 정리 ───────────────────────────────────────
   예전 브랜드플로우는 「브랜드_사람」 으로 보드가 하나씩이라, 옮겨올 때
   그 보드의 브랜드 하나를 모든 업무에 똑같이 찍었습니다. 그런데 한 사람이
   한 브랜드 일만 하지는 않습니다. 그래서 한 화면에서 줄줄이 고칩니다.
   ------------------------------------------------------------- */
let gbFixOn = false;
function gbFixToggle(){ gbFixOn = !gbFixOn; render(); }
function gbFixOpen(){
  gbFixOn = true; render();
  const el = document.querySelector('.gb-fix');
  if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
/* 아직 브랜드를 안 정한 업무 수 — 단추에 숫자로 띄웁니다 */
function gbFixNo(g){
  let n = 0;
  ((g && g.stages) || []).forEach(st => (st.items || []).forEach(it => {
    if(!String(it.brandId || '').trim()) n++;
  }));
  return n;
}
function gbFixSet(sid, iid, bid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return;
  it.brandId = bid;
  markDirtyAll(); render();
}
function gbFixHtml(g){
  if(!gbFixOn) return '';
  const rows = [];
  (g.stages || []).forEach(st => (st.items || []).forEach(it => rows.push({ st: st, it: it })));
  if(!rows.length){
    return '<div class="gb-fix"><div class="empty" style="padding:14px 0">'
      + '아직 한 일이 없습니다.</div></div>';
  }
  const opt = it => '<option value="">· 브랜드 없음</option>'
    + (data.brands || []).map(b => '<option value="' + esc(b.id) + '"'
        + (String(it.brandId || '') === b.id ? ' selected' : '') + '>'
        + esc(b.icon || '🏷️') + ' ' + esc(b.name) + '</option>').join('');
  const no = gbFixNo(g);
  return '<div class="gb-fix">'
    + '<div class="fh"><b>🏷️ 한 일마다 어느 브랜드 것인지 고르세요</b>'
      + '<span>' + rows.length + '건'
      + (no ? ' · 아직 안 정한 것 ' + no + '건' : ' · 다 정했습니다')
      + ' — 고르면 바로 저장됩니다</span></div>'
    + rows.map((r, i) => '<div class="fr' + (String(r.it.brandId || '').trim() ? '' : ' no') + '">'
        + '<span class="no">' + (i + 1) + '</span>'
        + '<span class="tt">' + esc(r.it.title || '(제목 없음)') + '</span>'
        + '<span class="sg">' + esc(r.st.label || '') + '</span>'
        + '<select onchange="gbFixSet(\'' + jsq(r.st.id) + '\',\'' + jsq(r.it.id)
          + '\', this.value)">' + opt(r.it) + '</select>'
      + '</div>').join('')
    + '</div>';
}

/* 이 업무가 어느 브랜드 것인가 */
function gbBrandOf(it){
  return (it && it.brandId) ? (data.brands || []).find(b => b.id === it.brandId) : null;
}

/* 브랜드 고르는 칸 (업무 상세에서) */
function gbBrandSel(ip, it){
  return '<label>브랜드<select onchange="gbEditDraw(\'' + jsq(ip) + 'brandId\', this.value)">'
    + '<option value="">브랜드 없음</option>'
    + (data.brands || []).map(b => '<option value="' + esc(b.id) + '"'
        + (it.brandId === b.id ? ' selected' : '') + '>'
        + esc(b.icon || '🏷️') + ' ' + esc(b.name) + '</option>').join('')
    + '</select></label>';
}

/* 지금 고른 브랜드 이름 · 아이콘 */
function gbPbName(){
  const b = (data.brands || []).find(x => x.id === gbPbId);
  return b ? b.name : '브랜드 없음';
}
function gbPbIcon(){
  const b = (data.brands || []).find(x => x.id === gbPbId);
  return b ? (b.icon || '🏷️') : '·';
}

/* 한 일 추가 — 고른 브랜드로 붙고, 서식에 맞는 단계에 들어갑니다 */
function gbAddMine(sid, tplKey){
  if(!tplKey){ gbPickTpl('my'); return; }
  const g = gbEnsure(gbWho, gbYear);
  const T = GB_TPL.find(x => x.key === tplKey) || GB_TPL[0];
  const key = T.st || 'own';
  let st = (g.stages || []).find(x => x.key === key) || (g.stages || [])[0];
  if(!st){
    st = { id: uid('gs'), key:'own', no:1, label:'개인 및 자유업무', desc:'', items:[] };
    g.stages.push(st);
  }
  const it = { id: uid('gi'), title: T.ti || '새 업무', status:'진행 중', kpiId:'',
    brandId: gbPbId, tpl: T.key,
    acts:[ { id: uid('ga'), mode:'goal', text:'', basis:'', value:'',
             steps: (T.steps || []).map(x => ({ id: uid('gt'), kind:'act', text: x, subs:[] })) } ] };
  st.items = st.items || [];
  st.items.push(it);
  gbTplAt = '';
  gbOpen['gbdone_' + gbPbId] = true;
  markDirtyAll();
  gbOpenItem(st.id, it.id);
}

/* ── 목록 → 안으로 들어가기 ────────────────────────────────────
   예전에는 업무를 누르면 그 자리에서 아래로 펴져서, 화면이 밀리고
   좁은 칸 안에 내용이 갇혔습니다. 이제 단계 안은 목록이고,
   업무를 누르면 그 업무만 화면 가득 열립니다.
   ------------------------------------------------------------- */
let gbIt   = null;      // { sid, iid } — 업무 하나를 크게 보는 중
let gbBackY = 0;        // 목록으로 돌아왔을 때 있던 자리

function gbOpenItem(sid, iid){
  gbBackY = window.scrollY;
  gbIt = { sid: sid, iid: iid };
  render();
  window.scrollTo({ top: 0 });
}
function gbCloseItem(){
  gbIt = null;
  render();
  window.scrollTo({ top: gbBackY });
}
/* 옆 업무로 바로 넘어가기 */
function gbStep2(d){
  const g = gbFind(gbWho, gbYear); if(!g || !gbIt) return;
  const flat = [];
  (g.stages || []).forEach(st => gbVisibleItems(st)
    .forEach(it => flat.push({ sid: st.id, iid: it.id })));
  const i = flat.findIndex(x => x.sid === gbIt.sid && x.iid === gbIt.iid);
  const n = flat[i + d];
  if(!n) return;
  gbIt = n; render(); window.scrollTo({ top: 0 });
}
/* 다른 단계로 옮기기 */
function gbMoveStage(sid, iid, to){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const from = (g.stages || []).find(x => x.id === sid);
  const dst  = (g.stages || []).find(x => x.id === to);
  if(!from || !dst || from === dst) return;
  const it = (from.items || []).find(x => x.id === iid); if(!it) return;
  from.items = from.items.filter(x => x.id !== iid);
  dst.items  = dst.items || []; dst.items.push(it);
  if(gbIt && gbIt.iid === iid) gbIt.sid = dst.id;
  gbOpen[dst.id] = true;
  g.updatedAt = new Date().toISOString();
  markDirtyAll(); render();
  toast('→ 「' + (dst.label || '') + '」 로 옮겼습니다');
}

/* 목록 한 줄 — 무엇을 하는 일이고 어떻게 됐는지가 한눈에 */
function gbRowHtml(g, st, it, idx, opts){
  opts = opts || {};
  const stt  = GB_STATUS.indexOf(it.status) >= 0 ? it.status : '진행 중';
  const iwb  = gbWbCount(it);
  const peek = gbPeek(it);
  const br   = gbBrandOf(it);
  let all = 0;
  (it.acts || []).forEach(a => (a.steps || []).forEach(t => {
    if(String(t.text || '').trim()) all++;
  }));

  return '<button class="gb-row2' + (stt === '완료' ? ' done' : '') + '" '
    + 'onclick="gbOpenItem(\'' + jsq(st.id) + '\',\'' + jsq(it.id) + '\')">'
    + '<span class="no">' + (opts.no || (idx + 1)) + '</span>'
    + '<span class="mid">'
      + '<span class="tt">' + esc(it.title || '(제목 없음)') + '</span>'
      + (peek ? '<span class="pk">' + peek + '</span>' : '')
    + '</span>'
    + '<span class="cs">'
      // 브랜드별로 볼 때는 「어느 단계」, 단계별로 볼 때는 「어느 브랜드」 를 붙입니다
      + (opts.stage
          ? '<span class="chip st">' + esc(st.label || '') + '</span>'
          : (br ? '<span class="chip br"' + (br.color ? ' style="border-color:' + esc(br.color)
                    + ';color:' + esc(br.color) + '"' : '') + '>'
                  + esc(br.icon || '🏷️') + ' ' + esc(br.name) + '</span>' : ''))
      + '<span class="chip s' + GB_STATUS.indexOf(stt) + '">' + esc(stt) + '</span>'
      + (all ? '<span class="chip">' + all + '줄</span>' : '')
      + (iwb ? '<span class="chip">🧩 ' + iwb + '</span>' : '')
    + '</span>'
    + '<span class="go">›</span>'
    + '</button>';
}

/* 접힌 줄에 붙는 한 줄 — 마지막 결과, 없으면 목표·문제 */
function gbPeek(it){
  const acts = it.acts || [];
  for(let i = acts.length - 1; i >= 0; i--){
    if(String(acts[i].value || '').trim())
      return '<b>✔</b> ' + esc(gbOneLine(acts[i].value, 120));
  }
  const a0 = acts.find(x => String(x.text || '').trim());
  if(!a0) return '';
  return (a0.mode === 'problem' ? '❓ ' : '🎯 ') + esc(gbOneLine(a0.text, 120));
}
function gbOneLine(v, n){
  const t = String(v || '').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}

/* 업무 한 건을 크게 — 안으로 들어온 화면 */
function gbDetailHtml(g){
  const st = (g.stages || []).find(x => x.id === gbIt.sid);
  const it = st ? (st.items || []).find(x => x.id === gbIt.iid) : null;
  if(!it){ gbIt = null; return ''; }

  const idx = (st.items || []).indexOf(it);
  const ip  = 'stages.' + st.id + '.items.' + it.id + '.';
  const stt = GB_STATUS.indexOf(it.status) >= 0 ? it.status : '진행 중';
  const iwb = gbWbCount(it);

  const bar = '<div class="gb-dbar">'
    + '<button class="btn sm" onclick="gbCloseItem()">← 목록으로</button>'
    + '<span class="bc">' + esc(st.label || '') + ' <b>›</b> '
      + (idx + 1) + ' / ' + ((st.items || []).length) + '</span>'
    + '<span style="margin-left:auto;display:flex;gap:5px">'
      + '<button class="btn sm" onclick="gbStep2(-1)" title="앞 업무">◀</button>'
      + '<button class="btn sm" onclick="gbStep2(1)" title="다음 업무">▶</button>'
    + '</span></div>';

  const meta = '<div class="gb-dmeta">'
    + gbBrandSel(ip, it)
    + '<label>단계<select onchange="gbMoveStage(\'' + jsq(st.id) + '\',\''
      + jsq(it.id) + '\', this.value)">'
      + (g.stages || []).map(x => '<option value="' + esc(x.id) + '"'
          + (x.id === st.id ? ' selected' : '') + '>' + esc(x.label || '') + '</option>').join('')
      + '</select></label>'
    + '<label>상태<select onchange="gbEditDraw(\'' + jsq(ip) + 'status\', this.value)">'
      + GB_STATUS.map(v => '<option' + (v === stt ? ' selected' : '') + '>' + v + '</option>').join('')
      + '</select></label>'
    + '<span style="margin-left:auto;display:flex;gap:6px">'
      + '<button class="btn sm" title="적어 둔 글을 그대로 판에 이어서 그립니다" '
        + 'onclick="gbFlow(\'' + jsq(st.id) + '\',\'' + jsq(it.id) + '\')">📐 글을 판으로</button>'
      + '<button class="btn sm' + (iwb ? ' primary' : '') + '" '
        + 'title="이 업무만 놓고 판에 그려봅니다" '
        + 'onclick="gbOpenWb(\'' + jsq(st.id) + '\',\'' + jsq(it.id) + '\')">🧩 판'
        + (iwb ? ' ' + iwb : '') + '</button>'
      + '<button class="btn sm danger" onclick="gbDelItem(\'' + jsq(st.id) + '\',\''
        + jsq(it.id) + '\')">삭제</button>'
    + '</span></div>';

  // 제목이 길어도 잘리지 않게 (한 줄 칸이 아니라 늘어나는 칸)
  const title = '<textarea class="gb-dtt" rows="1" placeholder="무엇을 하나요" '
    + 'onkeydown="if(event.key===\'Enter\')event.preventDefault()" '
    + 'oninput="gbGrow(this);gbEdit(\'' + jsq(ip) + 'title\', this.value)">'
    + esc(it.title || '') + '</textarea>';

  const acts = (it.acts || []).map((a2, ai) =>
    gbActHtml(st, it, a2, ai, (it.acts || []).length)).join('');

  return '<div class="gb-detail">' + bar + title + meta
    + '<div class="gb-dacts">' + acts + '</div>'
    + '<div class="gb-foot">'
      + '<button class="gb-add" onclick="gbAddAct(\'' + jsq(st.id) + '\',\'' + jsq(it.id)
        + '\',\'goal\')">＋ 목표</button>'
      + '<button class="gb-add" onclick="gbAddAct(\'' + jsq(st.id) + '\',\'' + jsq(it.id)
        + '\',\'problem\')">＋ 문제</button>'
    + '</div></div>';
}

/* ── 📷 사진에는 브랜드 전부를 담습니다 ──────────────────────────
   화면에서는 브랜드를 하나 골라 보지만, 사진은 남겨 두고 돌려 보는 것이라
   「이 사람이 이 해에 무엇을 했나」 가 한 장에 다 있어야 합니다.
   브랜드마다 머리를 달고, 그 아래에 속을 편 한 일을 줄줄이 붙입니다.
   ---------------------------------------------------------------- */
function gbShotAllHtml(g){
  const bs = gbMyBrands(g).filter(b => gbMyItems(g, b.id).length);
  if(!bs.length) return '<div class="empty" style="padding:14px 0">아직 한 일이 없습니다.</div>';
  return bs.map(b => {
    const rows = gbMyItems(g, b.id);
    return '<div class="gb-shot-bk">'
      + '<div class="gb-shot-br"'
        + (b.color ? ' style="--hue:' + esc(b.color) + '"' : '') + '>'
        + esc(b.icon) + ' ' + esc(b.name)
        + '<span class="ct">한 일 ' + rows.length + '건</span>'
      + '</div>'
      + '<div class="gb-full">'
        + rows.map((r, i) => gbItemFullHtml(g, r.st, r.it, i, { stage: true })).join('')
      + '</div>'
      + '</div>';
  }).join('');
}

/* 사진으로 뽑을 때는 목록 대신 속을 다 펴서 그립니다.
   opts.stage 면 브랜드 대신 「어느 단계」 를 붙입니다 (브랜드별로 볼 때). */
function gbItemFullHtml(g, st, it, idx, opts){
  opts = opts || {};
  const stt = GB_STATUS.indexOf(it.status) >= 0 ? it.status : '진행 중';
  const br  = gbBrandOf(it);
  const acts = (it.acts || []).map((a2, ai) =>
    gbActHtml(st, it, a2, ai, (it.acts || []).length)).join('');
  return '<div class="gb-item' + (stt === '완료' ? ' done' : '') + '">'
    + '<div class="gb-ih">'
      + '<span class="no">' + (idx + 1) + '</span>'
      + '<span class="tt">' + esc(it.title || '') + '</span>'
      + (opts.stage
          ? '<span class="chip">' + esc(st.label || '') + '</span>'
          : (br ? '<span class="chip"' + (br.color ? ' style="border-color:' + esc(br.color)
                    + ';color:' + esc(br.color) + '"' : '') + '>'
                  + esc(br.icon || '🏷️') + ' ' + esc(br.name) + '</span>' : ''))
      + '<span class="chip">' + esc(stt) + '</span>'
    + '</div>'
    // 아직 안 적은 업무도 사진에는 나옵니다 (전체가 다 보이게)
    + (acts ? '<div class="gb-ib">' + acts + '</div>'
            : '<div class="gb-none">아직 적은 내용이 없습니다</div>')
    + '</div>';
}

/* ── 활동 한 차수 ───────────────────────────────────────────────
   예전 브랜드플로우와 같은 모양입니다.
     ● n차 활동  [목표형 | 문제형]
       목표 / 실행 이유   (문제형이면 「문제 / 이슈」)
       가설 / 행동        — 가설 1. · 행동 1. 로 번호가 붙고, 그 아래 세부 단계
       결과
   칸마다 테두리를 둘러 어디까지가 한 칸인지 눈에 바로 들어오게 했습니다.
   ------------------------------------------------------------- */
const gbShow = {};      // 'ga_1:value' → 빈 칸을 펴 두었나

function gbShowFld(sid, iid, aid, f){
  gbShow[aid + ':' + f] = true;
  render();
  setTimeout(() => {
    const el = document.getElementById('gbf_' + aid + '_' + f);
    if(el){ el.focus(); gbGrow(el); }
  }, 20);
}

/* 가설·행동 줄 (예전 자료는 kind 가 없어서 「행동」 으로 봅니다) */
function gbRows(a){
  if(!Array.isArray(a.steps)) a.steps = [];
  a.steps.forEach(r => {
    if(r.kind !== 'hyp' && r.kind !== 'act') r.kind = 'act';
    if(!Array.isArray(r.subs)) r.subs = [];
  });
  return a.steps;
}
function gbAct2(g, sid, iid, aid){
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return null;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return null;
  return (it.acts || []).find(x => x.id === aid) || null;
}
function gbAddRow(sid, iid, aid, kind){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const a = gbAct2(g, sid, iid, aid); if(!a) return;
  const r = { id: uid('gt'), kind: kind === 'hyp' ? 'hyp' : 'act', text:'', subs:[] };
  gbRows(a).push(r);
  markDirtyAll(); render();
  setTimeout(() => { const el = document.getElementById('gbs_' + r.id);
                     if(el){ el.focus(); gbGrow(el); } }, 30);
}
function gbDelRow(sid, iid, aid, rid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const a = gbAct2(g, sid, iid, aid); if(!a) return;
  a.steps = gbRows(a).filter(x => x.id !== rid);
  markDirtyAll(); render();
}
function gbAddSub(sid, iid, aid, rid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const a = gbAct2(g, sid, iid, aid); if(!a) return;
  const r = gbRows(a).find(x => x.id === rid); if(!r) return;
  const s2 = { id: uid('gu'), text:'' };
  r.subs.push(s2);
  markDirtyAll(); render();
  setTimeout(() => { const el = document.getElementById('gbu_' + s2.id);
                     if(el){ el.focus(); gbGrow(el); } }, 30);
}
function gbDelSub(sid, iid, aid, rid, sid2){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const a = gbAct2(g, sid, iid, aid); if(!a) return;
  const r = gbRows(a).find(x => x.id === rid); if(!r) return;
  r.subs = r.subs.filter(x => x.id !== sid2);
  markDirtyAll(); render();
}

function gbActHtml(st, it, a, idx, tot){
  const goal = a.mode !== 'problem';
  const T    = gbTpl(it);
  const ap   = 'stages.' + st.id + '.items.' + it.id + '.acts.' + a.id + '.';
  const args = '\'' + jsq(st.id) + '\',\'' + jsq(it.id) + '\',\'' + jsq(a.id) + '\'';
  const rows = gbRows(a);

  const hasT = String(a.text  || '').trim() !== '';
  const hasB = String(a.basis || '').trim() !== '';
  const hasV = String(a.value || '').trim() !== '';
  const hasR = rows.some(r => String(r.text || '').trim());
  if(gbShot && !hasT && !hasB && !hasV && !hasR) return '';

  const shown = f => !!gbShow[a.id + ':' + f];
  const ro = v => '<div class="gb-ro">' + esc(v || '') + '</div>';

  /* 한 칸 — 왼쪽 이름, 오른쪽 테두리 친 글칸 */
  const fld = (f, label, has, inner) =>
    (!has && (gbShot || !shown(f))) ? ''
    : '<div class="gb-f"><label>' + label + '</label><div class="bd">' + inner + '</div></div>';

  const head = '<div class="gb-ahead">'
    + '<span class="dot">' + (idx + 1) + '</span>'
    + '<span class="rl">' + (idx + 1) + '차 활동</span>'
    + (gbShot
        ? '<span class="pill on">' + (goal ? '목표형' : '문제형') + '</span>'
        : '<span class="modes">'
          + '<button class="pill' + (goal ? ' on' : '') + '" '
            + 'onclick="gbSetMode(' + args + ',\'goal\')">목표형</button>'
          + '<button class="pill' + (goal ? '' : ' on') + '" '
            + 'onclick="gbSetMode(' + args + ',\'problem\')">문제형</button>'
          + '</span>'
          + '<button class="rm" title="이 차수 지우기" onclick="gbDelAct(' + args + ')">삭제</button>')
    + '</div>';

  const ctx = fld('text', goal ? '목표 / 실행 이유' : '문제 / 이슈', true, gbShot
    ? ro(a.text)
    : '<textarea class="tx" rows="1" placeholder="' + esc(goal ? T.goal : T.prob) + '" '
      + 'oninput="gbGrow(this);gbEdit(\'' + jsq(ap) + 'text\', this.value)">'
      + esc(a.text || '') + '</textarea>');

  let hn = 0, an = 0;
  const list = rows.filter(r => !gbShot || String(r.text || '').trim()).map(r => {
    const isH = r.kind === 'hyp';
    const n   = isH ? ++hn : ++an;
    const rp  = ap + 'steps.' + r.id + '.';
    const subs = (r.subs || []).filter(x => !gbShot || String(x.text || '').trim()).map(x =>
      '<div class="sub">'
      + '<span class="bu">•</span>'
      + (gbShot
          ? '<span class="tt">' + esc(x.text || '') + '</span>'
          : '<textarea id="gbu_' + esc(x.id) + '" rows="1" placeholder="세부 단계" '
            + 'oninput="gbGrow(this);gbEdit(\'' + jsq(rp) + 'subs.' + jsq(x.id)
            + '.text\', this.value)">' + esc(x.text || '') + '</textarea>'
          + '<button class="x" title="지우기" onclick="gbDelSub(' + args + ',\''
            + jsq(r.id) + '\',\'' + jsq(x.id) + '\')">×</button>')
      + '</div>').join('');

    return '<div class="gb-rw' + (isH ? ' hyp' : '') + '">'
      + '<div class="hd">'
        + '<span class="nu">' + (isH ? '가설' : '행동') + ' ' + n + '.</span>'
        + (gbShot
            ? '<span class="tt">' + esc(r.text || '') + '</span>'
            : '<textarea id="gbs_' + esc(r.id) + '" rows="1" '
              + 'placeholder="' + (isH ? '이렇게 하면 이렇게 될 것이다' : '무엇을 했나 / 할 건가')
              + '" oninput="gbGrow(this);gbEdit(\'' + jsq(rp) + 'text\', this.value)">'
              + esc(r.text || '') + '</textarea>'
            + '<button class="ic" title="세부 단계 추가" onclick="gbAddSub(' + args + ',\''
              + jsq(r.id) + '\')">＋</button>'
            + '<button class="ic x" title="지우기" onclick="gbDelRow(' + args + ',\''
              + jsq(r.id) + '\')">✕</button>')
      + '</div>'
      + (subs ? '<div class="subs">' + subs + '</div>' : '')
      + '</div>';
  }).join('');

  const flow = fld('rows', '가설 / 행동', hasR,
    '<div class="gb-rws">' + list
    + (gbShot ? ''
       : '<div class="gb-radd">'
         + '<button onclick="gbAddRow(' + args + ',\'hyp\')">＋ 가설</button>'
         + '<button onclick="gbAddRow(' + args + ',\'act\')">＋ 행동</button>'
         + '</div>')
    + '</div>');

  const memo = fld('basis', '메모', hasB, gbShot
    ? ro(a.basis)
    : '<textarea class="tx" rows="1" id="gbf_' + esc(a.id) + '_basis" '
      + 'placeholder="덧붙일 것" '
      + 'oninput="gbGrow(this);gbEdit(\'' + jsq(ap) + 'basis\', this.value)">'
      + esc(a.basis || '') + '</textarea>');

  const res = fld('value', '결과', hasV, gbShot
    ? ro(a.value)
    : '<textarea class="tx res" rows="1" id="gbf_' + esc(a.id) + '_value" '
      + 'placeholder="' + esc(T.val) + '" '
      + 'oninput="gbGrow(this);gbEdit(\'' + jsq(ap) + 'value\', this.value)">'
      + esc(a.value || '') + '</textarea>');

  const miss = [];
  if(!gbShot){
    if(!hasR && !shown('rows'))  miss.push(['rows',  '가설 / 행동']);
    if(!hasV && !shown('value')) miss.push(['value', '결과']);
    if(!hasB && !shown('basis')) miss.push(['basis', '메모']);
  }
  const more = miss.length
    ? '<div class="gb-am">' + miss.map(m => '<button onclick="gbShowFld(' + args + ',\''
        + m[0] + '\')">＋ ' + m[1] + '</button>').join('') + '</div>'
    : '';

  return '<div class="gb-act ' + (goal ? 'goal' : 'problem') + '">'
    + head + '<div class="gb-fs">' + ctx + flow + res + memo + '</div>' + more + '</div>';
}

function gbSetMode(sid, iid, aid, mode){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const a = gbAct2(g, sid, iid, aid); if(!a) return;
  a.mode = mode;
  markDirtyAll(); render();
}

/* ── 📷 사진으로 내보내기 ────────────────────────────────────────
   화면에 보이는 그대로 PNG 로 뽑습니다. 그림 만드는 일은 html2canvas
   (MIT) 가 합니다. 그런데 200KB 라 늘 들고 다니면 화면 여는 것이
   느려지므로, 누를 때 NAS 에서 한 번만 받아옵니다.
   --------------------------------------------------------------- */
let h2cReady = null;      // null=아직 | Promise | true

function loadH2C(){
  if(window.html2canvas) return Promise.resolve(true);
  if(h2cReady) return h2cReady;
  h2cReady = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'html2canvas.min.js';
    sc.onload  = () => res(true);
    sc.onerror = () => { h2cReady = null; rej(new Error('그림 만드는 도구를 못 받았습니다')); };
    document.head.appendChild(sc);
  });
  return h2cReady;
}

/* 사진으로 뽑을 때는 접힌 것을 다 펴고, 고치는 칸을 글자로 바꿔 찍습니다 */
let gbShot = false;

async function gbExport(){
  const g = gbFind(gbWho, gbYear);
  if(!g){ toast('⚠️ 보드가 없습니다'); return; }
  toast('📷 사진을 만드는 중…');
  try{ await loadH2C(); }
  catch(e){
    alert('사진으로 내보내지 못했습니다.\n\n' + (e.message || e)
      + '\n\nhtml2canvas.min.js 가 brand.html 옆에 있어야 합니다. '
      + '작업 스케줄러에서 deploy.sh 를 한 번 돌려주세요.');
    return;
  }

  // 보고 있던 업무에서 나와, 접힌 단계를 모두 펴고, 찾기·거르기를 잠시 풀어
  // 보드 전체를 한 장에 담습니다
  const keepQ = gbQ, keepSt = gbSt, keepOpen = Object.assign({}, gbOpen);
  const keepIt = gbIt;
  gbQ = ''; gbSt = ''; gbIt = null;
  (g.stages || []).forEach(st => {
    gbOpen[st.id] = true;
    (st.items || []).forEach(it => { gbOpen[it.id] = true; });
  });
  gbShot = true;
  render();
  await new Promise(r => setTimeout(r, 260));

  const el = document.querySelector('#main .panel');
  try{
    const w = Math.ceil(el.scrollWidth), h = Math.ceil(el.scrollHeight);
    const canvas = await window.html2canvas(el, {
      backgroundColor: getComputedStyle(document.body).backgroundColor || '#ffffff',
      scale: Math.min(2, window.devicePixelRatio || 1),
      useCORS: true, logging: false, imageTimeout: 8000,
      x: 0, y: 0, width: w, height: h,
      scrollX: 0, scrollY: 0,
      windowWidth: Math.max(w, document.documentElement.clientWidth),
      windowHeight: h
    });
    const name = gbName(g.who) + '_' + g.year + '_그로스보드_' + todayStr() + '.png';
    canvas.toBlob(blob => {
      if(!blob){ toast('⚠️ 사진을 만들지 못했습니다'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('📷 ' + name + ' 으로 내려받았습니다');
    }, 'image/png');
  }catch(e){
    alert('사진으로 내보내지 못했습니다.\n\n' + (e.message || e));
  }finally{
    gbShot = false;
    gbQ = keepQ; gbSt = keepSt; gbIt = keepIt;
    Object.keys(gbOpen).forEach(k => { delete gbOpen[k]; });
    Object.assign(gbOpen, keepOpen);
    render();
  }
}

/* ── 📥 글로 붙여넣기 ────────────────────────────────────────────
   [📋 글로 복사] 가 뽑아낸 것과 같은 모양의 글을 다시 보드로 만듭니다.
   다른 데서 옮겨올 때도, AI 가 정리해 준 것을 넣을 때도 씁니다.
   --------------------------------------------------------------- */
function gbParse(text){
  const out = { goal:'', kpis:[], stages:[] };
  let st = null, it = null, act = null, row = null;
  String(text || '').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if(!line) return;

    let m;
    if((m = line.match(/^올해 목표\s*[:：]\s*(.+)$/))){ out.goal = m[1].trim(); return; }
    if(/^#{1,2}(?!#)\s*핵심 지표/.test(line)){ st = null; it = null; act = null; row = null; return; }

    // - 이름: 현재 / 목표단위 (00%)
    if((m = line.match(/^[-·*]\s*(.+?)\s*[:：]\s*([0-9,.\-]+)\s*\/\s*([0-9,.\-]+)\s*([^\s(]*)\s*(?:\(\d+%\))?$/))
       && !st){
      out.kpis.push({ id: uid('k'), name: m[1].trim(), current: m[2].replace(/,/g, ''),
                      target: m[3].replace(/,/g, ''), unit: m[4] || '', mode:'manual' });
      return;
    }

    // ### 1) 블로그 검색 유입 늘리기  [진행 중]  [지표: 신규 문의]
    //   ### 를 ## 보다 먼저 봅니다. 안 그러면 ## 규칙이 ### 까지 삼킵니다.
    if((m = line.match(/^###(?!#)\s*(?:\d+[.)]\s*)?(.+)$/))){
      let title = m[1];
      let status = '진행 중', kpi = '';
      let brn = '';
      title = title.replace(/\[지표:\s*([^\]]*)\]/, (x, v) => { kpi = v.trim(); return ''; });
      title = title.replace(/\[브랜드:\s*([^\]]*)\]/, (x, v) => { brn = v.trim(); return ''; });
      title = title.replace(/\[([^\]]*)\]/g, (x, v) => {
        if(GB_STATUS.indexOf(v.trim()) >= 0){ status = v.trim(); return ''; }
        return x;
      });
      if(!st){ st = { id: uid('gs'), key:'own', label:'옮겨온 것', desc:'', items:[] };
               out.stages.push(st); }
      // 글에 브랜드 이름이 없으면 지금 보고 있는 브랜드로 봅니다
      const bh = brn ? (data.brands || []).find(x2 => (x2.name || '').trim() === brn) : null;
      it = { id: uid('gi'), title: title.trim(), status: status, kpiId:'', _kpi: kpi,
             brandId: bh ? bh.id : (brn ? '' : gbPbId), acts: [] };
      st.items.push(it); act = null; row = null;
      return;
    }
    // ## 1. 유입 — 신규 유입률 확대
    if((m = line.match(/^##(?!#)\s*(?:\d+[.)]\s*)?(.+)$/))){
      const parts = m[1].split(/\s+[—–-]\s+/);
      st = { id: uid('gs'), key:'own', label: parts[0].trim(),
             desc: (parts[1] || '').trim(), items: [] };
      out.stages.push(st); it = null; act = null; row = null;
      return;
    }
    // [1차] 목표 / 실행 이유   ·  - 목표: …  (예전 모양도 받습니다)
    if((m = line.match(/^\[?\d*차?\]?\s*(목표\s*\/\s*실행 이유|문제\s*\/\s*이슈)\s*$/))){
      if(!it) return;
      act = { id: uid('ga'), mode: /문제/.test(m[1]) ? 'problem' : 'goal',
              text:'', basis:'', value:'', steps:[] };
      it.acts.push(act); row = null;
      return;
    }
    if((m = line.match(/^[-·*]\s*(목표|문제)\s*[:：]\s*(.*)$/))){
      if(!it) return;
      act = { id: uid('ga'), mode: m[1] === '문제' ? 'problem' : 'goal',
              text: m[2].trim(), basis:'', value:'', steps:[] };
      it.acts.push(act); row = null;
      return;
    }
    // 가설 1. …  /  행동 1. …
    if((m = line.match(/^(가설|행동)\s*\d*\.?\s*(.*)$/))){
      if(!act) return;
      row = { id: uid('gt'), kind: m[1] === '가설' ? 'hyp' : 'act',
              text: m[2].trim(), subs: [] };
      act.steps.push(row);
      return;
    }
    // · 세부 단계   ·  [ ] 확인할 것 (예전 모양)
    if((m = line.match(/^[·•*]\s*(.+)$/)) || (m = line.match(/^\[[ xX]\]\s*(.+)$/))){
      if(row) row.subs.push({ id: uid('gu'), text: m[1].trim() });
      else if(act) act.steps.push({ id: uid('gt'), kind:'act', text: m[1].trim(), subs:[] });
      return;
    }
    if((m = line.match(/^(?:결과|기여 수치)\s*[:：]\s*(.*)$/))){
      if(act) act.value = m[1].trim();
      row = null;
      return;
    }
    if((m = line.match(/^(?:메모|근거|원인)\s*[:：]\s*(.*)$/))){
      if(act) act.basis = m[1].trim();
      row = null;
      return;
    }
    // 이름표 없이 이어지는 줄은 바로 앞 칸에 붙입니다
    if(row) row.text = row.text ? row.text + '\n' + line : line;
    else if(act) act.text = act.text ? act.text + '\n' + line : line;
  });
  return out;
}

let gbPasteOpen = false;
function gbTogglePaste(){ gbPasteOpen = !gbPasteOpen; render(); }

function gbDoPaste(mode){
  const box = document.getElementById('gbPasteBox');
  const txt = box ? box.value : '';
  if(!txt.trim()){ toast('⚠️ 붙여넣을 글이 없습니다'); return; }

      + '[📋 글로 복사] 로 뽑은 것과 같은 모양이어야 합니다:\n\n'
      + '## 1. 유입 — 한 줄 설명\n'
      + '### 1) 업무 이름  [진행 중]  [지표: 신규 문의]\n'
      + '[1차] 목표 / 실행 이유\n'
      + '무엇을 이루려 하나\n'
      + '  행동 1. 무엇을 했나\n'
      + '    · 세부 단계\n'
      + '  가설 1. 이렇게 하면 이렇게 될 것이다\n'
      + '  결과: 어떻게 됐나');
    return;
  }
  const g = gbEnsure(gbWho, gbYear);
  if(mode === 'replace'){
    if(!confirm('지금 보드를 지우고 붙여넣은 것으로 바꿀까요?\n\n'
      + '단계 ' + got.stages.length + '개 · 업무 ' + nItem + '건'
      + (got.kpis.length ? ' · 지표 ' + got.kpis.length + '개' : ''))) return;
    g.stages = [];
  }
  if(got.goal && (mode === 'replace' || !(g.goal || '').trim())) g.goal = got.goal;
  got.stages.forEach(x => {
    x.items.forEach(it => {
      delete it._kpi;
      if(!it.acts.length) it.acts.push({ id: uid('ga'), mode:'goal', text:'', basis:'',
                                         value:'', steps:[] });
    });
    // 이름이 같은 단계가 있으면 그 안에 넣습니다 (두 개로 갈라지지 않게)
    const same = (g.stages || []).find(y => (y.label || '').trim() === (x.label || '').trim());
    if(same) x.items.forEach(it => same.items.push(it));
    else g.stages.push(x);
  });
  gbPasteOpen = false;
  markDirtyAll(); render();
  toast('📥 단계 ' + got.stages.length + '개 · 업무 ' + nItem + '건을 넣었습니다');
}

/* ── 📦 브랜드플로우 백업 불러오기 ──────────────────────────────
   예전에 쓰던 브랜드플로우(GitHub Pages) 의 [⬇ 백업] JSON 을 그대로
   읽어 개인 그로스보드로 옮깁니다. 안에 들어 있는 사진(base64)은
   한 장에 몇 MB 라 자료 파일이 감당하지 못하므로 가져오지 않고,
   몇 장을 건너뛰었는지만 알려줍니다.
   ------------------------------------------------------------- */
let bfRows = null;      // null = 안 열림 · 배열 = 읽어 둔 보드 목록
let bfFileName = '';

function bfOpen(){ const el = document.getElementById('bfFile'); if(el) el.click(); }
/* 예전 브랜드플로우 내용을 미리 넣어 두었습니다 — 파일을 안 골라도 바로 열립니다 */

function bfSet(key, v){

/* 어느 단계에 넣을지.
   ① 예전 「테마」 글에 단계 이름이 있으면 그대로 따릅니다.
   ② 없으면 (「브랜드 재정립」 「기타/지원」 처럼) 업무 제목에서 찾습니다.
      제목으로도 모르겠으면 「개인 및 자유업무」 로 둡니다. */
function bfStage(theme, title, ini){
  const t = String(theme || '');
  if(/유입|인지도|acquisition/i.test(t))      return 'acquisition';
  if(/전환|conversion/i.test(t))              return 'conversion';
  if(/활성|activation/i.test(t))              return 'activation';
  if(/재사용|재구매|충성|retention/i.test(t)) return 'retention';

  const bag = String(title || '') + ' ' + String(ini || '');
  if(/crm|사후\s*관리|보증|재구매|재방문|재계약|해피콜|문자/i.test(bag)) return 'retention';
  if(/블로그|포스팅|카페|광고|유튜브|검색|키워드|노출|인스타|sns|채널|세미나|홍보|콘텐츠/i.test(bag))
    return 'acquisition';
  // 「브랜딩」 안의 「랜딩」 에 걸리지 않도록 「랜딩 페이지」 로만 봅니다
  if(/제안서|시방서|견적|입찰|상세\s*페이지|랜딩\s*페이지|문의|영업|구매|전환/i.test(bag))
    return 'conversion';
  if(/홈페이지|메인\s*페이지|소개\s*페이지|자재\s*페이지|사이트|브랜드북|아이덴티티|슬로건|컨셉|어플|앱|ui|ux|대시보드|자료|가이드|최신화|고도화|리뉴얼|재구성|계획안|페이지/i.test(bag))
    return 'activation';
  return 'own';
}
/* 「2. 브랜드 확산 _ 어쩌고저쩌고」 → 「브랜드 확산」 */
function bfShort(theme){
  const t = String(theme || '').replace(/^\s*\d+[.)]\s*/, '').split(/[_—–]/)[0];
  return t.trim().slice(0, 18);
}
/* 사진이 몇 장 들어 있나 (…Images 로 끝나는 칸을 다 셉니다) */
function bfCountImg(o){
  let n = 0;
  (function walk(x){
    if(Array.isArray(x)) return x.forEach(walk);
    if(x && typeof x === 'object') Object.keys(x).forEach(k => {
      if(/images$/i.test(k) && Array.isArray(x[k])) n += x[k].length;
      else walk(x[k]);
    });
  })(o);
  return n;
}

function bfPick(input){
  const f = (input.files || [])[0];
  input.value = '';
  if(!f){ toast('⚠️ 고른 파일이 없습니다'); return; }
  bfFileName = f.name;
  const r = new FileReader();
  r.onerror = () => alert('파일을 못 읽었습니다. 다시 골라주세요.');
  r.onload = () => {
    let j = null;
    try { j = JSON.parse(String(r.result || '')); }
    catch(e){
      alert('JSON 을 못 읽었습니다.\n\n브랜드플로우에서 [⬇ 백업] 으로 받은 파일이 맞는지 봐주세요.');
      return;
    }
    const rows = bfScan(j);
    if(!rows.length){
      alert('옮길 보드를 못 찾았습니다.\n\n이 파일 안에 brands → years 가 있어야 합니다.');
      return;
    }
    bfRows = rows;
    render();
  };
  r.readAsText(f, 'utf-8');
}

/* 백업 안을 훑어서 「브랜드 × 해」 한 줄씩 만듭니다 */
function bfScan(j){
  const out  = [];
  const list = gbPeople();
  (Array.isArray(j && j.brands) ? j.brands : []).forEach(b => {
    const years = (b && b.years) || {};
    Object.keys(years).forEach(y => {
      const yv = years[y] || {};
      let tasks = [];
      (yv.quarters || []).forEach(q => { tasks = tasks.concat(q.tasks || [], q.extra || []); });
      // 제목도 내용도 없는 빈 줄은 세지도, 옮기지도 않습니다
      tasks = tasks.filter(t => String(t.title || '').trim() || (t.activities || []).length);
      const acts = tasks.reduce((a, t) => a + ((t.activities || []).length), 0);
      // 아무것도 안 적힌 해는 굳이 옮기지 않습니다
      if(!tasks.length && !(yv.kpis || []).length) return;
      // 누구 것인지 짐작 — years.owner → 「POUR솔루션_김소라」 처럼 이름 뒤쪽
      const nm  = String(yv.owner || '').trim()
               || (String(b.name || '').split('_')[1] || '').trim();
      const hit = list.find(p => p.name === nm);
      out.push({
        key: String(b.id || b.name) + '|' + y,
        brand: String(b.name || '(이름 없음)'), year: String(y), owner: nm,
        who: hit ? hit.key : '',
        brandId: bfBrandId(b.name),
        nKpi: (yv.kpis || []).length, nTask: tasks.length, nAct: acts,
        nImg: bfCountImg(tasks),
        raw: { goal: yv.goal || '', kpis: yv.kpis || [], tasks: tasks }
      });
    });
  });
  return out;
}

/* 백업의 브랜드 이름을 우리 브랜드에 맞춥니다
   「POUR솔루션_김소라」 처럼 이름 뒤에 사람이 붙어 있으면 떼고 찾습니다 */
function bfBrandId(name){
  const raw = String(name || '').trim();
  if(!raw) return '';
  const bare = raw.split('_')[0].trim();
  const norm = v => String(v || '').replace(/\s+/g, '').toLowerCase();
  const list = data.brands || [];
  let hit = list.find(b => norm(b.name) === norm(raw))
         || list.find(b => norm(b.name) === norm(bare));
  if(hit) return hit.id;
  // 서로 안에 들어 있으면 같은 것으로 봅니다 (POUR공법 ↔ POUR 공법)
  hit = list.find(b => norm(b.name) && (norm(bare).indexOf(norm(b.name)) >= 0
                                     || norm(b.name).indexOf(norm(bare)) >= 0));
  return hit ? hit.id : '';
}

/* 한 줄을 우리 보드 모양으로 바꿉니다 */
function bfConv(row){
  const brandId = bfBrandId(row.brand);
  const kpis = (row.raw.kpis || []).map(k => ({
    id: uid('k'), name: String(k.name || '').trim(),
    current: String(k.current == null ? '' : k.current),
    target:  String(k.target  == null ? '' : k.target),
    unit: String(k.unit || ''), mode: (k.mode === 'auto' ? 'auto' : 'manual'),
    _old: k.id
  }));

  const items = {};     // 단계 key → 업무들
  (row.raw.tasks || []).forEach(t => {
    // 아무것도 안 적힌 빈 줄은 옮기지 않습니다
    if(!String(t.title || '').trim() && !(t.activities || []).length) return;

    const key = bfStage(t.theme, t.title, t.initiative);
    let title = String(t.title || '').trim();
    // 예전 「묶음(initiative)」 이나 「테마」 이름을 앞에 짧게 붙여 어디 일이었는지 남깁니다
    const tag = bfShort(t.initiative) || (key === 'own' ? bfShort(t.theme) : '');
    if(tag && !/^기타|지원/.test(tag) && title.indexOf(tag) < 0) title = tag + ' · ' + title;

    const acts = [];
    (t.activities || []).forEach(a => {
      // 예전 화면과 똑같이 「가설 n.」 「행동 n.」 을 적어 둔 차례대로 늘어놓습니다
      const rows = []
        .concat((a.hypotheses || []).map(h => ({ o: h.ord || 0, kind:'hyp',
                  text: String(h.text || '').trim(), subs: h.steps || [] })))
        .concat((a.actions || []).map(c => ({ o: c.ord || 0, kind:'act',
                  text: String(c.title || '').trim(), subs: c.steps || [] })))
        .sort((x, y) => x.o - y.o)
        .filter(r => r.text || (r.subs || []).some(v => String(v || '').trim()))
        .map(r => ({ id: uid('gt'), kind: r.kind, text: r.text,
                     subs: (r.subs || []).map(v => String(v || '').trim()).filter(Boolean)
                             .map(v => ({ id: uid('gu'), text: v })) }));
      acts.push({
        id: uid('ga'), mode: (a.mode === 'problem' ? 'problem' : 'goal'),
        text:  String(a.context || '').trim(), basis: '',
        value: String(a.result || '').trim(), steps: rows
      });
    });
    // 발표용으로 적어 둔 「왜 · 무엇을」 도 한 덩이로 옮깁니다
    const why = String(t.pWhy || '').trim(), what = String(t.pWhat || '').trim();
    if(why || what) acts.push({ id: uid('ga'), mode:'goal', text: why || what,
                                basis: (why && what) ? what : '', value:'', steps:[] });
    if(!acts.length) acts.push({ id: uid('ga'), mode:'goal', text:'', basis:'',
                                 value:'', steps:[] });

    // 이 업무에 딸린 사진들 (결과 사진 · 발표용 · 이슈 · 실행 사진)
    const imgs = [];
    const grab = arr => (arr || []).forEach(x => {
      if(x && x.url) imgs.push(x);
      else if(typeof x === 'string' && x.slice(0, 10) === 'data:image') imgs.push({ url: x });
    });
    (t.activities || []).forEach(a => grab(a.resultImages));
    grab(t.pExpectImages);
    (t.issues   || []).forEach(x => grab(x.images));
    (t.pActions || []).forEach(x => grab(x.images));

    (items[key] = items[key] || []).push({
      id: uid('gi'), title: title || '(제목 없음)', _imgs: imgs, brandId: brandId,
      status: (t.status === '진행중') ? '진행 중'
            : (GB_STATUS.indexOf(t.status) >= 0 ? t.status : '진행 중'),
      kpiId: '', _kpi: String((t.metric || {}).kpiId || ''), acts: acts
    });
  });

  let goal = String(row.raw.goal || '').trim();
  if(/^\(.*\)$/.test(goal)) goal = '';    // 「(목표를 입력하세요)」 는 빈 것으로 봅니다
  return { goal: goal, kpis: kpis, items: items };
}

/* data:… 글자를 진짜 파일로 되돌립니다 */
function bfBlob(im){
  const s2  = String(im.url || '');
  const cut = s2.indexOf(',');
  const mime = s2.slice(5, s2.indexOf(';')) || 'image/jpeg';
  const bin = atob(s2.slice(cut + 1));
  const u8  = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new File([u8], im.name || '예전 자료.jpg', { type: mime });
}

/* 사진은 업무마다 딸린 🧩 판에 붙여 둡니다 (자료 파일은 그대로 가볍게) */
async function bfAttachImgs(jobs){
  if(!jobs.length) return 0;
  if(STORAGE_MODE !== 'nas'){
    toast('⚠️ 사진은 NAS 주소로 열었을 때만 붙습니다 (내용은 다 들어갔습니다)');
    return 0;
  }
  const total = jobs.reduce((a, j) => a + j.imgs.length, 0);
  toast('🖼 사진 ' + total + '장을 판에 붙이는 중…');
  let done = 0;
  for(const j of jobs){
    const bd = gbBoardFor(j.g, j.it);
    let x = 40, y = 40;
    for(const im of j.imgs){
      try{
        const m = await wbPutMedia(bfBlob(im));
        if(!m) continue;
        const k = Math.min(360 / (im.w || 360), 300 / (im.h || 240), 1);
        bd.nodes.push(Object.assign({
          id: uid('wn'), kind:'media', x: x, y: y,
          w: Math.max(120, Math.round((im.w || 360) * k)),
          h: Math.max(90,  Math.round((im.h || 240) * k)),
          color:'dark', text:''
        }, m));
        x += 34; y += 34; done++;
      }catch(e){ /* 한 장이 안 붙어도 나머지는 계속합니다 */ }
    }
    bd.updatedAt = new Date().toISOString();
  }
  return done;
}

async function bfRun(mode){
  const rows = (bfRows || []).filter(r => r.who);
  if(!rows.length){ toast('⚠️ 누구 보드로 넣을지 골라주세요'); return; }
  const nT  = rows.reduce((a, r) => a + r.nTask, 0);
  const nI  = rows.reduce((a, r) => a + r.nImg, 0);
  if(!confirm((mode === 'replace'
        ? '고른 사람의 보드를 지우고 백업 내용으로 바꿀까요?\n\n'
        : '고른 사람의 보드에 더할까요?\n\n')
      + rows.map(r => '· ' + r.brand + ' ' + r.year + '년 → ' + gbName(r.who)
          + ' (업무 ' + r.nTask + '건'
          + (r.nKpi ? ' · 지표 ' + r.nKpi + '개' : '') + ')').join('\n')
      + (nI ? '\n\n※ 사진 ' + nI + '장은 업무마다 딸린 🧩 판에 붙습니다' : ''))) return;

  // 백업에 있는 브랜드가 대시보드에 없으면, 만들지 물어봅니다
  const miss = [];
  rows.forEach(r => {
    if(r.brandId) return;
    const nm = String(r.brand || '').split('_')[0].trim();
    if(nm && miss.indexOf(nm) < 0) miss.push(nm);
  });
  if(miss.length && confirm('대시보드에 없는 브랜드가 있습니다.\n\n· ' + miss.join('\n· ')
      + '\n\n브랜드를 만들고 업무에 꼬리표로 붙일까요?\n'
      + '(취소하면 브랜드 없이 옮깁니다 — 나중에 업무마다 골라도 됩니다)')){
    const IC = ['🏷️','⚙️','🏢','🏗️','📍','🏘️','🧩'];
    const CO = ['#06b6d4','#8b5cf6','#3b82f6','#22c55e','#f97316','#ec4899'];
    miss.forEach((nm, i) => {
      data.brands.push(newBrand(nm, IC[i % IC.length], CO[i % CO.length], ''));
    });
  }

  const jobs  = [];   // 나중에 판에 붙일 사진들
  const wiped = {};   // 한 사람 보드에 두 줄을 보내도 두 번 지우지 않게
  rows.forEach(r => {
    const got = bfConv(r);
    const g   = gbEnsure(r.who, r.year);
    if(mode === 'replace' && !wiped[g.id]){
      wiped[g.id] = true;
      g.stages = GB_STAGES.map((s, i) => ({ id: uid('gs'), key: s.key, no: i + 1,
                                            label: s.label, desc: s.desc, items: [] }));
      g.goal = '';
    }
    // 목표는 비어 있을 때만 채웁니다 (이미 적어 둔 것을 덮어쓰지 않게)
    if(got.goal && !(g.goal || '').trim()) g.goal = got.goal;

    Object.keys(got.items).forEach(key => {
      let st = (g.stages || []).find(x => x.key === key);
      if(!st){
        const d = GB_STAGES.find(x => x.key === key) || { label:'옮겨온 것', desc:'' };
        st = { id: uid('gs'), key: key, no: (g.stages || []).length + 1,
               label: d.label, desc: d.desc, items: [] };
        g.stages.push(st);
      }
      got.items[key].forEach(it => {
        const im = it._imgs || [];
        delete it._kpi; delete it._imgs;
        st.items.push(it);
        if(im.length) jobs.push({ g: g, it: it, imgs: im });
      });
    });
    g.updatedAt = new Date().toISOString();
  });

  bfRows = null;
  markDirtyAll(); render();
  toast('📦 보드 ' + rows.length + '개 · 업무 ' + nT + '건을 옮겼습니다');

  const shot = await bfAttachImgs(jobs);
  if(shot){
    markDirtyAll(); render();
    toast('🖼 사진 ' + shot + '장을 업무마다 🧩 판에 붙였습니다');
  }
}

        + '못 찾으면 「개인 및 자유업무」 로 갑니다. 사진은 그 업무의 🧩 판에 붙습니다</span>'
    + '</div></div>';
}

/* 보드를 글로 — 보고할 때나 AI 에게 통째로 물어볼 때 씁니다 */
function gbText(){
  const g = gbFind(gbWho, gbYear);
  if(!g) return '';
  const L = [];
  L.push('# ' + gbName(g.who) + ' · ' + g.year + '년 그로스보드');
  if((g.goal || '').trim()) L.push('\n올해 목표: ' + g.goal.trim());
  (g.stages || []).forEach((st, i) => {
    if(!(st.items || []).length) return;
    L.push('\n## ' + (i + 1) + '. ' + (st.label || '') + (st.desc ? ' — ' + st.desc : ''));
    st.items.forEach((it, j) => {
      const br2 = gbBrandOf(it);
      L.push('\n### ' + (j + 1) + ') ' + (it.title || '(제목 없음)')
        + '  [' + (it.status || '진행 중') + ']'
        + (br2 ? '  [브랜드: ' + (br2.name || '') + ']' : '')
        );
      (it.acts || []).forEach((a, ai) => {
        L.push('\n[' + (ai + 1) + '차] ' + (a.mode === 'problem' ? '문제 / 이슈' : '목표 / 실행 이유'));
        if((a.text || '').trim()) L.push(a.text.trim());
        let hn = 0, an = 0;
        (a.steps || []).forEach(r => {
          const isH = r.kind === 'hyp';
          const n = isH ? ++hn : ++an;
          if(!String(r.text || '').trim() && !(r.subs || []).length) return;
          L.push('  ' + (isH ? '가설 ' : '행동 ') + n + '. ' + String(r.text || '').trim());
          (r.subs || []).forEach(x => {
            if(String(x.text || '').trim()) L.push('    · ' + x.text.trim());
          });
        });
        if(String(a.value || '').trim()) L.push('  결과: ' + a.value.trim());
        if((a.basis || '').trim())       L.push('  메모: ' + a.basis.trim());
      });
    });
  });
  return L.join('\n');
}
async function gbCopyText(){
  const t = gbText();
  if(!t.trim()){ toast('⚠️ 아직 적은 내용이 없습니다'); return; }
  try{
    await navigator.clipboard.writeText(t);
    toast('📋 보드를 글로 복사했습니다 (' + t.length.toLocaleString('ko-KR') + '자)');
  }catch(e){ prompt('아래 내용을 복사해 쓰세요', t); }
}

/* ═══════════════ 업무 → ✅ 할 일 ═════════════════════════════════
   브랜드마다 흩어져 있던 할 일을 한 화면에 모았습니다.
   누가 무엇을 맡고 있는지 사람별로 묶어서 봅니다.
   ================================================================= */
let taskWho   = '';       // '' = 전체 · '__pub' = 공용 · 그 밖은 계정 아이디
let taskBrand = '';       // '' = 전체
let taskDone  = false;    // 끝난 일도 보여줄까
let taskAdd   = false;    // 「어느 브랜드에 넣을까」 고르는 중

function setTaskWho(v){ taskWho = v; render(); }
function setTaskBrand(v){ taskBrand = v; render(); }
function toggleTaskDone(){ taskDone = !taskDone; render(); }
function openTaskAdd(){ taskAdd = !taskAdd; render(); }
function addTaskTo(bid){
  taskAdd = false;
  if(authOn()) loadPeople();
  openItemModal('tasks', null, null, bid);
}

/* 모든 브랜드의 할 일을 한 줄로 폅니다 */
function taskAll(){
  const out = [];
  data.brands.forEach(b => (b.tasks || []).forEach(t => out.push({ t:t, b:b })));
  return out;
}

/* 이 사람 앞으로 맡아 둔 것이 있나 (할 일 · 일정) — 퇴사해도 명단에 남길지 정합니다 */
function whoHasWork(uid){
  uid = String(uid || '');
  if(!uid) return false;
  if((data.brands || []).some(b => (b.tasks || []).some(t => String(t.uid || '') === uid)))
    return true;
  return (data.events || []).some(e => String(e.uid || '') === uid);
}

/* 일정 담당자 고르개 — 할 일과 같은 명단인데 맨 윗줄 말만 다릅니다.
   일정은 「마감」 처럼 팀 전체 것이 많아서 비워두는 쪽이 기본입니다. */
function evPeople(){
  const o = taskPeople().slice();
  if(o.length && o[0].value === '') o[0] = { value:'', label:'— 담당 없음 (팀 공용) —' };
  return o;
}

/* 이 할 일을 맡은 사람 — 계정을 쓰면 아이디, 안 쓰면 적어둔 이름 */
function taskOwnerKey(t){
  if(authOn()) return t.uid || '__pub';
  return (t.owner || '').trim() || '__pub';
}
function taskOwnerName(key){
  if(key === '__pub') return '공용 (맡은 사람 없음)';
  return authOn() ? (peopleName(key) || key) : key;
}

/* 정렬 — 진행 중 → 예정 → 보류 → 완료, 같은 상태면 기한이 급한 것부터 */
const TASK_ORDER = { '진행 중':0, '예정':1, '보류':2, '완료':3 };
function taskSort(rows){
  return rows.slice().sort((x, y) => {
    const d = (TASK_ORDER[x.t.status] ?? 1) - (TASK_ORDER[y.t.status] ?? 1);
    if(d) return d;
    if(x.t.due && y.t.due) return x.t.due.localeCompare(y.t.due);
    return x.t.due ? -1 : y.t.due ? 1 : 0;
  });
}

function taskDueChip(t){
  if(t.status === '완료') return '';
  if(!t.due) return '<span class="chip" style="opacity:.7" '
    + 'title="기한을 넣으면 📅 달력에도 그 날짜에 나옵니다">📅 기한 없음</span>';
  const days = Math.round((new Date(t.due) - new Date(todayStr())) / 86400000);
  const label = fmtDate(t.due);
  if(days < 0)  return '<span class="chip off">지남 · ' + esc(label) + '</span>';
  if(days <= 3) return '<span class="chip test">D-' + days + ' · ' + esc(label) + '</span>';
  return '<span class="chip">' + esc(label) + '</span>';
}
function taskStChip(st){
  const m = { '진행 중':'test', '완료':'on', '보류':'', '예정':'' };
  return '<span class="chip ' + (m[st] || '') + '">' + esc(st || '예정') + '</span>';
}

/* 할 일 한 장 — 어느 브랜드 것인지 늘 같이 보여줍니다 */
function taskCard(t, b, opts){
  opts = opts || {};
  const bid = jsq(b.id);
  const brandChip = opts.hideBrand ? ''
    : '<button class="chip" style="border-color:' + esc(b.color || 'var(--border)') + '" '
      + 'onclick="setTaskBrand(\'' + bid + '\')" title="이 브랜드 것만 보기">'
      + esc(b.icon || '🏷️') + ' ' + esc(b.name) + '</button>';
  const whoChip = opts.hideWho ? ''
    : '<span class="chip' + (authOn() && authMe() && t.uid === authMe().id ? ' on' : '') + '">👤 '
      + esc(taskOwnerName(taskOwnerKey(t))) + '</span>';

  return '<div class="card ca3' + (t.status === '완료' ? ' done' : '') + '">'
    + '<div class="ca">'
      + '<button class="btn sm" title="' + (t.status === '완료' ? '다시 진행' : '완료 처리') + '" '
        + 'onclick="toggleTask(\'' + jsq(t.id) + '\',\'' + bid + '\')">'
        + (t.status === '완료' ? '되돌리기' : '✓ 완료') + '</button>'
      + '<button class="btn sm" onclick="openItemModal(\'tasks\',\'' + jsq(t.id)
        + '\',null,\'' + bid + '\')" '
        + 'title="칸을 한꺼번에 채웁니다 — 한 칸만 고칠 때는 그 글을 바로 누르세요">수정</button>'
      + '<button class="btn sm danger" onclick="deleteItem(\'tasks\',\'' + jsq(t.id)
        + '\',\'' + bid + '\')">삭제</button>'
    + '</div>'
    + '<div class="ct"' + itemEdAttr(b.id, 'tasks', t.id, 'title', 0, '할 일')
      + '>' + esc(t.title) + '</div>'
    + '<div class="row">' + taskStChip(t.status) + taskDueChip(t) + whoChip + brandChip + '</div>'
    + itemMemoHtml(b.id, 'tasks', t.id, 'note', t.note)
    + '</div>';
}

function toggleTask(id, brandId){
  const b = brandId ? brandById(brandId) : currentBrand();
  const t = b && (b.tasks || []).find(x => x.id === id);
  if(!t){ render(); return; }           // 그 사이 다른 분이 지웠습니다
  t.status = t.status === '완료' ? '진행 중' : '완료';
  t.updatedAt = new Date().toISOString();
  render(); markDirty(b.id);
}

/* 화면 맨 위 — 어느 브랜드 · 누구 것을 볼까 */
function taskFilterBar(rows){
  const live = r => r.t.status !== '완료';

  const bcnt = {};
  rows.forEach(r => { if(live(r)) bcnt[r.b.id] = (bcnt[r.b.id] || 0) + 1; });
  const bBar = '<div class="sec-bar" style="margin:0 0 8px">'
    + '<span class="fmeta" style="flex:0 0 auto">🏷️ 브랜드</span>'
    + '<button class="btn sm' + (taskBrand ? '' : ' primary') + '" onclick="setTaskBrand(\'\')">'
      + '전체 ' + rows.filter(live).length + '</button>'
    + data.brands.map(b => '<button class="btn sm' + (taskBrand === b.id ? ' primary' : '') + '" '
        + 'onclick="setTaskBrand(\'' + jsq(b.id) + '\')">' + esc(b.icon || '🏷️') + ' '
        + esc(b.name) + (bcnt[b.id] ? ' <b>' + bcnt[b.id] + '</b>' : '') + '</button>').join('')
    + '</div>';

  const scoped = taskBrand ? rows.filter(r => r.b.id === taskBrand) : rows;
  const wcnt = {};
  scoped.forEach(r => { if(live(r)){ const k = taskOwnerKey(r.t); wcnt[k] = (wcnt[k] || 0) + 1; } });
  const keys = Object.keys(wcnt).sort((x, y) => wcnt[y] - wcnt[x]);
  const wBar = keys.length
    ? '<div class="sec-bar" style="margin:0 0 8px">'
      + '<span class="fmeta" style="flex:0 0 auto">👥 담당</span>'
      + '<button class="btn sm' + (taskWho ? '' : ' primary') + '" onclick="setTaskWho(\'\')">'
        + '모두 ' + scoped.filter(live).length + '</button>'
      + keys.map(k => '<button class="btn sm' + (taskWho === k ? ' primary' : '') + '" '
          + 'onclick="setTaskWho(\'' + jsq(k) + '\')">' + esc(taskOwnerName(k))
          + ' <b>' + wcnt[k] + '</b></button>').join('')
      + '</div>'
    : '';

  const addRow = taskAdd
    ? '<div class="sec-bar" style="margin:0 0 8px;border:1px solid var(--blue);'
      + 'border-radius:10px;padding:9px 11px">'
      + '<span class="fmeta" style="flex:0 0 auto">어느 브랜드의 할 일인가요?</span>'
      + data.brands.map(b => '<button class="btn sm" onclick="addTaskTo(\'' + jsq(b.id) + '\')">'
          + esc(b.icon || '🏷️') + ' ' + esc(b.name) + '</button>').join('')
      + '<button class="btn sm" onclick="openTaskAdd()">취소</button>'
      + '</div>'
    : '';

  const noDue = rows.filter(r => r.t.status !== '완료' && !r.t.due).length;
  const tools = '<div class="sec-bar" style="margin:0 0 8px">'
    + (taskBrand
        ? '<button class="btn primary" onclick="addTaskTo(\'' + jsq(taskBrand) + '\')">＋ 할 일 추가</button>'
        : '<button class="btn primary" onclick="openTaskAdd()">＋ 할 일 추가</button>')
    + '<button class="btn sm' + (taskDone ? ' primary' : '') + '" onclick="toggleTaskDone()">'
      + (taskDone ? '✅ 끝난 일도 보는 중' : '끝난 일 보기') + '</button>'
    + '<span class="hint">'
      + (noDue
          ? '📅 기한이 없는 할 일 ' + noDue + '건은 달력에 나오지 않습니다 — '
            + '고쳐서 기한을 넣어주세요'
          : (authOn()
              ? '「맡은 사람」 을 고르면 사람별로 묶여서 보입니다 (팀원 모두가 서로 봅니다)'
              : '담당자 칸에 이름을 적으면 사람별로 묶여서 보입니다'))
      + '</span>'
    + '</div>';

  return tools + addRow + bBar + wBar;
}

function renderTasks(){
  if(authOn()) setTimeout(() => loadPeople(), 10);
  const rows = taskAll();
  const head = '<h2 class="page-h">✅ 할 일</h2>'
    + '<div class="page-sub">브랜드마다 흩어져 있던 할 일을 한 화면에 모았습니다. '
      + '누가 무엇을 맡고 있는지 사람별로 묶어서 봅니다</div>';
  const box = h => '<div class="panel"><div class="tabbody">' + head
    + taskFilterBar(rows) + h + '</div></div>';
  const main = document.getElementById('main');

  if(!data.brands.length){
    main.innerHTML = box('<div class="empty">브랜드가 아직 없습니다. '
      + '왼쪽에서 브랜드를 먼저 만들어 주세요.</div>');
    return;
  }

  // 걸러내기 — 브랜드 → 담당 → 끝난 일
  let list = rows;
  if(taskBrand) list = list.filter(r => r.b.id === taskBrand);
  if(taskWho)   list = list.filter(r => taskOwnerKey(r.t) === taskWho);
  if(!taskDone) list = list.filter(r => r.t.status !== '완료');

  // 위쪽 숫자판 — 걸러내기와 상관없이 팀 전체 기준입니다
  const live   = rows.filter(r => r.t.status !== '완료');
  const today  = todayStr();
  const late   = live.filter(r => r.t.due && r.t.due < today).length;
  const soon   = live.filter(r => r.t.due && r.t.due >= today
                    && Math.round((new Date(r.t.due) - new Date(today)) / 86400000) <= 3).length;
  const going  = live.filter(r => r.t.status === '진행 중').length;
  const doneN  = rows.length - live.length;
  const tiles = '<div class="stats">'
    + '<div class="stat"><div class="lb">🔥 지금 하는 일</div><div class="val">' + going + '</div>'
      + '<div class="sub">전체 남은 일 ' + live.length + '건</div></div>'
    + '<div class="stat"><div class="lb">⏰ 곧 마감</div><div class="val">' + soon + '</div>'
      + '<div class="sub">사흘 안에 기한이 옵니다</div></div>'
    + '<div class="stat"><div class="lb">🚨 기한 지남</div><div class="val">' + late + '</div>'
      + '<div class="sub">' + (late ? '먼저 손봐야 할 일입니다' : '지난 일이 없습니다 👏') + '</div></div>'
    + '<div class="stat"><div class="lb">✅ 끝낸 일</div><div class="val">' + doneN + '</div>'
      + '<div class="sub">' + (taskDone ? '지금 같이 보고 있습니다' : '[끝난 일 보기] 로 볼 수 있습니다') + '</div></div>'
    + '</div>';

  if(!list.length){
    main.innerHTML = box(tiles + '<div class="empty">'
      + (rows.length ? '고른 조건에 맞는 할 일이 없습니다.'
                     : '아직 등록된 할 일이 없습니다. [＋ 할 일 추가] 로 시작해 보세요.')
      + '</div>');
    return;
  }

  // 사람별로 묶습니다 — 「누가 무엇을 맡고 있나」 가 이 화면의 핵심입니다
  const groups = {};
  list.forEach(r => { (groups[taskOwnerKey(r.t)] = groups[taskOwnerKey(r.t)] || []).push(r); });
  const order = Object.keys(groups).sort((x, y) => {
    if(x === '__pub') return 1;
    if(y === '__pub') return -1;
    return groups[y].length - groups[x].length;
  });

  const secs = order.map(k => {
    const g = taskSort(groups[k]);
    const undone = g.filter(r => r.t.status !== '완료').length;
    return '<div class="hsec">👤 ' + esc(taskOwnerName(k))
      + '<span class="fmeta" style="margin-left:8px">' + undone + '건</span></div>'
      + '<div class="cards">'
      + g.map(r => taskCard(r.t, r.b, { hideWho:true, hideBrand: !!taskBrand })).join('')
      + '</div>';
  }).join('');

  main.innerHTML = box(tiles + secs);
}

/* ═══════════════ 🪪 명함 ═════════════════════════════════════════
   브랜드마다 명함 이미지를 올려 두고, 갈래로 나눠 봅니다.
   파일은 공유폴더 <브랜드>/04_명함 에 그대로 쌓입니다 — 탐색기에서도
   똑같이 보입니다. 대시보드는 어디에 있는지만 들고 있습니다.

   한 장 = 이미지 여럿 (앞면·뒷면·재단선을 한 묶음으로 봅니다)
   ================================================================= */
const CARD_CATS = ['최종', '시안', '지난 판', '재단선', '그 밖'];
const CARD_IMG  = ['jpg','jpeg','png','gif','webp','bmp','svg'];

function cardList(){ if(!Array.isArray(data.cards)) data.cards = []; return data.cards; }
function cardFind(id){ return cardList().find(c => c.id === id) || null; }
function cardBrand(c){ return data.brands.find(b => b.id === c.brandId) || null; }
function cardIsImg(f){
  return CARD_IMG.indexOf(String(f.name || '').split('.').pop().toLowerCase()) >= 0;
}
/* 올린 파일 폴더 기준 상대경로로 사진을 부릅니다 */
function cardThumb(f, w){
  return 'nasfiles.php?action=thumb&w=' + (w || 420)
    + '&up=' + encodeURIComponent(f.filePath || '');
}
function cardFull(f){
  // 사진은 그대로 띄우고, 그 밖의 파일은 내려받게 합니다
  return cardIsImg(f)
    ? 'nasfiles.php?action=image&up=' + encodeURIComponent(f.filePath || '')
    : 'files.php?action=download&path=' + encodeURIComponent(f.filePath || '');
}

let cardBrandTab = '';    // '' 이면 전체
let cardCat      = '';    // '' 이면 전부
let cardOpen     = '';    // 펼쳐 놓은 명함
let cardUpTo     = '';    // 사진을 더할 명함 (비어 있으면 새로 만듭니다)
let cardUpBrand  = '';    // 새로 만들 때 어느 브랜드로
let cardBusy     = false;

function setCardBrand(id){ cardBrandTab = id; cardOpen = ''; render(); }
function setCardCat(v){ cardCat = (cardCat === v ? '' : v); cardOpen = ''; render(); }
function cardToggle(id){ cardOpen = (cardOpen === id ? '' : id); render(); }

function cardRows(){
  let rows = cardList().slice();
  if(cardBrandTab) rows = rows.filter(c => c.brandId === cardBrandTab);
  if(cardCat)      rows = rows.filter(c => (c.cat || '그 밖') === cardCat);
  return rows;
}

function pickCard(toId, brandId){
  cardUpTo    = toId || '';
  cardUpBrand = brandId || cardBrandTab || (data.brands[0] && data.brands[0].id) || '';
  if(!cardUpTo && !cardUpBrand){
    alert('브랜드를 먼저 하나 만들어 주세요.');
    return;
  }
  const el = document.getElementById('cardInput');
  if(el) el.click();
}

async function uploadCard(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const toId = cardUpTo; cardUpTo = '';
  const to   = toId ? cardFind(toId) : null;
  const b    = to ? cardBrand(to) : (data.brands.find(x => x.id === cardUpBrand) || null);
  if(!b){ alert('어느 브랜드의 명함인지 알 수 없습니다.'); return; }

  cardBusy = true; render();
  const got = [];
  for(const f of files){
    toast('🪪 "' + f.name + '" 올리는 중…');
    try{
      const fd = new FormData();
      fd.append('brand', b.name);
      fd.append('sub', '명함');
      fd.append('file', f);
      const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try{ out = JSON.parse(text); }catch(e){}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '올리지 못했습니다');
      got.push({ id: uid('cf'), name: out.fileName, size: out.fileSize,
                 filePath: out.filePath || '', mime: out.mime || '',
                 at: new Date().toISOString() });
    }catch(e){
      alert('"' + f.name + '" 을 올리지 못했습니다.\n\n' + (e.message || e));
    }
  }
  cardBusy = false;
  if(!got.length){ render(); return; }

  if(to){
    to.imgs = (to.imgs || []).concat(got);
    to.updatedAt = new Date().toISOString();
    cardOpen = to.id;
  }else{
    const c = { id: uid('i'), brandId: b.id,
      title: String(got[0].name).replace(/^\d{4}-\d{2}-\d{2}_/, '').replace(/\.[^.]+$/, ''),
      person:'', role:'', cat:'시안', note:'', imgs: got,
      at: new Date().toISOString(), by: (authMe() || {})['이름'] || '',
      updatedAt: new Date().toISOString() };
    cardList().unshift(c);
    cardOpen = c.id;
  }
  await saveAll(true);
  render();
  toast('✅ 명함 ' + got.length + '장을 올렸습니다');
}

function cardEdit(id, field, v, draw){
  const c = cardFind(id); if(!c) return;
  c[field] = v;
  c.updatedAt = new Date().toISOString();
  markDirtyAll();
  if(draw) render();
}
function cardDel(id){
  const c = cardFind(id); if(!c) return;
  if(!confirm('이 명함을 목록에서 지울까요?\n\n'
    + 'NAS 공유폴더의 사진 파일은 04_명함 폴더에 그대로 남습니다.')) return;
  trashPut('명함', c.title || '(이름 없음)', c, { kind:'item', type:'cards', brandId:'' });
  data.cards = cardList().filter(x => x.id !== id);
  deletedIds.add(id);
  if(cardOpen === id) cardOpen = '';
  markDirtyAll(); render();
  toast('🗑️ 휴지통으로 보냈습니다');
}
function cardImgDel(id, fid){
  const c = cardFind(id); if(!c) return;
  if(!confirm('이 사진을 명함에서 뺄까요?\n\nNAS 의 파일은 그대로 남습니다.')) return;
  c.imgs = (c.imgs || []).filter(f => f.id !== fid);
  markDirtyAll(); render();
}

/* ═══════════════ 마케팅 비용 ═════════════════════════════════════
   광고비·구독료처럼 나가는 돈을 적어두고, 한 달에 얼마인지 봅니다.
   ================================================================= */
const COST_HUE = { '광고비':'var(--red)', '구독료':'var(--blue)', '외주비':'var(--purple)',
                   '제작비':'var(--cyan)', '행사비':'var(--orange)', '기타':'var(--text-muted)' };

/* 달러로 적은 것을 원으로 바꾸기 위한 환율. 화면에서 바꿉니다. */
function fxRate(){
  const v = Number((data.settings && data.settings.fx) || 0);
  return v > 0 ? v : 1350;
}
function setFx(){
  const v = prompt('달러를 원으로 바꿀 때 쓸 환율을 적어주세요.\n\n'
    + '(구독료를 달러로 적어둔 것만 이 환율로 바뀝니다)', String(fxRate()));
  if(v === null) return;
  const n = Number(String(v).replace(/[,\s원]/g, ''));
  if(!isFinite(n) || n <= 0){ toast('⚠️ 숫자로 적어주세요'); return; }
  data.settings = data.settings || {};
  data.settings.fx = n;
  markDirty(); render();
  toast('💱 환율을 ' + n.toLocaleString('ko-KR') + '원으로 맞췄습니다');
}

/* 적어둔 금액을 원 단위 숫자로 바꿉니다 (쉼표·원·$ 다 받아줍니다) */
function costWon(c){
  const n = Number(String(c.amount == null ? '' : c.amount).replace(/[^0-9.\-]/g, ''));
  if(!isFinite(n)) return 0;
  return (c.cur === '달러') ? Math.round(n * fxRate()) : Math.round(n);
}
/* 아직 나가고 있는 돈인가 (끝난 날이 지났으면 아닙니다) */
function costLive(c){
  if(c.end && c.end < todayStr()) return false;
  return true;
}
/* 한 달에 얼마인 셈인가 — 매년은 12로 나누고, 1회성은 0 */
function costPerMonth(c){
  if(!costLive(c)) return 0;
  const w = costWon(c);
  if(c.cycle === '매년') return Math.round(w / 12);
  if(c.cycle === '1회')  return 0;
  return w;                                   // 매월 (기본)
}
/* 올해 실제로 나간(나갈) 돈 */
function costThisYear(c){
  const y = new Date().getFullYear();
  const w = costWon(c);
  const from = c.start ? new Date(c.start + 'T00:00:00') : null;
  const to   = c.end   ? new Date(c.end   + 'T00:00:00') : null;
  if(c.cycle === '1회'){
    if(!c.start) return 0;
    return (from && from.getFullYear() === y) ? w : 0;
  }
  // 올해 안에서 몇 달이나 걸쳐 있나
  const s = (from && from.getFullYear() === y) ? from.getMonth() : (from && from.getFullYear() > y ? 12 : 0);
  const e = (to && to.getFullYear() === y) ? to.getMonth() : (to && to.getFullYear() < y ? -1 : 11);
  const months = Math.max(0, e - s + 1);
  return (c.cycle === '매년') ? Math.round(w / 12) * months : w * months;
}
function won(n){ return (n || 0).toLocaleString('ko-KR') + '원'; }

/* ═══════════════ 업무 → 마케팅 비용 ═══════════════════════════════
   브랜드마다 한 달에 얼마 나가는지 한 화면에서 봅니다.
   브랜드를 고르면 그 브랜드의 항목을 그대로 고칠 수 있습니다.
   ================================================================= */
let costBrand = '';       // '' = 전체

function setCostBrand(id){ costBrand = id; render(); window.scrollTo({ top:0, behavior:'smooth' }); }

/* 브랜드 하나의 셈 */
function brandCost(b){
  const list = b.costs || [];
  const live = list.filter(costLive);
  return {
    b, n: list.length, live: live.length,
    month: live.reduce((a, c) => a + costPerMonth(c), 0),
    year:  list.reduce((a, c) => a + costThisYear(c), 0),
    once:  live.filter(c => c.cycle === '1회').reduce((a, c) => a + costWon(c), 0)
  };
}

function renderCosts(){
  const rows = data.brands.map(brandCost);
  const tot = rows.reduce((a, r) => ({
    n: a.n + r.n, month: a.month + r.month, year: a.year + r.year, once: a.once + r.once
  }), { n:0, month:0, year:0, once:0 });

  const head = '<h2 class="page-h">💳 마케팅 비용</h2>'
    + '<div class="page-sub">광고비·구독료처럼 나가는 돈을 브랜드마다 적어두고, '
      + '어디에 얼마가 들어가는지 한눈에 봅니다</div>';

  const pick = '<div class="sec-bar" style="margin-bottom:12px">'
    + '<span class="fmeta">브랜드로 보기</span>'
    + '<button class="btn sm' + (costBrand ? '' : ' primary') + '" '
      + 'onclick="setCostBrand(\'\')">전체 ' + tot.n + '</button>'
    + rows.map(r => '<button class="btn sm' + (costBrand === r.b.id ? ' primary' : '') + '" '
        + 'onclick="setCostBrand(\'' + jsq(r.b.id) + '\')">' + esc(r.b.icon || '🏷️') + ' '
        + esc(r.b.name) + (r.n ? ' <b>' + r.n + '</b>' : '') + '</button>').join('')
    + '<button class="btn sm" onclick="setFx()" title="달러로 적은 것을 원으로 바꿀 때 쓰는 값">'
      + '💱 환율 ' + fxRate().toLocaleString('ko-KR') + '원</button>'
    + '</div>';

  const box = h => '<div class="panel"><div class="tabbody">' + head + pick + h + '</div></div>';

  // 브랜드 하나만 보기 — 예전 브랜드 탭과 같은 화면입니다
  if(costBrand){
    const b = data.brands.find(x => x.id === costBrand);
    if(!b){ costBrand = ''; renderCosts(); return; }
    document.getElementById('main').innerHTML = box(
      '<div class="bhead" style="margin-bottom:12px">'
      + '<div class="icon">' + esc(b.icon || '🏷️') + '</div>'
      + '<div><h2>' + esc(b.name) + '</h2>'
        + '<div class="meta">' + esc(b.desc || '') + '</div></div>'
      + '</div>'
      + viewCosts(b));
    return;
  }

  // 전체 보기
  const tiles = '<div class="stats">'
    + '<div class="stat"><div class="lb">💳 한 달에</div><div class="val">' + won(tot.month) + '</div>'
      + '<div class="sub">브랜드 ' + rows.filter(r => r.month > 0).length + '곳에서 나가는 돈</div></div>'
    + '<div class="stat"><div class="lb">📅 올해 누적</div><div class="val">' + won(tot.year) + '</div>'
      + '<div class="sub">' + new Date().getFullYear() + '년에 나가는 돈 (1회성 포함)</div></div>'
    + '<div class="stat"><div class="lb">🧾 1회성</div><div class="val">' + won(tot.once) + '</div>'
      + '<div class="sub">한 번만 나가는 것 (달마다 계산엔 안 넣습니다)</div></div>'
    + '</div>';

  const withCost = rows.filter(r => r.n).sort((x, y) => y.month - x.month || y.year - x.year);
  if(!withCost.length){
    document.getElementById('main').innerHTML = box(tiles
      + '<div class="empty">아직 적어둔 비용이 없습니다.<br>'
      + '위에서 브랜드를 고르면 그 브랜드의 광고비·구독료를 넣을 수 있습니다.</div>');
    return;
  }

  const max = Math.max(1, withCost[0].month);
  const bars = '<div class="vz-box" style="margin-bottom:14px">'
    + '<div class="vz-head">💳 브랜드마다 한 달에 얼마</div>'
    + withCost.map(r => '<div class="bar-row" style="cursor:pointer" '
        + 'onclick="setCostBrand(\'' + jsq(r.b.id) + '\')">'
        + '<span class="bl" style="width:104px">' + esc(r.b.icon || '🏷️') + ' ' + esc(r.b.name) + '</span>'
        + '<span class="bt"><span class="bf" style="width:'
          + Math.round(r.month / max * 100) + '%;background:' + (r.b.color || 'var(--accent)') + '"></span></span>'
        + '<span class="bv">' + won(r.month) + '</span></div>').join('')
    + '</div>';

  // 종류별로도 봅니다 (팀 전체)
  const byKind = {};
  data.brands.forEach(b => (b.costs || []).filter(costLive).forEach(c => {
    const k = c.kind || '기타';
    byKind[k] = (byKind[k] || 0) + costPerMonth(c);
  }));
  const kinds = Object.keys(byKind).filter(k => byKind[k] > 0).sort((x, y) => byKind[y] - byKind[x]);
  const kindMax = kinds.length ? byKind[kinds[0]] : 1;
  const kindBars = kinds.length
    ? '<div class="vz-box" style="margin-bottom:14px">'
      + '<div class="vz-head">🏷️ 어떤 종류로 나가나 (한 달 기준)</div>'
      + kinds.map(k => '<div class="bar-row">'
          + '<span class="bl" style="width:66px"><span class="vz-sw" style="background:'
            + (COST_HUE[k] || 'var(--text-muted)') + ';display:inline-block;margin-right:6px"></span>'
            + esc(k) + '</span>'
          + '<span class="bt"><span class="bf" style="width:' + Math.round(byKind[k] / kindMax * 100)
            + '%;background:' + (COST_HUE[k] || 'var(--text-muted)') + '"></span></span>'
          + '<span class="bv">' + won(byKind[k]) + '</span></div>').join('')
      + '</div>'
    : '';

  const table = '<div class="vz-tw"><table class="ymtable costtable">'
    + '<thead><tr><th>브랜드</th><th class="num">건수</th><th class="num">한 달에</th>'
      + '<th class="num">올해</th><th class="num">1회성</th><th></th></tr></thead><tbody>'
    + withCost.map(r => '<tr>'
        + '<td><span class="vz-sw" style="background:' + (r.b.color || 'var(--accent)')
          + ';display:inline-block;margin-right:7px"></span><b>' + esc(r.b.name) + '</b>'
          + (r.live < r.n ? '<span class="fmeta"> · 쓰는 중 ' + r.live + ' / ' + r.n + '건</span>' : '')
          + '</td>'
        + '<td class="num">' + r.n + '</td>'
        + '<td class="num">' + (r.month ? won(r.month) : '<span class="zero">–</span>') + '</td>'
        + '<td class="num">' + won(r.year) + '</td>'
        + '<td class="num">' + (r.once ? won(r.once) : '<span class="zero">–</span>') + '</td>'
        + '<td><button class="btn sm" onclick="setCostBrand(\'' + jsq(r.b.id) + '\')">'
          + '자세히 · 고치기</button></td></tr>').join('')
    + '<tr class="sumrow"><th>합계</th><td class="num">' + tot.n + '</td>'
      + '<td class="num tot">' + won(tot.month) + '</td>'
      + '<td class="num tot">' + won(tot.year) + '</td>'
      + '<td class="num">' + won(tot.once) + '</td><td></td></tr>'
    + '</tbody></table></div>';

  document.getElementById('main').innerHTML = box(tiles + bars + kindBars + table
    + '<div class="fmeta" style="margin-top:8px">'
      + '「한 달에」 는 매년 결제하는 것을 12로 나눠 더한 값입니다. '
      + '1회성은 달마다 계산에 넣지 않고 「올해 누적」 에만 들어갑니다. '
      + '달러로 적은 것은 환율 ' + fxRate().toLocaleString('ko-KR') + '원으로 바꿔 셉니다.'
    + '</div>');
}

function viewCosts(b){
  const list = b.costs || [];
  const bid = b.id;
  const bar = '<div class="sec-bar">'
    + '<button class="btn primary" onclick="openItemModal(\'costs\',null,null,\'' + jsq(bid) + '\')">'
      + '＋ 비용 등록</button>'
    + '<button class="btn sm" onclick="setFx()" title="달러로 적은 것을 원으로 바꿀 때 쓰는 값">'
      + '💱 환율 ' + fxRate().toLocaleString('ko-KR') + '원</button>'
    + '<span class="hint">광고비·구독료처럼 나가는 돈을 적어두면 '
      + '한 달에 얼마인지 바로 보입니다</span>'
    + '</div>';

  if(!list.length) return bar + '<div class="empty">' + TYPES.costs.empty + '</div>';

  const live   = list.filter(costLive);
  const perMon = live.reduce((a, c) => a + costPerMonth(c), 0);
  const year   = list.reduce((a, c) => a + costThisYear(c), 0);
  const once   = live.filter(c => c.cycle === '1회').reduce((a, c) => a + costWon(c), 0);

  // 종류별로 얼마나 나가나 (한 달 기준)
  const byKind = {};
  live.forEach(c => { const k = c.kind || '기타';
    byKind[k] = (byKind[k] || 0) + costPerMonth(c); });
  const kinds = Object.keys(byKind).filter(k => byKind[k] > 0)
                      .sort((x, y) => byKind[y] - byKind[x]);
  const kindMax = kinds.length ? byKind[kinds[0]] : 1;

  const tiles = '<div class="stats">'
    + '<div class="stat"><div class="lb">💳 한 달에</div><div class="val">' + won(perMon) + '</div>'
      + '<div class="sub">지금 쓰고 있는 것 ' + live.length + '건 기준</div></div>'
    + '<div class="stat"><div class="lb">📅 올해 누적</div><div class="val">' + won(year) + '</div>'
      + '<div class="sub">' + new Date().getFullYear() + '년에 나가는 돈 (1회성 포함)</div></div>'
    + '<div class="stat"><div class="lb">🧾 1회성</div><div class="val">' + won(once) + '</div>'
      + '<div class="sub">한 번만 나가는 것 (달마다 계산엔 안 넣습니다)</div></div>'
    + '</div>';

  const kindBars = kinds.length
    ? '<div class="vz-box" style="margin-bottom:14px">'
      + '<div class="vz-head">💳 한 달에 어디로 나가나</div>'
      + kinds.map(k => '<div class="bar-row">'
          + '<span class="bl" style="width:66px"><span class="vz-sw" style="background:' + (COST_HUE[k] || 'var(--text-muted)')
            + ';display:inline-block;margin-right:6px"></span>' + esc(k) + '</span>'
          + '<span class="bt"><span class="bf" style="width:'
            + Math.round(byKind[k] / kindMax * 100) + '%;background:'
            + (COST_HUE[k] || 'var(--text-muted)') + '"></span></span>'
          + '<span class="bv">' + won(byKind[k]) + '</span></div>').join('')
      + '</div>'
    : '';

  const sorted = list.slice().sort((x, y) => {
    const lx = costLive(x) ? 0 : 1, ly = costLive(y) ? 0 : 1;
    if(lx !== ly) return lx - ly;                       // 쓰고 있는 것 먼저
    return costPerMonth(y) - costPerMonth(x) || costWon(y) - costWon(x);
  });

  const rows = sorted.map(c => {
    const off = !costLive(c);
    const pm  = costPerMonth(c);
    return '<tr' + (off ? ' class="dim"' : '') + '>'
      /* 이름 · 메모 · 금액은 표에서 바로 고칩니다 — 금액 하나 바꾸려고
         모달을 열어 아홉 칸을 지나치게 하지 않습니다. 종류 · 주기처럼
         고른 것 중 하나인 칸은 모달에 둡니다 (글칸이면 오타가 들어갑니다). */
      + '<td><span class="vz-sw" style="background:' + (COST_HUE[c.kind] || 'var(--text-muted)')
        + ';display:inline-block;margin-right:7px"></span>'
        + '<b' + itemEdAttr(bid, 'costs', c.id, 'title', 0, '무엇에 쓰는 돈인가') + '>'
        + esc(c.title || '(이름 없음)') + '</b>'
        + (off ? '<span class="chip off" style="margin-left:6px">해지</span>' : '')
        + (String(c.desc || '').trim()
            ? '<div class="fmeta" style="margin-top:3px"'
              + itemEdAttr(bid, 'costs', c.id, 'desc', 1, '메모') + '>' + esc(c.desc) + '</div>'
            : '<div class="fmeta cd-non" style="margin-top:3px"'
              + itemEdAttr(bid, 'costs', c.id, 'desc', 1, '메모') + '>＋ 메모</div>')
        + '</td>'
      + '<td>' + esc(c.kind || '기타') + '</td>'
      + '<td class="num"><span' + itemEdAttr(bid, 'costs', c.id, 'amount', 0,
            '숫자만 — 예) 300000') + '>' + won(costWon(c)) + '</span>'
        + (c.cur === '달러'
            ? '<div class="fmeta">$' + esc(String(c.amount || '')) + '</div>' : '')
        + '</td>'
      + '<td>' + esc(c.cycle || '매월') + '</td>'
      + '<td class="num">' + (pm ? won(pm) : '<span class="zero">–</span>') + '</td>'
      + '<td class="num">' + won(costThisYear(c)) + '</td>'
      + '<td>' + esc(c.payer || '') + (c.owner ? '<div class="fmeta">' + esc(c.owner) + '</div>' : '') + '</td>'
      + '<td>' + (c.start ? esc(fmtDate(c.start)) : '')
        + (c.end ? '<div class="fmeta">~ ' + esc(fmtDate(c.end)) + '</div>' : '') + '</td>'
      + '<td style="white-space:nowrap">'
        + '<button class="btn sm" onclick="openItemModal(\'costs\',\'' + jsq(c.id)
          + '\',null,\'' + jsq(bid) + '\')">수정</button> '
        + '<button class="btn sm danger" onclick="deleteItem(\'costs\',\'' + jsq(c.id)
          + '\',\'' + jsq(bid) + '\')">삭제</button>'
        + '</td></tr>';
  }).join('');

  const table = '<div class="vz-tw"><table class="ymtable costtable">'
    + '<thead><tr><th>항목</th><th>종류</th><th class="num">금액</th><th>주기</th>'
      + '<th class="num">한 달에</th><th class="num">올해</th><th>결제·담당</th><th>기간</th><th></th></tr></thead>'
    + '<tbody>' + rows
    + '<tr class="sumrow"><th>합계</th><td></td><td></td><td></td>'
      + '<td class="num tot">' + won(perMon) + '</td>'
      + '<td class="num tot">' + won(year) + '</td><td></td><td></td><td></td></tr>'
    + '</tbody></table></div>';

  return bar + tiles + kindBars + table
    + '<div class="fmeta" style="margin-top:8px">'
      + '「한 달에」 는 매년 결제하는 것을 12로 나눠 더한 값입니다. '
      + '1회성은 달마다 계산에 넣지 않고 「올해 누적」 에만 들어갑니다. '
      + '달러로 적은 것은 환율 ' + fxRate().toLocaleString('ko-KR') + '원으로 바꿔 셉니다.'
    + '</div>';
}

/* ═══════════════ 🗑 휴지통 화면 ═════════════════════════════════
   지운 것을 한자리에서 봅니다.
     · 위쪽 — 대시보드에서 지운 것 (브랜드·자료·할 일·회의록·일정 …)

function renderTrash(){

    ? '<div class="vz-tw"><table class="ymtable"><thead><tr>'
      + '<th>이름</th><th>무엇</th><th>지운 때</th><th>지운 사람</th><th></th>'
      + '</tr></thead><tbody>'
      + box.map(t => '<tr>'
          + '<td><b>' + esc(t.이름) + '</b></td>'

          + '<td style="white-space:nowrap">' + esc(sinceText(t.지운때)) + '</td>'
          + '<td>' + esc(t.지운사람 || '') + '</td>'
          + '<td style="white-space:nowrap">'
            + '<button class="btn sm primary" onclick="trashRestore(\'' + jsq(t.id) + '\')">'

            + '<button class="btn sm danger" onclick="trashDrop(\'' + jsq(t.id) + '\')">'

    ? '<div class="fmeta">NAS 휴지통을 불러오는 중…</div>'
    : trash.error
      ? '<div class="gonecard">⚠️ NAS 휴지통을 불러오지 못했습니다.<br>'
        + '<span class="fmeta">' + esc(trash.error) + '</span></div>'
