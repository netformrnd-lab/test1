function chartSetUnit(u){ chartOpt.unit = u; chartCell = null; render(); }
function chartSetCat(v){
  const i = v.indexOf('\u241F');                 // "열\u241F값" 으로 넘어옵니다
  chartOpt.cat = i < 0 ? '' : v.slice(0, i);
  chartOpt.val = i < 0 ? '' : v.slice(i + 1);
  chartCell = null;
  render();
}
function chartReset(){
  chartOpt.off = {}; chartOpt.unit = '월'; chartOpt.cat = ''; chartOpt.val = '';
  render();
}

/* 연도 × (월 또는 분기) 표를 만듭니다.
   언제나 12달로 먼저 세고, 고친 숫자를 덮어쓴 뒤, 분기면 그때 묶습니다.
   그래야 월별로 고친 것이 분기별 화면에도 그대로 반영됩니다.
   fix 를 주지 않으면(검색 중이거나 분류로 좁혔을 때) 원래 숫자만 씁니다.  */
function yearMonthGrid(rows, dateCol, unit, fix){
  const m = {};                          // 연도 → [12개월]
  let none = 0;
  rows.forEach(r => {
    const d = dateCol ? parseYMD(r[dateCol]) : null;
    if(!d){ none++; return; }
    const y = d.getFullYear();
    if(!m[y]) m[y] = new Array(12).fill(0);
    m[y][d.getMonth()]++;
  });

  const raw = {};                        // 고치기 전 숫자 (원래 값을 알려주려고 남깁니다)
  Object.keys(m).forEach(y => { raw[y] = m[y].slice(); });

  const fixed = {};                      // 연도 → { 달번호: true }
  if(fix){
    Object.keys(fix).forEach(k => {
      const p = k.split('-');
      const y = Number(p[0]), i = Number(p[1]) - 1;
      if(!isFinite(y) || !(i >= 0 && i < 12)) return;
      if(!m[y]){ m[y] = new Array(12).fill(0); raw[y] = new Array(12).fill(0); }
      m[y][i] = fix[k];
      (fixed[y] = fixed[y] || {})[i] = true;
    });
  }

  const n = unit === '분기' ? 4 : 12;
  let grid = m, rawU = raw, fixedU = fixed;
  if(unit === '분기'){
    // 분기로 묶을 때는 원래 숫자와 '고친 표시' 도 같은 눈금으로 맞춥니다.
    // (안 그러면 2분기 칸이 2월의 원래 숫자를 보여주는 식으로 어긋납니다)
    grid = {}; rawU = {}; fixedU = {};
    Object.keys(m).forEach(y => {
      grid[y] = [0, 0, 0, 0];
      rawU[y] = [0, 0, 0, 0];
      m[y].forEach((v, i) => { grid[y][Math.floor(i / 3)] += v; });
      raw[y].forEach((v, i) => { rawU[y][Math.floor(i / 3)] += v; });
      Object.keys(fixed[y] || {}).forEach(i => {
        (fixedU[y] = fixedU[y] || {})[Math.floor(Number(i) / 3)] = true;
      });
    });
  }
  const years = Object.keys(grid).map(Number).sort((a, b) => b - a);   // 최근 연도부터
  return { grid, years, none, n, months: m, raw: rawU, fixed: fixedU, fixedM: fixed };
}

/* 그 해에 어느 달까지 그릴지.
   올해는 '이번 달' 까지만 그립니다. 아직 오지 않은 달을 0건으로 그리면
   문의가 뚝 끊긴 것처럼 보여서 잘못 읽게 됩니다. */
function lastMonthOf(year, g, unit){
  const now = new Date();
  const n = unit === '분기' ? 4 : 12;
  if(year > now.getFullYear()) return -1;
  if(year === now.getFullYear()){
    return unit === '분기' ? Math.floor(now.getMonth() / 3) : now.getMonth();
  }
  // 지난 해인데 뒷쪽이 통째로 비어 있으면 (그때부터 기록이 없는 것) 거기서 끊습니다
  const arr = (g.grid && g.grid[year]) || [];
  let last = n - 1;
  while(last > 0 && arr[last] === 0 && arr[last - 1] === 0) last--;

  // 손으로 숫자를 넣어둔 달이 그보다 뒤에 있으면 거기까지 보여줍니다
  const fx = (g.fixedM && g.fixedM[year]) || {};
  Object.keys(fx).forEach(i => {
    const at = unit === '분기' ? Math.floor(Number(i) / 3) : Number(i);
    if(at > last) last = at;
  });
  return last;
}

/* 그 해에 어느 달부터 그릴지.
   앞쪽이 통째로 비어 있으면 (그때는 아직 기록이 없던 것) 거기서부터 시작합니다.
   9월부터 손으로 채워 넣은 해를 1~8월 0건으로 그리면 없던 일이 생깁니다. */
function firstMonthOf(year, g, unit){
  const arr = (g.grid && g.grid[year]) || [];
  const fx  = (g.fixedM && g.fixedM[year]) || {};
  const has = i => arr[i] > 0
    || Object.keys(fx).some(k => (unit === '분기' ? Math.floor(Number(k) / 3) : Number(k)) === i);
  for(let i = 0; i < arr.length; i++){ if(has(i)) return i; }
  return 0;
}

/* 꺾은선 그래프 (SVG 를 직접 그립니다 — 인터넷 없이도 뜹니다) */
function inquiryYearChart(g, shownYears, cand4){
  const N = g.n || 12;
  const W = 720, H = 260;
  const PAD = { t: 16, r: 18, b: 30, l: 42 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;

  const hue = yearHueMap(cand4 || shownYears);
  const lastOf = {}, firstOf = {};
  shownYears.forEach(y => {
    lastOf[y]  = lastMonthOf(y, g, chartOpt.unit);
    firstOf[y] = firstMonthOf(y, g, chartOpt.unit);
  });

  let max = 0;
  shownYears.forEach(y => g.grid[y].forEach((v, i) => {
    if(i >= firstOf[y] && i <= lastOf[y] && v > max) max = v;
  }));
  if(max < 4) max = 4;
  const step = Math.max(1, Math.ceil(max / 4));
  const top  = step * 4;                                    // 눈금이 딱 떨어지게

  const x = i => N === 1 ? PAD.l + iw / 2 : PAD.l + (iw * i) / (N - 1);
  const y = v => PAD.t + ih - (ih * v) / top;

  // 가로 눈금선 (연하게)
  let grid = '';
  for(let k = 0; k <= 4; k++){
    const val = step * k, yy = y(val);
    grid += '<line x1="' + PAD.l + '" y1="' + yy + '" x2="' + (W - PAD.r) + '" y2="' + yy
      + '" class="vz-grid"/>'
      + '<text x="' + (PAD.l - 8) + '" y="' + (yy + 4) + '" class="vz-tick" text-anchor="end">'
      + val.toLocaleString('ko-KR') + '</text>';
  }
  for(let i = 0; i < N; i++){
    grid += '<text x="' + x(i) + '" y="' + (H - 10) + '" class="vz-tick" text-anchor="middle">'
      + (chartOpt.unit === '분기' ? (i + 1) + 'Q' : (i + 1)) + '</text>';
  }

  // 선과 점
  let marks = '';
  shownYears.forEach(yr => {
    const col = hue[yr] || yearHue(yr);
    const upto = lastOf[yr];
    const from = firstOf[yr];
    if(upto < 0 || from > upto) return;
    const pts = g.grid[yr].slice(from, upto + 1).map((v, k) => [x(from + k), y(v)]);
    if(pts.length > 1){
      marks += '<polyline class="vz-line" stroke="' + col + '" points="'
        + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
    }
    pts.forEach(p => {
      marks += '<circle class="vz-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1)
        + '" r="4.5" fill="' + col + '"/>';
    });
    // 선이 끝나는 자리에만 연도를 적습니다 (모든 점에 숫자를 달지 않습니다)
    const last = pts[pts.length - 1];
    const atRight = upto >= N - 2;
    marks += '<text x="' + (last[0] + (atRight ? -6 : 8)) + '" y="' + (last[1] - 9)
      + '" class="vz-endlab" text-anchor="' + (atRight ? 'end' : 'start') + '">'
      + yr + (upto < N - 1 ? ' →' : '') + '</text>';
  });

  // 마우스를 올리면 그 달의 모든 해를 함께 보여줍니다
  let hot = '';
  const band = N > 1 ? iw / (N - 1) : iw;
  for(let i = 0; i < N; i++){
    const lab = chartOpt.unit === '분기' ? QUARTER_KO[i] : (i + 1) + '월';
    const tip = shownYears.map(yr => yr + '년 ' + lab + ' · '
      + (i < firstOf[yr] ? '기록 없음'
          : (i <= lastOf[yr] ? g.grid[yr][i].toLocaleString('ko-KR') + '건'
                             : '아직'))).join('&#10;');
    hot += '<rect class="vz-hot" x="' + (x(i) - band / 2) + '" y="' + PAD.t
      + '" width="' + band + '" height="' + ih + '"><title>' + esc(tip) + '</title></rect>';
  }

  return '<svg class="vz" viewBox="0 0 ' + W + ' ' + H + '" role="img" '
    + 'aria-label="연도별 월 문의 건수 꺾은선 그래프">'
    + grid + marks + hot + '</svg>';
}

/* 표의 숫자 한 칸. 고칠 수 있으면 눌러서 바로 숫자를 넣습니다. */
function ymCell(g, yr, i, v, from, upto, unit, canFix){
  // 월별일 때만, 그리고 아직 오지 않은 달이 아닐 때만 고칠 수 있습니다
  const editable = canFix && unit === '월' && !isFuture(yr, i);
  const isFix    = !!(g.fixed[yr] && g.fixed[yr][i]);
  const origN    = (g.raw[yr] || [])[i] || 0;

  if(chartCell && chartCell.y === yr && chartCell.i === i){
    // 원래 숫자를 안 보이게 남겨 칸 너비를 지킵니다.
    // (입력칸이 자리를 넓히면 표 전체가 옆으로 밀립니다)
    return '<td class="num ed2 on"><span class="edshadow">'
      + (v ? v.toLocaleString('ko-KR') : '0') + '</span>'
      + '<input id="chartEd" type="text" inputmode="numeric" size="4" '
      + 'value="' + esc(isFix ? String(v) : '') + '" '
      + 'placeholder="' + origN + '" '
      + 'onkeydown="chartCellKeydown(event)" onblur="commitChartCell(this.value)"></td>';
  }

  if((i > upto || i < from) && !isFix){
    const why = i < from ? '아직 기록이 없던 때' : '아직 오지 않은 때';
    return '<td class="num zero' + (editable ? ' ed2' : '') + '"'
      + ' title="' + why + (editable ? '입니다 — 눌러서 숫자를 넣을 수 있습니다' : '') + '"'
      + (editable ? ' onclick="startChartCell(' + yr + ',' + i + ')"' : '')
      + '>–</td>';
  }

  const tip = isFix
    ? '손으로 고친 숫자입니다 (시트 숫자: ' + origN.toLocaleString('ko-KR') + '건)'
      + ' — 비우면 되돌아갑니다'
    : (editable ? '눌러서 숫자를 고칠 수 있습니다' : '');

  return '<td class="num' + (v ? '' : ' zero') + (isFix ? ' fx' : '')
    + (editable ? ' ed2' : '') + '"'
    + (tip ? ' title="' + esc(tip) + '"' : '')
    + (editable ? ' onclick="startChartCell(' + yr + ',' + i + ')"' : '') + '>'
    + (v ? v.toLocaleString('ko-KR') : '0')
    + (isFix ? '<span class="fxmark" aria-label="고침">✎</span>' : '')
    + '</td>';
}

function inquiryYearView(rows, dateCol, sum, b, searching){
  if(!dateCol) return '';

  // 분류로 좁혀 보기 (예: 문의유형 = 하자점검 만)
  let use = rows;
  if(chartOpt.cat && chartOpt.val){
    use = rows.filter(r => String(r[chartOpt.cat] || '').trim() === chartOpt.val);
  }

  // 손으로 고친 숫자는 '이 브랜드 전체' 에 대한 값입니다.
  // 그래서 분류로 좁혔거나 찾는 중일 때는 덮어쓰지 않고 원래 숫자만 봅니다.
  const narrowed = !!(chartOpt.cat && chartOpt.val) || !!searching;
  const canFix   = !!b && !narrowed;
  const fix      = canFix ? chartFixMap(b) : null;

  const unit = chartOpt.unit;
  const g = yearMonthGrid(use, dateCol, unit, fix);
  if(!g.years.length) return '';

  const N     = g.n;
  const LABS  = unit === '분기' ? QUARTER_KO : MONTHS_KO;
  const cand  = g.years.slice(0, yearChartMax);            // 그릴 수 있는 해
  const shown = cand.filter(y => !chartOpt.off[y]);        // 실제로 켠 해

  // ── 조작 줄 ───────────────────────────────────────────────
  // 연도는 눌러서 껐다 켤 수 있습니다. 꺼도 다른 해의 색은 그대로입니다.
  const hueMap = yearHueMap(cand);
  const yearBtns = cand.map(yr => {
    const on = !chartOpt.off[yr];
    return '<button class="vz-key vz-btn' + (on ? '' : ' off') + '" '
      + 'onclick="chartToggleYear(' + yr + ')" '
      + 'title="' + (on ? '눌러서 숨기기' : '눌러서 보이기') + '">'
      + '<span class="vz-sw" style="background:' + (on ? (hueMap[yr] || yearHue(yr)) : 'var(--text-muted)') + '"></span>'
      + yr + '년</button>';
  }).join('');

  // 나눠볼 수 있는 분류 (문의유형 등) — 값이 몇 가지뿐인 열만 고릅니다
  const cats = (sum && sum.cats) ? sum.cats : [];
  let catSel = '';
  if(cats.length){
    let opts = '<option value="">전체</option>';
    cats.forEach(c => {
      const vals = {};
      rows.forEach(r => { const v = String(r[c] || '').trim(); if(v) vals[v] = (vals[v] || 0) + 1; });
      const list = Object.keys(vals).sort((a, b) => vals[b] - vals[a]).slice(0, 12);
      if(!list.length) return;
      opts += '<optgroup label="' + esc(c) + '">'
        + list.map(v => '<option value="' + esc(c + '\u241F' + v) + '"'
            + (chartOpt.cat === c && chartOpt.val === v ? ' selected' : '') + '>'
            + esc(v) + ' (' + vals[v] + ')</option>').join('')
        + '</optgroup>';
    });
    catSel = '<select class="vz-sel" onchange="chartSetCat(this.value)">' + opts + '</select>';
  }

  const controls = '<div class="vz-ctrl">'
    + '<span class="vz-keys">' + yearBtns + '</span>'
    + '<span class="vz-spacer"></span>'
    + '<span class="vz-seg">'
      + ['월','분기'].map(u => '<button class="' + (unit === u ? 'on' : '') + '" '
          + 'onclick="chartSetUnit(\'' + u + '\')">' + u + '별</button>').join('')
    + '</span>'
    + catSel
    + ((Object.keys(chartOpt.off).some(k => chartOpt.off[k]) || chartOpt.cat || unit !== '월')
        ? '<button class="btn sm" onclick="chartReset()">처음으로</button>' : '')
    + (canFix && chartFixCount(b)
        ? '<button class="btn sm" onclick="chartFixClear()" '
          + 'title="손으로 고친 숫자를 모두 시트 숫자로 되돌립니다">'
          + '↩︎ 고친 숫자 되돌리기 (' + chartFixCount(b) + ')</button>' : '')
    + '</div>';

  if(!shown.length){
    return '<div class="vz-box">'
      + '<div class="vz-head">📈 해마다 언제 문의가 많았나</div>'
      + controls
      + '<div class="empty" style="padding:28px">볼 해를 하나 이상 켜주세요.</div></div>';
  }

  // ── 표 (그래프와 같은 숫자) ────────────────────────────────
  const head = '<tr><th>연도</th>'
    + LABS.map(m => '<th class="num">' + m + '</th>').join('')
    + '<th class="num">합계</th></tr>';
  const body = g.years.map(yr => {
    const arr = g.grid[yr];
    const upto = lastMonthOf(yr, g, unit);
    const from = firstMonthOf(yr, g, unit);
    const total = arr.reduce((a, v, i) => (i >= from && i <= upto) ? a + v : a, 0);
    const dim = chartOpt.off[yr] || cand.indexOf(yr) < 0;
    return '<tr' + (dim ? ' class="dim"' : '') + '><th class="yr">' + yr + '</th>'
      + arr.map((v, i) => ymCell(g, yr, i, v, from, upto, unit, canFix)).join('')
      + '<td class="num tot">' + total.toLocaleString('ko-KR') + '</td></tr>';
  }).join('');
  const colSum = new Array(N).fill(0);
  g.years.forEach(yr => g.grid[yr].forEach((v, i) => { colSum[i] += v; }));
  const foot = '<tr class="sumrow"><th>합계</th>'
    + colSum.map(v => '<td class="num">' + (v ? v.toLocaleString('ko-KR') : '·') + '</td>').join('')
    + '<td class="num tot">' + colSum.reduce((a, v) => a + v, 0).toLocaleString('ko-KR')
    + '</td></tr>';

  const what = chartOpt.cat && chartOpt.val
    ? esc(chartOpt.cat) + ' = ' + esc(chartOpt.val) + ' 만'
    : '전체 문의';

  return '<div class="vz-box">'
    + '<div class="vz-head">📈 해마다 언제 문의가 많았나'
      + '<span class="fmeta" style="margin-left:auto">' + what
      + ' · 가로축 = ' + unit + ' · 점에 마우스를 올리면 숫자가 나옵니다</span>'
    + '</div>'
    + controls
    + '<div class="vz-wrap">' + inquiryYearChart(g, shown, cand) + '</div>'
    + (g.years.length > cand.length
        ? '<div class="fmeta" style="margin-top:6px">최근 ' + cand.length
          + '개 해만 그립니다 (표에는 전부 있습니다)</div>' : '')
    + '<div class="vz-tw"><table class="ymtable">'
      + '<thead>' + head + '</thead><tbody>' + body + foot + '</tbody></table></div>'
    + '<div class="fmeta" style="margin-top:8px">'
      + (canFix && unit === '월'
          ? '✎ 표의 숫자를 눌러 고칠 수 있습니다. 시트에 없는 옛날 자료를 채워 넣거나 '
            + '틀린 숫자를 바로잡을 때 쓰세요. <b>구글시트는 바뀌지 않고</b>, '
            + '이 화면에만 덮어씁니다. 칸을 비우면 시트 숫자로 돌아갑니다.'
          : (canFix
              ? '숫자를 고치려면 <b>월별</b>로 바꿔주세요 (분기는 월을 더한 값입니다)'
              : '분류로 좁혔거나 찾는 중일 때는 시트 숫자만 보여줍니다 '
                + '(고친 숫자는 브랜드 전체 기준이라 섞이면 헷갈립니다)'))
      + '</div>'
    + (g.none ? '<div class="fmeta" style="margin-top:8px">날짜를 못 읽은 문의 '
        + g.none.toLocaleString('ko-KR') + '건은 빠져 있습니다</div>' : '')
    + '</div>';
}

function viewInquiries(b){
  if(STORAGE_MODE !== 'nas'){
    return '<div class="empty">🔒 문의 기록은 NAS 주소로 접속했을 때만 보입니다.<br>'
      + 'http://192.168.0.37/brand/brand.html 로 접속해 주세요.</div>';
  }
  if(!inquiryCache.loaded) return '<div class="empty">불러오는 중…</div>';

  const linked = inquiryCache.sheetUrl && inquiryCache.sheetUrl !== '연결 안 됨'
                 && inquiryCache.sheetUrl !== '확인 불가';
  const rows = inquiryCache.byBrand[b.name] || [];
  // 얼마나 최신인지 한눈에 보이게 "몇 분 전" 으로 적습니다
  const when = (function(){
    if(!inquiryCache.updatedAt) return '아직 받은 적 없음';
    const d = new Date(inquiryCache.updatedAt);
    if(isNaN(d.getTime())) return '알 수 없음';
    const m = Math.floor((Date.now() - d.getTime()) / 60000);
    if(m < 1) return '방금';
    if(m < 60) return m + '분 전';
    return d.toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' });
  })();

  const bar = '<div class="sec-bar">'
    + '<span class="searchbox" style="flex:0 1 260px"><span class="ico">🔍</span>'
      + '<input type="text" id="iqQ" placeholder="이 브랜드 문의에서 검색" '
      + 'value="' + esc(inquiryQuery) + '" oninput="onInquiryQuery(this.value)"></span>'
    + (linked
        ? '<button class="btn primary" onclick="syncInquiries(true)">↻ 시트에서 가져오기</button>'
        : '<button class="btn primary" onclick="openSheets()">🔗 시트 연결</button>')
    + '<button class="btn" onclick="openSheets()">🔗 시트 관리'
      + (inquiryCache.sheetCount ? ' (' + inquiryCache.sheetCount + ')' : '') + '</button>'
    + '<button class="btn" onclick="document.getElementById(\'csvInput\').click()">📥 CSV 올리기</button>'
    + '<input type="file" id="csvInput" accept=".csv,text/csv" style="display:none">'
    + '<span class="astat" id="csvStat"></span>'
    + '<span class="hint">전체 ' + inquiryCache.total.toLocaleString('ko-KR') + '건 중 이 브랜드 '
      + rows.length.toLocaleString('ko-KR') + '건 · 시트에서 가져온 때: ' + esc(when)
      + (linked ? ' · 🔗 자동으로 따라옵니다' : '') + '</span>'
    + '</div>'
    + (inquiryCache.syncError
        ? '<div class="ainote" style="margin-bottom:12px;white-space:pre-wrap">⚠️ 자동 가져오기 실패: '
          + esc(inquiryCache.syncError) + '</div>' : '')
    + sheetPanelView();

  // 목록을 아예 못 불러온 경우에도 위 버튼들은 그대로 두어 조치할 수 있게 합니다
  if(inquiryCache.error){
    const notFound = /404/.test(inquiryCache.error);
    return bar + '<div class="empty">'
      + (notFound
          ? '문의 기능 파일이 아직 NAS에 없습니다.<br><br>'
            + '아래 주소를 브라우저에서 한 번 열면 자동으로 설치됩니다.<br>'
            + '<span class="path" style="display:inline-block;margin-top:8px">'
            + 'http://192.168.0.37/brand/save.php?action=bootstrap</span><br>'
            + '<span style="display:inline-block;margin-top:8px;color:var(--text-muted)">'
            + '설치 후 이 화면에서 Ctrl+F5 를 눌러주세요</span>'
          : '문의 기록을 불러오지 못했습니다.<br>'
            + '<span class="path">' + esc(inquiryCache.error) + '</span>')
      + '</div>';
  }

  if(!inquiryCache.total){
    return bar + '<div class="empty">아직 등록된 문의 기록이 없습니다.<br><br>'
      + '<b>[🔗 시트 연결]</b> 을 눌러 구글시트 CSV 주소를 넣으면<br>'
      + '이후로는 알아서 가져옵니다.<br>'
      + '<span style="display:inline-block;margin-top:10px;color:var(--text-muted)">'
      + '첫 줄에 「브랜드」 열이 있어야 브랜드별로 나뉩니다</span></div>';
  }
  if(!rows.length){
    return bar + '<div class="empty">"' + esc(b.name) + '" 브랜드로 들어온 문의가 없습니다.<br>'
      + '시트의 브랜드 열 값이 브랜드 이름과 같은지 확인해 주세요.</div>';
  }

  const q = inquiryQuery.trim().toLowerCase();
  const shown = q
    ? rows.filter(r => Object.values(r).join(' ').toLowerCase().includes(q))
    : rows;

  const sum = inquirySummary(shown);
  const diff = sum.lastMonth > 0
    ? Math.round((sum.thisMonth - sum.lastMonth) / sum.lastMonth * 100) : null;

  // 요약 타일
  const tiles = [
    { lab:'📮 전체 문의', val: shown.length.toLocaleString('ko-KR') + ' 건',
      sub: q ? '검색 결과 기준' : b.name },
    { lab:'📅 이번 달 (1~' + sum.today + '일)', val: sum.dateCol ? sum.thisMonth + ' 건' : '—',
      sub: sum.dateCol
        ? '지난달 같은 기간 ' + sum.lastMonth + '건 ' + (diff === null ? '' : diffTag(diff))
          + (sum.lastMonthFull !== sum.lastMonth
              ? '<br>지난달 전체는 ' + sum.lastMonthFull + '건' : '')
        : '날짜 열이 없어 계산 못 함' },
    { lab:'🕘 최근 문의', val: sum.latest ? esc(sum.latest) : '—',
      sub: sum.dateCol ? '가장 마지막 기록' : '날짜 열이 없어 계산 못 함' }
  ].map(x => '<div class="stat"><div class="lab">' + x.lab + '</div>'
    + '<div class="val" style="font-size:23px">' + x.val + '</div>'
    + '<div class="sub">' + x.sub + '</div></div>').join('');

  // 분류별 집계 (상태·공종·유입 등을 자동으로 골라냅니다)
  const breakdown = sum.cats.length
    ? '<div class="hsec">📊 분류별</div><div class="mgrid">'
      + sum.cats.map(c => '<div class="mbox"><div class="mh">' + esc(c) + '</div>'
          + bars(countBy(shown, c), 'count') + '</div>').join('')
      + '</div>'
    : '';

  // 최근 문의 목록
  const recent = sum.dateCol
    ? shown.slice().sort((x, y) => dateNum(y[sum.dateCol]) - dateNum(x[sum.dateCol])).slice(0, 8)
    : shown.slice(0, 8);
  const recentList = '<div class="hsec">🕘 최근 문의</div><div class="mbox">'
    + (recent.length ? recent.map(r => {
        // 설명 열이 없으면 분류가 아닌 값들을 이어 붙여 보여줍니다
        let text = sum.textCol ? String(r[sum.textCol] || '').trim() : '';
        if(!text){
          const ownC = inquiryCache.ownCols || [];
          text = sum.cols
            .filter(c => c !== sum.dateCol && !sum.cats.includes(c)
                         && ownC.indexOf(c) < 0
                         && !['브랜드','brand','Brand','브랜드명'].includes(c))
            .map(c => String(r[c] || '').trim()).filter(Boolean).join(' · ');
        }
        // 처리상태·메모는 우리끼리 적은 것이라, 여기서도 바로 보이게 둡니다
        const st = String(r['처리상태'] || '').trim();
        const memo = String(r['메모'] || '').trim();
        const who  = String(r['담당자'] || '').trim();
        const stCls = st === '완료' ? ' on' : (st === '진행중' ? ' test' : (st ? '' : ''));
        return '<div class="krow" style="flex-direction:column;align-items:stretch;gap:4px">'
          + '<div style="white-space:normal;color:var(--text-primary)">'
            + (st ? '<span class="chip' + stCls + '" style="margin-right:6px">'
                    + esc(st) + '</span>' : '')
            + (sum.dateCol ? '<b>' + highlight(fmtYMD(r[sum.dateCol]), inquiryQuery) + '</b>'
                             + (text ? ' · ' : '') : '')
            + highlight(text.slice(0, 90), inquiryQuery)
          + '</div>'
          + (memo || who
              ? '<div class="fmeta" style="white-space:normal">'
                + (who ? '👤 ' + esc(who) + (memo ? ' · ' : '') : '')
                + (memo ? '📝 ' + esc(memo.slice(0, 120)) : '') + '</div>'
              : '')
          + (sum.cats.length
              ? '<div class="row" style="margin:0">' + sum.cats.slice(0, 4).map(c =>
                  r[c] ? '<span class="chip">' + esc(r[c]) + '</span>' : '').join('') + '</div>'
              : '')
          + '</div>';
      }).join('')
    : '<div class="fmeta">표시할 문의가 없습니다.</div>')
    + '</div>';

  // 전체 표 (접어둠)
  const cols = inquiryCache.columns.filter(c => !['브랜드','brand','Brand','브랜드명'].includes(c));
  // 우리끼리 쓰는 칸(처리상태·담당자·메모) 을 앞에, 시트 칸을 뒤에 둡니다
  const own  = inquiryCache.ownCols || [];
  const sheetCols = cols.filter(c => own.indexOf(c) < 0 && c[0] !== '_');
  const tcols = own.concat(sheetCols);

  const table = inquiryShowTable
    ? '<div class="fmeta" style="margin:10px 0 6px">'
      + '칸을 눌러 바로 고칠 수 있습니다. '
      + '<b>' + esc(own.join(' · ') || '(없음)') + '</b> 은 우리끼리 쓰는 칸이고, '
      + '나머지는 구글시트에서 온 값입니다 — 고치면 ✎ 표시가 붙고, '
      + '비우면 시트 값으로 되돌아갑니다.'
      + ' <button class="btn sm" onclick="editCols()">칸 고르기</button></div>'
    + '<div class="table-wrap"><table class="itable editable">'
      + '<tr>' + tcols.map(c => '<th' + (own.indexOf(c) >= 0 ? ' class="ownc"' : '') + '>'
          + esc(c) + '</th>').join('') + '</tr>'
      + shown.slice(0, 500).map(r => '<tr>'
          + tcols.map(c => cellHtml(r, c, own.indexOf(c) >= 0)).join('')
          + '</tr>').join('')
      + '</table></div>'
      + (shown.length > 500
          ? '<div class="fmeta" style="margin-top:8px">화면에는 500건까지만 표시합니다 '
            + '(찾기로 좁히면 그 안에서 고칠 수 있습니다)</div>' : '')
    : '';

  return bar
    + (q ? '<div class="fmeta" style="margin-bottom:10px">검색 결과 ' + shown.length + '건</div>' : '')
    + '<div class="stats">' + tiles + '</div>'
    + inquiryYearView(shown, sum.dateCol, sum, b, !!q)
    + breakdown
    + recentList
    + '<div class="hsec">📋 전체 목록'
      + '<button class="btn sm" style="margin-left:10px;font-weight:600" onclick="toggleInquiryTable()">'
      + (inquiryShowTable ? '접기' : '펼치기 (' + shown.length + '건)') + '</button></div>'
    + table
    + '<div class="fmeta" style="margin-top:12px">'
      + '고친 내용은 NAS 에 따로 보관되어, 시트를 다시 가져와도 지워지지 않습니다. '
      + '원본 구글시트는 그대로입니다.</div>';
}

/* ═══════════════ 회의록 ═══════════════════════════════════════════
   회의에서 나온 이야기를 그대로 적어두면, AI 가 읽고
   요약 · 결정사항 · 할 일로 정리해 줍니다.

   AI 를 부르는 건 NAS 입니다. 사무실 브라우저는 밖으로 못 나가고,
   키를 브라우저에 두면 대시보드를 여는 누구나 볼 수 있어서입니다.
   ================================================================= */
const aiState = { ready:null, busy:null, error:null };

async function aiCheck(){
  if(STORAGE_MODE !== 'nas') return;
  try{
    const r = await apiJson('ai.php?action=check');
    aiState.ready = !!(r && r['키등록됨']);
    aiState.info  = r;
  }catch(e){ aiState.ready = false; aiState.error = apiErrText(e); }
  render();
}

async function aiSetKey(){
  const v = prompt('Anthropic API 키를 넣어주세요.\n\n'
    + '· console.anthropic.com 에서 만든 「sk-ant-」 로 시작하는 키입니다.\n'
    + '· 키는 NAS 에만 저장되고, 화면으로 다시 보이지 않습니다.\n'
    + '· 비워두고 확인을 누르면 저장된 키를 지웁니다.', '');
  if(v === null) return;
  try{
    const res = await fetch('ai.php?action=setkey', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key: v.trim() })
    });
    const out = JSON.parse(await res.text());
    if(!out.ok) throw new Error(out.error || '저장하지 못했습니다');
    toast(out['키등록됨'] ? '✅ AI 키를 저장했습니다' : '키를 지웠습니다');
    await aiCheck();
  }catch(e){ showError('키를 저장하지 못했습니다.\n\n' + (e.message || e)); }
}

/* 회의 하나를 AI 에게 정리해 달라고 합니다 */
async function aiSummarize(id){
  const m = (data.meetings || []).find(x => x.id === id);
  if(!m) return;
  if(!String(m.body || '').trim()){ toast('⚠️ 회의 내용이 비어 있습니다'); return; }

  aiState.busy = id; aiState.error = null; render();
  try{
    const res = await fetch('ai.php?action=summarize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ notes: m.body, title: m.title || '', brand: m.brand || '' })
    });
    const out = JSON.parse(await res.text());
    if(!out.ok) throw new Error(out.error || '정리하지 못했습니다');

    m.ai = {
      요약: out['요약'] || '', 결정사항: out['결정사항'] || [],
      할일: out['할일'] || [], 다음회의: out['다음회의'] || '',
      확인필요: out['확인필요'] || [], 잘림: !!out['잘림'],
      만든때: new Date().toISOString()
    };
    m.updatedAt = new Date().toISOString();
    markDirty();
    toast('✅ 정리했습니다' + (out['잘림'] ? ' (내용이 길어 앞부분만 봤습니다)' : ''));
  }catch(e){
    aiState.error = e.message || String(e);
    showError('AI 정리에 실패했습니다.\n\n' + aiState.error);
  }finally{ aiState.busy = null; render(); }
}

/* AI 가 뽑아준 할 일을 「할 일」 탭으로 옮깁니다 */
function aiTodoToTask(mid, i){
  const m = (data.meetings || []).find(x => x.id === mid);
  const t = m && m.ai && m.ai.할일 && m.ai.할일[i];
  if(!t) return;
  // 회의에 브랜드가 적혀 있으면 그 브랜드의 할 일로, 없으면 첫 브랜드로
  const b = data.brands.find(x => x.name === m.brand) || data.brands[0];
  if(!b){ toast('⚠️ 브랜드가 없습니다'); return; }
  b.tasks.unshift({
    id: uid('i'), title: String(t['내용'] || '').slice(0, 120),
    status: '할일', due: /^\d{4}-\d{2}-\d{2}$/.test(String(t['기한'] || '')) ? t['기한'] : '',
    desc: '회의에서 나온 할 일 · ' + (m.title || '') + (t['담당'] ? ' · 담당 ' + t['담당'] : ''),
    updatedAt: new Date().toISOString()
  });
  m.ai.할일[i]._옮김 = true;
  markDirty(b.id);
  render();
  toast('✅ ' + b.name + ' 할 일로 옮겼습니다');
}

function viewMeetings(list){
  const keyBar = '<div class="sec-bar">'
    + '<button class="btn primary" onclick="openItemModal(\'meetings\')">＋ 회의 기록</button>'
    + (aiState.ready === false
        ? '<button class="btn" onclick="aiSetKey()">🔑 AI 키 넣기</button>'
          + '<span class="hint">키를 넣으면 회의 내용을 AI가 요약해 줍니다</span>'
        : '<button class="btn" onclick="aiSetKey()">🔑 AI 키 바꾸기</button>'
          + '<span class="hint">회의 내용을 적고 [AI로 정리] 를 누르면 '
          + '요약·결정사항·할 일로 나눠줍니다</span>')
    + '</div>';

  if(!list.length) return keyBar + '<div class="empty">' + TYPES.meetings.empty + '<br>'
    + '<span style="color:var(--text-muted)">들은 대로 편하게 적어두면 됩니다. '
    + '정리는 AI가 합니다.</span></div>';

  const sorted = list.slice().sort((x, y) =>
    String(y.date || y.updatedAt || '').localeCompare(String(x.date || x.updatedAt || '')));

  const cards = sorted.map(m => {
    const ai = m.ai;
    const busy = aiState.busy === m.id;
    return '<div class="mtbox">'
      + '<div class="mt-head">'
        + '<span class="mt-title">' + esc(m.title || '(제목 없음)') + '</span>'
        + (m.date ? '<span class="chip">' + esc(fmtYMD(m.date)) + '</span>' : '')
        + (m.brand ? '<span class="chip on">' + esc(m.brand) + '</span>' : '')
        + (m.attendees ? '<span class="fmeta">👥 ' + esc(m.attendees) + '</span>' : '')
        + '<span class="mt-act">'
          + '<button class="btn sm" onclick="openItemModal(\'meetings\',\'' + jsq(m.id) + '\')">수정</button>'
          + '<button class="btn sm danger" onclick="deleteItem(\'meetings\',\'' + jsq(m.id) + '\')">삭제</button>'
        + '</span></div>'

      + (ai ? aiPanel(m, ai) : '')

      + '<details class="mt-raw"' + (ai ? '' : ' open') + '>'
        + '<summary>회의 내용 원문' + (ai ? ' (접힘)' : '') + '</summary>'
        + '<div class="mt-body">' + esc(m.body || '(비어 있음)') + '</div>'
      + '</details>'

      + '<div class="mt-foot">'
        + '<button class="btn' + (ai ? '' : ' primary') + '" ' + (busy ? 'disabled' : '')
          + ' onclick="aiSummarize(\'' + jsq(m.id) + '\')">'
          + (busy ? '⏳ 정리하는 중… (10~30초)' : (ai ? '↻ 다시 정리' : '✨ AI로 정리')) + '</button>'
        + (ai && ai.만든때
            ? '<span class="fmeta">' + esc(sinceText(ai.만든때)) + ' 정리함</span>' : '')
      + '</div>'
      + '</div>';
  }).join('');

  return keyBar + cards;
}

/* ═══════════════ 달력 ═════════════════════════════════════════════
   우리 팀 일정(마감·발행·촬영 …)을 적어둡니다.
   하이웍스 휴가·결재는 아직 연결하지 않았습니다 (아래 안내 참고).
   ================================================================= */
let calYM = null;   // 보고 있는 달 { y, m }

function calNow(){
  if(!calYM){ const d = new Date(); calYM = { y: d.getFullYear(), m: d.getMonth() }; }
  return calYM;
}
function calMove(d){
  const c = calNow();
  const t = new Date(c.y, c.m + d, 1);
  calYM = { y: t.getFullYear(), m: t.getMonth() };
  render();
}
function calToday(){ calYM = null; render(); }


/* 일정 넣기 — 날짜·종류·브랜드를 창에서 직접 고릅니다.
   dateStr 을 주면 그 날짜가 미리 채워집니다 (빈 칸을 두 번 눌렀을 때).  */

  });

/* 달력에서 일정을 누르면 고치는 창이 열립니다 (날짜도 여기서 바꿉니다) */

}

/* 시작일 ~ 끝나는 날 사이의 날짜를 하루씩 돌려줍니다 (최대 400일) */
function eachDay(from, to){
  const out = [];
  if(!from) return out;
  if(!to || to < from) return [from];
  const d = new Date(from + 'T00:00:00');
  const end = new Date(to + 'T00:00:00');
  if(isNaN(d.getTime()) || isNaN(end.getTime())) return [from];
  for(let i = 0; i < 400 && d <= end; i++){
    out.push(todayStr(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function renderCalendar(){
  const c = calNow();
  const first = new Date(c.y, c.m, 1);
  const days  = new Date(c.y, c.m + 1, 0).getDate();
  const lead  = first.getDay();                       // 1일이 무슨 요일인지
  const todayS = todayStr();

  // 그 달의 일정을 날짜별로 모읍니다 (직접 넣은 일정 + 브랜드 할 일 기한)
  const byDay = {};
  const put = (d, o) => { (byDay[d] = byDay[d] || []).push(o); };
  (data.events || []).forEach(e => {
    if(!e.date) return;
    const span = eachDay(e.date, e.until);           // 며칠에 걸치면 매일 보이게
    span.forEach((d, i) => put(d, {
      id:e.id, t:e.title, kind:e.kind || '기타', brand:e.brand, own:true,
      memo:e.memo, from:e.date, to:e.until,
      part: span.length > 1 ? (i === 0 ? 'first' : (i === span.length - 1 ? 'last' : 'mid')) : ''
    }));
  });
  data.brands.forEach(b => (b.tasks || []).forEach(t => {
    if(t.due && t.status !== '완료') put(t.due, {
      id:t.id, t:t.title, kind:'할 일', brand:b.name, bid:b.id, own:false });
  }));

  const cells = [];
  for(let i = 0; i < lead; i++) cells.push('<div class="cal-c out"></div>');
  for(let d = 1; d <= days; d++){
    const ds = c.y + '-' + String(c.m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const list = byDay[ds] || [];
    const dow = new Date(c.y, c.m, d).getDay();
    cells.push('<div class="cal-c' + (ds === todayS ? ' today' : '')
      + (dow === 0 ? ' sun' : (dow === 6 ? ' sat' : '')) + '" '
      + 'ondblclick="addEvent(\'' + ds + '\')" title="빈 곳을 두 번 누르면 일정을 넣습니다">'
      + '<div class="cal-d">' + d + '</div>'
      + list.map(o => {
          const tip = (o.brand ? o.brand + ' · ' : '') + o.kind + ' · ' + o.t
            + (o.to && o.to !== o.from ? '\n' + fmtYMD(o.from) + ' ~ ' + fmtYMD(o.to) : '')
            + (o.memo ? '\n' + o.memo : '')
            + (o.own ? '\n(누르면 고칠 수 있습니다)' : '');
          return '<div class="cal-e' + (o.part ? ' p-' + o.part : '') + '" '
            + 'style="--ec:' + (EVENT_HUE[o.kind] || 'var(--text-muted)') + '" '
            + 'title="' + esc(tip) + '" '
            + (o.own ? 'onclick="editEvent(\'' + jsq(o.id) + '\')"'
                     : 'onclick="gotoResult(\'' + jsq(o.bid) + '\',\'tasks\')"') + '>'
            + '<span class="cal-dot"></span>'
            + (o.part === 'mid' || o.part === 'last' ? '<span class="cal-cont">…</span>' : '')
            + esc(o.t) + '</div>';
        }).join('')
      + '</div>');
  }
  while(cells.length % 7) cells.push('<div class="cal-c out"></div>');

  const legend = EVENT_KINDS.concat(['할 일']).map(k =>
    '<span class="vz-key"><span class="cal-dot" style="--ec:'
    + (EVENT_HUE[k] || 'var(--text-muted)') + '"></span>' + k + '</span>').join('');

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + '<h2 class="page-h">📅 달력</h2>'
    + '<div class="page-sub">마감·발행 같은 팀 일정을 날짜를 골라 넣습니다. '
      + '며칠에 걸치는 일정도 됩니다. 브랜드 할 일의 기한도 함께 보입니다</div>'
    + '<div class="sec-bar">'
      + '<button class="btn" onclick="calMove(-1)">‹ 이전 달</button>'
      + '<strong style="font-size:15px;min-width:120px;text-align:center">'
        + c.y + '년 ' + (c.m + 1) + '월</strong>'
      + '<button class="btn" onclick="calMove(1)">다음 달 ›</button>'
      + '<button class="btn" onclick="calToday()">오늘</button>'
      + '<button class="btn primary" onclick="addEvent(\'' + todayS + '\')">＋ 일정 넣기</button>'
      + '<span class="hint">빈 칸을 두 번 누르면 그 날짜로 넣습니다 · '
        + '일정을 누르면 날짜까지 고칠 수 있습니다</span>'
    + '</div>'
    + '<div class="vz-legend" style="margin-bottom:10px">' + legend + '</div>'
    + '<div class="cal">'
      + ['일','월','화','수','목','금','토'].map((w, i) =>
          '<div class="cal-h' + (i === 0 ? ' sun' : (i === 6 ? ' sat' : '')) + '">' + w + '</div>').join('')
      + cells.join('')
    + '</div>'
    + '<div class="ainote" style="margin-top:14px">'
      + '🔗 <b>하이웍스 휴가·전자결재는 아직 연결하지 않았습니다.</b> '
      + '읽어오기만 하면 하이웍스 쪽은 아무것도 바뀌지 않아 안전한데, '
      + '캘린더를 읽는 방법(API 또는 ICS 주소)을 아직 확인하지 못했습니다.'
      + '</div>'
    + '</div></div>';
}

/* ---------- 기록부 문서를 대시보드 디자인으로 다시 그립니다 ----------
   문서의 원래 색과 글꼴은 쓰지 않고, 글의 뼈대(제목·문단·목록·표)만
   가져와 이 화면 스타일로 보여줍니다. 원본은 [새 탭에서 보기] 로 볼 수 있습니다.
   ------------------------------------------------------------------ */
function recordUrl(rec){
  return rec.filePath
    ? 'files.php?action=view&path=' + encodeURIComponent(rec.filePath)
    : 'files.php?action=view&id='   + encodeURIComponent(rec.id);
}

const recordCache = {};      // 문서 id → {loading} | {error} | {title, secs}
const secOpen     = {};      // 섹션 번호 → 펼침 여부
let   allSecOpen  = false;   // 처음엔 접어둡니다

function toggleAllSections(){
  allSecOpen = !allSecOpen;
  Object.keys(secOpen).forEach(k => { delete secOpen[k]; });
  render();
}
function toggleSection(i){
  secOpen[i] = (secOpen[i] !== undefined) ? !secOpen[i] : !allSecOpen;
  render();
}

/* 남길 태그와 속성만 남기고 나머지는 버립니다 (색·글꼴·스크립트 제거) */
const DOC_OK_TAGS = ['P','UL','OL','LI','STRONG','B','EM','I','CODE','PRE','BLOCKQUOTE',
  'HR','TABLE','THEAD','TBODY','TR','TH','TD','BR','A','IMG','SMALL','MARK','H4','H5','DL','DT','DD'];

function cleanNode(node, out){
  node.childNodes.forEach(n => {
    if(n.nodeType === 3){ out.push(esc(n.nodeValue)); return; }
    if(n.nodeType !== 1) return;
    const tag = n.tagName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'LINK' || tag === 'NOSCRIPT') return;

    if(DOC_OK_TAGS.indexOf(tag) < 0){          // 모르는 태그는 껍데기만 벗기고 속은 살립니다
      out.push(' ');                            // 붙어버리지 않게 사이를 띄웁니다
      cleanNode(n, out);
      out.push(' ');
      return;
    }
    if(tag === 'BR' || tag === 'HR'){ out.push('<' + tag.toLowerCase() + '>'); return; }
    if(tag === 'IMG'){
      const src = n.getAttribute('src') || '';
      if(/^(https?:|data:image\/)/i.test(src))
        out.push('<img src="' + esc(src) + '" alt="' + esc(n.getAttribute('alt') || '') + '">');
      return;
    }
    let open = '<' + tag.toLowerCase();
    if(tag === 'A'){
      const href = n.getAttribute('href') || '';
      if(/^(https?:|mailto:|#)/i.test(href))
        open += ' href="' + esc(href) + '" target="_blank" rel="noopener"';
    }
    if(tag === 'TD' || tag === 'TH'){
      ['colspan','rowspan'].forEach(a => {
        const v = n.getAttribute(a);
        if(v && /^\d+$/.test(v)) open += ' ' + a + '="' + v + '"';
      });
    }
    out.push(open + '>');
    cleanNode(n, out);
    out.push('</' + tag.toLowerCase() + '>');
  });
}

/* 문서를 h2 기준으로 잘라 섹션 목록을 만듭니다 */
function parseRecordDoc(text){
  const doc  = new DOMParser().parseFromString(text, 'text/html');
  doc.querySelectorAll('script,style,link,noscript,nav,[class*="toc"]').forEach(e => e.remove());

  const title = (doc.title || doc.querySelector('h1')?.textContent || '브랜드 기록부').trim();
  const body  = doc.body || doc.documentElement;

  const secs = [];
  let cur = null;
  const walk = (parent) => {
    Array.from(parent.children).forEach(el => {
      const t = el.tagName;
      if(t === 'H1'){ return; }
      if(t === 'H2'){
        cur = { title: el.textContent.trim(), subs: [], parts: [], lead: '' };
        secs.push(cur);
        return;
      }
      if(t === 'H3'){
        if(!cur){ cur = { title:'', subs:[], parts:[], lead:'' }; secs.push(cur); }
        const s = el.textContent.trim();
        cur.subs.push(s);
        cur.parts.push('<h4 class="doc-h3">' + esc(s) + '</h4>');
        return;
      }
      // 감싸고만 있는 상자는 안으로 들어갑니다
      if((t === 'DIV' || t === 'SECTION' || t === 'ARTICLE' || t === 'MAIN' || t === 'HEADER')
         && el.querySelector('h2, h3')){ walk(el); return; }

      if(!el.textContent.trim() && !el.querySelector('img,hr')) return;
      if(!cur){ cur = { title:'', subs:[], parts:[], lead:'' }; secs.push(cur); }
      cur.parts.push(wrapEl(el));
      if(!cur.lead && t === 'P'){
        const txt = el.textContent.replace(/\s+/g, ' ').trim();
        if(txt.length > 12) cur.lead = txt;
      }
    });
  };
  const wrapEl = (el) => {
    const o = [];
    cleanNode(el, o);
    const inner = o.join('').replace(/[ \t]{2,}/g, ' ').replace(/> </g, '><');
    const t = el.tagName.toLowerCase();
    if(t === 'p')  return '<p>' + inner + '</p>';
    if(t === 'ul' || t === 'ol') return '<' + t + '>' + inner + '</' + t + '>';
    if(t === 'table') return '<div class="doc-tw"><table>' + inner + '</table></div>';
    if(t === 'blockquote') return '<blockquote>' + inner + '</blockquote>';
    if(t === 'hr') return '<hr>';
    return '<div class="doc-p">' + inner + '</div>';
  };
  walk(body);

  return { title: title, secs: secs.filter(x => x.parts.length || x.title) };
}

async function loadRecord(rec){
  const id = rec.id;
  recordCache[id] = { loading:true };
  try{
    const res  = await fetch(recordUrl(rec), { cache:'no-store' });
    const text = await res.text();
    if(/^\s*\{/.test(text)){
      const j = JSON.parse(text);
      throw new Error(j.error || '문서를 불러오지 못했습니다');
    }
    recordCache[id] = parseRecordDoc(text);
  }catch(e){
    recordCache[id] = { error: e.message || String(e) };
  }
  render();
}

function recordView(rec){
  const c = recordCache[rec.id];
  if(!c){ setTimeout(() => loadRecord(rec), 10); return '<div class="fmeta">문서를 불러오는 중…</div>'; }
  if(c.loading) return '<div class="fmeta">문서를 불러오는 중…</div>';
  if(c.error)   return '<div class="empty">⚠️ ' + esc(c.error) + '</div>';
  if(!c.secs.length) return '<div class="empty">문서에서 읽을 내용을 찾지 못했습니다.</div>';

  const cut = (t, n) => t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;

  const body = c.secs.map((sc, i) => {
    const open  = (secOpen[i] !== undefined) ? secOpen[i] : allSecOpen;
    const title = sc.title || '들어가며';

    return '<div class="jsec' + (open ? ' on' : '') + '" id="dsec' + i + '">'
      + '<div class="jdot">' + (i + 1) + '</div>'
      + '<button class="jhead" onclick="toggleSection(' + i + ')">'
        + '<div class="jh-top">'
          + '<span class="jh-title">' + esc(title) + '</span>'
          + '<span class="jh-ar">' + (open ? '접기 ▾' : '펼치기 ▸') + '</span>'
        + '</div>'
        + (sc.lead && !open
            ? '<div class="jh-lead">' + esc(cut(sc.lead, 120)) + '</div>' : '')
        + (sc.subs.length && !open
            ? '<div class="jh-subs">' + sc.subs.map(x =>
                '<span class="jh-sub">' + esc(x) + '</span>').join('') + '</div>'
            : '')
      + '</button>'
      + (open ? '<div class="doc-body">' + sc.parts.join('') + '</div>' : '')
      + '</div>';
  }).join('');

  return '<div class="doc-title">' + esc(c.title) + '</div>'
    + '<div class="fmeta" style="margin:-8px 0 16px">'
      + c.secs.length + '단계 · 제목을 누르면 그 대목이 펼쳐집니다</div>'
    + '<div class="jtl">' + body + '</div>';
}

function jumpSection(i){
  if(secOpen[i] === false) delete secOpen[i];
  if(!allSecOpen) secOpen[i] = true;
  render();
  const el = document.getElementById('dsec' + i);
  if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function pickRecord(){
  if(STORAGE_MODE !== 'nas'){
    alert('문서 올리기는 NAS 주소로 접속했을 때만 됩니다.\n\n'
      + 'http://192.168.0.37/brand/brand.html 로 열어주세요.');
    return;
  }
  const el = document.getElementById('recInput');
  if(el) el.click();
}

async function uploadRecord(file){
  if(!file) return;
  const b = currentBrand();
  if(!b) return;
  toast('📄 문서를 올리는 중…');
  try{
    const fd = new FormData();
    fd.append('brand', b.name);
    fd.append('sub', '기록부');
    fd.append('file', file);
    const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
    const text = await res.text();
    let out = null;
    try{ out = JSON.parse(text); }catch(e){}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
      + text.slice(0, 200).replace(/\s+/g, ' '));
    if(!out.ok) throw new Error(out.error || '업로드 실패');

    b.record = { id: out.fileId, name: out.fileName, size: out.fileSize,
                 filePath: out.filePath || '', at: new Date().toISOString() };
    // 자료 탭에서도 내려받을 수 있게 함께 넣어둡니다
    b.assets.unshift({ id: uid('i'), title: out.fileName.replace(/\.[^.]+$/, ''),
      kind: '기록부', url: '', note: '브랜드 기록부 문서',
      fileId: out.fileId, fileName: out.fileName, filePath: out.filePath || '',
      fileSize: out.fileSize, at: new Date().toISOString() });
    delete recordCache[out.fileId];
    await saveAll(true);          // 서버가 바로 찾을 수 있게 먼저 저장합니다
    render();
    toast('✅ 기록부 문서를 올렸습니다');
  }catch(e){
    alert('문서를 올리지 못했습니다.\n\n' + (e.message || e));
  }
}

function removeRecord(){
  const b = currentBrand();
  if(!b || !b.record) return;
  if(!confirm('이 브랜드의 기록부 문서를 목록에서 내릴까요?\n\n'
    + 'NAS의 실제 파일은 자료 폴더에 그대로 남습니다.')) return;
  b.record = null;
  markDirty();
  render();
}

function moveBrand(id, dir){
  const i = data.brands.findIndex(b => b.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= data.brands.length) return;
  [data.brands[i], data.brands[j]] = [data.brands[j], data.brands[i]];
  render(); markDirtyAll();          // 목록 순서가 바뀌었습니다
}

function moveHistory(id, dir){
  const b = currentBrand();
  const i = b.history.findIndex(x => x.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= b.history.length) return;
  [b.history[i], b.history[j]] = [b.history[j], b.history[i]];
  render(); markDirty();
}

/* ═══════════════ 브랜드북 ════════════════════════════════════════
   철학·스토리처럼 「이 브랜드가 무엇인가」 를 적어두는 곳입니다.
   다 적고 [✨ 마스터프롬프트 만들기] 를 누르면 AI 가 이 내용으로
   마스터프롬프트를 써 줍니다. 브랜드북이 원본, 프롬프트가 결과물입니다.
   ================================================================= */
const BOOK_SECTIONS = [
  { key:'why',     icon:'🎯', label:'왜 만들었나 (철학)',
    ph:'이 브랜드가 세상에 왜 있어야 하는지. 창업자가 풀고 싶었던 문제.' },
  { key:'story',   icon:'📖', label:'스토리',
    ph:'어떻게 시작했고 무슨 일이 있었는지. 사람들이 기억할 이야기.' },
  { key:'who',     icon:'👤', label:'누구를 위한 것인가',
    ph:'핵심 고객은 누구인지. 그 사람이 겪는 어려움과 바라는 것.' },
  { key:'what',    icon:'📦', label:'무엇을 파는가',
    ph:'제품·서비스를 한 문단으로. 어떻게 다른지.' },
  { key:'value',   icon:'💎', label:'약속 (핵심 가치)',
    ph:'고객에게 반드시 지키는 것 3가지쯤.' },
  { key:'tone',    icon:'🗣️', label:'말투 (톤앤매너)',
    ph:'어떤 말투로 이야기하는지. 쓰는 말 / 쓰지 않는 말.' },
  { key:'words',   icon:'✍️', label:'자주 쓰는 표현',
    ph:'브랜드가 늘 쓰는 문구·단어. 반대로 절대 안 쓰는 표현.' },
  { key:'rival',   icon:'⚔️', label:'경쟁사와 다른 점',
    ph:'비슷해 보이는 곳들과 무엇이 다른지.' },
  { key:'nogo',    icon:'🚫', label:'하지 않는 것',
    ph:'돈이 돼도 하지 않는 것. 브랜드가 지키는 선.' }
];

function bookOf(b){ if(!b.book || typeof b.book !== 'object') b.book = {}; return b.book; }
function bookFilled(b){ const k = bookOf(b);
  return BOOK_SECTIONS.filter(s => String(k[s.key] || '').trim()).length; }

function onBookInput(key, v){
  const b = currentBrand(); if(!b) return;
  bookOf(b)[key] = v;
  b.bookUpdatedAt = new Date().toISOString();
  const c = document.getElementById('bookCount');
  if(c) c.textContent = bookChars(b).toLocaleString('ko-KR') + '자 · '
      + bookFilled(b) + '/' + BOOK_SECTIONS.length + '칸';
  // 다시 그리지 않고 칸 표시만 바꿉니다 (글 치는 중에 화면이 흔들리지 않게)
  const box = document.getElementById('bk_' + key);
  if(box && box.parentElement) box.parentElement.classList.toggle('on', !!String(v).trim());
  const pb = document.querySelector('.pwrap .bar-row .bf');
  if(pb) pb.style.width = Math.round(bookFilled(b) / BOOK_SECTIONS.length * 100) + '%';
  markDirty(b.id);
}
function bookChars(b){ const k = bookOf(b);
  return BOOK_SECTIONS.reduce((a, s) => a + String(k[s.key] || '').length, 0); }

/* 브랜드북을 AI 에게 줄 하나의 글로 묶습니다 */
function bookAsText(b){
  const k = bookOf(b);
  const parts = ['브랜드 이름: ' + (b.name || ''),
                 b.desc ? '한 줄 소개: ' + b.desc : ''];
  BOOK_SECTIONS.forEach(s => {
    const v = String(k[s.key] || '').trim();
    if(v) parts.push('[' + s.label + ']\n' + v);
  });
  return parts.filter(Boolean).join('\n\n');
}

async function bookToPrompt(){
  const b = currentBrand(); if(!b) return;
  if(bookFilled(b) < 2){
    alert('브랜드북을 조금 더 채워주세요.\n\n'
      + '적어도 2칸은 있어야 AI 가 쓸 거리가 생깁니다.\n'
      + '「왜 만들었나」 와 「누구를 위한 것인가」 부터 적어보세요.');
    return;
  }
  if(b.masterPrompt && b.masterPrompt.trim()){
    if(!confirm('지금 마스터프롬프트에 적힌 내용이 있습니다.\n\n'
      + 'AI 가 새로 쓴 것으로 바꿀까요?\n'
      + '(바꿔도 Ctrl+Z 로 되돌릴 수 있습니다)')) return;
  }
  aiState.busy = 'book:' + b.id; render();
  try{
    const out = await apiJson('ai.php?action=prompt', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ brand: b.name, book: bookAsText(b) })
    });
    b.masterPrompt = String(out['프롬프트'] || '').trim();
    b.promptUpdatedAt = new Date().toISOString();
    b.promptFrom = '브랜드북 · ' + new Date().toISOString();
    markDirty(b.id);
    currentTab = 'prompt';
    render();
    toast('✨ 브랜드북으로 마스터프롬프트를 만들었습니다');
  }catch(e){
    alert('만들지 못했습니다.\n\n' + apiErrText(e));
  }finally{ aiState.busy = null; render(); }
}

function viewBook(b){
  const k = bookOf(b);
  const filled = bookFilled(b);
  const busy = aiState.busy === 'book:' + b.id;
  const pct = Math.round(filled / BOOK_SECTIONS.length * 100);

  const bar = '<div class="sec-bar">'
    + '<button class="btn primary" ' + (busy ? 'disabled' : '')
      + ' onclick="bookToPrompt()">'
      + (busy ? '⏳ 만드는 중… (10~30초)' : '✨ 이 내용으로 마스터프롬프트 만들기') + '</button>'
    + (aiState.ready === false
        ? '<button class="btn" onclick="aiSetKey()">🔑 AI 키 넣기</button>' : '')
    + '<span class="hint">브랜드북이 원본입니다. 여기를 채우면 AI 가 '
      + '마스터프롬프트를 대신 써 줍니다</span>'
    + '</div>';

  const prog = '<div class="bar-row" style="margin:4px 0 16px">'
    + '<span class="bl">채운 정도</span>'
    + '<span class="bt"><span class="bf" style="width:' + pct + '%"></span></span>'
    + '<span class="bv" id="bookCount">' + bookChars(b).toLocaleString('ko-KR') + '자 · '
      + filled + '/' + BOOK_SECTIONS.length + '칸</span></div>';

  const secs = BOOK_SECTIONS.map(s => {
    const v = k[s.key] || '';
    return '<div class="bsec' + (String(v).trim() ? ' on' : '') + '">'
      + '<label for="bk_' + s.key + '"><span class="bem">' + s.icon + '</span>'
        + esc(s.label) + '</label>'
      + '<textarea id="bk_' + s.key + '" placeholder="' + esc(s.ph) + '" '
        + 'oninput="onBookInput(\'' + s.key + '\', this.value)">' + esc(v) + '</textarea>'
      + '</div>';
  }).join('');

  return '<div class="pwrap">' + bar + prog
    + '<div class="booklist">' + secs + '</div>'
    + '<div class="pmeta" style="margin-top:14px">'
      + (b.bookUpdatedAt
          ? '마지막 수정 ' + esc(new Date(b.bookUpdatedAt)
              .toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' }))
          : '아직 작성 전')
      + '<span style="margin-left:auto">비워둔 칸은 AI 에게 넘기지 않습니다</span>'
    + '</div></div>';
}

function viewPrompt(b){
  const p = b.masterPrompt || '';
  return '<div class="pwrap">'
    + '<div class="sec-bar">'
      + '<button class="btn primary" onclick="copyPrompt()">📋 복사</button>'
      + '<button class="btn" onclick="selectTab(\'book\')">📕 브랜드북 열기</button>'
      + (bookFilled(b) >= 2
          ? '<button class="btn" onclick="bookToPrompt()">✨ 브랜드북으로 다시 만들기</button>' : '')

    + '</div>'
    + '<textarea class="prompt" id="promptBox" oninput="onPromptInput(this.value)" '

      + esc(p) + '</textarea>'
    + '<div class="pmeta">'
      + '<span id="promptCount">' + p.length.toLocaleString('ko-KR') + '자</span>'

      + (b.promptUpdatedAt
          ? '<span>· 마지막 수정 ' + esc(new Date(b.promptUpdatedAt)
              .toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' })) + '</span>'
          : '<span>· 아직 작성 전</span>')
      + '<span style="margin-left:auto">수정 후 상단 [💾 저장]을 눌러야 보관됩니다</span>'
    + '</div></div>';

/* ========================= 검색 ========================= */
/* 상단 검색에서 NAS 파일도 함께 찾습니다 (조금 늦게 도착해 아래에 붙습니다) */
const nasSearchState = { q:'', busy:false, res:null, error:null };
let nasSearchTimer = null;

function scheduleNasSearch(q){
  clearTimeout(nasSearchTimer);
  if(STORAGE_MODE !== 'nas' || q.length < 2){
    nasSearchState.res = null; nasSearchState.q = ''; return;
  }
  if(nasSearchState.q === q) return;                 // 이미 찾아둔 말
  nasSearchTimer = setTimeout(async () => {
    nasSearchState.q = q; nasSearchState.busy = true; nasSearchState.error = null;
    paintNasSearch();
    try{
      nasSearchState.res = await apiJson('nasfiles.php?action=findin&limit=40&q='
        + encodeURIComponent(q));
    }catch(e){ nasSearchState.error = apiErrText(e); nasSearchState.res = null; }
    finally{ nasSearchState.busy = false; paintNasSearch(); }
  }, 450);                                            // 타이핑이 멈추면 찾습니다
}

function paintNasSearch(){
  const box = document.getElementById('nasSearchBox');
  if(!box) return;
  if(nasSearchState.busy){ box.innerHTML = '<div class="fmeta">NAS 파일을 찾는 중…</div>'; return; }
  if(nasSearchState.error){
    box.innerHTML = '<div class="fmeta">NAS 파일은 찾지 못했습니다 — '
      + esc(nasSearchState.error.split('\n')[0]) + '</div>';
    return;
  }
  const r = nasSearchState.res;
  if(!r || !r.hits || !r.hits.length){
    box.innerHTML = r ? '<div class="fmeta">NAS 폴더에서는 찾지 못했습니다</div>' : '';
    return;
  }
  box.innerHTML = '<div class="hsec">📁 NAS 파일 ' + r['찾은수'].toLocaleString('ko-KR') + '건'
    + (r['더있음'] ? ' <span class="fmeta">(앞의 ' + r['보여준수'] + '건만 표시)</span>' : '')
    + (r['중간에멈춤'] ? ' <span class="fmeta">· 파일이 많아 도중에 멈췄습니다 — '
        + 'scan.sh 를 작업 스케줄러에 걸어두면 즉시 찾습니다</span>' : '')
    + '</div><div class="flist">' + r.hits.map(nasHitRow).join('') + '</div>';
}

function renderSearch(){
  const q = searchQuery.trim().toLowerCase();
  const groups = [];
  scheduleNasSearch(searchQuery.trim());

  data.brands.forEach(b => {
    const hits = [];
    ITEM_KEYS.forEach(type => {
      b[type].forEach(it => {
        const hay = [it.title, it.desc, it.note, it.body, it.tool, it.kind, it.tag, it.url,
                     it.why, it.result, it.next, it.owner, it.status]
          .filter(Boolean).join(' ').toLowerCase();
        if(hay.includes(q)) hits.push({ type, it });
      });
    });
    if((b.masterPrompt || '').toLowerCase().includes(q)){
      hits.push({ type:'prompt', it:{ title:'마스터프롬프트', body:b.masterPrompt } });
    }
    if(hits.length) groups.push({ b, hits });
  });

  const total = groups.reduce((a, g) => a + g.hits.length, 0);
  const main = document.getElementById('main');

  if(!total){
    main.innerHTML = '<div class="panel"><div class="tabbody">'
      + '<div class="empty">대시보드에 등록된 것 중에는 "' + esc(searchQuery)
      + '" 이(가) 없습니다.</div>'
      + '<div id="nasSearchBox"></div></div></div>';
    paintNasSearch();
    return;
  }

  main.innerHTML = '<div class="panel"><div class="tabbody">'
    + '<div class="sec-bar"><strong>검색 결과 ' + total + '건</strong>'
    + '<span class="hint">항목을 클릭하면 해당 브랜드로 이동합니다</span>'
    + '<button class="btn sm" style="margin-left:auto" onclick="clearSearch()">검색 해제</button></div>'
    + groups.map(g => '<div class="sr-group">'
        + '<div class="sr-head"><span>' + esc(g.b.icon) + '</span>' + esc(g.b.name)
        + '<span class="chip">' + g.hits.length + '</span></div>'
        + g.hits.map(h => {
            const tabKey = h.type === 'prompt' ? 'prompt' : h.type;
            const label = h.type === 'prompt' ? '✨ 마스터프롬프트'
                        : TYPES[h.type].icon + ' ' + TYPES[h.type].label;
            const ctx = (h.it.desc || h.it.note || h.it.body || h.it.result || '').slice(0, 140);
            return '<div class="sr-item" onclick="gotoResult(\'' + g.b.id + '\',\'' + tabKey + '\')">'
              + '<div class="t">' + highlight(h.it.title, searchQuery) + '</div>'
              + '<div class="c">' + label + (ctx ? ' · ' + highlight(ctx, searchQuery) : '') + '</div>'
              + '</div>';
          }).join('')
        + '</div>').join('')
    + '<div id="nasSearchBox"></div>'
    + '</div></div>';
  paintNasSearch();
}

function onSearch(v){ searchQuery = v; render(); }
function clearSearch(){
  searchQuery = '';
  document.getElementById('search').value = '';
  render();
}
function gotoResult(brandId, tab){
  clearSearch();
  view = 'brand';
  currentBrandId = brandId;
  currentTab = tab;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ========================= 브랜드 ========================= */
function selectBrand(id){
  clearSearchQuietly();
  view = 'brand';
  currentBrandId = id;
  currentTab = 'inquiries';   // 브랜드를 고르면 문의부터 보여줍니다
  cellEdit = null; chartCell = null;
  render();
}
function clearSearchQuietly(){
  if(searchQuery){ searchQuery = ''; document.getElementById('search').value = ''; }
}
function selectTab(t){ currentTab = t; cellEdit = null; chartCell = null; render(); }

let editingBrandId = null;
function openBrandModal(id){
  editingBrandId = id || null;
  const b = id ? brandById(id) : null;
  document.getElementById('brandModalTitle').textContent = b ? '브랜드 수정' : '브랜드 추가';
  document.getElementById('bName').value  = b ? b.name : '';
  document.getElementById('bIcon').value  = b ? (b.icon || '') : '';
  document.getElementById('bOwner').value = b ? (b.owner || '') : '';
  document.getElementById('bDesc').value  = b ? (b.desc || '') : '';
  document.getElementById('bColor').value = b ? b.color : '#3b82f6';
  document.getElementById('brandModal').classList.add('open');
}

function submitBrand(){
  const name = document.getElementById('bName').value.trim();
  if(!name){ toast('⚠️ 브랜드명을 입력해 주세요'); return; }
  const payload = {
    name,
    icon:  document.getElementById('bIcon').value.trim() || '🏷️',
    owner: document.getElementById('bOwner').value.trim(),
    desc:  document.getElementById('bDesc').value.trim(),
    color: document.getElementById('bColor').value
  };
  let added = false;
  if(editingBrandId && !brandById(editingBrandId)){
    closeModal('brandModal');
    toast('⚠️ 그 사이 다른 분이 이 브랜드를 지웠습니다');
    editingBrandId = null;
    render();
    return;
  }
  if(editingBrandId){
    Object.assign(brandById(editingBrandId), payload);
  }else{
    const b = Object.assign(newBrand(name, payload.icon, payload.color, payload.desc), payload);
    data.brands.push(b);
    view = 'brand';
    currentBrandId = b.id;
    currentTab = 'inquiries';
    added = true;
  }
  closeModal('brandModal');
  render();
  if(added) markDirtyAll();          // 브랜드가 새로 생겼습니다
  else markDirty(editingBrandId);
}

function deleteBrand(id){
  const b = brandById(id);
  if(!b){ render(); return; }           // 이미 다른 분이 지웠습니다
  const n = ITEM_KEYS.reduce((a, k) => a + b[k].length, 0);
  if(!confirm('"' + b.name + '" 브랜드를 삭제할까요?\n\n안에 있는 ' + n + '개 항목과 마스터프롬프트도 함께 사라집니다.')) return;
  data.brands = data.brands.filter(x => x.id !== id);
  if(currentBrandId === id) currentBrandId = data.brands.length ? data.brands[0].id : null;
  render(); markDirtyAll();          // 브랜드가 사라졌습니다
  toast('🗑️ 브랜드를 삭제했습니다');
}

/* ========================= 항목 (자동화·히스토리·자료) ========================= */
let itemType = null;

/* 이 종류의 항목이 어디에 담겨 있는지.
   회의록·달력 일정은 브랜드 밖(팀 전체)에 있습니다. */
function listOf(type){
  if(TOP_LISTS.indexOf(type) >= 0){
    if(!Array.isArray(data[type])) data[type] = [];
    return data[type];
  }
  const b = currentBrand();
  return b ? b[type] : null;
}

function openItemModal(type, id, preset){
  const arr = listOf(type);
  if(!arr) return;
  itemType = type;
  const t = TYPES[type];
  const it = id ? arr.find(x => x.id === id) : null;
  editing = it ? { type, id } : null;

  document.getElementById('itemModalTitle').textContent =
    t.label + (it ? ' 수정' : ' 추가');

  document.getElementById('itemFields').innerHTML = t.fields.map(f => {
    // 값을 정하는 순서: 고치는 항목 → 눌러서 넘겨준 값(preset) → 기본값
    let v = it ? (it[f.key] || '') : '';
    if(!it && preset && preset[f.key] != null) v = preset[f.key];
    else if(!it && !v && f.type === 'date' && !f.noDefault) v = todayStr();

    const lab = '<label>' + f.label + (f.required ? ' *' : '') + '</label>';
    if(f.type === 'select'){
      let opts = typeof f.options === 'function' ? f.options() : f.options;
      // 지금 값이 목록에 없으면(브랜드 이름이 바뀌었다든지) 그 값도 넣어 둡니다.
      // 안 그러면 창을 열었다 저장하는 것만으로 값이 조용히 바뀝니다.
      if(v && opts.indexOf(v) < 0) opts = [v].concat(opts);
      return lab + '<select id="f_' + f.key + '">'
        + opts.map(o => '<option' + (o === v ? ' selected' : '') + ' value="' + esc(o) + '">'
            + (o === '' ? '— 없음 —' : esc(o)) + '</option>').join('')
        + '</select>';
    }
    if(f.type === 'textarea'){
      return lab + '<textarea id="f_' + f.key + '" placeholder="' + esc(f.ph || '') + '">'
        + esc(v) + '</textarea>';
    }
    return lab + '<input type="' + (f.type === 'date' ? 'date' : 'text') + '" id="f_' + f.key + '" '
      + 'value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">';
  }).join('');

  // 지우기 단추는 고칠 때만 보입니다
  const del = document.getElementById('itemDelBtn');
  if(del){
    del.style.display = it ? '' : 'none';
    del.onclick = () => { closeModal('itemModal'); deleteItem(type, id); };
  }

  document.getElementById('itemModal').classList.add('open');
  // 새로 넣는 경우엔 첫 칸에 바로 쓸 수 있게 해 둡니다
  if(!it){
    const first = document.querySelector('#itemFields input,#itemFields textarea');
    if(first) first.focus();
  }
}

function submitItem(){
  const arr = listOf(itemType);
  if(!arr) return;
  const t = TYPES[itemType];
  const payload = {};
  for(const f of t.fields){
    const v = document.getElementById('f_' + f.key).value.trim();
    if(f.required && !v){ toast('⚠️ ' + f.label + '을(를) 입력해 주세요'); return; }
    payload[f.key] = v;
  }
  // 끝나는 날이 시작보다 앞이면 잘못 고른 것입니다
  if(payload.until && payload.date && payload.until < payload.date){
    toast('⚠️ 끝나는 날이 시작하는 날보다 앞입니다');
    return;
  }
  const target = editing ? arr.find(x => x.id === editing.id) : null;
  if(editing && !target){
    // 내가 수정창을 열어둔 사이에 다른 분이 이 항목을 지웠습니다.
    // 쓴 내용이 사라지지 않게 새 항목으로 넣어드립니다.
    arr.unshift(Object.assign({ id: uid('i'),
      updatedAt: new Date().toISOString() }, payload));
    editing = null;
    closeModal('itemModal');
    render(); markDirty();
    toast('다른 분이 이 항목을 지워서, 새 항목으로 넣었습니다');
    return;
  }
  if(editing){
    Object.assign(target, payload, { updatedAt: new Date().toISOString() });
  }else{
    const item = Object.assign({ id: uid('i'), updatedAt: new Date().toISOString() }, payload);
    // 여정은 시간 순으로 읽어야 하므로 아래에 쌓고, 나머지는 최신이 위로 옵니다
    if(itemType === 'history') arr.push(item);
    else arr.unshift(item);
  }
  editing = null;
  closeModal('itemModal');
  render(); markDirty();
}

function deleteItem(type, id){
  const arr = listOf(type);
  if(!arr) return;
  const it = arr.find(x => x.id === id);
  if(!it){ render(); return; }          // 이미 다른 분이 지웠습니다
  if(!confirm('"' + it.title + '" 항목을 삭제할까요?')) return;
  const left = arr.filter(x => x.id !== id);
  if(TOP_LISTS.indexOf(type) >= 0) data[type] = left;
  else currentBrand()[type] = left;
  deletedIds.add(id);
  render(); markDirty();
  toast('🗑️ 삭제했습니다');
}

function onPromptInput(v){

  b.masterPrompt = v;

let uploadReport = [];
function clearReport(){ uploadReport = []; render(); bindDrop(); }

function bindDrop(){
  if(STORAGE_MODE !== 'nas') return;

  const inp = document.getElementById('fileInput');
  if(inp && !inp._bound){
    inp._bound = true;
    inp.addEventListener('change', () => {
      const picked = Array.from(inp.files);   // 목록을 먼저 복사한 뒤
      inp.value = '';                          // 입력칸을 비웁니다 (같은 파일 재선택 가능)
      if(picked.length) uploadFiles(picked);
    });
  }

  const z = document.getElementById('dropZone');
  if(!z) return;
  ['dragenter','dragover'].forEach(ev => z.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); z.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => z.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); z.classList.remove('over');
  }));
  z.addEventListener('drop', e => {
    if(e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });
}

async function uploadFiles(fileList){
  const b = currentBrand();
  if(!b) return;
  const files = Array.from(fileList);
  if(!files.length) return;

  // 자료 탭이 아닌 곳에서 올릴 수도 있어 없으면 그냥 넘어갑니다.
  // (예전에는 여기서 멈춰서, 파일이 조용히 안 올라갔습니다)
  const q = document.getElementById('upQueue');
  if(q) q.innerHTML = files.map((f, i) =>
    '<div class="upitem" id="up_' + i + '">'
    + '<span class="fileicon">' + fileIcon(f.name) + '</span>'
    + '<span class="nm">' + esc(f.name) + '</span>'
    + '<span class="fmeta">' + fmtSize(f.size) + '</span>'
    + '<span class="st" id="upst_' + i + '">올리는 중…</span></div>'
  ).join('');

  const report = [];
  let added = 0;
  for(let i = 0; i < files.length; i++){
    const st = document.getElementById('upst_' + i);
    try{
      const fd = new FormData();
      fd.append('brand', b.name);        // NAS에 브랜드 이름 폴더로 정리해서 저장합니다
      fd.append('sub', '자료');
      fd.append('file', files[i]);
      const res = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try { out = JSON.parse(text); } catch(e) {}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '업로드 실패');

      b.assets.unshift({
        id: uid('i'),
        title: files[i].name.replace(/\.[^.]+$/, ''),
        kind: '기타',
        url: '',
        note: '',
        fileId: out.fileId,
        fileName: out.fileName,
        filePath: out.filePath || '',
        fileSize: out.fileSize,
        uploadedAt: new Date().toISOString()
      });
      added++;
      report.push({ name: files[i].name, size: files[i].size, ok: true });
      if(st){ st.textContent = '완료'; st.className = 'st ok'; }
    }catch(e){
      report.push({ name: files[i].name, size: files[i].size, ok: false, error: e.message });
      if(st){ st.textContent = '실패'; st.className = 'st err'; }
    }
  }

  uploadReport = report;
  if(added){
    markDirty(b.id);
    await saveAll(true);          // 파일은 이미 NAS 에 있으므로 목록도 바로 저장합니다
  }
  render();
  bindDrop();

  const failed = report.length - added;
  if(added && !failed) toast('✅ ' + added + '개 파일을 NAS에 올렸습니다');
  else if(added && failed) toast('⚠️ ' + added + '개 성공, ' + failed + '개 실패');
  else toast('⚠️ 업로드에 실패했습니다. 아래 사유를 확인해 주세요');
}

async function deleteAsset(id){
  const b = currentBrand();
  const it = b.assets.find(x => x.id === id);
  const warn = it.fileId
    ? '"' + it.title + '" 자료와 NAS에 올린 파일을 함께 삭제합니다.\n되돌릴 수 없습니다. 계속할까요?'
    : '"' + it.title + '" 항목을 삭제할까요?';
  if(!confirm(warn)) return;

  if(it.fileId){
    try{
      const res = await fetch('files.php?action=delete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ fileId: it.fileId })
      });
      const out = await res.json();
      if(!out.ok) throw new Error(out.error || '파일 삭제 실패');
    }catch(e){
      showError('NAS 파일을 지우지 못했습니다: ' + e.message);
      return;                    // 목록만 지워서 파일이 남는 상황을 막습니다
    }
  }
  b.assets = b.assets.filter(x => x.id !== id);
  render(); bindDrop();
  if(it.fileId) await saveAll(true); else markDirty();
  toast('🗑️ 삭제했습니다');
}

async function copyPath(type, id){

async function copyPrompt(){
