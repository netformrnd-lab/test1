/* 표의 줄 이름 — 여러 항목에 같은 이름으로 흩어져 있습니다.
   하나를 고치면 그 줄 전부를 같이 고쳐야 줄이 안 쪼개집니다. */
function obRowRename(sid, row, nm){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const t = String(nm || '').trim(); if(!t || t === row) return;
  (sc.items || []).forEach(it => (it.kids || []).forEach(k => {
    if(String(k.title || '').trim() === row) k.title = t;
  }));
  obMark(); render();
}
/* 조직도 맨 아래 층(낱낱) 하나 더 — 낱낱은 본문을 「·」 로 나눈 것이라
   자리가 따로 없습니다. 본문 끝에 한 칸 붙이고 바로 칸을 엽니다.
   하위(주체)가 없는 갈래면 갈래 본문에 붙입니다. */
function obLeafAdd(sid, iid, kid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = (sc.items || []).find(x => x.id === iid); if(!it) return;
  const tgt = kid ? (it.kids || []).find(x => x.id === kid) : it;
  if(!tgt) return;
  const cur = String(tgt.body || '').trim();
  tgt.body = cur ? cur + ' · 새 이름' : '새 이름';
  obMark(); render();
  setTimeout(() => {
    const el = document.querySelector('[data-ed="' + (kid ? 'obkid' : 'obit')
      + '"][data-i="' + it.id + '"]' + (kid ? '[data-k="' + kid + '"]' : '')
      + '[data-f="body"]');
    if(el) edStart(el);
  }, 60);
}
/* 그 해에 줄 하나 (팀 · 사람 · 브랜드 무엇이든) */
function obRowAdd(sid, iid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = (sc.items || []).find(x => x.id === iid); if(!it) return;
  if(!Array.isArray(it.kids)) it.kids = [];
  it.kids.push({ id: uid('ok'), title: '', own: '', body: '' });
  obMark(); render();
  setTimeout(() => {
    const l = document.querySelectorAll('[data-ed="obkid"][data-i="' + it.id + '"]');
    if(l.length) edStart(l[l.length - 2] || l[l.length - 1]);
  }, 60);
}
/* 해 한 칸을 통째로 (그 해의 줄까지) */
function obYearDel(sid, iid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = (sc.items || []).find(x => x.id === iid); if(!it) return;
  const nm = String(it.title || '').trim() || '이 해';
  const kn = (it.kids || []).length;
  if(!confirm('「' + nm + '」 을 지웁니다' + (kn ? ' — 그 해의 줄 ' + kn + '개까지' : '')
    + '.\n\n되돌릴 수 없습니다.')) return;
  sc.items = (sc.items || []).filter(x => x.id !== iid);
  obMark(); render();
}
/* 이 단에 이미 있는 해들 · 그 다음 해 */
function obYears(sc){
  const have = [];
  const put = t => { const y = obYearOf(t); if(y && have.indexOf(y) < 0) have.push(y); };
  (sc.items || []).forEach(it => {
    put(it.title);                                   // 해가 항목일 때
    (it.kids || []).forEach(k => put(k.title));      // 해가 하위일 때
  });
  return have.sort();
}
/* 다음에 넣을 해 — <<지나온 쪽>>으로 갑니다.
   내년을 기본값으로 두었습니다. 그런데 이건 계획표가 아니라 기록입니다.
   채워야 할 것은 아직 안 적은 <<지난 해>>이지 아직 오지 않은 해가
   아닙니다. 올해가 비었으면 올해, 올해가 있으면 제일 이른 해의 바로
   앞 해를 내놓습니다 (2026 만 있으면 2025 → 2024 → …). */
function obNextYear(sc){
  const have = obYears(sc).map(Number).filter(x => x);
  const now = new Date().getFullYear();
  if(!have.length) return String(now);
  if(have.indexOf(now) < 0 && now > Math.max.apply(null, have)) return String(now);
  return String(Math.min.apply(null, have) - 1);
}
/* 해를 더합니다. 어느 해인지 넘겨받으면 묻지 않습니다 —
   브라우저 팝업은 화면 밖에서 튀어나와서 뜬금없습니다. */
function obYearAdd(sid, year){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const its = sc.items.filter(it => String(it.title || '').trim());
  if(!its.length){ toast('먼저 항목(팀)을 넣어 주세요'); return; }
  let y = String(year || '').trim();
  if(!y){
    const box = document.getElementById('obYearIn');
    y = box ? String(box.value || '').trim() : '';
  }
  if(!y) y = obNextYear(sc);
  if(!/^\d{4}$/.test(obYearOf(y) || '')){
    toast('네 자리 해로 적어 주세요 — 예) 2027'); return;
  }
  const nm = obIsYear(y) ? obYearOf(y) : y;
  /* 해가 항목인 단 — 빈 해 한 칸을 만듭니다. 줄은 그 해에 맞게
     사람이 넣습니다 (해마다 팀도 사람도 다르니까요). */
  if(obYearRows(sc)){
    if(sc.items.some(it => String(it.title || '').trim() === nm)){
      toast('「' + nm + '」 은 이미 있습니다'); return;
    }
    sc.items.push({ id: uid('oi'), title: nm, body: '', kids: [] });
    obMark(); render();
    toast('📅 ' + nm + ' 을 넣었습니다 — 그 해의 줄을 넣어 주세요');
    return;
  }
  let n = 0;
  its.forEach(it => {
    if(!Array.isArray(it.kids)) it.kids = [];
    if(it.kids.some(k => String(k.title || '').trim() === nm)) return;
    it.kids.push({ id: uid('ok'), title: nm, body:'' }); n++;
  });
  if(!n){ toast('「' + nm + '」 은 이미 있습니다'); return; }
  obMark(); render();
  toast('📅 ' + nm + ' 을 항목 ' + n + '개에 넣었습니다');
}
/* 지금 적혀 있는 하위를 해 한 줄 밑으로 접어 넣습니다 —
   「팀 → 사람」 으로 적어 둔 것을 「팀 → 해 → 그 해에 한 일」 로 바꿉니다 */
function obToYears(sid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const its = sc.items.filter(it => String(it.title || '').trim());
  if(!its.length) return;
  const y0 = obYearOf(sc.title) || String(new Date().getFullYear());
  const y = (prompt('지금 적혀 있는 것을 어느 해의 것으로 볼까요?\n\n'
    + '항목(팀)마다 하위가 그 해 한 줄 밑으로 접힙니다.\n'
    + '예) 전략마케팅팀 → ' + y0 + ' → 「소라님 — 기존 브랜드 정리 …」\n\n'
    + '이 뒤로는 [📅 해 추가] 로 해마다 한 줄씩 늘리면 됩니다.', y0) || '').trim();
  if(!y) return;
  const nm = obIsYear(y) ? obYearOf(y) : y;
  let n = 0;
  its.forEach(it => {
    const ks = (it.kids || []).filter(k => String(k.title || '').trim()
      || String(k.body || '').trim());
    if(ks.some(k => obIsYear(k.title))) return;          // 이미 해로 적혀 있음
    const txt = ks.map(k => {
      const t = String(k.title || '').trim(), b = String(k.body || '').trim();
      return t && b ? t + ' — ' + b : (t || b);
    }).filter(Boolean).join('\n')
      || String(it.body || '').trim();
    if(!txt) return;
    ks.forEach(k => { if(k.id) deletedIds.add(k.id); });
    it.kids = [{ id: uid('ok'), title: nm, body: txt }];
    if(!ks.length) it.body = '';
    n++;
  });
  if(!n){ toast('바꿀 것이 없습니다 — 이미 해마다로 적혀 있습니다'); return; }
  sc.view = 'matrix';
  obMark(); render();
  toast('📅 항목 ' + n + '개를 ' + nm + ' 밑으로 접었습니다');
}

function obSecAdd(){
  obOf().push({ id: uid('os'), icon:'📌', title:'새 단', note:'', items:[] });
  obMark(); render();
}
function obSecSet(sid, f, v, draw){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  sc[f] = v; markDirtyAll();
  if(draw){ render(); return; }
}
function obSecDel(sid){

  if(!confirm('"' + (sc.title || '(이름 없음)') + '" 단을 지울까요?\n\n'
    + '안에 적은 것도 같이 갑니다.\n휴지통으로 갑니다 — 되돌릴 수 있습니다.')) return;
  trashPut('온보딩 단', sc.title || '(이름 없음)', sc,
           { kind:'item', type:'onboard', brandId:'' });

  deletedIds.add(sid);

function obSecMove(sid, d){
  const l = obOf(), i = l.findIndex(x => x.id === sid);
  if(i < 0) return;
  const j = i + d; if(j < 0 || j >= l.length) return;
  const t = l[i]; l[i] = l[j]; l[j] = t;
  obMark(); render();
}
function obItAdd(sid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  sc.items.push({ id: uid('oi'), title:'', body:'', kids:[] });
  obMark(); render();
}
function obItSet(sid, iid, f, v){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = sc.items.find(x => x.id === iid); if(!it) return;
  it[f] = v; markDirtyAll();
}
function obItDel(sid, iid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  sc.items = sc.items.filter(x => x.id !== iid);
  obMark(); render();
}
function obKidAdd(sid, iid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = sc.items.find(x => x.id === iid); if(!it) return;
  it.kids.push({ id: uid('ok'), title:'', own:'', body:'' });
  obMark(); render();
}
function obKidSet(sid, iid, kid, f, v){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = sc.items.find(x => x.id === iid); if(!it) return;
  const k = it.kids.find(x => x.id === kid); if(!k) return;
  k[f] = v; markDirtyAll();
}
function obKidDel(sid, iid, kid){
  const sc = obOf().find(x => x.id === sid); if(!sc) return;
  const it = sc.items.find(x => x.id === iid); if(!it) return;
  it.kids = it.kids.filter(x => x.id !== kid);
  obMark(); render();
}

         한 줄로 모읍니다. 한 칸씩 세로로 떨어뜨리면 여백만 커지고
         목록이라는 것도 안 보입니다. */
      const kidsRead = () => {
        const out = []; let run = [];
        const flush = () => {
          if(!run.length) return;
          out.push('<div class="ob-chips">'
            /* 칩도 <<자료>> 입니다 — 눌러서 못 고치면 이름 하나 고치려고

          flush();
          out.push('<div class="ob-k">'
            + (t ? '<b data-ed="obkid" data-g="' + esc(sc.id) + '" data-i="' + esc(it.id)
                 + '" data-k="' + esc(k.id) + '" data-f="title">' + esc(t) + '</b>' : '')
            + '<span data-ed="obkid" data-g="' + esc(sc.id) + '" data-i="' + esc(it.id)

        });
        flush();

          ? '<div class="ob-k ed' + (obIsYear(k.title) ? ' yr' : '') + '">'

              + 'oninput="obKidSet(\'' + sid + '\',\'' + iid + '\',\'' + kid + '\',\'title\', this.value)">'
            + '<textarea rows="1" placeholder="내용 (줄을 바꾸면 줄마다 점이 찍힙니다)" '
              + 'oninput="gbGrow(this);obKidSet(\'' + sid + '\',\'' + iid + '\',\'' + kid + '\',\'body\', this.value)">'

            + '<button class="x" title="이 줄을 지웁니다" '
              + 'onclick="obKidDel(\'' + sid + '\',\'' + iid + '\',\'' + kid
              + '\')">✕</button></div>'
          : '';
      }).join('') : kidsRead();

      return obEdit
        ? '<div class="ob-it ed">'
          + '<div class="ih">'
            + '<span class="no">항목 '
              + '①②③④⑤⑥⑦⑧⑨⑩'.charAt(Math.min(sc.items.indexOf(it), 9)) + '</span>'
            + '<input class="it" value="' + esc(it.title) + '" placeholder="항목 이름" '
              + 'oninput="obItSet(\'' + sid + '\',\'' + iid + '\',\'title\', this.value)">'
            + '<button class="x" title="이 항목을 지웁니다" '
              + 'onclick="obItDel(\'' + sid + '\',\'' + iid + '\')">🗑</button>'
          + '</div>'
          + '<textarea class="bd" rows="1" placeholder="이 항목이 무엇인지 (선택)" '
            + 'oninput="gbGrow(this);obItSet(\'' + sid + '\',\'' + iid + '\',\'body\', this.value)">'
            + esc(it.body) + '</textarea>'
          + '<div class="ob-ks">'
            + '<div class="kh">하위 ' + (it.kids || []).length + '</div>'
            + kids
            + '<button class="add" onclick="obKidAdd(\'' + sid + '\',\'' + iid
              + '\')">＋ 하위 넣기</button>'
          + '</div>'
          + '</div>'
        /* 읽기 — 둥근 상자를 걷어내고 글자 크기와 선으로만 층을 만듭니다.
           상자에 담으면 전부 같은 무게로 보여 무엇이 중요한지 안 보입니다. */
        : '<article class="ob-en">'
          + '<div class="en-h"><span class="en-no">항목 '
            + '①②③④⑤⑥⑦⑧⑨⑩'.charAt(Math.min(sc.items.indexOf(it), 9))
            + '</span>'
            + '<h4 data-ed="obit" data-g="' + esc(sc.id) + '" data-i="' + esc(it.id)
              + '" data-f="title">' + esc(it.title) + '</h4></div>'
          + (String(it.body || '').trim()
              ? '<p class="lead" data-ed="obit" data-g="' + esc(sc.id) + '" data-i="'
                + esc(it.id) + '" data-f="body" data-ml="1">' + esc(it.body) + '</p>'
              : (kids ? '' : '<p class="lead dim" data-ed="obit" data-g="' + esc(sc.id)
                  + '" data-i="' + esc(it.id) + '" data-f="body" data-ml="1">'
                  + '✏️ 눌러서 적기</p>'))
          + (kids ? '<div class="ob-ks">' + kids + '</div>' : '')
          + '<div class="en-a">'
            + '<button class="gb-add tiny" onclick="obKidAdd(\'' + jsq(sc.id) + '\',\''
              + jsq(it.id) + '\')">＋ 하위 넣기</button>'
            + '<button class="gb-add tiny del" onclick="obItDel(\'' + jsq(sc.id) + '\',\''
              + jsq(it.id) + '\')">🗑 이 항목</button>'
          + '</div>'
          + '</article>';
    }).join('');

    /* 잡지처럼 두 단 — 왼쪽 기둥에 번호·이름·한 줄, 오른쪽에 본문이 흐릅니다.
       상자를 걷어내고 글자 크기와 얇은 선으로만 층을 만듭니다. */
    /* 번호 · 제목 · 한 줄이 위에 서고, 항목은 가는 줄로 나뉜 격자에 깔립니다.
       칸마다 테두리를 두르면 상자가 겹쳐 지저분합니다 — 1px 틈으로만 가릅니다. */
    if(!obEdit){
      const vw = obView(sc);
      let bodyHtml = '';

      /* 🌳 조직도 — 단 → 항목 → 하위 → 하위 본문의 낱말, 네 층 */
      if(vw === 'tree' && sc.items.length){
        /* 마디마다 눌러서 고칩니다 — [고치기] 로 옮겨 가면 조직도가
           통째로 딴 화면이 되어 「어디가 어디였는지」 를 다시 찾아야 합니다.
           틀은 그대로 두고 그 위에서 고치는 것이 맞습니다. */
        const sid3 = jsq(sc.id);
        const edA = (ed, it, k, f, ml) => ' data-ed="' + ed + '" data-g="' + esc(sc.id)
          + '" data-i="' + esc(it.id) + '"'
          + (k ? ' data-k="' + esc(k.id) + '"' : '')
          + ' data-f="' + f + '"' + (ml ? ' data-ml="1"' : '');
        /* ＋ 는 <<무엇을>> 더하는지 적어 둡니다. 그냥 ＋ 만 있으면
           층마다 뭐가 생기는지 눌러 봐야 압니다. */
        const plus = (lb, fn) => '<li class="pl"><button class="nd add" onclick="'
          + fn + '">＋ ' + lb + '</button></li>';
        const leafUl = (it, k) => {
          const ls = obLeaves(k.body);
          return '<ul>'
            + (ls.length
                /* 낱낱은 한 칸(하위 본문)을 「·」 로 나눈 것입니다. 어느
                   낱말을 눌러도 그 칸이 열려야 합니다 — 첫 낱말에만 귀를
                   달아 두어서 둘째부터는 눌러도 아무 일이 없었습니다. */
                ? ls.map(x => '<li><span class="nd leaf"'
                    + edA('obkid', it, k, 'body', 1) + '>' + esc(x) + '</span></li>').join('')
                : '')
            + plus('낱낱', 'obLeafAdd(\'' + sid3 + '\',\'' + jsq(it.id)
                + '\',\'' + jsq(k.id) + '\')')
          + '</ul>';
        };
        const kidUl = it => {
          const ks = (it.kids || []).filter(k => String(k.title || '').trim());
          const add = plus('주체',
            'obKidAdd(\'' + sid3 + '\',\'' + jsq(it.id) + '\')');
          if(ks.length) return '<ul>' + ks.map(k => '<li><span class="nd lv3"'
            + edA('obkid', it, k, 'title') + '>'
            + esc(k.title) + '</span>' + leafUl(it, k) + '</li>').join('') + add + '</ul>';
          /* 하위 이름이 없으면 항목 본문의 낱말이 바로 아래 층입니다 */
          const ls = obLeaves(it.body);
          return '<ul>' + (ls.length
            ? ls.map(x => '<li><span class="nd leaf"'
                + edA('obit', it, null, 'body', 1) + '>' + esc(x) + '</span></li>').join('')
            : '')
            + plus('낱낱', 'obLeafAdd(\'' + sid3 + '\',\'' + jsq(it.id) + '\',\'\')')
            + add + '</ul>';
        };
        const top = sc.items.filter(it => String(it.title || '').trim())
          .map(it => '<li><span class="nd lv2"' + edA('obit', it, null, 'title') + '>'
            + esc(it.title) + '</span>'
            + kidUl(it) + '</li>').join('')
          + plus('갈래', 'obItAdd(\'' + sid3 + '\')');
        /* 맨 위 이름을 적었을 때만 뿌리를 세웁니다. 안 적었는데 단 이름을
           그대로 쓰면 바로 아래 항목과 같은 말이 두 번 나옵니다. */
        const rootNm = String(sc.root || '').trim();
        bodyHtml = '<div class="ob-chartbox"><div class="ob-chart'
          + (rootNm ? '' : ' noroot') + '">'
          + (rootNm
              ? '<ul><li><span class="nd root" data-ed="obsec" data-g="' + esc(sc.id)
                + '" data-f="root">' + esc(rootNm) + '</span>'
                + '<ul>' + top + '</ul></li></ul>'
              : '<ul>' + top + '</ul>')
          + '</div>'
          + '<div class="ob-lg">'
            + (rootNm ? '<span><i class="lg root"></i>맨 위</span>' : '')
            + '<span><i class="lg lv2"></i>갈래</span>'
            + '<span><i class="lg lv3"></i>주체</span>'
            + '<span><i class="lg leaf"></i>낱낱</span>'
          + '</div></div>';
      }

      /* ▦ 표 — 항목이 세로줄, 하위 이름이 가로줄 */
      /* 🕰 해가 항목인 연표 — 해마다 그 해의 줄만. 해마다 팀 수도,
         나누는 기준(팀 · 사람 · 브랜드)도 다를 수 있습니다.
         생김새는 소개의 「해마다의 목표」 와 <<같은 것>>을 씁니다 —
         같은 것이 두 화면에서 다르게 생기면 다른 것으로 읽힙니다. */
      else if(vw === 'hist'){
        const ys = obYearRows(sc) || [];
        const now = String(new Date().getFullYear());
        const sid2 = jsq(sc.id);
        bodyHtml = '<div class="ob-yr">'
          + '<div class="hy-add">'
            + '<span class="lb">📅 해 넣기</span>'
            + '<input id="obYearIn" type="text" inputmode="numeric" maxlength="4" '
              + 'value="' + esc(obNextYear(sc)) + '" '
              + 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();'
              + 'obYearAdd(\'' + sid2 + '\')}">'
            + '<button class="btn sm primary" onclick="obYearAdd(\'' + sid2
              + '\')">＋ 넣기</button>'
            + '<span>지나온 해를 채워 넣으세요 — 그 해 한 칸이 생깁니다</span>'
          + '</div>'
          + '<div class="id-gs rail">' + ys.map(it => {
              const on = obYearOf(it.title) === now;
              const ks = (it.kids || []);
              const iid = jsq(it.id);
              return '<div class="id-g' + (on ? ' now' : '') + '">'
                + '<div class="gy">'
                  + '<span data-ed="obkid0" data-g="' + esc(sc.id)
                    + '" data-i="' + esc(it.id) + '" data-f="title" '
                    + 'title="눌러서 해를 고칩니다">' + esc(it.title) + '</span>'
                  + (on ? '<i>지금</i>' : '')
                + '</div>'
                + '<div class="gb">'
                  + ks.map(k => {
                      const kid = jsq(k.id);
                      const ed = f => ' data-ed="obkid" data-g="' + esc(sc.id)
                        + '" data-i="' + esc(it.id) + '" data-k="' + esc(k.id)
                        + '" data-f="' + f + '"' + (f === 'body' ? ' data-ml="1"' : '');
                      const v = String(k.body || '').trim();
                      /* 한 줄에 「누가 맡았나」 와 「그래서 뭘 하려 했나」 가
                         섞여 있었습니다. 둘은 다른 것입니다 — 맡은 것은
                         한눈에 훑는 표이고, 목표는 읽는 글입니다. 갈라 둡니다.
                         맡은 것은 「·」 로 나눠 적으면 칩으로 섭니다. */
                      const own = String(k.own || '').trim();
                      const ows = own.split(/[·,\/]/).map(x => x.trim()).filter(Boolean);
                      return '<div class="gk">'
                        + '<i' + ed('title') + ' data-ph="누가 — 팀 · 사람">'
                          + esc(String(k.title || '').trim() || '＋ 이름을 적어 주세요')
                        + '</i>'
                        + '<button class="x" title="이 줄을 지웁니다" '
                          + 'onclick="obKidDel(\'' + sid2 + '\',\'' + iid
                          + '\',\'' + kid + '\')">×</button>'
                        + '<div class="ow"><u>🏷 맡은 것</u>'
                          + (ows.length
                              ? '<span class="ch"' + ed('own')
                                + ' data-ph="맡은 브랜드 — 「·」 로 나눠 적으세요">'
                                + ows.map(x => '<b>' + esc(x) + '</b>').join('') + '</span>'
                              : '<span class="non"' + ed('own')
                                + ' data-ph="맡은 브랜드 — 「·」 로 나눠 적으세요">'
                                + '✏️ 눌러서 적기</span>')
                        + '</div>'
                        + '<div class="gl2"><u>🎯 그 해 목표</u>'
                          + (v
                              ? '<span' + ed('body') + '>'
                                + esc(v).replace(/\n/g, '<br>') + '</span>'
                              : '<span class="non"' + ed('body')
                                + ' data-ph="그 해에 무엇을 이루려 했나">✏️ 눌러서 적기</span>')
                        + '</div>'
                      + '</div>';
                    }).join('')
                  + '<div class="hy-ra"><button class="gb-add tiny" onclick="obRowAdd(\''
                    + sid2 + '\',\'' + iid + '\')">＋ 줄 넣기 (팀 · 사람 · 브랜드)</button>'
                    + '<button class="gb-add tiny del" onclick="obYearDel(\''
                      + sid2 + '\',\'' + iid + '\')">🗑 이 해 지우기</button>'
                  + '</div>'
                + '</div>'
              + '</div>';
            }).join('') + '</div>'
        + '</div>';
      }
      else if(vw === 'matrix'){
        const M = obMatrix(sc);
        /* 📜 해로 적힌 단은 표가 아니라 히스토리로 — 해가 위에서 아래로
           흐르고 그 밑에 팀마다 그 해에 한 일이 붙습니다. 표로 깔면
           해가 가로줄이 되어 「흐름」 이 안 보입니다. */
        if(M && M.yearly){
          const now = String(new Date().getFullYear());
          const addBar = '<div class="hy-flip">'
            + '<b>해마다 팀·사람이 달라지나요?</b>'
            + '<span>지금은 팀이 위에 있어서 모든 해가 같은 팀 목록을 씁니다. '
              + '해를 위로 올리면 해마다 다르게 넣을 수 있습니다.</span>'
            + '<button class="btn sm primary" onclick="obFlipYears(\''
              + jsq(sc.id) + '\')">🕰 해를 위로 올리기</button>'
          + '</div>'
          + '<div class="hy-add">'
            + '<span class="lb">📅 해 넣기</span>'
            + '<input id="obYearIn" type="text" inputmode="numeric" maxlength="4" '
              + 'value="' + esc(obNextYear(sc)) + '" '
              + 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();'
              + 'obYearAdd(\'' + jsq(sc.id) + '\')}">'
            + '<button class="btn sm primary" onclick="obYearAdd(\''
              + jsq(sc.id) + '\')">＋ 넣기</button>'
            + '<span>지나온 해를 채워 넣으세요 — 팀 ' + M.cols.length
              + '개에 그 해 한 줄이 한 번에 생깁니다</span>'
          + '</div>';
          /* 최근이 위로 오니 새 해를 넣는 자리도 위입니다 — 아래에 두면
             해가 쌓일수록 한참 내려가야 보입니다. */
          const sid3 = jsq(sc.id);
          bodyHtml = '<div class="ob-hist">' + addBar + M.rows.map(r => {
            const on = obYearOf(r) === now;
            return '<div class="hy' + (on ? ' now' : '') + '">'
              /* 해 이름도 고칠 수 있어야 합니다 — 2025 를 2024 로 잘못
                 적어 두면 지금은 그 줄을 지우고 다시 넣는 수밖에 없었습니다 */
              + '<div class="hy-h"><i class="dot"></i>'
                + '<b data-ed="obrow" data-g="' + esc(sc.id) + '" data-i="' + esc(r)
                  + '" data-ph="해 (예: 2025)">' + esc(r) + '</b>'
                + (on ? '<em>지금</em>' : '') + '</div>'
              + '<div class="hy-b">' + M.cols.map(it => {
                  const k = (it.kids || []).find(x =>
                    String(x.title || '').trim() === r);
                  const v = k ? String(k.body || '').trim() : '';
                  const ls = v.split('\n').map(x => x.trim()).filter(Boolean);
                  /* 두 번 누르면 그 자리에서 적습니다 — 팀마다 그 해에
                     무엇을 했는지는 고치기로 옮겨 가서 찾기엔 너무 잦습니다.
                     아직 안 적힌 칸도 눌러서 바로 채웁니다. */
                  const ed = k
                    ? ' data-ed="obkid" data-g="' + esc(sc.id)
                      + '" data-i="' + esc(it.id)
                      + '" data-k="' + esc(k.id) + '" data-f="body" data-ml="1"'
                      + ' data-ph="' + esc(it.title + ' 이 ' + r + ' 에 무엇을') + '"'
                      + ' title="눌러서 적습니다"'
                    : '';
                  return '<div class="hy-t' + (v ? '' : ' non') + '">'
                    /* 팀 · 사람 이름도 여기서 고칩니다 */
                    + '<b data-ed="obit" data-g="' + esc(sc.id) + '" data-i="'
                      + esc(it.id) + '" data-f="title" data-ph="팀 · 사람 이름">'
                      + esc(it.title) + '</b>'
                    + (v
                        ? (ls.length > 1
                            ? '<ul' + ed + '>' + ls.map(x => '<li>' + esc(x) + '</li>').join('')
                              + '</ul>'
                            : '<p' + ed + '>' + esc(v) + '</p>')
                        /* 그 해에 그 줄이 아직 없으면 <<만들면서>> 엽니다 */
                        : (k
                            ? '<p class="gap"' + ed + '>✏️ 눌러서 적기'
                              + '<span class="flag">아직 비어 있음</span></p>'
                            : '<button class="gap add" onclick="obCellAdd(\'' + sid3
                              + '\',\'' + jsq(it.id) + '\',\'' + jsq(r) + '\')">'
                              + '✏️ 눌러서 적기'
                              + '<span class="flag">아직 비어 있음</span></button>'))
                    + '</div>';
                }).join('') + '</div>'
            + '</div>';
          }).join('') + '</div>';
        }
        else if(M){
          const n = M.cols.length;
          const sid4 = jsq(sc.id);
          const cell = (it, r) => {
            const k = (it.kids || []).find(x => String(x.title || '').trim() === r);
            const v = k ? String(k.body || '').trim() : '';
            /* 하위가 아직 없는 칸은 <<만들면서>> 엽니다 — 「—」 로 막아
               두면 그 칸은 영영 못 채웁니다. */
            if(!k) return '<div class="mx"><button class="mx-non add" '
              + 'onclick="obCellAdd(\'' + sid4 + '\',\'' + jsq(it.id) + '\',\''
              + jsq(r) + '\')">✏️ 눌러서 적기</button></div>';
            const ed = ' data-ed="obkid" data-g="' + esc(sc.id) + '" data-i="'
                     + esc(it.id) + '" data-k="' + esc(k.id)
                     + '" data-f="body" data-ml="1"'
                     + ' data-ph="' + esc(it.title + ' 의 ' + r) + '"';
            if(!v) return '<div class="mx"><span class="mx-non"' + ed
              + '>✏️ 눌러서 적기</span></div>';
            const ls = v.split('\n').map(x => x.trim()).filter(Boolean);
            return '<div class="mx"' + ed + '>' + (ls.length > 1
              ? '<ul>' + ls.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
              : esc(v)) + '</div>';
          };
          bodyHtml = '<div class="ob-mxwrap"><div class="ob-matrix" style="'
            + '--n:' + n + '">'
            + '<div class="mx rowhead"></div>'
            + M.cols.map((it, ci) => '<div class="mx head ' + OB_TCS[ci % OB_TCS.length] + '">'
                + '<span class="tname" data-ed="obit" data-g="' + esc(sc.id)
                  + '" data-i="' + esc(it.id) + '" data-f="title">'
                  + esc(it.title) + '</span></div>').join('')
            /* 「목적」 줄도 비어 있으면 못 채우고 있었습니다 */
            + '<div class="mx rowhead">목적</div>'
              + M.cols.map((it, ci) => '<div class="mx ' + OB_TCS[ci % OB_TCS.length] + '">'
                  + (String(it.body || '').trim()
                      ? '<p class="mx-mission" data-ed="obit" data-g="' + esc(sc.id)
                        + '" data-i="' + esc(it.id) + '" data-f="body" data-ml="1">'
                        + esc(it.body) + '</p>'
                      : '<span class="mx-non" data-ed="obit" data-g="' + esc(sc.id)
                        + '" data-i="' + esc(it.id) + '" data-f="body" data-ml="1" '
                        + 'data-ph="이 항목이 무엇인지">✏️ 눌러서 적기</span>') + '</div>').join('')
            + M.rows.map(r => '<div class="mx rowhead'
                + (M.yearly ? ' yr' : '')
                + (M.yearly && obYearOf(r) === String(new Date().getFullYear())
                    ? ' now' : '') + '">'
                + '<span data-ed="obrow" data-g="' + esc(sc.id) + '" data-i="' + esc(r)
                  + '" data-ph="줄 이름">' + esc(r) + '</span></div>'
                + M.cols.map((it, ci) => cell(it, r).replace('class="mx"',
                    'class="mx ' + OB_TCS[ci % OB_TCS.length] + '"')).join('')).join('')
            + '</div></div>';
        }
      }

      if(!bodyHtml)
        bodyHtml = items ? '<div class="ob-grid">' + items + '</div>'
                         : '<p class="ob-emp">아직 비어 있습니다 — '
                           + '[✏️ 고치기] 에서 적어 주세요.</p>';

      return '<section class="ob-sec" id="obs-' + sid + '">'
        + '<div class="ob-sh rd">'
          + '<span class="sn">' + String(si + 1).padStart(2, '0') + '</span>'
          + '<div class="sh-b">'
            /* 단 이름과 한 줄 설명도 여기서 바로 고칩니다 — 이것만
               [고치기] 화면으로 넘어가야 하면 그 화면을 계속 쓰게 됩니다 */
            + '<h3>'
            + '<span data-ed="obsec" data-g="' + esc(sc.id) + '" data-f="icon" '
              + 'data-ph="그림 한 글자 (예: 🏢)">' + esc(sc.icon || '📌') + '</span> '
              + '<span data-ed="obsec" data-g="' + esc(sc.id) + '" data-f="title">'
              + esc(sc.title || '이름 없는 단') + '</span></h3>'
            + '<p data-ed="obsec" data-g="' + esc(sc.id) + '" data-f="note" '
              + 'data-ph="이 단이 무엇인지 (선택)">'
              + (sc.note ? esc(sc.note) : '✏️ 한 줄 설명') + '</p>'
          + '</div>'
        + '</div>'
        + bodyHtml
        + '</section>';
    }
    return '<section class="ob-sec ed" id="obs-' + sid + '">' + head
      + (items ? '<div class="ob-its ed">' + items + '</div>' : '')
      + '<button class="ob-addit" onclick="obItAdd(\'' + sid + '\')">＋ 항목 넣기</button>'
      + '</section>';
  }).join('');

  /* ── 🪧 머리말 ── */
  const H = obHead();
  const hero = obEdit
    ? '<div class="ob-hero ed">'
      + '<input class="hb" value="' + esc(H.eyebrow) + '" placeholder="윗줄 (예: 신입 온보딩 · 브랜드마케팅팀)" '
        + 'oninput="obHeadSet(\'eyebrow\', this.value)">'
      + '<textarea class="ht" rows="1" placeholder="한 문장 — 이 팀이 왜 있는지" '
        + 'oninput="gbGrow(this);obHeadSet(\'title\', this.value)">' + esc(H.title) + '</textarea>'
      + '<textarea class="hs" rows="1" placeholder="한 줄 더 (선택)" '
        + 'oninput="gbGrow(this);obHeadSet(\'sub\', this.value)">' + esc(H.sub) + '</textarea>'
      + '<div class="hst ed">'
        + H.stats.map(x => '<div class="hs-r">'
            + '<input class="v" value="' + esc(x.v) + '" placeholder="5" '
              + 'oninput="obStatSet(\'' + jsq(x.id) + '\',\'v\', this.value)">'
            + '<input class="k" value="' + esc(x.k) + '" placeholder="무엇의 수인지" '
              + 'oninput="obStatSet(\'' + jsq(x.id) + '\',\'k\', this.value)">'
            + '<button class="x" onclick="obStatDel(\'' + jsq(x.id) + '\')">✕</button>'
          + '</div>').join('')
        + '<button class="gb-add tiny" onclick="obStatAdd()">＋ 숫자</button>'
      + '</div></div>'
    : ((H.eyebrow || H.title || H.sub || H.stats.some(x => String(x.v || '').trim()))
        ? '<div class="ob-hero">'
          /* 머리말도 읽는 자리에서 바로 고칩니다 — 여기만 [고치기] 로
             넘어가야 하면 그 화면을 계속 쓰게 됩니다 */
          + (H.eyebrow ? '<p class="eyebrow" data-ed="obhead" data-f="eyebrow">'
              + esc(H.eyebrow) + '</p>' : '')
          + (H.title ? '<h1 data-ed="obhead" data-f="title" data-ml="1">'
              + esc(H.title) + '</h1>' : '')
          + (H.sub ? '<p class="sub" data-ed="obhead" data-f="sub" data-ml="1">'
              + esc(H.sub) + '</p>' : '')
          + (H.stats.some(x => String(x.v || '').trim())
              ? '<div class="hst">' + H.stats.filter(x => String(x.v || '').trim())
                  .map(x => '<div class="st">'
                    + '<span class="v" data-ed="obstat" data-i="' + esc(x.id)
                      + '" data-f="v" data-ph="숫자">' + esc(x.v) + '</span>'
                    + '<span class="k" data-ed="obstat" data-i="' + esc(x.id)
                      + '" data-f="k" data-ph="무엇의 수인지">' + esc(x.k)
                    + '</span></div>').join('')
                + '</div>' : '')
          + '</div>'
        : '');

  /* ── ✅ 배포 전에 채워야 할 것 — 스스로 셉니다 ── */
  const gaps = obEdit ? [] : obGaps();
  const gapBox = (!at && gaps.length)
    ? '<div class="ob-todo">'
      + '<p class="cap">아직 비어 있는 것</p>'
      + '<h3>채워야 할 ' + gaps.length + '가지</h3>'
      + '<ul>' + gaps.slice(0, 12).map(g => '<li><i class="box"></i>'
          + '<span><b>' + esc(g.t) + '</b><span class="loc">' + esc(g.l) + '</span></span></li>').join('')
        + (gaps.length > 12 ? '<li><i class="box"></i><span><b>외 '
            + (gaps.length - 12) + '가지</b></span></li>' : '')
      + '</ul></div>'
    : '';

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + '<h2 class="page-h">🧭 온보딩</h2>'
    + '<div class="page-sub">브랜드마케팅팀이 무슨 팀이고, 무엇을 맡고, 올해 무엇을 하는지</div>'
    + bar + hero + cards
    + '<div class="ob-wrap ob-body">' + body + '</div>'
    + gapBox
    + '</div></div>';
  setTimeout(() => {
    document.querySelectorAll('.ob-wrap textarea').forEach(gbGrow);
  }, 0);
}

/* ═══════════════ 📢 공지사항 ═══════════════════════════════════
   홈 맨 위에 둡니다. 팀이 제일 먼저 보는 자리라 여기가 아니면 안 읽습니다.
   📌 붙인 것이 위로 오고, 나머지는 새것부터.
   「안 읽음」 은 이 컴퓨터에만 남습니다 — 누가 읽었는지는 안 셉니다.
   ================================================================= */
function noticesOf(){
  if(!Array.isArray(data.notices)) data.notices = [];
  return data.notices;
}
/* 붙인 것 먼저, 그다음 새것부터 */
function noticeLine(){
  return noticesOf().slice().sort((a, b) => {
    if(!!b.pin !== !!a.pin) return b.pin ? 1 : -1;
    return String(b.at || '').localeCompare(String(a.at || ''));
  });
}
function noticeSeen(){
  try{ return localStorage.getItem('bh_noticeSeen') || ''; }catch(e){ return ''; }
}
function noticeMarkSeen(){
  const top = noticeLine()[0];
  if(!top) return;
  try{ localStorage.setItem('bh_noticeSeen', String(top.at || '')); }catch(e){}
}
function noticeNew(n){ return String(n.at || '') > noticeSeen(); }
function noticeNewCount(){ return noticesOf().filter(noticeNew).length; }

let noticeAt = '';        // 고치고 있는 공지 id ('new' 면 새로 쓰는 중)
let noticeAll = false;    // 지난 공지까지 펼쳐 보나

function noticeWrite(){ noticeAt = 'new'; render();
  setTimeout(() => { const el = document.getElementById('ntTitle'); if(el) el.focus(); }, 30); }
function noticeEdit(id){ noticeAt = id; render(); }
function noticeNo(){ noticeAt = ''; render(); }
function noticeMore(){ noticeAll = !noticeAll; render(); }

function noticeSave(){
  const t = (document.getElementById('ntTitle') || {}).value || '';
  const b = (document.getElementById('ntBody')  || {}).value || '';
  if(!t.trim()){ toast('⚠️ 공지 제목을 적어주세요'); return; }
  const pin = !!(document.getElementById('ntPin') || {}).checked;
  if(noticeAt === 'new'){
    noticesOf().unshift({ id: uid('nt'), title: t.trim(), body: b.trim(),
                          at: new Date().toISOString(), by: myName(), pin: pin });
    toast('📢 공지를 올렸습니다');
  }else{
    const n = noticesOf().find(x => x.id === noticeAt);
    if(!n){ noticeAt = ''; render(); return; }
    n.title = t.trim(); n.body = b.trim(); n.pin = pin;
    toast('✅ 공지를 고쳤습니다');
  }
  noticeAt = '';
  noticeMarkSeen();
  markDirtyAll(); render();
}
function noticePin(id){
  const n = noticesOf().find(x => x.id === id); if(!n) return;
  n.pin = !n.pin; markDirtyAll(); render();
  toast(n.pin ? '📌 맨 위에 붙였습니다' : '📌 붙인 것을 뗐습니다');
}
function noticeDel(id){
  const n = noticesOf().find(x => x.id === id); if(!n) return;
  if(!confirm('"' + (n.title || '(제목 없음)') + '" 공지를 지울까요?\n\n'
    + '휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 되돌릴 수 있습니다.')) return;
  trashPut('공지', n.title || '(제목 없음)', n, { kind:'item', type:'notices', brandId:'' });
  data.notices = noticesOf().filter(x => x.id !== id);
  deletedIds.add(id);
  markDirtyAll(); render();
  toast('🗑️ 휴지통으로 보냈습니다');
}

/* 홈 맨 위에 붙는 덩어리 */
const NOTICE_SHOW = 3;
function noticeHtml(){
  const line = noticeLine();
  const write = noticeAt === 'new' || noticeAt
    ? (function(){
        const n = noticeAt === 'new' ? { title:'', body:'', pin:false }
                                     : (noticesOf().find(x => x.id === noticeAt) || null);
        if(!n) return '';
        return '<div class="nt-w">'
          + '<input type="text" id="ntTitle" value="' + esc(n.title || '') + '" '
            + 'placeholder="공지 제목 — 예) 9월 마감 일정 안내">'
          + '<textarea id="ntBody" rows="3" placeholder="내용을 적어주세요 (선택)">'
            + esc(n.body || '') + '</textarea>'
          + '<div class="ft">'
            + '<label class="pn"><input type="checkbox" id="ntPin"'
              + (n.pin ? ' checked' : '') + '> 📌 맨 위에 붙이기</label>'
            + '<span style="margin-left:auto;display:flex;gap:6px">'
              + '<button class="btn sm" onclick="noticeNo()">취소</button>'
              + '<button class="btn sm primary" onclick="noticeSave()">'
                + (noticeAt === 'new' ? '올리기' : '고치기') + '</button>'
            + '</span></div></div>';
      })()
    : '';

  const shown = noticeAll ? line : line.slice(0, NOTICE_SHOW);
  const rows = shown.map(n => {
    const when = n.at ? new Date(n.at).toLocaleDateString('ko-KR',
      { year:'numeric', month:'numeric', day:'numeric' }) : '';
    return '<div class="nt-i' + (n.pin ? ' pin' : '') + (noticeNew(n) ? ' new' : '') + '">'
      + '<div class="hd">'
        + (n.pin ? '<span class="pi">📌</span>' : '')
        + '<b>' + (noticeNew(n) ? '<span class="newtag">NEW</span> ' : '') + esc(n.title) + '</b>'
        + '<span class="mt">' + esc(when) + (n.by ? ' · ' + esc(n.by) : '') + '</span>'
        + '<span class="ac">'
          + '<button class="btn sm" onclick="noticePin(\'' + jsq(n.id) + '\')" '
            + 'title="맨 위에 붙이거나 뗍니다">' + (n.pin ? '📌 뗌' : '📌 붙임') + '</button>'
          + '<button class="btn sm" onclick="noticeEdit(\'' + jsq(n.id) + '\')">고치기</button>'
          + '<button class="btn sm danger" onclick="noticeDel(\'' + jsq(n.id) + '\')">지우기</button>'
        + '</span>'
      + '</div>'
      + (String(n.body || '').trim() ? '<p>' + esc(n.body) + '</p>' : '')
      + '</div>';
  }).join('');

  const more = line.length > NOTICE_SHOW
    ? '<button class="nt-more" onclick="noticeMore()">'
      + (noticeAll ? '▲ 접기' : '▼ 지난 공지 ' + (line.length - NOTICE_SHOW) + '개 더')
      + '</button>'
    : '';

  return '<div class="nt">'
    + '<div class="nt-h"><span class="ti">📢 공지사항</span>'
      + (noticeNewCount() ? '<span class="chip new">새 공지 ' + noticeNewCount() + '</span>' : '')
      + '<span style="margin-left:auto;display:flex;gap:6px">'
        + (line.length ? '<button class="btn sm" onclick="noticeMarkSeen();render()">'
                         + '✓ 읽음</button>' : '')
        + (noticeAt === 'new' ? ''
            : '<button class="btn sm primary" onclick="noticeWrite()">＋ 공지 쓰기</button>')
      + '</span></div>'
    + write
    + (line.length ? rows + more
        : (noticeAt ? '' : '<div class="nt-none">아직 공지가 없습니다 — '
            + '팀이 제일 먼저 보는 자리입니다.</div>'))
    + '</div>';
}

function renderHome(){
  const bs = data.brands;
  const all = t => bs.reduce((a, b) => a + b[t].length, 0);
  const running = bs.reduce((a, b) =>
    a + b.automations.filter(x => x.status === '운영중').length, 0);
  const autoAll  = bs.reduce((a, b) => a + autoCount(b), 0);
  const toolAll  = bs.reduce((a, b) => a + ((b.tools || []).length), 0);
  const withPrompt = bs.filter(b => (b.masterPrompt || '').trim()).length;
  const files = bs.reduce((a, b) => a + b.assets.filter(x => x.fileId).length, 0);

  const openTasks = bs.reduce((a, b) => a + b.tasks.filter(t => t.status !== '완료').length, 0);
  const iqTotal = bs.reduce((a, b) => a + (inquiryCache.byBrand[b.name] || []).length, 0);
  const iqMonth = bs.reduce((a, b) => { const s = inquiryStats(b.name); return a + (s ? s.thisMonth : 0); }, 0);
  const stats = [
    { lab:'📮 문의', val: iqTotal.toLocaleString('ko-KR'),
      sub: iqTotal ? '건 · 이번 달 ' + iqMonth + '건' : '건 · 시트를 연결하면 표시됩니다' },
    { lab:'💳 한 달 비용',
      val: won(bs.reduce((a, b) => a + (b.costs || []).reduce((x, c) => x + costPerMonth(c), 0), 0))
             .replace('원',''),
      sub: '원 · 올해 ' + won(bs.reduce((a, b) =>
             a + (b.costs || []).reduce((x, c) => x + costThisYear(c), 0), 0)) },
    { lab:'🏷️ 브랜드', val: bs.length, sub:'개' },
    { lab:'✅ 남은 할 일', val: openTasks, sub: '전체 ' + all('tasks') + '개 중' },
    { lab:'🤖 자동화', val: autoAll,
      sub: '개 · 운영 중 ' + running + (toolAll ? ' · 도구 ' + toolAll : '') },
    { lab:'📁 자료',   val: all('assets'), sub: '파일 ' + files + '개 · 프롬프트 '
        + withPrompt + '/' + bs.length }
  ].map(x => '<div class="stat"><div class="lab">' + x.lab + '</div>'
    + '<div class="val">' + x.val + '</div><div class="sub">' + x.sub + '</div></div>').join('');

  const cards = bs.map(b =>
    '<div class="hcard" style="--bc:' + b.color + '" '
    + 'onclick="selectBrand(\'' + b.id + '\')">'
    + '<div class="top"><span class="em">' + esc(b.icon) + '</span>'
      + '<span class="nm">' + esc(b.name) + '</span></div>'
    + '<div class="ds">' + esc(b.desc || '설명이 아직 없습니다')
      + (b.owner ? ' · ' + esc(b.owner) : '') + '</div>'
    + (function(){
        const m = (b.costs || []).reduce((x, c) => x + costPerMonth(c), 0);
        return m ? '<div class="fmeta" style="margin-top:4px">💳 한 달 ' + won(m) + '</div>' : '';
      })()
    + (function(){
        const q = inquiryStats(b.name);
        if(!q) return '';
        return '<div class="nums">'
          + '<div class="n"><b>' + q.total.toLocaleString('ko-KR') + '</b>전체 문의</div>'
          + '<div class="n"><b>' + q.thisMonth + '</b>이번 달 '
            + (q.diff === null ? '' : diffTag(q.diff)) + '</div>'
          + (q.latest ? '<div class="n"><b style="font-size:13px">' + esc(q.latest)
              + '</b>최근 문의</div>' : '')
          + '</div>';
      })()
    + '<div class="cnts">'
      + '<span class="chip">🤖 ' + autoCount(b) + '</span>'
      + '<span class="chip">📜 ' + b.history.length + '</span>'
      + '<span class="chip">📁 ' + b.assets.length + '</span>'
      + (b.links.length ? '<span class="chip">🔗 ' + b.links.length + '</span>' : '')
      + (b.tasks.filter(t => t.status !== '완료').length
          ? '<span class="chip test">✅ ' + b.tasks.filter(t => t.status !== '완료').length + '</span>' : '')
      + ((b.masterPrompt || '').trim() ? '<span class="chip on">✨ 작성됨</span>'
                                       : '<span class="chip">✨ 미작성</span>')
      + (function(){ const k = brandNewCount(b);
           return k ? '<span class="chip new">🆕 새 글 ' + k + '</span>' : ''; })()
      + ((b._conflicts || []).length
          ? '<span class="chip test">⚠️ 같이 고친 것 ' + b._conflicts.length + '</span>' : '')
    + '</div></div>').join('');

  // 기한이 지났거나 임박한 할 일
  const today = todayStr();
  const urgent = [];
  bs.forEach(b => b.tasks.forEach(t => {
    if(t.status === '완료' || !t.due) return;
    const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
    if(days <= 3) urgent.push({ b, t, days });
  }));
  urgent.sort((x, y) => x.days - y.days);

  const urgentHtml = urgent.length
    ? '<div class="todo">' + urgent.slice(0, 8).map(u =>
        '<div class="ti" onclick="gotoResult(\'' + u.b.id + '\',\'tasks\')">'
        + '<span class="dm ' + (u.days < 0 ? 'late' : 'soon') + '"></span>'
        + '<strong>' + esc(u.t.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(u.b.name) + '</span>'
        + '<span class="rb">' + (u.days < 0 ? Math.abs(u.days) + '일 지남' : 'D-' + u.days) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 아직 비어 있는 곳을 짚어줍니다
  const todos = [];
  bs.forEach(b => {
    if(!(b.masterPrompt || '').trim())
      todos.push(['✨', b, 'prompt', '마스터프롬프트가 비어 있습니다']);
    if(!b.automations.length)
      todos.push(['🤖', b, 'automations', '등록된 자동화가 없습니다']);

  });

  const todoHtml = todos.length
    ? '<div class="todo">' + todos.slice(0, 12).map(([ic, b, tab, msg]) =>
        '<div class="ti" onclick="gotoResult(\'' + b.id + '\',\'' + tab + '\')">'
        + '<span>' + ic + '</span><strong>' + esc(b.name) + '</strong>'
        + '<span style="color:var(--text-muted)">' + msg + '</span></div>').join('')
      + (todos.length > 12 ? '<div class="ti" style="color:var(--text-muted);cursor:default">'
          + '외 ' + (todos.length - 12) + '건</div>' : '')
      + '</div>'
    : '<div class="todo" style="color:var(--text-muted)">모든 브랜드가 채워져 있습니다 👏</div>';

  // 최근에 손댄 항목
  const recent = [];
  bs.forEach(b => ITEM_KEYS.forEach(t =>
    b[t].forEach(it => {
      const when = it.updatedAt || it.uploadedAt;
      if(when) recent.push({ b, t, it, when });
    })));
  recent.sort((x, y) => String(y.when).localeCompare(String(x.when)));

  const recentHtml = recent.length
    ? '<div class="todo recent">' + recent.slice(0, 8).map(r =>
        '<div class="ri" onclick="gotoResult(\'' + r.b.id + '\',\'' + r.t + '\')">'
        + '<span>' + TYPES[r.t].icon + '</span>'
        + '<strong>' + esc(r.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(r.b.name) + '</span>'
        + '<span class="rb">' + esc(new Date(r.when)
            .toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' })) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 채널에 새로 올라온 글 (NAS 가 미리 받아둔 것)
  const posts = [];
  chState.rows.forEach(r => {
    const brand = bs.find(x => x.name === r['브랜드']);
    const mark  = chSeen()[r.feed];
    (r.items || []).forEach(it => {
      if(!it.link) return;
      posts.push({ r, it, brand, isNew: chNewer(chKey(it), mark) });
    });
  });
  posts.sort((x, y) => String(y.it.iso || '').localeCompare(String(x.it.iso || '')));

  const postHtml = posts.length
    ? '<div class="todo recent">' + posts.slice(0, 8).map(p =>
        '<div class="ri" onclick="window.open(\'' + jsq(p.it.link) + '\',\'_blank\',\'noopener\')">'
        + '<span>' + (CH_ICON[p.r.kind] || '🌐') + '</span>'
        + '<strong>' + (p.isNew ? '<span class="newtag">NEW</span> ' : '') + esc(p.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(p.r['브랜드'] || p.r['이름']) + '</span>'
        + '<span class="rb">' + esc(sinceText(p.it.iso)) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + noticeHtml()
    + '<h2 class="page-h">브랜드 현황</h2>'
    + '<div class="page-sub">카드를 누르면 해당 브랜드로 이동합니다</div>'
    + '<div class="stats">' + stats + '</div>'
    + '<div class="hgrid">' + cards + '</div>'
    + (urgentHtml ? '<div class="hsec">⏰ 기한이 임박한 할 일</div>' + urgentHtml : '')
    + (postHtml ? '<div class="hsec">📣 접점에 올라온 글</div>' + postHtml : '')
    + (recentHtml ? '<div class="hsec">🕘 최근 업데이트</div>' + recentHtml : '')
    + '<div class="hsec">📝 아직 비어 있는 곳</div>' + todoHtml
    + '</div></div>';
}

/* ========================= NAS 자료 =========================
   scan.sh 가 만든 파일 목록에서 찾아줍니다.
   파일을 옮기거나 복사하지 않고, 어디에 있는지만 알려줍니다.
   ============================================================ */
const nasState = { q:'', ext:'', loading:false, error:null, res:null, info:null };

async function nasCheck(){
  try{
    const r = await (await fetch('nasfiles.php?action=check', { cache:'no-store' })).json();
    nasState.info = r;
  }catch(e){ nasState.info = null; }
  render();
}

async function nasSearch(){
  const q = document.getElementById('nasQ');
  nasState.q = q ? q.value.trim() : nasState.q;
  const ex = document.getElementById('nasExt');
  nasState.ext = ex ? ex.value : '';
  if(!nasState.q && !nasState.ext){ toast('⚠️ 찾을 이름을 입력해 주세요'); return; }
  nasState.mode = 'search';

  nasState.loading = true; nasState.error = null; render();
  try{
    const url = 'nasfiles.php?action=search&q=' + encodeURIComponent(nasState.q)
              + (nasState.ext ? '&ext=' + encodeURIComponent(nasState.ext) : '');
    const res = await fetch(url, { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '찾지 못했습니다');
    nasState.res = out;
  }catch(e){ nasState.error = e.message; nasState.res = null; }
  finally{ nasState.loading = false; render();
    const el = document.getElementById('nasQ'); if(el){ el.focus(); el.value = nasState.q; } }
}

/* NAS 경로를 탐색기에서 쓸 수 있는 형태로 바꿉니다
   /volume1/넷폼알앤디 공유폴더/a/b.pdf  →  \\netformrnd\넷폼알앤디 공유폴더\a\b.pdf */
function toWinPath(p){
  return '\\\\netformrnd\\' + String(p).replace(/^\/volume\d+\//, '').replace(/\//g, '\\');
}

async function copyNasPath(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.path);
  try{
    await navigator.clipboard.writeText(win);
    toast('📋 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}


/* ========================= 폴더 탐색기 =========================
   scan.sh 가 만든 목록을 가지고, 탐색기처럼 폴더를 타고 들어갑니다.
   파일은 옮기지 않고 있는 자리에서 바로 내려받습니다.
   ============================================================== */
/* 서버에 물어보고 JSON 을 받아옵니다.
   PHP 파일이 아직 없으면 HTML(404 화면)이 오는데, 그걸 알아보고 안내합니다. */
async function apiJson(url, opts){
  const res  = await fetch(url, Object.assign({ cache:'no-store' }, opts || {}));
  const text = await res.text();
  let out = null;
  try{ out = JSON.parse(text); }catch(e){}
  if(out === null){
    const file = String(url).split('?')[0];
    const head = text.replace(/\s+/g, ' ').trim().slice(0, 300);
    if(res.status === 404){
      throw new Error('NAS에 ' + file + ' 이(가) 아직 없습니다.\n\n'
        + '아래 주소를 브라우저 주소창에 한 번 넣어 주세요. (파일을 자동으로 받아옵니다)\n\n'
        + location.href.split('?')[0].replace(/[^/]*$/, 'save.php?action=bootstrap'));
    }
    // 웹 스테이션(nginx)이 자기 오류 화면을 대신 보낸 경우입니다.
    // PHP 가 끝나기 전에 잘렸다는 뜻이라, 대개 시간이 오래 걸려서입니다.
    const nginxPage = /^<!DOCTYPE html>|<html/i.test(text.trim());
    if(nginxPage && (res.status === 500 || res.status === 502 || res.status === 504)){
      throw new Error(file + ' 이(가) 도중에 끊겼습니다. (HTTP ' + res.status + ')\n\n'
        + '작업이 오래 걸려서 웹 서버가 먼저 끊은 것으로 보입니다.\n'
        + '(NAS 가 보낸 오류 화면이라 자세한 내용이 없습니다)\n\n'
        + '· 잠시 뒤 다시 눌러보세요. 그래도 같으면\n'
        + '· [🩺 이 NAS 점검] 을 눌러 무엇이 되는지 확인해 주세요.');
    }
    throw new Error(file + ' 이(가) 이상한 응답을 보냈습니다. (HTTP ' + res.status + ')\n\n'
      + '받은 내용 앞부분:\n' + head);
  }
  if(!out.ok){
    // 로그인이 끊겼거나(만료) 관리자가 계정을 막았습니다
    if(out['로그인필요']){ authKicked(); throw new Error('로그인이 필요합니다. 다시 들어와 주세요.'); }
    throw out;
  }
  return out;
}

function apiErrText(e){
  return (e && e.error) || (e && e.message) || '알 수 없는 오류';
}

const browseCache = {};   // 폴더경로 → {loading} | {error} | 서버응답
const fileShow    = {};   // 화면키 → 지금 보여주는 파일 수
const picShow     = {};   // 화면키 → 지금 보여주는 사진 수
const fileOpen    = {};   // 화면키 → 파일 목록을 펼쳤는지
const openFolder  = {};   // 브랜드id → 펼쳐 놓은 폴더 경로 (한 번에 하나만)
const folderNav   = {};   // 화면키 → 지금 보고 있는 폴더

/* 작은따옴표 onclick 안에 안전하게 넣기 위한 처리 */
function jsq(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
                  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function redraw(){ render(); }

async function loadBrowse(dir){
  browseCache[dir] = { loading:true };
  try{
    const out = await apiJson('nasfiles.php?action=browse&dir=' + encodeURIComponent(dir || ''));
    browseCache[dir] = out;
    if(out.dir && out.dir !== dir) browseCache[out.dir] = out;
  }catch(e){
    browseCache[dir] = { error: apiErrText(e) };
  }
  redraw();
}

function toggleFiles(navKey){
  const cur = browseCache[folderNav[navKey] !== undefined ? folderNav[navKey] : ''];
  const def = cur && cur.folders ? !cur.folders.length : false;
  fileOpen[navKey] = (fileOpen[navKey] !== undefined) ? !fileOpen[navKey] : !def;
  redraw();
}

async function morePics(navKey){
  picShow[navKey] = (picShow[navKey] || 40) + 60;
  await ensureFiles(navKey, picShow[navKey] + 20);
  redraw();
}

/* 화면에 필요한 만큼 파일을 더 받아옵니다 (사진 수만 장짜리 폴더 대비) */
async function ensureFiles(navKey, need){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : '';
  const c = browseCache[dir];
  if(!c || !c.files) return;
  if(c.files.length >= c.fileCount) return;      // 이미 다 받았습니다
  if(c.files.length >= need) return;             // 아직 더 받을 필요 없습니다
  if(c.loadingMore) return;
  c.loadingMore = true;
  try{
    const out = await apiJson('nasfiles.php?action=browse&off=' + c.files.length
      + '&lim=500&dir=' + encodeURIComponent(c.dir));
    c.files = c.files.concat(out.files || []);
  }catch(e){ /* 다음에 다시 시도합니다 */ }
  c.loadingMore = false;
}

/* ============ 최근 글 모아오기 (RSS) ============
   접점에 적어 둔 주소에서 최근 올린 글을 받아옵니다. 「마케팅」 탭의
   콘텐츠 목록 칸이 이것을 씁니다.
   가져오는 일은 NAS 가 대신합니다 (사무실 브라우저는 밖으로 못 나갑니다).
   ============================================== */
const feedCache = {};   // RSS 주소 → {loading} | {error} | 응답

/* NAS 가 미리 받아둔 채널 글 모음입니다.
   feeds.sh 를 작업 스케줄러에 걸어두면 NAS 가 30분마다 돌아보고,
   대시보드는 그걸 그냥 읽기만 해서 열자마자 바로 보입니다. */
const chState = { rows: [], at: null, autoAt: null, age: null, cron: false, loaded: false };

const CH_SEEN_KEY = 'brandHubChSeen';   // 어디까지 봤는지 (이 브라우저에만 저장)

function chSeen(){
  try{ return JSON.parse(localStorage.getItem(CH_SEEN_KEY) || '{}'); }
  catch(e){ return {}; }
}
function chSeenSave(o){
  try{ localStorage.setItem(CH_SEEN_KEY, JSON.stringify(o)); }catch(e){}
}

/* 아직 안 본 글이 몇 개인지 셉니다.
   처음 보는 채널은 지금 것을 '이미 본 것'으로 쳐서, 빨간 표시가 쏟아지지 않게 합니다. */
function chKey(it){ return (it && (it.iso || it.link)) || ''; }

/* 이 글이 '마지막으로 본 것' 보다 새 글인지 봅니다.
   날짜가 있으면 날짜로, 없으면 주소가 달라졌는지로 판단합니다. */
function chNewer(key, mark){
  if(!key || !mark) return false;
  const a = Date.parse(key), b = Date.parse(mark);
  if(!isNaN(a) && !isNaN(b)) return a > b;
  return key !== mark;
}

function chUnseen(feed, items){
  if(!feed || !items || !items.length) return 0;
  const seen = chSeen();
  const mark = seen[feed];
  if(!mark){
    seen[feed] = chKey(items[0]);
    chSeenSave(seen);
    return 0;
  }
  let n = 0;
  for(const it of items){
    if(chNewer(chKey(it), mark)) n++;
    else break;
  }
  return n;
}

function chRowsOf(brandName){
  return chState.rows.filter(r => r['브랜드'] === brandName);
}

function brandNewCount(b){
  return chRowsOf(b.name).reduce((a, r) => a + chUnseen(r.feed, r.items), 0);
}

function markChannelsSeen(b){
  const seen = chSeen();
  let changed = false;
  chRowsOf(b.name).forEach(r => {
    if(!r.items || !r.items.length) return;
    const key = chKey(r.items[0]);
    if(key && seen[r.feed] !== key){ seen[r.feed] = key; changed = true; }
  });
  if(changed){ chSeenSave(seen); setTimeout(render, 0); }
}

const CH_STALE = 30 * 60;   // 30분이 지나면 오래된 것으로 봅니다

/* NAS 가 받아둔 것을 읽어옵니다. 인터넷에 나가지 않아 빠릅니다. */
async function loadChannelSummary(){
  if(STORAGE_MODE !== 'nas') return;
  try{
    const j = await apiJson('channels.php?action=summary');
    if(!j || !j.ok) return;
    chState.rows   = j['채널'] || [];
    chState.at     = j['가장오래된확인'] || null;
    chState.autoAt = j['자동확인'] || null;
    chState.age    = (typeof j['지난초'] === 'number') ? j['지난초'] : null;
    chState.cron   = j['예약작업'] === '등록됨';
    chState.loaded = true;
    // 채널 탭이 기다리지 않도록 미리 채워둡니다
    chState.rows.forEach(r => {
      if(r.feed && r.items && r.items.length && !feedCache[r.feed])
        feedCache[r.feed] = { ok:true, title:r['이름'], items:r.items };
    });
    render();

    // 받아둔 게 오래됐으면 대시보드가 직접 NAS 에게 돌아보라고 시킵니다.
    // 작업 스케줄러를 걸어두지 않아도 대시보드를 켜 두는 동안은 최신이 됩니다.
    if(chState.rows.length && (chState.age === null || chState.age > CH_STALE)) {
      await pokeChannels();
    }
  }catch(e){ /* 조용히 넘어갑니다 — 채널은 곁다리 기능입니다 */ }
}

/* 오래됐을 때만 조용히 새로 받아옵니다.
   maxage 를 함께 보내서, 여러 사람이 열어두어도 NAS 는 한 번만 나갑니다. */
let chPoking = false;
async function pokeChannels(){
  if(chPoking) return;
  chPoking = true;
  try{
    const r = await apiJson('channels.php?action=refreshall&maxage=' + CH_STALE);
    if(r && r.ok && !r['건너뜀']){
      Object.keys(feedCache).forEach(k => delete feedCache[k]);
      const j = await apiJson('channels.php?action=summary');
      if(j && j.ok){
        chState.rows   = j['채널'] || [];
        chState.autoAt = j['자동확인'] || null;
        chState.age    = (typeof j['지난초'] === 'number') ? j['지난초'] : null;
        chState.rows.forEach(x => {
          if(x.feed && x.items && x.items.length)
            feedCache[x.feed] = { ok:true, title:x['이름'], items:x.items };
        });
        render();
      }
    }
  }catch(e){ /* 조용히 */ }
  finally{ chPoking = false; }
}

/* 지금 당장 전부 새로 받아옵니다 (NAS 가 인터넷에 나갔다 옵니다 — 조금 걸립니다) */
async function refreshAllChannels(btn){
  if(btn){ btn.disabled = true; btn.textContent = '받는 중…'; }
  toast('📡 접점을 전부 돌아보는 중입니다…');
  try{
    const j = await apiJson('channels.php?action=refreshall');
    Object.keys(feedCache).forEach(k => delete feedCache[k]);
    await loadChannelSummary();
    if(j['실패']) toast('확인 ' + j['확인한채널'] + '곳 · 실패 ' + j['실패'] + '곳');
    else toast('✅ ' + j['확인한채널'] + '곳을 새로 받았습니다');
  }catch(e){ alert(apiErrText(e)); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = '↻ 최근 글 전부 새로 받기'; } }
}

const CH_ICON = { '네이버 블로그':'📗', '네이버 카페':'☕', '유튜브':'📺', '인스타그램':'📷',
                  '티스토리':'📘', '브런치':'✍️', '페이스북':'👥', '웹사이트':'🌐' };

/* ═══════════════ 📣 접점 (채널) ═══════════════════════════════════
   예전에는 「주소를 넣으면 최근 글을 보여주는 목록」 이었습니다. 그런데
   마케팅 접점은 블로그만이 아니라 광고 · DM · 후기까지 있고, 접점마다
   남겨야 할 것이 다릅니다 (광고는 집행비, DM 은 발송 기록, 후기는 언급).
   그래서 네 갈래로 세우고, 접점마다 필요한 칸만 켜서 씁니다.
     ① OWNED  우리가 직접 운영          ② PAID   돈을 내고 확보
     ③ DIRECT 타깃에게 직접 접촉        ④ VIRAL  남을 통한 확산
   자료는 b.channels 에 그대로 둡니다 — 합치기·휴지통이 이미 붙어 있어서
   옮기면 그 둘을 다시 이어야 합니다.
   ================================================================= */
const TP_CATS = [
  { id:'owned',  name:'① OWNED',            ko:'우리가 직접 운영하는 접점',
    hue:'var(--blue)',   preset:{ prompt:true, feed:true } },
  { id:'paid',   name:'② PAID',             ko:'비용을 지불해 확보하는 접점',
    hue:'var(--amber,#f59e0b)', preset:{ perf:true } },
  { id:'direct', name:'③ DIRECT',           ko:'타깃 고객에게 직접 접촉하는 접점',
    hue:'var(--green)',  preset:{ contact:true } },
  { id:'viral',  name:'④ VIRAL & REFERRAL', ko:'고객·제3자를 통한 확산',
    hue:'var(--purple)', preset:{ mention:true } }
];
const TP_MODS = [['prompt','프롬프트'], ['perf','집행·성과'], ['contact','발송·접촉 기록'],
                 ['feed','콘텐츠 목록'], ['mention','언급 수집'], ['docs','자료']];
const TP_STATUS = { run:'운영중', ready:'준비중', stop:'중단', done:'종료 (1회성)', none:'안 함' };
const TP_ORDER  = { run:0, ready:1, stop:2, done:3, none:4 };
const TP_DOCK   = { plan:'기획서', out:'결과물', deal:'계약·견적', rep:'보고서', etc:'기타' };
/* 새 접점을 만들 때 「무엇을 하는 접점인가」 로 켤 칸을 정해 줍니다 */
const TP_TYPES = [
  ['post',  '글·영상을 계속 올린다', { prompt:true, feed:true }],
  ['spend', '돈을 쓰고 결과를 본다', { perf:true }],
  ['send',  '대상에게 직접 보낸다',  { contact:true }],
  ['hear',  '남이 말해준 걸 모은다', { mention:true }],
  ['plain', '설명과 여정만 적는다',  {}]
];
const TP_TYPE_DEF = { owned:'post', paid:'spend', direct:'send', viral:'hear' };
const TP_METRIC   = { paid:['노출','클릭'], direct:['발송','회신'], owned:['방문'], viral:[] };

function tpCat(id){ return TP_CATS.find(c => c.id === id) || TP_CATS[0]; }

/* 접점 목록 — 예전 채널도 여기서 한 번에 모양을 맞춥니다 */
function tpsOf(b){
  if(!Array.isArray(b.channels)) b.channels = [];
  b.channels.forEach(t => {
    if(!t.id) t.id = uid('ch');
    /* 예전 채널은 갈래가 없습니다 — 우리가 직접 올리던 것이니 OWNED 로 */
    if(TP_CATS.some(c => c.id === t.cat) === false) t.cat = 'owned';
    if(!TP_STATUS[t.status]) t.status = 'run';
    if(!t.mods || typeof t.mods !== 'object' || Array.isArray(t.mods)){
      t.mods = Object.assign({ docs:true }, tpCat(t.cat).preset);
      if(t.feed) t.mods.feed = true;          // 최근 글을 받던 채널이면 그 칸을 켜 둡니다
    }
    ['journey','prompts','metrics','perf','contacts','mentions','docs'].forEach(k => {
      if(!Array.isArray(t[k])) t[k] = [];
    });
    ['name','url','desc','owner','since','kind'].forEach(k => {
      if(typeof t[k] !== 'string') t[k] = t[k] == null ? '' : String(t[k]);
    });
  });
  return b.channels;
}
function tpFind(b, id){ return tpsOf(b).find(t => t.id === id) || null; }

/* 카드에 크게 띄울 한 줄 — 이 접점에서 제일 먼저 보고 싶은 것 */
function tpKey(t){
  if(t.status === 'none') return ['아직 하지 않는 접점', ''];
  if(t.mods.perf && t.perf.length){
    const r = [...t.perf].sort((a, c) => String(c.p).localeCompare(String(a.p)))[0];
    return [wonText(r.c), r.p + ' 집행, 문의 ' + (r.i || 0) + '건'
      + (r.i ? ', 건당 ' + wonText(Math.round(r.c / r.i)) : '')];
  }
  if(t.mods.feed && t.feed){
    const f = feedCache[t.feed];
    if(f && f.items && f.items.length)
      return ['최근 발행 ' + sinceText(f.items[0].iso), '콘텐츠 ' + f.items.length + '건'];
  }
  if(t.mods.contact && t.contacts.length)
    return ['접촉 ' + t.contacts.length + '회', '최근 ' + t.contacts[0].d];
  if(t.mods.mention && t.mentions.length)
    return ['언급 ' + t.mentions.length + '건', '최근 ' + t.mentions[0].d];
  if(t.journey.length){
    const j = [...t.journey].sort((a, c) => String(c.d).localeCompare(String(a.d)))[0];
    return ['여정 ' + t.journey.length + '건', '최근 ' + j.d];
  }
  if(t.mods.docs && t.docs.length) return ['자료 ' + t.docs.length + '건', '최근 ' + t.docs[0].d];
  return ['기록 없음', '눌러서 첫 기록을 남기세요'];
}
function wonText(n){
  n = Number(n || 0);
  return n >= 10000 ? (Math.round(n / 1000) / 10).toLocaleString('ko-KR') + '만원'
                    : n.toLocaleString('ko-KR') + '원';
}

async function loadFeed(url){
  feedCache[url] = { loading:true };
  try{
    feedCache[url] = await apiJson('channels.php?action=feed&n=6&url=' + encodeURIComponent(url));
  }catch(e){ feedCache[url] = { error: apiErrText(e) }; }
  render();
}

function refreshFeed(url){
  delete feedCache[url];
  feedCache[url] = { loading:true };
  render();
  apiJson('channels.php?action=feed&n=6&fresh=1&url=' + encodeURIComponent(url))
    .then(o => { feedCache[url] = o; render(); })
    .catch(e => { feedCache[url] = { error: apiErrText(e) }; render(); });
  toast('↻ 새로 받아옵니다');
}

/* addChannel · removeChannel · refindFeed 는 접점 화면으로 옮겨가면서 없앴습니다.
   지금은 카드의 [＋ 접점 추가] → tpMake, 상세판의 [삭제] → tpDel,
   [🔎 최근 글 찾기] → tpProbe 가 같은 일을 합니다. */
function sinceText(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(d < 0) return '오늘';
  if(d === 0) return '오늘';
  if(d === 1) return '어제';
  if(d < 30) return d + '일 전';
  if(d < 365) return Math.floor(d / 30) + '개월 전';
  return Math.floor(d / 365) + '년 전';
}

let tpOpen = '';          // 열어 둔 접점 id
let tpAdd  = '';          // ＋ 접점 추가를 누른 갈래
let tpDocAt = 'all';      // 자료 거르개
let tpEditJ = -1;         // 고치고 있는 여정 줄

function viewChannels(b){
  const list = tpsOf(b);
  setTimeout(() => markChannelsSeen(b), 400);   // 열어봤으니 '읽음' 처리
  list.forEach(t => { if(t.mods.feed && t.feed && !feedCache[t.feed]) setTimeout(() => loadFeed(t.feed), 10); });

  const run  = list.filter(t => t.status === 'run').length;
  const none = list.filter(t => t.status === 'none').length;
  /* 이번 달 집행비와 문의 — 광고·DM 처럼 돈이 드는 접점만 셉니다 */
  const mon  = new Date().toISOString().slice(0, 7);
  let cost = 0, inq = 0;
  list.forEach(t => (t.perf || []).forEach(r => {
    if(String(r.p) !== mon) return;
    cost += Number(r.c || 0); inq += Number(r.i || 0);
  }));

  const mins = chState.age === null ? null : Math.floor(chState.age / 60);
  const when = chState.autoAt
    ? '최근 글 확인: ' + (mins !== null && mins < 60
        ? (mins < 1 ? '방금' : mins + '분 전')
        : esc(new Date(chState.autoAt).toLocaleString('ko-KR',
            { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })))
    : '최근 글을 아직 한 번도 확인하지 않았습니다';

  const sum = '<div class="tp-sum">'
    + '<span><b>' + run + '</b>개 운영중</span>'
    + '<span><b>' + none + '</b>개 아직 안 함</span>'
    + (cost ? '<span>이번 달 집행 <b>' + esc(wonText(cost)) + '</b></span>' : '')
    + (inq  ? '<span>이번 달 광고·DM 문의 <b>' + inq + '</b>건</span>' : '')
    + '</div>';

  const bar = '<div class="sec-bar">' + sum
    + '<button class="btn sm" style="margin-left:auto" '
      + 'onclick="refreshAllChannels(this)">↻ 최근 글 전부 새로 받기</button>'
    + '<span class="hint">' + when + '</span></div>';

  const cats = TP_CATS.map(c => {
    const mine = list.filter(t => t.cat === c.id)
      .sort((x, y) => (TP_ORDER[x.status] - TP_ORDER[y.status])
                      || String(x.name).localeCompare(String(y.name)));
    const cards = mine.map(t => {
      const kv = tpKey(t);
      const nNew = (t.mods.feed && t.feed && feedCache[t.feed] && feedCache[t.feed].items)
        ? chUnseen(t.feed, feedCache[t.feed].items) : 0;
      return '<button class="tp-c' + (t.status === 'none' ? ' off' : '') + '" '
        + 'onclick="tpShow(\'' + jsq(t.id) + '\')">'
        + '<span class="top">'
          + '<span class="nm">' + esc(t.name || t.kind || '이름 없는 접점') + '</span>'
          + '<span class="chip s-' + t.status + '">' + esc(TP_STATUS[t.status]) + '</span>'
        + '</span>'
        + (nNew ? '<span class="new">🆕 새 글 ' + nNew + '</span>' : '')
        + '<span class="key">' + esc(kv[0]) + '</span>'
        + '<span class="sub">' + esc(kv[1]) + '</span>'
        + '</button>';
    }).join('');

    const adder = tpAdd === c.id
      ? '<div class="tp-new">'
        + '<input type="text" id="tpNm" placeholder="접점 이름 (예: 카카오 채널)" '
          + 'onkeydown="if(event.key===\'Enter\')tpMake(\'' + c.id + '\')">'
        + '<select id="tpTy">' + TP_TYPES.map(x => '<option value="' + x[0] + '"'
            + (TP_TYPE_DEF[c.id] === x[0] ? ' selected' : '') + '>' + esc(x[1])
            + '</option>').join('') + '</select>'
        + '<div class="row">'
          + '<button class="btn sm primary" onclick="tpMake(\'' + c.id + '\')">접점 추가</button>'
          + '<button class="btn sm" onclick="tpAddNo()">취소</button>'
        + '</div></div>'
      : '<button class="tp-plus" onclick="tpAddAt(\'' + c.id + '\')">＋ 접점 추가</button>';

    return '<section class="tp-cat" style="--hue:' + c.hue + '">'
      + '<div class="ch"><h3>' + esc(c.name) + '</h3><p>' + esc(c.ko) + '</p>'
        + '<span class="ct">' + mine.filter(t => t.status === 'run').length
        + ' / ' + mine.length + ' 운영중</span></div>'
      + '<div class="tp-grid">' + cards + adder + '</div>'
      + '</section>';
  }).join('');

  return bar + cats;
}

/* ── 접점 만들기 ─────────────────────────────────────────────── */
function tpAddAt(cid){ tpAdd = cid; render();
  setTimeout(() => { const el = document.getElementById('tpNm'); if(el) el.focus(); }, 30); }
function tpAddNo(){ tpAdd = ''; render(); }
function tpMake(cid){
  const b = currentBrand(); if(!b) return;
  const nm = (document.getElementById('tpNm') || {}).value || '';
  if(!nm.trim()){ toast('⚠️ 접점 이름을 적어주세요'); return; }
  const ty = TP_TYPES.find(x => x[0] === ((document.getElementById('tpTy') || {}).value || ''))
             || TP_TYPES[0];
  const t = { id: uid('ch'), cat: cid, name: nm.trim(), status:'ready',
              kind:'', url:'', feed:'', desc:'', owner:'', since:'',
              mods: Object.assign({ docs:true }, ty[2]),
              journey:[], prompts:[], perf:[], contacts:[], mentions:[], docs:[],
              metrics: ty[2].perf ? (TP_METRIC[cid] || []).slice() : [] };
  tpsOf(b).push(t);
  tpAdd = '';
  markDirty(b.id); render();
  tpShow(t.id);
  toast('✅ 접점을 넣었습니다');
}
function tpDel(id){
  const b = currentBrand(); if(!b) return;
  const t = tpFind(b, id); if(!t) return;
  if(!confirm('"' + (t.name || '이름 없는 접점') + '" 접점을 지울까요?\n\n'
    + '적어 둔 여정 · 기록도 같이 갑니다.\n'
    + '휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 되돌릴 수 있습니다.')) return;
  trashPut('접점', t.name || t.url, t, { kind:'item', type:'channels', brandId: b.id });
  b.channels = tpsOf(b).filter(x => x.id !== id);
  deletedIds.add(id);
  tpOpen = '';
  markDirtyAll(); render();
  toast('🗑️ 휴지통으로 보냈습니다');
}

/* ── 열고 닫기 ───────────────────────────────────────────────── */
function tpShow(id){ tpOpen = id; tpDocAt = 'all'; tpEditJ = -1; render(); }
function tpHide(){ tpOpen = ''; tpEditJ = -1; render(); }
function tpSet(id, f, v, draw){
  const b = currentBrand(); if(!b) return;
  const t = tpFind(b, id); if(!t) return;
  t[f] = v; markDirty(b.id);
  if(draw) render();
}
function tpMod(id, k, on){
  const b = currentBrand(); if(!b) return;
  const t = tpFind(b, id); if(!t) return;
  t.mods[k] = !!on; markDirty(b.id); render();
}

        + '<button class="btn sm" onclick="tpDocPick(\'' + id + '\')">📎 파일 올리기</button>'
        + '<span class="fn" id="tpDfn">'
          + ((tpDocHold[t.id] && tpDocHold[t.id].name)
              ? '📎 ' + esc(tpDocHold[t.id].name) : '올린 파일 없음') + '</span>'
        + '<button class="btn primary" onclick="tpDocAdd(\'' + id + '\')">자료 추가</button>'
      + '</span>'
    + '</div>'
    + (t.docs.length
        ? '<div class="tp-df">'
          + '<button class="' + (tpDocAt === 'all' ? 'on' : '') + '" onclick="tpDocFil(\'all\')">'
            + '전체 ' + t.docs.length + '</button>'
          + Object.keys(TP_DOCK).filter(k => t.docs.some(x => x.k === k)).map(k =>
              '<button class="' + (tpDocAt === k ? 'on' : '') + '" onclick="tpDocFil(\'' + k + '\')">'
              + esc(TP_DOCK[k]) + ' ' + t.docs.filter(x => x.k === k).length + '</button>').join('')
          + '</div>'
          + [...t.docs].sort((a, x) => String(x.d).localeCompare(String(a.d)))
              .filter(x => tpDocAt === 'all' || x.k === tpDocAt).map(x => {
            const i = t.docs.indexOf(x);
            return '<div class="tp-doc"><span class="k ' + esc(x.k) + '">'
              + esc(TP_DOCK[x.k] || '기타') + '</span>'
              + '<span class="b"><b>' + esc(x.t) + '</b>'
                + (x.n ? '<small>' + esc(x.n) + '</small>' : '')
                + (x.filePath
                    ? '<a href="' + esc(cardFull(x)) + '" target="_blank" rel="noopener">'
                      + esc(x.name || '파일 열기') + ' ↗</a>'
                    : (x.l ? '<span class="pa">' + esc(x.l) + '</span>' : ''))
              + '</span>'
              + '<span class="dt">' + esc(x.d) + '</span>'
              + '<button class="x" onclick="tpDocDel(\'' + id + '\',' + i + ')">✕</button></div>';
          }).join('')
        : '<div class="empty" style="padding:8px 0">아직 등록한 자료가 없습니다.</div>')) : '';

  /* 콘텐츠 목록 — 지금 쓰던 RSS 수집을 그대로 씁니다 */
  let feed = '';
  if(t.mods.feed){
    const f = t.feed ? feedCache[t.feed] : null;
    let inner;
    if(!t.url && !t.feed){
      inner = '<div class="empty" style="padding:8px 0">위 <b>링크</b> 에 주소를 넣고 '
        + '[🔎 최근 글 찾기] 를 누르면 올린 글이 여기 모입니다.</div>';
    }else if(!t.feed){
      inner = '<div class="empty" style="padding:8px 0">이 주소에서는 최근 글을 못 가져옵니다. '
        + '<button class="btn sm" onclick="tpProbe(\'' + id + '\')">🔎 다시 찾아보기</button></div>';
    }else if(!f || f.loading){
      inner = '<div class="empty" style="padding:8px 0">불러오는 중…</div>';
    }else if(f.error){
      inner = '<div class="empty" style="padding:8px 0;white-space:pre-wrap">⚠️ ' + esc(f.error)
        + '</div><div class="row" style="margin-top:6px">'
        + '<button class="btn sm" onclick="refreshFeed(\'' + jsq(t.feed) + '\')">↻ 다시</button>'
        + '<a class="btn sm" href="channels.php?action=test&url=' + encodeURIComponent(t.feed)
        + '" target="_blank" rel="noopener">🔧 왜 안 되는지</a></div>';
    }else if(!f.items || !f.items.length){
      inner = '<div class="empty" style="padding:8px 0">올라온 글이 없습니다.</div>';
    }else{
      const mark = chSeen()[t.feed];
      inner = '<div class="tp-feed">' + f.items.map(it =>
        '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">'
        + (chNewer(chKey(it), mark) ? '<span class="newtag">NEW</span> ' : '')
        + esc(it.title) + '<span>' + esc(sinceText(it.iso)) + '</span></a>').join('') + '</div>';
    }
    feed = S('콘텐츠 목록', '이 접점에 올린 글을 주소에서 알아서 모아 옵니다', inner,
      '<span class="row">'
      + '<button class="btn sm" onclick="tpProbe(\'' + id + '\')">🔎 최근 글 찾기</button>'
      + (t.feed ? '<button class="btn sm" onclick="refreshFeed(\'' + jsq(t.feed)
                  + '\')">↻ 새로 받기</button>' : '') + '</span>');
  }

  /* 언급 수집 */
  const men = t.mods.mention ? S('언급 수집',
    '후기 · 추천 · 커뮤니티 언급을 발견할 때마다 남기는 곳',
    '<div class="tp-row">'
      + '<input type="date" id="tpMd" value="' + esc(todayStr()) + '" style="flex:0 0 150px">'
      + '<input type="text" id="tpMs" placeholder="어디서 (예: 관리소장 카페)">'
      + '<input type="text" id="tpMt" placeholder="내용 요약 또는 링크">'
      + '<button class="btn primary" onclick="tpMenAdd(\'' + id + '\')">언급 추가</button>'
    + '</div>'
    + (t.mentions.length
        ? '<ul class="tp-tl">' + t.mentions.map((m, i) => '<li>'
            + '<span class="dt">' + esc(m.d) + '</span>'
            + '<span class="tx"><b>' + esc(m.src) + '</b><br>' + esc(m.t) + '</span>'
            + '<span class="ac"><button class="x" onclick="tpMenDel(\'' + id + '\',' + i
              + ')">✕</button></span></li>').join('') + '</ul>'
        : '<div class="empty" style="padding:8px 0">아직 수집된 언급이 없습니다.</div>')) : '';

  return '<div class="tp-dim" onclick="tpHide()"></div>'
    + '<aside class="tp-d" role="dialog" aria-label="접점 상세">'
    + head
    + '<div class="tp-body">' + info + prm + perf + con + jour + docs + feed + men + '</div>'
    + '</aside>';
}

/* ── 접점 안에서 손대는 것들 ─────────────────────────────────── */
function tpV(id){ const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
function tpT(){ const b = currentBrand(); return b ? tpFind(b, tpOpen) : null; }
function tpSave(){ const b = currentBrand(); if(b) markDirty(b.id); render(); }

/* 프롬프트 */
function tpPAdd(id){ const t = tpT(); if(!t) return; t.prompts.push({ t:'', b:'' }); tpSave(); }
function tpPSet(id, i, f, v){ const t = tpT(); if(!t || !t.prompts[i]) return;
  t.prompts[i][f] = v; const b = currentBrand(); if(b) markDirty(b.id); }
function tpPDel(id, i){ const t = tpT(); if(!t) return; t.prompts.splice(i, 1); tpSave(); }
function tpPCopy(id, i){
  const t = tpT(); if(!t || !t.prompts[i]) return;
  const txt = String(t.prompts[i].b || '');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => toast('📋 프롬프트를 복사했습니다'),
          () => toast('⚠️ 복사 권한이 없습니다 — 칸에서 직접 복사해 주세요'));
}

}
function tpMDel(id, i){ const t = tpT(); if(!t) return; t.metrics.splice(i, 1); tpSave(); }
function tpPerfAdd(id){

function tpPerfDel(id, rid){

}

/* 발송 · 접촉 */

/* 여정 */
function tpJAdd(id){

/* 자료 */
function tpDocFil(k){ tpDocAt = k; render(); }
function tpDocAdd(id){
  const t = tpT(); if(!t) return;
  if(!tpV('tpDt')){ toast('⚠️ 자료 이름을 적어주세요'); return; }

                              t: tpV('tpDt'), n: tpV('tpDn'), l: tpV('tpDl') }, hold || {}));
