}

/* 마디 하나 */
function lineItemHtml(b, r){
  const bid = jsq(b.id), rid = jsq(r.id);
  const K = recKindOf(r);
  const a = recAxis(r);
  const open = lineOpen === r.id;
  const head = recHead(r);

  const dc = r.docId ? docFind(b, r.docId) : null;
  const meta = '<div class="dt">'
    + '<span class="d">' + esc(r.date || '날짜 확인 필요') + '</span>'
    + '<span class="kd">' + K.ic + ' ' + esc(K.nm) + '</span>'
    + (a ? '<span class="ax">' + a.icon + ' ' + esc(a.name) + '</span>' : '')
    + (dc ? '<span class="dc-tag">📄 ' + esc(dc.title || '문서')
        + (r.docAt ? ' · ' + esc(r.docAt) : '') + '</span>' : '')
    + (r.guess ? '<span class="gs">추정</span>' : '')
    + '</div>';

  if(!open){
    const sub = [r.why, r.src].map(x => String(x || '').trim()).filter(Boolean).join(' · ');
    return '<div class="hl-i ' + K.cls + '" onclick="lineToggle(\'' + rid + '\')">'
      + meta
      + '<div class="ti">' + (head ? esc(head) : '<i>아직 안 적었습니다 — 눌러서 적습니다</i>')
        + '</div>'
      + (sub ? '<div class="sc">' + esc(sub) + '</div>' : '')
      + '</div>';
  }

  const F = REC_FIELDS[K.k] || REC_FIELDS['사건'];
  const body = '<div class="hl-i ' + K.cls + ' open">'
    + '<div class="rh">'
      + '<input value="' + esc(r.date || '') + '" placeholder="2025.04.03 · 2023 상반기" '
        + 'style="max-width:190px" '
        + 'oninput="recEdit(\'' + bid + '\',\'' + rid + '\',\'date\', this.value)">'
      + '<select onchange="recEdit(\'' + bid + '\',\'' + rid + '\',\'kind\', this.value, 1)">'
        + REC_KINDS.map(k => '<option' + (k.k === K.k ? ' selected' : '') + '>'
            + k.k + '</option>').join('')
      + '</select>'
      + '<select onchange="recEdit(\'' + bid + '\',\'' + rid + '\',\'axis\', this.value, 1)">'
        + '<option value=""' + (r.axis ? '' : ' selected') + '>축 없음</option>'
        + BRAND_AXES.map(x => '<option value="' + x.key + '"'
            + (r.axis === x.key ? ' selected' : '') + '>' + x.icon + ' ' + x.name
            + '</option>').join('')
      + '</select>'
      + (K.k === '자료 없음' ? ''
          : '<label class="ht-guess' + (r.guess ? ' on' : '') + '">'
            + '<input type="checkbox"' + (r.guess ? ' checked' : '') + ' '
            + 'onchange="recEdit(\'' + bid + '\',\'' + rid + '\',\'guess\', this.checked, 1)">'
            + ' 추정</label>')
      + '<span class="hl-x">'
        + '<button onclick="lineToggle(\'' + rid + '\')" title="접기">▾</button>'
        + '<button class="x" onclick="recDel(\'' + bid + '\',\'' + rid + '\')" '
          + 'title="지우기">×</button>'
      + '</span>'
    + '</div>'
    + F.map(f => '<label class="wy"><span class="k">' + esc(f[2]) + '</span>'
        + '<textarea rows="1" placeholder="' + esc(f[1]) + '" '
        + 'oninput="gbGrow(this);recEdit(\'' + bid + '\',\'' + rid + '\',\'' + f[0]
        + '\', this.value)">' + esc(r[f[0]] || '') + '</textarea></label>').join('')
    + recSrcHtml(b, r)
    + recImgEditHtml(b, r)
    + '</div>';
  return body;
}

function moveBrand(id, dir){
  const i = data.brands.findIndex(b => b.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= data.brands.length) return;
  [data.brands[i], data.brands[j]] = [data.brands[j], data.brands[i]];
  render(); markDirtyAll();          // 목록 순서가 바뀌었습니다
}

/* ═══════════════ 브랜드북 ════════════════════════════════════════
   철학·스토리처럼 「이 브랜드가 무엇인가」 를 적어두는 곳입니다.
   다 적고 [✨ 마스터프롬프트 만들기] 를 누르면 AI 가 이 내용으로
   마스터프롬프트를 써 줍니다. 브랜드북이 원본, 프롬프트가 결과물입니다.
   ================================================================= */
const BOOK_SECTIONS = [
  { key:'why',     icon:'🎯', label:'왜 만들었나 (철학)',
    ph:'이 브랜드가 세상에 왜 있어야 하는지. 창업자가 풀고 싶었던 문제.' },
  { key:'story',   icon:'📖', label:'스토리',
    ph:'어떻게 시작했고 무슨 일이 있었는지. 사람들이 기억할 이야기.' },
  { key:'who',     icon:'👤', label:'누구를 위한 것인가',
    ph:'핵심 고객은 누구인지. 그 사람이 겪는 어려움과 바라는 것.' },
  { key:'what',    icon:'📦', label:'무엇을 파는가',
    ph:'제품·서비스를 한 문단으로. 어떻게 다른지.' },
  { key:'value',   icon:'💎', label:'약속 (핵심 가치)',
    ph:'고객에게 반드시 지키는 것 3가지쯤.' },
  { key:'tone',    icon:'🗣️', label:'말투 (톤앤매너)',
    ph:'어떤 말투로 이야기하는지. 쓰는 말 / 쓰지 않는 말.' },
  { key:'words',   icon:'✍️', label:'자주 쓰는 표현',
    ph:'브랜드가 늘 쓰는 문구·단어. 반대로 절대 안 쓰는 표현.' },
  { key:'rival',   icon:'⚔️', label:'경쟁사와 다른 점',
    ph:'비슷해 보이는 곳들과 무엇이 다른지.' },
  { key:'nogo',    icon:'🚫', label:'하지 않는 것',
    ph:'돈이 돼도 하지 않는 것. 브랜드가 지키는 선.' }
];

function bookOf(b){
  // 예전 자료에 book 이 빈 배열([])로 남아 있어, 배열이면 새 칸으로 바꿉니다
  if(!b.book || typeof b.book !== 'object' || Array.isArray(b.book)) b.book = {};
  return b.book;
}
function bookFilled(b){ const k = bookOf(b);
  return BOOK_SECTIONS.filter(s => String(k[s.key] || '').trim()).length; }

function onBookInput(key, v){
  const b = currentBrand(); if(!b) return;
  bookOf(b)[key] = v;
  b.bookUpdatedAt = new Date().toISOString();
  const c = document.getElementById('bookCount');
  if(c) c.textContent = bookChars(b).toLocaleString('ko-KR') + '자 · '
      + bookFilled(b) + '/' + BOOK_SECTIONS.length + '칸';
  // 다시 그리지 않고 칸 표시만 바꿉니다 (글 치는 중에 화면이 흔들리지 않게)
  const box = document.getElementById('bk_' + key);
  if(box && box.parentElement) box.parentElement.classList.toggle('on', !!String(v).trim());
  const pb = document.querySelector('.pwrap .bar-row .bf');
  if(pb) pb.style.width = Math.round(bookFilled(b) / BOOK_SECTIONS.length * 100) + '%';
  markDirty(b.id);
}
function bookChars(b){ const k = bookOf(b);
  return BOOK_SECTIONS.reduce((a, s) => a + String(k[s.key] || '').length, 0); }

/* 브랜드북을 AI 에게 줄 하나의 글로 묶습니다 */
function bookAsText(b){
  const k = bookOf(b);
  const parts = ['브랜드 이름: ' + (b.name || ''),
                 b.desc ? '한 줄 소개: ' + b.desc : ''];
  BOOK_SECTIONS.forEach(s => {
    const v = String(k[s.key] || '').trim();
    if(v) parts.push('[' + s.label + ']\n' + v);
  });
  return parts.filter(Boolean).join('\n\n');
}

async function bookToPrompt(){
  const b = currentBrand(); if(!b) return;
  if(bookFilled(b) < 2){
    alert('브랜드북을 조금 더 채워주세요.\n\n'
      + '적어도 2칸은 있어야 AI 가 쓸 거리가 생깁니다.\n'
      + '「왜 만들었나」 와 「누구를 위한 것인가」 부터 적어보세요.');
    return;
  }
  if(b.masterPrompt && b.masterPrompt.trim()){
    if(!confirm('지금 마스터프롬프트에 적힌 내용이 있습니다.\n\n'
      + 'AI 가 새로 쓴 것으로 바꿀까요?\n'
      + '(바꿔도 Ctrl+Z 로 되돌릴 수 있습니다)')) return;
  }
  aiState.busy = 'book:' + b.id; render();
  try{
    let out = await apiJson('ai.php?action=prompt', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ brand: b.name, book: bookAsText(b) })
    });
    let cut = false;
    if(out['진행중']){                    // 마누스 — 끝날 때까지 기다립니다
      cut = !!out['잘림'];
      if(cut) toast('✂️ 브랜드북이 길어 앞부분만 보냈습니다 (마누스는 한 번에 받는 길이가 짧습니다)');
      aiState.wait = 0; render();
      out = await waitTask(out['작업번호'], 'prompt', sec => { aiState.wait = sec; render(); });
    }
    b.masterPrompt = String(out['프롬프트'] || '').trim();
    b.promptUpdatedAt = new Date().toISOString();
    b.promptFrom = '브랜드북 · ' + new Date().toISOString();
    markDirty(b.id);
    render();
    setTimeout(() => {

      const box = document.getElementById('promptBox');

      : '✨ 브랜드북으로 마스터프롬프트를 만들었습니다');
  }catch(e){
    const msg = apiErrText(e);
    aiState.netFail = true;             // 한 번이라도 실패하면 [🩺 AI 점검] 을 남겨둡니다
    // 밖으로 못 나가는 경우면 바로 점검 화면을 열어 드립니다
    if(e && e['느림']){
      alert('만들지 못했습니다.\n\n' + msg);
    }else if(/연결하지 못|curl|wget|file_get_contents|시도한 방법/.test(msg)){
      alert('만들지 못했습니다.\n\nNAS 가 인터넷으로 나가지 못하고 있습니다.\n'
        + '어디가 막혔는지 바로 확인해 드리겠습니다.\n\n'
        + '(그동안에는 [🆓 클로드 창에서 하기] 로 돈 안 들이고 하실 수 있습니다)');
      openNetCheck();
    }else{
      alert('만들지 못했습니다.\n\n' + msg);
    }
  }finally{ aiState.busy = null; aiState.wait = null; render(); }
}

/* ========================= 검색 ========================= */
/* 상단 검색에서 NAS 파일도 함께 찾습니다 (조금 늦게 도착해 아래에 붙습니다) */
const nasSearchState = { q:'', busy:false, res:null, error:null };
let nasSearchTimer = null;

function scheduleNasSearch(q){
  clearTimeout(nasSearchTimer);
  if(STORAGE_MODE !== 'nas' || q.length < 2){
    nasSearchState.res = null; nasSearchState.q = ''; return;
  }
  if(nasSearchState.q === q) return;                 // 이미 찾아둔 말
  nasSearchTimer = setTimeout(async () => {
    nasSearchState.q = q; nasSearchState.busy = true; nasSearchState.error = null;
    paintNasSearch();
    try{
      nasSearchState.res = await apiJson('nasfiles.php?action=findin&limit=40&q='
        + encodeURIComponent(q));
    }catch(e){ nasSearchState.error = apiErrText(e); nasSearchState.res = null; }
    finally{ nasSearchState.busy = false; paintNasSearch(); }
  }, 450);                                            // 타이핑이 멈추면 찾습니다
}

function paintNasSearch(){
  const box = document.getElementById('nasSearchBox');
  if(!box) return;
  if(nasSearchState.busy){ box.innerHTML = '<div class="fmeta">NAS 파일을 찾는 중…</div>'; return; }
  if(nasSearchState.error){
    box.innerHTML = '<div class="fmeta">NAS 파일은 찾지 못했습니다 — '
      + esc(nasSearchState.error.split('\n')[0]) + '</div>';
    return;
  }
  const r = nasSearchState.res;
  if(!r || !r.hits || !r.hits.length){
    box.innerHTML = r ? '<div class="fmeta">NAS 폴더에서는 찾지 못했습니다</div>' : '';
    return;
  }
  box.innerHTML = '<div class="hsec">📁 NAS 파일 ' + r['찾은수'].toLocaleString('ko-KR') + '건'
    + (r['더있음'] ? ' <span class="fmeta">(앞의 ' + r['보여준수'] + '건만 표시)</span>' : '')
    + (r['중간에멈춤'] ? ' <span class="fmeta">· 파일이 많아 도중에 멈췄습니다 — '
        + 'scan.sh 를 작업 스케줄러에 걸어두면 즉시 찾습니다</span>' : '')
    + '</div><div class="flist">' + r.hits.map(nasHitRow).join('') + '</div>';
}

function renderSearch(){
  const q = searchQuery.trim().toLowerCase();
  const groups = [];
  scheduleNasSearch(searchQuery.trim());

  data.brands.forEach(b => {
    const hits = [];
    ITEM_KEYS.forEach(type => {
      b[type].forEach(it => {
        const hay = [it.title, it.desc, it.note, it.body, it.tool, it.kind, it.tag, it.url,
                     it.why, it.result, it.next, it.owner, it.status]
          .filter(Boolean).join(' ').toLowerCase();
        if(hay.includes(q)) hits.push({ type, it });
      });
    });
    if((b.masterPrompt || '').toLowerCase().includes(q)){
      hits.push({ type:'prompt', it:{ title:'마스터프롬프트', body:b.masterPrompt } });
    }
    if(hits.length) groups.push({ b, hits });
  });

  const total = groups.reduce((a, g) => a + g.hits.length, 0);
  const main = document.getElementById('main');

  if(!total){
    main.innerHTML = '<div class="panel"><div class="tabbody">'
      + '<div class="empty">대시보드에 등록된 것 중에는 "' + esc(searchQuery)
      + '" 이(가) 없습니다.</div>'
      + '<div id="nasSearchBox"></div></div></div>';
    paintNasSearch();
    return;
  }

  main.innerHTML = '<div class="panel"><div class="tabbody">'
    + '<div class="sec-bar"><strong>검색 결과 ' + total + '건</strong>'
    + '<span class="hint">항목을 클릭하면 해당 브랜드로 이동합니다</span>'
    + '<button class="btn sm" style="margin-left:auto" onclick="clearSearch()">검색 해제</button></div>'
    + groups.map(g => '<div class="sr-group">'
        + '<div class="sr-head"><span>' + esc(g.b.icon) + '</span>' + esc(g.b.name)
        + '<span class="chip">' + g.hits.length + '</span></div>'
        + g.hits.map(h => {
            const tabKey = h.type === 'prompt' ? 'prompt' : h.type;
            const label = h.type === 'prompt' ? '✨ 마스터프롬프트'
                        : TYPES[h.type].icon + ' ' + TYPES[h.type].label;
            const ctx = (h.it.desc || h.it.note || h.it.body || h.it.result || '').slice(0, 140);
            return '<div class="sr-item" onclick="gotoResult(\'' + g.b.id + '\',\'' + tabKey + '\')">'
              + '<div class="t">' + highlight(h.it.title, searchQuery) + '</div>'
              + '<div class="c">' + label + (ctx ? ' · ' + highlight(ctx, searchQuery) : '') + '</div>'
              + '</div>';
          }).join('')
        + '</div>').join('')
    + '<div id="nasSearchBox"></div>'
    + '</div></div>';
  paintNasSearch();
}

/* ========================= 항목 (자동화·히스토리·자료) ========================= */
let itemType = null;

/* 이 종류의 항목이 어디에 담겨 있는지.
   회의록·달력 일정은 브랜드 밖(팀 전체)에 있습니다. */
/* 어느 목록을 고칠 것인가.
   브랜드 밖 화면(업무 → 마케팅 비용)에서는 브랜드를 직접 알려줍니다. */
function listOf(type, brandId){
  if(TOP_LISTS.indexOf(type) >= 0){
    if(!Array.isArray(data[type])) data[type] = [];
    return data[type];
  }
  const b = brandId ? data.brands.find(x => x.id === brandId) : currentBrand();
  if(!b) return null;
  if(!Array.isArray(b[type])) b[type] = [];
  return b[type];
}

/* 지금 상황에서 실제로 보여줄 칸들 (계정을 쓸 때만 나오는 칸이 있습니다) */
function itemFields(t){ return t.fields.filter(f => !f.when || f.when()); }

let itemBrandId = '';     // 브랜드 밖 화면에서 고칠 때 어느 브랜드인지

function openItemModal(type, id, preset, brandId){
  const arr = listOf(type, brandId);
  if(!arr) return;
  itemType = type;
  itemBrandId = brandId || '';
  const t = TYPES[type];
  const it = id ? arr.find(x => x.id === id) : null;
  editing = it ? { type, id } : null;

  document.getElementById('itemModalTitle').textContent =
    t.label + (it ? ' 수정' : ' 추가');

  document.getElementById('itemFields').innerHTML = itemFields(t).map(f => {
    // 값을 정하는 순서: 고치는 항목 → 눌러서 넘겨준 값(preset) → 기본값
    let v = it ? (it[f.key] || '') : '';
    if(!it && preset && preset[f.key] != null) v = preset[f.key];
    else if(!it && !v && f.def) v = f.def();
    else if(!it && !v && f.type === 'date' && !f.noDefault) v = todayStr();

    const lab = '<label>' + f.label + (f.required ? ' *' : '') + '</label>';
    if(f.type === 'select'){
      // 고를 것은 '글자' 또는 {value, label} 둘 다 받습니다
      let opts = (typeof f.options === 'function' ? f.options() : f.options)
        .map(o => (o && typeof o === 'object') ? o : { value:o, label:o });
      // 지금 값이 목록에 없으면(브랜드 이름이 바뀌었다든지) 그 값도 넣어 둡니다.
      // 안 그러면 창을 열었다 저장하는 것만으로 값이 조용히 바뀝니다.
      if(v && !opts.some(o => o.value === v)) opts = [{ value:v, label:v }].concat(opts);
      return lab + '<select id="f_' + f.key + '">'
        + opts.map(o => '<option' + (o.value === v ? ' selected' : '') + ' value="' + esc(o.value) + '">'
            + (o.label === '' ? '— 없음 —' : esc(o.label)) + '</option>').join('')
        + '</select>';
    }
    if(f.type === 'textarea'){
      return lab + '<textarea id="f_' + f.key + '" placeholder="' + esc(f.ph || '') + '">'
        + esc(v) + '</textarea>';
    }
    return lab + '<input type="' + (f.type === 'date' ? 'date' : 'text') + '" id="f_' + f.key + '" '
      + 'value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">';
  }).join('');

  // 지우기 단추는 고칠 때만 보입니다
  const del = document.getElementById('itemDelBtn');
  if(del){
    del.style.display = it ? '' : 'none';
    const delBid = brandId || '';
    del.onclick = () => { closeModal('itemModal'); deleteItem(type, id, delBid); };
  }

  document.getElementById('itemModal').classList.add('open');
  // 새로 넣는 경우엔 첫 칸에 바로 쓸 수 있게 해 둡니다
  if(!it){
    const first = document.querySelector('#itemFields input,#itemFields textarea');
    if(first) first.focus();
  }
}

function submitItem(){
  const arr = listOf(itemType, itemBrandId);
  if(!arr) return;
  const t = TYPES[itemType];
  const payload = {};
  for(const f of itemFields(t)){
    const el = document.getElementById('f_' + f.key);
    if(!el) continue;
    const v = el.value.trim();
    if(f.required && !v){ toast('⚠️ ' + f.label + '을(를) 입력해 주세요'); return; }
    payload[f.key] = v;
  }
  // 할 일은 맡은 사람 이름도 같이 적어둡니다 (계정을 안 쓰게 되어도 남게)
  if(itemType === 'tasks' && authOn()){
    payload.owner = payload.uid ? (peopleName(payload.uid) || payload.owner || '') : '';
  }
  // 끝나는 날이 시작보다 앞이면 잘못 고른 것입니다
  if(payload.until && payload.date && payload.until < payload.date){
    toast('⚠️ 끝나는 날이 시작하는 날보다 앞입니다');
    return;
  }
  const target = editing ? arr.find(x => x.id === editing.id) : null;
  if(editing && !target){
    // 내가 수정창을 열어둔 사이에 다른 분이 이 항목을 지웠습니다.
    // 쓴 내용이 사라지지 않게 새 항목으로 넣어드립니다.
    arr.unshift(Object.assign({ id: uid('i'),
      updatedAt: new Date().toISOString() }, payload));
    editing = null;
    closeModal('itemModal');
    render(); markDirty();
    toast('다른 분이 이 항목을 지워서, 새 항목으로 넣었습니다');
    return;
  }
  if(editing){
    Object.assign(target, payload, { updatedAt: new Date().toISOString() });
  }else{
    const item = Object.assign({ id: uid('i'), updatedAt: new Date().toISOString() }, payload);
    // 여정은 시간 순으로 읽어야 하므로 아래에 쌓고, 나머지는 최신이 위로 옵니다
    if(itemType === 'history') arr.push(item);
    else arr.unshift(item);
  }
  editing = null;
  closeModal('itemModal');
  render(); markDirty(itemBrandId || undefined);
}

/* ═══════════════ 휴지통 (대시보드에서 지운 것) ═══════════════════
   실수로 지우는 일이 제일 무섭습니다. 그래서 브랜드·자료·할 일·회의록·
   일정·채널·도구 — 무엇을 지우든 **한 번은 휴지통을 거칩니다.**
   되돌리면 있던 자리로 그대로 돌아갑니다.

   · 30일이 지나거나 200개가 넘으면 오래된 것부터 저절로 비워집니다
   · 휴지통은 브랜드 자료에 같이 저장되어 **팀 전체가 같이** 봅니다
   · NAS 폴더에서 지운 파일은 예전부터 NAS 휴지통으로 갑니다 (따로 있습니다)
   ================================================================= */
const TRASH_DAYS = 30;
const TRASH_MAX  = 200;

function trashBox(){
  if(!Array.isArray(data.trash)) data.trash = [];
  return data.trash;
}

/* 오래된 것과 넘치는 것을 치웁니다 (지울 때마다 한 번씩) */
function trashTidy(){
  const box = trashBox();
  const cut = Date.now() - TRASH_DAYS * 86400000;
  let out = box.filter(t => {
    const at = new Date(t.지운때 || 0).getTime();
    return !at || at > cut;
  });
  if(out.length > TRASH_MAX) out = out.slice(0, TRASH_MAX);
  if(out.length !== box.length) data.trash = out;
}

/* 지운 것을 담아둡니다 */
function trashPut(kind, label, payload, where){
  const box = trashBox();
  box.unshift({
    id: uid('t'),
    종류: kind,                    // '브랜드' · '자료' · '할 일' …
    이름: String(label || '(이름 없음)'),
    지운때: new Date().toISOString(),
    지운사람: myName(),
    담긴곳: where,                 // {kind:'brand'} | {kind:'item', type, brandId}
    내용: payload
  });
  trashTidy();
}

function trashLabel(t){
  const b = t.담긴곳 && t.담긴곳.brandId
    ? (data.brands.find(x => x.id === t.담긴곳.brandId) || {}).name : '';
  return (b ? b + ' · ' : '') + t.종류;
}

/* 되돌리기 — 있던 자리로 그대로 넣습니다 */
function trashRestore(tid){
  const box = trashBox();
  const t = box.find(x => x.id === tid);
  if(!t){ render(); return; }
  const w = t.담긴곳 || {};

  if(w.kind === 'brand'){
    if(data.brands.some(x => x.id === t.내용.id)){
      toast('⚠️ 같은 브랜드가 이미 있습니다'); return;
    }
    data.brands.push(t.내용);
    deletedIds.delete(t.내용.id);
  }else if(w.kind === 'board'){
    if(!Array.isArray(data.boards)) data.boards = [];
    if(data.boards.some(x => x.id === t.내용.id)){ toast('⚠️ 같은 판이 이미 있습니다'); return; }
    data.boards.unshift(t.내용);
    deletedIds.delete(t.내용.id);
  }else if(w.kind === 'gbboard'){
    if(!Array.isArray(data.growth)) data.growth = [];
    if(data.growth.some(x => x.id === t.내용.id)){ toast('⚠️ 같은 보드가 이미 있습니다'); return; }
    data.growth.push(t.내용);
    deletedIds.delete(t.내용.id);
  }else if(w.kind === 'gbstage' || w.kind === 'gbitem'){
    const g = (data.growth || []).find(x => x.id === w.boardId);
    if(!g){
      alert('되돌릴 자리를 찾지 못했습니다.\n\n그 사람의 그 해 보드가 지워졌습니다.');
      return;
    }
    if(w.kind === 'gbstage'){
      g.stages = g.stages || [];
      if(g.stages.some(x => x.id === t.내용.id)){ toast('⚠️ 이미 있습니다'); return; }
      g.stages.push(t.내용);
    }else{
      const st = (g.stages || []).find(x => x.id === w.stageId);
      if(!st){
        alert('되돌릴 자리를 찾지 못했습니다.\n\n그 단계가 지워졌습니다. 단계를 먼저 되돌려 주세요.');
        return;
      }
      st.items = st.items || [];
      if(st.items.some(x => x.id === t.내용.id)){ toast('⚠️ 이미 있습니다'); return; }
      st.items.push(t.내용);
    }
    deletedIds.delete(t.내용.id);
  }else{
    const arr = listOf(w.type, w.brandId);
    if(!arr){
      alert('되돌릴 자리를 찾지 못했습니다.\n\n'
        + '그 브랜드가 지워졌을 수 있습니다. 브랜드를 먼저 되돌려 주세요.');
      return;
    }
    if(arr.some(x => x.id === t.내용.id)){ toast('⚠️ 이미 있습니다'); return; }
    arr.unshift(t.내용);
    deletedIds.delete(t.내용.id);      // 합칠 때 다시 지워지지 않게
  }
  data.trash = box.filter(x => x.id !== tid);
  markDirtyAll();
  render();
  toast('↩︎ 「' + t.이름 + '」 을(를) 되돌렸습니다');
}

/* 휴지통에서도 없애기 (이건 진짜 끝입니다) */
function trashDrop(tid){

    + '이건 되돌릴 수 없습니다.')) return;

function deleteItem(type, id, brandId){
  const arr = listOf(type, brandId);
  if(!arr) return;
  const it = arr.find(x => x.id === id);
  if(!it){ render(); return; }          // 이미 다른 분이 지웠습니다
  if(!confirm('"' + it.title + '" 항목을 삭제할까요?\n\n'
    + '휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 되돌릴 수 있습니다.')) return;
  const bid = brandId || (TOP_LISTS.indexOf(type) >= 0 ? '' : currentBrandId);
  trashPut((TYPES[type] && TYPES[type].label) || type, it.title, it,
           { kind:'item', type: type, brandId: bid });

  deletedIds.add(id);
  render(); markDirtyAll();            // 휴지통도 같이 저장되어야 합니다

}

/* ========================= 저장 / 불러오기 =========================
   내용을 고치면 잠시 뒤 자동으로 저장됩니다.
   [저장] 버튼은 지금 바로 저장하고 싶을 때 쓰시면 됩니다. (Ctrl+S 도 동일)
   ================================================================== */
let saveTimer = null;     // 자동 저장 예약
let saving = false;       // 저장이 진행 중인지
let saveAgain = false;    // 저장 중에 또 바뀌었는지

/* 여러 명이 같이 쓰기 때문에, 내가 무엇을 고쳤는지 기억해 둡니다.
   다른 사람이 먼저 저장했을 때 '내가 고친 것만' 얹어서 합치기 위해서입니다. */
const dirtyBrands = new Set();   // 내가 내용을 고친 브랜드
let dirtyGlobal = false;         // 브랜드를 더하거나 지우거나 순서를 바꿨는지

/* ═══════════════ 되돌리기 (Ctrl+Z) ═══════════════════════════════
   고치기 직전의 모습을 차곡차곡 쌓아둡니다.
   실수로 지웠어도 Ctrl+Z 한 번이면 돌아옵니다.
   빠르게 이어지는 변경(글자 치기 등)은 한 덩어리로 묶습니다.
   ================================================================= */
const UNDO_MAX  = 30;                  // 몇 걸음까지 되돌릴 수 있나
const UNDO_CAP  = 4 * 1024 * 1024;     // 자료가 이보다 크면 쌓지 않습니다
let undoStack = [], redoStack = [];
let baseSnap = null, snapTimer = null;

function refreshSnap(){
  try{
    const j = JSON.stringify(data);
    baseSnap = j.length > UNDO_CAP ? null : j;
  }catch(e){ baseSnap = null; }
}
let undoing = false;          // 되돌리는 중에는 새 걸음을 쌓지 않습니다

function pushUndo(){
  if(undoing) return;         // (안 그러면 되돌리기가 스스로를 덮어씁니다)
  if(baseSnap === null){ refreshSnap(); return; }
  // 직전 상태를 쌓습니다 (markDirty 는 고친 뒤에 불리므로 baseSnap 이 '고치기 전' 입니다)
  if(undoStack[undoStack.length - 1] !== baseSnap){
    undoStack.push(baseSnap);
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    redoStack.length = 0;
  }
  clearTimeout(snapTimer);
  snapTimer = setTimeout(refreshSnap, 500);   // 잠잠해지면 새 기준으로
}

/* 되돌린 뒤에도 판번호는 지금 것을 씁니다 (다른 분 저장을 덮지 않게) */
function applySnap(json){
  const rev = data._rev;
  const saved = data.savedAt;
  undoing = true;
  try{
    data = normalize(JSON.parse(json));
    data._rev = rev;
    data.savedAt = saved;
    clearTimeout(snapTimer);
    refreshSnap();
    markDirtyAll();
  }finally{ undoing = false; }
  render();
}

function undoStep(){
  if(!undoStack.length){ toast('되돌릴 것이 없습니다'); return; }
  try{ redoStack.push(JSON.stringify(data)); }catch(e){}
  applySnap(undoStack.pop());
  toast('↩︎ 되돌렸습니다 (' + undoStack.length + '걸음 더 가능)');
}
function redoStep(){
  if(!redoStack.length){ toast('다시 할 것이 없습니다'); return; }
  try{ undoStack.push(JSON.stringify(data)); }catch(e){}
  applySnap(redoStack.pop());
  toast('↪︎ 다시 했습니다 (' + redoStack.length + '번 더 가능)');
}

/* ═══════════════ 저장 방식 ═══════════════════════════════════════
   자동: 고치면 1.2초 뒤 알아서 저장합니다 (팀원들에게 바로 보입니다)
   수동: [저장] 을 눌러야 저장합니다 (실수한 것이 바로 안 퍼집니다)
   ================================================================= */
let autoSave = true;
try{ autoSave = localStorage.getItem('brandHubAutoSave') !== 'off'; }catch(e){}

function toggleAutoSave(){
  autoSave = !autoSave;
  try{ localStorage.setItem('brandHubAutoSave', autoSave ? 'on' : 'off'); }catch(e){}
  if(autoSave && dirtyBrands.size) saveAll(true);
  render();
  toast(autoSave ? '💾 자동 저장으로 바꿨습니다'
                 : '✋ 이제 [저장] 을 눌러야 저장됩니다');
}

function markDirty(brandId){
  pushUndo();
  const id = brandId || currentBrandId;
  if(id) dirtyBrands.add(id);
  // 브랜드에 속하지 않은 수정(회의록·달력 …)은 「전체가 바뀌었다」 로 둡니다.
  // 이게 없으면 아직 저장되기 전에 실시간 동기화가 서버 것으로 통째로 갈아끼워
  // 방금 넣은 내용이 사라집니다. (붙여넣은 AI 정리가 0.6초 뒤 사라지던 문제)
  else dirtyGlobal = true;
  setSaveState(autoSave ? 'dirty' : 'hold');
  clearTimeout(saveTimer);
  if(autoSave) saveTimer = setTimeout(() => saveAll(true), 1200);
}

/* 브랜드 목록 자체가 바뀐 경우 (추가·삭제·순서) */
function markDirtyAll(){
  dirtyGlobal = true;
  markDirty();
}

const MERGE_LISTS = ITEM_KEYS.concat(['tools', 'channels', 'docs']);
const TOP_LISTS   = ['onboard', 'notices', 'meetings', 'events', 'trash', 'growth', 'boards',
                     'gbkpis', 'gbperf', 'cards', 'pages'];  // 브랜드 밖
const deletedIds = new Set();    // 내가 지운 항목 (합칠 때 되살아나지 않게)
let baseIds = new Map();         // 불러온 시점의 항목들 (id → 그때 내용의 지문)
let revived  = 0;                // 되살린 개수 (알려주기 위해)

/* 내용이 바뀌었는지 빠르게 비교하기 위한 짧은 지문입니다 */
function sigOf(o){
  const t = JSON.stringify(o);
  let h = 0;
  for(let i = 0; i < t.length; i++){ h = (h * 31 + t.charCodeAt(i)) | 0; }
  return t.length + ':' + h;
}

/* 불러온(또는 방금 저장한) 시점의 상태를 적어 둡니다.
   "서버엔 없고 내게만 있는 것" 이 나왔을 때
   내가 만든 것인지 / 내가 고친 것인지 / 남이 지운 것인지 구별하려는 것입니다. */
function snapshotIds(d){
  const m = new Map();
  TOP_LISTS.forEach(k => ((d && d[k]) || []).forEach(x => {
    if(x && x.id) m.set(x.id, sigOf(x));
  }));
  (d && d.brands || []).forEach(b => {
    m.set(b.id, sigOf(Object.assign({}, b, { automations:0, history:0, assets:0,
      tasks:0, links:0, tools:0, channels:0, _conflicts:0 })));
    m.set(b.id + ':prompt', sigOf(b.masterPrompt || ''));
    m.set(b.id + ':chartfix', JSON.stringify(b.chartFix || {}));   // 지문이 아니라 원본
    m.set(b.id + ':book', JSON.stringify(b.book || {}));           // 「지금」 칸도 칸 단위로
    m.set(b.id + ':histnow', sigOf((b.hist && b.hist.now) || ''));
    // 온보딩 — 글 칸은 칸별로, 목록은 한 건씩 (통째로 덮으면 상대가 쓴 것이 사라집니다)
    const P0 = (b.path && typeof b.path === 'object' && !Array.isArray(b.path)) ? b.path : {};
    const F0 = (P0.first && typeof P0.first === 'object' && !Array.isArray(P0.first))
      ? P0.first : {};
    m.set(b.id + ':pwhat', sigOf(String(P0.what || '')));
    m.set(b.id + ':psum',  sigOf(String(P0.summary || '')));
    m.set(b.id + ':pgoal', sigOf(String(F0.goal || '')));
    ['chapters', 'rules', 'who'].forEach(k => (Array.isArray(P0[k]) ? P0[k] : [])
      .forEach(x => { if(x && x.id) m.set(x.id, sigOf(x)); }));
    (Array.isArray(F0.steps) ? F0.steps : []).forEach(x => {
      if(x && x.id) m.set(x.id, sigOf(x));
    });
    ((b.hist && b.hist.recs) || []).forEach(x => {                 // 연혁 마디도 한 건씩
      if(x && x.id) m.set(x.id, sigOf(x));
    });
    MERGE_LISTS.forEach(k => (b[k] || []).forEach(x => {
      if(x && x.id) m.set(x.id, sigOf(x));
    }));
  });
  return m;
}

/* 서버엔 없고 내 화면에만 있는 것 → 남겨야 하나?
     · 불러온 뒤 내가 만든 것        → 남깁니다
     · 내가 내용을 고친 것            → 남깁니다 (쓴 것을 버리지 않습니다)
     · 손대지 않은 채 남이 지운 것   → 뺍니다                                */
function keepMine(id, obj){
  if(!baseIds.has(id)) return true;                     // 내가 새로 만든 것
  if(obj && sigOf(obj) !== baseIds.get(id)){            // 내가 고친 것
    revived++;
    return true;
  }
  return false;                                         // 남이 지운 것
}

/* 브랜드 하나를 합칩니다.
   같은 브랜드를 둘이 동시에 고쳐도, 항목을 하나씩 대조해서 둘 다 남깁니다.
     · 서버에만 있는 것  → 그대로 둡니다 (다른 사람이 방금 넣은 것)
     · 내가 고친 것      → 내 것으로 바꿉니다
     · 내가 지운 것      → 뺍니다
     · 내가 새로 만든 것 → 넣습니다                                        */
/* 같은 것을 둘이 동시에 고쳤을 때, 상대 내용을 버리지 않고 따로 챙겨둡니다.
   (화면에 "같이 고친 것이 있습니다" 로 뜨고, 눌러서 확인·복사할 수 있습니다) */
let clashed = 0;
let clashedTop = 0;   // 회의록·일정이 겹친 횟수 (따로 알려줍니다)
function stashClash(out, what, mineObj, srvObj){
  const list = (out._conflicts || []).slice(0, 19);
  const sig  = sigOf(srvObj);
  // 저장이 여러 번 겹치면 같은 내용이 두 번 쌓일 수 있어 한 번만 남깁니다
  if(list.some(c => c['무엇'] === what && sigOf(c['상대내용']) === sig)){
    out._conflicts = list;
    return;
  }
  list.unshift({ id: uid('cf'), 무엇: what, 시각: new Date().toISOString(),
                 상대내용: srvObj, 내내용: mineObj });
  out._conflicts = list;
  clashed++;
}

/* 고친 문의 숫자 합치기 (달 칸 하나하나가 독립입니다)
     · 내가 바꾼 칸(넣었든 지웠든) → 내 것
     · 내가 안 건드린 칸           → 상대 것                              */
function mergeChartFix(mineB, srvB){
  const mine = mineB.chartFix || {};
  const srv  = srvB.chartFix  || {};
  let base = {};
  try{ base = JSON.parse(baseIds.get(mineB.id + ':chartfix') || '{}'); }catch(e){}

  const out = Object.assign({}, srv);
  Object.keys(mine).forEach(k => {
    if(mine[k] !== base[k]) out[k] = mine[k];        // 내가 넣거나 바꾼 칸
  });
  Object.keys(base).forEach(k => {
    if(!(k in mine)) delete out[k];                  // 내가 지운 칸
  });
  return out;
}

/* 칸 단위 합치기 — 내가 만진 칸만 내 값으로 얹습니다 (chartFix 와 같은 규칙) */
function mergeKeyed(mine, srv, baseKey){
  mine = mine && typeof mine === 'object' && !Array.isArray(mine) ? mine : {};
  srv  = srv  && typeof srv  === 'object' && !Array.isArray(srv)  ? srv  : {};
  let base = {};
  try{ base = JSON.parse(baseIds.get(baseKey) || '{}'); }catch(e){}
  const out = Object.assign({}, srv);
  Object.keys(mine).forEach(k => { if(mine[k] !== base[k]) out[k] = mine[k]; });
  Object.keys(base).forEach(k => { if(!(k in mine)) delete out[k]; });
  return out;
}

/* 목록 하나를 id 기준으로 합칩니다 — 내가 지운 것은 빼고, 내가 새로 만든 것은 더합니다 */
function mergeList(mineArr, srvArr){
  mineArr = Array.isArray(mineArr) ? mineArr : [];
  srvArr  = Array.isArray(srvArr)  ? srvArr  : [];
  const mineById = new Map(mineArr.map(x => [x.id, x]));
  const srvIds   = new Set(srvArr.map(x => x.id));
  const res = [];
  srvArr.forEach(sv => {
    if(deletedIds.has(sv.id)) return;            // 내가 지운 것
    res.push(mineById.get(sv.id) || sv);         // 둘 다 고쳤으면 내 것
  });
  mineArr.forEach((m, i) => {
    if(srvIds.has(m.id)) return;
    if(!keepMine(m.id, m)) return;               // 손 안 댄 채 남이 지운 것
    if(i === 0) res.unshift(m); else res.push(m);
  });
  return res;
}

/* 온보딩 합치기 — 여기도 통째로 덮으면 안 됩니다.
   둘이 같은 브랜드의 다른 단을 채웠을 때 한쪽이 사라지기 때문입니다. */
function mergePath(mineB, srvB){
  const obj = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  const mp = obj(mineB.path), sp = obj(srvB.path);
  const out = Object.assign({}, sp, mp);
  /* 올린 파일 목록만 한 건씩 맞춥니다 — 통째로 덮으면 둘이 같은 브랜드를
     만졌을 때 상대가 올린 것이 사라집니다. */
  out.docs = mergeList(mp.docs, sp.docs);
  return out;
}

/* 연혁 합치기 — 마디는 한 건씩, 한 줄 정의는 내가 바꿨을 때만.
   통째로 덮으면 둘이 같은 브랜드를 만졌을 때 상대가 남긴 마디가 사라집니다. */
function mergeHist(mineB, srvB){
  const mh = (mineB.hist && typeof mineB.hist === 'object' && !Array.isArray(mineB.hist))
    ? mineB.hist : {};
  const sh = (srvB.hist && typeof srvB.hist === 'object' && !Array.isArray(srvB.hist))
    ? srvB.hist : {};
  const out = Object.assign({}, sh, mh);

  const mineArr = Array.isArray(mh.recs) ? mh.recs : [];
  const srvArr  = Array.isArray(sh.recs) ? sh.recs : [];
  const mineById = new Map(mineArr.map(x => [x.id, x]));
  const srvIds   = new Set(srvArr.map(x => x.id));
  const res = [];
  srvArr.forEach(sv => {
    if(deletedIds.has(sv.id)) return;            // 내가 지운 마디
    res.push(mineById.get(sv.id) || sv);         // 둘 다 고쳤으면 내 것
  });
  mineArr.forEach((m, i) => {
    if(srvIds.has(m.id)) return;
    if(!keepMine(m.id, m)) return;               // 손 안 댄 채 남이 지운 것
    if(i === 0) res.unshift(m); else res.push(m);
  });
  out.recs = res;

  // 한 줄 정의 — 내가 바꾸지 않았으면 서버 것을 씁니다
  const base = baseIds.get(mineB.id + ':histnow');
  const mineNow = String(mh.now || ''), srvNow = String(sh.now || '');
  out.now = (base !== undefined && sigOf(mineNow) === base) ? srvNow : mineNow;
  return out;
}

function mergeBrand(mineB, srvB){
  const out = Object.assign({}, srvB, mineB);
  out._conflicts = (mineB._conflicts || srvB._conflicts || []).slice();

  // 마스터프롬프트를 둘이 같은 시간에 고쳤으면, 상대 글도 챙겨둡니다
  const baseSig = baseIds.get(mineB.id + ':prompt');
  const mineP = mineB.masterPrompt || '', srvP = srvB.masterPrompt || '';
  if(mineP !== srvP && baseSig !== undefined
     && sigOf(srvP) !== baseSig && sigOf(mineP) !== baseSig){
    stashClash(out, '마스터프롬프트', mineP, srvP);
  }

  // 고친 문의 숫자는 칸 단위로 합칩니다.
  // 내가 손댄 칸은 내 값, 손대지 않은 칸은 상대 값 — 서로 다른 달을 고쳤으면 둘 다 남습니다.
  out.chartFix = mergeChartFix(mineB, srvB);

  // 「지금」 칸도 같은 규칙 — 내가 만진 칸만 내 값으로 얹습니다.
  // (통째로 덮으면, 둘이 다른 축을 채웠을 때 한쪽이 사라집니다)
  out.book = mergeKeyed(mineB.book, srvB.book, mineB.id + ':book');

  // 연혁 — 마디는 한 건씩 합치고, 한 줄 정의는 내가 바꿨을 때만 내 것을 씁니다
  out.hist = mergeHist(mineB, srvB);

  // 온보딩 — 단마다 따로 합칩니다 (통째로 덮으면 상대가 쓴 단이 사라집니다)
  out.path = mergePath(mineB, srvB);

  MERGE_LISTS.forEach(k => {
    const mineArr = Array.isArray(mineB[k]) ? mineB[k] : [];
    const srvArr  = Array.isArray(srvB[k])  ? srvB[k]  : [];
    const mineById = new Map(mineArr.map(x => [x.id, x]));
    const srvIds   = new Set(srvArr.map(x => x.id));

    const res = [];
    srvArr.forEach(sv => {
      if(deletedIds.has(sv.id)) return;                 // 내가 지운 것
      const mi = mineById.get(sv.id);
      if(mi){
        // 둘 다 고쳤으면 내 것을 쓰되, 상대 것을 버리지 않고 챙겨둡니다
        const base = baseIds.get(sv.id);
        if(base !== undefined && sigOf(sv) !== base && sigOf(mi) !== base
           && sigOf(sv) !== sigOf(mi)){
          stashClash(out, (TYPES[k] ? TYPES[k].label : k) + ' — ' + (mi.title || mi.name || ''),
                     mi, sv);
        }
      }
      res.push(mi || sv);
    });
    mineArr.forEach((m, i) => {
      if(srvIds.has(m.id)) return;
      if(!keepMine(m.id, m)) return;     // 손 안 댄 채 남이 지운 것 → 되살리지 않습니다
      if(i === 0) res.unshift(m); else res.push(m);   // 내가 새로 만든 것
    });
    out[k] = res;
  });
  return out;
}

/* 서버에 있는 내용 위에 '내가 고친 것' 만 얹습니다.
   서로 다른 브랜드를 만졌으면 둘 다 그대로 남습니다. */
function mergeWithServer(server){
  if(!server || !Array.isArray(server.brands)) return data;
  const mine = data;
  const byId = id => mine.brands.find(x => x.id === id);

  const srvById = id => server.brands.find(x => x.id === id);
  let brands;
  if(dirtyGlobal){
    // 목록 구성(있고 없고, 순서)은 내 화면을 따르고,
    // 내가 안 건드린 브랜드의 내용은 서버 것을 씁니다.
    brands = mine.brands.map(b => {
      const sv = srvById(b.id);
      if(!sv){                                            // 서버에 없는 브랜드
        const shallow = Object.assign({}, b, { automations:0, history:0, assets:0,
          tasks:0, links:0, tools:0, channels:0, _conflicts:0 });
        return keepMine(b.id, shallow) ? b : null;
      }
      return dirtyBrands.has(b.id) ? mergeBrand(b, sv) : sv;
    }).filter(Boolean);
  }else{
    // 목록은 서버 것을 따르고, 내가 고친 브랜드만 항목 단위로 합칩니다.
    brands = server.brands.map(sv => {
      const m = byId(sv.id);
      return (m && dirtyBrands.has(sv.id)) ? mergeBrand(m, sv) : sv;
    });
    mine.brands.forEach(m => {
      const shallow = Object.assign({}, m, { automations:0, history:0, assets:0,
        tasks:0, links:0, tools:0, channels:0, _conflicts:0 });
      if(dirtyBrands.has(m.id) && keepMine(m.id, shallow) && !brands.some(x => x.id === m.id))
        brands.push(m);
    });
  }

  const merged = Object.assign({}, server, mine, { brands: brands });

  // 회의록·달력 일정은 브랜드 밖에 있어 따로 합칩니다 (같은 규칙)
  TOP_LISTS.forEach(k => {
    const mineArr = Array.isArray(mine[k]) ? mine[k] : [];
    const srvArr  = Array.isArray(server[k]) ? server[k] : [];
    const mineById = new Map(mineArr.map(x => [x.id, x]));
    const srvIds   = new Set(srvArr.map(x => x.id));
    const res = [];
    const extra = [];
    srvArr.forEach(sv => {
      if(deletedIds.has(sv.id)) return;
      const mi = mineById.get(sv.id);
      // 같은 회의록·일정을 둘이 같은 시간에 고쳤으면, 내 것을 쓰되
      // 상대가 쓴 것도 버리지 않고 별도 항목으로 남겨둡니다
      // 제목이 있는 것(회의록·일정)만 따로 남깁니다.
      // 휴지통·그로스보드는 제목이 없어서 「(제목 없음)」 짝퉁이 생기고,
      // 보드는 사람·연도로 찾기 때문에 둘이 되면 한쪽이 안 보입니다.
      if(mi && sv.title !== undefined){
        const base = baseIds.get(sv.id);
        if(base !== undefined && sigOf(sv) !== base && sigOf(mi) !== base
           && sigOf(sv) !== sigOf(mi)){
          extra.push(Object.assign({}, sv, {
            id: uid('i'),
            title: (sv.title || '(제목 없음)') + ' — 같은 시간에 다른 사람이 고친 것'
          }));
          clashedTop++;
        }
      }
      res.push(mi || sv);
    });
    extra.forEach(x => res.push(x));
    const put = new Set(res.map(x => x.id));
    mineArr.forEach((m, i) => {
      if(srvIds.has(m.id) || put.has(m.id) || !keepMine(m.id, m)) return;
      put.add(m.id);
      if(i === 0) res.unshift(m); else res.push(m);
    });
    merged[k] = res;
  });

  merged._rev = server._rev;
  return merged;
}

function setSaveState(state){
  const el = document.getElementById('saveState');
  if(!el) return;
  const map = {
    dirty:  ['●', '수정됨', '',    '잠시 뒤 자동으로 저장됩니다'],
    hold:   ['✋', '저장 안 함', 'err', '[💾 저장] 을 눌러야 팀원들에게 보입니다'],
    saving: ['◌', '저장 중…', '',  '저장하고 있습니다'],
    saved:  ['✓', '저장됨', 'ok',  'NAS에 저장되어 있습니다'],
    failed: ['⚠', '저장 실패', 'err', '아래 빨간 띠의 내용을 확인해 주세요']
  };
  const [ic, txt, cls, tip] = map[state] || map.saved;
  el.className = 'savestate ' + cls;
  el.textContent = ic + ' ' + txt;
  el.title = tip || '';
}

async function saveAll(silent){
  if(saving){ saveAgain = true; return; }   // 겹쳐 저장하지 않습니다
  clearTimeout(saveTimer);

  // 불러오기가 실패했으면 NAS 에 쓰지 않습니다.
  // 잘못하면 다른 사람들 자료를 빈 값으로 덮어쓰게 됩니다.
  if(saveBlocked){
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    setSaveState('failed');
    showError('NAS에서 자료를 불러오지 못한 상태입니다.\n\n'
      + '이대로 저장하면 다른 분들 자료를 덮어쓸 수 있어 저장하지 않았습니다.\n'
      + '고친 내용은 이 브라우저에 임시 보관했습니다. 새로고침(F5) 해 주세요.');
    return;
  }

  saving = true;
  setSaveState('saving');
  data.savedAt = new Date().toISOString();
  data.schema = SCHEMA;

  try{
    let tries = 0, mergedOnce = false;
    for(;;){
      try{
        const payload = Object.assign({}, data,
          { _baseRev: data._rev || 0, _lastBy: myName() });
        await storageSave(payload);
        break;
      }catch(e){
        if(!e.conflict || ++tries > 3) throw e;
        // 다른 사람이 먼저 저장했습니다 → 그 내용 위에 내 것만 얹어서 다시 시도
        revived = 0; clashed = 0; clashedTop = 0; mergedOnce = true;
        data = normalize(mergeWithServer(e.server));
        data._rev = e.rev;
        baseIds = snapshotIds(e.server);   // 서버 것이 새 기준입니다
        data.savedAt = new Date().toISOString();
        if(clashed) toast('⚠️ 같은 것을 다른 분과 동시에 고쳤습니다 — 아래 띠에서 확인하세요');
        else if(clashedTop) toast('⚠️ 같은 회의록·일정을 다른 분과 동시에 고쳤습니다 '
                                  + '— 상대가 쓴 것도 바로 아래에 따로 남겨뒀습니다');
        else if(revived) toast('다른 분이 지운 항목이지만, 고치신 내용이 있어 살려뒀습니다');
        else if(!silent) toast('다른 분이 저장한 내용과 합치는 중…');
      }
    }
    dirtyBrands.clear();
    deletedIds.clear();
    dirtyGlobal = false;
    baseIds = snapshotIds(data);      // 지금 내용을 새 기준으로
    document.getElementById('errBar').classList.remove('show');
    setSaveState('saved');
    if(!silent) toast(STORAGE_MODE === 'nas' ? '✅ NAS에 저장되었습니다' : '✅ 저장되었습니다 (이 브라우저)');
    updateSubtitle();
    if(mergedOnce) render();      // 합쳐졌을 때만 다시 그립니다 (평소엔 화면을 건드리지 않음)
  }catch(e){
    localStorage.setItem(LS_KEY, JSON.stringify(data));   // 안전망
    setBadge('error', 'NAS 저장 실패 — 임시로 이 브라우저에 보관');
    setSaveState('failed');
    showError(e.message);
  }finally{
    saving = false;
    if(saveAgain){ saveAgain = false; markDirty(); }
  }
}

function exportJSON(){
  const copy = Object.assign({}, data);
  delete copy._rev;                       // 내부에서만 쓰는 판 번호는 뺍니다
  const blob = new Blob([JSON.stringify(copy, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '브랜드허브_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('📤 파일로 내보냈습니다');
}

function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.brands)) throw new Error('브랜드 목록이 없습니다');
      if(!confirm('현재 내용을 파일 내용으로 덮어씁니다.\n\n'
        + '다른 분이 그 사이에 넣은 내용도 함께 사라질 수 있습니다. 계속할까요?')) return;
      const keepRev = data._rev || 0;         // 판 번호는 지금 것을 유지합니다
      data = normalize(parsed);
      data._rev = keepRev;
      // 파일로 되돌리는 것은 '전부 내 것으로' 라는 뜻이므로 전체를 바뀐 것으로 표시합니다
      baseIds = new Map();
      data.brands.forEach(b => dirtyBrands.add(b.id));
      currentBrandId = data.brands.length ? data.brands[0].id : null;
      render(); markDirtyAll();
      toast('📥 불러왔습니다');
    }catch(e){ toast('⚠️ 파일을 읽을 수 없습니다: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* 예전 형식이나 필드가 빠진 데이터가 들어와도 깨지지 않게 정리합니다 */
function normalize(raw){
  if(!raw || !Array.isArray(raw.brands) || raw.schema !== SCHEMA){
    const fresh = defaultData();
    if(raw && Object.keys(raw).length) fresh._이전형식백업 = raw;  // 예전 데이터는 버리지 않음
    return fresh;
  }
  if(typeof raw._rev !== 'number') raw._rev = 0;
  if(!Array.isArray(raw.onboard))  raw.onboard  = obSeed();   // 팀 온보딩 (단 하나씩)
  /* 📑 손수 만드는 목록 — 모양을 맞춰 둡니다. 한 칸이라도 빠지면
     그 목록을 열 때 화면이 통째로 빕니다. */
  if(!Array.isArray(raw.pages)) raw.pages = [];
  raw.pages.forEach(pg => {
    pg.id = pg.id || uid('pg');
    ['name','icon','group','color','note'].forEach(k => {
      if(typeof pg[k] !== 'string') pg[k] = ''; });
    if(PAGE_GROUPS.indexOf(pg.group) < 0) pg.group = '팀운영';
    if(!pg.icon) pg.icon = '📑';
    if(!pg.color) pg.color = 'var(--blue)';
    if(!Array.isArray(pg.tabs) || !pg.tabs.length) pg.tabs = [{ id: uid('pt'), name:'전체' }];
    pg.tabs.forEach(t => { t.id = t.id || uid('pt');
      if(typeof t.name !== 'string') t.name = ''; });
    if(!Array.isArray(pg.items)) pg.items = [];
    pg.items.forEach(it => {
      it.id = it.id || uid('pi');
      ['title','url','body','tab'].forEach(k => {
        if(typeof it[k] !== 'string') it[k] = ''; });
      /* 올린 파일 — 자리가 깨져 있으면 아예 없던 것으로 둡니다 */
      if(it.file && typeof it.file === 'object'){
        ['name','path','at'].forEach(k => {
          if(typeof it.file[k] !== 'string') it.file[k] = ''; });
        it.file.size = Number(it.file.size) || 0;
        if(!it.file.path) delete it.file;
      }else if(it.file !== undefined) delete it.file;
      /* 탭이 지워진 칸은 첫 탭으로 — 안 그러면 어느 탭에서도 안 보입니다 */
      if(!pg.tabs.some(t => t.id === it.tab)) it.tab = pg.tabs[0].id;
    });
  });
  raw.onboard.forEach(sc => {
    sc.id = sc.id || uid('os');
    ['icon','title','note'].forEach(k => { if(typeof sc[k] !== 'string') sc[k] = ''; });
    if(!Array.isArray(sc.items)) sc.items = [];
    sc.items.forEach(it => {
      it.id = it.id || uid('oi');
      ['title','body'].forEach(k => { if(typeof it[k] !== 'string') it[k] = ''; });
      if(!Array.isArray(it.kids)) it.kids = [];
      it.kids.forEach(k2 => {
        k2.id = k2.id || uid('ok');
        ['title','body'].forEach(k => { if(typeof k2[k] !== 'string') k2[k] = ''; });
      });
    });
  });
  if(!Array.isArray(raw.notices))  raw.notices  = [];   // 공지사항 (홈 맨 위)
  raw.notices.forEach(n => {
    n.id = n.id || uid('nt');
    ['title','body','by'].forEach(k => { if(typeof n[k] !== 'string') n[k] = ''; });
    if(typeof n.at !== 'string') n.at = new Date().toISOString();
    n.pin = !!n.pin;
  });
  if(!Array.isArray(raw.meetings)) raw.meetings = [];   // 회의록 (브랜드 공통)
  if(!Array.isArray(raw.events))   raw.events   = [];   // 달력 일정 (브랜드 공통)
  if(!Array.isArray(raw.trash))    raw.trash    = [];   // 휴지통 (지운 것)
  if(!Array.isArray(raw.boards))   raw.boards   = [];   // 화이트보드 (판 하나씩)
  raw.boards.forEach(b => {
    b.id = b.id || uid('wb');
    if(typeof b.name !== 'string') b.name = '이름 없는 판';
    if(!Array.isArray(b.nodes)) b.nodes = [];
    if(!Array.isArray(b.edges)) b.edges = [];
    b.nodes.forEach(n => {
      n.id = n.id || uid('wn');
      if(!WB_KINDS[n.kind]) n.kind = 'note';
      ['x','y','w','h'].forEach(k => { if(typeof n[k] !== 'number' || !isFinite(n[k])) n[k] = 0; });
      if(n.w < 40) n.w = WB_KINDS[n.kind].w;
      if(n.h < 24) n.h = WB_KINDS[n.kind].h;
      if(typeof n.text !== 'string') n.text = '';
      if(n.kind === 'media'){
        n.path = String(n.path || '');
        n.name = String(n.name || '');
        n.mime = String(n.mime || '');
      }
      if(!WB_HUES.some(h => h.key === n.color)) n.color = 'yellow';
    });
    const ids = new Set(b.nodes.map(n => n.id));
    b.edges = b.edges.filter(e => e && ids.has(e.from) && ids.has(e.to));
    b.edges.forEach(e => { e.id = e.id || uid('we'); });
  });
  if(!Array.isArray(raw.gbperf))   raw.gbperf   = [];   // 성과 정리 (브랜드 × 사람 × 연도)
  raw.gbperf.forEach(p => {
    p.id      = p.id || uid('gp');
    p.year    = String(p.year || new Date().getFullYear());
    p.brandId = String(p.brandId || '');
    p.who     = String(p.who || '');
    // 결과 지표는 이제 여러 개입니다 (예전 하나짜리는 첫 칸으로 옮깁니다)
    if(!Array.isArray(p.results)){
      const o = (p.result && typeof p.result === 'object' && !Array.isArray(p.result))
        ? p.result : null;
      const had = o && ['name','target','current','unit'].some(k => String(o[k] || '').trim());
      p.results = had ? [ Object.assign({ id: uid('gr') }, o) ] : [];
    }
    delete p.result;
    if(!p.results.length) p.results.push({ id: uid('gr'), name:'', target:'', current:'', unit:'' });
    p.results.forEach(x => { if(!x.id) x.id = uid('gr'); });
    if(!Array.isArray(p.leads)) p.leads = [];
    p.leads.forEach(x => { x.id = x.id || uid('gl'); });
    ['why','how','causal','lesson','ai'].forEach(k => {
      if(typeof p[k] !== 'string') p[k] = '';
    });
  });
  if(!Array.isArray(raw.gbkpis))   raw.gbkpis   = [];   // 그로스 지표 (브랜드 × 연도)
  raw.gbkpis.forEach(k => {
    k.id      = k.id || uid('k');
    k.year    = String(k.year || new Date().getFullYear());
    k.brandId = String(k.brandId || '');
    if(k.mode !== 'auto') k.mode = 'manual';
  });
  if(!Array.isArray(raw.growth))   raw.growth   = [];   // 그로스보드 (사람 × 연도 한 장씩)
  raw.growth.forEach(g => {
    g.id   = g.id || uid('gb');
    g.who  = String(g.who || '');
    g.year = String(g.year || new Date().getFullYear());
    if(typeof g.goal !== 'string') g.goal = '';
    if(!Array.isArray(g.stages)) g.stages = [];
    // 예전 자료: 사람에게 붙어 있던 지표는 아래에서 브랜드 지표로 옮깁니다
    if(Array.isArray(g.kpis)) g.kpis.forEach(k => { k.id = k.id || uid('k'); });
    g.stages.forEach(st => {
      st.id = st.id || uid('gs');
      if(!Array.isArray(st.items)) st.items = [];
      st.items.forEach(it => {
        it.id = it.id || uid('gi');
        if(typeof it.status !== 'string') it.status = '진행 중';
        if(!Array.isArray(it.acts)) it.acts = [];
        it.acts.forEach(a => {
          a.id = a.id || uid('ga');
          if(a.mode !== 'problem') a.mode = 'goal';
          if(!Array.isArray(a.steps)) a.steps = [];
          a.steps.forEach(t => { t.id = t.id || uid('gt'); t.done = !!t.done; });
        });
      });
    });
  });
  raw.brands.forEach(b => {
    b.id = b.id || uid('b');
    b.icon = b.icon || '🏷️';
    b.color = b.color || '#3b82f6';
    if(!Array.isArray(b.nasFolders)) b.nasFolders = [];
    // 예전 판에서 브랜드 안에 적어둔 회의록은 「업무 → 회의록」으로 옮깁니다
    if(Array.isArray(b.meetings) && b.meetings.length){
      b.meetings.forEach(m => {
        if(!raw.meetings.some(x => x.id === m.id)){
          raw.meetings.push(Object.assign({}, m, { brand: m.brand || b.name }));
        }
      });
    }
    delete b.meetings;
    ITEM_KEYS.forEach(k => {
      if(!Array.isArray(b[k])) b[k] = [];
      b[k].forEach(it => { it.id = it.id || uid('i'); });
    });
    if(typeof b.masterPrompt !== 'string') b.masterPrompt = '';
    if(!b.chartFix || typeof b.chartFix !== 'object' || Array.isArray(b.chartFix))
      b.chartFix = {};
  });

  // 같은 id 가 두 번 들어간 것이 있으면 하나만 남깁니다.
  // (합치는 과정이 꼬여 같은 회의록·일정이 두 줄로 보이는 일을 막습니다)
  ['meetings', 'events', 'growth', 'boards'].forEach(k => {
    const seen = new Set();
    raw[k] = raw[k].filter(x => {
      if(!x || !x.id) return false;
      if(seen.has(x.id)) return false;
      seen.add(x.id); return true;
    });
  });
  // 예전 자료: 사람 보드에 붙어 있던 지표를 브랜드 지표로 한 번만 옮깁니다
  raw.growth.forEach(g => {
    if(!Array.isArray(g.kpis) || !g.kpis.length) return;
    g.kpis.forEach(k => {
      const cnt = {};
      (g.stages || []).forEach(st => (st.items || []).forEach(it => {
        if(it.kpiId === k.id) cnt[it.brandId || ''] = (cnt[it.brandId || ''] || 0) + 1;
      }));
      let bid = '', top = 0;
      Object.keys(cnt).forEach(b => { if(cnt[b] > top){ top = cnt[b]; bid = b; } });
      const same = raw.gbkpis.find(x => String(x.year) === String(g.year)
        && (x.brandId || '') === bid && (x.name || '').trim() === (k.name || '').trim());
      if(same){
        (g.stages || []).forEach(st => (st.items || []).forEach(it => {
          if(it.kpiId === k.id) it.kpiId = same.id;
        }));
      }else{
        raw.gbkpis.push({ id: k.id, year: String(g.year), brandId: bid,
                          name: k.name || '', current: k.current || '',
                          target: k.target || '', unit: k.unit || '',
                          mode: k.mode === 'auto' ? 'auto' : 'manual' });
      }
    });
    delete g.kpis;
  });

  return raw;
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }

  document.getElementById('errText').textContent = msg;

}

function toggleDark(){
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('brandHubDark', document.body.classList.contains('dark-mode'));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2800);
}

window.addEventListener('beforeunload', e => {
  if(saveTimer || saving){ e.preventDefault(); e.returnValue = ''; }
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); saveAll(); }
  if(e.key === 'Escape'){ closeModal('brandModal'); closeModal('itemModal'); }

  // 글자를 치고 있는 중이면 브라우저의 원래 되돌리기가 먼저입니다
  const el = document.activeElement;
  const typing = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  if(typing) return;
  /* 📄 브랜드북을 펴 놓고 보는 중 — 화살표로 넘깁니다.
     (원본을 고치는 중이면 그 안의 화살표가 먼저라 건드리지 않습니다) */
  if((document.getElementById('pdfBox') || document.getElementById('bkIfr')) && !bookEdit
     && !e.ctrlKey && !e.metaKey && !e.altKey){
    if(e.key === 'ArrowLeft'){ e.preventDefault(); pwGo(-1); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); pwGo(1); return; }
    if(e.key === 'Home'){ e.preventDefault(); pwGoTo(0); return; }
    if(e.key === 'End'){ e.preventDefault(); pwGoTo(pwPgN - 1); return; }
  }
  if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){
    e.preventDefault();
    if(e.shiftKey) redoStep(); else undoStep();
  }
  if((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')){
    e.preventDefault(); redoStep();
  }
});

/* ═══════════════ 로그인 ══════════════════════════════════════════
   계정을 하나도 안 만들면 예전처럼 누구나 씁니다.
   계정을 만들면 그때부터 로그인한 사람만 들어올 수 있고,
   퇴사자는 [사용 중지] 하면 열어둔 화면까지 그 자리에서 끊깁니다.
   ================================================================= */
const auth = { state:null, busy:false, err:'', users:null, showUsers:false };

async function authState(){
  try{
    const r = await fetch('auth.php?action=state', { cache:'no-store' });
    auth.state = JSON.parse(await r.text());
  }catch(e){ auth.state = { ok:false, error:'로그인 상태를 확인하지 못했습니다' }; }
  return auth.state;
}
function authOn(){ return !!(auth.state && auth.state['계정있음']); }
function authMe(){ return (auth.state && auth.state['나']) || null; }
function isAdmin(){ const m = authMe(); return !!(m && m['권한'] === '관리자'); }

/* 어느 요청에서든 「로그인 필요」 가 오면 로그인 화면으로 보냅니다 */
function authKicked(){
  if(auth.state) auth.state['로그인됨'] = false, auth.state['나'] = null;
  stopLive();
  render();
}

async function authPost(action, body){
  const r = await fetch('auth.php?action=' + action, {
    method:'POST', headers:{'Content-Type':'application/json'},
    cache:'no-store', body: JSON.stringify(body || {})
  });
  const t = await r.text();
  let o = null;
  try{ o = JSON.parse(t); }catch(e){}
  if(o === null) throw new Error('서버가 이상한 답을 보냈습니다 (HTTP ' + r.status + ')');
  if(!o.ok) throw new Error(o.error || '실패했습니다');
  return o;
}

async function doLogin(){
  const id = (document.getElementById('lgId') || {}).value || '';
  const pw = (document.getElementById('lgPw') || {}).value || '';
  if(!id.trim() || !pw){ auth.err = '아이디와 비밀번호를 넣어주세요'; render(); return; }
  auth.busy = true; auth.err = ''; render();
  try{
    await authPost('login', { id: id.trim(), pw: pw });
    await authState();
    auth.busy = false;
    location.reload();                       // 자료를 처음부터 다시 불러옵니다
  }catch(e){ auth.err = e.message; auth.busy = false; render();
    const f = document.getElementById('lgPw'); if(f){ f.value = ''; f.focus(); } }
}

async function doSetup(){
  const id = (document.getElementById('suId') || {}).value || '';
  const nm = (document.getElementById('suName') || {}).value || '';
  const pw = (document.getElementById('suPw') || {}).value || '';
  const p2 = (document.getElementById('suPw2') || {}).value || '';
  if(pw !== p2){ auth.err = '비밀번호 두 개가 서로 다릅니다'; render(); return; }
  auth.busy = true; auth.err = ''; render();
  try{
    await authPost('setup', { id: id.trim(), name: nm.trim(), pw: pw });
    location.reload();
  }catch(e){ auth.err = e.message; auth.busy = false; render(); }
}

async function doLogout(){
  if(!confirm('로그아웃할까요?')) return;
  try{ await authPost('logout'); }catch(e){}
  location.reload();
}

async function changePw(){
  const old = prompt('지금 쓰는 비밀번호를 넣어주세요.');
  if(old === null) return;
  const nw = prompt('새 비밀번호를 넣어주세요.\n\n8글자 이상, 숫자만은 안 됩니다.');
  if(nw === null) return;
  const n2 = prompt('한 번 더 넣어주세요.');
  if(n2 === null) return;
  if(nw !== n2){ alert('두 번 넣은 것이 서로 다릅니다.'); return; }
  try{
    const o = await authPost('passwd', { old: old, new: nw });
    alert(o['안내'] || '바꿨습니다.');
  }catch(e){ alert(e.message); }
}

/* ---- 사람 관리 (관리자) ---- */
async function loadUsers(){
  try{
    const r = await fetch('auth.php?action=users', { cache:'no-store' });
    const o = JSON.parse(await r.text());
    auth.users = o.ok ? o['사람'] : null;
    if(!o.ok) alert(o.error);
  }catch(e){ auth.users = null; }
  render();
}
function openUsers(){ auth.showUsers = true; auth.users = null; loadUsers(); }
function closeUsers(){ auth.showUsers = false; render(); }

async function addUser(){
  const id = prompt('새 사람의 아이디를 지어주세요.\n\n영문·숫자 2~32글자 (예: kim.mk)');
  if(id === null || !id.trim()) return;
  const nm = prompt('이름을 넣어주세요. (화면에 보일 이름)', id.trim());
  if(nm === null) return;
  const pw = prompt('처음 쓸 비밀번호를 정해주세요.\n\n'
    + '8글자 이상, 숫자만은 안 됩니다.\n본인에게 알려주고 바꾸게 하세요.');
  if(pw === null) return;
  const admin = confirm('이 사람을 관리자로 할까요?\n\n'
    + '관리자는 사람을 넣고 빼고, 퇴사 처리를 할 수 있습니다.\n'
    + '[취소] 를 누르면 일반 팀원이 됩니다.');
  try{
    const o = await authPost('adduser', { id:id.trim(), name:nm.trim(), pw:pw, admin:admin });
    toast('✅ ' + (o['안내'] || '넣었습니다'));
    loadUsers();
  }catch(e){ alert(e.message); }
}

async function setUser(id, patch, ask){
  if(ask && !confirm(ask)) return;
  try{
    const o = await authPost('setuser', Object.assign({ id: id }, patch));
    toast('✅ ' + (o['안내'] || '바꿨습니다'));
    loadUsers();
  }catch(e){ alert(e.message); }
}
async function resetPw(id){
  const pw = prompt(id + ' 의 비밀번호를 새로 정합니다.\n\n'
    + '8글자 이상, 숫자만은 안 됩니다.\n본인에게 알려주고 바꾸게 하세요.');
  if(pw === null || !pw) return;
  setUser(id, { pw: pw });
}
async function delUser(id){
  if(!confirm('"' + id + '" 계정을 아예 지울까요?\n\n'
    + '되돌릴 수 없습니다.\n'
    + '퇴사자라면 지우기보다 [사용 중지] 를 권합니다 '
    + '(누가 무엇을 했는지 기록이 남습니다).')) return;
  try{
    const o = await authPost('deluser', { id: id });
    toast('🗑️ ' + (o['안내'] || '지웠습니다'));
    loadUsers();
  }catch(e){ alert(e.message); }
}

                    + '\'관리자에서 내릴까요?\')">팀원으로</button> '
                  : '<button class="btn sm" onclick="setUser(\'' + jsq(u.id) + '\',{admin:true},'
                    + '\'관리자로 올릴까요? 사람을 넣고 뺄 수 있게 됩니다.\')">관리자로</button> ')
              + (u['쓸수있음'] ? ''
                  : '<button class="btn sm danger" onclick="wipeOpen(\'' + jsq(u.id) + '\')" '
                    + 'title="이 사람이 남긴 보드·할 일을 한 번에 정리합니다">🧹 남긴 자료</button> ')
              + (me ? '' : '<button class="btn sm danger" onclick="delUser(\'' + jsq(u.id) + '\')">지우기</button>')
            + '</td></tr>';
        }).join('')
      + '</tbody></table></div>';

  return '<div class="modal-bg open" onclick="if(event.target===this)closeUsers()">'
    + '<div class="modal" style="max-width:900px">'
    + '<h3>👥 사람 관리</h3>'
    + '<div class="sec-bar"><button class="btn primary" onclick="addUser()">＋ 사람 추가</button>'
      + '<span class="hint">퇴사자는 <b>[🚫 사용 중지]</b> 를 누르면 그 자리에서 못 들어옵니다. '
      + '지우지 않으셔도 됩니다</span></div>'
    + rows
    + '<div class="ainote" style="margin-top:12px">'
      + '중지하면 그 사람이 <b>지금 열어둔 화면까지 바로 끊깁니다.</b> '
      + '비밀번호를 초기화해도 마찬가지입니다.</div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeUsers()">닫기</button></div>'
    + '</div></div>';
}

/* ═══════════════ AI 에 왜 못 붙나 (점검) ═══════════════════════════
   NAS 가 밖으로 못 나가면 AI 가 안 됩니다. 어디가 막혔는지 물어보고
   무엇을 하면 되는지까지 화면에 적어줍니다.
   ================================================================= */
const netCheck = { open:false, busy:false, data:null, error:'' };

async function openNetCheck(){
  netCheck.open = true; netCheck.busy = true; netCheck.data = null; netCheck.error = '';
  render();
  try{ netCheck.data = await apiJson('ai.php?action=net'); }
  catch(e){ netCheck.error = apiErrText(e); }
  finally{ netCheck.busy = false; render(); }
}
function closeNetCheck(){ netCheck.open = false; render(); }

function netPanel(){
  if(!netCheck.open) return '';
  const d = netCheck.data;
  const rowsOf = (title, obj) => '<div class="vz-head" style="margin-top:12px">' + esc(title) + '</div>'
    + '<div class="vz-tw"><table class="ymtable"><tbody>'
    + Object.keys(obj || {}).map(k => '<tr><td style="width:44%"><b>' + esc(k) + '</b></td>'
        + '<td>' + esc(String(obj[k])) + '</td></tr>').join('')
    + '</tbody></table></div>';

  const body = netCheck.busy
    ? '<div class="fmeta">NAS 가 밖으로 나가볼 수 있는지 확인하는 중… (10초쯤 걸립니다)</div>'
    : netCheck.error
      ? '<div class="ainote" style="border-color:var(--red)">확인하지 못했습니다.<br>'
        + esc(netCheck.error) + '</div>'
      : (d ? '<div class="ainote" style="font-size:15px;font-weight:700">' + esc(d['한줄'] || '')
            + (d['어느 AI'] ? '<div class="fmeta" style="font-weight:400;margin-top:4px">'
                + '쓰는 AI: ' + esc(d['어느 AI']) + '</div>' : '')
          + '</div>'
          + '<div class="ainote" style="margin-top:10px">'
            + '<b>이렇게 해보세요</b><ul style="margin:6px 0 0 18px;padding:0">'
            + (d['이렇게 해보세요'] || []).map(t => '<li>' + esc(t) + '</li>').join('')
            + '</ul></div>'
          + rowsOf('닿나', d['닿나'])
          + rowsOf('나가는 방법 (PHP)', d['나가는 방법'])
          + (d['이 NAS 에 AI 심기'] ? rowsOf('이 NAS 에 AI 심기', d['이 NAS 에 AI 심기']) : '')
          + '<div class="vz-head" style="margin-top:12px">실제로 한 번 물어본 결과</div>'
          + '<div class="ainote" style="margin:4px 0 0">'
            + esc(String(d['실제로 물어보기'] || '')) + '</div>'
          + '<div class="vz-head" style="margin-top:12px">주소찾기(DNS) · 키</div>'
          + '<div class="fmeta">' + esc(String(d['주소찾기(DNS)'] || ''))
            + '<br>🔑 ' + esc(String(d['키 확인'] || '')) + '</div>'
          + rowsOf('AI 서버에 해본 것', d['AI 서버에 해본 것'])
          + rowsOf('다른 사이트에 해본 것', d['다른 사이트에 해본 것'])
        : '');

  return '<div class="modal-bg open" onclick="if(event.target===this)closeNetCheck()">'
    + '<div class="modal" style="max-width:760px">'
    + '<h3>🩺 AI 연결 점검</h3>'
    + body
    + '<div class="modal-actions">'
      + '<button class="btn" onclick="openNetCheck()">다시 확인</button>'
      + '<button class="btn primary" onclick="closeNetCheck()">닫기</button>'
    + '</div></div></div>';
}




/* ========================= 시작 ========================= */
async function init(){
  if(localStorage.getItem('brandHubDark') === 'true') document.body.classList.add('dark-mode');

  // 로그인부터 확인합니다. 안 되어 있으면 자료를 아예 불러오지 않습니다.
  if(STORAGE_MODE === 'nas'){
    await authState();
    if(authOn() && !auth.state['로그인됨']){
      render();                                  // 로그인 화면
      const f = document.getElementById('lgId');
      if(f) f.focus();
      return;
    }
  }

  data = normalize(data);        // 기본 자료도 같은 모양으로 맞춰둡니다
  try{
    const loaded = await storageLoad();
    if(loaded) data = normalize(loaded);
    baseIds = snapshotIds(data);
    setBadge(STORAGE_MODE === 'nas' ? 'nas' : '',
      STORAGE_MODE === 'nas' ? 'NAS 공유 저장' : '이 브라우저에만 저장');
  }catch(e){
    const raw = localStorage.getItem(LS_KEY);
    if(raw) data = normalize(JSON.parse(raw));
    if(STORAGE_MODE === 'nas'){
      // 불러오기에 실패한 채로 저장하면 다른 분들 자료를 날립니다. 저장을 막습니다.
      saveBlocked = true;
      setBadge('error', 'NAS에서 못 불러왔습니다 — 저장하지 않습니다');
      showError('NAS에서 자료를 불러오지 못했습니다.\n\n' + (e.message || e)
        + '\n\n지금 고치신 내용은 NAS에 저장되지 않습니다. '
        + '(다른 분들 자료를 덮어쓰지 않으려는 안전장치입니다)\n'
        + '새로고침(F5) 해서 다시 불러와 주세요.');
    }else{
      setBadge('error', 'NAS 연결 실패 — 이 브라우저 데이터 표시 중');
    }
  }

  /* 🤖 AI 모음 은 처음 한 번만 세웁니다 — 불러오기가 끝난 뒤에 해야
     이미 NAS 에 있는 것을 두 번 만들지 않습니다 */
  pageSeed();
  pageTopUp();

  currentBrandId = null;   // 처음에는 홈부터 보여줍니다
  updateSubtitle();
  refreshSnap();           // 첫 번째 고침도 Ctrl+Z 로 되돌릴 수 있게 기준을 잡아둡니다
  render();
  loadInquiries();         // 홈에도 문의 수치를 띄우기 위해 미리 불러옵니다
  if(STORAGE_MODE === 'nas'){
    nasCheck();
    checkVersion(false);
    loadChannelSummary();                                  // 채널 새 글 (받아둔 것 읽기)
    setInterval(loadChannelSummary, 5 * 60 * 1000);        // 열어둔 채로도 5분마다 갱신
    setInterval(() => checkVersion(false), 30 * 60 * 1000);

    setInterval(inquiryTick, INQ_CHECK_MS);                 // 구글시트 갱신 확인 (1분마다)
    aiCheck();                                             // AI 키가 들어 있는지
    startLive();                                           // 실시간 반영 (2초마다 확인)
    pingPresence();                                        // 지금 누가 보고 있는지
    setInterval(pingPresence, 15000);
    setInterval(wcalTick, 20000);      // 달력을 보고 있을 때만 근무현황을 새로 봅니다
  }
}
init();
</script>
