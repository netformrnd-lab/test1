function tpDocDel(id, i){ const t = tpT(); if(!t) return; t.docs.splice(i, 1); tpSave(); }

/* ── 파일 올리기 (사진 · 자료) ───────────────────────────────────
   목업은 브라우저 안에만 들고 있었지만, 여기서는 NAS 에 올리고 자리만
   적어 둡니다 — 안 그러면 다른 사람 화면에서 안 보입니다. */
const tpPhotoHold = {};      // 아직 여정에 안 붙인 사진
const tpDocHold   = {};      // 아직 자료에 안 붙인 파일
let tpUpTo = null;           // { id, ji, kind }

function tpPhotoPick(id, ji){ tpUpTo = { id: id, ji: ji, kind:'photo' }; tpFileGo('image/*', 1); }
function tpDocPick(id){ tpUpTo = { id: id, ji:'', kind:'doc' }; tpFileGo('', 0); }
function tpFileGo(accept, multi){
  let el = document.getElementById('tpFile');
  if(!el){
    el = document.createElement('input');
    el.type = 'file'; el.id = 'tpFile'; el.style.display = 'none';
    el.addEventListener('change', () => tpUpload(el.files));
    document.body.appendChild(el);
  }
  el.accept = accept; el.multiple = !!multi; el.value = '';
  el.click();
}
async function tpUpload(fileList){
  const files = Array.from(fileList || []);
  const to = tpUpTo; tpUpTo = null;
  if(!files.length || !to) return;
  const b = currentBrand(); if(!b) return;
  const t = tpFind(b, to.id); if(!t) return;

  const got = [];
  for(const f of files){
    toast('📎 "' + f.name + '" 올리는 중…');
    try{
      const fd = new FormData();
      fd.append('brand', b.name); fd.append('sub', '자료'); fd.append('file', f);
      const res = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try{ out = JSON.parse(text); }catch(e){}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
      if(!out.ok) throw new Error(out.error || '올리지 못했습니다');
      got.push({ id: uid('tf'), name: out.fileName, size: out.fileSize,
                 filePath: out.filePath || '', mime: out.mime || '' });
    }catch(e){ alert('"' + f.name + '" 을 올리지 못했습니다.\n\n' + (e.message || e)); }
  }
  if(!got.length) return;

  if(to.kind === 'doc'){
    tpDocHold[t.id] = got[0];                       // 「자료 추가」 를 누를 때 붙습니다
    toast('📎 ' + got[0].name + ' — [자료 추가] 를 눌러 마무리하세요');
    render();
    return;
  }
  if(to.ji === '' || to.ji === null || to.ji === undefined){
    (tpPhotoHold[t.id] = tpPhotoHold[t.id] || []).push(...got);
    toast('📷 사진 ' + got.length + '장 — [여정 추가] 를 눌러 마무리하세요');
  }else{
    const j = t.journey[+to.ji];
    if(j){ (j.photos = j.photos || []).push(...got); toast('📷 사진 ' + got.length + '장을 붙였습니다'); }
  }
  markDirty(b.id);
  await saveAll(true);
  render();
}
function tpPhotoDel(id, i, fid){
  const t = tpT(); if(!t || !t.journey[i]) return;
  t.journey[i].photos = (t.journey[i].photos || []).filter(f => f.id !== fid);
  tpSave();
}

/* 주소에서 최근 글을 찾아봅니다 (예전 ＋채널 추가가 하던 일) */
async function tpProbe(id){
  const b = currentBrand(); if(!b) return;
  const t = tpFind(b, id); if(!t) return;
  const url = String(t.url || '').trim();
  if(!url){ toast('⚠️ 먼저 위 [링크] 에 주소를 넣어주세요'); return; }
  toast('🔎 최근 글을 찾는 중…');
  try{
    const info = await apiJson('channels.php?action=probe&url=' + encodeURIComponent(url));
    t.kind = info.kind || t.kind || '웹사이트';
    t.feed = info.feed || '';
    if(!t.name.trim()) t.name = info['채널이름'] || t.kind;
    markDirty(b.id); render();
    toast(t.feed ? '✅ 최근 글을 가져올 수 있습니다' : '⚠️ 이 주소에서는 최근 글을 못 가져옵니다');
  }catch(e){ alert('찾지 못했습니다.\n\n' + apiErrText(e)); }
}

/* ================= 문서 내용으로 찾기 =================
   파일 이름이 아니라 문서 안에 적힌 글자로 찾습니다.
   ====================================================== */
const doc = { info:null, sample:null, run:null, q:'', res:null,
              loading:false, error:null, unread:null, busy:false, self:null };

async function docCheck(){
  try{ doc.info = await apiJson('doctext.php?action=check'); }
  catch(e){ doc.info = { error: apiErrText(e) }; }
  render();
}

/* 이 NAS 가 무엇을 할 수 있는지 봅니다 (문제 생겼을 때) */
async function docSelfTest(){
  doc.busy = true; doc.self = null; doc.error = null; render();
  try{ doc.self = await apiJson('doctext.php?action=selftest'); }
  catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

async function docSample(){
  doc.busy = true; doc.sample = null; doc.self = null; doc.error = null; render();
  try{
    doc.sample = await apiJson('doctext.php?action=sample&n=30');
  }catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

async function docStart(){
  if(!confirm('문서 안의 글자를 읽어 목록을 만듭니다.\n\n'
    + '문서가 많으면 몇 분 걸릴 수 있습니다. 창을 닫지 마세요.\n'
    + '원본 파일은 읽기만 하며 고치지 않습니다.')) return;
  doc.run = { starting:true }; render();
  try{
    doc.run = await apiJson('doctext.php?action=start');
    render();
    docLoop();
  }catch(e){
    doc.run = null; render();
    alert(apiErrText(e));
  }
}

async function docLoop(){
  while(doc.run && !doc.run.done){
    let out;
    try{ out = await apiJson('doctext.php?action=step'); }
    catch(e){ doc.run = null; render(); alert(apiErrText(e)); return; }
    if(!doc.run) return;
    doc.run = out;
    render();
  }
  if(doc.run && doc.run.done){
    await docCheck();
    toast('✅ 문서 ' + doc.run['읽은수'].toLocaleString('ko-KR') + '개를 읽었습니다');
  }
}

async function docCancel(){
  if(!confirm('중단할까요?')) return;
  doc.run = null; render();
  try{ await apiJson('doctext.php?action=cancel'); }catch(e){}
}

async function docSearch(){
  const el = document.getElementById('docQ');
  doc.q = el ? el.value.trim() : doc.q;
  if(!doc.q){ toast('⚠️ 찾을 말을 입력해 주세요'); return; }
  doc.loading = true; doc.error = null; doc.unread = null;
  doc.sample = null; doc.self = null;   // 결과가 화면 아래로 밀리지 않게 접습니다
  if(doc.run && doc.run.done) doc.run = null;
  render();
  try{
    doc.res = await apiJson('doctext.php?action=search&q=' + encodeURIComponent(doc.q));
  }catch(e){ doc.error = apiErrText(e); doc.res = null; }
  doc.loading = false; render();
  const e2 = document.getElementById('docQ');
  if(e2){ e2.value = doc.q; e2.focus(); }
}

async function docUnread(){
  doc.busy = true; doc.res = null; render();
  try{ doc.unread = await apiJson('doctext.php?action=unread'); }
  catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

function docView(){
  if(doc.info === null){ setTimeout(docCheck, 10); return '<div class="fmeta">확인하는 중…</div>'; }

  const info  = doc.info || {};
  const ready = info.ok;

  const bar = '<div class="sec-bar">'
    + '<span class="searchbox" style="flex:1 1 320px"><span class="ico">📖</span>'
      + '<input type="text" id="docQ" placeholder="문서 안에 적힌 말로 찾기 (예: 옥상방수 단가)" '
      + 'value="' + esc(doc.q) + '" onkeydown="if(event.key===\'Enter\')docSearch()"'
      + (ready ? '' : ' disabled') + '></span>'
    + '<button class="btn primary" onclick="docSearch()"' + (ready ? '' : ' disabled') + '>찾기</button>'
    + '<button class="btn" onclick="docSample()">🧪 얼마나 읽히나 재보기</button>'
    + '<button class="btn sm" onclick="docSelfTest()" '
      + 'title="이 NAS 가 어떤 형식을 읽을 수 있는지 확인합니다">🩺 이 NAS 점검</button>'
    + '<button class="btn" onclick="docStart()">'
      + (ready ? '↻ 글자 목록 다시 만들기' : '📖 글자 목록 만들기') + '</button>'
    + (ready ? '<button class="btn sm" onclick="docUnread()">못 읽은 문서 보기</button>' : '')
    + '<span class="hint">'
      + (ready
          ? (info['문서수'] || 0).toLocaleString('ko-KR') + '개 문서 · ' + esc(info['목록크기'] || '')
          : '아직 글자 목록이 없습니다')
      + '</span>'
    + '</div>';

  /* 진행 상황 */
  let runPanel = '';
  if(doc.run){
    if(doc.run.starting) runPanel = '<div class="mbox" style="margin-bottom:14px">'
      + '<div class="fmeta">시작하는 중…</div></div>';
    else{
      const d = doc.run;
      const pct = d['전체'] ? Math.round(d['살펴본수'] / d['전체'] * 100) : 0;
      runPanel = '<div class="mbox" style="margin-bottom:14px">'
        + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
          + '<span>' + (d.done ? '✅ 다 읽었습니다' : '📖 문서를 읽는 중') + '</span>'
          + '<span class="mhs">' + esc(d['걸린시간'] || '') + '</span>'
          + '<span style="margin-left:auto">'
            + (d.done ? '<button class="btn sm" onclick="doc.run=null;render()">닫기</button>'
                      : '<button class="btn sm danger" onclick="docCancel()">중단</button>')
          + '</span></div>'
        + '<div class="bar-row"><span class="bl">진행</span>'
          + '<span class="bt"><span class="bf" style="width:' + pct + '%"></span></span>'
          + '<span class="bv">' + pct + '%</span></div>'
        + '<div class="krow"><span>읽은 문서</span><b style="color:var(--text-primary)">'
          + (d['읽은수'] || 0).toLocaleString('ko-KR') + '개</b></div>'
        + '<div class="krow"><span>글자를 못 찾은 문서</span><b style="color:var(--text-primary)">'
          + (d['못읽은수'] || 0).toLocaleString('ko-KR') + '개</b></div>'
        + (d.done ? '' : '<div class="path" style="margin-top:8px">' + esc(d['지금파일'] || '') + '</div>')
        + '</div>';
    }
  }

  /* 이 NAS 점검 결과 */
  let selfPanel = '';
  if(doc.self){
    const t = doc.self;
    const row = (k, v, warn) => '<div class="krow"><span>' + esc(k) + '</span>'
      + '<b style="color:var(--' + (warn ? 'red' : 'text-primary') + ')">' + esc(String(v)) + '</b></div>';
    const bad = v => /없음|막힘/.test(String(v));
    selfPanel = '<div class="mbox" style="margin-bottom:14px">'
      + '<div class="mh" style="display:flex;align-items:center;gap:6px"><span>🩺 이 NAS 점검</span>'
        + '<span class="mhs">' + esc(t['걸린시간'] || '') + '</span>'
        + '<span style="margin-left:auto"><button class="btn sm" onclick="doc.self=null;render()">닫기</button></span>'
      + '</div>'
      + ['PHP','zip기능','mbstring','zlib','메모리한도','파일목록','문서후보수','글자목록']
          .map(k => row(k, t[k], bad(t[k]))).join('')
      + (t['형식별시험'] && t['형식별시험'].length
          ? '<div class="fmeta" style="margin:10px 0 4px">형식마다 하나씩 실제로 읽어본 결과</div>'
            + t['형식별시험'].map(x =>
                '<div class="krow"><span>' + esc(x['형식']) + ' · ' + esc(x['파일']) + '</span>'
                + '<b style="color:var(--' + (x['상태'] === '읽음' ? 'green' : 'red') + ')">'
                + esc(x['상태']) + ' <span style="opacity:.6">' + esc(x['걸린시간']) + '</span></b></div>').join('')
          : '')
      + '<div class="ainote" style="margin-top:10px">'
        + (bad(t['zip기능'])
            ? '⚠️ <b>zip 기능이 꺼져 있습니다.</b> 워드·엑셀·PPT 를 읽을 수 없습니다. '
              + 'DSM → 웹 스테이션 → PHP 설정에서 <b>zip</b> 을 켜주세요.'
            : '읽지 못하는 형식이 있으면 위 목록에서 빨간 글씨를 확인해 주세요. '
              + '스캔한 PDF(사진으로 된 것)는 글자층이 없어 원래 읽히지 않습니다.')
      + '</div></div>';
  }

  /* 얼마나 읽히나 */
  let samplePanel = '';
  if(doc.busy && !doc.sample && !doc.unread) samplePanel = '<div class="fmeta">재보는 중…</div>';
  else if(doc.sample){
    const sp = doc.sample;
    samplePanel = '<div class="mbox" style="margin-bottom:14px">'
      + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
        + '<span>🧪 얼마나 읽히나</span>'
        + '<span class="mhs">' + sp['뽑아본수'] + '개를 뽑아 읽어봤습니다 (전체 '
          + sp['대상문서수'].toLocaleString('ko-KR') + '개)</span>'
        + (sp['시간초과'] ? '<span class="chip test">시간이 다 돼 일부만</span>' : '')
        + '<span style="margin-left:auto"><button class="btn sm" onclick="doc.sample=null;render()">닫기</button></span>'
      + '</div>'
      + '<div class="bar-row"><span class="bl">읽힌 비율</span>'
        + '<span class="bt"><span class="bf" style="width:' + sp['읽힌비율'] + '%"></span></span>'
        + '<span class="bv">' + sp['읽힌비율'] + '%</span></div>'
      + '<div class="fmeta" style="margin:10px 0 4px">형식별</div>'
      + sp['형식별'].map(e =>
          '<div class="bar-row"><span class="bl">' + esc(e['형식'])
          + ' <span style="opacity:.6">(' + (e['전체문서수'] || 0).toLocaleString('ko-KR') + '개)</span></span>'
          + '<span class="bt"><span class="bf" style="width:' + e['비율'] + '%"></span></span>'
          + '<span class="bv">' + e['읽음'] + '/' + e['전체'] + '</span></div>').join('')
      + '<div class="fmeta" style="margin:12px 0 4px">뽑아본 문서</div>'
      + '<div class="mbox" style="background:var(--bg-card)">'
      + sp['표본'].slice(0, 10).map(r =>
          '<div class="krow" style="align-items:flex-start">'
          + '<span class="chip' + (r['상태'] === '읽음' ? ' on' : '') + '">' + esc(r['상태']) + '</span>'
          + '<span style="flex:1;min-width:0">'
            + '<b style="color:var(--text-primary);word-break:break-all">' + esc(r['이름']) + '</b>'
            + (r['맛보기'] ? '<div class="fmeta">' + esc(r['맛보기']) + '…</div>' : '')
          + '</span></div>').join('')
      + '</div>'
      + '<div class="fmeta" style="margin-top:10px">'
        + '읽히지 않는 문서는 글자가 아니라 <b>그림</b>으로 되어 있는 것입니다 '
        + '(스캔본·이미지로 내보낸 PDF). 나중에 OCR 대상이 됩니다.</div>'
      + '</div>';
  }

  /* 결과 */
  let body = '';
  if(doc.loading) body = '<div class="empty">찾는 중…</div>';
  else if(doc.error) body = '<div class="empty" style="white-space:pre-wrap">⚠️ ' + esc(doc.error) + '</div>';
  else if(doc.unread){
    const u = doc.unread;
    body = '<div class="fmeta" style="margin-bottom:10px">글자를 못 찾은 문서 '
      + u['못읽은수'].toLocaleString('ko-KR') + '개 · 형식별 '
      + esc(Object.keys(u['형식별']).map(k => k + ' ' + u['형식별'][k]).join(' · '))
      + ' <button class="btn sm" onclick="doc.unread=null;render()">닫기</button></div>'
      + '<div class="mbox">' + u.results.map(r =>
          '<div class="krow" style="align-items:flex-start">'
          + '<span class="fileicon" style="font-size:15px">' + fileIcon(r.name) + '</span>'
          + '<span style="flex:1;min-width:0">'
            + '<b style="color:var(--text-primary);word-break:break-all">' + esc(r.name) + '</b>'
            + '<div class="path">' + esc(r.dir) + '</div></span>'
          + '<a class="btn sm" href="nasfiles.php?action=download&path='
            + encodeURIComponent(r.path) + '">⬇</a></div>').join('')
      + '</div>';
  }
  else if(doc.res){
    if(!doc.res.results.length) body = '<div class="empty">"' + esc(doc.q) + '" 이(가) 적힌 문서가 없습니다.</div>';
    else body = '<div class="fmeta" style="margin-bottom:10px">'
        + doc.res.matched.toLocaleString('ko-KR') + '개 문서에서 찾았습니다'
        + (doc.res.matched > doc.res.shown ? ' (' + doc.res.shown + '개 표시)' : '') + '</div>'
      + '<div class="mbox">' + doc.res.results.map(r =>
          '<div class="krow" style="flex-direction:column;align-items:stretch;gap:4px">'
          + '<div style="display:flex;gap:8px;align-items:baseline">'
            + '<span class="fileicon" style="font-size:15px">' + fileIcon(r.name) + '</span>'
            + '<b style="color:var(--text-primary);word-break:break-all">'
              + highlight(r.name, doc.q.split(/\s+/)[0]) + '</b>'
            + '<a class="btn sm" style="margin-left:auto" href="nasfiles.php?action=download&path='
              + encodeURIComponent(r.path) + '">⬇</a>'
          + '</div>'
          + '<div class="doc-snip">' + highlight(r.snip, doc.q.split(/\s+/)[0]) + '</div>'
          + '<div class="path" style="word-break:break-all">' + esc(r.dir) + '</div>'
          + '</div>').join('')
      + '</div>';
  }
  else if(!ready) body = '<div class="empty">아직 문서 안의 글자를 읽지 않았습니다.<br><br>'
    + '먼저 <b style="color:var(--text-primary)">[🧪 얼마나 읽히나 재보기]</b> 로 확인해 보시고,<br>'
    + '괜찮으면 <b style="color:var(--text-primary)">[📖 글자 목록 만들기]</b> 를 눌러주세요.<br><br>'
    + '<span style="color:var(--text-muted)">워드·엑셀·파워포인트·텍스트는 대부분 읽힙니다.<br>'
    + 'PDF 는 글자층이 있으면 읽히고, 스캔본은 읽히지 않습니다.</span></div>';
  else body = '<div class="empty">문서 안에 적힌 말로 찾아보세요.<br>'
    + '<span style="color:var(--text-muted)">예) 옥상방수 단가 · 설계감리 · 동아건설 · 32,000</span></div>';

  return bar + runPanel + selfPanel + samplePanel + body;
}

/* ================= 파일 정리 =================
   한 폴더에 쌓인 파일을, 옆 폴더들로 하나씩 넣습니다.
   사진이면 그림을 보면서 고를 수 있습니다.
   ============================================= */
const tidy = { from:null, to:null, files:null, targets:null, deep:true, init:false,
               loading:false, error:null, pick:null, done:[], busy:null,
               plan:null, running:null, undo:[], mk:false, madeDirs:[] };

/* 공유폴더 목록 (「전체」 화면에서 같이 옵니다). 아직 없으면 한 번 불러옵니다. */
function nasRootsList(){
  const c = browseCache[''];
  if(!c){ setTimeout(() => loadBrowse(''), 10); return null; }
  if(c.loading) return null;
  return c.roots || [];
}

/* 정리를 하는 곳 — 「01. 브랜드마케팅팀」 폴더가 기본입니다 */
function tidyRoot(){
  const rs = nasRootsList();
  if(rs === null) return null;                 // 아직 못 받았습니다
  if(!rs.length) return '';
  const hit = rs.find(r => /브랜드\s*마케팅\s*팀/.test(r.name))
           || rs.find(r => /^0*1[.\s]/.test(r.name));
  return (hit || rs[0]).path;
}

function toggleTidyDeep(){
  tidy.deep = !tidy.deep;
  tidy.targets = null;
  render();
  tidyLoad();
}

function tidyPick(which){
  tidy.pick = { which: which, loading:true };
  render();
  tidyPickLoad('');
}
function tidyPickClose(){ tidy.pick = null; render(); }

async function tidyPickLoad(dir){
  const which = tidy.pick ? tidy.pick.which : 'from';
  tidy.pick = { which: which, loading:true, dir:dir };
  render();
  try{
    const out = await apiJson('nasfiles.php?action=browse&lim=50'
      + (dir ? '&dir=' + encodeURIComponent(dir) : ''));
    tidy.pick = { which: which, dir: out.dir, parent: out.parent, folders: out.folders || [] };
  }catch(e){
    tidy.pick = { which: which, dir: dir, error: apiErrText(e) };
  }
  render();
}

function tidyChoose(dir){
  const which = tidy.pick.which;
  tidy.pick = null;
  if(which === 'from'){ tidy.from = dir; tidy.files = null; }
  else               { tidy.to   = dir; tidy.targets = null; }
  render();
  tidyLoad();
}

async function tidyLoad(){
  if(tidy.loading) return;
  tidy.loading = true; tidy.error = null; render();
  try{
    if(tidy.from && !tidy.files){
      const a = await apiJson('nasfiles.php?action=browse&lim=500&dir=' + encodeURIComponent(tidy.from));
      tidy.files = a.files || [];
    }
    if(tidy.to && !tidy.targets){
      // 깊이 2 면 하위의 하위 폴더까지 나옵니다 — 큰 폴더가 아니라 세부 폴더로 바로 넣습니다
      const b = await apiJson('nasfiles.php?action=dirtree&depth=' + (tidy.deep ? 2 : 1)
        + '&dir=' + encodeURIComponent(tidy.to));
      // 정리할 폴더 자신은 옮길 곳에서 뺍니다
      tidy.targets = (b.folders || []).filter(f => f.path !== tidy.from);
      tidy.cut = !!b['잘림'];
    }
  }catch(e){ tidy.error = apiErrText(e); }
  tidy.loading = false; render();
}

/* 파일 이름과 폴더 이름이 얼마나 겹치는지 봐서 알맞은 폴더를 먼저 보여줍니다 */
/* 화면에 보일 폴더 이름 — 하위 폴더는 「부모 › 자식」 으로 보여줍니다 */
function tidyLabel(t){
  return t.rel ? t.rel.replace(/\//g, ' › ') : t.name;
}

/* 파일 형식 ↔ 폴더 이름 — 「사진」 폴더에는 이미지가, 「계약」 폴더에는 한글 문서가 */
const TIDY_KIND = [
  { ext:['jpg','jpeg','png','gif','webp','bmp','heic','psd','ai','svg','tif','tiff'],
    keys:['사진','이미지','시안','리플렛','디자인','촬영','썸네일','로고','배너','상세'],
    label:'그림 파일' },
  { ext:['pdf','ppt','pptx','key'],
    keys:['자료','카탈로그','브로슈어','제안','발표','소개','영업'], label:'발표·자료' },
  { ext:['hwp','hwpx','doc','docx','txt','md'],
    keys:['문서','계약','법무','공문','시방','기획','보고'], label:'문서' },
  { ext:['xls','xlsx','csv','numbers'],
    keys:['정산','견적','통계','수치','비용','명단','재고'], label:'표' },
  { ext:['mp4','mov','avi','mkv','wmv'],
    keys:['영상','동영상','촬영','릴스','유튜브'], label:'영상' },
  { ext:['dwg','dxf','skp'], keys:['도면','캐드','설계'], label:'도면' },
  { ext:['zip','7z','rar','tar','gz'], keys:['압축','백업','원본'], label:'압축' }
];

/* 이 파일이 이 폴더에 얼마나 어울리나 — 점수와 그 까닭을 같이 돌려줍니다 */
function tidyScore(f, t){
  const base = String(f.name).replace(/\.[^.]+$/, '');
  const n = normKey(base);
  const k = normKey(t.name);
  const ext = String(f.name).split('.').pop().toLowerCase();

  // ① 이름이 겹친다 — 가장 믿을 만합니다
  if(k.length >= 2 && n.includes(k)) return { s: 100 + k.length, why:'이름이 겹침' };
  if(n.length >= 2 && k.includes(n)) return { s: 90 + n.length,  why:'이름이 겹침' };
  for(let len = Math.min(k.length, 6); len >= 3; len--){
    for(let i = 0; i + len <= k.length; i++){
      if(n.includes(k.slice(i, i + len))) return { s: 50 + len, why:'이름이 비슷함' };
    }
  }
  // ② 폴더 이름이 연도 — 「파일 이름에 그 해가 적혀 있을 때만」 입니다.
  //    만든 날짜만 보고 넣으면 아무 파일이나 올해 폴더로 쓸려 들어갑니다.
  if(/^(19|20)\d{2}$/.test(t.name.trim())){
    const y = t.name.trim();
    if(base.indexOf(y) >= 0) return { s: 62, why: y + '년 파일' };
    // 만든 날짜는 참고만 — 자동으로 옮기는 문턱(TIDY_MIN)에는 못 미칩니다
    if(String(f.date || '').slice(0, 4) === y)
      return { s: 20, why: y + '년에 만든 파일' };
    return { s: 0, why:'' };
  }
  // ③ 파일 형식이 폴더 성격과 맞는다
  const kind = TIDY_KIND.find(x => x.ext.indexOf(ext) >= 0);
  if(kind && kind.keys.some(w => t.name.indexOf(w) >= 0))
    return { s: 40, why: '파일 형식 · ' + kind.label };

  return { s: 0, why:'' };
}

function tidySuggest(fileName){
  if(!tidy.targets) return [];
  const f = (tidy.files || []).find(x => x.name === fileName) || { name: fileName };
  return tidy.targets.map(t => ({ t:t, s: tidyScore(f, t).s }))
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.t);
}

/* ── 알아서 정리 ─────────────────────────────────────────────────
   파일마다 제일 어울리는 폴더를 골라 「이렇게 옮길게요」 를 먼저 보여줍니다.
   사람이 확인을 눌러야 실제로 움직이고, 옮긴 뒤에는 되돌릴 수 있습니다.
   자신 없는 것(점수가 낮거나 1·2등이 비슷한 것)은 손대지 않습니다.
   ---------------------------------------------------------------- */
const TIDY_MIN  = 40;    // 이 점수는 넘어야 옮깁니다
const TIDY_GAP  = 8;     // 1등이 2등보다 이만큼은 앞서야 합니다

/* 파일 이름을 낱말로 쪼갭니다.
   "2026-03-리플렛_최종본(1).ai" → ['리플렛','최종본']
   날짜·번호·버전처럼 폴더 이름이 될 수 없는 것은 버립니다. */
const TIDY_STOP = ['최종','최종본','수정','복사본','사본','원본','버전','시안본',
                   'final','copy','new','old','test','임시','확인','완료'];
function tidyWords(name){
  const base = String(name).replace(/\.[^.]+$/, '');
  return base
    .replace(/[0-9]{4}[-_.]?[0-9]{1,2}[-_.]?[0-9]{0,2}/g, ' ')   // 날짜
    .replace(/\bv?[0-9]+(차|회|번|판)?\b/gi, ' ')                 // 번호·버전
    .split(/[\s_\-.·,()\[\]{}+&]+/)
    .map(w => w.trim())
    .filter(w => w.length >= 2 && !/^[0-9]+$/.test(w)
                 && TIDY_STOP.indexOf(w.toLowerCase()) < 0);
}

/* 어울리는 폴더가 없는 파일들 중, 같은 낱말이 여러 번 나오면 그 낱말로 폴더를 냅니다 */
const TIDY_MK_MIN = 3;      // 이만큼 모여야 폴더를 만들자고 합니다

function tidyNewFolders(left){
  const byWord = {};
  left.forEach(x => {
    const seen = {};
    tidyWords(x.f.name).forEach(w => {
      if(seen[w]) return;                       // 한 파일이 같은 낱말로 두 번 세지 않게
      seen[w] = 1;
      (byWord[w] = byWord[w] || []).push(x.f);
    });
  });
  // 이미 있는 폴더 이름과 겹치면 그건 새로 만들 이유가 없습니다
  const have = (tidy.targets || []).map(t => normKey(t.name));
  const out = [];
  const taken = {};
  Object.keys(byWord)
    .filter(w => byWord[w].length >= TIDY_MK_MIN && have.indexOf(normKey(w)) < 0)
    .sort((a, b) => byWord[b].length - byWord[a].length || b.length - a.length)
    .forEach(w => {
      const files = byWord[w].filter(f => !taken[f.path]);
      if(files.length < TIDY_MK_MIN) return;    // 다른 낱말이 이미 가져갔습니다
      files.forEach(f => { taken[f.path] = 1; });
      out.push({ name: w, files: files });
    });
  return out;
}

function tidyPlan(){
  const out = { move: [], skip: [] };
  (tidy.files || []).forEach(f => {
    const scored = (tidy.targets || []).map(t => {
      const r = tidyScore(f, t);
      return { t:t, s:r.s, why:r.why };
    }).sort((a, b) => b.s - a.s);
    let top = scored[0];
    let second = scored[1];
    // 점수가 비슷한데 한쪽이 다른 쪽 안에 있으면, 더 안쪽 폴더가 맞습니다
    if(top && second && Math.abs(top.s - second.s) < 20){
      const inA = second.t.path.indexOf(top.t.path + '/') === 0;
      const inB = top.t.path.indexOf(second.t.path + '/') === 0;
      if(inA){ const x = top; top = second; second = scored[2]; void x; }
      else if(inB){ second = scored[2]; }
    }
    if(!top || top.s < TIDY_MIN){
      out.skip.push({ f:f, why:'어울리는 폴더를 못 찾음' });
    }else if(second && top.s - second.s < TIDY_GAP){
      out.skip.push({ f:f, why:'「' + top.t.name + '」 과 「' + second.t.name + '」 중 어느 쪽인지 애매함' });
    }else{
      out.move.push({ f:f, t:top.t, why:top.why });
    }
  });

  // 「없는 폴더는 만들어서」 를 켰을 때만 — 남은 것들 중 같은 낱말끼리 묶습니다
  out.make = [];
  if(tidy.mk){
    const groups = tidyNewFolders(out.skip);
    const used = {};
    groups.forEach(g => {
      g.files.forEach(f => { used[f.path] = 1; });
      out.make.push(g);
    });
    out.skip = out.skip.filter(x => !used[x.f.path]);
  }
  return out;
}

function tidyAuto(){
  if(!tidy.files || !tidy.targets){ toast('⚠️ 두 폴더를 먼저 골라주세요'); return; }
  tidy.plan = tidyPlan();
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function tidyPlanClose(){ tidy.plan = null; render(); }
function toggleTidyMk(){
  tidy.mk = !tidy.mk;
  if(tidy.plan) tidy.plan = tidyPlan();     // 켜자마자 다시 셈해서 보여줍니다
  render();
}
function tidyMakeDrop(i){
  if(!tidy.plan || !tidy.plan.make) return;
  const g = tidy.plan.make.splice(i, 1)[0];
  if(g) g.files.forEach(f => tidy.plan.skip.push({ f:f, why:'그냥 두기로 함' }));
  render();
}
function tidyPlanDrop(i){
  if(!tidy.plan) return;
  const x = tidy.plan.move.splice(i, 1)[0];
  if(x) tidy.plan.skip.push({ f:x.f, why:'그냥 두기로 함' });
  render();
}

/* 「이대로 옮기기」 — 하나씩 옮기고, 되돌릴 수 있게 적어둡니다 */
async function tidyRun(){
  const plan = tidy.plan;
  const mk = plan ? (plan.make || []) : [];
  if(!plan || (!plan.move.length && !mk.length)) return;

  const total = plan.move.length + mk.reduce((a, g) => a + g.files.length, 0);
  tidy.running = { done:0, all: total };
  tidy.undo = [];
  tidy.madeDirs = [];
  render();
  const failed = [];

  // ① 새 폴더를 먼저 만들고, 그 안으로 옮깁니다
  for(const g of mk){
    let dirPath = '';
    try{
      const o = await apiJson('nasfiles.php?action=mkdir', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ dir: tidy.to, name: g.name })
      });
      dirPath = o['경로'];
      tidy.madeDirs.push(dirPath);
    }catch(e){
      failed.push('폴더 「' + g.name + '」 을 만들지 못했습니다 — ' + apiErrText(e));
      tidy.running.done += g.files.length;
      render();
      continue;
    }
    for(const f of g.files){
      try{
        const out = await apiJson('nasfiles.php?action=movenas', {
          method:'POST', headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ src: f.path, dest: dirPath })
        });
        tidy.undo.push({ path: (out && out['옮긴곳']) || (dirPath + '/' + f.name),
                         back: tidy.from, name: f.name, to: g.name });
        tidy.done.unshift({ name: f.name, dest: g.name });
      }catch(e){ failed.push(f.name + ' — ' + apiErrText(e)); }
      tidy.running.done++;
      render();
    }
  }

  // ② 이미 있는 폴더로 옮깁니다
  for(const m of plan.move){
    try{
      const out = await apiJson('nasfiles.php?action=movenas', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ src: m.f.path, dest: m.t.path })
      });
      tidy.undo.push({ path: (out && out['옮긴곳']) || (m.t.path + '/' + m.f.name),
                       back: tidy.from, name: m.f.name, to: m.t.name });
      tidy.done.unshift({ name: m.f.name, dest: m.t.name });
    }catch(e){ failed.push(m.f.name + ' — ' + apiErrText(e)); }
    tidy.running.done++;
    render();
  }
  tidy.running = null;
  tidy.plan = null;
  tidy.files = null; tidy.targets = null;
  delete browseCache[tidy.from]; delete browseCache[tidy.to];
  render();
  await tidyLoad();
  if(failed.length) alert('옮기지 못한 것이 있습니다.\n\n' + failed.join('\n'));
  else toast('🪄 ' + tidy.undo.length + '개를 제자리로 옮겼습니다');
}

/* 방금 옮긴 것을 그대로 되돌립니다 */
async function tidyUndo(){
  const list = (tidy.undo || []).slice();
  if(!list.length) return;
  if(!confirm('방금 옮긴 ' + list.length + '개를 원래 폴더로 되돌릴까요?')) return;
  tidy.running = { done:0, all: list.length };
  render();
  const failed = [];
  for(const u of list){
    try{
      await apiJson('nasfiles.php?action=movenas', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ src: u.path, dest: u.back })
      });
    }catch(e){ failed.push(u.name); }
    tidy.running.done++;
    render();
  }
  // 이번에 만든 폴더가 비었으면 휴지통으로 보냅니다 (되돌리면 자취도 없게)
  for(const d of (tidy.madeDirs || [])){
    try{
      await apiJson('nasfiles.php?action=trash', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ path: d })
      });
    }catch(e){ /* 안에 뭔가 남아 있으면 그냥 둡니다 */ }
  }
  tidy.madeDirs = [];
  tidy.running = null;
  tidy.undo = [];
  tidy.done = [];
  tidy.files = null; tidy.targets = null;
  delete browseCache[tidy.from]; delete browseCache[tidy.to];
  render();
  await tidyLoad();
  if(failed.length) alert('되돌리지 못한 것: ' + failed.join(', '));
  else toast('↩︎ 되돌렸습니다');
}

/* 고르는 칸에서 폴더를 골랐을 때 */
function tidyMoveSel(sel, path, name){
  const dest = sel.value;
  sel.value = '';
  if(dest) tidyMove(path, dest, name);
}

async function tidyMove(path, dest, name){
  if(tidy.busy) return;
  tidy.busy = path; render();
  try{
    await apiJson('nasfiles.php?action=movenas', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ src: path, dest: dest })
    });
    tidy.files = tidy.files.filter(f => f.path !== path);
    tidy.done.unshift({ name: name, dest: dest.split('/').pop() });
    tidy.targets = null;                        // 개수를 다시 세어옵니다
    delete browseCache[tidy.from];
    delete browseCache[tidy.to];
    tidy.busy = null;
    render();
    tidyLoad();
  }catch(e){
    tidy.busy = null; render();
    alert('옮기지 못했습니다.\n\n' + apiErrText(e));
  }
}

    + '</div>'
    + '<div class="sec-bar" style="margin:8px 0 0">'
      + '<button class="btn primary" onclick="tidyAuto()" '
        + (tidy.running ? 'disabled ' : '')
        + 'title="파일마다 어울리는 폴더를 골라 「이렇게 옮길게요」 를 먼저 보여줍니다">'
        + '🪄 알아서 정리</button>'
      + '<button class="btn sm' + (tidy.mk ? ' primary' : '') + '" onclick="toggleTidyMk()" '
        + 'title="어울리는 폴더가 없을 때, 같은 낱말이 ' + TIDY_MK_MIN
        + '개 이상 모이면 그 낱말로 폴더를 냅니다">'
        + (tidy.mk ? '📁 없는 폴더는 만들어서' : '＋ 없는 폴더도 만들까요') + '</button>'
      + ((tidy.undo || []).length && !tidy.running
          ? '<button class="btn" onclick="tidyUndo()">↩︎ 방금 옮긴 '
            + tidy.undo.length + '개 되돌리기</button>' : '')
      + (tidy.running
          ? '<span class="hint">옮기는 중… ' + tidy.running.done + ' / '
            + tidy.running.all + '</span>'
          : '<span class="hint">바로 옮기지 않습니다 — 먼저 보여드리고, 확인하시면 그때 옮깁니다</span>')
    + '</div>'

    ? '<div class="fmeta" style="margin-bottom:10px">✅ 지금까지 ' + tidy.done.length + '개 옮김 — '

  const rows = tidy.files.map(f => {
    const sug  = tidySuggest(f.name);

                + esc('　'.repeat(Math.max(0, (t.depth || 1) - 1)) + tidyLabel(t))
                + (t.files ? ' · ' + t.files + '개' : '') + '</option>').join('')
            + '</select>')
      : '';

    return '<div class="tidyrow' + (tidy.busy === f.path ? ' busy' : '') + '">'
      + (f.img
          ? '<img class="tidy-th" loading="lazy" src="nasfiles.php?action=thumb&w=200&path='
            + encodeURIComponent(f.path) + '" alt="">'
          : '<span class="tidy-th tidy-ic">' + fileIcon(f.name) + '</span>')
      + '<div class="tidy-mid">'
        + '<div class="tidy-nm">' + esc(f.name) + '</div>'
        + '<div class="fmeta">' + esc(f.size) + ' · ' + esc(f.date) + '</div>'
        + '<div class="row" style="margin-top:7px">'
          + sug.map(t => btn(t, true)).join('')
          + restBox
          + (!(tidy.targets || []).length
              ? '<span class="fmeta">"옮길 곳" 안에 폴더가 없습니다</span>' : '')
        + '</div>'
      + '</div>'
      + '<a class="btn sm" href="nasfiles.php?action=download&path='
        + encodeURIComponent(f.path) + '">⬇</a>'
      + '</div>';
  }).join('');

  return head + picker + doneBar
    + '<div class="fmeta" style="margin-bottom:8px">남은 파일 ' + tidy.files.length
      + '개 · ⭐ 는 이름이 비슷해서 먼저 추천한 폴더입니다</div>'
    + '<div class="tidylist">' + rows + '</div>';
}

  return (c && c.files) ? c.files.filter(x => x.img) : [];
}

function openPic(navKey, i){
  picView = { navKey: navKey, i: i };
  drawPic();
}
function closePic(){
  picView = null;
  const el = document.getElementById('picbox');
  if(el) el.remove();
  document.removeEventListener('keydown', picKey);
}
function stepPic(d){
  if(!picView) return;
  const list = picsOf(picView.navKey);
  if(!list.length) return;
  picView.i = (picView.i + d + list.length) % list.length;
  drawPic();
}
function picKey(e){
  if(e.key === 'Escape') closePic();
  else if(e.key === 'ArrowRight') stepPic(1);
  else if(e.key === 'ArrowLeft')  stepPic(-1);
}

function drawPic(){
  const list = picsOf(picView.navKey);
  const x = list[picView.i];
  if(!x){ closePic(); return; }

  let el = document.getElementById('picbox');
  if(!el){
    el = document.createElement('div');
    el.id = 'picbox';
    el.className = 'picbox';
    el.onclick = ev => { if(ev.target === el) closePic(); };
    document.body.appendChild(el);
    document.addEventListener('keydown', picKey);
  }
  el.innerHTML =
      '<div class="pb-top">'
      + '<span class="pb-nm">' + esc(x.name) + '</span>'
      + '<span class="pb-ct">' + (picView.i + 1) + ' / ' + list.length
        + ' · ' + esc(x.size) + ' · ' + esc(x.date) + '</span>'
      + '<span style="margin-left:auto;display:flex;gap:6px">'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇ 내려받기</a>'
        + '<button class="btn sm" onclick="closePic()">✕ 닫기</button>'
      + '</span></div>'
    + '<button class="pb-nav pb-prev" onclick="stepPic(-1)">‹</button>'
    + '<img class="pb-img" src="nasfiles.php?action=image&path='
      + encodeURIComponent(x.path) + '" alt="' + esc(x.name) + '">'
    + '<button class="pb-nav pb-next" onclick="stepPic(1)">›</button>';
}

async function moreFiles(navKey){

function gotoFolder(navKey, dir){

  picShow[navKey]  = 40;

function reloadFolder(navKey, startDir){

  delete browseCache[dir];

/* ═══════════════ NAS 폴더에서 직접 정리하기 ═══════════════════════
   탐색기를 열지 않고도 여기서 폴더를 만들고, 파일을 올리고, 옮깁니다.
   연결한 NAS 폴더 안쪽에서만 됩니다.
   ================================================================= */

/* 새 폴더 만들기 */
async function nasMkdir(navKey, startDir){
  const dir = currentDirOf(navKey, startDir);
  if(!dir){ toast('⚠️ 폴더를 먼저 열어주세요'); return; }
  const name = prompt('여기에 만들 폴더 이름을 적어주세요.\n\n' + dir, '');
  if(name === null || !name.trim()) return;
  try{
    const out = await apiJson('nasfiles.php?action=mkdir', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ dir, name: name.trim() })
    });
    delete browseCache[dir]; await loadBrowse(dir);
    toast('📁 ' + (out['안내'] || '만들었습니다'));
  }catch(e){ alert('폴더를 만들지 못했습니다.\n\n' + apiErrText(e)); }
}

/* 폴더를 만들고 곧바로 그 안으로 들어갑니다 — 만들자마자 올릴 수 있게 */
async function nasMkdirGo(navKey, startDir){
  const dir = currentDirOf(navKey, startDir);
  if(!dir){ toast('⚠️ 폴더를 먼저 열어주세요'); return; }
  const name = prompt('여기에 만들 폴더 이름을 적어주세요.\n\n' + dir, '');
  if(name === null || !name.trim()) return;
  try{
    const out = await apiJson('nasfiles.php?action=mkdir', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ dir, name: name.trim() })
    });
    delete browseCache[dir];
    const made = out['경로'] || (dir + '/' + name.trim());
    await loadBrowse(dir);
    gotoFolder(navKey, made);                       // 만든 폴더 안으로 바로 들어갑니다
    toast('📁 ' + (out['안내'] || '만들었습니다') + ' — 이 안에 올리시면 됩니다');
  }catch(e){ alert('폴더를 만들지 못했습니다.\n\n' + apiErrText(e)); }
}

/* 이 폴더에 파일 올리기 */
function nasUpload(navKey, startDir){
  const dir = currentDirOf(navKey, startDir);
  if(!dir){ toast('⚠️ 폴더를 먼저 열어주세요'); return; }
  const el = document.getElementById('nasUpInput');
  if(!el) return;
  el.dataset.dir = dir;
  el.dataset.nav = navKey;
  el.dataset.start = startDir || '';
  el.value = '';
  el.click();
}

async function onNasUpload(input){
  const dir = input.dataset.dir || '';
  // ⚠️ input.files 는 살아 있는 목록이라, value 를 비우면 같이 비워집니다.
  //    반드시 먼저 베껴두고 나서 비워야 합니다. (안 그러면 아무것도 안 올라갑니다)
  const files = [...(input.files || [])];
  input.value = '';
  await nasPutFiles(dir, files);
}

/* 파일 여러 개를 한 폴더에 올립니다 (창에서 고르거나, 끌어다 놓거나) */
async function nasPutFiles(dir, files){
  files = [...(files || [])];
  if(!dir){ toast('⚠️ 올릴 폴더를 먼저 열어주세요'); return; }
  if(!files.length){ toast('⚠️ 고른 파일이 없습니다'); return; }
  let done = 0; const failed = [];
  toast('⬆ ' + files.length + '개 올리는 중…');
  for(const f of files){
    const fd = new FormData();
    fd.append('dir', dir);
    fd.append('file', f, f.name);
    try{
      const r = await fetch('nasfiles.php?action=upload', { method:'POST', body: fd });
      const o = JSON.parse(await r.text());
      if(!o.ok) throw new Error(o.error || '올리지 못했습니다');
      done++;
    }catch(e){ failed.push(f.name + ' — ' + (e.message || e)); }
  }
  delete browseCache[dir];
  await loadBrowse(dir);
  if(!failed.length) toast('✅ ' + done + '개를 올렸습니다');
  else alert(done + '개 올렸고 ' + failed.length + '개는 실패했습니다.\n\n' + failed.join('\n'));
}

/* 큰 판 — 컴퓨터에서 파일을 끌어다 놓는 자리 */
function nasDropAllow(ev){
  if(nasDrag) return;                        // NAS 안에서 옮기는 중이면 여기가 아닙니다
  if(!ev.dataTransfer || [...(ev.dataTransfer.types || [])].indexOf('Files') < 0) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'copy';
  ev.currentTarget.classList.add('dragover');
}
function nasDropLeave(ev){ ev.currentTarget.classList.remove('dragover'); }
async function nasDropFiles(ev, navKey, startDir){
  ev.currentTarget.classList.remove('dragover');
  if(nasDrag) return;
  const fs = ev.dataTransfer ? ev.dataTransfer.files : null;
  if(!fs || !fs.length) return;
  ev.preventDefault(); ev.stopPropagation();
  const dir = currentDirOf(navKey, startDir);
  if(!dir){ toast('⚠️ 올릴 폴더를 먼저 열어주세요'); return; }
  await nasPutFiles(dir, fs);
}
/* 큰 판을 눌러도 파일 고르기 창이 열립니다 */
function nasPickHere(navKey, startDir){ nasUpload(navKey, startDir); }

/* NAS 안에서 파일·폴더 옮기기 — 끌어다 놓기 */
let nasDrag = null;                                  // 지금 끌고 있는 NAS 경로

function dragNasItem(ev, path){
  nasDrag = path;
  try{ ev.dataTransfer.setData('text/plain', path); }catch(e){}
  ev.dataTransfer.effectAllowed = 'move';
}
function allowDropNas(ev){
  if(!nasDrag) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  ev.currentTarget.classList.add('dragover');
}
function leaveDropNas(ev){ ev.currentTarget.classList.remove('dragover'); }

async function dropNasInto(ev, toDir, navKey, startDir){
  ev.preventDefault(); ev.stopPropagation();
  ev.currentTarget.classList.remove('dragover');
  const from = nasDrag || (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
  nasDrag = null;
  if(!from || !toDir) return;
  await nasMoveTo(from, toDir, navKey, startDir);
}

async function nasMoveTo(from, to, navKey, startDir){
  try{
    const out = await apiJson('nasfiles.php?action=movehere', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from, to })
    });
    const here = currentDirOf(navKey, startDir);
    delete browseCache[here]; delete browseCache[to];
    await loadBrowse(here);
    toast('📦 ' + (out['안내'] || '옮겼습니다'));
  }catch(e){ alert('옮기지 못했습니다.\n\n' + apiErrText(e)); }
}

/* ═══════════════ 휴지통 ═══════════════════════════════════════════
   지우면 없애지 않고 「_휴지통」 으로 옮깁니다. 언제든 되돌릴 수 있고,
   완전히 없애는 것은 휴지통에서 따로 눌러야만 됩니다.
   ================================================================= */
const trash = { open:false, busy:false, list:null, error:'', ready:true, why:'' };

async function nasTrash(path, navKey, startDir, isDir, count){
  const name = String(path).split('/').pop();
  const what = isDir
    ? '폴더 「' + name + '」' + (count ? ' (안에 ' + count.toLocaleString('ko-KR') + '개)' : '')
    : '「' + name + '」';
  if(!confirm(what + ' 을(를) 지울까요?\n\n'
    + '바로 없애지 않고 휴지통(_휴지통)으로 보냅니다.\n'
    + '[🗑 휴지통] 에서 언제든 되돌릴 수 있습니다.')) return;
  try{
    const out = await apiJson('nasfiles.php?action=trash', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path })
    });
    const here = currentDirOf(navKey, startDir);
    delete browseCache[here]; await loadBrowse(here);
    trash.list = null;
    toast('🗑 ' + (out['안내'] || '휴지통으로 보냈습니다') + ' — 되돌리려면 [🗑 휴지통]');
  }catch(e){ alert('지우지 못했습니다.\n\n' + apiErrText(e)); }
}

async function openTrash(){
  trash.open = true; trash.busy = true; trash.error = ''; render();
  try{
    const out = await apiJson('nasfiles.php?action=trashlist');
    trash.list = out['목록'] || [];
  }catch(e){ trash.error = apiErrText(e); trash.list = []; }
  finally{ trash.busy = false; render(); }
}
function closeTrash(){ trash.open = false; render(); }

async function untrash(id){
  try{
    const out = await apiJson('nasfiles.php?action=untrash', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id })
    });
    Object.keys(browseCache).forEach(k => delete browseCache[k]);
    await openTrash();
    toast('↩︎ ' + (out['안내'] || '되돌렸습니다'));
  }catch(e){ alert('되돌리지 못했습니다.\n\n' + apiErrText(e)); }
}

async function purgeTrash(id, name){
  if(!confirm('「' + name + '」 을(를) 완전히 지울까요?\n\n이건 되돌릴 수 없습니다.')) return;
  try{
    await apiJson('nasfiles.php?action=trashpurge', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id })
    });
    await openTrash();
    toast('🗑 완전히 지웠습니다');
  }catch(e){ alert('지우지 못했습니다.\n\n' + apiErrText(e)); }
}

/* 단추로 옮기기 — 어디로 보낼지 골라줍니다 */
async function nasMovePick(path, navKey, startDir){
  const here = currentDirOf(navKey, startDir);
  const c = browseCache[here];
  const opts = [];
  if(c && c.parent) opts.push({ p:c.parent, label:'⬆ 상위 폴더' });
  ((c && c.folders) || []).forEach(f => { if(f.path !== path) opts.push({ p:f.path, label:'📁 ' + f.name }); });
  if(!opts.length){ toast('⚠️ 여기에는 옮길 만한 폴더가 없습니다'); return; }
  const pick = prompt('「' + path.split('/').pop() + '」 을(를) 어디로 옮길까요?\n\n'
    + opts.map((o, i) => '  ' + (i + 1) + ' = ' + o.label).join('\n'), '1');
  if(pick === null) return;
  const o = opts[Number(pick.trim()) - 1];
  if(!o){ toast('⚠️ 번호를 골라주세요'); return; }
  await nasMoveTo(path, o.p, navKey, startDir);
}

function currentDirOf(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];
  return (c && c.dir) ? c.dir : dir;
}

function crumbHtml(navKey, out, rootOverride){
  const root = rootOverride || out.root || '';
  const dir  = out.dir  || '';
  let rel = (root && dir.indexOf(root) === 0) ? dir.slice(root.length) : dir;
  rel = rel.replace(/^\//, '');
  const parts = rel ? rel.split('/') : [];

  const bits = [];
  // 공유폴더가 여럿이면 맨 앞에 「전체」 를 둡니다 — 두 폴더를 한 자리에서 오갑니다
  const many = (out.roots || []).length > 1;
  if(many){
    bits.push('<button class="crumb' + (root ? '' : ' on') + '"'
      + (root ? ' onclick="gotoFolder(\'' + jsq(navKey) + '\',\'\')"' : '')
      + '>🗂 전체</button>');
    if(root) bits.push('<span class="crumbsep">›</span>');
  }
  if(root || !many){
    bits.push('<button class="crumb' + (parts.length ? '' : ' on') + '"'
      + (parts.length ? ' onclick="gotoFolder(\'' + jsq(navKey) + '\',\'' + jsq(root) + '\')"' : '')
      + '>' + (many ? '📂 ' : '🏠 ') + esc(root.split('/').pop() || '전체') + '</button>');
  }

  let acc = root;
  parts.forEach((seg, i) => {
    acc += '/' + seg;
    bits.push('<span class="crumbsep">›</span>');
    bits.push(i === parts.length - 1
      ? '<span class="crumb on">' + esc(seg) + '</span>'
      : '<button class="crumb" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
        + jsq(acc) + '\')">' + esc(seg) + '</button>');
  });
  return '<div class="crumbs">' + bits.join('') + '</div>';
}

/* ── 📋 경로로 가기 ──────────────────────────────────────────────
   탐색기 주소창에서 복사한 경로를 그대로 붙여넣으면 그 폴더를 엽니다.
     Y:\넷폼알앤디 공유폴더\…\000. 공용디자인\명함_캐논프린터기\2026명함재단선
     \\netformrnd\넷폼알앤디 공유폴더\…
     /volume1/넷폼알앤디 공유폴더/…
   드라이브 문자만으로는 어느 볼륨인지 알 수 없어, NAS 가 뒤쪽 폴더
   이름부터 하나씩 맞춰가며 실제 자리를 찾아 줍니다 (띄어쓰기·괄호가
   조금 달라도 찾습니다).
   ------------------------------------------------------------- */
let goPath = { txt:'', busy:false, err:'', tried:[] };

function focusGoPath(){
  const el = document.getElementById('goPathIn');
  if(el){ el.focus(); el.select(); el.scrollIntoView({ block:'center' }); }
}
function goPathKey(e){ if(e.key === 'Enter') goPathRun(); }

async function goPathRun(){
  const el = document.getElementById('goPathIn');
  const v  = (el ? el.value : goPath.txt).trim();
  goPath.txt = v; goPath.err = ''; goPath.tried = [];
  if(!v){ goPath.err = '경로를 붙여넣어 주세요.'; redraw(); return; }

  goPath.busy = true; redraw();
  try{
    const out = await apiJson('nasfiles.php?action=resolve&path=' + encodeURIComponent(v));
    goPath.busy = false;
    goPath.txt  = '';
    gotoFolder('nas', out.dir);
    toast('📂 ' + out.dir.split('/').pop());
  }catch(e){
    goPath.busy = false;
    goPath.err  = apiErrText(e);
    // 파일 경로를 넣었을 수 있습니다 — 한 단계 위(폴더)로 다시 해봅니다
    const up = v.replace(/[\\/]+$/, '').replace(/[\\/][^\\/]*$/, '');
    if(up && up !== v && !/^[A-Za-z]:$/.test(up)){
      try{
        const out2 = await apiJson('nasfiles.php?action=resolve&path=' + encodeURIComponent(up));
        goPath.err = ''; goPath.txt = '';
        gotoFolder('nas', out2.dir);
        toast('📂 파일이 든 폴더를 열었습니다');
      }catch(e2){}
    }
    redraw();
  }
}

async function runScan(dir){
  pick = null;
  scanRun = { starting:true };
  render();
  try{
    scanRun = await apiJson('nasfiles.php?action=scanstart&dir=' + encodeURIComponent(dir));
    render();
    scanLoop();
  }catch(e){
    scanRun = null;
    render();
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n') : ''));
  }
}

function startScan(){ openPicker(); }

async function scanLoop(){
  while(scanRun && !scanRun.done){
    let out;
    try{
      out = await apiJson('nasfiles.php?action=scanstep');
    }catch(e){
      scanRun = null; render();
      alert(apiErrText(e)
        + (e['못읽은폴더'] && e['못읽은폴더'].length
            ? '\n\n못 읽은 폴더:\n' + e['못읽은폴더'].slice(0, 10).join('\n') : ''));
      return;
    }
    if(!scanRun) return;           // 도중에 중단한 경우
    scanRun = out;
    render();
  }
  if(scanRun && scanRun.done){
    browseCache2Clear();
    await nasCheck();
    toast('✅ 목록을 다 만들었습니다 — ' + scanRun['찾은파일'].toLocaleString('ko-KR') + '개');
  }
}

function browseCache2Clear(){
  Object.keys(browseCache).forEach(k => { delete browseCache[k]; });
  Object.keys(folderNav).forEach(k => { delete folderNav[k]; });
}

async function cancelScan(){
  if(!confirm('목록 만들기를 중단할까요?')) return;
  scanRun = null;
  render();
  try{ await apiJson('nasfiles.php?action=scancancel'); }catch(e){}
  toast('중단했습니다');
}

/* 이름을 비교하기 좋게 다듬습니다 (파일 정리에서 폴더를 추천할 때 씁니다).
   "00. 브랜드 공유폴더" → "브랜드공유폴더", "POUR 솔루션" → "솔루션" */
function normKey(s){
  return String(s).toLowerCase()
    .replace(/[#＃]/g, '')
    .replace(/^[0-9]+[.\-_\s]*/, '')
    .replace(/^[_\-.\s]+/, '')
    .replace(/pour/g, '')
    .replace(/[\s_\-.()\[\]·]/g, '');
}

/* 폴더 하나를 화면에 그립니다.
   navKey  : 이 탐색기를 구분하는 이름 ('nas' 또는 연결폴더 id)
   startDir: 처음 보여줄 폴더 (''이면 훑은 폴더 전체) */
function folderBrowserHtml(navKey, startDir, opts){
  opts = opts || {};
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];

  if(!c){ setTimeout(() => loadBrowse(dir), 10); return '<div class="fmeta">불러오는 중…</div>'; }
  if(c.loading) return '<div class="fmeta">불러오는 중…</div>';
  /* 못 찾았을 때도 빠져나올 길은 있어야 합니다. 전에는 경고 한 줄만
     남기고 단추를 통째로 안 그려서, 들어간 사람이 갇혔습니다. */
  if(c.error){
    const up = String(dir || '').replace(/\/+$/, '').replace(/\/[^\/]+$/, '');
    const home = startDir || '';
    const gone = /그런 폴더가 없습니다|찾지 못/.test(String(c.error));
    return '<div class="sec-bar" style="margin:0 0 10px">'
      + (dir && up !== dir
          ? '<button class="btn sm" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
            + jsq(up) + '\')">⬆ 상위 폴더</button>' : '')
      + (dir !== home
          ? '<button class="btn sm" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
            + jsq(home) + '\')">⬅ 처음으로</button>' : '')
      + '<button class="btn sm" onclick="reloadFolder(\'' + jsq(navKey) + '\',\''
        + jsq(home) + '\')">↻ 다시</button>'
      + '</div>'
      + '<div class="fmeta" style="white-space:pre-wrap">⚠️ ' + esc(c.error)
      + (gone ? '\n\n폴더 이름을 바꾸셨다면 (예: 「아파트스퀘어」 → 「5. 아파트스퀘어」) '
              + '[🧹 파일 정리] 를 한 번 누르면 갈라진 폴더를 합치고 적어 둔 자리도 맞춥니다.'
              : '')
      + '</div>';
  }

  // parent 가 '' 이면 「전체」 화면(공유폴더 두 개가 나란히 보이는 곳)입니다
  const canUp = c.parent !== null && c.parent !== undefined && (!startDir || c.dir !== startDir);
  const tools = '<div class="sec-bar" style="margin:0 0 10px">'
    + (canUp
        ? '<button class="btn sm" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(c.parent) + '\')">'
          + (c.parent === '' ? '⬆ 공유폴더 전체' : '⬆ 상위 폴더') + '</button>' : '')
    + '<button class="btn sm" onclick="reloadFolder(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">↻ 새로고침</button>'
    + '<button class="btn sm" onclick="copyDirPath(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">📋 폴더 경로</button>'
    + '<button class="btn sm" onclick="nasMkdir(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')" title="이 폴더 안에 새 폴더를 만듭니다">＋ 새 폴더</button>'
    + '<button class="btn sm" onclick="nasUpload(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')" title="이 폴더에 파일을 올립니다">⬆ 여기에 올리기</button>'
    + '<button class="btn sm" onclick="openTrash()" '
      + 'title="지운 것을 보고 되돌립니다">🗑 휴지통</button>'
    + '<span class="hint">이 폴더 ' + (c.fileCount || 0).toLocaleString('ko-KR') + '개'
      + ' · 아래 전체 ' + (c.total || 0).toLocaleString('ko-KR') + '개</span>'
    + '</div>';

  // 지금 열어둔 폴더에 바로 올릴 수 있는 자리 (끌어다 놓거나 눌러서 고르거나)
  const here = c.dir || '';
  const hereName = here.split('/').pop() || '이 폴더';
  const drop = (STORAGE_MODE === 'nas' && here)
    ? '<div class="nasdrop" '
      + 'ondragover="nasDropAllow(event)" ondragleave="nasDropLeave(event)" '
      + 'ondrop="nasDropFiles(event,\'' + jsq(navKey) + '\',\'' + jsq(startDir || '') + '\')">'
      + '<span class="ic" onclick="nasPickHere(\'' + jsq(navKey) + '\',\''
        + jsq(startDir || '') + '\')">⬆</span>'
      + '<span class="tx" onclick="nasPickHere(\'' + jsq(navKey) + '\',\''
        + jsq(startDir || '') + '\')">'
        + '<span class="t"><span class="here">' + esc(hereName) + '</span> 안에 파일 올리기</span>'
        + '<span class="s">컴퓨터에서 끌어다 놓거나, 눌러서 고르세요 · '
        + '고른 파일이 <b>이 폴더에 그대로</b> 들어갑니다 '
        + '(폴더를 저절로 만들거나 다른 데로 옮기지 않습니다)</span>'
      + '</span>'
      + '<button class="btn sm mk" onclick="event.stopPropagation();nasMkdirGo(\'' + jsq(navKey)
        + '\',\'' + jsq(startDir || '') + '\')" '
        + 'title="여기에 새 폴더를 만들고 그 안으로 들어갑니다">📁 새 폴더</button>'
      + '</div>'
    : '';

  const folders = c.folders.length
    ? '<div class="fgrid">' + c.folders.map(f =>
        '<div class="fwrap">'
        + '<button class="fcard" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(f.path) + '\')" title="' + esc(f.name) + ' — 파일을 끌어다 놓으면 이 폴더로 옮겨집니다"'
        + ' draggable="true" ondragstart="dragNasItem(event,\'' + jsq(f.path) + '\')"'
        + ' ondragover="allowDropNas(event)" ondragleave="leaveDropNas(event)"'
        + ' ondrop="dropNasInto(event,\'' + jsq(f.path) + '\',\'' + jsq(navKey) + '\',\''
          + jsq(startDir || '') + '\')">'
        + '<span class="fc-ico">📁</span><span class="fc-t">'
        + '<span class="fc-nm">' + esc(f.name) + '</span>'
        + '<span class="fc-sub">' + f.count.toLocaleString('ko-KR') + '개 · '
          + esc(f.size) + '</span></span></button>'
        + '<button class="btn sm danger fdel" onclick="nasTrash(\'' + jsq(f.path) + '\',\''
          + jsq(navKey) + '\',\'' + jsq(startDir || '') + '\',true,' + (f.count || 0) + ')" '
          + 'title="이 폴더를 휴지통으로 보냅니다">🗑</button></div>').join('') + '</div>'
    : '';

  // 사진과 그 밖의 파일을 나눕니다 — 사진은 눈으로 보고 고르게 합니다
  const pics   = c.files.filter(x => x.img);
  const others = c.files.filter(x => !x.img);

  const picShown = picShow[navKey] || 40;
  const picSlice = pics.slice(0, picShown);
  const picGrid = pics.length
    ? '<div class="picsec">'
      + '<div class="sec-bar" style="margin:0 0 10px">'
        + '<span class="mh" style="margin:0">🖼 사진 ' + pics.length.toLocaleString('ko-KR') + '장</span>'
        + '<span class="hint">누르면 크게 보고, 화살표로 넘길 수 있습니다</span>'
      + '</div>'
      + '<div class="picgrid">' + picSlice.map((x, i) =>
          '<button class="pic" onclick="openPic(\'' + jsq(navKey) + '\',' + i + ')" '
          + 'title="' + esc(x.name) + '">'
          + '<img loading="lazy" src="nasfiles.php?action=thumb&w=320&path='
            + encodeURIComponent(x.path) + '" alt="' + esc(x.name) + '">'
          + '<span class="pic-nm">' + esc(x.name) + '</span></button>').join('')
      + '</div>'
      + ((pics.length > picSlice.length || c.files.length < c.fileCount)
          ? '<div style="margin-top:10px"><button class="btn sm" onclick="morePics(\'' + jsq(navKey)
            + '\')">사진 더 보기 (' + picSlice.length.toLocaleString('ko-KR') + ' / '
            + (c.files.length < c.fileCount ? '약 ' : '')
            + pics.length.toLocaleString('ko-KR') + ')</button></div>' : '')
      + '</div>'
    : '';

  // 사진이 아닌 파일 목록은 접어둡니다. 하위 폴더가 없으면 바로 펼칩니다.
  const fOpen = (fileOpen[navKey] !== undefined) ? fileOpen[navKey] : (!c.folders.length && !pics.length);
  const shown = fileShow[navKey] || 30;
  const slice = others.slice(0, shown);

  const fileHead = others.length
    ? '<button class="fhead" style="border:1px solid var(--border);border-radius:10px;'
      + 'background:var(--bg-secondary)" onclick="toggleFiles(\'' + jsq(navKey) + '\')">'
      + '<span class="fh-ar">' + (fOpen ? '▾' : '▸') + '</span>'
      + '<span class="fh-ic">📄</span>'
      + '<span class="fh-nm">그 밖의 파일</span>'
      + '<span class="fh-ct">' + others.length.toLocaleString('ko-KR') + '개</span>'
      + '</button>'
    : '';

  const files = (others.length && fOpen)
    ? '<div class="mbox" style="margin-top:8px">' + slice.map(x =>
        '<div class="krow" style="align-items:center" draggable="true" '
        + 'ondragstart="dragNasItem(event,\'' + jsq(x.path) + '\')" '
        + 'title="끌어다 위 폴더에 놓으면 옮겨집니다">'
        + '<span class="fileicon" style="font-size:15px">' + fileIcon(x.name) + '</span>'
        + '<span style="flex:1;min-width:0;white-space:normal;word-break:break-all">'
          + '<b style="color:var(--text-primary)">' + esc(x.name) + '</b></span>'
        + '<span class="fmeta" style="white-space:nowrap;margin:0">'
          + esc(x.size) + ' · ' + esc(x.date) + '</span>'
        + '<button class="btn sm" onclick="nasMovePick(\'' + jsq(x.path) + '\',\''
          + jsq(navKey) + '\',\'' + jsq(startDir || '') + '\')" title="다른 폴더로 옮기기">📦</button>'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇</a>'
        + '<button class="btn sm danger" onclick="nasTrash(\'' + jsq(x.path) + '\',\''
          + jsq(navKey) + '\',\'' + jsq(startDir || '') + '\',false)" '
          + 'title="휴지통으로 보냅니다 (되돌릴 수 있습니다)">🗑</button>'
        + '</div>').join('')
      + ((others.length > slice.length || c.files.length < c.fileCount)
          ? '<div style="margin-top:10px"><button class="btn sm" onclick="moreFiles(\'' + jsq(navKey)
            + '\')">파일 더 보기 (' + slice.length.toLocaleString('ko-KR') + ' / '
            + (c.files.length < c.fileCount ? '약 ' : '')
            + others.length.toLocaleString('ko-KR') + ')</button></div>' : '')
      + '</div>'
    : '';

  const nothing = (!c.folders.length && !c.files.length)
    ? '<div class="empty">이 폴더에는 파일이 없습니다.</div>' : '';

  return tools + crumbHtml(navKey, c, opts.crumbRoot) + drop + folders
       + picGrid + fileHead + files + nothing;
}

/* NAS 경로를 윈도우 탐색기에 붙여넣을 수 있는 모양으로 복사합니다 */
async function copyText(p){
  const win = toWinPath(p);
  try{
    await navigator.clipboard.writeText(win);
    toast('📋 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

async function copyDirPath(navKey, startDir){
  const win = toWinPath(currentDirOf(navKey, startDir));
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

/* 훑을 폴더(목록을 만들 최상위 폴더)를 바꿉니다.
   Y:\... , \\netformrnd\... , /volume1/... 아무 형태나 받습니다. */
async function setScanRoot(){
  const now = (nasState.info && nasState.info['다음에훑을폴더'])
           || (nasState.info && nasState.info['훑은폴더']) || '';
  const v = prompt(
    '파일 목록을 만들 최상위 폴더를 넣어주세요.\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\n\n'
    + '「올린 파일 폴더」(01. 브랜드마케팅팀) 는 여기 적지 않아도 함께 훑습니다.\n'
    + '바꾼 뒤에는 NAS 작업 스케줄러에서 scan.sh 를 한 번 더 실행해 주세요.', now);
  if(v === null) return;
  if(!v.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  try{
    const out = await apiJson('nasfiles.php?action=setroot', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ dir: v })
    });
    toast('✅ ' + out['훑을폴더'] + ' — 작업 스케줄러에서 scan.sh 를 실행해 주세요');
    nasCheck();
  }catch(e){
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n')
                 + '\n\n폴더 이름에 띄어쓰기나 점(.)이 있으면 그대로 넣어주세요.' : ''));
  }
}

/* 같은 것을 다른 분과 동시에 고쳤을 때 뜨는 띠.
   내 것을 그대로 두되, 상대가 쓴 내용을 볼 수 있게 남겨둡니다. */
function clashBar(b){
  const list = b._conflicts || [];
  if(!list.length) return '';
  return '<div class="clashbar">'
    + '<div class="cb-top">⚠️ <b>같은 것을 다른 분과 같은 시간에 고쳤습니다.</b> '
      + '지금 화면에는 <b>제가 쓴 내용</b>이 남아 있고, '
      + '다른 분이 쓰신 내용은 아래에 그대로 보관해 두었습니다.</div>'
    + list.map(c =>
        '<div class="cb-item">'
        + '<div class="cb-h"><b>' + esc(c['무엇']) + '</b>'
          + '<span class="cb-when">' + esc(new Date(c['시각']).toLocaleString('ko-KR',
              { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })) + '</span>'
          + '<button class="btn sm" onclick="clashCopy(\'' + jsq(c.id) + '\')">📋 복사</button>'
          + '<button class="btn sm danger" onclick="clashDrop(\'' + jsq(c.id) + '\')">확인함</button>'
        + '</div>'
        + '<pre class="cb-body">' + esc(clashText(c['상대내용'])) + '</pre>'
        + '</div>').join('')
    + '</div>';
}

function clashText(v){
  if(typeof v === 'string') return v;
  if(!v || typeof v !== 'object') return String(v);
  return Object.keys(v).filter(k => k !== 'id' && k !== 'updatedAt')
    .map(k => k + ': ' + (typeof v[k] === 'string' ? v[k] : JSON.stringify(v[k])))
    .join('\n');
}

function clashFind(id){
  const b = currentBrand();
  return b && (b._conflicts || []).find(c => c.id === id);
}

function clashCopy(id){
  const c = clashFind(id);
  if(!c) return;
  const t = clashText(c['상대내용']);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(
    () => toast('📋 복사했습니다'), () => toast('⚠️ 복사하지 못했습니다'));
  else toast('⚠️ 이 브라우저는 복사를 지원하지 않습니다');
}

function clashDrop(id){
  const b = currentBrand();
  if(!b) return;
  b._conflicts = (b._conflicts || []).filter(c => c.id !== id);
  markDirty(); render();
}

function renderBrand(){
  const b = currentBrand();
  const main = document.getElementById('main');
  if(!b){
    renderHome();
    return;
  }
  const counts = {
    // 자동화 · 바로가기는 한 탭에서 같이 봅니다
    automations: autoCount(b) + (b.links || []).length,
    channels: (b.channels || []).length,
    inquiries: (inquiryCache.byBrand[b.name] || []).length,
    // 브랜드북 · 히스토리도 한 탭입니다
    book: bookFilled(b) + ((b.masterPrompt || '').trim() ? 1 : 0) + recsOf(b).length,
    // 📖 소개 — 브랜드북을 올려 두었으면 1
    path: pathBook(b) ? 1 : 0,
    blog: blog.loaded ? blogOf(b).length : 0
  };
  /* 예전 📕 브랜드 탭(연혁 · 기획서 · 마스터프롬프트)은 내려둔 채입니다.
     자료(b.hist · b.book · b.docs · b.masterPrompt)와 코드는 그대로 있습니다.
       ['book','📕 브랜드'],                                                        */
  const tabDefs = [
    ['path','📖 소개'],
    ['inquiries','📞 문의'],
    ['automations','🤖 자동화 · 바로가기'],
    ['channels','📣 마케팅'],
    ['blog','✍️ 블로그']
  ];

  main.innerHTML =
    clashBar(b)
    + '<div class="panel">'
    + '<div class="bhead">'
      + '<div class="icon">' + esc(b.icon || '🏷️') + '</div>'
      + '<div><h2>' + esc(b.name) + '</h2>'
        + '<div class="meta">' + esc(b.desc || '설명 없음')
        + (b.owner ? ' · 담당 ' + esc(b.owner) : '') + '</div></div>'
      + '<div class="ba">'
        + '<button class="btn sm" onclick="openBrandModal(\'' + b.id + '\')">수정</button>'
        + '<button class="btn sm danger" onclick="deleteBrand(\'' + b.id + '\')">삭제</button>'
      + '</div>'
    + '</div>'
    + '<div class="tabs">' + tabDefs.map(([k, label]) =>
        '<button class="tab' + (currentTab === k ? ' on' : '') + '" onclick="selectTab(\'' + k + '\')">'
        + label + (counts[k] ? '<span class="n">' + counts[k] + '</span>' : '') + '</button>'
      ).join('') + '</div>'
    + '<div class="tabbody" id="tabbody"></div>'
    + '</div>';

  const body = document.getElementById('tabbody');
  // 예전에 따로 있던 탭들은 합쳐진 탭으로 보냅니다
  // 📕 브랜드 탭을 내려둔 동안은 문의로 보냅니다 (없는 탭에 갇히지 않게)
  if(currentTab === 'prompt' || currentTab === 'history' || currentTab === 'book')
    currentTab = 'path';
  if(currentTab === 'links') currentTab = 'automations';

  if(currentTab === 'assets'){          // 자료는 🗂️ NAS 자료 한 곳으로 모았습니다
    goNas(); return;
  }
  if(currentTab === 'inquiries') {
    body.innerHTML = viewInquiries(b);
    loadInquiries();
    setTimeout(inquiryTick, 20);      // 탭을 열면 최신인지 한 번 확인합니다
    bindCsvInput();
  }
  else if(currentTab === 'costs'){          // 예전 주소로 들어온 경우 — 업무로 보냅니다
    goView('costs'); return;
  }
  else if(currentTab === 'tasks'){          // 할 일은 업무 → ✅ 할 일 로 모았습니다
    goView('tasks'); taskBrand = b.id; render(); return;
  }
  else if(currentTab === 'path'){
    body.innerHTML = pathViewHtml(b);
    setTimeout(gbGrowAll, 0);
  }
  else if(currentTab === 'blog') body.innerHTML = viewBlogBrand(b);
  else if(currentTab === 'book'){
    // 브랜드북 → 브랜드 히스토리 → 마스터프롬프트
    // 읽기 화면은 서사만 보여줍니다 — 마스터프롬프트는 [✏️ 고치기] 쪽에 둡니다
    body.innerHTML = viewHistory(b)
      + (histTab === 'plans' || brandRead ? ''
          : '<div class="pwrap">' + viewPrompt(b) + '</div>');
    setTimeout(gbGrowAll, 0);
    setTimeout(gbGrowAll, 140);
  }
  else if(currentTab === 'channels') body.innerHTML = viewChannels(b);
  else if(currentTab === 'automations'){
    body.innerHTML = viewTools(b) + viewCards(b, 'automations')
      + '<div class="hsec">🔗 바로가기</div>' + viewLinks(b);
  }
  else body.innerHTML = viewCards(b, currentTab);
}

/* ── ✎ 칸 카드도 그 자리에서 ─────────────────────────────────
   할 일 · 자동화 · 바로가기 · 자료 · 연혁 · 비용은 줄마다 [수정] 을
   눌러 <<화면을 덮는 모달>> 을 열어야 했습니다. 이름 한 글자를 고치려고
   뒤의 목록이 가려지고, 저장을 눌러야 돌아옵니다. 읽던 자리에서 바로
   고치게 합니다 — 모달은 여러 칸을 한꺼번에 채울 때만 씁니다. */
function itemFieldSet(bid, type, id, f, v){
  const b = bid ? brandById(bid) : null;
  const box = b ? b[type] : data[type];
  const x = (box || []).find(y => y.id === id); if(!x) return;
  x[f] = v;
  x.updatedAt = new Date().toISOString();
  if(b) markDirty(b.id); else markDirtyAll();
}
/* 메모는 비면 안 그려져서 적을 길이 모달뿐이었습니다. 자리는 늘 두되
   48칸이 「＋ 메모」 로 도배되지 않게 손을 올렸을 때만 보입니다. */
function itemEdAttr(bid, type, id, f, ml, ph){
  return ' data-ed="item" data-g="' + esc(bid) + '" data-k="' + esc(type)
    + '" data-i="' + esc(id) + '" data-f="' + f + '"'
    + (ml ? ' data-ml="1"' : '') + (ph ? ' data-ph="' + esc(ph) + '"' : '');
}
function itemMemoHtml(bid, type, id, f, v){
  const t = String(v || '').trim();
  return t
    ? '<div class="cd"' + itemEdAttr(bid, type, id, f, 1, '메모') + '>' + esc(t) + '</div>'
    : '<div class="cd cd-non"' + itemEdAttr(bid, type, id, f, 1, '메모') + '>＋ 메모</div>';
}
function viewCards(b, type){
  const t = TYPES[type];
  const list = b[type];
  if(!list.length) return secBar(type) + '<div class="empty">' + t.empty + '</div>';

  return secBar(type) + '<div class="cards">' + list.map(it => {
    const bits = [];
    if(type === 'automations'){
      if(it.tool)   bits.push('<span class="chip">' + esc(it.tool) + '</span>');
      if(it.status) bits.push('<span class="chip ' + statusClass(it.status) + '">' + esc(it.status) + '</span>');
    }else{
      if(it.kind) bits.push('<span class="chip">' + esc(it.kind) + '</span>');
    }
    if(it.url){
      bits.push(isUrl(it.url)
        ? '<a class="lnk" href="' + esc(it.url) + '" target="_blank" rel="noopener">바로가기 ↗</a>'
        : '<span class="path">' + esc(it.url) + '</span>'
          + '<button class="btn sm" title="경로를 복사해 탐색기 주소창에 붙여넣으세요" '
          + 'onclick="copyPath(\'' + type + '\',\'' + it.id + '\')">📋 경로 복사</button>');
    }
    /* 메모가 desc 인 갈래와 note 인 갈래가 섞여 있습니다 —
       적혀 있는 쪽, 없으면 그 갈래가 쓰는 쪽에 적습니다 */
    const dk = String(it.desc || '').trim() ? 'desc'
             : String(it.note || '').trim() ? 'note'
             : ((t.fields || []).some(f => f.key === 'desc') ? 'desc' : 'note');
    return '<div class="card">'
      + '<div class="ca">'
        + '<button class="btn sm" onclick="openItemModal(\'' + type + '\',\'' + it.id + '\')" '
          + 'title="칸을 한꺼번에 채웁니다 — 한 칸만 고칠 때는 그 글을 바로 누르세요">수정</button>'
        + '<button class="btn sm danger" onclick="deleteItem(\'' + type + '\',\'' + it.id + '\')">삭제</button>'
      + '</div>'
      + '<div class="ct"' + itemEdAttr(b.id, type, it.id, 'title', 0, t.label + ' 이름')
        + '>' + esc(it.title) + '</div>'
      + (bits.length ? '<div class="row">' + bits.join('') + '</div>' : '')
      + itemMemoHtml(b.id, type, it.id, dk, it[dk])
      + '</div>';
  }).join('') + '</div>';
}

/* ================= 자동화 도구 (실행되는 HTML 파일) =================
   생성기처럼 눌러서 쓰는 도구를 올려두고 바로 실행합니다.
   읽기용 문서와 달리 스크립트가 그대로 살아 있어야 합니다.
   ================================================================== */
let runningTool = null;   // 지금 화면 안에서 실행 중인 도구 id

function toolUrl(t){
  return 'files.php?action=run&path=' + encodeURIComponent(t.filePath || '');
}

function pickTool(){
  if(STORAGE_MODE !== 'nas'){
    alert('도구 올리기는 NAS 주소로 접속했을 때만 됩니다.\n\n'
      + nasUrl() + ' 로 열어주세요.');
    return;
  }
  const el = document.getElementById('toolInput');
  if(el) el.click();
}

async function uploadTools(fileList){
  const b = currentBrand();
  if(!b) return;
  const files = Array.from(fileList || []);
  if(!files.length) return;
  b.tools = b.tools || [];

  for(const f of files){
    if(!/\.html?$/i.test(f.name)){
      alert('"' + f.name + '" 은 HTML 파일이 아닙니다. 도구는 .html 파일만 올릴 수 있습니다.');
      continue;
    }
    toast('🛠 "' + f.name + '" 올리는 중…');
    try{
      const fd = new FormData();
      fd.append('brand', b.name);
      fd.append('sub', '도구');
      fd.append('file', f);
      const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try{ out = JSON.parse(text); }catch(e){}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '업로드 실패');

      b.tools.unshift({ id: uid('t'), name: out.fileName, size: out.fileSize,
                        filePath: out.filePath || '', at: new Date().toISOString() });
    }catch(e){
      alert('"' + f.name + '" 을 올리지 못했습니다.\n\n' + (e.message || e));
    }
  }
  await saveAll(true);
  render();
  toast('✅ 도구를 올렸습니다');
}

function runToolHere(id){
  runningTool = (runningTool === id) ? null : id;
  render();
}

function removeTool(id){
  const b = currentBrand();
  if(!b) return;
  const t = (b.tools || []).find(x => x.id === id);
  if(!t) return;
  if(!confirm('"' + t.name + '" 을 목록에서 지울까요?\n\n'
    + 'NAS의 실제 파일은 자료 폴더에 그대로 남습니다.\n'
    + '목록에서는 휴지통으로 가니 되돌릴 수 있습니다.')) return;
  trashPut('자동화 도구', t.label || t.name, t, { kind:'item', type:'tools', brandId: b.id });
  b.tools = b.tools.filter(x => x.id !== id);
  deletedIds.add(id);
  if(runningTool === id) runningTool = null;
  markDirtyAll();
  render();
  toast('🗑️ 휴지통으로 보냈습니다');
}

function renameTool(id){
  const b = currentBrand();
  const t = (b.tools || []).find(x => x.id === id);
  if(!t) return;
  const v = prompt('이 도구를 뭐라고 부를까요?', t.label || t.name.replace(/\.html?$/i, ''));
  if(v === null) return;
  t.label = v.trim();
  markDirty();
  render();
}

function viewTools(b){
  const list = b.tools || [];

  const bar = '<div class="sec-bar">'
    + '<button class="btn" onclick="pickTool()">🛠 도구 파일 올리기</button>'
    + '<span class="hint">생성기처럼 눌러서 쓰는 HTML 도구를 올려두면 여기서 바로 실행합니다</span>'
    + '</div>'
    + '<input type="file" id="toolInput" accept=".html,.htm" multiple style="display:none" '
      + 'onchange="const f=Array.from(this.files); this.value=\'\'; uploadTools(f)">';

  if(!list.length) return bar;

  const cards = list.map(t => {
    const on = runningTool === t.id;
    return '<div class="toolcard' + (on ? ' on' : '') + '">'
      + '<div class="tc-head">'
        + '<span class="tc-ic">🛠</span>'
        + '<span class="tc-nm">' + esc(t.label || t.name.replace(/\.html?$/i, '')) + '</span>'
        + '<span class="tc-meta">' + fmtSize(t.size || 0) + '</span>'
      + '</div>'
      + '<div class="row" style="margin-top:9px">'
        + '<a class="btn primary sm" href="' + esc(toolUrl(t)) + '" target="_blank" rel="noopener">▶ 실행</a>'
        + '<button class="btn sm" onclick="runToolHere(\'' + jsq(t.id) + '\')">'
          + (on ? '✕ 여기서 닫기' : '🖥 여기서 실행') + '</button>'
        + '<button class="btn sm" onclick="renameTool(\'' + jsq(t.id) + '\')">이름</button>'
        + '<button class="btn sm danger" onclick="removeTool(\'' + jsq(t.id) + '\')">지우기</button>'
      + '</div></div>';
  }).join('');

  const cur = list.find(t => t.id === runningTool);
  const frame = cur
    ? '<div class="toolrun">'
      + '<div class="tr-bar">'
        + '<span>🖥 ' + esc(cur.label || cur.name) + '</span>'
        + '<span style="margin-left:auto;display:flex;gap:5px">'
          + '<a class="btn sm" href="' + esc(toolUrl(cur)) + '" target="_blank" rel="noopener">↗ 새 탭에서 크게</a>'
          + '<button class="btn sm" onclick="runToolHere(\'' + jsq(cur.id) + '\')">닫기</button>'
        + '</span>'
      + '</div>'
      + '<iframe class="tr-frame" src="' + esc(toolUrl(cur)) + '" '
        + 'title="' + esc(cur.name) + '"></iframe>'
      + '</div>'
    : '';

  return bar + '<div class="toolgrid">' + cards + '</div>' + frame;
}

function fileIcon(name){
  const e = (String(name || '').split('.').pop() || '').toLowerCase();
  if(['pdf'].includes(e)) return '📕';
  if(['xlsx','xls','csv'].includes(e)) return '📗';
  if(['docx','doc','hwp','hwpx'].includes(e)) return '📘';
  if(['pptx','ppt'].includes(e)) return '📙';
  if(['png','jpg','jpeg','gif','webp','svg','heic'].includes(e)) return '🖼️';
  if(['zip','7z','rar'].includes(e)) return '🗜️';
  if(['mp4','mov','avi','mkv'].includes(e)) return '🎬';
  if(['dwg','dxf'].includes(e)) return '📐';
  return '📄';
}

function fmtSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  if(n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

/* 긴 경로는 뒤쪽 두세 칸만 보여줍니다 (전체는 마우스를 올리면 나옵니다) */
function shortDir(d){
  const parts = String(d || '').split('/').filter(Boolean);
  return parts.length <= 3 ? '/' + parts.join('/') : '… / ' + parts.slice(-3).join(' / ');
}

async function useWantRoot(){ await setUpRoot(WANT_ROOT); }


async function setUpRoot(path){
  upRoot.busy = true; render();
  try{
    const out = await apiJson('files.php?action=setuploadroot', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path: path })
    });
    upRoot.info = null;
    await loadUpRoot(true);
    toast('📂 ' + (out['안내'] || '바꿨습니다'));
    if((upRoot.info || {})['안에쌓인수']){
      if(confirm('바꿨습니다.\n\n지금까지 대시보드 안에 올려둔 파일 '
        + upRoot.info['안에쌓인수'] + '개도 공유폴더로 옮길까요?')) await moveOldFiles();
    }
    return true;
  }catch(e){
    const m = (e && e.error) || e.message || '';
    const tried = (e && e['찾아본곳']) || [];
    alert('저장 폴더를 바꾸지 못했습니다.\n\n' + m
      + (tried.length ? '\n\n찾아본 곳(일부):\n · ' + tried.slice(0, 6).join('\n · ') : ''));
    if(e && e['고르기권함']) pickRoot();
    return false;
  }finally{ upRoot.busy = false; render(); }
}

/* 파일 자리가 바뀌었을 때 대시보드에 적힌 자리도 같이 고칩니다.
   전에는 자료와 자동화 도구 두 군데만 봤습니다. 그런데 filePath 를 들고
   있는 곳은 여덟 군데입니다 — 명함 · 소개에 읽어온 문서 · 연혁 사진 ·
   문서함 판 · 회의록 사진…. 폴더 이름이 통째로 바뀌면(「아파트스퀘어」 →
   「5. 아파트스퀘어」) 안 고친 쪽은 전부 「파일 없음」 이 됩니다.
   그래서 자료 전체를 훑어 filePath 라는 이름이 붙은 자리를 다 고칩니다.
   새 자리가 생겨도 여기를 또 고칠 일이 없습니다. */
function fixFilePath(oldP, newP){
  if(!oldP || !newP || oldP === newP) return 0;
  let n = 0;
  const seen = new Set();
  const walk = x => {
    if(!x || typeof x !== 'object') return;
    if(seen.has(x)) return;                 // 서로를 가리켜도 맴돌지 않게
    seen.add(x);
    if(Array.isArray(x)){ x.forEach(walk); return; }
    if(x.filePath === oldP){ x.filePath = newP; n++; }
    Object.keys(x).forEach(k => { if(k !== 'filePath') walk(x[k]); });
  };
  walk(data);
  return n;
}

/* 공유폴더 안을 예쁘게 정리합니다 (자리가 바뀐 것은 대시보드에도 반영) */
async function tidyFolders(quiet){
  try{
    const o = await apiJson('files.php?action=tidy', { method:'POST' });
    const map = o['자리바뀜'] || {};
    let fixed = 0;
    Object.keys(map).forEach(oldP => { fixed += fixFilePath(oldP, map[oldP]); });
    if(fixed){ markDirtyAll(); await saveAll(true); }
    upRoot.info = null; await loadUpRoot(true);
    if(!quiet){
      alert('🧹 ' + (o['안내'] || '')
        + (fixed ? '\n(대시보드의 자료 ' + fixed + '개도 새 자리로 맞췄습니다)' : '')
        + (o['더있음'] ? '\n\n아직 남았습니다. 한 번 더 눌러주세요.' : '')
        + ((o['못한것'] || []).length ? '\n\n못 옮긴 것:\n · ' + o['못한것'].slice(0,8).join('\n · ') : ''));
    }
    return o;
  }catch(e){
    if(!quiet) alert('정리하지 못했습니다.\n\n' + apiErrText(e));
    return null;
  }
}

/* 연도 폴더를 쓸지 바꾸고, 지금 있는 파일도 그 모양으로 정리합니다 */
async function toggleYear(){
  const now = !!((upRoot.info || {})['연도폴더']);
  const next = !now;
  if(!confirm(next
      ? '연도 폴더를 쓸까요?\n\n'
        + '  01_자료 / 2026 / 2026-09-04_카탈로그.pdf\n\n'
        + '지금 있는 파일도 연도별로 옮겨드립니다.'
      : '연도 폴더를 없앨까요?\n\n'
        + '  01_자료 / 2026-09-04_카탈로그.pdf\n\n'
        + '폴더에 들어가면 파일이 바로 보입니다.\n'
        + '지금 있는 연도 폴더는 풀어서 위로 올립니다.')) return;
  try{
    await apiJson('files.php?action=setyear', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ year: next })
    });
    await tidyFolders(true);                    // 지금 있는 파일도 새 모양으로
    upRoot.info = null; await loadUpRoot(true);
    toast('📅 ' + (next ? '연도 폴더를 씁니다' : '연도 폴더를 없앴습니다'));
  }catch(e){ alert('바꾸지 못했습니다.\n\n' + apiErrText(e)); }
}

const dirPick = { at:'', rows:null, up:null, here:false, busy:false, open:false };

async function pickRoot(at){
  dirPick.open = true; dirPick.busy = true; dirPick.rows = null; render();
  try{
    const o = await apiJson('files.php?action=pickdirs'
      + (at ? '&at=' + encodeURIComponent(at) : ''));
    dirPick.at = o['지금'] || ''; dirPick.rows = o['폴더'] || [];
    dirPick.up = o['위'] || null; dirPick.here = !!o['여기쓸수있음'];

}

/* ═══════════════ 할 일을 맡은 사람 ═══════════════════════════════
   계정을 쓰면 할 일마다 「맡은 사람」 을 정합니다.
   가리는 용도가 아니라 누가 무엇을 맡았는지 나타내는 표시입니다 —
   팀원 모두가 서로의 할 일을 봅니다 (2026-09 부터).
   ================================================================= */
const people = { list:null, at:0, busy:false };

/* 팀원 이름 목록 — 할 일을 서로 나눠 맡으려면 모두에게 필요합니다.
   관리자는 users(권한·마지막 접속까지), 팀원은 people(아이디·이름만)로 받습니다. */
async function loadPeople(force){
  if(!authOn()) return;
  if(people.busy || (people.list && !force && Date.now() - people.at < 60000)) return;
  people.busy = true;
  try{
    const out = await apiJson('auth.php?action=' + (isAdmin() ? 'users' : 'people'));
    people.list = out['사람'] || [];
    people.at = Date.now();
    render();
  }catch(e){ /* 못 받아와도 화면은 그대로 씁니다 */ }
  finally{ people.busy = false; }
}

/* 창에서 고를 사람 목록 — 할 일은 팀이 같이 보므로 모두가 서로를 고를 수 있습니다 */
function taskPeople(){
  const me = authMe();
  const opts = [{ value:'', label:'— 맡은 사람 없음 (공용) —' }];
  let listed = false;
  if(people.list){
    people.list.forEach(u => {
      if(!u['쓸수있음']) return;                      // 퇴사 처리된 사람은 빼고
      opts.push({ value:u.id, label:u['이름'] + (me && u.id === me.id ? ' (나)' : '') });
      listed = true;
    });
    /* 퇴사한 사람이 이미 맡고 있는 할 일·일정이 있으면 그 이름을 남겨 둡니다.
       목록에서 아예 빼 버리면 창을 열었다 저장하는 것만으로 맡은 사람이
       조용히 바뀌거나, 이름 대신 아이디가 그대로 보입니다. */
    people.list.forEach(u => {
      if(u['쓸수있음']) return;
      if(!whoHasWork(u.id)) return;
      opts.push({ value:u.id, label:u['이름'] + ' (퇴사)' });
      listed = true;
    });
  }
  // 아직 사람 목록을 못 받아왔으면 적어도 나는 고를 수 있게 합니다
  if(!listed && me) opts.push({ value:me.id, label:me['이름'] + ' (나)' });
  return opts;
}

/* 아이디로 이름 찾기 */
function peopleName(id){
  if(!id) return '';
  const me = authMe();
  if(me && me.id === id) return me['이름'];
  const u = (people.list || []).find(x => x.id === id);
  return u ? u['이름'] : id;
}

/* 퇴사(정지) 처리된 계정인가.
   계정을 막는 것과 그 사람이 남긴 글을 지우는 것은 다른 일입니다.
   여기서 true 가 나와도 적어 둔 것은 그대로 열리고, 새로 맡기는 자리에서만 빠집니다. */
function peopleGone(id){
  if(!id || !authOn()) return false;
  const u = (people.list || []).find(x => x.id === id);
  return !!u && !u['쓸수있음'];
}
