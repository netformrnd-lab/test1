/* ═══════════════ 달력 ═════════════════════════════════════════════
   우리 팀 일정(마감·발행·촬영 …)을 적어둡니다.
   하이웍스 휴가·결재는 아직 연결하지 않았습니다 (아래 안내 참고).
   ================================================================= */
let calYM = null;   // 보고 있는 달 { y, m }

function calNow(){
  if(!calYM){ const d = new Date(); calYM = { y: d.getFullYear(), m: d.getMonth() }; }
  return calYM;
}
function calMove(d){
  const c = calNow();
  const t = new Date(c.y, c.m + d, 1);
  calYM = { y: t.getFullYear(), m: t.getMonth() };
  wcal.error = '';          // 달이 바뀌면 그 달을 새로 받아옵니다
  render();
}
function calToday(){ calYM = null; wcal.error = ''; render(); }


/* 일정 넣기 — 날짜·종류·브랜드를 창에서 직접 고릅니다.
   dateStr 을 주면 그 날짜가 미리 채워집니다 (빈 칸을 두 번 눌렀을 때).  */
function addEvent(dateStr){
  openItemModal('events', null, {
    date:  dateStr || todayStr(),
    kind:  '마감',
    brand: (currentBrand() && currentBrand().name) || ''
  });
}

/* 달력에서 일정을 누르면 고치는 창이 열립니다 (날짜도 여기서 바꿉니다) */
function editEvent(id){
  if(!(data.events || []).some(x => x.id === id)){ render(); return; }
  openItemModal('events', id);
}

/* 시작일 ~ 끝나는 날 사이의 날짜를 하루씩 돌려줍니다 (최대 400일) */
function eachDay(from, to){
  const out = [];
  if(!from) return out;
  if(!to || to < from) return [from];
  const d = new Date(from + 'T00:00:00');
  const end = new Date(to + 'T00:00:00');
  if(isNaN(d.getTime()) || isNaN(end.getTime())) return [from];
  for(let i = 0; i < 400 && d <= end; i++){
    out.push(todayStr(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

/* ═══════════════ 근무현황 캘린더 (휴가 · 외근 · 공휴일) ═════════════
   따로 쓰는 「(주) 넷폼알앤디 근무현황 캘린더」의 내용을 달력에 겹쳐 봅니다.
   읽기만 합니다 — 휴가·외근을 넣고 고치는 것은 그 도구에서 그대로 하세요.
   NAS 의 workcal.php 가 대신 받아오고, 화면은 60초마다 확인합니다.
   (웹 서버가 밀어주기를 못 해서, 「자주 확인」 이 실시간에 가장 가깝습니다)
   ================================================================= */
const wcal = { busy:false, ym:'', loaded:'', off:false, error:'', warn:'',
               휴가:{}, 공휴일:{}, 외근:{}, at:null, sync:null, site:'',
               보임:{ 휴가:true, 외근:true, 공휴일:true } };

function wcalYm(){
  const c = calNow();
  return c.y + '-' + String(c.m + 1).padStart(2, '0');
}

async function loadWorkCal(force){
  const ym = wcalYm();
  if(wcal.busy) return;
  if(!force && wcal.loaded === ym && !wcal.error) return;
  wcal.busy = true;
  wcal.ym = ym;
  if(force) wcal.warn = '';
  render();
  try{
    const out = await apiJson('workcal.php?action=' + (force ? 'refresh' : 'list')
      + '&ym=' + encodeURIComponent(ym) + '&t=' + Date.now());
    wcal.off  = !!out['끔'];
    wcal.휴가   = out['휴가']   || {};
    wcal.공휴일 = out['공휴일'] || {};
    wcal.외근   = out['외근']   || {};
    wcal.at   = out['updatedAt'] || null;
    wcal.sync = out['동기화된때'] || null;
    wcal.site = out['주소'] || '';
    wcal.warn = out['문제'] || '';
    wcal.error = '';
    wcal.loaded = ym;
  }catch(e){
    wcal.error = apiErrText(e);
    wcal.휴가 = {}; wcal.공휴일 = {}; wcal.외근 = {};
  }
  wcal.busy = false;
  render();
}

/* 그리는 도중에 부르는 자리라, 그리기가 끝난 뒤에 받아옵니다 */
function wcalEnsure(){
  const ym = wcalYm();
  if(wcal.busy || wcal.loaded === ym || wcal.error) return;
  wcal.busy = true;
  setTimeout(() => { wcal.busy = false; loadWorkCal(false); }, 0);
}

/* 달력을 보고 있는 동안 60초마다 새로 확인합니다 */
function wcalTick(){
  if(STORAGE_MODE !== 'nas' || view !== 'calendar' || document.hidden) return;
  if(wcal.busy || wcal.error || wcal.off) return;
  const age = wcal.at ? (Date.now() - new Date(wcal.at).getTime()) : Infinity;
  if(age > 60000) loadWorkCal(true);
}

function wcalToggle(k){ wcal.보임[k] = !wcal.보임[k]; render(); }

function wcalWhen(){
  if(!wcal.at) return '';
  const t = new Date(wcal.at);
  if(isNaN(t)) return '';
  const s = Math.floor((Date.now() - t.getTime()) / 1000);
  if(s < 70)   return '방금 확인';
  if(s < 3600) return Math.floor(s / 60) + '분 전 확인';
  return t.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }) + ' 확인';
}

/* 하이웍스 → 파이어베이스 동기화가 멈췄는지 (몇 시간째인지 돌려줍니다).
   우리 NAS 는 60초마다 멀쩡히 받아오는데도, 하이웍스에서 파이어베이스로
   넣어주는 도구가 멈추면 새 휴가가 아예 안 들어옵니다. 그런데 화면에는
   작은 글씨로 「휴가 동기화 9/14 08:09」 라고만 적혀 있어서 아무도 못 봤습니다. */
function wcalSyncStale(){
  if(!wcal.sync) return 0;
  const t = new Date(Number(wcal.sync) || wcal.sync);
  if(isNaN(t)) return 0;
  const h = (Date.now() - t.getTime()) / 3600000;
  return h > 26 ? h : 0;              // 하루에 한 번 도는 경우가 있어 26시간부터
}
function wcalStaleText(h){
  if(h >= 48) return Math.floor(h / 24) + '일';
  return Math.floor(h) + '시간';
}
/* 하이웍스가 마지막으로 휴가를 내려받은 때 */
function wcalSyncText(){
  if(!wcal.sync) return '';
  const t = new Date(Number(wcal.sync) || wcal.sync);
  if(isNaN(t)) return '';
  return '휴가 동기화 ' + t.toLocaleString('ko-KR',
    { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

/* 휴가는 종류마다 색을 갈라 둡니다 — 하루를 다 쉬는지 반나절인지가
   달력에서 한눈에 보여야 일정을 잡을 수 있습니다. */
/* 색을 잘 못 가리는 분도 알아보게 동그라미 모양을 다르게 합니다
   ● 하루 종일 · ◐ 반나절 · ◔ 반의 반 */
function vacMark(kind){
  if(kind === '반차')   return '◐';
  if(kind === '반반차') return '◔';
  return '';                       // 연차는 꽉 찬 동그라미(기본)
}

const WCAL_HUE = { '연차':'var(--purple)', '반차':'var(--blue)', '반반차':'var(--cyan)',
                   '휴가':'var(--purple)',
                   'PT':'var(--orange)', '현설':'var(--orange)', '세미나':'var(--cyan)',
                   '미팅':'var(--cyan)', '영업':'var(--green)', '방문':'var(--green)',
                   '하자점검':'var(--red)', '계약':'var(--yellow)', '개인':'var(--text-muted)',
                   '외근':'var(--orange)' };

/* ── 우리 팀만 보기 ─────────────────────────────────────────────
   근무현황 캘린더에는 회사 전체 사람이 들어 있습니다. 마케팅팀만 보고 싶을
   때가 많아, 이름 명단을 정해두고 그 사람들만 거릅니다.
   명단은 브랜드 자료에 같이 저장되어 **팀 전체가 같은 명단**을 씁니다.
   ─────────────────────────────────────────────────────────── */
/* 우리 팀 기본 명단 — 아직 한 번도 정한 적이 없으면 이것을 씁니다.
   [✎ 명단] 에서 한 번이라도 저장하면 그때부터는 저장한 것만 씁니다. */
const WCAL_TEAM_DEFAULT = ['최경선', '권혜영', '김소라', '김다예'];

function wcalTeam(){
  const v = (data.settings && data.settings.wcalTeam);
  return Array.isArray(v) ? v : WCAL_TEAM_DEFAULT.slice();
}
/* 처음부터 「우리 팀만」 으로 시작합니다 (회사 전체가 다 뜨면 보기 어렵습니다) */
function wcalOnly(){
  const v = (data.settings && data.settings.wcalOnly);
  return v === undefined ? true : !!v;
}
/* 아직 한 번도 명단을 정한 적이 없는가 */
function wcalTeamIsDefault(){
  return !(data.settings && Array.isArray(data.settings.wcalTeam));
}
function wcalNorm(s){ return String(s == null ? '' : s).replace(/\s/g, ''); }

/* 이 사람을 보여줄까 (「우리 팀만」 이 꺼져 있으면 모두 보여줍니다) */
function wcalIsMine(name){
  if(!wcalOnly()) return true;
  const t = wcalTeam();
  if(!t.length) return true;              // 명단이 비면 거르지 않습니다
  const n = wcalNorm(name);
  return t.some(x => wcalNorm(x) === n);
}

/* 이번 달 자료에 나온 이름 모두 (명단 고를 때 씁니다) */
function wcalSeenNames(){
  const set = new Set();
  Object.values(wcal.휴가).forEach(a => a.forEach(v => { if(v.이름) set.add(v.이름); }));
  Object.values(wcal.외근).forEach(a => a.forEach(o => { if(o.이름) set.add(o.이름); }));
  wcalTeam().forEach(n => set.add(n));      // 이번 달에 안 나온 팀원도 남겨둡니다
  return [...set].sort((a, b) => a.localeCompare(b, 'ko'));
}

/* 지금 걸러지고 있는 사람 이름 (새로 들어온 사람을 알아채라고) */
function wcalNewFaces(){
  if(!wcalOnly() || !wcalTeam().length) return [];
  const set = new Set();
  Object.values(wcal.휴가).forEach(a => a.forEach(v => { if(!wcalIsMine(v.이름)) set.add(v.이름); }));
  Object.values(wcal.외근).forEach(a => a.forEach(o => { if(!wcalIsMine(o.이름)) set.add(o.이름); }));
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ko'));
}

/* 「우리 팀만」 을 켜서 지금 안 보이는 사람 수 */
function wcalHiddenCount(){
  if(!wcalOnly() || !wcalTeam().length) return 0;
  let n = 0;
  Object.values(wcal.휴가).forEach(a => a.forEach(v => { if(!wcalIsMine(v.이름)) n++; }));
  Object.values(wcal.외근).forEach(a => a.forEach(o => { if(!wcalIsMine(o.이름)) n++; }));
  return n;
}

function wcalSet(k, v){
  data.settings = data.settings || {};
  data.settings[k] = v;
  markDirtyAll();
  render();
}
function wcalOnlyToggle(){
  const next = !wcalOnly();
  wcalSet('wcalOnly', next);
  if(next && !wcalTeam().length) openWcalTeam();     // 명단이 비었으면 바로 고르게
}

/* ── 명단 고르는 창 ─────────────────────────────────────────── */
const teamPick = { open:false, sel:null, add:'' };

function openWcalTeam(){
  teamPick.open = true;
  teamPick.sel = new Set(wcalTeam().map(wcalNorm));
  teamPick.add = '';
  render();
}
function closeWcalTeam(){ teamPick.open = false; render(); }
function teamPickToggle(name){
  const n = wcalNorm(name);
  if(teamPick.sel.has(n)) teamPick.sel.delete(n); else teamPick.sel.add(n);
  render();
}
function teamPickAll(){ wcalSeenNames().forEach(n => teamPick.sel.add(wcalNorm(n))); render(); }
function teamPickNone(){ teamPick.sel.clear(); render(); }
function teamPickInput(v){ teamPick.add = v; }
function teamPickAdd(){
  const v = String(teamPick.add || '').trim();
  if(!v) return;
  // 쉼표로 여러 명을 한 번에 넣을 수 있습니다
  v.split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(nm => {
    teamPick.sel.add(wcalNorm(nm));
    const cur = wcalTeam();
    if(!cur.some(x => wcalNorm(x) === wcalNorm(nm))){
      data.settings = data.settings || {};
      data.settings.wcalTeam = cur.concat([nm]);
    }
  });
  teamPick.add = '';
  render();
}
/* 계정에 있는 사람을 그대로 명단으로 (관리자만 계정 목록을 볼 수 있습니다) */
function teamPickFromAccounts(){
  const names = (people.list || []).filter(u => u['쓸수있음'] !== false)
    .map(u => u['이름'] || u.name).filter(Boolean);
  if(!names.length){ toast('⚠️ 계정 목록을 가져오지 못했습니다 (관리자만 됩니다)'); return; }
  data.settings = data.settings || {};
  const cur = wcalTeam();
  names.forEach(nm => { if(!cur.some(x => wcalNorm(x) === wcalNorm(nm))) cur.push(nm); });
  data.settings.wcalTeam = cur;
  names.forEach(nm => teamPick.sel.add(wcalNorm(nm)));
  render();
}
function saveWcalTeam(){
  // 고른 것만 남깁니다 (이름의 원래 표기는 그대로 지킵니다)
  const seen = wcalSeenNames();
  const keep = seen.filter(n => teamPick.sel.has(wcalNorm(n)));
  data.settings = data.settings || {};
  data.settings.wcalTeam = keep;
  // 아무도 안 고르면 「우리 팀만」 도 같이 끕니다.
  // 「명단은 비었는데 걸러지는 중」 이라는 알 수 없는 상태를 안 만들려고요.
  data.settings.wcalOnly = keep.length > 0;
  markDirtyAll();
  teamPick.open = false;
  render();
  toast(keep.length
    ? ('👥 우리 팀 ' + keep.length + '명만 보이게 맞췄습니다')
    : '👥 명단을 비웠습니다 — 회사 전체가 다시 보입니다');
}

/* 하루치 근무현황을 칸 안에 그립니다 */
function wcalCell(ds){
  let h = '';
  if(wcal.보임.휴가) (wcal.휴가[ds] || []).filter(v => wcalIsMine(v.이름)).forEach(v => {
    // 반차는 오전인지 오후인지가 제일 중요합니다 (그 사람이 언제 자리에 있나)
    const when = v.종류 === '연차' ? '' : (v['때'] || '');
    const tip  = v.이름 + ' · ' + v.종류 + (when ? ' (' + when + ')' : '')
               + (v['상세'] && v['상세'] !== when ? ' · ' + v['상세'] : '')
               + (v['원본'] ? '\n하이웍스: ' + v['원본'] : '')
               + '\n(근무현황 캘린더)';
    h += '<div class="cal-w" style="--ec:' + (WCAL_HUE[v.종류] || 'var(--purple)') + '" '
       + 'title="' + esc(tip) + '">'
       + '<span class="cal-dot">' + vacMark(v.종류) + '</span>'
       + '<span class="wl">' + esc(v.이름) + ' <b class="wv">' + esc(v.종류) + '</b>'
       + (when ? '<span class="wq">' + esc(when) + '</span>' : '')
       + '</span></div>';
  });
  if(wcal.보임.외근) (wcal.외근[ds] || []).filter(o => wcalIsMine(o.이름)).forEach(o => {
    const tip = o.이름 + ' · ' + o.종류 + (o.시간 ? ' ' + o.시간 : '')
              + (o.장소 ? '\n' + o.장소 : '') + '\n(근무현황 캘린더)';
    h += '<div class="cal-w" style="--ec:' + (WCAL_HUE[o.종류] || 'var(--orange)') + '" '
       + 'title="' + esc(tip) + '">'
       + '<span class="cal-dot"></span>'
       + '<span class="wl">' + esc(o.이름) + ' <b class="wv">' + esc(o.종류) + '</b>'
       + (o.장소 ? ' · ' + esc(o.장소) : '') + '</span></div>';
  });
  return h;
}

let calTasks = true;        // 달력에 브랜드 할 일 기한도 함께 보일까
function toggleCalTasks(){ calTasks = !calTasks; render(); }

/* 「할 일을 넣었는데 달력에 안 뜬다」 는 대개 셋 중 하나입니다.
   기한이 없거나 · 다른 달이거나 · 이미 완료했거나.
   화면이 말을 안 하면 「연동이 안 된다」 로 보이므로 여기서 짚어줍니다. */
function calTaskNote(c){
  const ym = c.y + '-' + String(c.m + 1).padStart(2, '0');
  let here = 0, noDue = 0, other = 0, done = 0, nearest = '';
  data.brands.forEach(b => (b.tasks || []).forEach(t => {
    if(t.status === '완료'){ if(t.due) done++; return; }
    if(!t.due){ noDue++; return; }
    if(String(t.due).slice(0, 7) === ym){ here++; return; }
    other++;
    if(!nearest || Math.abs(new Date(t.due) - new Date()) < Math.abs(new Date(nearest) - new Date()))
      nearest = t.due;
  }));

  if(!calTasks){
    return (here + other)
      ? '<div class="fmeta" style="margin:-2px 0 10px">'
        + '✅ 할 일은 지금 숨겨져 있습니다 — 위 [할 일 보기] 를 누르면 함께 보입니다.</div>'
      : '';
  }
  if(!noDue && !other && !done) return '';          // 다 보이고 있습니다

  const bits = [];
  if(here)  bits.push('이 달에 <b>' + here + '건</b> 보이는 중');
  if(noDue) bits.push('기한 없음 <b>' + noDue + '건</b>');
  if(other) bits.push('다른 달 <b>' + other + '건</b>');
  if(done)  bits.push('완료 <b>' + done + '건</b>');

  return '<div class="ainote" style="margin:-2px 0 12px">'
    + '✅ <b>할 일</b> — ' + bits.join(' · ')
    + '<div class="fmeta" style="margin-top:5px">'
      + '기한이 있고 아직 안 끝난 할 일만 그 날짜에 나옵니다.</div>'
    + '<div class="sec-bar" style="margin-top:8px">'
      + (noDue ? '<button class="btn sm primary" onclick="goView(\'tasks\')">'
          + '📅 기한 없는 ' + noDue + '건에 기한 넣기</button>' : '')
      + (other && nearest ? '<button class="btn sm" onclick="calGoTo(\'' + jsq(nearest) + '\')">'
          + '→ 가장 가까운 할 일 (' + esc(fmtDate(nearest)) + ') 보기</button>' : '')
    + '</div></div>';
}

/* 그 날짜가 있는 달로 옮겨갑니다 */
function calGoTo(ds){
  const d = new Date(ds + 'T00:00:00');
  if(isNaN(d.getTime())) return;
  calYM = { y: d.getFullYear(), m: d.getMonth() };
  render(); window.scrollTo({ top:0, behavior:'smooth' });
}

function renderCalendar(){
  wcalEnsure();
  if(authOn()) setTimeout(() => loadPeople(), 10);   // 담당자 이름을 제대로 쓰려고
  const c = calNow();
  const first = new Date(c.y, c.m, 1);
  const days  = new Date(c.y, c.m + 1, 0).getDate();
  const lead  = first.getDay();                       // 1일이 무슨 요일인지
  const todayS = todayStr();

  // 그 달의 일정을 날짜별로 모읍니다 (직접 넣은 일정 + 브랜드 할 일 기한)
  const byDay = {};
  const put = (d, o) => { (byDay[d] = byDay[d] || []).push(o); };
  (data.events || []).forEach(e => {
    if(!e.date) return;
    // 사람 목록을 아직 못 받았으면 peopleName 이 아이디를 그대로 돌려줍니다.
    // 그때는 적어둔 이름을 씁니다 (「hyeyoung」 대신 「권혜영」).
    const enm = e.uid ? peopleName(e.uid) : '';
    const ewho = (enm && enm !== e.uid) ? enm : (e.owner || '');
    const span = eachDay(e.date, e.until);           // 며칠에 걸치면 매일 보이게
    span.forEach((d, i) => put(d, {
      id:e.id, t:e.title, kind:e.kind || '기타', brand:e.brand, own:true,
      memo:e.memo, from:e.date, to:e.until, who:ewho,
      part: span.length > 1 ? (i === 0 ? 'first' : (i === span.length - 1 ? 'last' : 'mid')) : ''
    }));
  });
  if(calTasks){
    data.brands.forEach(b => (b.tasks || []).forEach(t => {
      if(!t.due || t.status === '완료') return;
      // 사람 목록을 아직 못 받았으면 peopleName 이 아이디를 그대로 돌려줍니다.
      // 그때는 할 일에 적어둔 이름을 씁니다 (「hyeyoung」 대신 「권혜영」).
      const nm = t.uid ? peopleName(t.uid) : '';
      const who = (nm && nm !== t.uid) ? nm : (t.owner || '');
      put(t.due, { id:t.id, t:t.title, kind:'할 일', brand:b.name, bid:b.id,
                   own:false, who:who, st:t.status });
    }));
  }

  const cells = [];
  for(let i = 0; i < lead; i++) cells.push('<div class="cal-c out"></div>');
  for(let d = 1; d <= days; d++){
    const ds = c.y + '-' + String(c.m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const list = byDay[ds] || [];
    const dow = new Date(c.y, c.m, d).getDay();
    const holi = wcal.보임.공휴일 ? (wcal.공휴일[ds] || '') : '';
    cells.push('<div class="cal-c' + (ds === todayS ? ' today' : '')
      + (holi ? ' holi' : '')
      + (dow === 0 ? ' sun' : (dow === 6 ? ' sat' : '')) + '" '
      + 'ondblclick="addEvent(\'' + ds + '\')" title="빈 곳을 두 번 누르면 일정을 넣습니다">'
      + '<div class="cal-d">' + d + '</div>'
      + (holi ? '<div class="cal-holi">🎌 ' + esc(holi) + '</div>' : '')
      + list.map(o => {
          const tip = (o.brand ? o.brand + ' · ' : '') + o.kind + ' · ' + o.t
            + (o.who ? '\n담당 ' + o.who : '')
            + (o.st ? ' · ' + o.st : '')
            + (o.to && o.to !== o.from ? '\n' + fmtYMD(o.from) + ' ~ ' + fmtYMD(o.to) : '')
            + (o.memo ? '\n' + o.memo : '')
            + (o.own ? '\n(누르면 고칠 수 있습니다)' : '\n(누르면 할 일 화면으로 갑니다)');
          return '<div class="cal-e' + (o.part ? ' p-' + o.part : '') + '" '
            + 'style="--ec:' + (EVENT_HUE[o.kind] || 'var(--text-muted)') + '" '
            + 'title="' + esc(tip) + '" '
            + (o.own ? 'onclick="editEvent(\'' + jsq(o.id) + '\')"'
                     : 'onclick="gotoResult(\'' + jsq(o.bid) + '\',\'tasks\')"') + '>'
            + '<span class="cal-dot"></span>'
            + (o.part === 'mid' || o.part === 'last' ? '<span class="cal-cont">…</span>' : '')
            /* 제목은 줄어들고 담당자 이름은 끝까지 남게 — 맨 텍스트로 두면
               제목이 길 때 담당자가 먼저 잘려 나갑니다 */
            + '<span class="cal-t">' + esc(o.t) + '</span>'
            + (o.who ? '<span class="cal-who">' + esc(o.who) + '</span>' : '')
            + '</div>';
        }).join('')
      + wcalCell(ds)                     // 휴가·외근을 같은 칸에 겹쳐 보여줍니다
      + '</div>');
  }
  while(cells.length % 7) cells.push('<div class="cal-c out"></div>');

  const legend = EVENT_KINDS.concat(['할 일']).map(k =>
    '<span class="vz-key"><span class="cal-dot" style="--ec:'
    + (EVENT_HUE[k] || 'var(--text-muted)') + '"></span>' + k + '</span>').join('');

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + '<h2 class="page-h">📅 달력</h2>'
    + '<div class="page-sub">마감·발행 같은 팀 일정을 날짜를 골라 넣습니다. '
      + '며칠에 걸치는 일정도 됩니다. 브랜드 할 일의 기한도 함께 보입니다</div>'
    + '<div class="sec-bar">'
      + '<button class="btn" onclick="calMove(-1)">‹ 이전 달</button>'
      + '<strong style="font-size:15px;min-width:120px;text-align:center">'
        + c.y + '년 ' + (c.m + 1) + '월</strong>'
      + '<button class="btn" onclick="calMove(1)">다음 달 ›</button>'
      + '<button class="btn" onclick="calToday()">오늘</button>'
      + '<button class="btn primary" onclick="addEvent(\'' + todayS + '\')">＋ 일정 넣기</button>'
      + '<button class="btn sm' + (calTasks ? ' primary' : '') + '" onclick="toggleCalTasks()" '
        + 'title="브랜드 할 일의 기한을 달력에 함께 보여줍니다">'
        + (calTasks ? '✅ 할 일 보이는 중' : '할 일 보기') + '</button>'
      + '<span class="hint">빈 칸을 두 번 누르면 그 날짜로 넣습니다 · '
        + '일정을 누르면 날짜까지 고칠 수 있습니다</span>'
    + '</div>'
    + calTaskNote(c)
    + '<div class="vz-legend" style="margin-bottom:10px">' + legend + '</div>'
    + wcalBar()
    + '<div class="calwrap"><div class="cal">'
      + ['일','월','화','수','목','금','토'].map((w, i) =>
          '<div class="cal-h' + (i === 0 ? ' sun' : (i === 6 ? ' sat' : '')) + '">' + w + '</div>').join('')
      + cells.join('')
    + '</div></div>'
    + '<div class="ainote" style="margin-top:14px">'

/* ── 브랜드 한 화면 ─────────────────────────────────────────────

   같은 것을 두 군데 적게 되어 있으니 어디에 쓸지 알 수 없었습니다.

     ⑤ 무엇을 지키는가 약속 · 하지 않는 것 │ 그 선이 생긴 사건 (실패 기록)

const BRAND_AXES = [

  { key:'who', no:'2', icon:'👤', name:'누구에게',

    now:[['value', '약속 (핵심 가치)',   '고객에게 반드시 지키는 것 3가지쯤'],
         ['nogo',  '하지 않는 것',       '돈이 돼도 하지 않는 것. 브랜드가 지키는 선'],

/* 예전 축 이름 → 새 축 열쇠 (자료를 그대로 이어 씁니다) */
const AXIS_OLD = { '서비스':'what', '페르소나':'who', '메시지 · 표현':'say', '채널':'where' };

function axisOf(k){ return BRAND_AXES.find(a => a.key === k) || BRAND_AXES[0]; }
/* 예전 자료(shifts)를 축으로 거르던 것 — 라인으로 옮기기 전 자료에만 씁니다 */
function axisShifts(b, k){
  return histOf(b).shifts.filter(x => (AXIS_OLD[x.axis] || x.axis || 'what') === k);
}
/* 이 축이 얼마나 차 있나 — 「지금」 칸 수와 라인의 기록 수 */
function axisFilled(b, a){
  const bk = bookOf(b);
  return { now: a.now.filter(f => String(bk[f[0]] || '').trim()).length,
           all: a.now.length,

/* ── 📜 브랜드 히스토리 ──────────────────────────────────────────
   올려주신 기획서(「브랜드 히스토리 문서 기획서」)가 설계한 그대로입니다.

   제공 범위 — 브랜드의 모든 축을 「전 → 후 → 왜」 로 서술한다
     ① 이 회사는 무엇을 하는가 (현재 실체)
     ② 연표 — 언제 무슨 일이 있었나
     ③~⑥ 바뀐 과정 — 서비스 · 페르소나 · 메시지 · 채널
     ⑦ 실패 기록 — 반려·폐기된 것
   산출물 — 본문 / 연표 1장 / 폐기 표현 ↔ 현재 표현 대조표 / 실패 사례 색인

   품질 기준도 화면이 지키게 했습니다
     · 모든 서술에 출처를 단다            → 항목마다 「출처 · 기준일」 칸
     · 추정은 추정으로 표기한다            → 「추정」 표시. 켜면 눈에 띄게 나옵니다
     · 자료가 없는 구간은 비어 있다고 쓴다 → 연표에 「자료 없음」 구간을 넣습니다
     · 실패를 완곡하게 쓰지 않는다         → 실패 기록은 「무엇이 안 됐나」 가 먼저
   ------------------------------------------------------------- */
const EV_KINDS = ['사건', '자료 없음 구간'];

let histTab = 'line';
function setHistTab(v){ histTab = v; render(); }

function histOf(b){
  if(!b.hist || typeof b.hist !== 'object' || Array.isArray(b.hist)) b.hist = {};
  const h = b.hist;
  if(typeof h.now !== 'string') h.now = '';
  ['events','shifts','words','fails'].forEach(k => { if(!Array.isArray(h[k])) h[k] = []; });
  return h;
}
function histAdd(bid, key, seed){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const h = histOf(b);
  h[key].push(Object.assign({ id: uid('hx') }, seed || {}));
  markDirty(b.id); render();
}
function histDel(bid, key, id){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const h = histOf(b);
  h[key] = h[key].filter(x => x.id !== id);
  markDirty(b.id); render();
}
function histEdit(bid, key, id, field, v, draw){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const h = histOf(b);
  if(id === null){ h[key] = v; }
  else {
    const x = h[key].find(y => y.id === id); if(!x) return;
    x[field] = v;
  }
  markDirty(b.id);
  if(draw) render();
}
function histMove(bid, key, id, d){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const l = histOf(b)[key];
  const i = l.findIndex(x => x.id === id);
  const j = i + d;
  if(i < 0 || j < 0 || j >= l.length) return;
  l.splice(j, 0, l.splice(i, 1)[0]);
  markDirty(b.id); render();
}

/* 글로 복사 — 화면에 보이는 그대로. 「지금」 다음에 연혁 라인 */
function histText(b){
  const h  = histOf(b);
  const bk = bookOf(b);
  const L  = [];
  L.push('# ' + b.name);
  L.push('\n한 줄 정의: ' + (String(h.now || '').trim() || '(아직 없음 — 채워주세요)'));

  L.push('\n## 지금');
  BRAND_AXES.forEach(a => {
    L.push('\n[' + a.no + '. ' + a.name + ']');
    a.now.forEach(f => {
      L.push('· ' + f[1] + ': ' + (String(bk[f[0]] || '').trim() || '(아직 없음)'));
    });
  });

  L.push('\n## 연혁 — 여기까지 온 길');
  const rows = recsOf(b).slice().sort((x, y) => recKey(x) - recKey(y));
  if(!rows.length) L.push('(아직 없음)');
  let year = null;
  rows.forEach(r => {
    const y = recYear(r) || '날짜 확인 필요';
    if(y !== year){ year = y; L.push('\n### ' + y); }
    const K = recKindOf(r);
    const a = recAxis(r);
    L.push('\n· ' + (r.date || '(날짜 확인 필요)') + '  [' + K.k + ']'
      + (a ? ' (' + a.name + ')' : '') + (r.guess ? ' [추정]' : ''));
    (REC_FIELDS[K.k] || REC_FIELDS['사건']).forEach(f => {
      const v = String(r[f[0]] || '').trim();
      if(v) L.push('  ' + f[2] + ': ' + v);
    });
    const dc = r.docId ? docFind(b, r.docId) : null;
    if(dc) L.push('  근거 문서: ' + (dc.title || '')
      + (r.docAt ? ' · ' + r.docAt : ''));
  });
  return L.join('\n');
}
async function histCopy(bid){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const t = histText(b);
  try{ await navigator.clipboard.writeText(t); toast('📋 히스토리를 글로 복사했습니다'); }
  catch(e){ prompt('아래 내용을 복사해 쓰세요', t); }
}

/* 얼마나 채웠나 — 탭마다 개수 */
function histCount(b, key){
  if(key === 'plans') return docList(b).length;
  if(key === 'line')  return recsOf(b).length;
  return String(histOf(b).now || '').trim() ? 1 : 0;
}

function pathOf(b){
  if(!b.path || typeof b.path !== 'object' || Array.isArray(b.path)) b.path = {};
  const P = b.path;
  /* 소개는 <<올린 브랜드북 파일 한 권>> 이 전부입니다. 전에는 여기에
     칸이 서른 개 넘게 있었습니다 — 뭘 하나 · 지킬 것 · 걸어온 길 · 페르소나 ·
     색 · 글꼴 … 파일에 이미 있는 것을 다시 적어 두는 자리였습니다.
     같은 글이 두 군데 있으면 어느 쪽이 진짜인지 늘 헷갈립니다. */
  if(!Array.isArray(P.docs)) P.docs = [];

   그래서 사람 이름이 아닌 것을 가려내고, 손으로 넣을 자리를 둡니다.

const WHO_FAKE = /(미지정|미정|확인\s*필요|추후|TBD|해당\s*없음|별도\s*안내|담당자\s*없음)/i;
/* 사람 하나를 가리키나 — 「브랜드·마케팅팀」 처럼 팀만 적힌 것은 아직 빈칸입니다 */
function whoReal(w){
  const nm = String((w && w.name) || '').trim();
  if(!nm) return false;
  if(WHO_FAKE.test(nm) || WHO_FAKE.test(String((w && w.role) || ''))) return false;
  return !/^[^\s]*(팀|파트|본부|실|그룹|부서)$/.test(nm);   // 팀 이름만 적힌 것

async function uploadPathDoc(fileList){
  const files = Array.from(fileList || []);
  const bid = pathDocTo; pathDocTo = '';
  if(!files.length || !bid) return;
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const f = files[0];

  /* 읽어내지 않습니다. 파일을 그대로 두고 그대로 폅니다 —
     칸으로 옮기던 길(AI · 틀 맞추기)은 모두 걷어냈습니다. */
  pathMine[bid] = { busy:true, step:'브랜드북을 올리는 중…', err:'', up:false, doc:null };
  render();
  try{
    const of = Math.max(1, Math.ceil(f.size / 1048576));
    const out = await pgUploadOne(f, { brand: b.name, sub: '기록부' }, (i, n) => {
      const m = pathMine[bid]; if(!m) return;
      m.step = n > 1 ? ('브랜드북을 올리는 중… ' + Math.round(i / n * 100) + '%')
                     : '브랜드북을 올리는 중…';
      const el = document.getElementById('pmStep');
      if(el) el.textContent = m.step; else render();
    });
    if(!out || out.ok === false) throw new Error((out && out.error) || '올리지 못했습니다');
    const doc = { id: uid('pd'), name: out.fileName, size: out.fileSize,
                  filePath: out.filePath || '', at: new Date().toISOString(),
                  kind: 'bbook',
                  by: (authMe() || {})['이름'] || '' };
    /* 브랜드북은 한 권입니다 — 새로 올리면 그 한 권이 바뀝니다 */
    if(!pathDocs(b).some(d => d.filePath === doc.filePath)) pathDocs(b).push(doc);
    pathMine[bid] = { busy:false, step:'', err:'', up:true, doc: doc };
    markDirty(b.id);
    /* 올린 책을 바로 폅니다 */
    bookEdit = false; bookDirty = false; bookIfr = null; bookVer++;
    render(); window.scrollTo({ top:0 });
  }catch(e){
    const was = pathMine[bid] || {};
    pathMine[bid] = { busy:false, err: apiErrText(e), up:false, doc: was.doc || null };
    render();
  }
}

/* ── ✨ 전에 적어 둔 것을 새 자리로 옮기기 ────────────────────

/* 「쓰는 말 · 안 쓰는 말」 로 적어 둔 줄에서 용어를 뽑습니다.
   「하자보수 → 유지보수」 · 「하자보수 대신 유지보수」 · 「"하자보수"(X)」 ·

   그대로 규칙으로 둡니다 (짧은 칩으로 줄이면 뜻이 없어지니까). */
const WD_ARROW  = /\s*(?:→|->|=>|▶|›|»)\s*/;
const WD_SWAP   = /^(.{1,22}?)\s*(?:대신에|대신|말고|보다는|이 아니라|가 아니라)\s*(.{1,22})$/;
const WD_TAIL   = /(습니다|합니다|입니다|한다|된다|않는다|하세요|주세요|마세요|십시오)$/;
const WD_STRIP  = /^[「『“”"'‘’(\[\-•·*\s]+|[」』“”"'‘’)\]\s]+$/g;
/* 「유지보수(O)」 「하자보수(X)」 처럼 뒤에 달린 표시 — 따옴표·괄호를 떼기
   <<전에>> 먼저 떼야 합니다 (먼저 괄호를 떼면 「유지보수(O」 가 남습니다) */
const WD_MARK = /\s*[（(]\s*(?:[OXox○×]|금지|권장|사용|지양|필수)\s*[)）]?\s*$/;

/* ── ✎ 두 번 눌러 그 자리에서 고치기 ──────────────────────────
   읽다가 틀린 것을 보면 [고치기] 로 옮겨 가서 그 칸을 다시 찾아야 했습니다.
   한 글자 고치는 데 화면을 두 번 갈아타는 건 너무 비쌉니다.
   이제 글을 두 번 누르면 그 자리가 칸이 되고, 빠져나오면 저장됩니다.

   자리마다 「어디에 적히는 글인지」 를 data-ed 로 달아 두고, 문서 전체에
   귀 하나만 답니다. 자리마다 따로 달면 새 자리를 만들 때마다 잊습니다.
   -------------------------------------------------------------- */
let edOn   = '';        // 지금 고치고 있는 자리 (비어 있으면 안 고치는 중)
let edSkip = false;     // 고치는 동안 미뤄 둔 다시 그리기가 있었나
let edCur  = null;      // 고치고 있는 자리와 원래 글
let edAt   = 0;         // 이 칸이 열린 때 (두 번 눌러 열 때의 뒷클릭을 거르려고)

/* 이 자리의 지금 글 — 화면 글자가 아니라 자료에서 읽습니다
   (화면에는 줄바꿈이 <br> 로 바뀌어 있어서 그대로 쓰면 줄이 사라집니다) */
function edGet(d){
  const S = v => String(v == null ? '' : v);
  /* 온보딩 연표 칸은 브랜드에 딸린 글이 아닙니다 — 브랜드부터 찾고
     시작하면 온보딩 화면에서는 그 줄에 걸려 빈 값이 나왔습니다. */
  if(d.ed === 'obkid'){
    const sc = obOf().find(x => x.id === d.g); if(!sc) return '';
    const it = (sc.items || []).find(x => x.id === d.i); if(!it) return '';
    const k = (it.kids || []).find(x => x.id === d.k); return k ? S(k[d.f]) : '';
  }
  if(d.ed === 'obkid0' || d.ed === 'obit'){   // 항목 (해 칸도 항목입니다)
    const sc = obOf().find(x => x.id === d.g); if(!sc) return '';
    const it = (sc.items || []).find(x => x.id === d.i); return it ? S(it[d.f]) : '';
  }
  if(d.ed === 'obsec'){                       // 단 자체 (이름 · 한 줄 · 맨 위)
    const sc = obOf().find(x => x.id === d.g); return sc ? S(sc[d.f]) : '';
  }
  if(d.ed === 'obrow') return S(d.i);          // 표의 줄 이름 (여러 항목에 걸침)
  /* 칸 카드 — 할 일 · 자동화 · 바로가기 · 자료 · 연혁 · 비용.
     여섯 화면이 같은 칸을 쓰므로 여기 하나만 답니다. */
  if(d.ed === 'item'){
    /* 회의록 · 일정은 브랜드에 딸리지 않고 data 에 통째로 있습니다 */
    const box = d.g ? (brandById(d.g) || {})[d.k] : data[d.k];
    const x = (box || []).find(y => y.id === d.i); return x ? S(x[d.f]) : '';
  }
  if(d.ed === 'pg'){ const pg = pageFind(d.i); return pg ? S(pg[d.f]) : ''; }
  if(d.ed === 'pgtab'){
    const pg = pageFind(d.g); if(!pg) return '';
    const t = pageTabsOf(pg).find(x => x.id === d.i); return t ? S(t.name) : '';
  }
  if(d.ed === 'pgit'){
    const pg = pageFind(d.g); if(!pg) return '';
    const x = pageItemsOf(pg).find(y => y.id === d.i); return x ? S(x[d.f]) : '';
  }
  if(d.ed === 'obhead') return S(obHead()[d.f]);       // 온보딩 머리말
  if(d.ed === 'obstat'){                                // 머리말의 숫자 띠
    const x = (obHead().stats || []).find(y => y.id === d.i); return x ? S(x[d.f]) : '';
  }
  /* 소개 칸(what · sum · ob1 · id · rule · who · chap · samp …) 은
     걷어냈습니다 — 소개는 이제 올린 브랜드북 파일 그 자체입니다. */
  return '';
}
function edSet(d, v){
  if(d.ed === 'obkid'){ obKidSet(d.g, d.i, d.k, d.f, v); return; }
  if(d.ed === 'obkid0' || d.ed === 'obit'){ obItSet(d.g, d.i, d.f, v); return; }
  if(d.ed === 'obsec'){ obSecSet(d.g, d.f, v); return; }
  if(d.ed === 'obrow'){ obRowRename(d.g, d.i, v); return; }
  if(d.ed === 'item'){ itemFieldSet(d.g, d.k, d.i, d.f, v); return; }
  if(d.ed === 'pg'){ pageSet(d.i, d.f, v); return; }
  if(d.ed === 'pgtab'){ pageTabSet(d.g, d.i, v); return; }
  if(d.ed === 'pgit'){ pageItemSet(d.g, d.i, d.f, v); return; }
  if(d.ed === 'obhead'){ obHeadSet(d.f, v); obMark(); return; }
  if(d.ed === 'obstat'){ obStatSet(d.i, d.f, v); obMark(); return; }
}
function edData(el){
  return { ed: el.getAttribute('data-ed') || '',
           f:  el.getAttribute('data-f')  || '',
           k:  el.getAttribute('data-k')  || '',
           g:  el.getAttribute('data-g')  || '',
           i:  el.getAttribute('data-i')  || '',
           ml: el.getAttribute('data-ml') === '1',
           ph: el.getAttribute('data-ph') || '' };
}
/* 자리 하나를 칸으로 바꿉니다 */
function edStart(el){
  if(!el || edOn) return;
  const d = edData(el);
  if(!d.ed) return;
  const v = edGet(d);
  edOn = '1'; edSkip = false; edAt = Date.now();
  el.classList.add('ed-on');
  el.setAttribute('data-was', el.innerHTML);
  const tag = d.ml ? 'textarea' : 'input';
  /* 「Ctrl+Enter 로 저장」 이라고 적어 두면 아무도 안 씁니다 — 눌러서
     저장하는 단추를 놓습니다. 키는 지름길로만 남깁니다. */
  el.innerHTML = '<' + tag + ' id="edBox" class="ed-box"'
    + (d.ml ? ' rows="1"' : ' type="text"')
    + ' placeholder="' + esc(d.ph) + '"></' + tag + '>'
    + '<span class="ed-bar">'
      + '<button type="button" class="ok" onmousedown="event.preventDefault()" '
        + 'onclick="edStop(1)">저장</button>'
      + '<button type="button" class="no" onmousedown="event.preventDefault()" '
        + 'onclick="edStop(0)">취소</button>'
      + '<i>' + (d.ml ? '줄바꿈은 Enter · 다른 데를 눌러도 저장됩니다'
                      : 'Enter 로도 저장됩니다') + '</i>'
    + '</span>';
  const box = document.getElementById('edBox');
  box.value = v;
  if(d.ml) gbGrow(box);
  box.focus();
  try{ box.setSelectionRange(v.length, v.length); }catch(e){}
  box.addEventListener('input', () => { if(d.ml) gbGrow(box); });
  /* 단추를 누르는 동안 blur 가 먼저 나면 단추가 사라집니다 —
     단추 쪽은 onmousedown 에서 기본 동작을 막아 두었습니다 */
  /* 짧은 글을 <<두 번>> 누르면 첫 클릭이 칸을 열고, 둘째 클릭이 넓어진
     칸 밖에 떨어져 곧바로 닫혔습니다. 막 연 칸은 한 번 붙잡아 둡니다. */
  box.addEventListener('blur',  () => setTimeout(() => {
    const b2 = document.getElementById('edBox');
    if(b2 === box && Date.now() - edAt < 400){ box.focus(); return; }
    edStop(true);
  }, 0));
  box.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.preventDefault(); edStop(false); return; }
    if(e.key === 'Enter' && (!d.ml || e.ctrlKey || e.metaKey)){
      e.preventDefault(); edStop(true);
    }
  });
  edCur = { el: el, d: d, was: v };
}
function edStop(save){
  if(!edOn) return;
  const box = document.getElementById('edBox');
  const cur = edCur;
  edOn = ''; edCur = null;
  if(cur && box && save && box.value !== cur.was){
    edSet(cur.d, box.value);
    toast('✎ 고쳤습니다 — 그대로 저장됩니다');
    render(); return;
  }
  /* 안 바꿨으면 원래 글자를 그대로 돌려놓습니다 (다시 그리지 않아도 됩니다) */
  if(cur && cur.el){
    cur.el.classList.remove('ed-on');
    const was = cur.el.getAttribute('data-was');
    if(was !== null) cur.el.innerHTML = was;
    cur.el.removeAttribute('data-was');
  }
  if(edSkip){ edSkip = false; render(); }
}
/* ── 누르면 고쳐집니다 — 한 번만 ────────────────────────────
   고치는 길을 두 개 만들어 놓고(따로 화면 + 두 번 누르기) 둘 다 눈에
   안 보이게 해 뒀습니다. 두 번 누르기는 아무도 찾지 못하는 몸짓입니다.
   이제 <<한 번만>> 누르면 열립니다. 대신 글을 끌어서 고르고 있을 때는
   열지 않습니다 — 그때 열리면 고르던 글이 날아갑니다. */
let edDown = null;
document.addEventListener('mousedown', e => { edDown = [e.clientX, e.clientY]; }, true);
function edClickable(t){
  if(!t || !t.closest) return null;
  if(t.closest('input,textarea,select,button,a,.ed-bar')) return null;
  return t.closest('[data-ed]');
}
/* 고치는 중에 다른 칸을 누르면 — 지금 것을 저장하고 <<그 칸을 바로>>
   엽니다. 전에는 닫히기만 해서 한 번 더 눌러야 했습니다.
   다시 그리면 그 칸은 새로 만들어지므로 표시로 다시 찾습니다. */
function edJump(el){
  const d = edData(el);
  const sel = '[data-ed="' + d.ed + '"]'
    + (d.f ? '[data-f="' + d.f + '"]' : '')
    + (d.k ? '[data-k="' + d.k + '"]' : '')
    + (d.g ? '[data-g="' + d.g + '"]' : '')
    + (d.i ? '[data-i="' + d.i + '"]' : '');
  edStop(true);
  setTimeout(() => { const nx = document.querySelector(sel); if(nx) edStart(nx); }, 40);
}
document.addEventListener('click', e => {
  const el0 = edClickable(e.target);
  if(edOn){
    if(el0 && !el0.classList.contains('ed-on')){ e.preventDefault(); edJump(el0); }
    return;
  }
  const el = el0;
  if(!el) return;
  /* 끌었으면(=글을 고르는 중이면) 건드리지 않습니다 */
  if(edDown && (Math.abs(e.clientX - edDown[0]) > 4
             || Math.abs(e.clientY - edDown[1]) > 4)) return;
  try{ if(String(window.getSelection() || '').length > 1) return; }catch(err){}
  e.preventDefault();
  edStart(el);
});
/* 두 번 눌러 온 분들도 그대로 되게 둡니다 (이미 열려 있으면 그냥 지납니다) */
document.addEventListener('dblclick', e => {
  if(edOn) return;
  const el = edClickable(e.target);
  if(!el) return;
  e.preventDefault();
  edStart(el);
});

/* ═══════════════ 📚 책으로 보기 ══════════════════════════════════
   소개는 아홉 단짜리 문서입니다. 죽 내려 읽는 것도 되지만, 신입에게
   <<한 장씩 넘겨 보여 주는>> 쪽이 훨씬 잘 읽힙니다 — 한 화면에 한 가지만
   있으니 어디까지 읽었는지가 몸으로 남습니다. 카탈로그를 넘겨 보는 것과
   같은 모양입니다.

   넘기는 단추를 글 <<위에>> 겹쳐 두지 않았습니다. 겹쳐 두면 글을 눌러
   고치려다 장이 넘어갑니다. 글 바깥 양옆에 세웁니다.
   ================================================================= */
/* 소개는 <<늘 책>> 입니다. 죽 내려 읽는 화면과 책 화면을 둘 다 두면
   「둘이 뭐가 다르지」 를 매번 고르게 됩니다. 한 장씩 넘기는 쪽이 더 잘
   읽히므로 그쪽만 둡니다 (인쇄는 여전히 처음부터 끝까지 한 번에 냅니다). */
let pwPg   = 0;          // 몇 장째
let pwDir  = 1;          // 어느 쪽으로 넘겼나 (넘어가는 모양을 위해)
let pwPgN  = 1;          // 모두 몇 장인지 (넘기기를 가둘 때 씁니다)

/* 🖨 인쇄 — 보고 있는 한 장이 아니라 <<처음부터 끝까지>> 를 냅니다.
   한 장이 종이 한 쪽이 되게 끊어 둡니다. 브라우저의 인쇄 창에서
   「PDF 로 저장」 을 고르면 그대로 PDF 가 됩니다. */
function pathPrint(){
  /* 올린 그대로 인쇄해야 맞습니다. 화면에 그려 둔 그림을 찍으면 흐려집니다 —
     올린 파일을 그대로 열어 브라우저가 가진 인쇄를 쓰면 만든 그대로 나옵니다. */
  const b = currentBrand(); if(!b) return;
  const bk = pathBook(b);
  if(!bk){ toast('먼저 브랜드북을 올려 주세요'); return; }
  window.open(bookUrl(bk), '_blank', 'noopener');
}

/* ── 쪽 넘기기 ──────────────────────────────────────────────────
   전에는 넘길 때마다 화면을 통째로 다시 그렸습니다. 그러면 끼워 둔 틀
   (iframe)이 DOM 에서 떨어졌다 붙으면서 <<문서를 새로 읽습니다>> —
   그게 「꺼졌다 켜졌다」 하던 까닭입니다. 이제 쪽만 옮깁니다.
   ------------------------------------------------------------- */
function pwGo(d){
  const to = Math.min(Math.max(0, pwPg + d), Math.max(0, pwPgN - 1));
  if(to === pwPg) return;
  pwGoTo(to);
}
function pwGoTo(i){
  const to = Math.min(Math.max(0, Number(i) || 0), Math.max(0, pwPgN - 1));
  if(to === pwPg && document.getElementById('bkIfr')) return;
  pwDir = to >= pwPg ? 1 : -1;
  pwPg = to;
  /* 📖 책장이 넘어가듯 — 한 번 들렸다 놓입니다 */
  const sheet = document.getElementById('bkIfr') || document.getElementById('pdfBox');
  if(sheet){
    sheet.classList.remove('turn-f', 'turn-b');
    void sheet.offsetWidth;                       // 애니메이션을 다시 태웁니다
    sheet.classList.add(pwDir > 0 ? 'turn-f' : 'turn-b');
    clearTimeout(pwTurnAt);
    pwTurnAt = setTimeout(() => sheet.classList.remove('turn-f', 'turn-b'), 460);
  }
  if(document.getElementById('bkIfr')) bookFit();
  else if(document.getElementById('pdfBox')) pdfPaint();
  else render();
}
let pwTurnAt = 0;

/* ── 화면 ── */
function pathViewHtml(b){
  const bid = jsq(b.id);
  const bk  = pathBook(b);
  /* 📗 소개는 <<올린 브랜드북 그 자체>> 입니다. 전에는 글을 칸으로 옮겨
     적어 두고 그걸 보여 줬습니다 — 옮기는 사이에 디자인이 사라지고,
     같은 글이 파일과 칸 두 군데에 생겨 어느 쪽이 진짜인지 헷갈렸습니다.
     이제 파일 하나만 둡니다. 보는 것도 · 고치는 것도 그 파일입니다. */
  const bar = '<div class="st-mode">'
    + '<button class="btn sm primary' + (pathGetTo === b.id ? ' on' : '') + '" '
      + 'onclick="pathGetOpen(\'' + bid + '\')">📗 브랜드북 '
      + (bk ? '바꿔 올리기' : '올리기') + '</button>'
    + (bk
      ? '<button class="btn sm" onclick="pathPrint()" '
          + 'title="올린 그대로 인쇄합니다 — 인쇄 창에서 PDF 로 저장해도 됩니다">'
          + '🖨 인쇄 · PDF</button>'
        + '<a class="btn sm" href="files.php?action=dl&path='
          + encodeURIComponent(bk.filePath) + '" download>⬇ 내려받기</a>'
        + '<span class="hint">만든 그대로 펴 둡니다'
          + (bookIsPdf(bk) ? ' — PDF 는 글을 고칠 수 없습니다 (HTML 이면 고칠 수 있습니다)'
                           : ' — <b>[✎ 이대로 고치기]</b> 로 이 모양 그대로 고칩니다')
          + '</span>'
      : '<span class="hint">브랜드북을 올리면 이 자리에 <b>만든 그대로</b> 펴집니다</span>')
    + '</div>'
    + pathGetHtml(b)
    /* PDF 도 받습니다 — 한글 PDF 는 글꼴 표(ToUnicode)를 보고 읽습니다 */
    + '<input type="file" id="pathDocInput" style="display:none" '
      + 'accept=".pdf,.html,.htm" '
      + 'onchange="uploadPathDoc(this.files); this.value=\'\'">';
  return bar + pathMineHtml(b) + bookViewHtml(b, bk);
}

/* 올린 브랜드북을 폅니다 — 없으면 올리라고 합니다 */

/* 단추 줄만 갈아 끼웁니다 — 화면을 다시 그리면 끼워 둔 틀이 문서를

/* 쪽수 양옆의 작은 넘김 단추. 전에는 종이 양옆에 큰 칸이 서 있어
   빈 상자 둘이 붙어 있는 것처럼 보였습니다 — 자리만 차지했습니다. */
/* 종이 양옆의 넘김 단추 — 얇게, 손을 올렸을 때만 바탕이 비칩니다 */
function bookSideBtn(d){
  const off = d < 0 ? (pwPg <= 0) : (pwPg >= pwPgN - 1);
  return '<button class="bk-nav" id="' + (d < 0 ? 'bkSideP' : 'bkSideN') + '"'
    + (off ? ' disabled' : '')
    + ' onclick="pwGo(' + d + ')" title="' + (d < 0 ? '앞 장 (← 키)' : '다음 장 (→ 키)') + '">'
    + (d < 0 ? '‹' : '›') + '</button>';
}
function bookTurnBar(id){
  return '<div class="bk-turn">'
    + '<button id="bkPrev" onclick="pwGo(-1)" title="앞 장 (← 키)">‹</button>'
    + '<span class="bk-n" id="' + id + '">…</span>'
    + '<button id="bkNext" onclick="pwGo(1)" title="다음 장 (→ 키)">›</button>'
    + '</div>';
}
function bookViewHtml(b, bk){
  if(!bk){
    return '<div class="pw"><div class="pw-none">브랜드북이 아직 없습니다.'
      + '<br><span>위 <b>[📗 브랜드북 올리기]</b> 로 PDF 나 HTML 을 올리면 '
      + '이 자리에 <b>만든 그대로</b> 펴집니다.<br>'
      + 'HTML 로 올리면 그 모양 그대로 글까지 고칠 수 있습니다.</span>'
      + '</div></div>';
  }
  return bookOrigHtml(b, bk);
}


/* 긴 글 한 덩어리 — 접어 두고 [＋ 더 보기] 로 폅니다 */
function fold(inner){

/* ═══════════════ 📄 만든 그대로 펴 보기 ═══════════════════════════
   브랜드북은 이미 잘 만들어 둔 책입니다. 칸으로 옮기면 글은 남지만
   디자인 — 글꼴 · 여백 · 색 · 도표 — 이 사라집니다. 그래서 올린 PDF 를
   <<그 모양 그대로>> 넘겨 보는 자리를 따로 둡니다.
     📄 원본   — 만든 그대로. 디자인이 살아 있습니다. 글은 못 고칩니다.
     ✎ 우리 칸 — 칸으로 옮긴 것. 고치고 · 찾고 · 다른 화면에서 씁니다.
   둘은 같은 파일의 두 얼굴입니다. 하나만 두면 늘 아쉬운 쪽이 생깁니다.
   ================================================================= */
let pdfLib = null;          // pdf.js (쓸 때 한 번만 불러옵니다)
const pdfDoc = {};          // 주소 → 펼쳐 둔 PDF
let pdfBusy = '';
let pdfLast = null;         // 마지막으로 그린 그림 — 다시 그릴 때 깜박이지 않게

/* 브랜드북으로 올린 것 가운데 <<만든 그대로>> 펼 수 있는 마지막 파일.
   PDF 와 HTML 둘 다 됩니다. 한글(.hwp) · 워드는 그려 낼 길이 없어 뺍니다. */
function pathBook(b){
  const ds = pathDocs(b).filter(d =>
    /\.(pdf|html?)$/i.test(String(d.name || '')) && String(d.filePath || '').trim());
  return ds.length ? ds[ds.length - 1] : null;
}
function bookIsPdf(d){ return /\.pdf$/i.test(String((d && d.name) || '')); }

/* HTML 브랜드북을 끼워 넣습니다. 끼운 틀은 한 번 만들어 두고 다시 씁니다 —
   화면이 다시 그려질 때마다 새로 끼우면 읽던 자리가 맨 위로 튑니다. */
let bookIfr = null;
function bookFrame(){
  const box = document.getElementById('bkIfr'); if(!box) return;
  const b = currentBrand(); if(!b) return;
  const d = pathBook(b); if(!d || bookIsPdf(d)) return;
  /* 저장하고 나면 번호를 올려 새로 읽어옵니다 (브라우저가 옛것을 쥐고
     있으면 방금 고친 것이 안 보입니다) */
  const url = bookUrl(d) + (bookVer ? '&v=' + bookVer : '');
  if(!bookIfr || bookIfr.dataset.url !== url){
    const f = document.createElement('iframe');
    /* allow-same-origin 만 켭니다 — 우리가 안을 들여다보며 고칠 수 있되,
       문서 안의 스크립트는 그대로 막혀 있습니다 (서버도 CSP 로 막습니다) */
    f.setAttribute('sandbox', 'allow-same-origin');
    f.title = d.name || '브랜드북';
    f.dataset.url = url;
    f.addEventListener('load', bookArm);
    f.src = url;
    bookIfr = f;
  }
  if(box.firstChild !== bookIfr){ box.innerHTML = ''; box.appendChild(bookIfr); }
  bookArm();          // 이미 읽어 둔 것이면 load 가 다시 오지 않습니다
  bookBtns();
}
/* 올린 그대로 펴 보는 주소 (내려받지 않고 그 자리에서 봅니다) */
function bookUrl(d){ return 'files.php?action=view&path=' + encodeURIComponent(d.filePath); }

/* pdf.js 는 1.8MB 라 <<볼 때>> 한 번만 받아 옵니다 */
async function pdfLoad(){
  if(pdfLib) return pdfLib;
  const m = await import('./pdf.min.js');
  m.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
  pdfLib = m;
  return m;
}
async function pdfOpen(url){
  if(pdfDoc[url]) return pdfDoc[url];
  const lib = await pdfLoad();
  pdfDoc[url] = await lib.getDocument(url).promise;
  return pdfDoc[url];
}
/* ═══════════════ ✎ 원본을 그 모양 그대로 고치기 ═══════════════════
   PDF 는 글자를 그림으로 찍어 둔 것이라 그 자리에서 못 고칩니다.
   HTML 은 진짜 문서라 <<보이는 그대로>> 눌러서 고칠 수 있습니다.
   저장하면 올린 파일을 그 자리에서 고쳐 씁니다 — 파일이 늘어나지
   않습니다. 고치기 전 것은 _휴지통 에 한 벌 남으니 되돌릴 수 있습니다.
   ================================================================= */
let bookEdit  = false;      // 지금 고치는 중인가
let bookDirty = false;      // 고쳐 놓고 아직 저장 안 한 것이 있나
let bookBusy  = false;      // 저장하는 중
let bookVer   = 0;          // 저장한 뒤 새로 읽어오게 하는 번호

function bookDoc(){
  const f = bookIfr;
  try{ return (f && f.contentDocument) || null; }catch(e){ return null; }
}
/* ── HTML 브랜드북도 <<한 장씩>> 넘깁니다 ─────────────────────────
   PDF 는 애초에 쪽이 나뉘어 있지만 HTML 은 한 줄로 길게 이어집니다.
   그런데 브랜드북 HTML 은 대개 장(章)마다 한 덩어리로 짜여 있습니다.
   그 덩어리를 찾아 쪽으로 삼고, 한 장만 보이게 자리를 잡아 줍니다.
   ------------------------------------------------------------------ */
function bookPages(){
  const d = bookDoc(); if(!d || !d.body) return [];
  const tall = e => e.nodeType === 1 && e.getBoundingClientRect().height > 120;
  /* ① 만든 사람이 이름을 붙여 두었으면 그것이 가장 정확합니다 */
  let ps = Array.from(d.querySelectorAll(
    '.page,.pg,.sheet,.slide,.pp,[data-page]')).filter(tall);
  if(ps.length >= 2) return ps;
  /* ② 없으면 <<장이 늘어선 자리>> 를 찾아 내려갑니다. 겉을 한 겹씩
     벗기다가 형제가 둘 이상 나오는 곳이 쪽이 늘어선 자리입니다. */
  let box = d.body;
  for(let k = 0; k < 5 && box; k++){
    const kids = Array.from(box.children).filter(tall);
    if(kids.length >= 2) return kids;
    if(kids.length === 1) box = kids[0]; else break;
  }
  return d.body ? [d.body] : [];
}
/* 지금 쪽만 보이게 자리를 잡습니다.
   ① 틀 높이 = 그 쪽 높이 — 한 장만 보입니다
   ② 종이가 화면보다 좁으면 <<화면 폭에 맞춰 키웁니다>> — PDF 는 이미
      폭에 맞춰 그리므로, 안 키우면 같은 책인데 HTML 만 작게 나옵니다 */
function bookFit(){
  const d = bookDoc(), f = bookIfr;
  if(!d || !f || !d.body) return;
  const box = document.getElementById('bkIfr'); if(!box) return;
  let st = d.getElementById('__bhpg');
  if(!st){
    st = d.createElement('style'); st.id = '__bhpg';
    (d.head || d.documentElement).appendChild(st);
  }
  /* ① 배율 없이 한 번 재 봅니다 */
  st.textContent = 'html{overflow:hidden !important}';
  box.style.maxWidth = '';
  let ps = bookPages();
  if(!ps.length) return;
  pwPgN = ps.length;
  const i = Math.min(Math.max(0, pwPg), ps.length - 1);
  const W = box.getBoundingClientRect().width;
  const w0 = ps[i].getBoundingClientRect().width;
  /* ② 폭에 맞춰 키울 배율을 셈합니다. 폭에 따라 스스로 늘어나는
     (반응형) 문서면 w0 이 이미 W 와 같아 배율이 1 이 됩니다. */
  let k = (w0 > 40 && W > 40) ? (W / w0) : 1;
  if(!(k > 1.02)) k = 1;
  k = Math.min(k, 2.4);                       // 너무 키우면 글이 깨져 보입니다
  st.textContent = 'html{overflow:hidden !important'
    + (k !== 1 ? ';zoom:' + (Math.round(k * 1000) / 1000) : '') + '}';
  /* ③ 키운 뒤 다시 재서 자리를 잡습니다 */
  ps = bookPages();
  const el = ps[Math.min(i, ps.length - 1)];
  const r = el.getBoundingClientRect();
  const win = d.defaultView;
  const top = r.top + (win ? win.scrollY : 0);
  box.style.height = Math.max(200, Math.ceil(r.height)) + 'px';
  f.style.height = '100%';
  try{ win.scrollTo(0, Math.max(0, Math.round(top))); }catch(e){}
  const nm = document.getElementById('bkNo');
  if(nm) nm.textContent = (i + 1) + ' / ' + ps.length;
  bookNav(); bookTh(i + 1, ps.length);
}
/* 넘기기 단추를 지금 쪽수에 맞춥니다 (다시 그리지 않고 단추만) */
function bookNav(){
  const first = pwPg <= 0, last = pwPg >= pwPgN - 1;
  ['bkPrev', 'bkSideP'].forEach(k => {
    const e = document.getElementById(k); if(e) e.disabled = first;
  });
  ['bkNext', 'bkSideN'].forEach(k => {
    const e = document.getElementById(k); if(e) e.disabled = last;
  });
}
function bookTh(no, n){
  const el = document.getElementById('bkTh');
  if(!el) return;
  let h = '';
  for(let i = 1; i <= n; i++){
    h += '<button class="' + (i === no ? 'on' : '') + '" onclick="pwGoTo(' + (i - 1) + ')"'
       + ' title="' + i + '쪽">' + i + '</button>';
  }
  el.innerHTML = h;
}
/* 글을 눌러 고칠 수 있게 열어 둡니다 (틀·색·표 모양은 그대로) */
function bookArm(){
  const d = bookDoc(); if(!d || !d.body) return;
  try{ d.designMode = bookEdit ? 'on' : 'off'; }catch(e){}
  if(bookEdit && !d.__armed){
    d.__armed = true;
    d.addEventListener('input', () => {
      if(!bookDirty){ bookDirty = true; bookBtns(); }
      /* 글이 늘거나 줄면 쪽 높이도 달라집니다 — 뒤늦게 한 번 맞춥니다 */
      clearTimeout(bookFitAt); bookFitAt = setTimeout(bookFit, 400);
    });
  }
  bookArmHand(d);
  bookFit();
}
let bookFitAt = 0;

/* ── 옆으로 밀어 넘기기 ──────────────────────────────────────────
   손가락 · 트랙패드 · 마우스 끌기 — 어느 쪽으로 밀어도 넘어갑니다.
   틀 안은 남의 문서라 바깥 손짓이 닿지 않으므로 그 문서에 직접 답니다
   (같은 자리에서 읽어 온 것이라 들여다볼 수 있습니다).
   고치는 중에는 끄지 않습니다 — 글을 고르려고 끄는 손짓과 헷갈립니다.
   ------------------------------------------------------------- */
function bookSwipe(t){
  if(!t || t.__hand) return;
  t.__hand = true;
  let x0 = 0, y0 = 0, t0 = 0, on = false;
  const start = (x, y) => { x0 = x; y0 = y; t0 = Date.now(); on = true; };
  const end = (x, y) => {
    if(!on) return; on = false;
    if(bookEdit) return;                       // 고치는 중에는 안 넘깁니다
    const dx = x - x0, dy = y - y0;
    /* 옆으로 크게 · 위아래로는 조금 · 빠르게 민 것만 「넘기기」 입니다 */
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    if(Date.now() - t0 > 900) return;
    pwGo(dx < 0 ? 1 : -1);
  };
  t.addEventListener('pointerdown', e => { if(e.button === 0) start(e.clientX, e.clientY); }, true);
  t.addEventListener('pointerup',   e => end(e.clientX, e.clientY), true);
  /* 손가락 · 포인터를 안 주는 브라우저 */
  t.addEventListener('touchstart', e => { const q = e.touches[0]; if(q) start(q.clientX, q.clientY); },
    { capture:true, passive:true });
  t.addEventListener('touchend',   e => { const q = e.changedTouches[0]; if(q) end(q.clientX, q.clientY); },
    { capture:true, passive:true });
  t.addEventListener('mousedown', e => { if(e.button === 0 && !on) start(e.clientX, e.clientY); }, true);
  t.addEventListener('mouseup',   e => end(e.clientX, e.clientY), true);
  /* 트랙패드 두 손가락 — 옆으로 쓸면 넘깁니다 */
  let wx = 0, wt = 0;
  t.addEventListener('wheel', e => {
    if(bookEdit) return;
    if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // 위아래로 미는 것은 그대로
    const now = Date.now();
    if(now - wt > 600) wx = 0;
    wt = now; wx += e.deltaX;
    if(Math.abs(wx) >= 120){ const d = wx > 0 ? 1 : -1; wx = 0; wt = now + 420; pwGo(d); }
  }, { capture:true, passive:true });
}
/* 틀 안 — 밀어 넘기기 + 두 번 눌러 바로 고치기 */
function bookArmHand(d){
  if(!d) return;
  bookSwipe(d);
  if(d.__dbl) return;
  d.__dbl = true;
  /* 두 번 누르면 [✎ 이대로 고치기] 를 찾아 누르지 않아도 그 자리에서
     바로 고쳐집니다. 커서는 누른 자리에 그대로 섭니다. */
  d.addEventListener('dblclick', () => { if(!bookEdit) setBookEdit(1); }, true);
}
/* 단추 모양만 손봅니다 — 고칠 때마다 화면을 통째로 다시 그리면
   쓰던 자리가 튑니다 */
function bookBtns(){
  const el = document.getElementById('bkEd');
  if(!el) return;
  el.classList.toggle('on', bookEdit);
  el.classList.toggle('dirty', bookDirty);
  const sv = document.getElementById('bkSave');
  if(sv){
    sv.disabled = !bookDirty || bookBusy;
    sv.textContent = bookBusy ? '저장하는 중…' : (bookDirty ? '💾 저장' : '💾 저장됨');
  }
}
function setBookEdit(on){
  on = !!on;
  if(!on && bookDirty
     && !confirm('고친 것이 아직 저장되지 않았습니다.\n\n그냥 닫으면 고친 내용이 사라집니다.')) return;
  /* 고친 것을 버리고 닫을 때만 다시 읽어옵니다 */
  if(!on && bookDirty){
    bookDirty = false; bookVer++; bookIfr = null; bookEdit = false; render(); return;
  }
  bookEdit = on;
  /* 두 번 눌러 켰을 때 누른 자리에 커서가 그대로 서 있게 합니다 */
  const d = bookDoc();
  let keep = null;
  try{ const sel = d && d.getSelection();
       if(sel && sel.rangeCount) keep = sel.getRangeAt(0).cloneRange(); }catch(e){}
  bookArm();
  bookPaintBar();
  if(keep){ try{ const sel = d.getSelection(); sel.removeAllRanges(); sel.addRange(keep);
                 if(d.body) d.body.focus(); }catch(e){} }
}
/* 지금 커서가 놓인 줄(표의 한 줄 · 목록의 한 칸) 을 찾습니다 */
function bookRowAt(){
  const d = bookDoc(); if(!d) return null;
  let n = null;
  try{ const s = d.getSelection(); n = s && s.anchorNode; }catch(e){}
  while(n && n.nodeType !== 1) n = n.parentNode;
  while(n && n !== d.body && !/^(TR|LI)$/.test(n.tagName)) n = n.parentNode;
  return (n && n !== d.body) ? n : null;
}
function bookRowAdd(){
  const r = bookRowAt();
  if(!r){ toast('표의 줄이나 목록의 칸 안을 먼저 눌러 주세요'); return; }
  const n = r.cloneNode(true);
  /* 새 줄은 비워서 넣습니다 — 베껴 둔 글이 그대로 남으면 헷갈립니다 */
  const cs = n.querySelectorAll ? n.querySelectorAll('th,td') : [];
  if(cs.length) Array.from(cs).forEach(c => { c.textContent = ''; });
  else n.textContent = '';
  r.parentNode.insertBefore(n, r.nextSibling);
  bookDirty = true; bookBtns();
  try{ const d = bookDoc(); const s = d.getSelection(); const g = d.createRange();
       g.selectNodeContents(cs.length ? n.querySelector('th,td') : n); g.collapse(true);
       s.removeAllRanges(); s.addRange(g); }catch(e){}
}
function bookRowDel(){
  const r = bookRowAt();
  if(!r){ toast('지울 줄 안을 먼저 눌러 주세요'); return; }
  const p = r.parentNode;
  if(p && p.children.length <= 1){ toast('마지막 한 줄은 지울 수 없습니다'); return; }
  r.parentNode.removeChild(r);
  bookDirty = true; bookBtns();
}
/* 고친 그대로를 글로 되돌려 냅니다 (고치는 중 표시는 빼고) */
function bookHtml(){
  const d = bookDoc(); if(!d || !d.documentElement) return '';
  const was = d.designMode;
  try{ d.designMode = 'off'; }catch(e){}
  Array.from(d.querySelectorAll('[contenteditable]'))
    .forEach(e => e.removeAttribute('contenteditable'));
  /* 한 장씩 보이게 하려고 넣어 둔 자국은 파일에 남기지 않습니다 */
  const st = d.getElementById('__bhpg'); if(st) st.remove();
  const dt = d.doctype ? '<!doctype ' + d.doctype.name + '>\n' : '';
  const out = dt + d.documentElement.outerHTML;
  try{ d.designMode = was; }catch(e){}
  return out;
}
async function bookSave(){
  if(bookBusy) return;
  const b = currentBrand(); if(!b) return;
  const bk = pathBook(b); if(!bk || bookIsPdf(bk)) return;
  const html = bookHtml();
  if(!html){ toast('고친 내용을 읽지 못했습니다'); return; }
  bookBusy = true; bookBtns();
  try{
    const f = new File([html], bk.name || 'brandbook.html', { type: 'text/html' });
    const r = await pgUploadOne(f, { brand:'', sub:'', over: bk.filePath });
    if(!r || r.ok === false) throw new Error((r && r.error) || '저장하지 못했습니다');
    /* 자리가 옮겨졌으면 새 자리를 적어 둡니다 (폴더 정리·이름 바뀜) */
    if(r.filePath && r.filePath !== bk.filePath){ bk.filePath = r.filePath; markDirty(b.id); }
    bk.size = html.length;
    bookDirty = false; bookBtns();
    toast('💾 브랜드북을 고쳐 썼습니다 — 고치기 전 것은 🗑 휴지통에 있습니다');
  }catch(e){
    alert('저장하지 못했습니다.\n\n' + apiErrText(e));
  }finally{ bookBusy = false; bookBtns(); }
}
function bookRevert(){
  if(!confirm('고친 것을 버리고 저장된 것을 다시 불러옵니다.')) return;
  bookDirty = false; bookVer++; bookIfr = null;
  render();
}

/* 지금 쪽을 그려 넣습니다. 화면 너비에 맞춰 크기를 잡습니다. */
async function pdfPaint(){
  const b = currentBrand(); if(!b) return;
  const d = pathBook(b); if(!d || !bookIsPdf(d)) return;
  const box = document.getElementById('pdfBox'); if(!box) return;
  bookSwipe(box);                 // PDF 도 옆으로 밀어 넘깁니다
  const url = bookUrl(d);
  const wide = Math.max(320, box.clientWidth || 720);
  /* 옆에서 누가 저장하면 화면이 통째로 다시 그려집니다. 그때마다 PDF 를
     새로 그리면 읽던 쪽이 깜박입니다 — 같은 쪽·같은 너비면 그려 둔
     그림을 그대로 다시 붙입니다. */
  const key = url + '#' + pwPg + '@' + Math.round(wide);
  if(pdfLast && pdfLast.key === key){
    if(box.firstChild !== pdfLast.cv){ box.innerHTML = ''; box.appendChild(pdfLast.cv); }
    const nm0 = document.getElementById('pdfNo');
    if(nm0) nm0.textContent = pdfLast.no + ' / ' + pdfLast.n;
    pdfTh(pdfLast.no, pdfLast.n); pdfNav();
    return;
  }
  if(pdfBusy === key) return;
  pdfBusy = key;
  try{
    const doc = await pdfOpen(url);
    /* 쪽수는 PDF 가 압니다 — 다 펴 보고 나서야 「다음」을 열고 닫습니다 */
    pwPgN = doc.numPages;
    pdfNav();
    const no = Math.min(Math.max(1, pwPg + 1), doc.numPages);
    const pg = await doc.getPage(no);
    const v1 = pg.getViewport({ scale: 1 });
    /* 또렷하게 — 화면 배율까지 셈합니다 (레티나에서 흐려 보이지 않게) */
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const sc = (wide / v1.width) * dpr;
    const vp = pg.getViewport({ scale: sc });
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    cv.style.width = '100%'; cv.style.height = 'auto';
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    /* 그리는 사이에 화면이 다시 섰으면 자리가 바뀌어 있습니다 — 옛 자리에
       붙이면 아무 데도 안 보입니다. 붙이기 직전에 다시 찾습니다. */
    const now = document.getElementById('pdfBox') || box;
    now.innerHTML = ''; now.appendChild(cv);
    pdfLast = { key, cv, no, n: doc.numPages };
    const nm = document.getElementById('pdfNo');
    if(nm) nm.textContent = no + ' / ' + doc.numPages;
    pdfTh(no, doc.numPages);
  }catch(e){
    const now = document.getElementById('pdfBox') || box;
    now.innerHTML = '<div class="pdf-err">📄 원본을 펴지 못했습니다<span>'
      + esc(String((e && e.message) || e)) + '</span>'
      + '<i>pdf.min.js · pdf.worker.min.js 가 brand.html 옆에 있어야 합니다 — '
      + 'save.php?action=bootstrap 을 한 번 열어 주세요.</i></div>';
  }finally{ pdfBusy = ''; }
}
/* 쪽 고르기 줄 — 몇 장인지는 PDF 를 펴 봐야 알기에 여기서 채웁니다 */
function pdfTh(no, n){
  const el = document.getElementById('pdfTh');
  if(!el) return;
  let h = '';
  for(let i = 1; i <= n; i++){
    h += '<button class="' + (i === no ? 'on' : '') + '" onclick="pwGoTo(' + (i - 1) + ')"'
       + ' title="' + i + '쪽">' + i + '</button>';
  }
  el.innerHTML = h;
}
/* 넘기기 단추를 지금 쪽수에 맞춥니다 (다시 그리지 않고 단추만 손봅니다) */
function pdfNav(){ bookNav(); }
function bookOrigHtml(b, bk){
  const top = '<div class="pw-top"><div class="pw-nm">' + esc(b.icon || '🏷️') + ' '
    + esc(b.name) + ' — ' + esc(bk.name) + '</div>';

/* 지킬 것 한 줄 — 근거가 걸려 있으면 그 여정을 그 자리에 인용합니다.
   규칙만 있으면 안 지킵니다. 왜 생겼는지가 붙어야 납득합니다. */




/* yr — 그 마디가 속한 연도 머리. 「2022」 아래 다시 「2022」 를 적지 않습니다. */
/* 첫날 보기일 때만 「✕ 안 된 것」 을 접습니다 — 그리는 쪽에서 정해 줍니다 */
let chapFold = true;
/* 갈래는 여섯 중 하나입니다 — 글칸을 열어 주면 「방향을튼다」 같은
   오타가 들어가고, 그 마디는 색도 아이콘도 잃습니다. 그래서 갈래만은
   글칸이 아니라 여섯 개를 그 자리에 펴 놓고 고르게 합니다. */
let chapKindAt = '';



/* 지킬 것 한 줄 고치기 */
/* 적은 것이 있는 줄은 펴 두고, 빈 줄은 접어 둡니다.
   손으로 편 줄은 다시 그려도 펴진 채로 있어야 합니다 (안 그러면
   한 글자 칠 때마다 접힙니다). */
const ruleMore = new Set();


/* ── 📄 기획서 ── 적는 곳이 아니라 문서를 올려 두는 곳 ──────────
   기획서는 이 화면에서 쓰지 않습니다. 밖에서 정리한 문서를 올립니다.
   라인의 마디는 「어느 문서의 어디에서 나왔는지」 로 그 문서를 겁니다.

   문서 한 장 = 제목 하나 + 판(버전) 여럿.
   처음엔 문서가 하나뿐이라 고를 것이 없습니다. 그래서 하나일 때는
   고르개를 감추고 그 문서로 자동으로 겁니다. 다시 정리해 올리면
   같은 문서의 다음 판이 되고, 다른 주제를 정리하면 새 문서가 됩니다.
   자료는 브랜드마다 b.docs 에 들어갑니다.
   ------------------------------------------------------------- */
function docList(b){ if(!Array.isArray(b.docs)) b.docs = []; return b.docs; }
function docFind(b, id){ return docList(b).find(d => d.id === id) || null; }
/* 최신 판 (맨 앞이 최신입니다) */
function docTop(d){ return (d.vers && d.vers[0]) || null; }
function docVerNo(d, v){ return (d.vers || []).length - (d.vers || []).indexOf(v); }
/* 이 문서를 근거로 단 라인 마디 수 */
function docUsed(b, id){ return recsOf(b).filter(r => r.docId === id).length; }
function docUrl(v){
  return v.filePath
    ? 'files.php?action=view&path=' + encodeURIComponent(v.filePath)
    : 'files.php?action=view&id='   + encodeURIComponent(v.id || '');
}

let docAddTo = '';     // 새 판을 붙일 문서 (비어 있으면 새 문서)
let docOldOpen = {};   // 지난 판을 펼친 문서

function pickDoc(id){
  docAddTo = id || '';
  const el = document.getElementById('docInput');
  if(el) el.click();
}
function docOldToggle(id){ docOldOpen[id] = !docOldOpen[id]; render(); }

async function uploadDoc(fileList){
  const b = currentBrand(); if(!b) return;
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const to = docAddTo; docAddTo = '';

  for(const f of files){
    toast('📄 "' + f.name + '" 올리는 중…');
    try{
      const fd = new FormData();
      fd.append('brand', b.name);
      fd.append('sub', '기록부');
      fd.append('file', f);
      const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try{ out = JSON.parse(text); }catch(e){}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '올리지 못했습니다');

      const v = { id: uid('dv'), name: out.fileName, size: out.fileSize,
                  filePath: out.filePath || '', mime: out.mime || '',
                  at: new Date().toISOString(), by: (authMe() || {})['이름'] || '', note: '' };
      const d = to ? docFind(b, to) : null;
      if(d){ d.vers.unshift(v); }
      else {
        docList(b).unshift({ id: uid('dc'),
          title: String(f.name).replace(/\.[^.]+$/, ''), vers: [v] });
      }
    }catch(e){
      alert('"' + f.name + '" 을 올리지 못했습니다.\n\n' + (e.message || e));
    }
  }
  await saveAll(true);
  render();
  toast('✅ 기획서를 올렸습니다');
}

function docRename(bid, id){

  d.title = v.trim() || d.title;

}
function docNote(bid, id, v){

  const d = docFind(b, id); if(!d) return;

}
function docDel(bid, id){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const n = docUsed(b, id);
  if(!confirm('이 문서를 목록에서 내릴까요?'
    + (n ? '\n\n라인 마디 ' + n + '건이 이 문서를 근거로 걸어 두었습니다.'
         + ' 마디는 남고, 걸린 문서만 풀립니다.' : '')
    + '\n\nNAS 공유폴더의 실제 파일은 그대로 남습니다.')) return;
  recsOf(b).forEach(r => { if(r.docId === id){ r.docId = ''; r.docAt = ''; } });
  b.docs = docList(b).filter(d => d.id !== id);
  deletedIds.add(id);
  markDirty(b.id); render();
}
function docVerDel(bid, id, vid){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const d = docFind(b, id); if(!d) return;
  if(d.vers.length < 2) return docDel(bid, id);
  if(!confirm('이 판을 목록에서 내릴까요?\n\nNAS의 실제 파일은 그대로 남습니다.')) return;
  d.vers = d.vers.filter(v => v.id !== vid);
  markDirty(b.id); render();
}

/* ── 🤖 문서에서 라인 마디 뽑기 ─────────────────────────────────
   올린 기획서를 NAS 가 읽어 글자를 뽑고, AI 에게 「연혁 마디」 로
   정리하게 합니다. 바로 넣지 않고 목록으로 보여주고 고르게 합니다 —
   AI 가 잘못 읽은 것을 사람이 걸러내야 하기 때문입니다.
   ------------------------------------------------------------- */
let docMineState = {};   // 문서 id → {busy, step, err, rows[], pick{}}

function docMineHtml(b, d){
  const st = docMineState[d.id];
  if(!st) return '';
  const bid = jsq(b.id), did = jsq(d.id);

  if(st.busy){
    return '<div class="dmn"><div class="dmn-hd">🤖 ' + esc(st.step || '읽는 중…')
      + '<span>문서가 길면 1~2분 걸립니다</span></div></div>';
  }
  if(st.err){
    return '<div class="dmn"><div class="dmn-err">⚠️ ' + esc(st.err) + '</div>'
      + '<div class="dmn-ac"><button class="btn sm" onclick="docMineClose(\'' + did
        + '\')">닫기</button></div></div>';
  }
  const nowKeys = Object.keys(st.now || {});
  if(!st.rows.length && !nowKeys.length && !st.line){
    return '<div class="dmn"><div class="dmn-hd">🤖 이 문서에서 옮길 것을 찾지 못했습니다'
      + '<span>연혁으로 옮길 만한 사건·변화가 없거나, 글자가 잘 안 읽힌 문서입니다</span></div>'
      + '<div class="dmn-ac"><button class="btn sm" onclick="docMineClose(\'' + did
        + '\')">닫기</button></div></div>';
  }

  const on = st.rows.filter((r, i) => st.pick[i]).length;
  const nowOn = nowKeys.filter(k => st.nowPick[k]).length + (st.lineOn ? 1 : 0);
  const rows = st.rows.map((r, i) => {
    const K = recKindOf(r);
    const a = r.axis ? axisOf(r.axis) : null;
    const head = recHead(r);
    const sub = [r.why, r.fix].map(x => String(x || '').trim()).filter(Boolean).join(' · ');
    return '<label class="dmn-r' + (st.pick[i] ? ' on' : '') + '">'
      + '<input type="checkbox"' + (st.pick[i] ? ' checked' : '') + ' '
        + 'onchange="docMinePick(\'' + did + '\',' + i + ', this.checked)">'
      + '<span class="bd">'
        + '<span class="dt">'
          + '<b>' + esc(r.date || '날짜 없음') + '</b>'
          + '<span class="kd">' + K.ic + ' ' + esc(K.nm) + '</span>'
          + (a ? '<span class="ax">' + a.icon + ' ' + esc(a.name) + '</span>' : '')
          + (r.docAt ? '<span class="at">' + esc(r.docAt) + '</span>' : '')
          + (r.guess ? '<span class="gs">추정</span>' : '')
        + '</span>'
        + '<span class="ti">' + esc(head || '(빈 마디)') + '</span>'
        + (sub ? '<span class="sc">' + esc(sub) + '</span>' : '')
      + '</span></label>';
  }).join('');

  return '<div class="dmn">'
    + '<div class="dmn-hd">🤖 이 문서에서 읽어냈습니다'
      + '<span>넣을 것만 골라 주세요. 넣은 뒤에도 브랜드 화면에서 고칠 수 있습니다</span></div>'
    + docMineNowHtml(b, st, bid, did)
    + (st.rows.length
        ? '<div class="dmn-sub">📜 연혁 마디 ' + st.rows.length + '건</div>'
          + '<div class="dmn-bar">'
            + '<button class="btn sm" onclick="docMineAll(\'' + did + '\',1)">모두 고르기</button>'
            + '<button class="btn sm" onclick="docMineAll(\'' + did + '\',0)">모두 풀기</button>'
            + '<span class="hint">' + on + ' / ' + st.rows.length + '건</span>'
          + '</div>'
          + '<div class="dmn-list">' + rows + '</div>'
        : '<div class="dmn-sub">📜 연혁으로 옮길 마디는 못 찾았습니다</div>')
    + '<div class="dmn-ac">'
      + '<button class="btn primary"' + (on + nowOn ? '' : ' disabled')
        + ' onclick="docMineAdd(\'' + bid + '\',\'' + did + '\')">'
        + (on ? '라인에 ' + on + '건' : '')
        + (on && nowOn ? ' · ' : '')
        + (nowOn ? '지금 ' + nowOn + '칸' : '')
        + ' 넣기</button>'
      + '<button class="btn sm" onclick="docMineClose(\'' + did + '\')">닫기</button>'
    + '</div></div>';

/* 「지금」 제안 — 이미 적힌 칸은 꺼 두고, 무엇이 바뀌는지 보여줍니다 */
function docMineNowHtml(b, st, bid, did){
  const bk = bookOf(b);
  const cur = String(histOf(b).now || '').trim();
  const keys = Object.keys(st.now || {});
  if(!st.line && !keys.length) return '';

  const one = (id, label, before, after, on, fn) =>
    '<label class="dmn-n' + (on ? ' on' : '') + (before ? ' over' : '') + '">'
    + '<input type="checkbox"' + (on ? ' checked' : '') + ' onchange="' + fn + '">'
    + '<span class="bd">'
      + '<span class="lb">' + esc(label)
        + (before ? '<em>이미 적혀 있습니다 — 켜면 이 글로 바뀝니다</em>' : '') + '</span>'
      + (before ? '<span class="be">' + esc(gbOneLine(before, 120)) + '</span>' : '')

function docMineClose(id){ delete docMineState[id]; render(); }
function docMineLine(id, on){ const st = docMineState[id]; if(st){ st.lineOn = !!on; render(); } }
function docMineNowPick(id, k, on){
  const st = docMineState[id]; if(!st) return;
  st.nowPick[k] = !!on; render();
}
function docMinePick(id, i, on){
  const st = docMineState[id]; if(!st) return;
  st.pick[i] = !!on; render();
}
function docMineAll(id, on){
  const st = docMineState[id]; if(!st) return;
  st.rows.forEach((r, i) => { st.pick[i] = !!on; });
  render();
}

async function docMine(bid, id){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const d = docFind(b, id); if(!d) return;
  const v = docTop(d);
  if(!v || !v.filePath){
    alert('이 문서의 파일 자리를 알 수 없습니다. 다시 올려 주세요.');
    return;
  }
  docMineState[id] = { busy:true, step:'문서에서 글자를 뽑는 중…', err:'',
                       rows:[], pick:{}, line:'', lineOn:false, now:{}, nowPick:{} };
  render();
  try{
    const t = await apiJson('doctext.php?action=one&path=' + encodeURIComponent(v.filePath));
    const txt = String(t['글자'] || '').trim();
    if(!txt) throw new Error('이 문서에서 글자를 뽑지 못했습니다.');

    docMineState[id].step = 'AI 가 연혁 마디로 정리하는 중…';
    render();

    const out = await apiJson('ai.php?action=prompt', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ kind:'hist', brand: b.name, book: txt })
    });
    const got = docMineParse(out['프롬프트'] || '');
    const st  = docMineState[id];
    st.busy = false; st.rows = got.rows; st.pick = {};
    got.rows.forEach((r, i) => { st.pick[i] = true; });

    // 「지금」 칸 — 지금 비어 있는 칸만 처음부터 골라 둡니다.
    // 이미 적힌 칸은 덮어쓰면 안 되니 꺼 둡니다 (직접 켜면 바뀝니다)
    const bk = bookOf(b);
    st.line   = got.line;
    st.lineOn = !!got.line && !String(histOf(b).now || '').trim();
    st.now    = got.now;
    st.nowPick = {};
    Object.keys(got.now).forEach(k => {
      st.nowPick[k] = !String(bk[k] || '').trim();
    });
    render();
  }catch(e){
    docMineState[id] = { busy:false, err: apiErrText(e), rows:[], pick:{},
                         line:'', lineOn:false, now:{}, nowPick:{} };
    render();
  }
}

/* AI 가 앞뒤에 말을 붙여도 JSON 만 골라냅니다 */
function docMineParse(text){
  let t = String(text || '').trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  let j = null;
  try{ j = JSON.parse(t); }catch(e){
    const a = t.indexOf('{'), z = t.lastIndexOf('}');
    if(a >= 0 && z > a){ try{ j = JSON.parse(t.slice(a, z + 1)); }catch(e2){} }
  }
  const arr = (j && (j['마디'] || j.records || j.rows)) || (Array.isArray(j) ? j : []);
  const KIND = REC_KINDS.map(k => k.k);
  const AX   = BRAND_AXES.map(a => a.key);

  const rows = (Array.isArray(arr) ? arr : []).map(x => {
    const o = {};
    ['date','title','body','before','after','why','fix','docAt'].forEach(k => {
      o[k] = String((x && x[k]) || '').trim();
    });
    o.kind  = KIND.indexOf(String((x && x.kind) || '')) >= 0 ? x.kind : '사건';
    o.axis  = AX.indexOf(String((x && x.axis) || '')) >= 0 ? x.axis : '';
    o.guess = !!(x && x.guess);
    return o;
  }).filter(r => recHead(r));       // 아무 내용도 없는 것은 버립니다

  // 「지금」 칸 — 축에 실제로 있는 열쇠만 받습니다
  const keys = [];
  BRAND_AXES.forEach(a => a.now.forEach(f => keys.push(f[0])));
  const src = (j && (j['지금'] || j.now)) || {};
  const now = {};
  keys.forEach(k => {
    const v = String((src && src[k]) || '').trim();
    if(v) now[k] = v;
  });
  return { line: String((j && (j['한줄'] || j.line)) || '').trim(), now: now, rows: rows };
}

function docMineAdd(bid, id){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const st = docMineState[id]; if(!st) return;
  const recs = recsOf(b);
  let n = 0, m = 0;
  st.rows.forEach((r, i) => {
    if(!st.pick[i]) return;
    recs.push(Object.assign({ id: uid('hx') }, r, { docId: id }));
    n++;
  });
  if(st.lineOn && st.line){ histOf(b).now = st.line; m++; }
  const bk = bookOf(b);
  Object.keys(st.now || {}).forEach(k => {
    if(!st.nowPick[k]) return;
    bk[k] = st.now[k]; m++;
  });
  if(m) b.bookUpdatedAt = new Date().toISOString();
  delete docMineState[id];
  markDirty(b.id);
  brandRead = true;                      // 넣은 결과를 바로 읽게 합니다
  setHistTab('line');
  toast('✅ ' + (n ? '라인 ' + n + '건' : '')
    + (n && m ? ' · ' : '') + (m ? '지금 ' + m + '칸' : '') + ' 넣었습니다');
}

/* 예전 자료(연표·바뀐 것·폐기 표현·실패)를 라인 위로 한 번만 옮깁니다.
   원본 목록은 지우지 않고 그대로 둡니다 — 되돌릴 수 있게. */
function recsOf(b){
  const h = histOf(b);
  if(!Array.isArray(h.recs)) h.recs = [];
  if(!h.v2){
    // 「제안서 2025.04.03」 처럼 출처에만 날짜가 있으면 그것을 라인 날짜로 씁니다
    const dateIn = t => {
      const m = String(t || '').match(/(19|20)\d{2}([.\-\/]\d{1,2}){0,2}/);
      return m ? m[0].replace(/[\-\/]/g, '.') : '';
    };
    const add = o => h.recs.push(Object.assign({ id: uid('hx') },
      o, { date: o.date || dateIn(o.src) }));
    h.events.forEach(e => add({ date:e.date || '', axis:'',
      kind: e.kind === '자료 없음 구간' ? '자료 없음' : '사건',
      title:e.title, body:e.body, src:e.src, guess:e.guess }));
    h.shifts.forEach(x => add({ date:'', kind:'바뀐 것',
      axis: AXIS_OLD[x.axis] || x.axis || 'what',
      before:x.before, after:x.after, why:x.why, src:x.src, guess:x.guess }));
    h.words.forEach(w => add({ date:'', kind:'폐기 표현', axis:'say',
      before:w.old, after:w.now, why:w.why, src:w.src }));
    h.fails.forEach(f => add({ date:'', kind:'실패', axis:'keep',
      title:f.title, body:f.bad, before:f.what, why:f.why, fix:f.fix, src:f.src }));
    h.v2 = 1;
  }
  return h.recs;
}
/* 날짜를 숫자로 — 2025.04.03 · 2023 상반기 · 2022 모두 받습니다 */
function recKey(r){
  // 「2023 ~ 2025.03」 같은 구간은 시작 연도로 봅니다 (물결 뒤 숫자는 안 씁니다)
  const m = String(r.date || '')
    .match(/(?:19|20)\d{2}(?:[.\-\/]\d{1,2})?(?:[.\-\/]\d{1,2})?/);
  if(!m) return -1;                                  // 날짜 미상은 맨 아래로
  const p = m[0].split(/[.\-\/]/).map(Number);
  return (p[0] || 0) * 10000 + (p[1] || 0) * 100 + (p[2] || 0);
}
function recYear(r){
  const m = String(r.date || '').match(/\d{4}/);
  return m ? m[0] : '';
}
/* 접힌 마디에 보이는 한 줄 */
function recHead(r){
  if(r.kind === '바뀐 것' || r.kind === '폐기 표현'){
    const a = String(r.before || '').trim(), c = String(r.after || '').trim();
    if(a || c) return a + (c ? '  →  ' + c : '');
  }
  return String(r.title || r.body || '').trim();
}
function recAxis(r){ return r.axis ? axisOf(r.axis) : null; }

/* ── 📷 마디에 붙이는 사진 ───────────────────────────────────────
   연혁은 글만으로는 안 읽힙니다. 그 때 무엇이 어떻게 보였는지가
   가장 확실한 증거라, 마디마다 사진을 함께 답니다.
   파일은 공유폴더 <브랜드>/05_연혁 에 그대로 쌓입니다.
   ------------------------------------------------------------- */
function recImgs(r){ if(!Array.isArray(r.imgs)) r.imgs = []; return r.imgs; }
let recImgTo = null;    // {bid, rid}

function pickRecImg(bid, rid){
  recImgTo = { bid: bid, rid: rid };
  const el = document.getElementById('recImgInput');
  if(el) el.click();
}
async function uploadRecImg(fileList){
  const files = Array.from(fileList || []);
  const to = recImgTo; recImgTo = null;
  if(!files.length || !to) return;
  const b = brandById(to.bid) || currentBrand(); if(!b) return;
  const r = recsOf(b).find(x => x.id === to.rid); if(!r) return;

  for(const f of files){
    toast('📷 "' + f.name + '" 올리는 중…');
    try{
      const fd = new FormData();
      fd.append('brand', b.name);
      fd.append('sub', '연혁');
      fd.append('file', f);
      const res  = await fetch('files.php?action=upload', { method:'POST', body: fd });
      const text = await res.text();
      let out = null;
      try{ out = JSON.parse(text); }catch(e){}
      if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ') → '
        + text.slice(0, 200).replace(/\s+/g, ' '));
      if(!out.ok) throw new Error(out.error || '올리지 못했습니다');
      recImgs(r).push({ id: uid('ri'), name: out.fileName, size: out.fileSize,
                        filePath: out.filePath || '', mime: out.mime || '' });
    }catch(e){
      alert('"' + f.name + '" 을 올리지 못했습니다.\n\n' + (e.message || e));
    }
  }
  markDirty(b.id);
  await saveAll(true);
  render();
  toast('✅ 사진을 붙였습니다');
}
function recImgDel(bid, rid, fid){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const r = recsOf(b).find(x => x.id === rid); if(!r) return;
  if(!confirm('이 사진을 마디에서 뺄까요?\n\nNAS 의 파일은 그대로 남습니다.')) return;
  r.imgs = recImgs(r).filter(f => f.id !== fid);
  markDirty(b.id); render();
}

function recAdd(bid, kind){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const r = { id: uid('hx'), kind: kind || '사건', date:'', axis: lineAxis || '' };
  recsOf(b).push(r);
  lineOpen = r.id; markDirty(b.id); render();
}
function recDel(bid, id){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  if(!confirm('이 마디를 지웁니다. 되돌릴 수 없습니다.')) return;
  const h = histOf(b);
  h.recs = recsOf(b).filter(x => x.id !== id);
  deletedIds.add(id);          // 합칠 때 남의 저장본에서 되살아나지 않게
  if(lineOpen === id) lineOpen = '';
  markDirty(b.id); render();
}
function recEdit(bid, id, field, v, draw){
  const b = brandById(bid) || currentBrand(); if(!b) return;
  const r = recsOf(b).find(x => x.id === id); if(!r) return;
  r[field] = v;
  markDirty(b.id);
  if(draw) render();
}

/* ── 📖 읽기 — 이 브랜드의 서사 ──────────────────────────────────
   신입이 브랜드를 처음 열었을 때 이 화면만 읽으면 되게 합니다.
   축마다 「지금 이렇다」 다음에 「이렇게 됐다」 가 이어집니다.
   빈 곳은 숨기지 않고 「아직 없습니다」 라고 그대로 둡니다 —
   무엇이 비어 있는지가 신입에게는 가장 중요한 정보입니다.
   ------------------------------------------------------------- */
function brandStoryHtml(b){
  const h    = histOf(b);
  const bk   = bookOf(b);
  const recs = recsOf(b);
  const line = String(h.now || '').trim();

  const filled = BRAND_AXES.reduce((n, a) =>
    n + a.now.filter(f => String(bk[f[0]] || '').trim()).length, 0);
  const total  = BRAND_AXES.reduce((n, a) => n + a.now.length, 0);

  const top = '<div class="st-top">'
    + '<div class="st-name">' + esc(b.icon || '🏷️') + ' ' + esc(b.name) + '</div>'
    + (line
        ? '<div class="st-line">' + esc(line) + '</div>'
        : '<div class="st-line no">한 줄 정의가 아직 없습니다 — '
          + '[✏️ 고치기] 에서 첫 문장을 채워 주세요</div>')
    + '<div class="st-meta">지금 ' + filled + '/' + total + '칸 · 연혁 '
      + recs.length + '마디 · 기획서 ' + docList(b).length + '장</div>'
    + '</div>';

  const none = (!line && !filled && !recs.length)
    ? '<div class="st-none">이 브랜드는 아직 아무것도 적혀 있지 않습니다.<br>'
      + '<span>[✏️ 고치기] 에서 한 줄 정의부터 채우거나, '
      + '[📋 기획서] 에 문서를 올리고 [🤖 라인으로 뽑기] 를 눌러 보세요.</span></div>'
    : '';

  if(storyBy === 'year')
    return '<div class="story">' + top + none + storyYearHtml(b) + '</div>';

  const secs = BRAND_AXES.map(a => {
    const vals = a.now.map(f => [f[1], String(bk[f[0]] || '').trim()]);
    const has  = vals.some(v => v[1]);
    const mine = recs.filter(r => r.axis === a.key)
                     .sort((x, y) => recKey(x) - recKey(y));
    return '<section class="st-sec' + (has || mine.length ? '' : ' thin') + '">'
      + '<h3><span class="ic">' + a.icon + '</span>' + a.no + '. ' + esc(a.name) + '</h3>'
      + '<div class="st-now">'
        + vals.map(v => '<div class="st-f">'
            + '<div class="lb">' + esc(v[0]) + '</div>'
            + (v[1] ? '<p>' + esc(v[1]) + '</p>'
                    : '<p class="no">아직 없습니다</p>') + '</div>').join('')
      + '</div>'
      + (mine.length
          ? '<div class="st-past"><div class="hd">여기까지 온 길</div>'
            + mine.map(r => storyRecHtml(b, r)).join('') + '</div>'
          : '')
      + '</section>';
  }).join('');

  const rest = recs.filter(r => !r.axis).sort((x, y) => recKey(x) - recKey(y));
  const restHtml = rest.length
    ? '<section class="st-sec"><h3><span class="ic">📅</span>그 밖에 있었던 일</h3>'
      + '<div class="st-past">' + rest.map(r => storyRecHtml(b, r)).join('') + '</div>'
      + '</section>'
    : '';

  return '<div class="story">' + top + none + secs + restHtml + '</div>';
}

/* 연도로 읽기 — 오래된 해부터 차례로. 그 해에 무슨 일이 있었는지 */
function storyYearHtml(b){
  const rows = recsOf(b).slice().sort((x, y) => recKey(x) - recKey(y));
  if(!rows.length){
    return '<div class="st-none">아직 연혁 마디가 없습니다.<br>'
      + '<span>[✏️ 고치기] 에서 한 건씩 남기거나, [📋 기획서] 에 문서를 올리고 '
      + '[🤖 라인으로 뽑기] 를 눌러 보세요.</span></div>';
  }
  let out = '', year = null;
  rows.forEach(r => {
    const y = recYear(r) || '날짜 확인 필요';
    if(y !== year){
      if(year !== null) out += '</div></section>';
      year = y;
      const n = rows.filter(x => (recYear(x) || '날짜 확인 필요') === y).length;
      out += '<section class="st-yr"><h3>' + esc(y)
        + '<span>' + n + '건</span></h3><div class="bd">';
    }
    out += storyRecHtml(b, r, 1);
  });
  out += '</div></section>';
  return out;
}

/* 서사 안의 마디 한 줄 — 읽으라고 만든 모양입니다 (고치는 칸이 아닙니다) */
function storyRecHtml(b, r, withAxis){
  const K  = recKindOf(r);
  const dc = r.docId ? docFind(b, r.docId) : null;
  const bits = [];
  if(r.kind === '바뀐 것' || r.kind === '폐기 표현'){
    const x = String(r.before || '').trim(), y = String(r.after || '').trim();
    if(x || y) bits.push('<b>' + esc(x) + '</b>' + (y ? ' → <b>' + esc(y) + '</b>' : ''));
  }else{
    const t = String(r.title || '').trim();
    if(t) bits.push('<b>' + esc(t) + '</b>');
    const y = String(r.body || '').trim();
    if(y) bits.push(esc(y));
  }
  const tail = [];
  if(String(r.why || '').trim()) tail.push('왜 — ' + r.why.trim());
  if(String(r.fix || '').trim()) tail.push('그래서 — ' + r.fix.trim());
  const src = [];
  if(dc) src.push('📄 ' + (dc.title || '문서') + (r.docAt ? ' · ' + r.docAt : ''));
  if(String(r.src || '').trim()) src.push(r.src.trim());

  const a  = recAxis(r);
  const fs = recImgs(r);
  return '<div class="st-r ' + K.cls + '">'
    + '<div class="dt"><span class="d">' + esc(r.date || '날짜 확인 필요') + '</span>'
      + '<span class="kd">' + K.ic + ' ' + esc(K.nm) + '</span>'
      + (withAxis && a ? '<span class="ax">' + a.icon + ' ' + esc(a.name) + '</span>' : '')
      + (r.guess ? '<span class="gs">추정</span>' : '') + '</div>'
    + (bits.length ? '<p>' + bits.join('<br>') + '</p>' : '')
    + (tail.length ? '<p class="wy">' + esc(tail.join(' · ')) + '</p>' : '')
    + (fs.length
        ? '<div class="st-ph">' + fs.map(f => '<a href="' + esc(cardFull(f)) + '" '
            + 'target="_blank" rel="noopener">'
            + (cardIsImg(f)
                ? '<img loading="lazy" src="' + esc(cardThumb(f, 520)) + '" alt="">'
                : '<span class="file">📄 ' + esc(f.name || '') + '</span>')
            + '</a>').join('') + '</div>'
        : '')
    + (src.length  ? '<p class="sc">' + esc(src.join(' · ')) + '</p>' : '')
    + '</div>';
}

/* 라인 본체 — 연도 마디를 지나 아래로 흐릅니다 */
function lineBodyHtml(b){
  const bid = jsq(b.id);
  let rows = recsOf(b).slice();
  if(lineAxis) rows = rows.filter(r => r.axis === lineAxis);
  rows.sort((x, y) => lineOld ? recKey(x) - recKey(y) : recKey(y) - recKey(x));

  let out = '', year = null;
  rows.forEach(r => {
    const y = recYear(r) || '날짜 확인 필요';
    if(y !== year){ year = y; out += '<div class="hl-y">' + esc(y) + '</div>'; }
    out += lineItemHtml(b, r);
  });

  const add = '<div class="hl-add">'
    + REC_KINDS.map(k => '<button class="gb-add tiny" '
        + 'onclick="recAdd(\'' + bid + '\',\'' + k.k + '\')">'
        + k.ic + ' ' + esc(k.nm) + '</button>').join('')
    + '</div>';
