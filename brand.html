/* 표를 칸 배열로 / 다시 글로 */
function wbGrid(n){
  const rows = String(n.text || '').split('\n');
  const g = rows.map(r => r.split('|').map(c => c.trim()));
  const w = Math.max(1, ...g.map(r => r.length));
  g.forEach(r => { while(r.length < w) r.push(''); });
  return g.length ? g : [['']];
}
function wbGridWrite(n, g){
  n.text = g.map(r => r.join(' | ')).join('\n');
  const b = wbCur(); if(b) b.updatedAt = new Date().toISOString();
  markDirtyAll();
}
function wbCellSet(id, r, c, v){
  const n = wbNode(id); if(!n) return;
  const g = wbGrid(n);
  if(!g[r]) return;
  g[r][c] = String(v).replace(/[|\n]/g, ' ');   // | 와 줄바꿈은 칸을 깨뜨립니다
  wbGridWrite(n, g);
}
function wbRowAdd(id){
  const n = wbNode(id); if(!n) return;
  const g = wbGrid(n);
  g.push(new Array(g[0].length).fill(''));
  wbGridWrite(n, g);
  n.h = Math.min(600, n.h + 30);
  render();
}
function wbRowDel(id){
  const n = wbNode(id); if(!n) return;
  const g = wbGrid(n);
  if(g.length <= 1){ toast('⚠️ 마지막 줄은 지울 수 없습니다'); return; }
  g.pop();
  wbGridWrite(n, g);
  n.h = Math.max(60, n.h - 30);
  render();
}
function wbColAdd(id){
  const n = wbNode(id); if(!n) return;
  const g = wbGrid(n);
  if(g[0].length >= 8){ toast('⚠️ 칸은 8개까지입니다'); return; }
  g.forEach(r => r.push(''));
  wbGridWrite(n, g);
  n.w = Math.min(900, n.w + 90);
  render();
}
function wbColDel(id){
  const n = wbNode(id); if(!n) return;
  const g = wbGrid(n);
  if(g[0].length <= 1){ toast('⚠️ 마지막 칸은 지울 수 없습니다'); return; }
  g.forEach(r => r.pop());
  wbGridWrite(n, g);
  n.w = Math.max(120, n.w - 90);
  render();
}

/* 판에 붙인 사진·영상은 **공유폴더에 넣지 않습니다.**
   대시보드 자기 자리(data/board-media)에 두기 때문에 탐색기나
   NAS 자료 목록에는 나오지 않습니다. 이름은 32자리 무작위이고,
   꺼내 보는 것도 로그인을 지납니다.

   공유자료 파일에 그림을 통째로 넣는 방법은 쓰지 않습니다 —
   그러면 팀원이 화면을 열 때마다 그 용량을 다 내려받게 됩니다. */
const WB_MEDIA_MAX = 60 * 1024 * 1024;      // 한 개 60MB 까지

function wbIsVideo(m){ return /^video\//.test(String(m || '')); }
function wbMediaSrc(n){
  return 'files.php?action=bmview&id=' + encodeURIComponent(n.path || '');
}

/* 파일 하나를 올려 판에 붙일 모양으로 돌려줍니다 */
async function wbPutMedia(file){
  if(STORAGE_MODE !== 'nas'){
    toast('⚠️ 사진·영상은 NAS 주소로 열었을 때만 붙일 수 있습니다');
    return null;
  }
  if(file.size > WB_MEDIA_MAX){
    toast('⚠️ ' + file.name + ' 은 너무 큽니다 (한 개 60MB까지)');
    return null;
  }
  const fd = new FormData();
  fd.append('file', file, file.name);
  const r = await fetch('files.php?action=bmupload', { method:'POST', body: fd });
  const o = JSON.parse(await r.text());
  if(!o.ok) throw new Error(o.error || '올리지 못했습니다');
  return { path: o.id, name: o['이름'] || file.name,
           mime: o.mime || file.type || '', size: o['크기'] || file.size };
}

/* 그림의 진짜 크기를 재서 판에 알맞게 놓습니다 (찌그러지지 않게) */
function wbFitSize(file){
  return new Promise(res => {
    if(!/^image\//.test(file.type || '')) return res(null);
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const max = 360;
      const k = Math.min(max / im.naturalWidth, max / im.naturalHeight, 1);
      res({ w: Math.max(90, Math.round(im.naturalWidth * k)),
            h: Math.max(60, Math.round(im.naturalHeight * k)) });
    };
    im.onerror = () => { URL.revokeObjectURL(url); res(null); };
    im.src = url;
  });
}

/* 판에 사진·영상을 붙입니다 (창에서 고르거나, 끌어다 놓거나) */
async function wbAddMedia(files, at){
  const b = wbCur(); if(!b) return;
  const list = [...(files || [])].filter(f =>
    /^(image|video)\//.test(f.type || '') || /\.(jpe?g|png|gif|webp|bmp|heic|mp4|mov|webm)$/i.test(f.name));
  if(!list.length){ toast('⚠️ 사진이나 영상만 붙일 수 있습니다'); return; }

  const wrap = document.getElementById('wbWrap');
  const cw = wrap ? wrap.clientWidth  : 900;
  const ch = wrap ? wrap.clientHeight : 520;
  let x = at ? at.x : Math.round((-wbView.x + cw / 2) / wbView.z - 150);
  let y = at ? at.y : Math.round((-wbView.y + ch / 2) / wbView.z - 100);

  toast('⬆ ' + list.length + '개 올리는 중…');
  const failed = [];
  for(const f of list){
    try{
      const size = await wbFitSize(f);
      const m = await wbPutMedia(f);
      if(!m) continue;
      b.nodes.push(Object.assign({
        id: uid('wn'), kind:'media',
        x: Math.max(0, x), y: Math.max(0, y),
        w: size ? size.w : 300, h: size ? size.h : 200,
        color:'dark', text:''
      }, m));
      x += 26; y += 26;
    }catch(e){ failed.push(f.name + ' — ' + (e.message || e)); }
  }
  b.updatedAt = new Date().toISOString();
  markDirtyAll(); render();
  if(failed.length) alert('붙이지 못한 것:\n\n' + failed.join('\n'));
  else toast('🖼 ' + list.length + '개를 판에 붙였습니다');
}

/* 컴퓨터에서 사진·영상을 끌어다 놓으면 그 자리에 붙습니다 */
function wbDropAllow(ev){
  if(!ev.dataTransfer || [...(ev.dataTransfer.types || [])].indexOf('Files') < 0) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'copy';
  ev.currentTarget.classList.add('dragover');
}
function wbDropLeave(ev){ ev.currentTarget.classList.remove('dragover'); }
async function wbDropMedia(ev){
  ev.currentTarget.classList.remove('dragover');
  const fs = ev.dataTransfer ? ev.dataTransfer.files : null;
  if(!fs || !fs.length) return;
  ev.preventDefault(); ev.stopPropagation();
  const wrap = document.getElementById('wbWrap');
  const r = wrap.getBoundingClientRect();
  await wbAddMedia(fs, {
    x: Math.round((ev.clientX - r.left - wbView.x) / wbView.z - 150),
    y: Math.round((ev.clientY - r.top  - wbView.y) / wbView.z - 100)
  });
}

/* 아무 판에도 안 붙은 사진·영상을 서버에서 치웁니다.
   「지금 쓰는 것」 목록을 보내야만 서버가 지웁니다 (실수로 다 날리지 않게).
   방금 올린 것(1시간 이내)은 서버가 건드리지 않습니다. */
async function wbSweepMedia(){
  if(STORAGE_MODE !== 'nas') return;
  if(!Array.isArray(data.boards)) return;          // 아직 안 불러왔으면 손대지 않습니다
  const keep = [];
  data.boards.forEach(b => (b.nodes || []).forEach(n => {
    if(n.kind === 'media' && n.path) keep.push(n.path);
  }));
  try{
    await apiJson('files.php?action=bmsweep', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ keep: keep })
    });
  }catch(e){ /* 곁다리라 조용히 */ }
}

/* 창에서 고르기 */
function wbPickMedia(){
  const el = document.getElementById('wbMediaInput');
  if(!el) return;
  el.value = '';
  el.click();
}
async function onWbMedia(input){
  const files = [...(input.files || [])];    // 먼저 베껴둡니다 (value 를 비우면 사라집니다)
  input.value = '';
  if(files.length) await wbAddMedia(files);
}

let wbId    = '';            // 지금 보고 있는 판
let wbSel   = '';            // 고른 개체
let wbEdit  = '';            // 글을 고치고 있는 개체
let wbLink  = null;          // 잇는 중 {from}
let wbDrag  = null;          // 끄는 중 (이때는 다시 그리지 않습니다)
let wbView  = { x: 0, y: 0, z: 1 };

function wbBoards(){ if(!Array.isArray(data.boards)) data.boards = []; return data.boards; }
function wbCur(){ return wbBoards().find(b => b.id === wbId) || null; }
function wbNode(id){ const b = wbCur(); return b ? (b.nodes || []).find(n => n.id === id) : null; }

function wbRename(){
  const b = wbCur(); if(!b) return;
  const v = prompt('판 이름', b.name || '');
  if(v === null) return;
  b.name = v.trim() || '이름 없는 판';
  b.updatedAt = new Date().toISOString();
  markDirtyAll(); render();
}

function wbDel(id){
  const b = wbBoards().find(x => x.id === id); if(!b) return;
  const n = (b.nodes || []).length;
  if(!confirm('"' + (b.name || '이름 없는 판') + '" 판을 지울까요?'
    + (n ? '\n\n안에 놓은 ' + n + '개도 같이 갑니다.' : '')
    + '\n\n휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 되돌릴 수 있습니다.')) return;
  trashPut('화이트보드', b.name || '이름 없는 판', b, { kind:'board' });
  data.boards = wbBoards().filter(x => x.id !== id);
  if(wbId === id) wbId = '';
  gbWb = null;                          // 판이 없어졌으니 그로스보드로 돌아옵니다
  // 이 판을 가리키던 자리도 비웁니다 (없는 판을 계속 가리키지 않게)
  (data.growth || []).forEach(g => {
    if(g.wbId === id) delete g.wbId;
    (g.stages || []).forEach(st => (st.items || []).forEach(it => {
      if(it.wbId === id) delete it.wbId;
    }));
  });
  markDirtyAll(); render();
  toast('🗑️ 휴지통으로 보냈습니다');
  setTimeout(wbSweepMedia, 1200);
}

/* ── 개체 ───────────────────────────────────────────────────── */
function wbAdd(kind, preset){
  const b = wbCur(); if(!b) return;
  const k = Object.assign({}, WB_KINDS[kind] || WB_KINDS.note, preset || {});
  // 지금 보고 있는 화면 한가운데에 놓습니다
  const wrap = document.getElementById('wbWrap');
  const cw = wrap ? wrap.clientWidth  : 900;
  const ch = wrap ? wrap.clientHeight : 520;
  let x = Math.max(20, Math.round((-wbView.x + cw / 2) / wbView.z - k.w / 2));
  let y = Math.max(20, Math.round((-wbView.y + ch / 2) / wbView.z - k.h / 2));
  // 이미 놓인 것 위에 겹쳐 놓지 않습니다 — 빈 자리를 찾을 때까지 비켜갑니다
  const hit = (px, py) => (b.nodes || []).some(o =>
    px < o.x + o.w && px + k.w > o.x && py < o.y + o.h && py + k.h > o.y);
  for(let i = 0; i < 40 && hit(x, y); i++){ x += 30; y += 30; }

  const n = { id: uid('wn'), kind: kind, x: x, y: y,
              w: k.w, h: k.h, color: kind === 'note' ? 'yellow' : 'gray',
              text: (preset && preset.text != null) ? preset.text
                  : (kind === 'table' ? '항목 | 내용\n | ' : '') };
  b.nodes = b.nodes || [];
  b.nodes.push(n);
  b.updatedAt = new Date().toISOString();
  wbSel = n.id;
  // 표는 칸을 바로 고치므로 글 고치기 칸을 띄우지 않습니다
  wbEdit = (kind === 'table') ? '' : n.id;
  markDirtyAll(); render();
  if(wbEdit){
    setTimeout(() => { const el = document.getElementById('wbt_' + n.id); if(el) el.focus(); }, 30);
  }else{
    setTimeout(() => {
      const el = document.querySelector('#wbn_' + n.id + ' .wb-tb input');
      if(el) el.focus();
    }, 30);
  }
}
let wbMoved = false;      // 방금 끌었나 (끝나고 오는 click 을 흘려보내려고)
let wbMany = [];          // 여러 개 고른 것 (id 목록)
let wbMarq = null;        // 끌어서 감싸는 중 {x1,y1,x2,y2}

function wbInMany(id){ return wbMany.indexOf(id) >= 0; }
function wbToggleMany(id){
  const i = wbMany.indexOf(id);
  if(i >= 0) wbMany.splice(i, 1); else wbMany.push(id);
  wbSel = ''; wbEdit = '';
  render();
}
function wbSelectAll(){
  const b = wbCur(); if(!b) return;
  wbMany = (b.nodes || []).map(n => n.id);
  wbSel = ''; wbEdit = '';
  render();
}
/* 고른 것들을 감싸는 네모 */
function wbManyBox(){
  const b = wbCur(); if(!b) return null;
  const ns = (b.nodes || []).filter(n => wbInMany(n.id));
  if(!ns.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  ns.forEach(n => {
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h);
  });
  return { x1, y1, x2, y2, ns };
}

/* ── 줄 맞추기 ─────────────────────────────────────────────── */
function wbAlign(how){
  const box = wbManyBox(); if(!box || box.ns.length < 2) return;
  const ns = box.ns;
  if(how === 'left')   ns.forEach(n => { n.x = box.x1; });
  if(how === 'right')  ns.forEach(n => { n.x = box.x2 - n.w; });
  if(how === 'cx')     ns.forEach(n => { n.x = Math.round((box.x1 + box.x2) / 2 - n.w / 2); });
  if(how === 'top')    ns.forEach(n => { n.y = box.y1; });
  if(how === 'bottom') ns.forEach(n => { n.y = box.y2 - n.h; });
  if(how === 'cy')     ns.forEach(n => { n.y = Math.round((box.y1 + box.y2) / 2 - n.h / 2); });
  if(how === 'row'){                       // 가로로 고르게 벌리기
    const sorted = ns.slice().sort((a, b2) => a.x - b2.x);
    const gap = 24;
    let x = sorted[0].x;
    sorted.forEach(n => { n.x = Math.round(x); x += n.w + gap; });
  }
  if(how === 'col'){                       // 세로로 고르게 벌리기
    const sorted = ns.slice().sort((a, b2) => a.y - b2.y);
    const gap = 18;
    let y = sorted[0].y;
    sorted.forEach(n => { n.y = Math.round(y); y += n.h + gap; });
  }
  const b = wbCur(); if(b) b.updatedAt = new Date().toISOString();
  markDirtyAll(); render();
}
function wbManyColor(key){
  const box = wbManyBox(); if(!box) return;
  box.ns.forEach(n => { if(n.kind !== 'media') n.color = key; });
  markDirtyAll(); render();
}
function wbManyDel(){
  const b = wbCur(); const box = wbManyBox();
  if(!b || !box) return;
  if(!confirm('고른 ' + box.ns.length + '개를 지울까요?')) return;
  const ids = {};
  box.ns.forEach(n => { ids[n.id] = 1; });
  const hadMedia = box.ns.some(n => n.kind === 'media');
  b.nodes = (b.nodes || []).filter(n => !ids[n.id]);
  b.edges = (b.edges || []).filter(e => !ids[e.from] && !ids[e.to]);
  b.updatedAt = new Date().toISOString();
  wbMany = [];
  markDirtyAll(); render();
  if(hadMedia) setTimeout(wbSweepMedia, 1200);
}
function wbManyCopy(){
  const b = wbCur(); const box = wbManyBox();
  if(!b || !box) return;
  const made = [];
  box.ns.forEach(n => {
    const c = Object.assign({}, n, { id: uid('wn'), x: n.x + 28, y: n.y + 28 });
    b.nodes.push(c); made.push(c.id);
  });
  wbMany = made;
  markDirtyAll(); render();
}

/* 고른 것들 위에 뜨는 줄 */
function wbManyBar(){
  const box = wbManyBox();
  if(!box || box.ns.length < 2) return '';
  const btn = (how, label, tip) => '<button onclick="event.stopPropagation();wbAlign(\''
    + how + '\')" title="' + tip + '">' + label + '</button>';
  return '<div class="wb-many" onpointerdown="event.stopPropagation()" '
    + 'onclick="event.stopPropagation()">'
    + '<b>' + box.ns.length + '개</b>'
    + btn('left', '⇤', '왼쪽 맞춤') + btn('cx', '↔', '가로 가운데')
    + btn('right', '⇥', '오른쪽 맞춤')
    + '<span class="sep"></span>'
    + btn('top', '⇡', '위 맞춤') + btn('cy', '↕', '세로 가운데')
    + btn('bottom', '⇣', '아래 맞춤')
    + '<span class="sep"></span>'
    + btn('row', '▤', '가로로 고르게 벌리기') + btn('col', '▥', '세로로 고르게 벌리기')
    + '<span class="sep"></span>'
    + WB_HUES.map(c => '<button class="sw" style="background:' + c.bg + '" '
        + 'title="' + c.label + '으로" '
        + 'onclick="event.stopPropagation();wbManyColor(\'' + c.key + '\')"></button>').join('')
    + '<span class="sep"></span>'
    + '<button onclick="event.stopPropagation();wbManyCopy()" title="하나씩 더">⧉</button>'
    + '<button class="danger" onclick="event.stopPropagation();wbManyDel()" title="지우기">🗑</button>'
    + '<button onclick="event.stopPropagation();wbMany=[];render()" title="고르기 그만">✕</button>'
    + '</div>';
}

function wbSelect(id, ev){
  if(ev) ev.stopPropagation();
  if(wbMoved) return;                       // 옮기고 나서 오는 click 은 무시
  if(wbLink){ wbConnectTo(id); return; }
  // Shift(또는 Ctrl) 를 누른 채 누르면 고른 목록에 넣고 뺍니다
  if(ev && (ev.shiftKey || ev.ctrlKey || ev.metaKey)){ wbToggleMany(id); return; }
  if(wbMany.length){ wbMany = []; }         // 여럿 고른 상태에서 하나를 누르면 풀립니다
  const nd = wbNode(id);
  if(wbSel === id && wbEdit !== id && nd
     && nd.kind !== 'media' && nd.kind !== 'table'){
    wbStartEdit(id); return;               // 고른 것을 다시 누르면 글을 고칩니다
  }
  if(wbSel !== id) wbEdit = '';
  wbSel = id; render();
}
function wbBlank(){
  if(wbMoved) return;
  if(wbTablePick){ wbTablePick = false; render(); return; }
  if(wbLink){ wbLink = null; render(); return; }
  if(wbSel || wbEdit || wbMany.length){
    wbSel = ''; wbEdit = ''; wbMany = [];
    render();
  }
}
function wbStartEdit(id, ev){
  if(ev) ev.stopPropagation();
  wbSel = id; wbEdit = id; render();
  setTimeout(() => {
    const el = document.getElementById('wbt_' + id);
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 20);
}
function wbText(id, v){
  const n = wbNode(id); if(!n) return;
  n.text = v;
  const b = wbCur(); if(b) b.updatedAt = new Date().toISOString();
  markDirtyAll();
}
function wbColor(id, key){
  const n = wbNode(id); if(!n) return;
  n.color = key; markDirtyAll(); render();
}
function wbDelNode(id){
  const b = wbCur(); if(!b) return;
  const gone = (b.nodes || []).find(n => n.id === id);
  b.nodes = (b.nodes || []).filter(n => n.id !== id);
  b.edges = (b.edges || []).filter(e => e.from !== id && e.to !== id);
  b.updatedAt = new Date().toISOString();
  if(wbSel === id) wbSel = '';
  if(wbEdit === id) wbEdit = '';
  markDirtyAll(); render();
  if(gone && gone.kind === 'media') setTimeout(wbSweepMedia, 1200);
}
function wbFront(id){
  const b = wbCur(); if(!b) return;
  const n = (b.nodes || []).find(x => x.id === id); if(!n) return;
  b.nodes = b.nodes.filter(x => x.id !== id).concat([n]);
  markDirtyAll(); render();
}
function wbCopyNode(id){
  const b = wbCur(); const n = wbNode(id);
  if(!b || !n) return;
  const c = Object.assign({}, n, { id: uid('wn'), x: n.x + 24, y: n.y + 24 });
  b.nodes.push(c);
  wbSel = c.id; markDirtyAll(); render();
}

/* ── 잇기 ───────────────────────────────────────────────────── */
function wbStartLink(id){ wbLink = { from: id }; render(); }
function wbConnectTo(id){
  const b = wbCur();
  const from = wbLink ? wbLink.from : '';
  wbLink = null;
  if(!b || !from || from === id){ render(); return; }
  b.edges = b.edges || [];
  if(b.edges.some(e => e.from === from && e.to === id)){ render(); return; }
  b.edges.push({ id: uid('we'), from: from, to: id });
  b.updatedAt = new Date().toISOString();
  markDirtyAll(); render();
}
function wbDelEdge(eid){
  const b = wbCur(); if(!b) return;
  b.edges = (b.edges || []).filter(e => e.id !== eid);
  markDirtyAll(); render();
}

/* ── 화면 옮기기·키우기 ─────────────────────────────────────── */
let wbMarqMode = false;    // 단추로 켠 「여러 개 고르기」 (터치 화면용)
function wbToggleMarq(){ wbMarqMode = !wbMarqMode; render(); }

function wbPaintMarq(){
  const el = document.getElementById('wbMarq');
  if(!el) return;
  if(!wbMarq){ el.style.display = 'none'; return; }
  const x1 = Math.min(wbMarq.x1, wbMarq.x2), x2 = Math.max(wbMarq.x1, wbMarq.x2);
  const y1 = Math.min(wbMarq.y1, wbMarq.y2), y2 = Math.max(wbMarq.y1, wbMarq.y2);
  el.style.display = '';
  el.style.left = x1 + 'px';
  el.style.top  = y1 + 'px';
  el.style.width  = (x2 - x1) + 'px';
  el.style.height = (y2 - y1) + 'px';
}

function wbApplyView(){
  const c = document.getElementById('wbCanvas');
  if(c) c.style.transform = 'translate(' + wbView.x + 'px,' + wbView.y + 'px) scale('
    + wbView.z + ')';
  const z = document.getElementById('wbZoom');
  if(z) z.textContent = Math.round(wbView.z * 100) + '%';
}
function wbZoom(d){
  const wrap = document.getElementById('wbWrap');
  const cw = wrap ? wrap.clientWidth / 2 : 400;
  const ch = wrap ? wrap.clientHeight / 2 : 260;
  const z0 = wbView.z;
  const z1 = Math.min(2, Math.max(0.25, Math.round((z0 + d) * 100) / 100));
  if(z1 === z0) return;
  // 화면 한가운데를 붙잡고 키웁니다
  wbView.x = cw - (cw - wbView.x) * (z1 / z0);
  wbView.y = ch - (ch - wbView.y) * (z1 / z0);
  wbView.z = z1;
  wbApplyView();
}
function wbFit(){
  const b = wbCur(); const wrap = document.getElementById('wbWrap');
  if(!b || !wrap) return;
  const ns = b.nodes || [];
  if(!ns.length){ wbView = { x:0, y:0, z:1 }; wbApplyView(); return; }
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  ns.forEach(n => {
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h);
  });
  const pad = 40;
  const z = Math.min(1.4, Math.max(0.25,
    Math.min((wrap.clientWidth - pad * 2) / Math.max(1, x2 - x1),
             (wrap.clientHeight - pad * 2) / Math.max(1, y2 - y1))));
  wbView.z = Math.round(z * 100) / 100;
  wbView.x = -x1 * wbView.z + (wrap.clientWidth  - (x2 - x1) * wbView.z) / 2;
  wbView.y = -y1 * wbView.z + (wrap.clientHeight - (y2 - y1) * wbView.z) / 2;
  wbApplyView();
}

/* ── 끌기 (개체 옮기기 · 크기 · 판 밀기) ────────────────────── */
function wbDown(ev, id, mode){
  if(ev.button !== undefined && ev.button !== 0) return;
  if(wbLink) return;
  const b = wbCur(); if(!b) return;
  const n = id ? wbNode(id) : null;
  if(id && !n) return;

  // 빈 곳에서 Shift 를 누른 채 끌면 네모로 감싸서 여러 개를 고릅니다
  if(!id && mode === 'pan' && (ev.shiftKey || wbMarqMode)){
    ev.stopPropagation();
    const wrap = document.getElementById('wbWrap');
    const r = wrap.getBoundingClientRect();
    const px = (ev.clientX - r.left - wbView.x) / wbView.z;
    const py = (ev.clientY - r.top  - wbView.y) / wbView.z;
    wbDrag = { mode:'marq', sx: ev.clientX, sy: ev.clientY, x0: px, y0: py, moved:false };
    wbMarq = { x1:px, y1:py, x2:px, y2:py };
    window.addEventListener('pointermove', wbMove);
    window.addEventListener('pointerup', wbUp);
    return;
  }

  // 이미 여럿을 골라둔 상태에서 그중 하나를 끌면 다 같이 움직입니다
  if(id && mode === 'move' && wbInMany(id) && wbMany.length > 1){
    ev.stopPropagation();
    const b2 = wbCur();
    wbDrag = { mode:'many', sx: ev.clientX, sy: ev.clientY, moved:false,
               list: (b2.nodes || []).filter(x => wbInMany(x.id))
                       .map(x => ({ n:x, x0:x.x, y0:x.y,
                                    el: document.getElementById('wbn_' + x.id) })) };
    window.addEventListener('pointermove', wbMove);
    window.addEventListener('pointerup', wbUp);
    return;
  }

  // preventDefault 를 하면 그 뒤 click 이 오지 않아 「눌러서 고르기」 가 죽습니다.
  // 글자가 끌려 나가는 것은 CSS(user-select:none) 로 막습니다.
  ev.stopPropagation();
  const el = id ? document.getElementById('wbn_' + id) : null;
  wbDrag = { mode: mode, id: id, sx: ev.clientX, sy: ev.clientY, moved: false,
             x0: n ? n.x : wbView.x, y0: n ? n.y : wbView.y,
             w0: n ? n.w : 0, h0: n ? n.h : 0, el: el };
  if(el && mode === 'move') el.classList.add('drag');
  if(!id) document.getElementById('wbWrap').classList.add('grabbing');
  window.addEventListener('pointermove', wbMove);
  window.addEventListener('pointerup', wbUp);
}
function wbMove(ev){
  const d = wbDrag; if(!d) return;
  const dx = ev.clientX - d.sx, dy = ev.clientY - d.sy;
  if(!d.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  d.moved = true;

  if(d.mode === 'marq'){
    const wrap = document.getElementById('wbWrap');
    const r = wrap.getBoundingClientRect();
    wbMarq = {
      x1: d.x0, y1: d.y0,
      x2: (ev.clientX - r.left - wbView.x) / wbView.z,
      y2: (ev.clientY - r.top  - wbView.y) / wbView.z
    };
    wbPaintMarq();
    return;
  }
  if(d.mode === 'many'){
    d.list.forEach(o => {
      o.n.x = Math.max(0, Math.round(o.x0 + dx / wbView.z));
      o.n.y = Math.max(0, Math.round(o.y0 + dy / wbView.z));
      if(o.el){ o.el.style.left = o.n.x + 'px'; o.el.style.top = o.n.y + 'px'; }
    });
    wbDrawEdges();
    return;
  }
  if(d.mode === 'pan'){
    wbView.x = d.x0 + dx; wbView.y = d.y0 + dy;
    wbApplyView();
    return;
  }
  const n = wbNode(d.id); if(!n || !d.el) return;
  if(d.mode === 'move'){
    n.x = Math.max(0, Math.round(d.x0 + dx / wbView.z));
    n.y = Math.max(0, Math.round(d.y0 + dy / wbView.z));
    d.el.style.left = n.x + 'px';
    d.el.style.top  = n.y + 'px';
  }else{
    n.w = Math.max(90,  Math.round(d.w0 + dx / wbView.z));
    n.h = Math.max(40,  Math.round(d.h0 + dy / wbView.z));
    d.el.style.width  = n.w + 'px';
    d.el.style.height = n.h + 'px';
  }
  wbDrawEdges();
}
function wbUp(){
  const d = wbDrag;
  window.removeEventListener('pointermove', wbMove);
  window.removeEventListener('pointerup', wbUp);
  wbDrag = null;
  const wrap = document.getElementById('wbWrap');
  if(wrap) wrap.classList.remove('grabbing');
  if(!d) return;
  if(d.el) d.el.classList.remove('drag');
  if(d.moved){ wbMoved = true; setTimeout(() => { wbMoved = false; }, 0); }

  if(d.mode === 'marq'){
    const m = wbMarq;
    wbMarq = null;
    if(m && d.moved){
      const x1 = Math.min(m.x1, m.x2), x2 = Math.max(m.x1, m.x2);
      const y1 = Math.min(m.y1, m.y2), y2 = Math.max(m.y1, m.y2);
      const b2 = wbCur();
      wbMany = (b2.nodes || []).filter(n =>
        n.x < x2 && n.x + n.w > x1 && n.y < y2 && n.y + n.h > y1).map(n => n.id);
      wbSel = ''; wbEdit = '';
      if(!wbMany.length) toast('감싼 곳에 아무것도 없습니다');
    }
    wbMarqMode = false;
    render();
    return;
  }
  if(d.mode === 'pan') return;           // 판을 민 것은 저장하지 않습니다
  if(!d.moved) return;                   // 그냥 누른 것 — click 이 알아서 고릅니다
  const b = wbCur(); if(b) b.updatedAt = new Date().toISOString();
  markDirtyAll();
  render();
}
function wbWheel(ev){
  if(!ev.ctrlKey && !ev.metaKey) return;
  ev.preventDefault();
  wbZoom(ev.deltaY > 0 ? -0.1 : 0.1);
}

/* ── 선 그리기 ──────────────────────────────────────────────── */
/* 두 상자를 잇는 선 — 서로 마주 보는 변에서 나가고 들어옵니다 */
function wbEdgePath(a, z){
  const A = a.from, B = a.to;
  const ax = A.x + A.w / 2, ay = A.y + A.h / 2;
  const bx = B.x + B.w / 2, by = B.y + B.h / 2;
  const dx = bx - ax, dy = by - ay;
  const side = Math.abs(dx) > Math.abs(dy);
  const p1 = side ? { x: ax + (dx > 0 ? A.w / 2 : -A.w / 2), y: ay }
                  : { x: ax, y: ay + (dy > 0 ? A.h / 2 : -A.h / 2) };
  const p2 = side ? { x: bx + (dx > 0 ? -B.w / 2 : B.w / 2), y: by }
                  : { x: bx, y: by + (dy > 0 ? -B.h / 2 : B.h / 2) };
  const c = side ? Math.abs(p2.x - p1.x) / 2 : Math.abs(p2.y - p1.y) / 2;
  const c1 = side ? { x: p1.x + (dx > 0 ? c : -c), y: p1.y } : { x: p1.x, y: p1.y + (dy > 0 ? c : -c) };
  const c2 = side ? { x: p2.x + (dx > 0 ? -c : c), y: p2.y } : { x: p2.x, y: p2.y + (dy > 0 ? -c : c) };
  return 'M' + p1.x + ',' + p1.y + ' C' + c1.x + ',' + c1.y + ' ' + c2.x + ',' + c2.y
       + ' ' + p2.x + ',' + p2.y;
}
function wbDrawEdges(){
  const svg = document.getElementById('wbEdges');
  const b = wbCur();
  if(!svg || !b) return;
  const byId = {};
  (b.nodes || []).forEach(n => { byId[n.id] = n; });
  const gs = (b.edges || []).map(e => {
    const A = byId[e.from], B = byId[e.to];
    if(!A || !B) return '';
    const d = wbEdgePath({ from:A, to:B });
    return '<g' + (wbSel === e.id ? ' class="on"' : '') + '>'
      + '<path d="' + d + '" marker-end="url(#wbArrow)"></path>'
      + '<path class="hit" d="' + d + '" onclick="wbEdgeClick(\'' + jsq(e.id) + '\')"></path>'
      + '</g>';
  }).join('');
  svg.innerHTML = '<defs><marker id="wbArrow" viewBox="0 0 10 10" refX="9" refY="5" '
    + 'markerWidth="6" markerHeight="6" orient="auto-start-reverse">'
    + '<path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)"></path></marker></defs>' + gs;
}
function wbEdgeClick(eid){
  if(!confirm('이 화살표를 지울까요?')) return;
  wbDelEdge(eid);
}

      + (n.kind === 'table'
          ? '<button onclick="wbRowAdd(\'' + jsq(n.id) + '\')" title="줄 하나 더">＋줄</button>'

            + '<button onclick="wbColDel(\'' + jsq(n.id) + '\')" title="마지막 칸 빼기">－칸</button>'
          : '')

      + '<button onclick="wbCopyNode(\'' + jsq(n.id) + '\')" title="하나 더">⧉</button>'

      + body
      + '<span class="rz" onpointerdown="wbDown(event,\'' + jsq(n.id) + '\',\'size\')"></span>'
    + '</div>';

/* ═══════════════ 업무 → 📈 그로스보드 ═════════════════════════════
   사람마다 한 해를 어떻게 끌고 가는지 한 장에 담습니다.

     올해 목표
     └ 핵심 지표(KPI) — 진행률 %. 직접 적거나, 아래 결과에서 자동 합산
     └ 단계 (유입 → 전환 → 활성화 → 재사용 → 개인·자유업무)
        └ 업무 — 어느 지표에 붙는지 고릅니다
           └ 목표 / 문제
              └ 근거 · 세부 단계(체크) · 결과

   자료는 data.growth 배열에 「사람 × 연도」 한 장씩 들어갑니다.
   TOP_LISTS 에 넣어서 저장·합치기·휴지통이 회의록과 똑같이 돌아갑니다.
   ================================================================= */
const GB_STAGES = [
  { key:'acquisition', label:'유입',        desc:'신규 유입률 확대 · 브랜드 인지도', hue:'var(--blue)' },
  { key:'conversion',  label:'전환',        desc:'문의·구매로 이어지게',            hue:'var(--purple)' },
  { key:'activation',  label:'활성화',      desc:'써보게 만들고 다시 오게',          hue:'var(--cyan)' },
  { key:'retention',   label:'재사용',      desc:'기존 고객 → 충성 고객',            hue:'var(--green)' },
  { key:'own',         label:'개인 및 자유업무', desc:'위에 안 들어가는 내 일',        hue:'var(--text-muted)' }
];
const GB_HUE = {};
GB_STAGES.forEach(s => { GB_HUE[s.key] = s.hue; });

let gbQ    = '';        // 업무 찾기 (제목·내용에서 찾습니다)
let gbSt   = '';        // 상태로 거르기 ('' = 전체)
let gbWho  = '';        // 지금 보고 있는 사람 (계정 아이디 또는 이름)
let gbGone = false;     // 그 사람이 퇴사 처리됐나 (기록은 그대로, 새로 더하는 것만 막습니다)
let gbYear = String(new Date().getFullYear());
const gbOpen = {};      // 접힘 상태 (id → 펼침)

function gbToggle(id){
  const y = window.scrollY;
  gbOpen[id] = !gbOpen[id];
  render();
  window.scrollTo(0, y);      // 누른 자리가 그대로 있게 (화면이 밀리지 않게)
}

function setGbQ(v){
  gbQ = v;
  // 찾는 중에는 걸린 업무가 보이도록 그 단계를 펴 둡니다
  if(v.trim()){
    const g = gbFind(gbWho, gbYear);
    if(g) (g.stages || []).forEach(st => {
      if(gbVisibleItems(st).length) gbOpen[st.id] = true;
    });
  }
  render();
}
function setGbSt(v){ gbSt = v; render(); }

/* 이 업무가 찾는 말에 걸리나 — 제목·내용·가설·행동·결과까지 봅니다 */
function gbHit(it, q){
  if(!q) return true;
  const bag = [it.title || '', it.status || ''];
  (it.acts || []).forEach(a => {
    bag.push(a.text || '', a.basis || '', a.value || '');
    (a.steps || []).forEach(t => {
      bag.push(t.text || '');
      (t.subs || []).forEach(x => bag.push(x.text || ''));
    });
  });
  const hay = bag.join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.indexOf(w) >= 0);
}
/* 거르고 남은 업무들 */
function gbVisibleItems(st){
  const q = gbQ.trim();
  return (st.items || []).filter(it =>
    (!gbSt || (it.status || '진행 중') === gbSt) && gbHit(it, q));
}

/* 글이 길어지면 칸이 저절로 늘어납니다 (작은 칸 안에서 스크롤하지 않게) */
function gbGrow(el){
  if(!el) return;
  // 'auto' 로 두면 textarea 가 기본 두 줄 높이로 잡혀서 한 줄짜리도 두 줄이 됩니다.
  // 0 으로 눌렀다가 재야 글자 높이만큼만 늘어납니다.
  el.style.height = '0px';
  el.style.height = Math.max(26, el.scrollHeight) + 'px';
}
function gbGrowAll(){
  document.querySelectorAll('.gb-act textarea, .gb-perf textarea,\n     .hxb textarea, .dc-no, .hl-now textarea, .gb-dtt, #gbGoal,\n     .pe-t, .pe-rl textarea, .pe-sum textarea, .pe-ch textarea')
    .forEach(gbGrow);
}
function setGbWho(v){
  gbWho = v; gbWb = null; gbIt = null; gbQ = ''; gbSt = '';
  render(); window.scrollTo({ top:0, behavior:'smooth' });
}
function setGbYear(v){ gbYear = String(v); gbWb = null; gbIt = null; render(); }

/* 보드를 쓸 사람들 — 계정을 쓰면 팀원 목록, 아니면 적어둔 이름들 */
function gbPeople(){
  if(authOn()){
    setTimeout(() => loadPeople(), 10);
    const all  = people.list || [];
    const list = all.filter(u => u['쓸수있음']).map(u => ({ key:u.id, name:u['이름'] }));
    /* 퇴사한 사람이라도 보드가 남아 있으면 계속 열립니다.
       계정을 막았다고 그 사람이 적어 둔 것까지 못 보게 되면 안 됩니다. */
    all.forEach(u => {
      if(u['쓸수있음'] || list.some(x => x.key === u.id)) return;
      if(!(data.growth || []).some(g => g.who === u.id)) return;
      list.push({ key:u.id, name:u['이름'], gone:true });
    });
    /* 계정을 아예 지웠는데 보드만 남은 경우도 놓치지 않습니다 */
    (data.growth || []).forEach(g => {
      if(!g.who || list.some(x => x.key === g.who)) return;
      list.push({ key:g.who, name:peopleName(g.who) || g.who, gone:true });
    });
    if(list.length) return list;
    const me = authMe();
    return me ? [{ key:me.id, name:me['이름'] }] : [];
  }
  // 계정을 안 쓸 때는 보드가 만들어진 이름들을 그대로 씁니다
  const seen = [];
  (data.growth || []).forEach(g => {
    if(g.who && !seen.some(x => x.key === g.who)) seen.push({ key:g.who, name:g.who });
  });
  return seen;
}
function gbName(key){
  const hit = gbPeople().find(x => x.key === key);
  if(hit) return hit.name;
  return peopleName(key) || key;
}

/* 몇 해를 골라볼 수 있나 — 올해 · 내년 · 보드가 있는 해 */
function gbYears(){
  const y = new Date().getFullYear();
  const set = new Set([String(y), String(y + 1), gbYear]);
  (data.growth || []).forEach(g => { if(g.year) set.add(String(g.year)); });
  return [...set].sort();
}

function gbBoards(){ if(!Array.isArray(data.growth)) data.growth = []; return data.growth; }
function gbFind(who, year){
  return gbBoards().find(g => g.who === who && String(g.year) === String(year)) || null;
}
/* 없으면 그 자리에서 만듭니다 (기본 단계까지 채워서) */
function gbEnsure(who, year){
  let g = gbFind(who, year);
  if(g) return g;
  g = { id: uid('gb'), who: who, year: String(year), goal:'',
        kpis: [], stages: GB_STAGES.map((s, i) => ({
          id: uid('gs'), key: s.key, no: i + 1, label: s.label, desc: s.desc, items: []
        })),
        createdAt: new Date().toISOString() };
  gbBoards().push(g);
  markDirtyAll();
  return g;
}

/* ── 셈 ─────────────────────────────────────────────────────── */
function gbNum(v){
  const n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : 0;
}
function gbColor(p){
  if(p === null) return 'var(--text-muted)';
  if(p >= 100) return 'var(--green)';
  if(p >= 70)  return 'var(--cyan)';
  if(p >= 35)  return 'var(--yellow)';
  return 'var(--red)';
}
/* 단계 안에서 끝난 단계가 몇 개인지 */
function gbStepStat(st){
  let all = 0, fin = 0;
  (st.items || []).forEach(it => {
    if(it.status === '완료') fin++;
    (it.acts || []).forEach(a =>
      (a.steps || []).forEach(x => { if(String(x.text || '').trim()) all++; }));
  });
  return { all: all, fin: fin };
}

/* ── 고치기 (다시 그리지 않습니다 — 글 치는 중에 화면이 흔들리지 않게) ── */
function gbEdit(path, v){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const t = gbAt(g, path);
  if(!t) return;
  t.obj[t.key] = v;
  g.updatedAt = new Date().toISOString();
  markDirtyAll();
}
/* "kpis.k_1.name" · "stages.gs_1.items.i_2.acts.a_3.text" 같은 길을 따라갑니다 */
function gbAt(g, path){
  const seg = String(path).split('.');
  let cur = g;
  for(let i = 0; i < seg.length - 1; i += 2){
    const list = cur[seg[i]];
    if(!Array.isArray(list)) return null;
    const nxt = list.find(x => x.id === seg[i + 1]);
    if(!nxt) return null;
    if(i + 2 >= seg.length - 1) return { obj: nxt, key: seg[seg.length - 1], list: list };
    cur = nxt;
  }
  return { obj: cur, key: seg[seg.length - 1] };
}
/* 고친 뒤 다시 그려야 하는 것 (진행률·개수처럼 다른 곳에 같이 보이는 값) */
function gbEditDraw(path, v){ gbEdit(path, v); render(); }

/* ── 단계 ───────────────────────────────────────────────────── */
function gbAddStage(){
  const g = gbEnsure(gbWho, gbYear);
  g.stages = g.stages || [];
  g.stages.push({ id: uid('gs'), key:'own', no: g.stages.length + 1,
                  label:'새 단계', desc:'', items: [] });
  markDirtyAll(); render();
}
function gbDelStage(sid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  const n = (st.items || []).length;
  if(!confirm('"' + (st.label || '이름 없는 단계') + '" 단계를 지울까요?'
    + (n ? '\n\n안에 든 업무 ' + n + '건도 같이 갑니다.' : '')
    + '\n\n휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 되돌릴 수 있습니다.')) return;
  trashPut('그로스 단계', gbName(g.who) + ' · ' + g.year + ' · ' + (st.label || ''),
           st, { kind:'gbstage', boardId: g.id });
  g.stages = g.stages.filter(x => x.id !== sid);
  markDirtyAll(); render();
  toast('🗑️ 휴지통으로 보냈습니다');
}

/* ── 업무 ───────────────────────────────────────────────────── */
function gbAddItem(sid, tplKey){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  // 서식을 안 골랐으면 먼저 고르게 합니다
  if(!tplKey){ gbPickTpl(sid); return; }
  st.items = st.items || [];
  const T = GB_TPL.find(x => x.key === tplKey) || GB_TPL[0];
  // 지금 보고 있는 브랜드로 붙입니다 (예전에는 브랜드를 안 넣어서 늘 「브랜드 없음」 이었습니다)
  const it = { id: uid('gi'), title: T.ti || '새 업무', status:'진행 중', kpiId:'',
    brandId: gbPbId, tpl: T.key,
    acts:[ { id: uid('ga'), mode:'goal', text:'', basis:'', value:'',
             steps: (T.steps || []).map(x => ({ id: uid('gt'), kind:'act', text: x, subs:[] })) } ] };
  st.items.push(it);
  gbTplAt = ''; gbOpen[sid] = true; gbOpen[it.id] = true;
  markDirtyAll(); render();
  toast('＋ ' + T.ic + ' ' + T.nm + ' 서식으로 만들었습니다');
}
function gbDelItem(sid, iid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return;
  if(!confirm('"' + (it.title || '이름 없는 업무') + '" 업무를 지울까요?\n\n'
    + '휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 되돌릴 수 있습니다.')) return;
  trashPut('그로스 업무', gbName(g.who) + ' · ' + (it.title || ''), it,
           { kind:'gbitem', boardId: g.id, stageId: sid });
  st.items = st.items.filter(x => x.id !== iid);
  markDirtyAll(); render();
  toast('🗑️ 휴지통으로 보냈습니다');
}

/* ── 목표 · 문제 (활동) ─────────────────────────────────────── */
function gbAddAct(sid, iid, mode){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return;
  it.acts = it.acts || [];
  it.acts.push({ id: uid('ga'), mode: mode || 'goal', text:'', basis:'', value:'', steps:[] });
  markDirtyAll(); render();
}
function gbDelAct(sid, iid, aid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return;
  if((it.acts || []).length <= 1){ toast('⚠️ 마지막 하나는 지울 수 없습니다'); return; }
  if(!confirm('이 차수를 지울까요? 안에 적은 가설·행동과 결과도 같이 갑니다.')) return;
  it.acts = it.acts.filter(x => x.id !== aid);
  markDirtyAll(); render();
}
function gbAct(g, sid, iid, aid){
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return null;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return null;
  return (it.acts || []).find(x => x.id === aid) || null;
}

          + 'oninput="gbGrow(this);gbEdit(\'goal\', this.value)">' + esc(g.goal || '')

  /* 사진도 화면과 같은 것이 나와야 합니다.
     예전에는 사진일 때만 유입·전환 같은 단계별로 다시 그려서, 화면에서 보던
     브랜드별 성과와 전혀 다른 그림이 나왔습니다. */
  const tabsHtml = gbBrandTabs(g);              // gbPbId 를 정해 주는 일도 겸합니다
  /* 사진일 때는 브랜드 탭 대신 브랜드마다 머리를 달아 전부 이어 붙입니다 */

        + '<span>📥 글로 붙여넣기</span>'

        + '  행동 1. 주 2편씩 8주 발행&#10;'
        + '    · 키워드 30개 목록 먼저 만들기&#10;'

        + '  결과: 검색 유입 4,100명"></textarea>'
      + '<div class="sec-bar" style="margin:9px 0 0">'
        + '<button class="btn primary" onclick="gbDoPaste(\'add\')">＋ 지금 보드에 더하기</button>'

function gbStart(){ gbEnsure(gbWho, gbYear); render(); }

/* ── 🧹 퇴사자가 남긴 자료 정리 (관리자 전용) ────────────────────
   그만둔 사람의 기록을 언제까지고 안고 갈 수는 없습니다. 그렇다고 누르는
   순간 없애지도 않습니다 — 휴지통에 30일 동안 그대로 있어서, 나중에
   「그때 그 자료 어디 갔지」 가 되면 되돌릴 수 있습니다.

   계정 아이디로 확실히 묶이는 것만 다룹니다 (누구 것인지 헷갈릴 수 없는 것):
     📈 그로스보드   growth[].who
     ✅ 맡은 할 일   brands[].tasks[].uid
     🧩 그로스 판    boards[].from.who
     📊 성과 정리    gbperf[].who   (화면에서는 뺐지만 자료는 남아 있습니다)
   회의록·일정은 작성자가 계정이 아니라 그냥 적어둔 글자라서 손대지 않습니다.
   ---------------------------------------------------------------- */
let wipeWho = '';                                   // 지금 정리하는 사람 (계정 아이디)
const wipePick = { growth:true, tasks:true, boards:true, perf:true };

/* 이 사람 앞으로 무엇이 남아 있나 */
function wipeFind(who){
  who = String(who || '');
  const growth = (data.growth || []).filter(x => x.who === who);
  const tasks  = [];
  (data.brands || []).forEach(b => (b.tasks || []).forEach(t => {
    if(String(t.uid || '') === who) tasks.push({ b:b, t:t });
  }));
  const boards = (data.boards || []).filter(x => x.from && x.from.who === who);
  const perf   = (data.gbperf || []).filter(x => x.who === who);
  const items  = growth.reduce((a, g) =>
    a + (g.stages || []).reduce((c, st) => c + (st.items || []).length, 0), 0);
  return { growth, tasks, boards, perf, items,
           total: growth.length + tasks.length + boards.length + perf.length };
}

function wipeOpen(who){
  if(!isAdmin()){ toast('⚠️ 관리자만 할 수 있습니다'); return; }
  wipeWho = String(who || '');
  wipePick.growth = wipePick.tasks = wipePick.boards = wipePick.perf = true;
  render();
}
function wipeClose(){ wipeWho = ''; render(); }
function wipeToggle(k){ wipePick[k] = !wipePick[k]; render(); }

function wipeGo(){
  if(!isAdmin()){ toast('⚠️ 관리자만 할 수 있습니다'); return; }
  const who = wipeWho, nm = peopleName(who) || who;
  const f = wipeFind(who);

  const line = [];
  if(wipePick.growth && f.growth.length)
    line.push('📈 그로스보드 ' + f.growth.length + '개 (한 일 ' + f.items + '건)');
  if(wipePick.tasks  && f.tasks.length)  line.push('✅ 맡은 할 일 ' + f.tasks.length + '건');
  if(wipePick.boards && f.boards.length) line.push('🧩 그로스 판 ' + f.boards.length + '개');
  if(wipePick.perf   && f.perf.length)   line.push('📊 성과 정리 ' + f.perf.length + '건');
  if(!line.length){ toast('⚠️ 고른 것이 없습니다'); return; }

  if(!confirm(nm + ' 님이 남긴 것을 지울까요?\n\n· ' + line.join('\n· ')
    + '\n\n휴지통으로 갑니다 — 업무 → 🗑 휴지통 에서 30일 안에 되돌릴 수 있습니다.')) return;

  let n = 0;
  if(wipePick.growth && f.growth.length){
    f.growth.forEach(g => {
      const c = (g.stages || []).reduce((a, st) => a + (st.items || []).length, 0);
      trashPut('그로스보드', nm + ' · ' + g.year + '년 (한 일 ' + c + '건)', g, { kind:'gbboard' });
      deletedIds.add(g.id); n++;            // 합칠 때 남의 저장본에서 되살아나지 않게
    });
    const ids = new Set(f.growth.map(x => x.id));
    data.growth = (data.growth || []).filter(x => !ids.has(x.id));
  }
  if(wipePick.tasks && f.tasks.length){
    f.tasks.forEach(r => {
      trashPut('할 일', r.t.title || '(제목 없음)', r.t,
               { kind:'item', type:'tasks', brandId: r.b.id });
      deletedIds.add(r.t.id); n++;
    });
    const ids = new Set(f.tasks.map(r => r.t.id));
    (data.brands || []).forEach(b => {
      if(Array.isArray(b.tasks)) b.tasks = b.tasks.filter(x => !ids.has(x.id));
    });
  }
  if(wipePick.boards && f.boards.length){
    f.boards.forEach(b2 => {
      trashPut('그로스 판', b2.name || '이름 없는 판', b2, { kind:'board' });
      deletedIds.add(b2.id); n++;
    });
    const ids = new Set(f.boards.map(x => x.id));
    data.boards = (data.boards || []).filter(x => !ids.has(x.id));
  }
  if(wipePick.perf && f.perf.length){
    f.perf.forEach(pp => {
      trashPut('성과 정리', nm + ' · ' + pp.year + '년', pp,
               { kind:'item', type:'gbperf', brandId:'' });
      deletedIds.add(pp.id); n++;
    });
    const ids = new Set(f.perf.map(x => x.id));
    data.gbperf = (data.gbperf || []).filter(x => !ids.has(x.id));
  }

  gbIt = null; gbWb = null;
  markDirtyAll(); render();
  toast('🧹 ' + nm + ' 님 자료 ' + n + '개를 휴지통으로 보냈습니다');
}

/* 자료를 치운 뒤 계정까지 — 이건 진짜 끝입니다 (되돌리기 없음) */
async function wipeAccount(){
  if(!isAdmin()){ toast('⚠️ 관리자만 할 수 있습니다'); return; }
  const who = wipeWho, nm = peopleName(who) || who;
  const f = wipeFind(who);
  if(f.total && !confirm('아직 ' + nm + ' 님 앞으로 자료 ' + f.total + '개가 남아 있습니다.\n\n'
    + '계정을 지우면 이름을 알려줄 곳이 없어져서, 남은 자료에 이름 대신 '
    + '아이디(' + who + ')가 찍힙니다.\n\n그래도 계정을 지울까요?')) return;
  if(!confirm('"' + who + '" 계정을 아예 지울까요?\n\n이건 되돌릴 수 없습니다.')) return;
  try{
    const o = await authPost('deluser', { id: who });
    toast('🗑️ ' + (o['안내'] || '지웠습니다'));
    wipeWho = '';
    loadUsers(); loadPeople(true); render();
  }catch(e){ alert(e.message); }
}

    + '</div>'

/* ── 그로스보드 안의 화이트보드 ────────────────────────────────
   보드 전체에 하나, 업무마다 하나씩 판을 붙일 수 있습니다.
   판 자체는 data.boards 에 그대로 들어가므로 🧩 화이트보드 목록에도 나옵니다.
   ------------------------------------------------------------- */
let gbWb = null;      // null | { sid, iid }  (sid 가 없으면 보드 전체 판)

/* ── 📐 글을 판으로 ─────────────────────────────────────────────
   적어 둔 글을 그대로 판에 옮겨 이어 그립니다.
     문제 / 목표 ─→ 행동·가설 ─→ 결과 ─→ (다음 차수의 문제/목표)
   손으로 옮겨 놓거나 새로 만든 것은 그대로 두고, 전에 글로 그린 것만
   다시 그립니다 (판에 붙여 둔 사진도 지우지 않습니다).
   ------------------------------------------------------------- */
function gbFlowH(txt, min){
  const n = String(txt || '').split('\n')
    .reduce((a, l) => a + Math.max(1, Math.ceil(l.length / 22)), 0);
  return Math.max(min || 76, Math.min(340, 40 + n * 21));
}

function gbFlow(sid, iid){
  const g = gbFind(gbWho, gbYear); if(!g) return;
  const st = (g.stages || []).find(x => x.id === sid); if(!st) return;
  const it = (st.items || []).find(x => x.id === iid); if(!it) return;

  const acts = (it.acts || []).filter(a => String(a.text || '').trim()
    || String(a.value || '').trim()
    || (a.steps || []).some(r => String(r.text || '').trim()));
  if(!acts.length){ toast('⚠️ 아직 적은 내용이 없습니다'); return; }

  const b   = gbBoardFor(g, it);
  const had = (b.nodes || []).filter(n => n.src === 'gb').length;
  if(had && !confirm('적어 둔 글로 판을 다시 그릴까요?\n\n'
    + '손으로 옮기거나 새로 만든 것과 사진은 그대로 둡니다.\n'
    + '전에 글로 그린 ' + had + '개만 새로 그립니다.')) return;

  const gone = {};
  (b.nodes || []).forEach(n => { if(n.src === 'gb') gone[n.id] = 1; });
  b.nodes = (b.nodes || []).filter(n => !gone[n.id]);
  b.edges = (b.edges || []).filter(e => !gone[e.from] && !gone[e.to]);

  const N = [], E = [];
  const put  = o => { const n = Object.assign({ id: uid('wn'), kind:'note', color:'gray',
                                                src:'gb', text:'' }, o);
                      N.push(n); return n; };
  const link = (a, c) => { E.push({ id: uid('we'), from: a.id, to: c.id }); };

  const X0 = 40, X1 = 400, X2 = 830, W0 = 320, W1 = 390, W2 = 300;
  let y = 40, prev = null;

  put({ kind:'text', x:X0, y:y, w:760, h:56, color:'dark',
        text: (it.title || '이름 없는 업무') + '   ·   ' + (st.label || '') });
  y += 92;

  acts.forEach((a, i) => {
    const goal = a.mode !== 'problem';
    const rows = (a.steps || []).filter(r => String(r.text || '').trim()
      || (r.subs || []).some(x => String(x.text || '').trim()));

    // 가운데 줄(행동·가설)을 먼저 쌓아 이 차수의 높이를 잽니다
    let ry = y, hn = 0, an = 0;
    const mid = rows.map(r => {
      const isH = r.kind === 'hyp';
      const no  = isH ? ++hn : ++an;
      const body = (isH ? '가설 ' : '행동 ') + no + '. ' + String(r.text || '').trim()
        + (r.subs || []).filter(x => String(x.text || '').trim())
            .map(x => '\n · ' + x.text.trim()).join('');
      const h = gbFlowH(body, 80);
      const n = put({ x:X1, y:ry, w:W1, h:h, color: isH ? 'yellow' : 'gray', text: body });
      ry += h + 16;
      return n;
    });
    const bandH = Math.max(ry - y - 16, 120);

    const ctxT = (i + 1) + '차 · ' + (goal ? '목표 / 실행 이유' : '문제 / 이슈')
      + '\n\n' + String(a.text || '').trim();
    const ctx = put({ x:X0, y:y, w:W0, h: gbFlowH(ctxT, 120),
                      color: goal ? 'blue' : 'pink', text: ctxT });

    let res = null;
    if(String(a.value || '').trim()){
      const rt = '결과\n\n' + a.value.trim();
      res = put({ x:X2, y:y, w:W2, h: gbFlowH(rt, 110), color:'green', text: rt });
    }

    mid.forEach(m => { link(ctx, m); if(res) link(m, res); });
    if(!mid.length && res) link(ctx, res);
    if(prev) link(prev, ctx);
    prev = res || (mid.length ? mid[mid.length - 1] : ctx);
    y += bandH + 70;
  });

  b.nodes = (b.nodes || []).concat(N);
  b.edges = (b.edges || []).concat(E);
  b.updatedAt = new Date().toISOString();
  markDirtyAll();
  gbOpenWb(sid, iid);
  toast('📐 ' + N.length + '개를 이어서 그렸습니다');
}

/* 이 자리에 붙은 판을 찾고, 없으면 만듭니다 */
function gbBoardFor(g, it){
  const holder = it || g;
  let b = wbBoards().find(x => x.id === holder.wbId);
  if(b) return b;
  const name = it
    ? gbName(g.who) + ' · ' + (it.title || '이름 없는 업무')
    : gbName(g.who) + ' · ' + g.year + '년 그로스보드';
  b = { id: uid('wb'), name: name, nodes: [], edges: [],
        from: { who: g.who, year: g.year, item: it ? (it.title || '') : '' },
        createdAt: new Date().toISOString() };
  wbBoards().unshift(b);
  holder.wbId = b.id;
  markDirtyAll();
  return b;
}

function gbOpenWb(sid, iid){
  wbMany = []; wbMarq = null;
  const g = gbFind(gbWho, gbYear); if(!g) return;
  let it = null;
  if(sid){
    const st = (g.stages || []).find(x => x.id === sid);
    it = st ? (st.items || []).find(x => x.id === iid) : null;
    if(!it) return;
  }
  const b = gbBoardFor(g, it);
  wbId = b.id; wbSel = ''; wbEdit = ''; wbLink = null;
  wbView = { x:0, y:0, z:1 };
  gbWb = { sid: sid || '', iid: iid || '' };
  render();
  setTimeout(wbFit, 30);
}
function gbCloseWb(){
  gbWb = null; wbId = ''; wbSel = ''; wbEdit = ''; wbLink = null; wbMany = [];
  render();
}

/* 어느 자리에도 안 매인 판 — 화이트보드 탭이 있던 시절에 따로 만든 것들입니다.
   없어지면 찾을 길이 없으므로 그로스보드에서 열 수 있게 남겨둡니다. */
function gbLooseBoards(){
  const used = {};
  (data.growth || []).forEach(g => {
    if(g.wbId) used[g.wbId] = 1;
    (g.stages || []).forEach(st => (st.items || []).forEach(it => {
      if(it.wbId) used[it.wbId] = 1;
    }));
  });
  // 남의 보드에서 만든 판이 내 화면에 뜨지 않게, 주인이 같은 것만 보여줍니다
  return wbBoards().filter(b => !used[b.id]
    && (!b.from || !b.from.who || b.from.who === gbWho));
}
function gbOpenLoose(id){
  wbMany = []; wbMarq = null;
  const b = wbBoards().find(x => x.id === id); if(!b) return;
  wbId = b.id; wbSel = ''; wbEdit = ''; wbLink = null;
  wbView = { x:0, y:0, z:1 };
  gbWb = { loose: id };
  render();
  setTimeout(wbFit, 30);
}

/* 이 자리에 판이 있고 뭔가 그려져 있나 (단추에 개수를 보여주려고) */
function gbWbCount(holder){
  if(!holder || !holder.wbId) return 0;
  const b = wbBoards().find(x => x.id === holder.wbId);
  return b ? (b.nodes || []).length : 0;
}

/* ── 📣 성과 정리 — 화면에서 뺐습니다 (v20260917-66) ─────────────
   결과 지표 · 선행 지표 · 왜 · 어떻게 · 달성·인과 · 교훈 틀은 쓰지
   않기로 했습니다. 아래 함수들은 아무 데서도 부르지 않습니다.
   적어 두셨던 내용은 data.gbperf 에 그대로 있으니, 되살리려면
   gbMyBrandHtml 에서 gbPerfHtml(gbPbId, g.who) 한 줄만 다시 넣으면 됩니다.

   (예전 설명)
   그로스보드는 「무엇을 했다」 를 나열하는 자리가 아니라,
     ① 결과를 만들 선행 지표를 무엇으로 정했나 (왜 이 지표인가)
     ② 거기에 어떻게 집중했나
     ③ 얼마나 달성했고, 그게 결과로 어떻게 이어졌나
     ④ 그 과정에서 무엇을 배웠나
   를 증명하는 자리입니다. 지난 발표에서 쓰던 그 틀 그대로 적습니다.
   브랜드 × 사람 × 해 로 한 장씩이고, data.gbperf 에 들어갑니다.
   ------------------------------------------------------------- */
function gbPerfs(){
  if(!Array.isArray(data.gbperf)) data.gbperf = [];
  return data.gbperf;
}
function gbPerfFind(brandId, who, year){
  return gbPerfs().find(p => p.brandId === brandId && p.who === who
    && String(p.year) === String(year)) || null;
}
function gbPerfEnsure(brandId, who, year){
  let p = gbPerfFind(brandId, who, year);
  if(p) return p;
  p = { id: uid('gp'), brandId: brandId, who: who, year: String(year),
        results:[ { id: uid('gr'), name:'', target:'', current:'', unit:'' } ],
        leads: [{ id: uid('gl'), name:'', target:'', current:'', unit:'', why:'' }],
        why:'', how:'', causal:'', lesson:'', ai:'', aiAt:'',
        createdAt: new Date().toISOString() };
  gbPerfs().push(p);
  markDirtyAll();
  return p;
}
/* 결과 지표 — 여러 개 적을 수 있습니다.
   예전에는 하나(result)뿐이라, 한 해에 만들어야 할 숫자가 둘 이상인 브랜드는
   적을 자리가 없었습니다. 예전 자료는 첫 칸으로 옮겨 줍니다. */
function gbResults(p){
  if(!Array.isArray(p.results)){
    const o = (p.result && typeof p.result === 'object' && !Array.isArray(p.result))
      ? p.result : null;
    const had = o && ['name','target','current','unit']
      .some(k => String(o[k] || '').trim());
    p.results = had ? [ Object.assign({ id: uid('gr') }, o) ] : [];
    delete p.result;
  }
  if(!p.results.length) p.results.push({ id: uid('gr'), name:'', target:'', current:'', unit:'' });
  p.results.forEach(x => { if(!x.id) x.id = uid('gr'); });
  return p.results;
}
function gbPerfAddResult(pid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  const l = gbResults(p);
  if(l.length >= 8){ toast('⚠️ 결과 지표는 8개까지입니다'); return; }
  l.push({ id: uid('gr'), name:'', target:'', current:'', unit:'' });
  markDirtyAll(); render();
}
function gbPerfDelResult(pid, rid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  const l = gbResults(p);
  if(l.length <= 1){ toast('결과 지표는 하나는 있어야 합니다'); return; }
  p.results = l.filter(x => x.id !== rid);
  markDirtyAll(); render();
}

/* 이 브랜드에 성과 정리를 적어 둔 사람들 */
function gbPerfWho(brandId, year){
  return gbPerfs().filter(p => p.brandId === brandId && String(p.year) === String(year))
    .map(p => p.who);
}
function gbPerfPct(x){
  const t = gbNum(x.target), c = gbNum(x.current);
  if(!String(x.target || '').trim() || t === 0) return null;
  return Math.round(c / t * 100);
}

function gbPerfEdit(pid, path, v, draw){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  const seg = String(path).split('.');
  let cur = p;
  for(let i = 0; i < seg.length - 1; i++){
    if(Array.isArray(cur)) cur = cur.find(x => x.id === seg[i]);
    else cur = cur[seg[i]];
    if(!cur) return;
  }
  cur[seg[seg.length - 1]] = v;
  p.updatedAt = new Date().toISOString();
  markDirtyAll();
  if(draw) render();
}
function gbPerfAddLead(pid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  if((p.leads || []).length >= 5){ toast('⚠️ 선행 지표는 5개까지입니다'); return; }
  p.leads = p.leads || [];
  p.leads.push({ id: uid('gl'), name:'', target:'', current:'', unit:'', why:'' });
  markDirtyAll(); render();
}
function gbPerfDelLead(pid, lid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  p.leads = (p.leads || []).filter(x => x.id !== lid);
  markDirtyAll(); render();
}

/* 적은 것을 글 한 덩이로 — AI 에게 보낼 때와 복사할 때 씁니다 */
function gbPerfText(p){
  const br = (data.brands || []).find(b => b.id === p.brandId);
  const L = [];
  L.push('브랜드: ' + ((br && br.name) || '(없음)'));
  L.push('발표자: ' + gbName(p.who) + ' · ' + p.year + '년');
  L.push('\n[결과 지표]');
  const rs = gbResults(p).filter(x => String(x.name || '').trim());
  if(!rs.length) L.push('(아직 없음)');
  rs.forEach((r, i) => {
    L.push((rs.length > 1 ? (i + 1) + ') ' : '') + r.name
      + (String(r.target || '').trim()
          ? '  — 지금 ' + (r.current || '0') + (r.unit || '')
            + ' / 목표 ' + r.target + (r.unit || '')
            + (gbPerfPct(r) === null ? '' : ' (' + gbPerfPct(r) + '%)')
          : ''));
  });
  L.push('\n[선행 지표]');
  const ls = (p.leads || []).filter(x => String(x.name || '').trim());
  if(!ls.length) L.push('(아직 없음)');
  ls.forEach((x, i) => {
    L.push((i + 1) + ') ' + x.name
      + (String(x.target || '').trim()
          ? ' : ' + (x.current || '0') + (x.unit || '') + ' / ' + x.target + (x.unit || '')
            + (gbPerfPct(x) === null ? '' : ' (' + gbPerfPct(x) + '%)')
          : '')
      + (String(x.why || '').trim() ? '\n   왜 이 지표인가: ' + x.why.trim() : ''));
  });
  const put = (t, v) => { L.push('\n[' + t + ']'); L.push(String(v || '').trim() || '(아직 없음)'); };
  put('왜 이 지표인가', p.why);
  put('어떻게 집중했나', p.how);
  put('달성 · 인과', p.causal);
  put('시행착오 → 교훈', p.lesson);
  return L.join('\n');
}
async function gbPerfCopy(pid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  const t = gbPerfText(p);
  try{ await navigator.clipboard.writeText(t); toast('📋 성과 정리를 글로 복사했습니다'); }
  catch(e){ prompt('아래 내용을 복사해 쓰세요', t); }
}

/* ── 🤖 AI 로 다듬기 ────────────────────────────────────────────
   발표 톤으로 고쳐 주고, 「결과 지표만 있고 선행 지표가 없다」 처럼
   빠진 것을 짚어 줍니다. 없는 사실은 지어내지 않습니다. */
async function gbPerfAI(pid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  const body = gbPerfText(p);
  if(body.replace(/\(아직 없음\)/g, '').replace(/[^가-힣a-zA-Z0-9]/g, '').length < 30){
    alert('조금 더 적어주세요.\n\n적어도 결과 지표와 선행 지표 하나는 있어야\nAI 가 다듬을 거리가 생깁니다.');
    return;
  }
  if((p.ai || '').trim() && !confirm('이미 다듬어 둔 글이 있습니다.\n\n새로 다듬을까요?')) return;

  aiState.busy = 'perf:' + p.id; render();
  try{
    let out = await apiJson('ai.php?action=prompt', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ kind:'growth', brand: gbName(p.who), book: body })
    });
    if(out['진행중']){
      aiState.wait = 0; render();
      out = await waitTask(out['작업번호'], 'prompt', sec => { aiState.wait = sec; render(); });
    }
    p.ai   = String(out['프롬프트'] || '').trim();
    p.aiAt = new Date().toISOString();
    markDirtyAll(); render();
    toast('✨ 발표 톤으로 다듬었습니다');
  }catch(e){
    alert('다듬지 못했습니다.\n\n' + apiErrText(e));
  }finally{
    aiState.busy = ''; aiState.wait = 0; render();
  }
}

/* ── 📐 판으로 — 선행 지표 → 결과 지표 흐름도 ────────────────── */
function gbPerfBoard(p){
  let b = wbBoards().find(x => x.id === p.wbId);
  if(b) return b;
  const br = (data.brands || []).find(x => x.id === p.brandId);
  b = { id: uid('wb'), name: ((br && br.name) || '') + ' · ' + gbName(p.who) + ' 성과',
        nodes: [], edges: [], from: { who: p.who, year: p.year, perf: p.id },
        createdAt: new Date().toISOString() };
  wbBoards().unshift(b);
  p.wbId = b.id;
  markDirtyAll();
  return b;
}
function gbPerfFlow(pid){
  const p = gbPerfs().find(x => x.id === pid); if(!p) return;
  const ls = (p.leads || []).filter(x => String(x.name || '').trim());
  const rs = gbResults(p).filter(x => String(x.name || '').trim());
  const r  = rs[0] || { name:'', target:'', current:'', unit:'' };
  if(!rs.length && !ls.length){
    toast('⚠️ 결과 지표나 선행 지표를 먼저 적어주세요'); return;
  }
  const b = gbPerfBoard(p);
  const had = (b.nodes || []).filter(n => n.src === 'gp').length;
  if(had && !confirm('적어 둔 것으로 판을 다시 그릴까요?\n\n'
    + '손으로 만든 것과 사진은 그대로 둡니다. 전에 그린 ' + had + '개만 새로 그립니다.')) return;

  const gone = {};
  (b.nodes || []).forEach(n => { if(n.src === 'gp') gone[n.id] = 1; });
  b.nodes = (b.nodes || []).filter(n => !gone[n.id]);
  b.edges = (b.edges || []).filter(e => !gone[e.from] && !gone[e.to]);

  const N = [], E = [];
  const put  = o => { const n = Object.assign({ id: uid('wn'), kind:'note', color:'gray',
                                                src:'gp', text:'' }, o); N.push(n); return n; };
  const link = (a, c) => { if(a && c) E.push({ id: uid('we'), from: a.id, to: c.id }); };
  const H = (t, min) => Math.max(min || 80, Math.min(320, 40
    + String(t || '').split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / 20)), 0) * 21));

  const br = (data.brands || []).find(x => x.id === p.brandId);
  // 가로로 너무 벌어지면 열었을 때 글씨가 작아집니다 — 세 칸으로 좁히고
  // 마무리(달성·교훈·약속)는 결과 아래로 내려 붙입니다
  const X = [40, 430, 830];
  let y = 40;
  put({ kind:'text', x:X[0], y:y, w:800, h:56, color:'dark',
        text: ((br && br.name) || '') + ' · ' + gbName(p.who) + ' · ' + p.year + '년 성과' });
  y += 92;

  // ① 왜 이 지표인가 → ② 어떻게 집중했나 (같은 열에 쌓습니다)
  const whyT = '왜 이 지표인가\n\n' + (String(p.why || '').trim() || '(아직 없음)');
  const why  = put({ x:X[0], y:y, w:340, h:H(whyT, 110), color:'blue', text: whyT });
  let hy = y + why.h + 18;
  const hows = String(p.how || '').split('\n').map(v => v.trim()).filter(Boolean);
  const howN = hows.map(v => {
    const n = put({ x:X[0], y:hy, w:340, h:H(v, 70), color:'gray', text: v });
    hy += n.h + 12;
    return n;
  });
  howN.forEach(n => link(why, n));

  // ③ 선행 지표
  let ly = y;
  const leadN = ls.map((x, i2) => {
    const pc = gbPerfPct(x);
    const t = '선행 ' + (i2 + 1) + '. ' + x.name
      + (String(x.target || '').trim()
          ? '\n' + (x.current || '0') + (x.unit || '') + ' / ' + x.target + (x.unit || '')
            + (pc === null ? '' : '  (' + pc + '%)')
          : '')
      + (String(x.why || '').trim() ? '\n— ' + x.why.trim() : '');
    const n = put({ x:X[1], y:ly, w:340, h:H(t, 92), color:'yellow', text: t });
    ly += n.h + 14;
    return n;
  });
  howN.forEach((n, i2) => { if(leadN.length) link(n, leadN[Math.min(i2, leadN.length - 1)]); });
  if(!howN.length) leadN.forEach(n => link(why, n));

  // ④ 결과 지표 — 그 아래로 달성·교훈·약속을 이어 붙입니다
  const rp = gbPerfPct(r);
  // 결과 지표가 여러 개면 한 칸에 줄로 나눠 적습니다
  const resT = '결과 지표\n\n' + (rs.length
    ? rs.map(x => {
        const xp = gbPerfPct(x);
        return x.name
          + (String(x.target || '').trim()
              ? '\n' + (x.current || '0') + (x.unit || '') + ' / ' + x.target + (x.unit || '')
                + (xp === null ? '' : '  (' + xp + '%)')
              : '');
      }).join('\n\n')
    : '(아직 없음)');
  const res = put({ x:X[2], y:y, w:330, h:H(resT, 110), color:'green', text: resT });
  leadN.forEach(n => link(n, res));
  if(!leadN.length) link(why, res);

  let ry = y + res.h + 18, prev = res;
  [['달성 · 인과', p.causal, 'green'],
   ['시행착오 → 교훈', p.lesson, 'pink']].forEach(pair => {
    if(!String(pair[1] || '').trim()) return;
    const txt = pair[0] + '\n\n' + String(pair[1]).trim();
    const n = put({ x:X[2], y:ry, w:330, h:H(txt, 96), color:pair[2], text: txt });
    ry += n.h + 14;
    link(prev, n); prev = n;
  });

  b.nodes = (b.nodes || []).concat(N);
  b.edges = (b.edges || []).concat(E);
  b.updatedAt = new Date().toISOString();
  markDirtyAll();
  gbWb = { loose: b.id };
  render();
  setTimeout(wbFit, 40);
  toast('📐 ' + N.length + '개를 이어서 그렸습니다');
}
