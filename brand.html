  .bk-print .pph i{margin-left:auto;font-style:normal;font-family:var(--f-mono);
    color:#16181d}
  .bk-print .ppf{display:flex;align-items:center;gap:8px;margin-top:6mm;
    padding-top:2.5mm;border-top:1px solid #e3e5ea;font-size:8.5pt;color:#8a8f98}
  .bk-print .ppf i{margin-left:auto;font-style:normal;font-family:var(--f-mono)}
  /* 색과 배경을 그대로 (브랜드 색이 회색으로 빠지지 않게) */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  a[href]:after{content:''!important}
  @page{size:A4;margin:14mm 13mm}
}

/* 📄 원본 / ✎ 우리 칸 — 같은 파일의 두 얼굴 */
.bk-src{display:flex;align-items:stretch;gap:7px;margin-top:10px}
.bk-src button{flex:0 1 auto;display:flex;flex-direction:column;gap:1px;
  padding:7px 13px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg-secondary);font-family:inherit;font-size:12.5px;font-weight:700;
  color:var(--text-muted);cursor:pointer;text-align:left;transition:.16s var(--ease)}
.bk-src button span{font-size:10.5px;font-weight:500;color:var(--text-muted)}
.bk-src button:hover{border-color:var(--ink);color:var(--text-primary)}
.bk-src button.on{background:var(--bg-card);border-color:var(--ink);
  color:var(--text-primary);box-shadow:var(--shadow-sm)}
.bk-src button.on span{color:var(--text-secondary)}
.bk-src .dl{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;
  padding:0 13px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg-secondary);font-size:15px;color:var(--text-muted);
  text-decoration:none}
.bk-src .dl:hover{border-color:var(--ink);color:var(--text-primary)}
/* 📄 원본 한 쪽 — 종이처럼 가운데에 */
/* 종이만 놓습니다 — 바탕 칸(테두리 · 회색 · 그림자)은 두지 않습니다.
   전에는 종이가 840px 에서 멎는데 바탕 칸은 폭을 다 써서, 양옆에
   회색 띠 둘이 서 있는 것처럼 보였습니다. */
.pw-orig .bk-pg{padding:0;background:none;border:0;border-radius:0;box-shadow:none;
  display:flex;align-items:flex-start;justify-content:center;overflow:visible}
.pw-orig .bk-pg::before{display:none}
.pw-orig .bk-wrap{display:flex;align-items:stretch;gap:6px}
.pdf-box{width:100%;max-width:none;min-height:340px;display:flex;
  align-items:center;justify-content:center}
.pdf-box canvas{display:block;border-radius:2px;box-shadow:var(--shadow-md)}
.pdf-wait{padding:80px 0;font-size:13px;color:var(--text-muted)}
.pdf-err{padding:26px 22px;text-align:center;font-size:13.5px;font-weight:700;
  color:var(--red);line-height:1.8}
.pdf-err span{display:block;margin-top:6px;font-size:12px;font-weight:400;
  color:var(--text-secondary);word-break:break-all}
.pdf-err i{display:block;margin-top:9px;font-size:11.5px;font-style:normal;
  color:var(--text-muted);word-break:keep-all}
/* HTML 브랜드북 — 통째로 끼워 넣습니다 (쪽이 없어 안에서 밀어 내립니다) */
/* 높이는 그 쪽 높이에 맞춰 코드가 정해 줍니다 (한 장만 보이게) */
.bk-ifr{display:block;width:100%;height:auto;min-height:200px;margin:12px auto 0;
  border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.bk-ifr iframe{display:block;width:100%;height:100%;border:0;background:#fff}
/* 쪽수 양옆의 작은 넘김 단추 (종이 옆의 큰 빈 칸을 없앴습니다) */
.bk-turn{margin-left:auto;display:flex;align-items:center;gap:2px}
.bk-turn button{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:7px;background:var(--bg-secondary);
  font-size:15px;line-height:1;color:var(--text-muted);cursor:pointer}
.bk-turn button:hover:not(:disabled){border-color:var(--ink);color:var(--text-primary)}
.bk-turn button:disabled{opacity:.35;cursor:default}
.bk-turn .bk-n{margin:0 4px}
/* 📖 새 장이 조용히 들어와 놓입니다.
   전에는 한 번 들렸다 <<반대로 젖혔다>> 돌아와서 촐싹거렸습니다 —
   왕복을 없애고 한 방향으로만, 짧고 부드럽게. */
@keyframes bkflipF{
  0%  {opacity:.2;transform:translateX(14px)}
  100%{opacity:1;transform:none}
}
@keyframes bkflipB{
  0%  {opacity:.2;transform:translateX(-14px)}
  100%{opacity:1;transform:none}
}
.turn-f{animation:bkflipF .26s cubic-bezier(.22,.61,.36,1)}
.turn-b{animation:bkflipB .26s cubic-bezier(.22,.61,.36,1)}
@media(prefers-reduced-motion:reduce){ .turn-f,.turn-b{animation:none} }
/* ✎ 이대로 고치기 — 원본 모양 그대로 손보는 줄 */
.bk-ed{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.bk-ed button{padding:6px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-secondary);font-family:inherit;font-size:12px;font-weight:700;
  color:var(--text-secondary);cursor:pointer}
.bk-ed button:hover:not(:disabled){border-color:var(--ink);color:var(--text-primary)}
.bk-ed button:disabled{opacity:.5;cursor:default}
.bk-ed .go,.bk-ed .dn{background:var(--ink);border-color:var(--ink);color:#fff}
.bk-ed .sv{background:var(--blue);border-color:var(--blue);color:#fff}
.bk-ed.dirty .sv{animation:bkpulse 1.6s ease-in-out infinite}
@keyframes bkpulse{50%{opacity:.62}}
.bk-ed span{font-size:11.5px;font-weight:500;color:var(--text-muted)}
.bk-ed span b{color:var(--text-secondary)}
.pw-orig.bk-on .bk-ifr{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
/* 쪽 고르기 — 11 장이 넘어가면 한 장씩 넘기기가 답답합니다 */
.pdf-th{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
.pdf-th button{min-width:31px;padding:5px 7px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg-page);cursor:pointer;
  font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--text-muted)}
.pdf-th button:hover{border-color:var(--ink);color:var(--text-primary)}
.pdf-th button.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media(max-width:720px){ .bk-src{flex-wrap:wrap} .bk-src button{flex:1 1 40%} }

/* 📚 책으로 보기 — 한 장씩 넘겨 봅니다 (카탈로그 넘기듯) */
.pw-bk .pw-top{display:flex;align-items:center;gap:10px}
.pw-bk .bk-n{margin-left:auto;font-family:var(--f-mono);font-size:12px;font-weight:700;
  color:var(--text-muted);letter-spacing:.04em}
.bk-wrap{display:flex;align-items:stretch;gap:12px;margin-top:10px}
/* 📖 원본 — 종이 양옆의 넘김 단추. 큰 빈 상자로 보이지 않게 얇게 두고,
   바탕은 손을 올렸을 때만 옅게 비칩니다. */
.pw-orig .bk-nav{flex:0 0 44px;align-self:stretch;display:flex;align-items:center;
  justify-content:center;gap:0;border:0;border-radius:12px;background:none;
  box-shadow:none;font-size:26px;line-height:1;color:var(--text-muted);
  cursor:pointer;transition:.15s var(--ease)}
.pw-orig .bk-nav span{display:none}
.pw-orig .bk-nav:hover:not(:disabled){background:var(--bg-hover);color:var(--text-primary)}
.pw-orig .bk-nav:disabled{opacity:.22;cursor:default;background:none}
@media(max-width:720px){ .pw-orig .bk-nav{flex:0 0 30px;font-size:21px} }
/* 넘기는 단추는 글 <<바깥>> 에 둡니다 — 글 위에 겹치면 고치려다 넘어갑니다 */
.bk-nav{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg-secondary);font-family:inherit;font-size:19px;font-weight:700;
  color:var(--text-muted);cursor:pointer;transition:.16s var(--ease)}
.bk-nav span{font-size:11px;font-weight:700;letter-spacing:-.01em}
.bk-nav:hover:not(:disabled){background:var(--bg-card);border-color:var(--ink);
  color:var(--text-primary);box-shadow:var(--shadow-sm)}
.bk-nav:disabled{opacity:.28;cursor:default}
/* 한 장 — 종이처럼 */
.bk-pg{flex:1 1 auto;min-width:0;position:relative;border:1px solid var(--border);
  border-radius:14px;background:var(--bg-card);box-shadow:var(--shadow-md);
  padding:26px 30px 14px;overflow:hidden}
.bk-pg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(90deg,rgba(0,0,0,.07),transparent)}
.bk-in{min-height:340px}
.bk-in > .ob:first-child{margin-top:0}
.bk-in > .pw-cov{margin:0}
.bk-ft{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:9px;
  border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.bk-ft span{font-weight:700}
.bk-ft i{margin-left:auto;font-family:var(--f-mono);font-style:normal;font-weight:700}
@keyframes bkFwd{from{opacity:0;transform:translateX(16px) rotateY(-2deg)}
                 to{opacity:1;transform:none}}
@keyframes bkBwd{from{opacity:0;transform:translateX(-16px) rotateY(2deg)}
                 to{opacity:1;transform:none}}
.bk-pg.fwd{animation:bkFwd .26s var(--ease)}
.bk-pg.bwd{animation:bkBwd .26s var(--ease)}
@media(prefers-reduced-motion:reduce){ .bk-pg.fwd,.bk-pg.bwd{animation:none} }
.bk-hint{margin:10px 0 0;text-align:center;font-size:11.5px;color:var(--text-muted)}
.bk-hint b{font-family:var(--f-mono);font-weight:700;color:var(--text-secondary)}
/* 아래의 작은 장들 — 어디쯤인지 · 어디로 갈지 */
.bk-th{display:flex;gap:8px;margin-top:14px;padding:4px 2px 8px;overflow-x:auto}
.bk-th .t1{flex:0 0 118px;display:flex;flex-direction:column;gap:3px;min-width:0;
  padding:9px 10px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-secondary);cursor:pointer;text-align:left;font-family:inherit;
  transition:.16s var(--ease)}
.bk-th .t1:hover{border-color:var(--ink);background:var(--bg-card)}
.bk-th .t1.on{border-color:var(--ink);background:var(--bg-card);
  box-shadow:var(--shadow-sm)}
.bk-th .t1 .tn{font-family:var(--f-mono);font-size:9.5px;font-weight:700;
  letter-spacing:.06em;color:var(--text-muted)}
.bk-th .t1.on .tn{color:var(--blue)}
.bk-th .t1 .te{font-size:14px;line-height:1}
.bk-th .t1 .tt{font-size:11.5px;font-weight:800;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-th .t1 .tx{font-size:10px;line-height:1.45;color:var(--text-muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:keep-all}
@media(max-width:720px){
  .bk-wrap{flex-wrap:wrap}
  .bk-pg{flex:1 1 100%;order:1;padding:20px 17px 12px}
  .bk-nav{flex:1 1 0;order:2;flex-direction:row;padding:9px 0;font-size:16px}
  .bk-in{min-height:260px}
}

/* 📗 브랜드북 — 평소에 올리는 것은 이것 하나입니다 */
.pt-get .bbk{display:grid;grid-template-columns:1fr auto;gap:10px 16px;
  align-items:start}
.pt-get .bbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px}
.pt-get .bbl b{font-size:11.5px;font-weight:600;line-height:1.6;color:var(--text-secondary);
  word-break:keep-all}
.pt-get .bbk > .btn{grid-row:1 / span 1;white-space:nowrap}
.pt-get .bbn{grid-column:1 / -1;font-size:11px;line-height:1.75;color:var(--text-muted);
  word-break:keep-all}
.pt-get .bbn b{color:var(--text-secondary);font-weight:700}
.pt-get .gx{margin-top:11px;padding-top:10px;border-top:1px dashed var(--border)}
.pt-get .gx > summary{font-size:11.5px;font-weight:600;color:var(--text-muted);
  cursor:pointer;list-style:none}
.pt-get .gx > summary::-webkit-details-marker{display:none}
.pt-get .gx > summary::before{content:'▸ ';color:var(--text-muted)}
.pt-get .gx[open] > summary::before{content:'▾ '}
.pt-get .gx > summary:hover{color:var(--text-primary)}
.pt-get .gx .gk{margin-top:9px}
@media(max-width:820px){
  .pt-get .bbk{grid-template-columns:1fr}
  .pt-get .bbl{grid-template-columns:1fr}
}

/* 📥 문서에서 가져오기 — 갈래 셋이 어디로 들어가는지까지 */
.pt-get{border:1px solid var(--blue);border-radius:12px;background:var(--bg-card);
  padding:14px 16px 13px;margin:0 0 14px}
.pt-get .ph{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;
  font-size:13.5px;font-weight:800;color:var(--text-primary);margin-bottom:11px}
.pt-get .ph span{flex:1 1 260px;min-width:0;font-size:11.5px;font-weight:400;
  color:var(--text-muted);line-height:1.6;word-break:keep-all}
.pt-get .ph .x{flex:0 0 auto;margin-left:auto}
.pt-get .gk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.pt-get .g1{display:flex;flex-direction:column;gap:6px;min-width:0;padding:11px 12px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg-secondary)}
.pt-get .gh b{display:block;font-size:13.5px;font-weight:800;color:var(--text-primary)}
.pt-get .gh span{display:block;margin-top:3px;font-size:11.5px;line-height:1.6;
  color:var(--text-secondary);word-break:keep-all}
.pt-get .gw{font-size:11px;line-height:1.55;color:var(--blue);font-weight:600;
  word-break:keep-all}
.pt-get .gb{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.pt-get .gf{margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);
  font-size:11.5px;line-height:1.75;color:var(--text-muted);word-break:keep-all}
.pt-get .gf a{color:var(--blue);font-weight:600}
@media(max-width:820px){ .pt-get .gk{grid-template-columns:1fr} }

/* 지침서를 글로 붙여넣는 칸 */
.pt-box{border:1px solid var(--blue);border-radius:12px;background:var(--bg-card);
  padding:13px 15px;margin:0 0 14px}
.pt-box .ph{font-size:13.5px;font-weight:800;color:var(--text-primary);margin-bottom:9px}
.pt-box .ph span{display:block;font-size:11.5px;font-weight:400;color:var(--text-muted);
  margin-top:2px}
.pt-box textarea{width:100%;box-sizing:border-box;min-height:200px;font-family:inherit;
  font-size:14px;line-height:1.85;padding:11px 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);
  resize:vertical}
.pt-box textarea:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.pt-box .pa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.pt-box .pa .hint{font-size:11.5px;color:var(--text-muted);word-break:keep-all}
.gonecard.stale{border-color:var(--amber,#f59e0b);
  background:rgba(245,158,11,.08);color:var(--text-primary)}

/* 🏷️ 브랜드 정리 — 한 일마다 어느 브랜드 것인지 한 화면에서 */
.gb-fix{border:1px solid var(--blue);border-radius:12px;background:var(--bg-card);
  padding:12px 14px;margin:0 0 14px}
.gb-fix .fh{margin-bottom:9px;line-height:1.7}
.gb-fix .fh b{font-size:13.5px;font-weight:800;color:var(--text-primary)}
.gb-fix .fh span{display:block;font-size:11.5px;color:var(--text-muted)}
.gb-fix .fr{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-top:1px solid var(--border-light)}
.gb-fix .fr .no{flex:0 0 auto;width:20px;text-align:right;font-size:11px;font-weight:800;
  color:var(--text-muted);font-variant-numeric:tabular-nums}
.gb-fix .fr .tt{flex:1 1 auto;min-width:0;font-size:13px;font-weight:700;
  color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb-fix .fr .sg{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--bg-sunken);border-radius:99px;padding:2px 8px;white-space:nowrap}
.gb-fix .fr select{flex:0 0 auto;max-width:190px;font-family:inherit;font-size:12px;
  padding:4px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary)}
.gb-fix .fr.no select{border-color:var(--amber,#f59e0b)}
.gb-fix .fr select:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
/* 브랜드 없음 탭에서 짚어 주는 칸 */
.gb-nob{border:1px solid var(--amber,#f59e0b);border-radius:12px;padding:12px 14px;
  margin:0 0 14px;background:rgba(245,158,11,.08);font-size:13px;font-weight:700;
  line-height:1.8;color:var(--text-primary);word-break:keep-all}
.gb-nob span{display:block;font-weight:400;font-size:12px;color:var(--text-muted);
  margin-bottom:8px}
/* 사진으로 뽑을 때 맨 위에 브랜드 이름 */
/* 퇴사 처리된 사람 — 흐리게, 「퇴사」 를 달아서 */
.btn.gb-gone{opacity:.72}
.btn.gb-gone i{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 5px;
  border-radius:99px;background:var(--bg-sunken);color:var(--text-muted);margin-left:3px}
.btn.gb-gone.primary{opacity:1}
.btn.gb-gone.primary i{background:rgba(255,255,255,.22);color:#fff}
.gb-gonebar{display:flex;flex-direction:column;gap:3px;margin:0 0 12px;padding:10px 13px;
  border:1px solid var(--border);border-left:4px solid var(--text-muted);
  border-radius:var(--r-sm);background:var(--bg-sunken);
  font-size:13.5px;color:var(--text-primary)}
.gb-gonebar .t{font-weight:600}
.gb-gonebar .ga{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}
.gb-gonebar .ga .hint{font-size:11.5px;color:var(--text-muted)}
/* 읽어온 문서 — 접어 둔 나머지 */
.pw-more{display:inline}
.pw-more summary{display:inline;list-style:none;cursor:pointer;font-weight:700;
  color:var(--text-muted)}
.pw-more summary::-webkit-details-marker{display:none}
.pw-more summary::before{content:' · ▸ '}
.pw-more[open] summary::before{content:' · ▾ '}
.pw-more[open] summary{display:block;margin-top:4px}
/* 🏁 줄기에 처음이 없을 때 */
.pw-gap{display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  margin:0 0 13px;padding:12px 14px;border:1px solid var(--border);
  border-left:4px solid var(--amber,#f59e0b);border-radius:var(--r-sm);
  background:rgba(192,119,8,.06)}
.pw-gap .t{font-size:14px;font-weight:600;color:var(--text-primary)}
.pw-gap span{font-size:12.5px;line-height:1.6;color:var(--text-muted)}
.pw-gap .btn{margin-top:4px}
/* 옮기기 안내는 「빠진 것」 이 아니라 「해 두면 좋은 것」 이라 파랑입니다 */
.pw-gap.tidy{border-left-color:var(--blue);background:var(--blue-soft);margin-top:4px}
/* 🗑 전부 비우기 — 고치기 맨 아래, 다른 것과 떨어뜨려 둡니다 */
.pe-wipe{display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  margin:26px 0 8px;padding:14px 16px;border:1px dashed var(--red,#d93b3b);
  border-radius:var(--r-sm);background:rgba(217,59,59,.05)}
.pe-wipe .t{font-size:14px;font-weight:800;color:var(--red,#d93b3b)}
.pe-wipe span{font-size:12.5px;line-height:1.7;color:var(--text-secondary)}
.pe-wipe .btn{margin-top:5px}
/* ═══ 🧭 팀 온보딩 ═══ */
/* 한눈에 보는 카드 — 누르면 아래에 그 단만 펴집니다 */
/* 목차 — 고르개가 아니라 목차입니다. 누르면 그 단으로 굴러갑니다 */
.ob-cards{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 4px;padding:18px 0;
  border-bottom:1px solid var(--border)}
.ob-card{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;
  font-family:inherit;padding:8px 14px 8px 11px;border-radius:99px;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
  transition:border-color .15s,background .15s,color .15s}
.ob-card:hover{border-color:var(--blue);color:var(--blue)}
.ob-card .no{flex:0 0 auto;width:18px;height:18px;border-radius:50%;
  background:var(--bg-sunken);color:var(--text-muted);display:flex;align-items:center;
  justify-content:center;font-size:10.5px;font-weight:800}
.ob-card .ic{font-size:14px;line-height:1}
.ob-card .ti{font-size:14px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.ob-card.on{background:var(--ink);border-color:var(--ink);color:var(--bg-card)}
.ob-card.on .no{background:transparent;color:inherit;opacity:.65}
.ob-card.on .ti{font-weight:800}
.ob-card.all .ct{font-size:11px;font-weight:800;color:var(--text-muted);
  font-variant-numeric:tabular-nums}
.ob-card.all.on .ct{color:inherit;opacity:.7}
.ob-card.all{margin-right:5px}
/* 좁은 화면에서도 옆으로 밀지 않고 두 줄로 접습니다 — 밀어야 보이는 목차는
   있는 줄도 모릅니다 */
@media(max-width:620px){.ob-card{padding:7px 12px 7px 9px}
  .ob-card .ti{font-size:13px;white-space:normal}}
.ob-wrap{display:flex;flex-direction:column;margin-top:0}
.ob-sec{border-left:0;padding:38px 0 42px;border-top:1px solid var(--border)}
.ob-wrap > .ob-sec:first-child{border-top:0}
/* 카드 밑 단추 — 얹었을 때만 나옵니다 (읽을 때는 글만 보이게) */
.ob-en .en-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;
  opacity:0;transition:opacity .12s}
.ob-en:hover .en-a{opacity:1}
.ob-en .en-a .del:hover{border-color:var(--red);color:var(--red)}
@media (hover:none){.ob-en .en-a{opacity:1}}
/* 조직도에서 늘리는 마디 */
.ob-chart .pl > .nd.add{padding:3px 11px;border:1px dashed var(--border);
  background:transparent;color:var(--text-muted);cursor:pointer;white-space:nowrap;
  font-family:inherit;font-size:11.5px;font-weight:700;box-shadow:none}
.ob-chart .pl > .nd.add:hover{border-color:var(--blue);color:var(--blue);
  border-style:solid}
.ob-sh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.ob-sh .no{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;
  font-weight:800}
.ob-sh h3{margin:0;font-size:19px;letter-spacing:-.015em;color:var(--text-primary)}
.ob-sh p{margin:0;font-size:13px;color:var(--text-muted)}
.ob-sh.ed{gap:6px}
.ob-sh .ic{flex:0 0 52px;text-align:center}
.ob-sh .ti{flex:1 1 180px;font-weight:700}
.ob-sh .ac{margin-left:auto;display:flex;gap:4px}
.ob-note{width:100%;margin-bottom:9px}
/* 항목은 카드로 — 가로를 안 쓰고 한 줄로 늘어놓으니 오른쪽이 텅 비고
   글씨가 다 같은 크기여서 무엇이 중요한지 안 보였습니다 */
/* ── 🧭 온보딩 — 문서 한 장처럼 ────────────────────────────────
   번호는 고정폭 글꼴로 작게, 제목은 크게, 항목은 1px 틈으로만 가른 격자에.
   칸마다 테두리를 두르면 상자가 겹쳐 지저분해집니다. */
:root{--f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}

/* 머리말 */
.ob-hero{padding:30px 0 36px}
.ob-hero .eyebrow{margin:0;font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.17em;text-transform:uppercase;color:var(--text-muted)}
.ob-hero h1{margin:13px 0 0;font-size:clamp(25px,4.2vw,40px);font-weight:800;
  letter-spacing:-.035em;line-height:1.22;max-width:19ch;color:var(--text-primary);
  word-break:keep-all}
.ob-hero .sub{margin:14px 0 0;max-width:52ch;font-size:15.5px;line-height:1.75;
  color:var(--text-secondary);word-break:keep-all}
.ob-hero .hst{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);border-radius:3px;
  overflow:hidden;margin-top:30px}
.ob-hero .hst .st{background:var(--bg-card);padding:15px 15px 17px;display:flex;
  flex-direction:column}
.ob-hero .hst .v{font-family:var(--f-mono);font-size:29px;font-weight:600;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.ob-hero .hst .k{margin-top:8px;font-size:11.5px;line-height:1.5;color:var(--text-muted);
  word-break:keep-all}

/* 단 머리 */
.ob-sh.rd{display:flex;gap:15px;align-items:baseline;margin-bottom:24px}
.ob-sh.rd .sn{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;font-weight:700;
  letter-spacing:.1em;color:var(--blue)}
.ob-sh.rd .sh-b{min-width:0}
.ob-sh.rd h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;
  line-height:1.3;color:var(--text-primary);word-break:keep-all}
.ob-sh.rd p{margin:6px 0 0;max-width:58ch;font-size:13.5px;line-height:1.7;
  color:var(--text-secondary);word-break:keep-all}

/* 항목 격자 — 1px 틈으로만 가릅니다 */
.ob-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:3px;
  overflow:hidden}
.ob-en{background:var(--bg-card);padding:21px 20px 23px;display:flex;
  flex-direction:column;gap:11px}
.ob-en .en-h{display:flex;flex-direction:column;gap:3px}
.ob-en .en-no{font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.1em;color:var(--text-muted)}
.ob-en h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.022em;line-height:1.4;
  color:var(--text-primary);word-break:keep-all}
.ob-en .lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--text-secondary);
  white-space:pre-wrap;word-break:keep-all}
.ob-en .lead.dim{color:var(--text-muted);display:flex;align-items:center;gap:7px}
/* 아래로 밀지 않습니다 — 글이 바로 이어져야 읽힙니다 (칩만 아래에 붙습니다) */
.ob-en .ob-ks{display:flex;flex-direction:column;gap:11px;margin-top:2px;padding-top:3px;
  border-top:0}
.ob-en .ob-k{display:block;position:relative;padding-left:13px}
.ob-en .ob-k::before{content:'';position:absolute;left:0;top:9px;width:6px;height:1.5px;
  background:var(--blue)}
.ob-en .ob-k b{display:block;font-size:12px;font-weight:800;letter-spacing:.02em;
  color:var(--text-primary);margin-bottom:2px;word-break:keep-all}
.ob-en .ob-k span{display:block;font-size:13.5px;line-height:1.65;
  color:var(--text-secondary);white-space:pre-wrap;word-break:keep-all}
.ob-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:3px}
.ob-chips .chip{font-family:var(--f-mono);font-size:11.5px;font-weight:500;
  background:var(--bg-sunken);color:var(--text-secondary);border:0;padding:4px 9px;
  border-radius:2px}
.ob-emp{margin:0;font-size:13.5px;color:var(--text-muted)}

/* ── 🌳 조직도 — 층위를 보여줘야 할 때 ───────────────────────────
   선은 li 의 가상요소로 긋습니다. 한 층이 늘어도 규칙이 같아 안 어긋납니다. */
.ob-chartbox{background:var(--bg-card);border:1px solid var(--border);border-radius:3px;
  padding:26px 18px 24px;overflow-x:auto}
.ob-chart{min-width:max-content;margin:0 auto;display:table}
.ob-chart ul{display:flex;justify-content:center;padding-top:22px;position:relative;
  margin:0;list-style:none}
.ob-chart > ul{padding-top:0}
/* 뿌리가 없으면 맨 윗줄에는 잇는 선을 긋지 않습니다 */
.ob-chart.noroot > ul > li{padding-top:0}
.ob-chart.noroot > ul > li::before,.ob-chart.noroot > ul > li::after{display:none}
.ob-chart.noroot > ul{gap:26px}
.ob-chart li{position:relative;padding:22px 7px 0;text-align:center;list-style:none}
.ob-chart li::before,.ob-chart li::after{content:'';position:absolute;top:0;right:50%;
  border-top:1px solid var(--border-light);width:50%;height:22px}
.ob-chart li::after{right:auto;left:50%;border-left:1px solid var(--border-light)}
.ob-chart li:only-child{padding-top:0}
.ob-chart li:only-child::before,.ob-chart li:only-child::after{display:none}
.ob-chart li:first-child::before,.ob-chart li:last-child::after{border:0 none}
.ob-chart li:last-child::before{border-right:1px solid var(--border-light)}
.ob-chart ul ul::before{content:'';position:absolute;top:0;left:50%;
  border-left:1px solid var(--border-light);width:0;height:22px}
.nd{display:inline-flex;flex-direction:column;gap:2px;align-items:center;
  border:1px solid var(--border-light);background:var(--bg-card);padding:9px 14px;
  border-radius:3px;min-width:84px;font-size:13.5px;font-weight:700;
  color:var(--text-primary);word-break:keep-all}
.nd.root{background:var(--ink);color:var(--bg-card);border-color:var(--ink);
  font-size:14.5px;padding:11px 22px}
.nd.lv2{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.nd.lv3{background:var(--bg-sunken)}
.nd.leaf{font-weight:500;font-size:12.5px;padding:7px 11px;min-width:0;
  color:var(--text-secondary);border-style:dashed}
.ob-lg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:11.5px;
  color:var(--text-muted);align-items:center}
.ob-lg span{display:inline-flex;align-items:center;gap:6px}
.ob-lg .lg{width:14px;height:11px;border-radius:2px;border:1px solid var(--border-light);
  flex:none}
.ob-lg .lg.root{background:var(--ink);border-color:var(--ink)}
.ob-lg .lg.lv2{background:var(--blue-soft);border-color:var(--blue)}
.ob-lg .lg.lv3{background:var(--bg-sunken)}
.ob-lg .lg.leaf{border-style:dashed}

/* ── ▦ 표 — 같은 항목을 여러 갈래로 견줄 때 ───────────────────── */
.ob-mxwrap{overflow-x:auto}
.ob-matrix{display:grid;
  grid-template-columns:minmax(92px,max-content) repeat(var(--n),minmax(0,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:3px;
  overflow:hidden;min-width:calc(92px + var(--n) * 190px)}
.ob-matrix .mx{background:var(--bg-card);padding:15px 14px;font-size:13.5px;
  line-height:1.6;color:var(--text-secondary);word-break:keep-all}
.ob-matrix .mx.rowhead{background:var(--bg-sunken);font-family:var(--f-mono);
  font-size:10px;letter-spacing:.1em;color:var(--text-muted);font-weight:700;
  display:flex;align-items:center}
.ob-matrix .mx.head{padding:16px 14px 17px;border-bottom:2px solid var(--tc)}
.ob-matrix .mx.head .tname{font-size:16px;font-weight:800;letter-spacing:-.02em;
  color:var(--tc)}
.ob-matrix .mx-mission{margin:0;font-size:14.5px;font-weight:700;line-height:1.55;
  color:var(--text-primary)}
.ob-hist .hy-t .gap.add{display:block;width:100%;text-align:left;border:none;
  background:transparent;padding:0;cursor:pointer;font-family:inherit;font-size:inherit;
  color:inherit}
.ob-1m span[data-ed]{cursor:pointer}
.ob-1m span[data-ed]:hover{color:var(--text-primary);text-decoration:underline;
  text-underline-offset:3px}
.ob-matrix .mx-non.add{padding:0;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:inherit}
.mx-non{color:var(--text-muted)}
.ob-matrix .mx ul{margin:0;padding:0;list-style:none}
.ob-matrix .mx ul li{position:relative;padding-left:12px;margin-bottom:5px}
.ob-matrix .mx ul li:last-child{margin-bottom:0}
.ob-matrix .mx ul li::before{content:'';position:absolute;left:0;top:9px;width:5px;
  height:1.5px;background:var(--tc)}
.ob-matrix .t-a{--tc:var(--blue)}   .ob-matrix .t-a.head{background:var(--blue-soft)}
.ob-matrix .t-b{--tc:var(--green)}  .ob-matrix .t-b.head{background:rgba(18,161,80,.10)}
.ob-matrix .t-c{--tc:var(--orange)} .ob-matrix .t-c.head{background:rgba(240,135,60,.11)}
.ob-matrix .t-d{--tc:var(--purple)} .ob-matrix .t-d.head{background:rgba(164,140,240,.12)}
.ob-matrix .t-e{--tc:var(--cyan)}   .ob-matrix .t-e.head{background:rgba(63,182,207,.12)}

/* 고치기 — 보기 모양 고르개 */
.ob-sh.ed + .ob-note + .ob-vw,.ob-vw{display:flex;gap:5px;flex-wrap:wrap;
  align-items:center;margin-top:8px}
.ob-vw > button{font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;
  border-radius:99px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-muted);cursor:pointer;white-space:nowrap}
.ob-vw > button:hover{border-color:var(--blue);color:var(--blue)}
.ob-vw > button.on{background:var(--ink);border-color:var(--ink);color:var(--bg-card)}
.ob-vw > input.rt{flex:0 0 190px;min-width:0;box-sizing:border-box;font-family:inherit;font-size:12px;
  padding:5px 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-input);color:var(--text-primary)}
.ob-vw > em{font-style:normal;font-size:11px;color:var(--text-muted)}
.ob-vw > button.yr{border-style:dashed;color:var(--text-secondary)}
.ob-vw > button.yr:hover{border-style:solid}
/* 표 — 해로 된 가로줄 */
.ob-matrix .mx.rowhead.yr{font-family:var(--f-mono);font-size:13px;font-weight:700;
  letter-spacing:0;color:var(--text-primary);font-variant-numeric:tabular-nums;
  white-space:nowrap;align-items:baseline}
.ob-matrix .mx.rowhead.yr.now{color:var(--blue)}
.ob-matrix .mx.rowhead.yr.now::after{content:'지금';margin-left:7px;font-family:inherit;
  font-size:9.5px;font-weight:800;color:#fff;background:var(--blue);border-radius:99px;
  padding:1px 6px;letter-spacing:0}

/* 「작성 필요」 딱지 */
.flag{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:9.5px;
  font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:2px;
  background:rgba(192,119,8,.12);color:var(--yellow);white-space:nowrap}

/* 배포 전에 채울 것 */
.ob-todo{margin-top:40px;padding-top:30px;border-top:1px solid var(--border)}
.ob-todo .cap{margin:0;font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.ob-todo h3{margin:9px 0 18px;font-size:20px;font-weight:800;letter-spacing:-.025em;
  color:var(--text-primary)}
.ob-todo ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:3px;
  overflow:hidden;list-style:none;margin:0;padding:0}
.ob-todo li{background:var(--bg-card);padding:14px 15px;display:grid;
  grid-template-columns:auto minmax(0,1fr);gap:11px;align-items:start}
.ob-todo .box{width:13px;height:13px;border:1.5px solid var(--border-light);
  border-radius:2px;margin-top:3px}
.ob-todo b{display:block;font-size:13.5px;font-weight:700;line-height:1.5;
  color:var(--text-primary);word-break:keep-all}
.ob-todo .loc{display:block;margin-top:3px;font-family:var(--f-mono);font-size:10.5px;
  color:var(--text-muted)}

/* 고치기 — 머리말 칸 */
.ob-hero.ed{display:flex;flex-direction:column;gap:8px}
.ob-hero.ed input,.ob-hero.ed textarea{width:100%;box-sizing:border-box;
  font-family:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg-input);color:var(--text-primary);resize:none;overflow:hidden}
.ob-hero.ed .hb{font-size:12px;color:var(--text-secondary)}
.ob-hero.ed .ht{font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.35}
.ob-hero.ed .hs{font-size:14px;line-height:1.7}
.ob-hero.ed .hst{display:flex;flex-direction:column;gap:6px;margin-top:6px;
  background:transparent;border:0;border-radius:0}
.ob-hero.ed .hs-r{display:flex;gap:6px;align-items:center}
.ob-hero.ed .hs-r .v{flex:0 0 84px;min-width:0;font-family:var(--f-mono);font-weight:700}
.ob-hero.ed .hs-r .k{flex:1 1 auto;min-width:0;font-size:13px}
.ob-hero.ed .hs-r .x{flex:0 0 auto;width:26px;height:26px;border:none;border-radius:7px;
  background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer}
.ob-hero.ed .hs-r .x:hover{background:var(--bg-sunken);color:var(--red)}

@media(max-width:560px){
  .ob-hero{padding:22px 0 26px}
  .ob-hero .hst{margin-top:22px}
  .ob-sh.rd{gap:11px;margin-bottom:18px}
  .ob-sh.rd h3{font-size:20px}
  .ob-en{padding:17px 16px 19px}
}
/* ── 📜 해마다의 히스토리 ────────────────────────────────────── */
.ob-hist{display:flex;flex-direction:column;gap:2px;padding-left:2px}
.ob-hist .hy{position:relative;padding:0 0 26px 26px;border-left:2px solid var(--border)}
.ob-hist .hy:last-child{border-left-color:transparent;padding-bottom:0}
.ob-hist .hy-h{display:flex;align-items:center;gap:9px;margin:0 0 13px;
  transform:translateY(-3px)}
.ob-hist .hy-h .dot{position:absolute;left:-7px;top:0;width:12px;height:12px;
  border-radius:50%;background:var(--bg-card);border:2px solid var(--border-light)}
.ob-hist .hy.now .dot{background:var(--blue);border-color:var(--blue)}
.ob-hist .hy-h b{font-family:var(--f-mono);font-size:19px;font-weight:700;
  letter-spacing:-.02em;color:var(--text-primary);font-variant-numeric:tabular-nums}
.ob-hist .hy.now .hy-h b{color:var(--blue)}
.ob-hist .hy-h em{font-style:normal;font-size:10px;font-weight:800;color:#fff;
  background:var(--blue);border-radius:99px;padding:2px 8px}
.ob-hist .hy-h .ct{font-size:11px;font-weight:700;color:var(--text-muted)}
.ob-hist .hy-h .del{margin-left:auto;padding:3px 9px;border:1px solid var(--border);
  border-radius:99px;background:transparent;font-size:11px;color:var(--text-muted);
  cursor:pointer;opacity:0;transition:opacity .12s}
.ob-hist .hy:hover .del{opacity:1}
.ob-hist .hy-h .del:hover{border-color:var(--red);color:var(--red)}
@media (hover:none){.ob-hist .hy-h .del{opacity:1}}
/* 그 해의 줄 — 이름과 「무엇을」. 이름 칸도 눌러서 고칩니다 */
.ob-hist .hy-t .th{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ob-hist .hy-t .th b{flex:1 1 auto;min-width:0;margin:0}
.ob-hist .hy-t .th .x{flex:0 0 auto;padding:1px 7px;border:1px solid var(--border);
  border-radius:99px;background:transparent;font-size:12px;color:var(--text-muted);
  cursor:pointer;opacity:0;transition:opacity .12s}
.ob-hist .hy-t:hover .th .x{opacity:1}
.ob-hist .hy-t .th .x:hover{border-color:var(--red);color:var(--red)}
@media (hover:none){.ob-hist .hy-t .th .x{opacity:1}}
.ob-hist .hy-ra{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px}
.ob-hist .hy-ra span{font-size:11.5px;color:var(--text-muted)}
/* 팀이 위에 있는 옛 모양에는 「해를 위로」 를 권합니다 */
.ob-hist .hy-flip{display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  padding:13px 15px;margin-bottom:14px;border:1px solid var(--border);
  border-left:4px solid var(--blue);border-radius:var(--r-sm);background:var(--blue-soft)}
.ob-hist .hy-flip b{font-size:13.5px;font-weight:800;color:var(--text-primary)}
.ob-hist .hy-flip span{font-size:12px;line-height:1.65;color:var(--text-secondary)}
.ob-hist .hy-flip .btn{margin-top:4px}
.ob-hist .hy-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);border-radius:3px;
  overflow:hidden}
.ob-hist .hy-t{background:var(--bg-card);padding:15px 16px 17px}
.ob-hist .hy-t > b{display:block;font-size:14px;font-weight:800;letter-spacing:-.015em;
  color:var(--text-primary);margin-bottom:8px;word-break:keep-all}
.ob-hist .hy-t p{margin:0;font-size:13.5px;line-height:1.7;color:var(--text-secondary);
  word-break:keep-all}
.ob-hist .hy-t ul{margin:0;padding:0;list-style:none}
.ob-hist .hy-t ul li{position:relative;padding-left:12px;margin-bottom:6px;
  font-size:13.5px;line-height:1.65;color:var(--text-secondary);word-break:keep-all}
.ob-hist .hy-t ul li:last-child{margin-bottom:0}
.ob-hist .hy-t ul li::before{content:'';position:absolute;left:0;top:9px;width:5px;
  height:1.5px;background:var(--blue)}
/* 읽다가 바로 내년 한 줄 — 고치기로 옮겨 갈 일이 없게 */
.ob-hist .hy-add{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:0 0 16px 26px}
.ob-hist .hy-add .lb{font-size:12px;font-weight:800;color:var(--text-secondary)}
.ob-hist .hy-add input{box-sizing:border-box;width:76px;font-family:var(--f-mono),inherit;
  font-size:14px;font-weight:700;text-align:center;padding:6px 8px;
  border:1px solid var(--border);border-radius:9px;background:var(--bg-input);
  color:var(--text-primary);font-variant-numeric:tabular-nums}
.ob-hist .hy-add input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.ob-hist .hy-add span{font-size:11.5px;color:var(--text-muted)}
.ob-hist .hy-t.non{background:var(--bg-sunken)}
.ob-hist .hy-t .gap{display:flex;align-items:center;gap:7px;color:var(--text-muted)}

/* ── ✏️ 고치기 ────────────────────────────────────────────────
   예전에는 칸이 그냥 줄줄이 쌓여서 어디가 어느 단인지 안 보였습니다.
   단마다 판을 두르고, 줄마다 왼쪽에 이름표를 답니다. */
.ob-sec.ed{padding:20px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-secondary);margin-bottom:16px;border-top:1px solid var(--border)}
.ob-wrap > .ob-sec.ed:first-child{border-top:1px solid var(--border)}
.ob-eh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ob-eh .sn{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;font-weight:700;
  letter-spacing:.1em;color:var(--blue)}
.ob-wrap .ob-eh input.ic{flex:0 0 46px;min-width:0;text-align:center;padding:8px 4px}
.ob-wrap .ob-eh input.ti{flex:1 1 200px;min-width:0;font-size:16px;font-weight:800;
  letter-spacing:-.02em;padding:8px 12px}
.ob-eh .ac{flex:0 0 auto;display:flex;gap:3px}
.ob-eh .ac button{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-card);color:var(--text-muted);font-size:13px;cursor:pointer;
  font-family:inherit}
.ob-eh .ac button:hover{border-color:var(--blue);color:var(--blue)}
.ob-eh .ac button.dl:hover{border-color:var(--red);color:var(--red)}
.ob-erow{display:flex;align-items:flex-start;gap:11px;margin-bottom:8px}
.ob-erow > label{flex:0 0 62px;padding-top:8px;font-size:11.5px;font-weight:800;
  color:var(--text-muted);letter-spacing:.01em}
.ob-erow > input,.ob-erow > .ob-vw{flex:1 1 auto;min-width:0}
.ob-erow > .ob-vw{margin:0;padding-top:2px}
.ob-addit{display:block;width:100%;margin-top:10px;padding:10px;border:1px dashed
  var(--border-light);border-radius:9px;background:transparent;color:var(--text-muted);
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.ob-addit:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

.ob-its.ed{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ob-it.ed{padding:13px 14px;border:1px solid var(--border);border-left:3px solid
  var(--border-light);border-radius:var(--r-sm);background:var(--bg-card)}
.ob-it.ed .ih{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ob-it.ed .ih .no{flex:0 0 auto;font-family:var(--f-mono);font-size:10.5px;
  font-weight:700;letter-spacing:.08em;color:var(--text-muted)}
.ob-wrap .ob-it.ed .ih input.it{flex:1 1 auto;min-width:0;font-size:14.5px;
  font-weight:800;letter-spacing:-.015em}
.ob-it.ed .ih .x{flex:0 0 auto;width:28px;height:28px;border-radius:7px;font-size:13px}
.ob-it.ed .ih .x:hover{background:rgba(217,59,59,.10)}
.ob-wrap .ob-it.ed textarea.bd{font-size:13.5px;min-height:38px}
.ob-it.ed .ob-ks{display:flex;flex-direction:column;gap:5px;margin-top:11px;
  padding:10px 0 0;border-top:1px dashed var(--border)}
.ob-it.ed .ob-ks .kh{font-family:var(--f-mono);font-size:10px;font-weight:700;
  letter-spacing:.1em;color:var(--text-muted);margin-bottom:2px}
.ob-it.ed .ob-ks .add{align-self:flex-start;margin-top:3px;padding:5px 11px;
  border:1px dashed var(--border-light);border-radius:8px;background:transparent;
  color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:700;
  cursor:pointer}
.ob-it.ed .ob-ks .add:hover{border-color:var(--blue);color:var(--blue)}
.ob-k.ed{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;align-items:flex-start}
.ob-wrap .ob-k.ed input.kt{flex:0 0 132px;min-width:0;font-size:13px;font-weight:700}
.ob-wrap .ob-k.ed.yr input.kt{flex:0 0 84px;font-family:var(--f-mono);
  font-variant-numeric:tabular-nums}
/* .ob-wrap textarea 에 width:100% 가 걸려 있어 한 줄에 못 섰습니다 */
.ob-wrap .ob-k.ed textarea{width:auto;flex:1 1 auto;min-width:0;font-size:13px;
  min-height:36px}
.ob-k.ed .x{flex:0 0 auto;width:28px;height:28px;border-radius:7px}
@media(max-width:620px){
  .ob-erow{flex-direction:column;gap:5px}
  .ob-erow > label{flex:0 0 auto;padding-top:0}
  .ob-k.ed{flex-wrap:wrap}
  .ob-wrap .ob-k.ed input.kt{flex:1 1 100%}
}
/* 고치기는 예전 그대로 — 한 줄씩 세로로 */
.ob-its{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:13px}
.ob-its.ed{display:flex;flex-direction:column;gap:9px}
.ob-it{padding:16px 18px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-card)}
.ob-it.ed{padding:11px;border-radius:var(--r-sm)}
.ob-it.ed .it{flex:1;font-weight:700}
.ob-ks{display:flex;flex-direction:column;gap:10px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--border)}
.ob-it.ed .ob-ks{margin-top:8px;padding-top:9px}
.ob-k{display:flex;flex-direction:column;gap:2px}
.ob-k b{font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:.01em}
.ob-k span{font-size:14.5px;line-height:1.75;color:var(--text-secondary);
  white-space:pre-wrap;word-break:break-word}
/* 이름만 있고 설명이 없는 줄(조직도 같은 것)은 이름을 본문 크기로 */
.ob-k b:only-child{font-size:14.5px;font-weight:700;color:var(--text-primary)}
.ob-k.ed{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
.ob-k.ed .kt{flex:0 0 150px}
.ob-k.ed textarea{flex:1 1 200px;min-width:0}
/* 이 화면 안 칸도 제대로 입혀 줍니다 (앱에 전역 규칙이 없습니다) */
.ob-wrap input[type=text],.ob-wrap input:not([type]),.ob-wrap textarea{
  font:inherit;color:inherit;box-sizing:border-box;border:1px solid var(--border);
  border-radius:9px;padding:7px 10px;background:var(--bg-card);letter-spacing:normal}
.ob-wrap textarea{width:100%;resize:vertical;min-height:40px;line-height:1.7}
.ob-wrap input:focus,.ob-wrap textarea:focus{outline:none;border-color:var(--blue)}
.ob-wrap .x{border:0;background:none;color:var(--text-muted);padding:2px 7px;
  border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;flex:0 0 auto}
.ob-wrap .x:hover{color:var(--red,#ef4444);background:rgba(239,68,68,.09)}
@media(max-width:640px){
  .ob-sh .ac{margin-left:0;flex-basis:100%}
  .ob-k.ed .kt{flex:1 1 100%}
}
/* ═══ 📢 공지사항 ═══ */
.nt{margin:0 0 20px;padding:15px 17px;border:1px solid var(--border);
  border-left:4px solid var(--blue);border-radius:var(--r);background:var(--bg-card)}
.nt-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.nt-h .ti{font-size:15.5px;font-weight:800;color:var(--text-primary)}
.nt-h .chip.new{background:rgba(239,68,68,.11);color:#c33636;border-color:transparent;
  font-weight:700}
.nt-none{font-size:13px;color:var(--text-muted);padding:4px 0}
.nt-i{padding:11px 0;border-top:1px dashed var(--border)}
.nt-i:first-of-type{border-top:0;padding-top:2px}
.nt-i .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nt-i .pi{flex:0 0 auto}
.nt-i .hd b{font-size:15px;color:var(--text-primary);word-break:break-word}
.nt-i .mt{font-size:12px;color:var(--text-muted);white-space:nowrap}
.nt-i .ac{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.nt-i:hover .ac,.nt-i:focus-within .ac{opacity:1}

.nt-more{display:block;width:100%;margin-top:9px;padding:6px;border:1px dashed var(--border);

/* ═══ 📣 접점 (채널) ═══ */
.tp-sum{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--text-muted)}
.tp-sum b{color:var(--text-primary);font-size:15.5px;margin-right:3px}
.tp-cat{margin-bottom:26px}
.tp-cat .ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px;
  padding-left:11px;border-left:3px solid var(--hue)}
.tp-cat .ch h3{margin:0;font-size:15px;letter-spacing:.01em}
.tp-cat .ch p{margin:0;font-size:13px;color:var(--text-muted)}
.tp-cat .ch .ct{margin-left:auto;font-size:12.5px;color:var(--text-muted)}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:11px}
.tp-c{display:flex;flex-direction:column;text-align:left;gap:8px;min-height:126px;
  padding:14px 15px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r);cursor:pointer;font-family:inherit;color:inherit;
  transition:border-color .15s,transform .15s}
.tp-c:hover{border-color:var(--hue);transform:translateY(-1px)}
.tp-c .top{display:flex;justify-content:space-between;gap:7px;align-items:flex-start}
.tp-c .nm{font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--text-primary)}
.tp-c .new{align-self:flex-start;font-size:11px;font-weight:700;color:var(--red,#ef4444)}
.tp-c .key{margin-top:auto;font-size:18px;font-weight:800;letter-spacing:-.02em;
  color:var(--text-primary);word-break:break-word}
.tp-c .sub{font-size:12.5px;color:var(--text-muted);min-height:18px;word-break:break-word}
.tp-c.off{background:var(--bg-sunken);border-style:dashed}
.tp-c.off .nm,.tp-c.off .key{color:var(--text-muted);font-weight:600}
.tp-c.off .key{font-size:13px}
.tp-c .chip{flex:0 0 auto}
.tp-c .chip.s-run{background:rgba(18,161,80,.12);color:#0f8a45;border-color:transparent}
.tp-c .chip.s-ready{background:rgba(42,99,201,.12);color:#2a63c9;border-color:transparent}
.tp-c .chip.s-stop{background:rgba(217,59,59,.12);color:#c33636;border-color:transparent}
.tp-c .chip.s-done{background:rgba(139,92,246,.14);color:#6b3fc4;border-color:transparent}
.tp-c .chip.s-none{background:var(--bg-sunken);color:var(--text-muted);border-color:transparent}
.tp-plus{display:grid;place-items:center;min-height:126px;padding:10px;text-align:center;
  border:1px dashed var(--border);border-radius:var(--r);background:transparent;
  color:var(--text-muted);font-family:inherit;font-size:13px;cursor:pointer;
  word-break:keep-all;line-height:1.5}
.tp-plus:hover{border-color:var(--text-primary);color:var(--text-primary)}
.tp-new{display:flex;flex-direction:column;gap:7px;padding:13px;min-height:126px;
  border:1px solid var(--text-primary);border-radius:var(--r);background:var(--bg-card)}
.tp-new .row{margin-top:auto;display:flex;gap:6px}
/* 상세판 — 목업 수치를 그대로 따릅니다.
   앱에 전역 input/textarea 규칙이 없어서 브라우저 기본값(패딩 2px·기본 글꼴)
   으로 나왔습니다. 여기 안에서만 제대로 입혀 줍니다. */
.tp-d input[type=text],.tp-d input[type=number],.tp-d input[type=date],
.tp-d input[type=month],.tp-d select,.tp-d textarea{

.tp-d input:focus,.tp-d select:focus,.tp-d textarea:focus{
  outline:none;border-color:var(--blue)}
.tp-d textarea{resize:vertical;min-height:72px;line-height:1.6}
.tp-d input[type=checkbox]{width:auto;padding:0;border:0}
/* ✕ 는 테두리 없는 흐린 글자로 (상자로 그리면 너무 무겁습니다) */
.tp-d .x{border:0;background:none;color:var(--text-muted);padding:2px 7px;
  border-radius:6px;font-size:14px;line-height:1.4;cursor:pointer;font-family:inherit}

.tp-dim{position:fixed;inset:0;background:rgba(22,23,26,.38);z-index:60}
.tp-d{position:fixed;top:0;right:0;height:100%;width:min(840px,100%);z-index:61;

  box-shadow:-12px 0 40px rgba(0,0,0,.14)}
.tp-d-head{background:var(--bg-card);border-bottom:1px solid var(--border);
  border-top:4px solid var(--hue);padding:16px 22px 14px}
.tp-d-head .r1{display:flex;gap:10px;align-items:center}
.tp-d-head .cn{color:var(--hue);font-weight:800;font-size:12.5px}
.tp-d-head .tt{width:100%;font-size:19px;font-weight:800;letter-spacing:-.02em;

.tp-d-head .mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tp-d-head .mods em{font-style:normal;color:var(--text-muted);font-size:11.5px;margin-right:2px}
.tp-d-head .mod{display:inline-flex;gap:5px;align-items:center;margin:0;cursor:pointer;
  border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:12px;
  font-weight:500;color:var(--text-muted);background:var(--bg-card);letter-spacing:normal}
.tp-d-head .mod.on{color:var(--text-primary);border-color:var(--text-muted)}
.tp-d-head .mod input[type=checkbox]{width:14px;height:14px;margin:0;padding:0;flex:0 0 auto}
.tp-body{overflow:auto;padding:18px 24px 60px;display:flex;flex-direction:column;gap:14px}
.tp-s{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);

.tp-s .sh p{margin:0;font-size:12.5px;color:var(--text-muted)}
/* 비어 있을 때는 큰 회색 상자 대신 한 줄로 (목업처럼) */
.tp-s .empty{padding:6px 0;font-size:13px;color:var(--text-muted);
  background:none;border:0;text-align:left}
.tp-s .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tp-i3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tp-i3 label{display:block;font-size:12px;color:var(--text-muted)}
/* 칸 글씨는 이름표(12px)가 아니라 본문 크기를 따릅니다 */
.tp-i3 input{margin-top:4px;font-size:14px}
/* 줄 하나에 늘어놓는 칸들 (접촉 · 언급) */
.tp-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.tp-row input,.tp-row select{flex:1 1 150px;width:auto;min-width:0}
.tp-row .btn{flex:0 0 auto}
/* 여정 넣는 칸 — 글칸은 한 줄을 통째로 */
.tp-add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.tp-add .dt{flex:0 0 152px;width:auto}
.tp-add .jw{flex:1 1 100%;min-height:96px}
.tp-add .ft{flex:1 1 auto;display:flex;gap:8px;justify-content:flex-end}
/* 자료 넣는 칸 — 종류 · 날짜 · 이름, 그 아래로 경로와 메모 */
.tp-docadd{display:grid;grid-template-columns:124px 152px 1fr;gap:8px;margin-bottom:14px}
.tp-docadd .full{grid-column:1/-1}
.tp-docadd .foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tp-docadd .foot .fn{flex:1 1 auto;font-size:12px;color:var(--text-muted)}
@media(max-width:640px){.tp-docadd{grid-template-columns:1fr}}
.tp-p{border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:10px}
.tp-p .ph{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tp-p .ph input{flex:1;width:auto;font-weight:600}
.tp-p .ph .btn{flex:0 0 auto;white-space:nowrap}
.tp-p textarea{min-height:110px;font-size:13px;background:var(--bg-input)}
.tp-kpi{display:flex;flex-wrap:wrap;gap:20px;margin:2px 0 12px}
.tp-kpi div{font-size:12.5px;color:var(--text-muted)}
.tp-kpi b{display:block;font-size:18px;color:var(--text-primary);letter-spacing:-.02em}
.tp-tl{list-style:none;margin:0;padding:0 0 0 13px;border-left:2px solid var(--border)}
.tp-tl li{position:relative;display:flex;gap:11px;align-items:flex-start;padding:0 0 13px 13px}
.tp-tl li::before{content:'';position:absolute;left:-19px;top:6px;width:9px;height:9px;
  border-radius:50%;background:var(--bg-card);border:2px solid var(--hue,var(--text-muted))}
.tp-tl .dt{flex:0 0 82px;font-size:12.5px;color:var(--text-muted)}
.tp-tl .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:14px;
  line-height:1.65;color:var(--text-primary)}
.tp-tl .ac{flex:0 0 auto;display:flex;gap:3px;align-items:center}
.tp-ph{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tp-ph a{position:relative;display:block;width:74px;height:74px;border-radius:8px;

.tp-ph img{width:100%;height:100%;object-fit:cover;display:block}

.tp-df{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}

  padding:3px 11px;font-size:12px;color:var(--text-muted);font-family:inherit;cursor:pointer}
.tp-df button.on{background:var(--text-primary);border-color:var(--text-primary);color:var(--bg-card)}
.tp-doc{display:flex;gap:11px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--border)}
.tp-doc:last-child{border-bottom:0}
.tp-doc .k{flex:0 0 68px;text-align:center;border-radius:6px;padding:3px 0;font-size:11.5px;
  font-weight:700;background:var(--bg-sunken);color:var(--text-muted)}
.tp-doc .k.plan{background:rgba(42,99,201,.12);color:#2a63c9}
.tp-doc .k.out{background:rgba(18,161,80,.12);color:#0f8a45}
.tp-doc .k.deal{background:rgba(192,119,8,.12);color:#a0621a}
.tp-doc .k.rep{background:rgba(139,92,246,.14);color:#6b3fc4}
.tp-doc .b{flex:1;min-width:0}
.tp-doc .b b{display:block;font-size:14px;color:var(--text-primary);word-break:break-word}
.tp-doc .b small{display:block;font-size:12.5px;color:var(--text-muted);white-space:pre-wrap}
.tp-doc .b a,.tp-doc .b .pa{font-size:12.5px;word-break:break-all}
.tp-doc .b .pa{color:var(--text-muted)}
.tp-doc .dt{flex:0 0 auto;font-size:12.5px;color:var(--text-muted)}
.tp-feed a{display:flex;justify-content:space-between;gap:12px;padding:8px 0;

@media(max-width:640px){
  .tp-i3{grid-template-columns:1fr}
  .tp-d{width:100%}
  .tp-body{padding:14px 15px 60px}

/* 🧾 이렇게 쓴 것 (실물) */
.ob-sm{margin-top:14px;padding:13px 15px;border:1px solid var(--border);
  border-left:4px solid var(--green,#12a150);border-radius:var(--r-sm);
  background:rgba(18,161,80,.05)}
.ob-sm .sh{font-size:15px;font-weight:800;color:var(--text-primary);margin-bottom:8px}
.ob-sm .sh b{margin-left:5px;padding:1px 8px;border-radius:99px;font-size:12px;
  background:var(--green,#12a150);color:#fff}
.ob-sm .sh span{display:block;margin-top:2px;font-size:12px;font-weight:400;
  color:var(--text-muted)}
.ob-sm .si{position:relative;display:block;padding:11px 13px;margin-bottom:8px;
  border:1px solid var(--border);border-radius:9px;background:var(--bg-card);
  text-decoration:none;color:inherit}
.ob-sm .si:last-child{margin-bottom:0}
.ob-sm .si .tt{display:block;padding-right:22px;font-size:14.5px;font-weight:700;
  color:var(--text-primary);word-break:break-word}
.ob-sm .si .go{position:absolute;top:10px;right:12px;font-size:13px;
  color:var(--green,#12a150);font-weight:800;text-decoration:none}
/* ❌ 와 ✅ 를 나란히 — 어느 쪽인지가 헷갈리는 자리이지,
   옳은 쪽 하나만 보고는 알아채지 못합니다 */
.sm-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;margin-top:9px}
.sm-bad,.sm-good,.sm-why{min-width:0}
.sm-bad,.sm-good{padding:9px 11px;border-radius:9px;border:1px solid var(--border)}
.sm-bad{background:rgba(220,38,38,.055);border-color:rgba(220,38,38,.28)}
.sm-good{background:rgba(18,161,80,.07);border-color:rgba(18,161,80,.3)}
.sm-lb{display:block;margin-bottom:4px;font-family:var(--f-mono);font-size:10.5px;
  font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--text-muted)}
.sm-bad .sm-lb{color:var(--red,#dc2626)}
.sm-good .sm-lb{color:var(--green,#12a150)}
.sm-bad>span,.sm-good>span{display:block;font-size:13.5px;line-height:1.7;
  color:var(--text-primary);word-break:keep-all}
.sm-bad>span{color:var(--text-secondary);text-decoration:line-through;
  text-decoration-color:rgba(220,38,38,.45);text-decoration-thickness:1px}
.sm-why{margin-top:8px;padding-left:11px;border-left:3px solid var(--border)}
.sm-why>span{display:block;font-size:12.5px;line-height:1.75;
  color:var(--text-muted);word-break:keep-all}
.sm-bad>span.non,.sm-good>span.non,.sm-why>span.non{color:var(--text-muted);
  text-decoration:none;font-size:12.5px}
@media(max-width:700px){ .sm-pair{grid-template-columns:1fr} }
.pe-sm{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}

/* ⚠️ 아직 확정이 아닌 규칙 */

/* ❶ 이 브랜드는 뭘 하나 — 칸 */
.ob-1{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.ob-1f{display:flex;flex-wrap:wrap;gap:3px 14px;padding:11px 14px;
  border:1px solid var(--border);border-left:4px solid var(--blue);
