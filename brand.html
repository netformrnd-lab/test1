      + '<span class="chip">📜 ' + b.history.length + '</span>'
      + '<span class="chip">📁 ' + b.assets.length + '</span>'
      + (b.links.length ? '<span class="chip">🔗 ' + b.links.length + '</span>' : '')
      + (b.tasks.filter(t => t.status !== '완료').length
          ? '<span class="chip test">✅ ' + b.tasks.filter(t => t.status !== '완료').length + '</span>' : '')
      + ((b.masterPrompt || '').trim() ? '<span class="chip on">✨ 작성됨</span>'
                                       : '<span class="chip">✨ 미작성</span>')
      + (function(){ const k = brandNewCount(b);
           return k ? '<span class="chip new">🆕 새 글 ' + k + '</span>' : ''; })()
      + ((b._conflicts || []).length
          ? '<span class="chip test">⚠️ 같이 고친 것 ' + b._conflicts.length + '</span>' : '')
    + '</div></div>').join('');

  // 기한이 지났거나 임박한 할 일
  const today = todayStr();
  const urgent = [];
  bs.forEach(b => b.tasks.forEach(t => {
    if(t.status === '완료' || !t.due) return;
    const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
    if(days <= 3) urgent.push({ b, t, days });
  }));
  urgent.sort((x, y) => x.days - y.days);

  const urgentHtml = urgent.length
    ? '<div class="todo">' + urgent.slice(0, 8).map(u =>
        '<div class="ti" onclick="gotoResult(\'' + u.b.id + '\',\'tasks\')">'
        + '<span class="dm ' + (u.days < 0 ? 'late' : 'soon') + '"></span>'
        + '<strong>' + esc(u.t.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(u.b.name) + '</span>'
        + '<span class="rb">' + (u.days < 0 ? Math.abs(u.days) + '일 지남' : 'D-' + u.days) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 아직 비어 있는 곳을 짚어줍니다
  const todos = [];
  bs.forEach(b => {
    if(!(b.masterPrompt || '').trim())
      todos.push(['✨', b, 'prompt', '마스터프롬프트가 비어 있습니다']);
    if(!b.automations.length)
      todos.push(['🤖', b, 'automations', '등록된 자동화가 없습니다']);
    if(!b.history.length)
      todos.push(['📜', b, 'history', '여정 기록이 없습니다']);
    if(!b.assets.length)
      todos.push(['📁', b, 'assets', '등록된 자료가 없습니다']);
  });

  const todoHtml = todos.length
    ? '<div class="todo">' + todos.slice(0, 12).map(([ic, b, tab, msg]) =>
        '<div class="ti" onclick="gotoResult(\'' + b.id + '\',\'' + tab + '\')">'
        + '<span>' + ic + '</span><strong>' + esc(b.name) + '</strong>'
        + '<span style="color:var(--text-muted)">' + msg + '</span></div>').join('')
      + (todos.length > 12 ? '<div class="ti" style="color:var(--text-muted);cursor:default">'
          + '외 ' + (todos.length - 12) + '건</div>' : '')
      + '</div>'
    : '<div class="todo" style="color:var(--text-muted)">모든 브랜드가 채워져 있습니다 👏</div>';

  // 최근에 손댄 항목
  const recent = [];
  bs.forEach(b => ITEM_KEYS.forEach(t =>
    b[t].forEach(it => {
      const when = it.updatedAt || it.uploadedAt;
      if(when) recent.push({ b, t, it, when });
    })));
  recent.sort((x, y) => String(y.when).localeCompare(String(x.when)));

  const recentHtml = recent.length
    ? '<div class="todo recent">' + recent.slice(0, 8).map(r =>
        '<div class="ri" onclick="gotoResult(\'' + r.b.id + '\',\'' + r.t + '\')">'
        + '<span>' + TYPES[r.t].icon + '</span>'
        + '<strong>' + esc(r.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(r.b.name) + '</span>'
        + '<span class="rb">' + esc(new Date(r.when)
            .toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' })) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  // 채널에 새로 올라온 글 (NAS 가 미리 받아둔 것)
  const posts = [];
  chState.rows.forEach(r => {
    const brand = bs.find(x => x.name === r['브랜드']);
    const mark  = chSeen()[r.feed];
    (r.items || []).forEach(it => {
      if(!it.link) return;
      posts.push({ r, it, brand, isNew: chNewer(chKey(it), mark) });
    });
  });
  posts.sort((x, y) => String(y.it.iso || '').localeCompare(String(x.it.iso || '')));

  const postHtml = posts.length
    ? '<div class="todo recent">' + posts.slice(0, 8).map(p =>
        '<div class="ri" onclick="window.open(\'' + jsq(p.it.link) + '\',\'_blank\',\'noopener\')">'
        + '<span>' + (CH_ICON[p.r.kind] || '🌐') + '</span>'
        + '<strong>' + (p.isNew ? '<span class="newtag">NEW</span> ' : '') + esc(p.it.title) + '</strong>'
        + '<span style="color:var(--text-muted)">' + esc(p.r['브랜드'] || p.r['이름']) + '</span>'
        + '<span class="rb">' + esc(sinceText(p.it.iso)) + '</span>'
        + '</div>').join('') + '</div>'
    : '';

  document.getElementById('main').innerHTML =
    '<div class="panel"><div class="tabbody">'
    + '<h2 class="page-h">브랜드 현황</h2>'
    + '<div class="page-sub">카드를 누르면 해당 브랜드로 이동합니다</div>'
    + '<div class="stats">' + stats + '</div>'
    + '<div class="hgrid">' + cards + '</div>'
    + (urgentHtml ? '<div class="hsec">⏰ 기한이 임박한 할 일</div>' + urgentHtml : '')
    + (postHtml ? '<div class="hsec">📣 채널에 올라온 글</div>' + postHtml : '')
    + (recentHtml ? '<div class="hsec">🕘 최근 업데이트</div>' + recentHtml : '')
    + '<div class="hsec">📝 아직 비어 있는 곳</div>' + todoHtml
    + '</div></div>';
}

/* ========================= NAS 자료 =========================
   scan.sh 가 만든 파일 목록에서 찾아줍니다.
   파일을 옮기거나 복사하지 않고, 어디에 있는지만 알려줍니다.
   ============================================================ */
const nasState = { q:'', ext:'', loading:false, error:null, res:null, info:null };

async function nasCheck(){
  try{
    const r = await (await fetch('nasfiles.php?action=check', { cache:'no-store' })).json();
    nasState.info = r;
  }catch(e){ nasState.info = null; }
  render();
}

async function nasSearch(){
  const q = document.getElementById('nasQ');
  nasState.q = q ? q.value.trim() : nasState.q;
  const ex = document.getElementById('nasExt');
  nasState.ext = ex ? ex.value : '';
  if(!nasState.q && !nasState.ext){ toast('⚠️ 찾을 이름을 입력해 주세요'); return; }
  nasState.mode = 'search';

  nasState.loading = true; nasState.error = null; render();
  try{
    const url = 'nasfiles.php?action=search&q=' + encodeURIComponent(nasState.q)
              + (nasState.ext ? '&ext=' + encodeURIComponent(nasState.ext) : '');
    const res = await fetch(url, { cache:'no-store' });
    const text = await res.text();
    let out = null;
    try { out = JSON.parse(text); } catch(e) {}
    if(out === null) throw new Error('서버 응답 이상 (HTTP ' + res.status + ')');
    if(!out.ok) throw new Error(out.error || '찾지 못했습니다');
    nasState.res = out;
  }catch(e){ nasState.error = e.message; nasState.res = null; }
  finally{ nasState.loading = false; render();
    const el = document.getElementById('nasQ'); if(el){ el.focus(); el.value = nasState.q; } }
}

/* NAS 경로를 탐색기에서 쓸 수 있는 형태로 바꿉니다
   /volume1/넷폼알앤디 공유폴더/a/b.pdf  →  \\netformrnd\넷폼알앤디 공유폴더\a\b.pdf */
function toWinPath(p){
  return '\\\\netformrnd\\' + String(p).replace(/^\/volume\d+\//, '').replace(/\//g, '\\');
}

async function copyNasPath(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.path);
  try{
    await navigator.clipboard.writeText(win);
    toast('📋 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

function linkNasDir(i){
  const f = nasState.res.results[i];
  if(!data.brands.length){ toast('⚠️ 브랜드가 없습니다'); return; }
  const names = data.brands.map((b, n) => (n + 1) + '. ' + b.name).join('\n');
  const pick = prompt('이 폴더를 어느 브랜드에 연결할까요?\n\n' + names
    + '\n\n폴더: ' + f.dir + '\n\n번호를 입력하세요', '1');
  if(pick === null) return;
  const idx = parseInt(pick, 10) - 1;
  const b = data.brands[idx];
  if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }

  b.nasFolders = b.nasFolders || [];
  if(b.nasFolders.some(x => x.path === f.dir)){ toast('이미 연결된 폴더입니다'); return; }
  b.nasFolders.push({ id: uid('nf'), path: f.dir, label: f.dir.split('/').pop(), q: '' });
  markDirty();
  toast('📂 "' + b.name + '" 자료에 연결했습니다');
}

async function copyNasDir(i){
  const f = nasState.res.results[i];
  const win = toWinPath(f.dir);
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

/* ========================= 폴더 탐색기 =========================
   scan.sh 가 만든 목록을 가지고, 탐색기처럼 폴더를 타고 들어갑니다.
   파일은 옮기지 않고 있는 자리에서 바로 내려받습니다.
   ============================================================== */
/* 서버에 물어보고 JSON 을 받아옵니다.
   PHP 파일이 아직 없으면 HTML(404 화면)이 오는데, 그걸 알아보고 안내합니다. */
async function apiJson(url, opts){
  const res  = await fetch(url, Object.assign({ cache:'no-store' }, opts || {}));
  const text = await res.text();
  let out = null;
  try{ out = JSON.parse(text); }catch(e){}
  if(out === null){
    const file = String(url).split('?')[0];
    const head = text.replace(/\s+/g, ' ').trim().slice(0, 300);
    if(res.status === 404){
      throw new Error('NAS에 ' + file + ' 이(가) 아직 없습니다.\n\n'
        + '아래 주소를 브라우저 주소창에 한 번 넣어 주세요. (파일을 자동으로 받아옵니다)\n\n'
        + location.href.split('?')[0].replace(/[^/]*$/, 'save.php?action=bootstrap'));
    }
    // 웹 스테이션(nginx)이 자기 오류 화면을 대신 보낸 경우입니다.
    // PHP 가 끝나기 전에 잘렸다는 뜻이라, 대개 시간이 오래 걸려서입니다.
    const nginxPage = /^<!DOCTYPE html>|<html/i.test(text.trim());
    if(nginxPage && (res.status === 500 || res.status === 502 || res.status === 504)){
      throw new Error(file + ' 이(가) 도중에 끊겼습니다. (HTTP ' + res.status + ')\n\n'
        + '작업이 오래 걸려서 웹 서버가 먼저 끊은 것으로 보입니다.\n'
        + '(NAS 가 보낸 오류 화면이라 자세한 내용이 없습니다)\n\n'
        + '· 잠시 뒤 다시 눌러보세요. 그래도 같으면\n'
        + '· [🩺 이 NAS 점검] 을 눌러 무엇이 되는지 확인해 주세요.');
    }
    throw new Error(file + ' 이(가) 이상한 응답을 보냈습니다. (HTTP ' + res.status + ')\n\n'
      + '받은 내용 앞부분:\n' + head);
  }
  if(!out.ok){
    // 로그인이 끊겼거나(만료) 관리자가 계정을 막았습니다
    if(out['로그인필요']){ authKicked(); throw new Error('로그인이 필요합니다. 다시 들어와 주세요.'); }
    throw out;
  }
  return out;
}

function apiErrText(e){
  return (e && e.error) || (e && e.message) || '알 수 없는 오류';
}

const browseCache = {};   // 폴더경로 → {loading} | {error} | 서버응답
const fileShow    = {};   // 화면키 → 지금 보여주는 파일 수
const picShow     = {};   // 화면키 → 지금 보여주는 사진 수
const fileOpen    = {};   // 화면키 → 파일 목록을 펼쳤는지
const openFolder  = {};   // 브랜드id → 펼쳐 놓은 폴더 경로 (한 번에 하나만)
const folderNav   = {};   // 화면키 → 지금 보고 있는 폴더

/* 작은따옴표 onclick 안에 안전하게 넣기 위한 처리 */
function jsq(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
                  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function redraw(){ render(); bindDrop(); }

async function loadBrowse(dir){
  browseCache[dir] = { loading:true };
  try{
    const out = await apiJson('nasfiles.php?action=browse&dir=' + encodeURIComponent(dir || ''));
    browseCache[dir] = out;
    if(out.dir && out.dir !== dir) browseCache[out.dir] = out;
  }catch(e){
    browseCache[dir] = { error: apiErrText(e) };
  }
  redraw();
}

function toggleFiles(navKey){
  const cur = browseCache[folderNav[navKey] !== undefined ? folderNav[navKey] : ''];
  const def = cur && cur.folders ? !cur.folders.length : false;
  fileOpen[navKey] = (fileOpen[navKey] !== undefined) ? !fileOpen[navKey] : !def;
  redraw();
}

async function morePics(navKey){
  picShow[navKey] = (picShow[navKey] || 40) + 60;
  await ensureFiles(navKey, picShow[navKey] + 20);
  redraw();
}

/* 화면에 필요한 만큼 파일을 더 받아옵니다 (사진 수만 장짜리 폴더 대비) */
async function ensureFiles(navKey, need){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : '';
  const c = browseCache[dir];
  if(!c || !c.files) return;
  if(c.files.length >= c.fileCount) return;      // 이미 다 받았습니다
  if(c.files.length >= need) return;             // 아직 더 받을 필요 없습니다
  if(c.loadingMore) return;
  c.loadingMore = true;
  try{
    const out = await apiJson('nasfiles.php?action=browse&off=' + c.files.length
      + '&lim=500&dir=' + encodeURIComponent(c.dir));
    c.files = c.files.concat(out.files || []);
  }catch(e){ /* 다음에 다시 시도합니다 */ }
  c.loadingMore = false;
}

/* ================= 브랜드 채널 =================
   블로그·카페·유튜브 주소를 모아두고, 최근 올린 글을 함께 보여줍니다.
   가져오는 일은 NAS 가 대신합니다 (사무실 브라우저는 밖으로 못 나갑니다).
   ============================================== */
const feedCache = {};   // RSS 주소 → {loading} | {error} | 응답

/* NAS 가 미리 받아둔 채널 글 모음입니다.
   feeds.sh 를 작업 스케줄러에 걸어두면 NAS 가 30분마다 돌아보고,
   대시보드는 그걸 그냥 읽기만 해서 열자마자 바로 보입니다. */
const chState = { rows: [], at: null, autoAt: null, age: null, cron: false, loaded: false };

const CH_SEEN_KEY = 'brandHubChSeen';   // 어디까지 봤는지 (이 브라우저에만 저장)

function chSeen(){
  try{ return JSON.parse(localStorage.getItem(CH_SEEN_KEY) || '{}'); }
  catch(e){ return {}; }
}
function chSeenSave(o){
  try{ localStorage.setItem(CH_SEEN_KEY, JSON.stringify(o)); }catch(e){}
}

/* 아직 안 본 글이 몇 개인지 셉니다.
   처음 보는 채널은 지금 것을 '이미 본 것'으로 쳐서, 빨간 표시가 쏟아지지 않게 합니다. */
function chKey(it){ return (it && (it.iso || it.link)) || ''; }

/* 이 글이 '마지막으로 본 것' 보다 새 글인지 봅니다.
   날짜가 있으면 날짜로, 없으면 주소가 달라졌는지로 판단합니다. */
function chNewer(key, mark){
  if(!key || !mark) return false;
  const a = Date.parse(key), b = Date.parse(mark);
  if(!isNaN(a) && !isNaN(b)) return a > b;
  return key !== mark;
}

function chUnseen(feed, items){
  if(!feed || !items || !items.length) return 0;
  const seen = chSeen();
  const mark = seen[feed];
  if(!mark){
    seen[feed] = chKey(items[0]);
    chSeenSave(seen);
    return 0;
  }
  let n = 0;
  for(const it of items){
    if(chNewer(chKey(it), mark)) n++;
    else break;
  }
  return n;
}

function chRowsOf(brandName){
  return chState.rows.filter(r => r['브랜드'] === brandName);
}

function brandNewCount(b){
  return chRowsOf(b.name).reduce((a, r) => a + chUnseen(r.feed, r.items), 0);
}

function markChannelsSeen(b){
  const seen = chSeen();
  let changed = false;
  chRowsOf(b.name).forEach(r => {
    if(!r.items || !r.items.length) return;
    const key = chKey(r.items[0]);
    if(key && seen[r.feed] !== key){ seen[r.feed] = key; changed = true; }
  });
  if(changed){ chSeenSave(seen); setTimeout(render, 0); }
}

const CH_STALE = 30 * 60;   // 30분이 지나면 오래된 것으로 봅니다

/* NAS 가 받아둔 것을 읽어옵니다. 인터넷에 나가지 않아 빠릅니다. */
async function loadChannelSummary(){
  if(STORAGE_MODE !== 'nas') return;
  try{
    const j = await apiJson('channels.php?action=summary');
    if(!j || !j.ok) return;
    chState.rows   = j['채널'] || [];
    chState.at     = j['가장오래된확인'] || null;
    chState.autoAt = j['자동확인'] || null;
    chState.age    = (typeof j['지난초'] === 'number') ? j['지난초'] : null;
    chState.cron   = j['예약작업'] === '등록됨';
    chState.loaded = true;
    // 채널 탭이 기다리지 않도록 미리 채워둡니다
    chState.rows.forEach(r => {
      if(r.feed && r.items && r.items.length && !feedCache[r.feed])
        feedCache[r.feed] = { ok:true, title:r['이름'], items:r.items };
    });
    render();

    // 받아둔 게 오래됐으면 대시보드가 직접 NAS 에게 돌아보라고 시킵니다.
    // 작업 스케줄러를 걸어두지 않아도 대시보드를 켜 두는 동안은 최신이 됩니다.
    if(chState.rows.length && (chState.age === null || chState.age > CH_STALE)) {
      await pokeChannels();
    }
  }catch(e){ /* 조용히 넘어갑니다 — 채널은 곁다리 기능입니다 */ }
}

/* 오래됐을 때만 조용히 새로 받아옵니다.
   maxage 를 함께 보내서, 여러 사람이 열어두어도 NAS 는 한 번만 나갑니다. */
let chPoking = false;
async function pokeChannels(){
  if(chPoking) return;
  chPoking = true;
  try{
    const r = await apiJson('channels.php?action=refreshall&maxage=' + CH_STALE);
    if(r && r.ok && !r['건너뜀']){
      Object.keys(feedCache).forEach(k => delete feedCache[k]);
      const j = await apiJson('channels.php?action=summary');
      if(j && j.ok){
        chState.rows   = j['채널'] || [];
        chState.autoAt = j['자동확인'] || null;
        chState.age    = (typeof j['지난초'] === 'number') ? j['지난초'] : null;
        chState.rows.forEach(x => {
          if(x.feed && x.items && x.items.length)
            feedCache[x.feed] = { ok:true, title:x['이름'], items:x.items };
        });
        render();
      }
    }
  }catch(e){ /* 조용히 */ }
  finally{ chPoking = false; }
}

/* 지금 당장 전부 새로 받아옵니다 (NAS 가 인터넷에 나갔다 옵니다 — 조금 걸립니다) */
async function refreshAllChannels(btn){
  if(btn){ btn.disabled = true; btn.textContent = '받는 중…'; }
  toast('📡 채널을 전부 돌아보는 중입니다…');
  try{
    const j = await apiJson('channels.php?action=refreshall');
    Object.keys(feedCache).forEach(k => delete feedCache[k]);
    await loadChannelSummary();
    if(j['실패']) toast('확인 ' + j['확인한채널'] + '곳 · 실패 ' + j['실패'] + '곳');
    else toast('✅ ' + j['확인한채널'] + '곳을 새로 받았습니다');
  }catch(e){ alert(apiErrText(e)); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = '↻ 전부 새로 받기'; } }
}

const CH_ICON = { '네이버 블로그':'📗', '네이버 카페':'☕', '유튜브':'📺', '인스타그램':'📷',
                  '티스토리':'📘', '브런치':'✍️', '페이스북':'👥', '웹사이트':'🌐' };

async function loadFeed(url){
  feedCache[url] = { loading:true };
  try{
    feedCache[url] = await apiJson('channels.php?action=feed&n=6&url=' + encodeURIComponent(url));
  }catch(e){ feedCache[url] = { error: apiErrText(e) }; }
  render();
}

function refreshFeed(url){
  delete feedCache[url];
  feedCache[url] = { loading:true };
  render();
  apiJson('channels.php?action=feed&n=6&fresh=1&url=' + encodeURIComponent(url))
    .then(o => { feedCache[url] = o; render(); })
    .catch(e => { feedCache[url] = { error: apiErrText(e) }; render(); });
  toast('↻ 새로 받아옵니다');
}

async function addChannel(){
  const b = currentBrand();
  if(!b) return;
  const url = prompt('채널 주소를 넣어주세요.\n\n'
    + '예) https://blog.naver.com/아이디\n'
    + '    https://www.youtube.com/@채널이름\n'
    + '    https://cafe.naver.com/카페주소');
  if(url === null) return;
  if(!url.trim()){ toast('⚠️ 주소를 넣어주세요'); return; }

  b.channels = b.channels || [];
  toast('🔎 채널을 확인하는 중…');
  let info = { kind:'웹사이트', feed:null };
  try{
    info = await apiJson('channels.php?action=probe&url=' + encodeURIComponent(url.trim()));
  }catch(e){
    if(!confirm('채널을 확인하지 못했습니다.\n\n' + apiErrText(e)
      + '\n\n주소만 저장할까요? (최근 글은 안 보입니다)')) return;
  }

  const name = prompt('이 채널을 뭐라고 부를까요?',
    info['채널이름'] || (info.kind || '채널')) || '';
  b.channels.push({ id: uid('ch'), kind: info.kind || '웹사이트', name: name.trim(),
                    url: url.trim(), feed: info.feed || '' });
  markDirty();
  render();
  toast(info.feed ? '✅ 최근 글까지 가져올 수 있는 채널입니다'
                  : '✅ 채널을 넣었습니다 (최근 글은 못 가져옵니다)');
}

function removeChannel(id){
  const b = currentBrand();
  const c = (b.channels || []).find(x => x.id === id);
  if(!c) return;
  if(!confirm('"' + (c.name || c.url) + '" 을 지울까요?')) return;
  b.channels = b.channels.filter(x => x.id !== id);
  deletedIds.add(id);
  markDirty(); render();
}

async function refindFeed(id){
  const b = currentBrand();
  const c = (b.channels || []).find(x => x.id === id);
  if(!c) return;
  toast('🔎 RSS 주소를 다시 찾는 중…');
  try{
    const info = await apiJson('channels.php?action=probe&url=' + encodeURIComponent(c.url));
    c.feed = info.feed || '';
    c.kind = info.kind || c.kind;
    markDirty(); render();
    toast(c.feed ? '✅ 찾았습니다' : '이 채널은 최근 글을 가져올 수 없습니다');
  }catch(e){ alert(apiErrText(e)); }
}

function sinceText(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(d < 0) return '오늘';
  if(d === 0) return '오늘';
  if(d === 1) return '어제';
  if(d < 30) return d + '일 전';
  if(d < 365) return Math.floor(d / 30) + '개월 전';
  return Math.floor(d / 365) + '년 전';
}

function viewChannels(b){

  setTimeout(() => markChannelsSeen(b), 400);   // 열어봤으니 '읽음' 처리

  const mins = chState.age === null ? null : Math.floor(chState.age / 60);
  const when = chState.autoAt
    ? '마지막으로 확인한 때: ' + (mins !== null && mins < 60
        ? (mins < 1 ? '방금' : mins + '분 전')
        : esc(new Date(chState.autoAt).toLocaleString('ko-KR',
            { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })))
    : '아직 한 번도 확인하지 않았습니다';

  const bar = '<div class="sec-bar">'
    + '<button class="btn primary" onclick="addChannel()">＋ 채널 추가</button>'
    + '<button class="btn" onclick="refreshAllChannels(this)">↻ 전부 새로 받기</button>'
    + '<span class="hint">' + when + '</span></div>';

  // 자동 확인이 어떻게 돌고 있는지 있는 그대로 알려줍니다
  const auto = list.some(c => c.feed) ? (chState.cron
    ? '<div class="ainote" style="background:rgba(18,161,80,.09);'
      + 'border-color:rgba(18,161,80,.28);margin-bottom:14px">'
      + '✅ <b>NAS가 알아서 돌아보고 있습니다.</b> 작업 스케줄러에 등록돼 있어서 '
      + '아무도 대시보드를 안 켜도 새 글을 미리 받아둡니다.</div>'
    : '<div class="ainote" style="margin-bottom:14px">'
      + '🕒 <b>지금은 대시보드를 켜 두는 동안에만 확인합니다.</b><br>'
      + '이 화면을 열어두면 30분마다 알아서 새로 받아옵니다. '
      + '대신 아무도 안 켜 두면 그동안은 확인하지 않습니다.<br><br>'
      + '항상 돌게 하려면 NAS 에 한 번만 등록해 주세요 — '
      + 'DSM → 제어판 → <b>작업 스케줄러</b> → 생성 → 예약된 작업 → 사용자 정의 스크립트<br>'
      + '　사용자 <code>root</code> · 일정 <b>매일 · 반복 30분</b> · '
      + '스크립트 <code>sh /volume1/web/brand/feeds.sh</code></div>') : '';

  if(!list.length) return bar + '<div class="empty">등록된 채널이 없습니다.<br>'
    + '<span style="color:var(--text-muted)">블로그·카페·유튜브 주소를 넣어두면, '
    + '최근 뭘 올렸는지 여기서 바로 보입니다.</span></div>';

  const cards = list.map(c => {
    const f = c.feed ? feedCache[c.feed] : null;
    if(c.feed && !f) setTimeout(() => loadFeed(c.feed), 10);

    let inner, badge = '';
    if(!c.feed){
      inner = '<div class="fmeta">이 채널은 최근 글을 가져올 수 없습니다. '
        + '<button class="btn sm" onclick="refindFeed(\'' + jsq(c.id) + '\')">다시 찾아보기</button></div>';
    }else if(!f || f.loading){
      inner = '<div class="fmeta">불러오는 중…</div>';
    }else if(f.error){
      inner = '<div class="fmeta" style="white-space:pre-wrap;line-height:1.6">⚠️ '
        + esc(f.error) + '</div>'
        + '<div class="row" style="margin-top:8px">'
          + '<button class="btn sm" onclick="refreshFeed(\'' + jsq(c.feed) + '\')">↻ 다시 시도</button>'
          + (String(c.url).indexOf('youtube') >= 0 || String(c.feed).indexOf('youtube') >= 0
              ? '<a class="btn sm" href="channels.php?action=ytcheck&url=' + encodeURIComponent(c.url)
                + '" target="_blank" rel="noopener">🔧 유튜브 진단</a>'
              : '<a class="btn sm" href="channels.php?action=test&url=' + encodeURIComponent(c.feed)
                + '" target="_blank" rel="noopener">🔧 왜 안 되는지 보기</a>')
          + '<a class="btn sm" href="' + esc(c.feed) + '" target="_blank" rel="noopener">RSS 직접 열기 ↗</a>'
        + '</div>';
    }else if(!f.items || !f.items.length){
      inner = '<div class="fmeta">올라온 글이 없습니다.</div>';
    }else{
      const last = f.items[0].iso;
      const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
      badge = '<span class="chip' + (days === null ? '' : (days <= 14 ? ' on' : (days <= 45 ? ' test' : ' off')))
        + '">최근 발행 ' + esc(sinceText(last)) + '</span>';
      const nNew = chUnseen(c.feed, f.items);
      if(nNew) badge += '<span class="chip new">🆕 새 글 ' + nNew + '</span>';
      const mark = chSeen()[c.feed];
      inner = f.items.map(it =>
        '<div class="krow" style="align-items:baseline;gap:8px">'
        + '<a class="lnk" style="flex:1;min-width:0;word-break:break-all" href="' + esc(it.link)
          + '" target="_blank" rel="noopener">'
          + (chNewer(chKey(it), mark) ? '<span class="newtag">NEW</span> ' : '')
          + esc(it.title) + '</a>'
        + '<span class="fmeta" style="white-space:nowrap;margin:0">'
          + esc(sinceText(it.iso)) + '</span></div>').join('');
    }

    return '<div class="mbox" style="margin-bottom:12px">'
      + '<div class="mh" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
        + '<span>' + (CH_ICON[c.kind] || '🌐') + ' ' + esc(c.name || c.kind) + '</span>'
        + '<span class="mhs">' + esc(c.kind) + '</span>'
        + badge
        + '<span style="margin-left:auto;display:flex;gap:5px">'
          + '<a class="btn sm" href="' + esc(c.url) + '" target="_blank" rel="noopener">채널 열기 ↗</a>'
          + (c.feed ? '<button class="btn sm" onclick="refreshFeed(\'' + jsq(c.feed) + '\')">↻</button>' : '')
          + '<button class="btn sm danger" onclick="removeChannel(\'' + jsq(c.id) + '\')">삭제</button>'
        + '</span></div>'
      + '<div class="path" style="margin-bottom:8px">' + esc(c.url) + '</div>'
      + inner + '</div>';
  }).join('');

  return bar + auto + cards;
}

/* ================= 문서 내용으로 찾기 =================
   파일 이름이 아니라 문서 안에 적힌 글자로 찾습니다.
   ====================================================== */
const doc = { info:null, sample:null, run:null, q:'', res:null,
              loading:false, error:null, unread:null, busy:false, self:null };

async function docCheck(){
  try{ doc.info = await apiJson('doctext.php?action=check'); }
  catch(e){ doc.info = { error: apiErrText(e) }; }
  render();
}

/* 이 NAS 가 무엇을 할 수 있는지 봅니다 (문제 생겼을 때) */
async function docSelfTest(){
  doc.busy = true; doc.self = null; doc.error = null; render();
  try{ doc.self = await apiJson('doctext.php?action=selftest'); }
  catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

async function docSample(){
  doc.busy = true; doc.sample = null; doc.self = null; doc.error = null; render();
  try{
    doc.sample = await apiJson('doctext.php?action=sample&n=30');
  }catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

async function docStart(){
  if(!confirm('문서 안의 글자를 읽어 목록을 만듭니다.\n\n'
    + '문서가 많으면 몇 분 걸릴 수 있습니다. 창을 닫지 마세요.\n'
    + '원본 파일은 읽기만 하며 고치지 않습니다.')) return;
  doc.run = { starting:true }; render();
  try{
    doc.run = await apiJson('doctext.php?action=start');
    render();
    docLoop();
  }catch(e){
    doc.run = null; render();
    alert(apiErrText(e));
  }
}

async function docLoop(){
  while(doc.run && !doc.run.done){
    let out;
    try{ out = await apiJson('doctext.php?action=step'); }
    catch(e){ doc.run = null; render(); alert(apiErrText(e)); return; }
    if(!doc.run) return;
    doc.run = out;
    render();
  }
  if(doc.run && doc.run.done){
    await docCheck();
    toast('✅ 문서 ' + doc.run['읽은수'].toLocaleString('ko-KR') + '개를 읽었습니다');
  }
}

async function docCancel(){
  if(!confirm('중단할까요?')) return;
  doc.run = null; render();
  try{ await apiJson('doctext.php?action=cancel'); }catch(e){}
}

async function docSearch(){
  const el = document.getElementById('docQ');
  doc.q = el ? el.value.trim() : doc.q;
  if(!doc.q){ toast('⚠️ 찾을 말을 입력해 주세요'); return; }
  doc.loading = true; doc.error = null; doc.unread = null;
  doc.sample = null; doc.self = null;   // 결과가 화면 아래로 밀리지 않게 접습니다
  if(doc.run && doc.run.done) doc.run = null;
  render();
  try{
    doc.res = await apiJson('doctext.php?action=search&q=' + encodeURIComponent(doc.q));
  }catch(e){ doc.error = apiErrText(e); doc.res = null; }
  doc.loading = false; render();
  const e2 = document.getElementById('docQ');
  if(e2){ e2.value = doc.q; e2.focus(); }
}

async function docUnread(){
  doc.busy = true; doc.res = null; render();
  try{ doc.unread = await apiJson('doctext.php?action=unread'); }
  catch(e){ doc.error = apiErrText(e); }
  doc.busy = false; render();
}

      + (ready ? '' : ' disabled') + '></span>'

  /* 이 NAS 점검 결과 */

  if(doc.self){

  else if(doc.sample){
    const sp = doc.sample;
    samplePanel = '<div class="mbox" style="margin-bottom:14px">'
      + '<div class="mh" style="display:flex;align-items:center;gap:6px">'

  }

  /* 결과 */
  let body = '';
  if(doc.loading) body = '<div class="empty">찾는 중…</div>';

  else if(!ready) body = '<div class="empty">아직 문서 안의 글자를 읽지 않았습니다.<br><br>'

    + 'PDF 는 글자층이 있으면 읽히고, 스캔본은 읽히지 않습니다.</span></div>';
  else body = '<div class="empty">문서 안에 적힌 말로 찾아보세요.<br>'
    + '<span style="color:var(--text-muted)">예) 옥상방수 단가 · 설계감리 · 동아건설 · 32,000</span></div>';

  return bar + runPanel + selfPanel + samplePanel + body;
}

/* ================= 파일 정리 =================
   한 폴더에 쌓인 파일을, 옆 폴더들로 하나씩 넣습니다.
   사진이면 그림을 보면서 고를 수 있습니다.
   ============================================= */
const tidy = { from:null, to:null, files:null, targets:null,
               loading:false, error:null, pick:null, done:[], busy:null };

function openTidy(){
  nasState.mode = 'tidy';
  render();
}

function tidyPick(which){
  tidy.pick = { which: which, loading:true };
  render();
  tidyPickLoad('');
}
function tidyPickClose(){ tidy.pick = null; render(); }

async function tidyPickLoad(dir){
  const which = tidy.pick ? tidy.pick.which : 'from';
  tidy.pick = { which: which, loading:true, dir:dir };
  render();
  try{
    const out = await apiJson('nasfiles.php?action=browse&lim=50'
      + (dir ? '&dir=' + encodeURIComponent(dir) : ''));
    tidy.pick = { which: which, dir: out.dir, parent: out.parent, folders: out.folders || [] };
  }catch(e){
    tidy.pick = { which: which, dir: dir, error: apiErrText(e) };
  }
  render();
}

function tidyChoose(dir){
  const which = tidy.pick.which;
  tidy.pick = null;
  if(which === 'from'){ tidy.from = dir; tidy.files = null; }
  else               { tidy.to   = dir; tidy.targets = null; }
  render();
  tidyLoad();
}

async function tidyLoad(){
  if(tidy.loading) return;
  tidy.loading = true; tidy.error = null; render();
  try{
    if(tidy.from && !tidy.files){
      const a = await apiJson('nasfiles.php?action=browse&lim=500&dir=' + encodeURIComponent(tidy.from));
      tidy.files = a.files || [];
    }
    if(tidy.to && !tidy.targets){
      const b = await apiJson('nasfiles.php?action=browse&lim=50&dir=' + encodeURIComponent(tidy.to));
      // 정리할 폴더 자신은 옮길 곳에서 뺍니다
      tidy.targets = (b.folders || []).filter(f => f.path !== tidy.from);
    }
  }catch(e){ tidy.error = apiErrText(e); }
  tidy.loading = false; render();
}

/* 파일 이름과 폴더 이름이 얼마나 겹치는지 봐서 알맞은 폴더를 먼저 보여줍니다 */
function tidySuggest(fileName){
  if(!tidy.targets) return [];
  const n = normKey(fileName.replace(/\.[^.]+$/, ''));
  const scored = tidy.targets.map(t => {
    const k = normKey(t.name);
    let score = 0;
    if(k.length >= 2 && n.includes(k)) score = 100 + k.length;
    else if(n.length >= 2 && k.includes(n)) score = 90 + n.length;
    else {
      for(let len = Math.min(k.length, 6); len >= 2; len--){
        for(let i = 0; i + len <= k.length; i++){
          if(n.includes(k.slice(i, i + len))){ score = 50 + len; break; }
        }
        if(score) break;
      }
    }
    return { t:t, score:score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, 3).map(x => x.t);
}

async function tidyMove(path, dest, name){
  if(tidy.busy) return;
  tidy.busy = path; render();
  try{
    await apiJson('nasfiles.php?action=movenas', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ src: path, dest: dest })
    });
    tidy.files = tidy.files.filter(f => f.path !== path);
    tidy.done.unshift({ name: name, dest: dest.split('/').pop() });
    tidy.targets = null;                        // 개수를 다시 세어옵니다
    delete browseCache[tidy.from];
    delete browseCache[tidy.to];
    tidy.busy = null;
    render();
    tidyLoad();
  }catch(e){
    tidy.busy = null; render();
    alert('옮기지 못했습니다.\n\n' + apiErrText(e));
  }
}

        + '<span>📂 ' + (tidy.pick.which === 'from' ? '정리할 폴더' : '옮길 곳') + ' 고르기</span>'
        + '<span style="margin-left:auto"><button class="btn sm" onclick="tidyPickClose()">취소</button></span>'
      + '</div>'
      + '<div class="sec-bar" style="margin:0 0 10px">'

            + '\')">⬆ 위로</button>' : '')
        + (tidy.pick.dir ? '<button class="btn primary" onclick="tidyChoose(\'' + jsq(tidy.pick.dir)

    + '<div class="tidylist">' + rows + '</div>';

/* ---------- 사진 크게 보기 ---------- */
let picView = null;   // {navKey, i}

function picsOf(navKey){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : '';
  const c = browseCache[dir];
  return (c && c.files) ? c.files.filter(x => x.img) : [];
}

function openPic(navKey, i){
  picView = { navKey: navKey, i: i };
  drawPic();
}
function closePic(){
  picView = null;
  const el = document.getElementById('picbox');
  if(el) el.remove();
  document.removeEventListener('keydown', picKey);
}
function stepPic(d){
  if(!picView) return;
  const list = picsOf(picView.navKey);
  if(!list.length) return;
  picView.i = (picView.i + d + list.length) % list.length;
  drawPic();
}
function picKey(e){
  if(e.key === 'Escape') closePic();
  else if(e.key === 'ArrowRight') stepPic(1);
  else if(e.key === 'ArrowLeft')  stepPic(-1);
}

function drawPic(){
  const list = picsOf(picView.navKey);
  const x = list[picView.i];
  if(!x){ closePic(); return; }

  let el = document.getElementById('picbox');
  if(!el){
    el = document.createElement('div');
    el.id = 'picbox';
    el.className = 'picbox';
    el.onclick = ev => { if(ev.target === el) closePic(); };
    document.body.appendChild(el);
    document.addEventListener('keydown', picKey);
  }
  el.innerHTML =
      '<div class="pb-top">'
      + '<span class="pb-nm">' + esc(x.name) + '</span>'
      + '<span class="pb-ct">' + (picView.i + 1) + ' / ' + list.length
        + ' · ' + esc(x.size) + ' · ' + esc(x.date) + '</span>'
      + '<span style="margin-left:auto;display:flex;gap:6px">'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇ 내려받기</a>'
        + '<button class="btn sm" onclick="closePic()">✕ 닫기</button>'
      + '</span></div>'
    + '<button class="pb-nav pb-prev" onclick="stepPic(-1)">‹</button>'
    + '<img class="pb-img" src="nasfiles.php?action=image&path='
      + encodeURIComponent(x.path) + '" alt="' + esc(x.name) + '">'
    + '<button class="pb-nav pb-next" onclick="stepPic(1)">›</button>';
}

async function moreFiles(navKey){
  fileShow[navKey] = (fileShow[navKey] || 30) + 50;
  await ensureFiles(navKey, fileShow[navKey] + 20);
  redraw();
}

function toggleFolder(brandId, path){
  openFolder[brandId] = (openFolder[brandId] === path) ? null : path;
  redraw();
}

function gotoFolder(navKey, dir){
  folderNav[navKey] = dir;
  fileShow[navKey] = 30;
  picShow[navKey]  = 40;
  delete fileOpen[navKey];
  if(!browseCache[dir]) loadBrowse(dir); else redraw();
}

function reloadFolder(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  delete browseCache[dir];
  loadBrowse(dir);
  toast('↻ 다시 불러옵니다');
}

function currentDirOf(navKey, startDir){
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];
  return (c && c.dir) ? c.dir : dir;
}

function crumbHtml(navKey, out, rootOverride){
  const root = rootOverride || out.root || '';
  const dir  = out.dir  || '';
  let rel = (root && dir.indexOf(root) === 0) ? dir.slice(root.length) : dir;
  rel = rel.replace(/^\//, '');
  const parts = rel ? rel.split('/') : [];

  const bits = ['<button class="crumb' + (parts.length ? '' : ' on') + '"'
    + (parts.length ? ' onclick="gotoFolder(\'' + jsq(navKey) + '\',\'' + jsq(root) + '\')"' : '')
    + '>🏠 ' + esc(root.split('/').pop() || '전체') + '</button>'];

  let acc = root;
  parts.forEach((seg, i) => {
    acc += '/' + seg;
    bits.push('<span class="crumbsep">›</span>');
    bits.push(i === parts.length - 1
      ? '<span class="crumb on">' + esc(seg) + '</span>'
      : '<button class="crumb" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
        + jsq(acc) + '\')">' + esc(seg) + '</button>');
  });
  return '<div class="crumbs">' + bits.join('') + '</div>';
}

      + (dir ? '&dir=' + encodeURIComponent(dir) : ''));

    + (pick.tried ? '\n\n찾아본 경로:\n' + esc(pick.tried.join('\n')) : '') + '</div>';

    + '여기를 훑으시려면 아래 버튼을 누르세요.</div>';
  else body = '<div class="fgrid">' + pick.folders.map(f =>
      '<button class="fcard" onclick="loadPicker(\'' + jsq(f.path) + '\')" title="' + esc(f.name) + '">'
      + '<span class="fc-ico">📁</span><span class="fc-t">'
      + '<span class="fc-nm">' + esc(f.name) + '</span></span></button>').join('') + '</div>';

  const here = pick.dir
    ? '<button class="btn primary" onclick="runScan(\'' + jsq(pick.dir) + '\')">'
      + '✅ 여기를 훑기</button>' : '';

  return '<div class="mbox" style="margin-bottom:16px">'
    + '<div class="mh" style="display:flex;align-items:center;gap:6px">'
      + '<span>📂 훑을 폴더 고르기</span>'
      + '<span class="mhs">폴더를 눌러 들어가고, 원하는 곳에서 [여기를 훑기]</span>'
      + '<span style="margin-left:auto"><button class="btn sm" onclick="closePicker()">닫기</button></span>'
    + '</div>'
    + '<div class="sec-bar" style="margin:0 0 10px">' + back + here + '</div>'
    + '<div class="path" style="margin-bottom:8px">'
      + esc(pick.dir || '볼륨을 고르세요') + '</div>'
    + body + '</div>';
}

async function runScan(dir){
  pick = null;
  scanRun = { starting:true };
  render();
  try{
    scanRun = await apiJson('nasfiles.php?action=scanstart&dir=' + encodeURIComponent(dir));
    render();
    scanLoop();
  }catch(e){
    scanRun = null;
    render();
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n') : ''));
  }
}

function startScan(){ openPicker(); }

async function scanLoop(){
  while(scanRun && !scanRun.done){
    let out;
    try{
      out = await apiJson('nasfiles.php?action=scanstep');
    }catch(e){
      scanRun = null; render();
      alert(apiErrText(e)
        + (e['못읽은폴더'] && e['못읽은폴더'].length
            ? '\n\n못 읽은 폴더:\n' + e['못읽은폴더'].slice(0, 10).join('\n') : ''));
      return;
    }
    if(!scanRun) return;           // 도중에 중단한 경우
    scanRun = out;
    render();
  }
  if(scanRun && scanRun.done){
    treeCache = null;
    browseCache2Clear();
    await nasCheck();
    toast('✅ 목록을 다 만들었습니다 — ' + scanRun['찾은파일'].toLocaleString('ko-KR') + '개');
  }
}

function browseCache2Clear(){
  Object.keys(browseCache).forEach(k => { delete browseCache[k]; });
  Object.keys(folderNav).forEach(k => { delete folderNav[k]; });
}

async function cancelScan(){

/* ================= 브랜드 ↔ 폴더 자동 연결 =================
   폴더 이름과 브랜드 이름을 맞춰봐서, 손으로 지정하지 않아도
   각 브랜드 자료 탭에 알맞은 NAS 폴더가 저절로 뜨게 합니다.
   ============================================================ */
let treeCache = null;   // null=아직 | {loading} | {error} | 서버응답

async function loadTree(){
  treeCache = { loading:true };
  try{
    treeCache = await apiJson('nasfiles.php?action=tree&depth=4');
  }catch(e){
    treeCache = { error: apiErrText(e) };
  }
  redraw();
}

/* 이름을 비교하기 좋게 다듬습니다.
   "00. 브랜드 공유폴더" → "브랜드공유폴더", "POUR 솔루션" → "솔루션" */
function normKey(s){
  return String(s).toLowerCase()
    .replace(/[#＃]/g, '')
    .replace(/^[0-9]+[.\-_\s]*/, '')
    .replace(/^[_\-.\s]+/, '')
    .replace(/pour/g, '')
    .replace(/[\s_\-.()\[\]·]/g, '');
}

function nameMatches(brandName, folderName){
  const a = normKey(brandName), b = normKey(folderName);
  if(a.length < 2 || b.length < 2) return false;
  return a === b || a.includes(b) || b.includes(a);
}

/* 이 브랜드에 해당하는 폴더들을 자동으로 골라냅니다.
   - 얕은 폴더를 우선하고, 이미 고른 폴더의 하위는 다시 넣지 않습니다
   - 손으로 연결했거나 숨긴 폴더는 뺍니다 */
function autoFoldersFor(b){
  const t = treeCache;
  if(!t || !t.folders) return [];
  const hidden = b.nasHidden || [];
  const manual = (b.nasFolders || []).map(x => x.path);

  const hits = t.folders.filter(f => nameMatches(b.name, f.name)
    && hidden.indexOf(f.path) < 0 && manual.indexOf(f.path) < 0);
  if(!hits.length) return [];

  // 같은 이름이 여러 단계에 흩어져 있으면, 가장 위쪽 단계만 씁니다.
  // (POUR공법_시방서, POUR공법_카달로그 … 같은 하위 폴더가 수십 개 걸리는 것을 막습니다)
  const minDepth = Math.min.apply(null, hits.map(f => f.depth));

  const out = [];
  hits.filter(f => f.depth === minDepth)
      .sort((x, y) => (y.count || 0) - (x.count || 0))
      .forEach(f => {
        if(out.some(o => f.path.indexOf(o.path + '/') === 0)) return;
        out.push(f);
      });
  return out;
}

/* 어느 폴더가 어느 브랜드에도 안 붙었는지 */
function unmatchedFolders(){
  const t = treeCache;
  if(!t || !t.folders) return [];
  const taken = {};
  data.brands.forEach(b => autoFoldersFor(b).forEach(f => { taken[f.path] = 1; }));
  data.brands.forEach(b => (b.nasFolders || []).forEach(f => { taken[f.path] = 1; }));
  return t.folders.filter(f => f.depth === 1 && !taken[f.path]);
}

function hideAutoFolder(path){
  const b = currentBrand();
  if(!b) return;
  if(!confirm('이 폴더를 "' + b.name + '" 자료에서 숨길까요?\n\n'
    + 'NAS의 실제 파일은 그대로 남습니다.\n\n' + path)) return;
  b.nasHidden = b.nasHidden || [];
  b.nasHidden.push(path);
  markDirty();
  redraw();
}

function unhideAll(){
  const b = currentBrand();
  if(!b || !(b.nasHidden || []).length) return;
  b.nasHidden = [];
  markDirty();
  redraw();
  toast('숨긴 폴더를 다시 보여줍니다');
}

/* 폴더 하나를 화면에 그립니다.
   navKey  : 이 탐색기를 구분하는 이름 ('nas' 또는 연결폴더 id)
   startDir: 처음 보여줄 폴더 (''이면 훑은 폴더 전체) */
function folderBrowserHtml(navKey, startDir, opts){
  opts = opts || {};
  const dir = folderNav[navKey] !== undefined ? folderNav[navKey] : (startDir || '');
  const c = browseCache[dir];

  if(!c){ setTimeout(() => loadBrowse(dir), 10); return '<div class="fmeta">불러오는 중…</div>'; }
  if(c.loading) return '<div class="fmeta">불러오는 중…</div>';
  if(c.error)   return '<div class="fmeta">⚠️ ' + esc(c.error) + '</div>';

  const canUp = c.parent && (!startDir || c.dir !== startDir);
  const tools = '<div class="sec-bar" style="margin:0 0 10px">'
    + (canUp
        ? '<button class="btn sm" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(c.parent) + '\')">⬆ 상위 폴더</button>' : '')
    + '<button class="btn sm" onclick="reloadFolder(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">↻ 새로고침</button>'
    + '<button class="btn sm" onclick="copyDirPath(\'' + jsq(navKey) + '\',\''
      + jsq(startDir || '') + '\')">📋 폴더 경로</button>'
    + (opts.link
        ? '<button class="btn sm" onclick="linkCurrentDir(\'' + jsq(navKey) + '\',\''
          + jsq(startDir || '') + '\')">＋ 브랜드에 연결</button>' : '')
    + '<span class="hint">이 폴더 ' + (c.fileCount || 0).toLocaleString('ko-KR') + '개'
      + ' · 아래 전체 ' + (c.total || 0).toLocaleString('ko-KR') + '개</span>'
    + '</div>';

  const folders = c.folders.length
    ? '<div class="fgrid">' + c.folders.map(f =>
        '<button class="fcard" onclick="gotoFolder(\'' + jsq(navKey) + '\',\''
          + jsq(f.path) + '\')" title="' + esc(f.name) + '">'
        + '<span class="fc-ico">📁</span><span class="fc-t">'
        + '<span class="fc-nm">' + esc(f.name) + '</span>'
        + '<span class="fc-sub">' + f.count.toLocaleString('ko-KR') + '개 · '
          + esc(f.size) + '</span></span></button>').join('') + '</div>'
    : '';

  // 사진과 그 밖의 파일을 나눕니다 — 사진은 눈으로 보고 고르게 합니다
  const pics   = c.files.filter(x => x.img);
  const others = c.files.filter(x => !x.img);

  const picShown = picShow[navKey] || 40;
  const picSlice = pics.slice(0, picShown);
  const picGrid = pics.length
    ? '<div class="picsec">'
      + '<div class="sec-bar" style="margin:0 0 10px">'
        + '<span class="mh" style="margin:0">🖼 사진 ' + pics.length.toLocaleString('ko-KR') + '장</span>'
        + '<span class="hint">누르면 크게 보고, 화살표로 넘길 수 있습니다</span>'
      + '</div>'
      + '<div class="picgrid">' + picSlice.map((x, i) =>
          '<button class="pic" onclick="openPic(\'' + jsq(navKey) + '\',' + i + ')" '
          + 'title="' + esc(x.name) + '">'
          + '<img loading="lazy" src="nasfiles.php?action=thumb&w=320&path='
            + encodeURIComponent(x.path) + '" alt="' + esc(x.name) + '">'
          + '<span class="pic-nm">' + esc(x.name) + '</span></button>').join('')
      + '</div>'
      + ((pics.length > picSlice.length || c.files.length < c.fileCount)
          ? '<div style="margin-top:10px"><button class="btn sm" onclick="morePics(\'' + jsq(navKey)
            + '\')">사진 더 보기 (' + picSlice.length.toLocaleString('ko-KR') + ' / '
            + (c.files.length < c.fileCount ? '약 ' : '')
            + pics.length.toLocaleString('ko-KR') + ')</button></div>' : '')
      + '</div>'
    : '';

  // 사진이 아닌 파일 목록은 접어둡니다. 하위 폴더가 없으면 바로 펼칩니다.
  const fOpen = (fileOpen[navKey] !== undefined) ? fileOpen[navKey] : (!c.folders.length && !pics.length);
  const shown = fileShow[navKey] || 30;
  const slice = others.slice(0, shown);

  const fileHead = others.length
    ? '<button class="fhead" style="border:1px solid var(--border);border-radius:10px;'
      + 'background:var(--bg-secondary)" onclick="toggleFiles(\'' + jsq(navKey) + '\')">'
      + '<span class="fh-ar">' + (fOpen ? '▾' : '▸') + '</span>'
      + '<span class="fh-ic">📄</span>'
      + '<span class="fh-nm">그 밖의 파일</span>'
      + '<span class="fh-ct">' + others.length.toLocaleString('ko-KR') + '개</span>'
      + '</button>'
    : '';

  const files = (others.length && fOpen)
    ? '<div class="mbox" style="margin-top:8px">' + slice.map(x =>
        '<div class="krow" style="align-items:center">'
        + '<span class="fileicon" style="font-size:15px">' + fileIcon(x.name) + '</span>'
        + '<span style="flex:1;min-width:0;white-space:normal;word-break:break-all">'
          + '<b style="color:var(--text-primary)">' + esc(x.name) + '</b></span>'
        + '<span class="fmeta" style="white-space:nowrap;margin:0">'
          + esc(x.size) + ' · ' + esc(x.date) + '</span>'
        + '<a class="btn sm" href="nasfiles.php?action=download&path='
          + encodeURIComponent(x.path) + '">⬇</a>'
        + '</div>').join('')
      + ((others.length > slice.length || c.files.length < c.fileCount)
          ? '<div style="margin-top:10px"><button class="btn sm" onclick="moreFiles(\'' + jsq(navKey)
            + '\')">파일 더 보기 (' + slice.length.toLocaleString('ko-KR') + ' / '
            + (c.files.length < c.fileCount ? '약 ' : '')
            + others.length.toLocaleString('ko-KR') + ')</button></div>' : '')
      + '</div>'
    : '';

  const nothing = (!c.folders.length && !c.files.length)
    ? '<div class="empty">이 폴더에는 파일이 없습니다.</div>' : '';

  return tools + crumbHtml(navKey, c, opts.crumbRoot) + folders
       + picGrid + fileHead + files + nothing;
}

/* NAS 경로를 윈도우 탐색기에 붙여넣을 수 있는 모양으로 복사합니다 */
async function copyText(p){
  const win = toWinPath(p);
  try{
    await navigator.clipboard.writeText(win);
    toast('📋 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

async function copyDirPath(navKey, startDir){
  const win = toWinPath(currentDirOf(navKey, startDir));
  try{
    await navigator.clipboard.writeText(win);
    toast('📁 폴더 경로를 복사했습니다 — 탐색기 주소창에 붙여넣으세요');
  }catch(e){ prompt('아래 폴더 경로를 복사해 탐색기 주소창에 붙여넣으세요', win); }
}

function linkCurrentDir(navKey, startDir){
  const dir = currentDirOf(navKey, startDir);
  if(!data.brands.length){ toast('⚠️ 브랜드가 없습니다'); return; }
  const names = data.brands.map((b, n) => (n + 1) + '. ' + b.name).join('\n');
  const pick = prompt('지금 보고 있는 폴더를 어느 브랜드에 연결할까요?\n\n' + names
    + '\n\n폴더: ' + dir + '\n\n번호를 입력하세요', '1');
  if(pick === null) return;
  const b = data.brands[parseInt(pick, 10) - 1];
  if(!b){ toast('⚠️ 번호가 올바르지 않습니다'); return; }

  b.nasFolders = b.nasFolders || [];
  if(b.nasFolders.some(x => x.path === dir)){ toast('이미 연결된 폴더입니다'); return; }
  b.nasFolders.push({ id: uid('nf'), path: dir, label: dir.split('/').pop(), q: '' });
  markDirty();
  toast('📂 "' + b.name + '" 자료에 연결했습니다');
}

/* 훑을 폴더(목록을 만들 최상위 폴더)를 바꿉니다.
   Y:\... , \\netformrnd\... , /volume1/... 아무 형태나 받습니다. */
async function setScanRoot(){
  const now = (nasState.info && nasState.info['다음에훑을폴더'])
           || (nasState.info && nasState.info['훑은폴더']) || '';
  const v = prompt(
    '파일 목록을 만들 최상위 폴더를 넣어주세요.\n\n'
    + '탐색기 주소창에서 복사한 그대로 붙여넣으셔도 됩니다.\n'
    + '예) Y:\\넷폼알앤디 공유폴더\\마케팅 공유폴더 외장하드 백업\\00. 브랜드 공유폴더\n\n'
    + '바꾼 뒤에는 NAS 작업 스케줄러에서 scan.sh 를 한 번 더 실행해 주세요.', now);
  if(v === null) return;
  if(!v.trim()){ toast('⚠️ 폴더 경로를 넣어주세요'); return; }

  try{
    const out = await apiJson('nasfiles.php?action=setroot', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ dir: v })
    });
    toast('✅ ' + out['훑을폴더'] + ' — 작업 스케줄러에서 scan.sh 를 실행해 주세요');
    nasCheck();
  }catch(e){
    alert(apiErrText(e)
      + (e.tried ? '\n\n이런 경로들을 찾아봤습니다:\n' + e.tried.join('\n')
                 + '\n\n폴더 이름에 띄어쓰기나 점(.)이 있으면 그대로 넣어주세요.' : ''));
  }
}

    + '<button class="btn' + (mode === 'tidy' ? ' primary' : '') + '"'
      + ' onclick="setNasMode(\'tidy\')">🧹 파일 정리</button>'
    + '<button class="btn" onclick="startScan()">🔎 목록 다시 만들기</button>'
    + '<button class="btn" onclick="setScanRoot()">⚙️ 훑을 폴더 바꾸기</button>'
    + '<span class="hint">'
      + (info['파일수'] || 0).toLocaleString('ko-KR') + '개 파일 · 목록 만든 시각 '

      + (info['훑은폴더'] ? ' · ' + esc(info['훑은폴더']) : '')
      + '</span>'
    + '</div>';

  let body;
  if(mode === 'doc'){
    body = docView();
  }else if(mode === 'tidy'){
    body = tidyView();
  }else if(mode === 'browse'){
    body = pickerPanel() + scanPanel() + autoMatchPanel()
           + folderBrowserHtml('nas', '', { link:true });
  }else{
    const bar = '<div class="sec-bar">'
      + '<span class="searchbox" style="flex:1 1 320px"><span class="ico">🔍</span>'
        + '<input type="text" id="nasQ" placeholder="파일 이름이나 폴더 이름으로 찾기 (띄어쓰기로 여러 단어)" '
        + 'value="' + esc(nasState.q) + '" onkeydown="if(event.key===\'Enter\')nasSearch()"></span>'
      + '<select id="nasExt" onchange="nasSearch()">'
        + ['','pdf','xlsx','docx','hwp','pptx','jpg','png','dwg','zip','mp4']
            .map(x => '<option value="' + x + '"' + (nasState.ext === x ? ' selected' : '') + '>'
                    + (x ? x.toUpperCase() : '모든 형식') + '</option>').join('')
      + '</select>'
      + '<button class="btn primary" onclick="nasSearch()">찾기</button>'
      + '</div>';

    let res;
    if(nasState.loading) res = '<div class="empty">찾는 중…</div>';
    else if(nasState.error) res = '<div class="empty">' + esc(nasState.error) + '</div>';
    else if(!nasState.res) res = '<div class="empty">찾을 이름을 입력하고 <b>찾기</b>를 눌러주세요.<br>'
      + '<span style="color:var(--text-muted)">예) 견적서 옥상방수 · 카탈로그 · 계약서</span></div>';
    else if(!nasState.res.results.length)
      res = '<div class="empty">"' + esc(nasState.q) + '" 에 대한 결과가 없습니다.</div>';
    else{
      res = '<div class="fmeta" style="margin-bottom:10px">'
        + nasState.res.matched.toLocaleString('ko-KR') + '개를 찾았습니다'
        + (nasState.res.matched > nasState.res.shown
            ? ' (' + nasState.res.shown + '개만 표시)' : '') + '</div>'
        + '<div class="mbox">' + nasState.res.results.map((f, i) =>
            '<div class="krow" style="flex-direction:column;align-items:stretch;gap:3px">'
            + '<div style="display:flex;gap:8px;align-items:baseline">'
              + '<span class="fileicon" style="font-size:15px">' + fileIcon(f.name) + '</span>'
              + '<b style="color:var(--text-primary);white-space:normal;word-break:break-all">'
                + highlight(f.name, nasState.q.split(/\s+/)[0]) + '</b>'
              + '<span class="fmeta" style="margin-left:auto;white-space:nowrap">'
                + esc(f.size) + ' · ' + esc(f.date) + '</span>'
            + '</div>'
            + '<div class="path" style="word-break:break-all">' + esc(f.dir) + '</div>'
            + '<div class="row" style="margin:2px 0 0">'
              + '<a class="btn sm" href="nasfiles.php?action=download&path='
                + encodeURIComponent(f.path) + '">⬇ 다운로드</a>'
              + '<button class="btn sm" onclick="openInBrowser(' + i + ')">📁 이 폴더 열기</button>'
              + '<button class="btn sm" onclick="linkNasDir(' + i + ')">＋ 브랜드에 연결</button>'
              + '<button class="btn sm" onclick="copyNasPath(' + i + ')">📋 경로</button>'
            + '</div></div>').join('')
        + '</div>';
    }
    body = bar + res;
  }

  document.getElementById('main').innerHTML = '<div class="panel"><div class="tabbody">'
    + head + modeBar + body + '</div></div>';

  if(mode === 'search'){
    const el = document.getElementById('nasQ');
    if(el && nasState.focusSearch){ nasState.focusSearch = false; el.focus(); }
  }
}

/* 어느 폴더가 어느 브랜드로 자동 연결됐는지 보여줍니다.
   기본은 접어두고, 눌렀을 때만 펼칩니다. */
let matchOpen = false;

function toggleMatchPanel(){ matchOpen = !matchOpen; render(); }

function autoMatchPanel(){
  if(treeCache === null){ setTimeout(loadTree, 10); return ''; }
  if(treeCache.loading) return '<div class="fmeta" style="margin-bottom:12px">브랜드 연결을 맞춰보는 중…</div>';
  if(treeCache.error)   return '';

  const per = data.brands.map(b => ({ b:b, auto:autoFoldersFor(b), man:(b.nasFolders || []) }));
  const linked  = per.filter(x => x.auto.length + x.man.length > 0).length;
  const missing = per.filter(x => x.auto.length + x.man.length === 0).map(x => x.b.name);

  const head = '<button class="fhead" onclick="toggleMatchPanel()" '
      + 'style="border-radius:12px">'
    + '<span class="fh-ar">' + (matchOpen ? '▾' : '▸') + '</span>'
    + '<span class="fh-ic">🪄</span>'
    + '<span class="fh-nm">브랜드 자동 연결</span>'
    + '<span class="fh-ct">' + linked + ' / ' + data.brands.length + ' 브랜드 연결됨'
      + (missing.length ? ' · 없음: ' + esc(missing.join(', ')) : '') + '</span>'
    + '</button>';

  if(!matchOpen) return '<div class="flist" style="margin-bottom:16px">' + head + '</div>';

  const rows = per.map(x => {
    const all = x.auto.map(f => ({ name:f.name, count:f.count, auto:true }))
      .concat(x.man.map(f => ({ name:(f.label || f.path.split('/').pop()), count:null, auto:false })));
    return '<div class="krow" style="align-items:flex-start;padding:8px 14px">'
      + '<span style="flex:0 0 130px"><b style="color:var(--text-primary)">'
        + esc(x.b.icon || '') + ' ' + esc(x.b.name) + '</b></span>'
      + '<span style="flex:1;min-width:0;text-align:right">'
        + (all.length
            ? all.map(v => '<span class="chip' + (v.auto ? ' on' : '') + '" '
                + 'style="margin:2px 0 2px 4px">' + (v.auto ? '🪄 ' : '📂 ') + esc(v.name)
                + (v.count !== null ? ' · ' + v.count.toLocaleString('ko-KR') + '개' : '')
                + '</span>').join('')
            : '<span class="fmeta">맞는 폴더 없음</span>')
      + '</span></div>';
  }).join('');

  const un = unmatchedFolders();
  const unHtml = un.length
    ? '<div class="fmeta" style="padding:8px 14px 12px">어느 브랜드에도 안 붙은 폴더 '
      + un.length + '개 — ' + esc(un.slice(0, 12).map(f => f.name).join(' · '))
      + (un.length > 12 ? ' …' : '') + '</div>'
    : '';

  return '<div class="flist" style="margin-bottom:16px">' + head
    + '<div style="border-top:1px solid var(--border)">' + rows + unHtml + '</div></div>';
}

function setNasMode(m){
  nasState.mode = m;
  if(m === 'search') nasState.focusSearch = true;
  render();
}

/* 검색 결과에서 그 파일이 있는 폴더를 탐색기로 열어줍니다 */
function openInBrowser(i){
  const f = nasState.res.results[i];

}

/* 같은 것을 다른 분과 동시에 고쳤을 때 뜨는 띠.
   내 것을 그대로 두되, 상대가 쓴 내용을 볼 수 있게 남겨둡니다. */
function clashBar(b){
  const list = b._conflicts || [];
  if(!list.length) return '';
  return '<div class="clashbar">'
    + '<div class="cb-top">⚠️ <b>같은 것을 다른 분과 같은 시간에 고쳤습니다.</b> '
      + '지금 화면에는 <b>제가 쓴 내용</b>이 남아 있고, '
      + '다른 분이 쓰신 내용은 아래에 그대로 보관해 두었습니다.</div>'
    + list.map(c =>
        '<div class="cb-item">'
        + '<div class="cb-h"><b>' + esc(c['무엇']) + '</b>'
          + '<span class="cb-when">' + esc(new Date(c['시각']).toLocaleString('ko-KR',
              { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })) + '</span>'
          + '<button class="btn sm" onclick="clashCopy(\'' + jsq(c.id) + '\')">📋 복사</button>'
          + '<button class="btn sm danger" onclick="clashDrop(\'' + jsq(c.id) + '\')">확인함</button>'
        + '</div>'
        + '<pre class="cb-body">' + esc(clashText(c['상대내용'])) + '</pre>'
        + '</div>').join('')
    + '</div>';
}

function clashText(v){
  if(typeof v === 'string') return v;
  if(!v || typeof v !== 'object') return String(v);
  return Object.keys(v).filter(k => k !== 'id' && k !== 'updatedAt')
    .map(k => k + ': ' + (typeof v[k] === 'string' ? v[k] : JSON.stringify(v[k])))
    .join('\n');
}

function clashFind(id){
  const b = currentBrand();
  return b && (b._conflicts || []).find(c => c.id === id);
}

function clashCopy(id){
  const c = clashFind(id);
  if(!c) return;
  const t = clashText(c['상대내용']);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(
    () => toast('📋 복사했습니다'), () => toast('⚠️ 복사하지 못했습니다'));
  else toast('⚠️ 이 브라우저는 복사를 지원하지 않습니다');
}

function clashDrop(id){
  const b = currentBrand();
  if(!b) return;
  b._conflicts = (b._conflicts || []).filter(c => c.id !== id);
  markDirty(); render();
}

function renderBrand(){
  const b = currentBrand();

  if(!b){
    renderHome();
    return;
  }
  const counts = {
    automations: autoCount(b),

    assets: b.assets.length,
    tasks: b.tasks.filter(t => t.status !== '완료').length,
    links: b.links.length,
    channels: (b.channels || []).length,
    inquiries: (inquiryCache.byBrand[b.name] || []).length,
