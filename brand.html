<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>넷폼알앤디 브랜드 대시보드</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<!-- 차트 라이브러리. 인터넷이 막힌 사내망에서도 되도록 같은 폴더의 vendor 파일을 먼저 찾고,
     없으면 인터넷(CDN)에서 받아옵니다. vendor 파일이 없으면 콘솔에 404가 뜨지만 정상입니다. -->
<script src="vendor/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg-primary:#f8fafc; --bg-secondary:#ffffff; --bg-card:#ffffff; --bg-card-hover:#f1f5f9;
  --bg-input:#f8fafc; --border:#e2e8f0; --border-light:#cbd5e1;
  --text-primary:#1e293b; --text-secondary:#64748b; --text-muted:#94a3b8;
  --accent-blue:#3b82f6; --accent-cyan:#06b6d4; --accent-green:#22c55e;
  --accent-yellow:#f59e0b; --accent-red:#ef4444; --accent-purple:#8b5cf6;
  --accent-pink:#ec4899; --accent-orange:#f97316;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 6px -1px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);
}
body.dark-mode{
  --bg-primary:#0f172a; --bg-secondary:#1e293b; --bg-card:#1e293b; --bg-card-hover:#334155;
  --bg-input:#0f172a; --border:#334155; --border-light:#475569;
  --text-primary:#f1f5f9; --text-secondary:#cbd5e1; --text-muted:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg-primary);
  color:var(--text-primary);min-height:100vh;line-height:1.6;transition:background .2s,color .2s}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 80px}

/* 상단 바 */
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
  padding:20px 24px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* 저장 위치 배지 */
.store-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:999px;border:1px solid var(--border)}
.store-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-yellow)}
.store-badge.nas .dot{background:var(--accent-green)}
.store-badge.error .dot{background:var(--accent-red)}

/* 버튼 */
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
.btn.primary{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--accent-red);border-color:var(--border)}
.btn.danger:hover{background:rgba(239,68,68,.1)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

/* 툴바 */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);font-weight:600}
select,input[type=text],input[type=number],input[type=month]{
  font-family:inherit;font-size:13px;padding:8px 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)}
select:focus,input:focus{outline:2px solid var(--accent-blue);outline-offset:-1px}
.spacer{flex:1}

/* 섹션 */
.section{margin-bottom:28px}
.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .hint{font-size:12px;font-weight:500;color:var(--text-muted)}

/* 요약 타일 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;box-shadow:var(--shadow-sm)}
.stat .label{font-size:12px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.stat .value{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.stat .delta{font-size:12px;font-weight:600;margin-top:4px;color:var(--text-muted)}
.delta.up{color:var(--accent-green)} .delta.down{color:var(--accent-red)}

/* 브랜드 카드 */
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.brand-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:18px;box-shadow:var(--shadow-sm);transition:.15s;border-top:3px solid var(--accent-blue)}
.brand-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.brand-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  font-size:19px;background:var(--bg-card-hover);flex-shrink:0}
.brand-name{font-size:15px;font-weight:800}
.brand-owner{font-size:12px;color:var(--text-muted)}
.brand-card .card-actions{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.15s}
.brand-card:hover .card-actions{opacity:1}
.metric-row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border)}
.metric-row:last-of-type{border-bottom:none}
.metric-row .m-name{color:var(--text-secondary)}
.metric-row .m-val{font-weight:700}
.progress{margin-top:12px}
.progress .p-top{display:flex;justify-content:space-between;font-size:11px;
  font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.progress .bar{height:7px;border-radius:99px;background:var(--bg-card-hover);overflow:hidden}
.progress .fill{height:100%;border-radius:99px;background:var(--accent-blue);transition:width .4s}

/* 차트 */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:18px;box-shadow:var(--shadow-sm)}
.chart-box h3{font-size:14px;font-weight:700;margin-bottom:12px}
.chart-area{position:relative;height:280px}

/* 입력 표 */
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-sm);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;font-weight:700;color:var(--text-secondary);background:var(--bg-card-hover)}
tr:last-child td{border-bottom:none}
td input{width:110px;text-align:right}
.cell-brand{font-weight:700}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;
  place-items:center;z-index:100;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--bg-card);border-radius:16px;padding:24px;width:100%;max-width:420px;
  box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:16px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);
  margin:12px 0 5px}
.modal input,.modal select{width:100%}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;
  background:var(--text-primary);color:var(--bg-card);padding:12px 22px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200}
.empty{text-align:center;padding:44px 20px;color:var(--text-muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>🎨 브랜드 대시보드</h1>
      <div class="sub" id="subtitle">브랜드별 성과를 한눈에</div>
    </div>
    <div class="top-actions">
      <span class="store-badge" id="storeBadge"><span class="dot"></span><span id="storeText">확인 중</span></span>
      <button class="btn" onclick="toggleDark()">🌙 테마</button>
      <button class="btn" onclick="exportJSON()">📤 내보내기</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📥 가져오기</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
      <button class="btn primary" onclick="saveAll()">💾 저장</button>
    </div>
  </div>

  <div class="toolbar">
    <span class="field">📅 기준 월
      <input type="month" id="monthPicker" onchange="onMonthChange()">
    </span>
    <span class="spacer"></span>
    <button class="btn" onclick="openBrandModal()">＋ 브랜드 추가</button>
    <button class="btn" onclick="openMetricModal()">＋ 지표 추가</button>
  </div>

  <div class="section">
    <div class="section-title">📊 이번 달 요약</div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="section">
    <div class="section-title">🏷️ 브랜드별 현황 <span class="hint">카드에 마우스를 올리면 수정·삭제 버튼이 나옵니다</span></div>
    <div class="brands" id="brands"></div>
  </div>

  <div class="section">
    <div class="section-title">📈 추이 분석</div>
    <div class="charts">
      <div class="chart-box">
        <h3>월별 추이 (최근 6개월)</h3>
        <div class="chart-area"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="chart-box">
        <h3>브랜드 비교 (이번 달)</h3>
        <div class="chart-area"><canvas id="compareChart"></canvas></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">✏️ 데이터 입력 <span class="hint">칸에 숫자를 입력하면 위 화면이 바로 바뀝니다. 다 입력한 뒤 [저장]을 누르세요</span></div>
    <div class="table-wrap"><table id="entryTable"></table></div>
  </div>

</div>

<!-- 브랜드 추가/수정 -->
<div class="modal-bg" id="brandModal" onclick="if(event.target===this)closeModal('brandModal')">
  <div class="modal">
    <h3 id="brandModalTitle">브랜드 추가</h3>
    <label>브랜드명</label><input type="text" id="bName" placeholder="예: 포어(POUR)">
    <label>아이콘 (이모지 1개)</label><input type="text" id="bIcon" placeholder="예: 🧴" maxlength="4">
    <label>담당자</label><input type="text" id="bOwner" placeholder="예: 김담당 매니저">
    <label>대표 색상</label>
    <select id="bColor">
      <option value="#3b82f6">파랑</option><option value="#8b5cf6">보라</option>
      <option value="#22c55e">초록</option><option value="#f59e0b">노랑</option>
      <option value="#ef4444">빨강</option><option value="#ec4899">핑크</option>
      <option value="#06b6d4">청록</option><option value="#f97316">주황</option>
    </select>
    <label>월 목표 (매출 기준, 숫자만)</label><input type="number" id="bTarget" placeholder="예: 5000">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('brandModal')">취소</button>
      <button class="btn primary" onclick="submitBrand()">저장</button>
    </div>
  </div>
</div>

<!-- 지표 추가 -->
<div class="modal-bg" id="metricModal" onclick="if(event.target===this)closeModal('metricModal')">
  <div class="modal">
    <h3>지표 추가</h3>
    <label>지표 이름</label><input type="text" id="mName" placeholder="예: 재구매율">
    <label>단위</label><input type="text" id="mUnit" placeholder="예: %">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('metricModal')">취소</button>
      <button class="btn primary" onclick="submitMetric()">추가</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   저장 위치 설정  ★ NAS 연결 시 여기 한 줄만 바꾸면 됩니다 ★
   'local' = 지금 쓰는 브라우저에만 저장 (다른 PC에서는 안 보임)
   'nas'   = NAS에 저장해서 모두가 같은 데이터를 봄
   ========================================================================= */
const STORAGE_MODE = 'local';

const NAS_API = { load: 'load.php', save: 'save.php' };
const LS_KEY = 'netform_brand_dashboard_v1';

async function storageLoad(){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.load + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('NAS 응답 오류 (' + res.status + ')');
    const text = await res.text();
    return text.trim() ? JSON.parse(text) : null;
  }
  const raw = localStorage.getItem(LS_KEY);
  return raw ? JSON.parse(raw) : null;
}

async function storageSave(data){
  if(STORAGE_MODE === 'nas'){
    const res = await fetch(NAS_API.save, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if(!res.ok) throw new Error('NAS 저장 실패 (' + res.status + ')');
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || 'NAS 저장 실패');
    return;
  }
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}

function setBadge(state, text){
  const el = document.getElementById('storeBadge');
  el.className = 'store-badge' + (state ? ' ' + state : '');
  document.getElementById('storeText').textContent = text;
}

/* ========================= 기본 데이터 ========================= */
const DEFAULT_DATA = {
  brands: [
    { id:'b1', name:'브랜드 A', icon:'🧴', owner:'담당자 미지정', color:'#3b82f6', target:5000 },
    { id:'b2', name:'브랜드 B', icon:'👕', owner:'담당자 미지정', color:'#8b5cf6', target:3000 }
  ],
  metrics: [
    { id:'revenue',   name:'매출',        unit:'만원' },
    { id:'orders',    name:'주문',        unit:'건'   },
    { id:'adcost',    name:'광고비',      unit:'만원' },
    { id:'followers', name:'SNS 팔로워',  unit:'명'   },
    { id:'inquiry',   name:'문의',        unit:'건'   }
  ],
  entries: {},          // entries[brandId][ 'YYYY-MM' ][metricId] = 숫자
  savedAt: null
};

let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
let currentMonth = new Date().toISOString().slice(0,7);
let editingBrandId = null;
let trendChart = null, compareChart = null;

/* ========================= 유틸 ========================= */
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = n => (Number(n) || 0).toLocaleString('ko-KR');

function getVal(brandId, month, metricId){
  return (((data.entries[brandId] || {})[month] || {})[metricId]) || 0;
}
function setVal(brandId, month, metricId, value){
  data.entries[brandId] = data.entries[brandId] || {};
  data.entries[brandId][month] = data.entries[brandId][month] || {};
  data.entries[brandId][month][metricId] = Number(value) || 0;
}
function prevMonth(month, back){
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 - (back || 1), 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0');
}
function sumMonth(month, metricId){
  return data.brands.reduce((acc, b) => acc + getVal(b.id, month, metricId), 0);
}
function metricById(id){ return data.metrics.find(m => m.id === id); }

/* ========================= 렌더링 ========================= */
function renderAll(){
  renderStats();
  renderBrands();
  renderTable();
  renderCharts();
}

function renderStats(){
  const prev = prevMonth(currentMonth, 1);
  const revenue = sumMonth(currentMonth, 'revenue');
  const revenuePrev = sumMonth(prev, 'revenue');
  const orders = sumMonth(currentMonth, 'orders');
  const adcost = sumMonth(currentMonth, 'adcost');
  const roas = adcost > 0 ? (revenue / adcost * 100) : 0;
  const target = data.brands.reduce((a,b) => a + (Number(b.target) || 0), 0);
  const rate = target > 0 ? Math.round(revenue / target * 100) : 0;

  const diff = revenuePrev > 0
    ? Math.round((revenue - revenuePrev) / revenuePrev * 100)
    : null;
  const diffHtml = diff === null
    ? '<div class="delta">전월 데이터 없음</div>'
    : '<div class="delta ' + (diff >= 0 ? 'up' : 'down') + '">' +
      (diff >= 0 ? '▲ ' : '▼ ') + Math.abs(diff) + '% (전월 대비)</div>';

  document.getElementById('stats').innerHTML = [
    { label:'💰 총 매출', value: num(revenue) + ' 만원', extra: diffHtml },
    { label:'🎯 목표 달성률', value: rate + ' %',
      extra:'<div class="delta">목표 ' + num(target) + ' 만원</div>' },
    { label:'🛒 총 주문', value: num(orders) + ' 건',
      extra:'<div class="delta">브랜드 ' + data.brands.length + '개 합계</div>' },
    { label:'📣 ROAS', value: adcost > 0 ? Math.round(roas) + ' %' : '—',
      extra:'<div class="delta">광고비 ' + num(adcost) + ' 만원</div>' }
  ].map(s =>
    '<div class="stat"><div class="label">' + s.label + '</div>' +
    '<div class="value">' + s.value + '</div>' + s.extra + '</div>'
  ).join('');
}

function renderBrands(){
  const box = document.getElementById('brands');
  if(!data.brands.length){
    box.innerHTML = '<div class="empty">아직 브랜드가 없습니다. [＋ 브랜드 추가]를 눌러 시작하세요.</div>';
    return;
  }
  box.innerHTML = data.brands.map(b => {
    const revenue = getVal(b.id, currentMonth, 'revenue');
    const target = Number(b.target) || 0;
    const pct = target > 0 ? Math.min(Math.round(revenue / target * 100), 999) : 0;
    const rows = data.metrics.map(m =>
      '<div class="metric-row"><span class="m-name">' + m.name + '</span>' +
      '<span class="m-val">' + num(getVal(b.id, currentMonth, m.id)) +
      ' <span style="font-weight:500;color:var(--text-muted)">' + m.unit + '</span></span></div>'
    ).join('');
    return '<div class="brand-card" style="border-top-color:' + b.color + '">' +
      '<div class="brand-head">' +
        '<div class="brand-icon">' + (b.icon || '🏷️') + '</div>' +
        '<div><div class="brand-name">' + esc(b.name) + '</div>' +
        '<div class="brand-owner">' + esc(b.owner || '담당자 미지정') + '</div></div>' +
        '<div class="card-actions">' +
          '<button class="btn sm" onclick="openBrandModal(\'' + b.id + '\')">수정</button>' +
          '<button class="btn sm danger" onclick="deleteBrand(\'' + b.id + '\')">삭제</button>' +
        '</div>' +
      '</div>' + rows +
      '<div class="progress"><div class="p-top"><span>월 목표 달성률</span><span>' + pct + '%</span></div>' +
      '<div class="bar"><div class="fill" style="width:' + Math.min(pct,100) + '%;background:' + b.color + '"></div></div></div>' +
    '</div>';
  }).join('');
}

function renderTable(){
  const t = document.getElementById('entryTable');
  if(!data.brands.length){ t.innerHTML = ''; return; }
  const head = '<tr><th>브랜드</th>' +
    data.metrics.map(m =>
      '<th>' + m.name + ' (' + m.unit + ')' +
      (['revenue','orders','adcost','followers','inquiry'].includes(m.id) ? '' :
        ' <button class="btn sm danger" onclick="deleteMetric(\'' + m.id + '\')">×</button>') +
      '</th>').join('') + '</tr>';
  const body = data.brands.map(b =>
    '<tr><td class="cell-brand">' + (b.icon || '') + ' ' + esc(b.name) + '</td>' +
    data.metrics.map(m =>
      '<td><input type="number" value="' + getVal(b.id, currentMonth, m.id) + '" ' +
      'onchange="onCellChange(\'' + b.id + '\',\'' + m.id + '\',this.value)"></td>'
    ).join('') + '</tr>'
  ).join('');
  t.innerHTML = head + body;
}

function renderCharts(){
  if(typeof Chart === 'undefined'){
    // 인터넷이 차단된 환경에서 차트 라이브러리를 못 받아온 경우
    document.querySelectorAll('.chart-area').forEach(el => {
      el.innerHTML = '<div class="empty">📉 차트 라이브러리를 불러오지 못했습니다.<br>' +
        '설치 안내서의 <b>「인터넷 없는 사내망에서 차트 보이게 하기」</b> 항목을 참고하세요.<br>' +
        '(표와 요약 숫자는 정상 동작합니다)</div>';
    });
    return;
  }
  const months = [5,4,3,2,1,0].map(i => prevMonth(currentMonth, i));
  const labels = months.map(m => m.slice(5) + '월');

  if(trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type:'line',
    data:{ labels, datasets: data.brands.map(b => ({
      label: b.name,
      data: months.map(m => getVal(b.id, m, 'revenue')),
      borderColor: b.color, backgroundColor: b.color + '22',
      tension:.35, fill:true, pointRadius:3
    }))},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } } },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v => num(v) } } } }
  });

  if(compareChart) compareChart.destroy();
  compareChart = new Chart(document.getElementById('compareChart'), {
    type:'bar',
    data:{ labels: data.brands.map(b => b.name),
      datasets:[{ data: data.brands.map(b => getVal(b.id, currentMonth, 'revenue')),
        backgroundColor: data.brands.map(b => b.color), borderRadius:8 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v => num(v) } } } }
  });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========================= 이벤트 ========================= */
function onCellChange(brandId, metricId, value){
  setVal(brandId, currentMonth, metricId, value);
  renderStats(); renderBrands(); renderCharts();
}

function onMonthChange(){
  currentMonth = document.getElementById('monthPicker').value || currentMonth;
  renderAll();
}

function openBrandModal(id){
  editingBrandId = id || null;
  const b = id ? data.brands.find(x => x.id === id) : null;
  document.getElementById('brandModalTitle').textContent = b ? '브랜드 수정' : '브랜드 추가';
  document.getElementById('bName').value   = b ? b.name : '';
  document.getElementById('bIcon').value   = b ? (b.icon || '') : '';
  document.getElementById('bOwner').value  = b ? (b.owner || '') : '';
  document.getElementById('bColor').value  = b ? b.color : '#3b82f6';
  document.getElementById('bTarget').value = b ? (b.target || '') : '';
  document.getElementById('brandModal').classList.add('open');
}

function submitBrand(){
  const name = document.getElementById('bName').value.trim();
  if(!name){ toast('⚠️ 브랜드명을 입력해 주세요'); return; }
  const payload = {
    name,
    icon:  document.getElementById('bIcon').value.trim() || '🏷️',
    owner: document.getElementById('bOwner').value.trim(),
    color: document.getElementById('bColor').value,
    target: Number(document.getElementById('bTarget').value) || 0
  };
  if(editingBrandId){
    Object.assign(data.brands.find(b => b.id === editingBrandId), payload);
  }else{
    data.brands.push(Object.assign({ id: uid('b') }, payload));
  }
  closeModal('brandModal'); renderAll();
  toast('✅ 브랜드가 반영되었습니다. [저장]을 눌러야 보관됩니다');
}

function deleteBrand(id){
  const b = data.brands.find(x => x.id === id);
  if(!confirm('"' + b.name + '" 브랜드와 입력된 모든 수치를 삭제할까요?')) return;
  data.brands = data.brands.filter(x => x.id !== id);
  delete data.entries[id];
  renderAll(); toast('🗑️ 삭제했습니다. [저장]을 눌러야 반영됩니다');
}

function openMetricModal(){
  document.getElementById('mName').value = '';
  document.getElementById('mUnit').value = '';
  document.getElementById('metricModal').classList.add('open');
}

function submitMetric(){
  const name = document.getElementById('mName').value.trim();
  if(!name){ toast('⚠️ 지표 이름을 입력해 주세요'); return; }
  data.metrics.push({ id: uid('m'), name, unit: document.getElementById('mUnit').value.trim() || '' });
  closeModal('metricModal'); renderAll();
  toast('✅ 지표를 추가했습니다');
}

function deleteMetric(id){
  const m = metricById(id);
  if(!confirm('"' + m.name + '" 지표를 삭제할까요?')) return;
  data.metrics = data.metrics.filter(x => x.id !== id);
  Object.values(data.entries).forEach(byMonth =>
    Object.values(byMonth).forEach(vals => delete vals[id]));
  renderAll(); toast('🗑️ 지표를 삭제했습니다');
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ========================= 저장 / 불러오기 ========================= */
async function saveAll(){
  data.savedAt = new Date().toISOString();
  try{
    await storageSave(data);
    toast(STORAGE_MODE === 'nas' ? '✅ NAS에 저장되었습니다' : '✅ 저장되었습니다 (이 브라우저)');
    updateSubtitle();
  }catch(e){
    localStorage.setItem(LS_KEY, JSON.stringify(data));   // 안전망
    setBadge('error', 'NAS 저장 실패 — 임시로 이 브라우저에 보관');
    toast('⚠️ ' + e.message + ' — 데이터는 이 브라우저에 임시 저장했습니다');
  }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '브랜드대시보드_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('📤 파일로 내보냈습니다');
}

function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.brands || !parsed.metrics) throw new Error('형식이 맞지 않습니다');
      if(!confirm('현재 화면의 데이터를 파일 내용으로 덮어씁니다. 계속할까요?')) return;
      data = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
      data.entries = data.entries || {};
      renderAll(); toast('📥 불러왔습니다. [저장]을 눌러 보관하세요');
    }catch(e){ toast('⚠️ 파일을 읽을 수 없습니다: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function updateSubtitle(){
  const when = data.savedAt
    ? new Date(data.savedAt).toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' })
    : '아직 저장 안 됨';
  document.getElementById('subtitle').textContent = '브랜드별 성과를 한눈에 · 마지막 저장: ' + when;
}

function toggleDark(){
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('brandDarkMode', document.body.classList.contains('dark-mode'));
  renderCharts();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2800);
}

/* ========================= 시작 ========================= */
async function init(){
  if(localStorage.getItem('brandDarkMode') === 'true') document.body.classList.add('dark-mode');
  document.getElementById('monthPicker').value = currentMonth;

  try{
    const loaded = await storageLoad();
    if(loaded && loaded.brands) data = Object.assign(data, loaded);
    setBadge(STORAGE_MODE === 'nas' ? 'nas' : '',
      STORAGE_MODE === 'nas' ? 'NAS 공유 저장' : '이 브라우저에만 저장');
  }catch(e){
    const raw = localStorage.getItem(LS_KEY);
    if(raw) data = Object.assign(data, JSON.parse(raw));
    setBadge('error', 'NAS 연결 실패 — 이 브라우저 데이터 표시 중');
  }

  data.entries = data.entries || {};
  updateSubtitle();
  renderAll();
}
init();
</script>
