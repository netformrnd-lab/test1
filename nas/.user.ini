; 브랜드 허브 — PHP 업로드/처리 한도 (PHP-FPM 이 이 폴더의 PHP 에 적용)
;
; 왜: 허브 자료(brand-data.php)가 14MB+ 로 커져서, 저장할 때 그 큰 JSON 을
;     통째로 올립니다. 서버 기본 한도(흔히 8M)에 걸리면 save.php 가 본문을
;     못 받아 「저장 실패」 가 납니다. 넉넉히 올려 둡니다.
; 반영: PHP-FPM 이 .user.ini 를 최대 5분(user_ini.cache_ttl)마다 다시 읽습니다.
;       바로 반영하려면 DSM 에서 웹서비스(또는 PHP-FPM)를 재시작하세요.

post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 512M
max_input_time = 180
max_execution_time = 180
