<?xml version="1.0" encoding="UTF-8"?>
<!--
  POUR공법 현수막 (Banner)
  실제 인쇄 치수: 2300mm x 1600mm
  viewBox 1 unit = 1mm  →  실측 사이즈로 출력됩니다.
  색상/문구/연락처는 모두 텍스트로 되어 있어 자유롭게 수정 가능합니다.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="2300mm" height="1600mm"
     viewBox="0 0 2300 1600"
     font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">

  <!-- ===== 색상 정의 ===== -->
  <defs>
    <linearGradient id="redBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B92121"/>
      <stop offset="1" stop-color="#9C1818"/>
    </linearGradient>
    <linearGradient id="navyBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234A5E"/>
      <stop offset="1" stop-color="#1C3C4E"/>
    </linearGradient>
  </defs>

  <!-- ===== 배경 ===== -->
  <rect x="0" y="0" width="2300" height="1600" fill="#FBFAF6"/>
  <rect x="22" y="22" width="2256" height="1556" fill="none" stroke="#1C3C4E" stroke-width="6"/>
  <rect x="38" y="38" width="2224" height="1524" fill="none" stroke="#EE7D17" stroke-width="3"/>

  <!-- ===== 모서리/가장자리 그로멧(아일릿) ===== -->
  <g fill="#FFFFFF" stroke="#9AA3A8" stroke-width="3">
    <circle cx="60"   cy="60"   r="17"/>
    <circle cx="1150" cy="60"   r="17"/>
    <circle cx="2240" cy="60"   r="17"/>
    <circle cx="60"   cy="800"  r="17"/>
    <circle cx="2240" cy="800"  r="17"/>
    <circle cx="60"   cy="1540" r="17"/>
    <circle cx="1150" cy="1540" r="17"/>
    <circle cx="2240" cy="1540" r="17"/>
  </g>

  <!-- ============================================================ -->
  <!-- 1) 헤더 : 로고 + 브랜드명                                      -->
  <!-- ============================================================ -->

  <!-- POUR 로고 (스카이라인 막대 + POUR 텍스트) -->
  <g transform="translate(120,120)">
    <!-- 주황 스카이라인 막대 -->
    <g fill="#EE7D17">
      <rect x="0"   y="110" width="38" height="120"/>
      <rect x="50"  y="60"  width="38" height="170"/>
      <rect x="100" y="30"  width="38" height="200"/>
      <rect x="150" y="80"  width="38" height="150"/>
      <rect x="200" y="0"   width="38" height="230"/>
      <rect x="250" y="55"  width="38" height="175"/>
      <rect x="300" y="100" width="38" height="130"/>
      <rect x="350" y="40"  width="38" height="190"/>
      <rect x="400" y="90"  width="38" height="140"/>
    </g>
    <!-- POUR 워드마크 -->
    <text x="0" y="350" font-size="160" font-weight="800" fill="#1C3C4E" letter-spacing="4">POUR</text>
  </g>

  <!-- 브랜드명 / 인증 -->
  <text x="720" y="200" font-size="150" font-weight="800" fill="#1C3C4E"><tspan fill="#EE7D17">POUR</tspan> 공법</text>
  <text x="724" y="285" font-size="60" font-weight="700" fill="#1C3C4E">(주)넷폼알앤디 · NETFORM R&amp;D</text>
  <text x="724" y="355" font-size="42" font-weight="600" fill="#6B7378">국내 최초 건설신기술 제1026호 보유 ㅣ 경사지붕 방수·보강기술</text>

  <line x1="120" y1="450" x2="2180" y2="450" stroke="#D8D2C4" stroke-width="3"/>

  <!-- ============================================================ -->
  <!-- 2) 인증 / 실적 PILL                                           -->
  <!-- ============================================================ -->
  <g font-size="48" font-weight="700" text-anchor="middle">
    <rect x="270"  y="490" width="560" height="92" rx="46" fill="#FFFFFF" stroke="#1C3C4E" stroke-width="4"/>
    <text x="550"  y="552" fill="#1C3C4E">건설신기술 인증업체</text>

    <rect x="870"  y="490" width="560" height="92" rx="46" fill="#FFFFFF" stroke="#1C3C4E" stroke-width="4"/>
    <text x="1150" y="552" fill="#1C3C4E">전국 210만 세대 시공</text>

    <rect x="1470" y="490" width="560" height="92" rx="46" fill="#FFFFFF" stroke="#1C3C4E" stroke-width="4"/>
    <text x="1750" y="552" fill="#1C3C4E">250+ 협력 파트너사</text>
  </g>

  <!-- ============================================================ -->
  <!-- 3) 슬로건 밴드                                                -->
  <!-- ============================================================ -->
  <rect x="60" y="620" width="2180" height="150" fill="url(#redBand)"/>
  <text x="1150" y="722" font-size="74" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    “쉽고 오래가는 건축물 유지보수의 기준, POUR”
  </text>

  <!-- ============================================================ -->
  <!-- 4) 메인 서비스                                                -->
  <!-- ============================================================ -->
  <text x="1150" y="888" font-size="62" font-weight="800" text-anchor="middle" fill="#1C3C4E">방수 · 도장 · 보수/보강 · 토목 <tspan fill="#EE7D17">일체 원스톱 책임시공</tspan></text>

  <!-- 세부 공법 -->
  <text x="1150" y="972" font-size="40" font-weight="600" text-anchor="middle" fill="#3A4348">우레탄 방수  |  PVC 방수  |  금속기와 방수  |  아스팔트슁글 방수  |  에폭시 도장  |  균열보수 · 구조보강</text>

  <!-- ============================================================ -->
  <!-- 5) 하단 : 업무분야 + 문의처                                    -->
  <!-- ============================================================ -->

  <!-- 좌측 : 업무분야 -->
  <rect x="60" y="1030" width="1340" height="490" rx="12" fill="#EDEAE2" stroke="#CFC8B8" stroke-width="3"/>
  <text x="730" y="1108" font-size="56" font-weight="800" text-anchor="middle" fill="#1C3C4E">[ 업무분야 ]</text>
  <g font-size="46" font-weight="600" fill="#2A3236">
    <text x="120" y="1200">• 건축물 옥상 / 경사지붕 방수공법</text>
    <text x="120" y="1275">• 공동주택(아파트) 방수 · 도장 · 보수</text>
    <text x="120" y="1350">• 균열보수 및 구조보강 공사</text>
    <text x="120" y="1425">• 에폭시 / 우레탄 바닥재 시공</text>
    <text x="120" y="1500">• 그 외 건축물 유지보수 일체</text>
  </g>

  <!-- 우측 : 본사 / 문의처 -->
  <rect x="1440" y="1030" width="800" height="490" rx="12" fill="url(#navyBox)"/>
  <rect x="1440" y="1030" width="800" height="86" rx="12" fill="#EE7D17"/>
  <rect x="1440" y="1075" width="800" height="41" fill="#EE7D17"/>
  <text x="1840" y="1092" font-size="50" font-weight="800" text-anchor="middle" fill="#FFFFFF">본사 / 문의처</text>

  <g fill="#FFFFFF">
    <text x="1480" y="1205" font-size="40" font-weight="600">본사 : 주소를 입력하세요 (수정란)</text>
    <text x="1480" y="1300" font-size="40" font-weight="600">홈페이지 : www.pour1.net</text>
    <text x="1480" y="1395" font-size="44" font-weight="700" fill="#FFD8A8">상담전화</text>
    <text x="1480" y="1470" font-size="78" font-weight="800" fill="#FFFFFF">1600-0000</text>
  </g>

</svg>
