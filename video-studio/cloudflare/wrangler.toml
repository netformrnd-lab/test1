# 영상 제작 작업실 — Cloudflare Workers (무료 플랜) 배포 설정
# 배포는 GitHub Actions(deploy-studio-cf.yml)가 합니다. main 은 빌드 결과(worker.js)입니다.
name = "video-studio"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SUPABASE_URL = "https://gndktayoicegyqyllybk.supabase.co"
# PUBLIC_BASE 는 배포 때 계정의 workers.dev 주소로 채움
